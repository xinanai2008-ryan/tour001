 三次", "C. 四次", "D. 五次"], "answer": "C", "explain": "天安门广场经历多次改扩建，通常概括为四次重大改扩建：1950年代、1958—1959年、1976—1977年、1999年。", "source": "新中国成立后，天安门广场经历了多次（通常概括为四次重大）改扩建……", "layer": "ext"}, {"section": "中轴线", "type": "single", "q": "永定门内\"中轴历史道路遗存\"经考古揭示出自唐幽州至近现代依次叠压的道路共（ ）条。", "options": ["A. 5条", "B. 6条", "C. 7条", "D. 9条"], "answer": "C", "explain": "考古揭示自唐幽州、辽南京、金中都、元大都、明、清至近现代7条道路依次叠压，编号L1—L7。", "source": "揭示出自唐幽州、辽南京、金中都、元大都、明、清至近现代 7 条道路依次叠压（编号为 L1—L7）。", "layer": "ext"}, {"section": "中轴线", "type": "single", "q": "永定门城楼被拆除的年代是（ ）。", "options": ["A. 1957年", "B. 1958年", "C. 1966年", "D. 1976年"], "answer": "B", "explain": "永定门城楼于1958年拆除，箭楼于1957年拆除，2004—2005年城楼依据旧貌复建。", "source": "永定门城楼于 1958 年拆除，永定门箭楼于 1957 年拆除。", "layer": "ext"}, {"section": "中轴线", "type": "single", "q": "正阳门（元称丽正门）改名正阳门并南移至今址的时间是（ ）。", "options": ["A. 元至元九年（1272年）", "B. 明永乐十七年（1419年）", "C. 明正统四年（1439年）", "D. 明嘉靖三十二年（1553年）"], "answer": "B", "explain": "正阳门于明永乐十七年（1419年）改名并南移至今址；明正统四年（1439年）增筑瓮城、箭楼及东西闸楼。", "source": "正阳门（元称丽正门）于明永乐十七年（1419 年）改名正阳门并南移至今址。", "layer": "ext"}, {"section": "中轴线", "type": "single", "q": "先农坛现为（ ）所在地。", "options": ["A. 中国国家博物馆", "B. 故宫博物院", "C. 北京古代建筑博物馆", "D. 首都博物馆"], "answer": "C", "explain": "先农坛为北京古代建筑博物馆所在，建筑群包括庆成宫、太岁殿、宰牲亭、观耕台等。", "source": "先农坛（北京古代建筑博物馆所在）建筑群主要包括庆成宫、太岁殿……等。", "layer": "ext"}, {"section": "中轴线", "type": "single", "q": "先农坛宰牲亭的屋顶建筑规制为（ ）。", "options": ["A. 重檐庑殿顶", "B. 重檐歇山顶", "C. 重檐悬山顶", "D. 单檐硬山顶"], "answer": "C", "explain": "先农坛宰牲亭为重檐悬山顶，是国内现存唯一的明代重檐悬山顶建筑孤例。", "source": "先农坛宰牲亭为重檐悬山顶，是国内现存唯一的明代重檐悬山顶建筑孤例。", "layer": "ext"}, {"section": "中轴线", "type": "single", "q": "天桥一带成为老北京最著名的平民游乐与市集区、达到鼎盛的时期是（ ）。", "options": ["A. 明永乐年间", "B. 清乾隆年间", "C. 清同治年间", "D. 民国初年（1910年代前后）"], "answer": "D", "explain": "天桥自清末同治、光绪年间逐渐聚集民间艺人与商贩，至民国初年（1910年代前后）达到鼎盛。", "source": "至民国初年（1910 年代前后）达到鼎盛，成为老北京最著名的平民游乐与市集区。", "layer": "ext"}, {"section": "中轴线", "type": "single", "q": "明清北京四重城中，以平民居住、商业为主且含天坛、先农坛的是（ ）。", "options": ["A. 宫城", "B. 皇城", "C. 内城", "D. 外城"], "answer": "D", "explain": "外城位于内城南面，以平民居住、商业（天桥、前门外大栅栏）为主，含天坛、先农坛。", "source": "4. 外城——位于内城南面，以平民居住、商业（天桥、前门外大栅栏）为主，含天坛、先农坛。", "layer": "ext"}, {"section": "中轴线", "type": "single", "q": "社稷坛的祭祀对象是（ ）。", "options": ["A. 天神", "B. 祖先", "C. 土神、谷神", "D. 农神（先农）"], "answer": "C", "explain": "社稷坛祭土神、谷神，象征江山社稷，位于天安门西侧。", "source": "4. 社稷坛——祭土神、谷神（象征江山社稷，位于天安门西侧）。", "layer": "ext"}, {"section": "中轴线", "type": "single", "q": "景山作为北京中轴线上的制高点，同时是宫城北面的（ ）。", "options": ["A. 军事瞭望台", "B. 借景与风水屏障", "C. 皇家祭坛", "D. 报时中心"], "answer": "B", "explain": "景山（特别是景山万春亭一带）是中轴线上的几何与景观制高点，也是宫城北面的借景与风水屏障。", "source": "景山（特别是景山万春亭一带）是北京中轴线上的几何与景观制高点，也是宫城北面的借景与风水屏障。", "layer": "ext"}, {"section": "恭王府", "layer": "core", "type": "single", "q": "称恭王府为\"一座恭王府，半部清代史\"的学者是？", "options": ["A.侯仁之", "B.李东阳", "C.张大千", "D.溥心畬"], "answer": "A", "explain": "侯仁之称恭王府为\"一座恭王府，半部清代史\"。", "source": "称恭王府为\"一座恭王府，半部清代史\"的学者：侯仁之"}, {"section": "恭王府", "layer": "core", "type": "judge", "q": "恭王府是国内唯一对公众开放的完整清代王府。", "answer": "对", "explain": "恭王府是国内唯一对公众开放的完整清代王府。", "source": "国内唯一对公众开放的完整清代王府：恭王府"}, {"section": "恭王府", "layer": "core", "type": "multi", "q": "关于恭王府的位置与布局，下列说法正确的有？", "options": ["A.位于西城区前海西街17号", "B.地处什刹海西岸", "C.布局为前府后园（府邸+花园）", "D.府邸分中、东、西三路", "E.位于后海北岸"], "answer": "ABCD", "explain": "恭王府位于西城区前海西街17号、什刹海西岸，前府后园，府邸分中东西三路；后海北岸是醇亲王府。", "source": "西城区前海西街17号、什刹海西岸；府邸+花园（前府后园）、府邸分中东西三路"}, {"section": "恭王府", "layer": "core", "type": "single", "q": "恭王府因何人于1852年迁入而得名？", "options": ["A.庆亲王永璘", "B.恭亲王奕訢", "C.和珅", "D.丰绅殷德"], "answer": "B", "explain": "恭王府因恭亲王奕訢得名，他于1852年迁入。", "source": "因恭亲王奕訢得名（1852年迁入）"}, {"section": "恭王府", "layer": "core", "type": "judge", "q": "恭王府于2010年被评为国家5A级旅游景区。", "answer": "错", "explain": "恭王府被评为国家5A级景区的时间是2012年，不是2010年。", "source": "国家5A级景区评定时间：2012年"}, {"section": "恭王府", "layer": "core", "type": "single", "q": "恭王府花园的正式名称是？", "options": ["A.静心斋", "B.濠濮间", "C.萃锦园", "D.画舫斋"], "answer": "C", "explain": "恭王府花园的正式名称为萃锦园；静心斋、濠濮间、画舫斋均为北海园中园。", "source": "恭王府花园的正式名称：萃锦园"}, {"section": "恭王府", "layer": "core", "type": "judge", "q": "恭王府占地约6.1万平方米，其中府邸约28860平方米、花园约32260平方米。", "answer": "错", "explain": "府邸与花园面积颠倒了：府邸约32260平方米，花园约28860平方米。", "source": "占地约6.1万平方米（府邸约32260㎡、花园约28860㎡）"}, {"section": "恭王府", "layer": "core", "type": "multi", "q": "下列属于恭王府核心建筑的有？", "options": ["A.银安殿", "B.嘉乐堂", "C.锡晋斋", "D.多福轩", "E.静心斋"], "answer": "ABCD", "explain": "核心建筑包括银安殿、嘉乐堂、锡晋斋、多福轩、后罩楼、西洋门、福字碑、大戏楼；静心斋是北海园中园。", "source": "核心建筑：银安殿、嘉乐堂、锡晋斋、多福轩、后罩楼、西洋门、福字碑、大戏楼"}, {"section": "恭王府", "layer": "core", "type": "single", "q": "嘉庆四年（1799年）和珅被赐死抄家后，其宅第被赐予谁？", "options": ["A.恭亲王奕訢", "B.固伦和孝公主", "C.荣寿固伦公主", "D.庆亲王永璘"], "answer": "D", "explain": "和珅赐死抄家后，宅第被赐予嘉庆帝同母弟庆亲王永璘，故称庆王府。", "source": "嘉庆四年（1799年）和珅赐死抄家后赐同母弟永璘"}, {"section": "恭王府", "layer": "core", "type": "judge", "q": "恭王府最早由和珅于1776年始建。", "answer": "对", "explain": "恭王府由和珅于1776年始建，后历经庆亲王永璘、恭亲王奕訢。", "source": "和珅（1776年始建）→庆亲王永璘→恭亲王奕訢（1852年）"}, {"section": "恭王府", "layer": "core", "type": "single", "q": "曾在恭王府居住的书画名家并称\"南张北溥\"，指的是？", "options": ["A.张大千、溥心畬", "B.张伯驹、溥心畬", "C.张大千、张伯驹", "D.张伯驹、启骧"], "answer": "A", "explain": "\"南张北溥\"指张大千与溥心畬。", "source": "\"南张北溥\"所指：张大千、溥心畬"}, {"section": "恭王府", "layer": "core", "type": "judge", "q": "1861年3月1日，总理各国事务衙门在恭王府成立。", "answer": "对", "explain": "1861年3月1日成立的政府机构是总理各国事务衙门。", "source": "1861年3月1日成立的政府机构：总理各国事务衙门"}, {"section": "恭王府", "layer": "core", "type": "multi", "q": "丰绅殷德之妻、乾隆最幼之女固伦和孝公主曾居恭王府。曾居恭王府的两位最高等级公主是？", "options": ["A.固伦和孝公主", "B.荣寿固伦公主", "C.孝圣皇太后", "D.慈禧太后"], "answer": "AB", "explain": "两位最高等级公主为固伦和孝公主与荣寿固伦公主；固伦和孝公主是丰绅殷德之妻、乾隆最幼之女。", "source": "丰绅殷德之妻出身：固伦和孝公主、乾隆最幼之女；两位最高等级公主：固伦和孝公主、荣寿固伦公主"}, {"section": "恭王府", "layer": "core", "type": "single", "q": "恭亲王奕訢病逝后，停灵于府中何处？", "options": ["A.嘉乐堂", "B.银安殿", "C.锡晋斋", "D.多福轩"], "answer": "B", "explain": "奕訢停灵位置为银安殿。", "source": "奕訢停灵位置：银安殿"}, {"section": "恭王府", "layer": "core", "type": "judge", "q": "明代大学士李东阳曾称恭王府一带为\"城中第一佳山水\"，乾隆、嘉庆、道光、咸丰、同治、光绪六位皇帝曾亲临恭王府。", "answer": "对", "explain": "\"城中第一佳山水\"出自明代大学士李东阳；亲临恭王府的皇帝共六位。", "source": "\"城中第一佳山水\"的明代大学士：李东阳；乾隆、嘉庆、道光、咸丰、同治、光绪共六位"}, {"section": "恭王府", "layer": "core", "type": "single", "q": "1937年购置恭王府用作女生部的单位是？", "options": ["A.总理各国事务衙门", "B.醇亲王府", "C.辅仁大学", "D.庆亲王府"], "answer": "C", "explain": "民国时期，1937年辅仁大学购置恭王府作女生部。", "source": "民国时期恭王府归属单位：1937年辅仁大学购置作女生部"}, {"section": "恭王府", "layer": "core", "type": "judge", "q": "恭王府大门的门钉为横九竖七、共63枚。", "answer": "错", "explain": "恭王府大门门钉为横七竖九、共63枚；皇宫门钉为81枚，注意区分。", "source": "门钉数量：横七竖九、63枚（勿混：63枚、非皇宫81枚）"}, {"section": "恭王府", "layer": "core", "type": "multi", "q": "关于恭王府西洋门与独乐峰，下列说法正确的有？", "options": ["A.西洋门为西洋拱券式石拱门", "B.以汉白玉砌成，是园内唯一西式建筑", "C.外侧题额为\"静含太古\"", "D.独乐峰为北太湖石、高约5米，起影壁遮挡作用", "E.独乐峰高约15米"], "answer": "ABCD", "explain": "西洋门为西洋拱券式石拱门、汉白玉砌、园内唯一西式建筑，外题\"静含太古\"、内题\"秀挹恒春\"；独乐峰为北太湖石，高约5米，起影壁遮挡作用。", "source": "西洋拱券式石拱门、汉白玉砌、园内唯一西式建筑；外\"静含太古\"；北太湖石高约5米、起影壁遮挡作用"}, {"section": "恭王府", "layer": "core", "type": "single", "q": "位于后海北岸的\"铁帽子\"王府是？", "options": ["A.恭王府", "B.庆王府", "C.萃锦园", "D.醇亲王府（北府）"], "answer": "D", "explain": "后海北岸的\"铁帽子\"王府是醇亲王府（北府），恭王府位于前海西街。", "source": "后海北岸\"铁帽子\"王府：醇亲王府（北府）"}, {"section": "恭王府", "layer": "core", "type": "judge", "q": "恭王府西洋门外侧题额为\"秀挹恒春\"，内侧题额为\"静含太古\"。", "answer": "错", "explain": "内外题额颠倒了：外侧为\"静含太古\"，内侧为\"秀挹恒春\"。", "source": "题额文字：外\"静含太古\"、内\"秀挹恒春\""}, {"section": "恭王府", "layer": "core", "type": "single", "q": "恭王府后罩楼实测房间数约为？", "options": ["A.108间", "B.99间", "C.189间", "D.63间"], "answer": "A", "explain": "后罩楼长约189米，俗称\"99间半\"，实测约108间。", "source": "长约189米两层长楼、\"99间半\"、实测约108间"}, {"section": "恭王府", "layer": "core", "type": "judge", "q": "恭王府花园中的龙王庙供奉的是西海龙王。", "answer": "错", "explain": "龙王庙供奉的是东海龙王，不是西海龙王。", "source": "龙王庙供奉的龙王：东海龙王"}, {"section": "恭王府", "layer": "core", "type": "multi", "q": "关于恭王府流杯亭（沁秋亭），下列说法正确的有？", "options": ["A.地面图案东西看为篆体\"水\"字", "B.南北看为\"寿\"字", "C.故又称\"水寿亭\"", "D.体现\"曲水流觞\"之趣", "E.位于府邸中路"], "answer": "ABCD", "explain": "沁秋亭地面图案东西看为篆体\"水\"字、南北看为\"寿\"字，称水寿亭，寓曲水流觞之趣。", "source": "东西看篆体\"水\"字、南北看\"寿\"字（水寿亭、曲水流觞）"}, {"section": "恭王府", "layer": "core", "type": "single", "q": "恭王府中用于满族萨满教祭祀（祭祖祭神）、被称为\"神殿\"的建筑是？", "options": ["A.银安殿", "B.嘉乐堂", "C.龙王庙", "D.多福轩"], "answer": "B", "explain": "嘉乐堂是满族萨满教祭祀（祭祖祭神）之所，被称为\"神殿\"。", "source": "嘉乐堂的作用：满族萨满教祭祀（祭祖祭神）；被称为\"神殿\"的建筑：嘉乐堂"}, {"section": "恭王府", "layer": "core", "type": "single", "q": "锡晋斋仿故宫哪座建筑而建，因逾制成为和珅的罪证之一？", "options": ["A.乾隆花园禊赏亭", "B.中南海流水音亭", "C.宁寿宫乐寿堂", "D.潭柘寺猗玕亭"], "answer": "C", "explain": "锡晋斋仿宁寿宫（乐寿堂）而建，逾制成为和珅罪证。", "source": "锡晋斋仿宁寿宫（乐寿堂）、逾制成和珅罪证"}, {"section": "恭王府", "layer": "core", "type": "multi", "q": "关于秘云洞康熙御笔福字碑，下列说法正确的有？", "options": ["A.为康熙皇帝御笔", "B.蕴含\"多子、多才、多田、多寿、多福\"之意", "C.被誉为\"天下第一福\"", "D.是恭王府镇府之宝、国家一级文物", "E.为乾隆皇帝御笔"], "answer": "ABCD", "explain": "福字碑为康熙御笔，含多子多才多田多寿多福之意，称\"天下第一福\"，是镇府之宝、国家一级文物。", "source": "秘云洞康熙御笔福字碑：多子多才多田多寿多福、\"天下第一福\"、镇府之宝（国家一级文物）"}, {"section": "恭王府", "layer": "core", "type": "single", "q": "收藏《平复帖》并于1956年无偿捐献给国家的是？", "options": ["A.张大千", "B.溥心畬", "C.启骧", "D.张伯驹"], "answer": "D", "explain": "《平复帖》由张伯驹收藏，1956年无偿捐献。", "source": "《平复帖》收藏并捐献者：张伯驹、1956年无偿捐献"}, {"section": "恭王府", "layer": "core", "type": "single", "q": "\"棣华轩\"匾额为咸丰皇帝御书；多福轩屋顶彩画以玉兰、海棠、牡丹组成，合称为什么？", "options": ["A.\"玉堂富贵\"", "B.\"四季平安\"", "C.\"富贵白头\"", "D.\"锦上添花\""], "answer": "A", "explain": "玉兰、海棠、牡丹合称\"玉堂富贵\"；棣华轩为咸丰御书匾额。", "source": "\"棣华轩\"名称由来：咸丰御书匾额；玉兰、海棠、牡丹合称\"玉堂富贵\""}, {"section": "恭王府", "layer": "core", "type": "multi", "q": "恭王府\"三绝\"为西洋门、大戏楼、后罩楼。关于大戏楼，下列说法正确的有？", "options": ["A.建于同治年间", "B.约685平方米", "C.三卷勾连搭全封闭式结构、未用一根铁钉，是中国现存最大全封闭清代戏楼", "D.室内彩绘缠枝藤萝（紫藤架下看戏），戏台匾额为\"赏心乐事\"", "E.建于顺治年间"], "answer": "ABCD", "explain": "大戏楼建于同治年间，约685平方米，三卷勾连搭全封闭式、未用一根铁钉，是中国现存最大全封闭清代戏楼；室内彩绘缠枝藤萝，匾\"赏心乐事\"。", "source": "同治年间建、约685平方米、三卷勾连搭全封闭式、未用一根铁钉、中国现存最大全封闭清代戏楼；缠枝藤萝、匾\"赏心乐事\""}, {"section": "恭王府", "layer": "core", "type": "single", "q": "花园内\"曲径通幽\"石刻由启骧题写；\"榆关\"的象征意义是？", "options": ["A.居庸关的别称，象征拱卫京城", "B.山海关的别称，缅怀关外满洲祖先、不忘故土", "C.嘉峪关的别称，象征西域门户", "D.山海关的别称，象征军事防御功能"], "answer": "B", "explain": "\"榆关\"是山海关的别称，意在缅怀关外满洲祖先、不忘故土；\"曲径通幽\"石刻题写者为启骧。", "source": "\"曲径通幽\"石刻题写者：启骧；\"榆关\"的象征意义：山海关别称、缅怀关外满洲祖先不忘故土"}, {"section": "恭王府", "layer": "core", "type": "single", "q": "西洋门内的水池名为蝠池，\"蝠\"谐音\"福\"，池周植榆树，榆钱落入池中，\"蝠\"与\"余\"合为什么？", "options": ["A.\"福寿\"", "B.\"吉庆\"", "C.\"富余\"", "D.\"有余\""], "answer": "C", "explain": "蝠池四周植榆树，榆钱落池，蝠与余合为\"富余\"。", "source": "蝠池（蝠谐音福）；榆树、榆钱落池、蝠+余合为\"富余\""}, {"section": "恭王府", "layer": "core", "type": "single", "q": "北京四座著名流杯亭包括恭王府沁秋亭、中南海流水音亭、故宫乾隆花园禊赏亭和哪一座？", "options": ["A.北海濠濮间", "B.中海瀛秀园", "C.故宫宁寿宫", "D.潭柘寺猗玕亭"], "answer": "D", "explain": "北京四座著名流杯亭：恭王府沁秋亭、中南海流水音亭、故宫乾隆花园禊赏亭、潭柘寺猗玕亭。", "source": "北京四座著名流杯亭：恭王府沁秋亭、中南海流水音亭、故宫乾隆花园禊赏亭、潭柘寺猗玕亭"}, {"section": "恭王府", "type": "single", "q": "称恭王府为“一座恭王府，半部清代史”的著名学者是（　）。", "options": ["A. 侯仁之", "B. 郭沫若", "C. 启骧", "D. 张伯驹"], "answer": "A", "explain": "此说出自著名历史地理学家侯仁之。", "source": "称恭王府为“一座恭王府，半部清代史”的著名学者是侯仁之（著名历史地理学家）。", "layer": "ext"}, {"section": "恭王府", "type": "judge", "q": "称恭王府为“一座恭王府，半部清代史”的著名学者是历史地理学家侯仁之。", "answer": "对", "explain": "与原文一致：侯仁之，著名历史地理学家。", "source": "称恭王府为“一座恭王府，半部清代史”的著名学者是侯仁之（著名历史地理学家）。", "layer": "ext"}, {"section": "恭王府", "type": "multi", "q": "恭王府的历任主人包括（　）。", "options": ["A. 和珅", "B. 庆亲王永璘", "C. 恭亲王奕訢", "D. 醇亲王奕譞"], "answer": "ABC", "explain": "历任主人为和珅、庆亲王永璘、恭亲王奕訢；醇亲王奕譞的府邸在后海北沿，非恭王府主人。", "source": "和珅（乾隆朝权臣，宅第始建于乾隆四十一年，1776年）为其最初主人；庆亲王永璘……称“庆王府”；恭亲王奕訢……始称“恭王府”。", "layer": "ext"}, {"section": "恭王府", "type": "single", "q": "恭王府的名称由来是（　）。", "options": ["A. 因和珅而得名", "B. 因庆亲王永璘而得名", "C. 因恭亲王奕訢而得名", "D. 因醇亲王而得名"], "answer": "C", "explain": "因恭亲王奕訢而得名，此前曾为和珅宅第、庆王府。", "source": "名称由来：因恭亲王奕訢而得名。咸丰二年（1852年），奕訢迁入此宅，自此该宅第称为“恭王府”。此前它曾为和珅宅第、庆王府。", "layer": "ext"}, {"section": "恭王府", "type": "judge", "q": "恭王府于2012年被评定为国家5A级旅游景区，是目前国内唯一对公众开放的完整的清代王府建筑群。", "answer": "对", "explain": "与原文一致：2012年评为5A，国内唯一对公众开放的完整清代王府。", "source": "恭王府于2012年被评定为国家5A级旅游景区……恭王府是目前国内唯一对公众开放的完整的清代王府建筑群", "layer": "ext"}, {"section": "恭王府", "type": "single", "q": "奕訢迁入此宅、该宅第始称“恭王府”是在（　）。", "options": ["A. 乾隆四十一年（1776年）", "B. 嘉庆四年（1799年）", "C. 咸丰二年（1852年）", "D. 光绪二十四年（1898年）"], "answer": "C", "explain": "咸丰二年（1852 乐道堂）与荣寿固伦公主（恭亲王奕訢长女）；固伦公主为清代公主最高等级封号。", "source": "曾居恭王府的两位清朝最高等级公主：固伦和孝公主（乾隆女，居东路乐道堂）与荣寿固伦公主（恭亲王奕訢长女）。固伦公主为清代公主最高等级封号。", "layer": "ext"}, {"section": "北海", "layer": "core", "type": "single", "q": "北海在金代的名称是？", "options": ["A.瑶屿行宫", "B.大宁离宫", "C.万岁山", "D.西苑"], "answer": "B", "explain": "辽称\"瑶屿行宫\"、金称\"大宁离宫\"、元称\"万寿山（万岁山）\"\"太液池\"、明称\"西苑\"、清称\"北海\"。", "source": "辽\"瑶屿行宫\"、金\"大宁离宫\"、元\"万寿山（万岁山）\"\"太液池\"、明\"西苑\"、清\"北海\""}, {"section": "北海", "layer": "core", "type": "judge", "q": "北海地区在历史上曾是永定河（古高梁河）的故道。", "answer": "对", "explain": "北海地区在历史上曾是永定河（古高梁河）故道。", "source": "永定河（古高梁河）故道"}, {"section": "北海", "layer": "core", "type": "multi", "q": "北海作为皇家园林在不同历史时期的名称包括？", "options": ["A.辽代\"瑶屿行宫\"", "B.金代\"大宁离宫\"", "C.元代\"万寿山（万岁山）\"\"太液池\"", "D.明代\"西苑\"", "E.清代\"西苑\""], "answer": "ABCD", "explain": "辽\"瑶屿行宫\"、金\"大宁离宫\"、元\"万寿山（万岁山）\"\"太液池\"、明\"西苑\"、清\"北海\"；清代称北海而非西苑。", "source": "辽\"瑶屿行宫\"、金\"大宁离宫\"、元\"万寿山（万岁山）\"\"太液池\"、明\"西苑\"、清\"北海\""}, {"section": "北海", "layer": "core", "type": "single", "q": "北海在明代的名称是？", "options": ["A.太液池", "B.大宁离宫", "C.西苑", "D.瑶屿行宫"], "answer": "C", "explain": "明代称\"西苑\"；太液池为元代名称，大宁离宫为金代，瑶屿行宫为辽代，清代称\"北海\"。", "source": "明\"西苑\"、清\"北海\""}, {"section": "北海", "layer": "core", "type": "judge", "q": "金代营建的皇家离宫大宁离宫（太宁宫）建于金世宗大定三年至十九年（1163—1179年）。", "answer": "对", "explain": "大宁离宫（太宁宫）为金世宗大定三年至十九年（1163—1179年）建。", "source": "大宁离宫（太宁宫）、金世宗大定三年至十九年（1163—1179年）建"}, {"section": "北海", "layer": "core", "type": "single", "q": "\"燕京八景\"中的\"琼岛春阴\"位于北海琼华岛，\"太液秋风\"位于何处？", "options": ["A.中海水云榭", "B.北海琼华岛", "C.中海瀛秀园", "D.北海画舫斋"], "answer": "A", "explain": "太液秋风位于中海水云榭，琼岛春阴位于北海琼华岛，三海区域共此2景。", "source": "琼岛春阴（北海琼华岛）、太液秋风（中海水云榭）"}, {"section": "北海", "layer": "core", "type": "judge", "q": "\"燕京八景\"中位于三海区域的共有3景。", "answer": "错", "explain": "\"燕京八景\"在三海区域共2景：琼岛春阴（北海琼华岛）、太液秋风（中海水云榭）。", "source": "共2景；琼岛春阴（北海琼华岛）、太液秋风（中海水云榭）"}, {"section": "北海", "layer": "core", "type": "multi", "q": "关于北海公园内的园中园，下列说法正确的有？", "options": ["A.静心斋俗称\"乾隆小花园\"", "B.园中园包括静心斋、濠濮间、画舫斋、小西天（极乐世界）", "C.以文人写意著称者首推静心斋、濠濮间、画舫斋", "D.小西天即极乐世界", "E.画舫斋是皇家佛堂"], "answer": "ABCD", "explain": "园中园为静心斋（乾隆小花园）、濠濮间、画舫斋、小西天（极乐世界）；文人写意首推静心斋、濠濮间、画舫斋；皇家佛堂是西天梵境。", "source": "静心斋（乾隆小花园）、濠濮间、画舫斋、小西天（极乐世界）；文人写意著称首推静心斋、濠濮间、画舫斋"}, {"section": "北海", "layer": "core", "type": "single", "q": "连接南岸与琼华岛的永安桥（又称堆云积翠桥、太液桥），其两端牌楼的形制是？", "options": ["A.四柱五楼石牌坊", "B.二柱一楼木牌坊", "C.六柱五楼石牌坊", "D.四柱三楼木牌坊"], "answer": "D", "explain": "永安桥两端牌楼为四柱三楼木牌坊，南题\"积翠\"、北题\"堆云\"。", "source": "永安桥（堆云积翠桥、太液桥）；四柱三楼木牌坊"}, {"section": "北海", "layer": "core", "type": "judge", "q": "连接南岸与琼华岛的永安桥，南牌楼题\"堆云\"，北牌楼题\"积翠\"。", "answer": "错", "explain": "南北牌楼题额颠倒了：南牌楼\"积翠\"、北牌楼\"堆云\"。", "source": "南牌楼\"积翠\"、北牌楼\"堆云\""}, {"section": "北海", "layer": "core", "type": "single", "q": "建于顺治八年（1651年）的北海白塔高多少米？", "options": ["A.35.9米", "B.25.9米", "C.39.5米", "D.45.9米"], "answer": "A", "explain": "北海白塔建于顺治八年（1651年），高35.9米。", "source": "顺治八年（1651年）建；高35.9米"}, {"section": "北海", "layer": "core", "type": "judge", "q": "北海白塔为藏式覆钵式（喇嘛塔），上圆下方，由塔基、塔身、相轮、华盖、塔刹五部分组成。", "answer": "对", "explain": "白塔为藏式覆钵式（喇嘛塔）、上圆下方，由塔基、塔身、相轮、华盖、塔刹五部分组成。", "source": "藏式覆钵式（喇嘛塔）、上圆下方；塔基、塔身、相轮、华盖、塔刹五部分"}, {"section": "北海", "layer": "core", "type": "multi", "q": "关于琼华岛上的永安寺，下列说法正确的有？", "options": ["A.顺治八年（1651年）建白塔寺", "B.乾隆六年（1741年）改称永安寺", "C.主要殿宇有山门、法轮殿、正觉殿、普安殿、善因殿", "D.普安殿主尊宗喀巴，为格鲁派（黄教）创始人，两侧为其两大弟子贾曹杰与克珠杰", "E.普安殿两侧坐像为达赖与班禅"], "answer": "ABCD", "explain": "永安寺顺治八年建白塔寺、乾隆六年改称；殿宇为山门、法轮殿、正觉殿、普安殿、善因殿；普安殿主尊宗喀巴创格鲁派（黄教），两侧为贾曹杰与克珠杰（达赖、班禅法脉之源），并非达赖、班禅本人。", "source": "顺治八年（1651年）建白塔寺、乾隆六年（1741年）改称永安寺；宗喀巴；格鲁派（黄教）；贾曹杰与克珠杰（达赖、班禅法脉之源）"}, {"section": "北海", "layer": "core", "type": "single", "q": "关于阅古楼《三希堂石渠宝笈法帖》石刻，下列说法正确的是？", "options": ["A.阅古楼建于顺治八年，石刻共340方", "B.阅古楼建于乾隆十八年（1753年），石刻495方，收录自魏晋至明末135位书法家的340件作品，含王羲之《快雪时晴帖》、王献之《中秋帖》、王珣《伯远帖》", "C.石刻收录495位书法家的135件作品", "D.\"三希\"法帖为《快雪时晴帖》《中秋帖》《平复帖》"], "answer": "B", "explain": "阅古楼乾隆十八年（1753年）建，石刻495方、135位书法家340件；\"三希\"为王羲之《快雪时晴帖》、王献之《中秋帖》、王珣《伯远帖》。", "source": "乾隆十八年（1753年）建楼；495方、自魏晋至明末135位书法家340件；王羲之《快雪时晴帖》、王献之《中秋帖》、王珣《伯远帖》"}, {"section": "北海", "layer": "core", "type": "judge", "q": "团城上的古油松被乾隆皇帝册封为\"白袍将军\"。", "answer": "错", "explain": "古油松封\"遮荫侯\"，白皮松封\"白袍将军\"，二者不可混淆。", "source": "乾隆皇帝；古油松封\"遮荫侯\"、白皮松封\"白袍将军\""}, {"section": "北海", "layer": "core", "type": "single", "q": "北海北岸景点由东向西依次是？", "options": ["A.静心斋→九龙壁→西天梵境→阐福寺→铁影壁", "B.阐福寺→铁影壁→九龙壁→西天梵境→静心斋", "C.静心斋→西天梵境→九龙壁→铁影壁→阐福寺", "D.西天梵境→静心斋→九龙壁→阐福寺→铁影壁"], "answer": "C", "explain": "北岸由东向西依次为：静心斋→西天梵境→九龙壁→铁影壁→阐福寺。", "source": "北岸由东向西：静心斋→西天梵境→九龙壁→铁影壁→阐福寺"}, {"section": "北海", "layer": "core", "type": "judge", "q": "静心斋原名镜清斋，俗称\"乾隆小花园\"，曾为太子读书处。", "answer": "对", "explain": "静心斋原名镜清斋，俗称\"乾隆小花园\"，用途为太子读书处。", "source": "镜清斋；\"乾隆小花园\"；太子读书处"}, {"section": "北海", "layer": "core", "type": "multi", "q": "关于北海五龙亭，下列说法正确的有？", "options": ["A.是帝后垂钓、赏月、观烟火之所", "B.中间为龙泽亭", "C.两侧分别为澄祥、滋香、涌瑞、浮翠四亭", "D.位于北岸", "E.中间为浮翠亭"], "answer": "ABCD", "explain": "五龙亭为帝后垂钓赏月观烟火之所，中为龙泽亭，两侧为澄祥、滋香、涌瑞、浮翠。", "source": "帝后垂钓赏月观烟火、中为龙泽亭、两侧澄祥、滋香、涌瑞、浮翠"}, {"section": "北海", "layer": "core", "type": "single", "q": "团城上被乾隆皇帝封为\"遮荫侯\"的是？", "options": ["A.白皮松", "B.古柏", "C.银杏", "D.古油松"], "answer": "D", "explain": "古油松封\"遮荫侯\"，白皮松封\"白袍将军\"，均为乾隆皇帝册封。", "source": "古油松封\"遮荫侯\"、白皮松封\"白袍将军\""}, {"section": "北海", "layer": "core", "type": "judge", "q": "北海白塔高39.5米。", "answer": "错", "explain": "北海白塔高35.9米，不是39.5米。", "source": "高35.9米"}, {"section": "北海", "layer": "core", "type": "single", "q": "关于濠濮间，下列说法正确的是？", "options": ["A.建于乾隆二十二年（1757年），由乾隆皇帝命名，名称出自《庄子》\"濠梁之辩\"与濮水垂钓之典（濠濮间想）", "B.由慈禧太后命名，出自《论语》", "C.由光绪皇帝命名，出自《孟子》", "D.建于乾隆二十一年，由金世宗命名"], "answer": "A", "explain": "濠濮间建于乾隆二十二年（1757年），乾隆皇帝命名，出自《庄子》\"濠梁之辩\"、濮水垂钓。", "source": "乾隆二十二年（1757年）；乾隆皇帝；《庄子》\"濠梁之辩\"、濮水垂钓（濠濮间想）"}, {"section": "北海", "layer": "core", "type": "judge", "q": "北海西天梵境为皇家佛堂，明代始建称'大西天禅林'，清乾隆三十五年（1770年）重修改今名，是皇室礼佛之所。", "answer": "错", "explain": "重修并改今名的时间应为清乾隆二十四年（1759年），而非乾隆三十五年（1770年）；1770年是极乐世界（小西天）为庆祝孝圣皇太后八十寿辰建成的时间，二者不可混淆。", "source": "西天梵境……明代始建称'大西天禅林'，清乾隆二十四年（1759年）重修改今名；极乐世界（小西天）清乾隆三十五年（1770年）建成，为庆祝乾隆生母孝圣皇太后八十寿辰而建。", "patch": true}, {"section": "北海", "layer": "core", "type": "multi", "q": "关于北岸的澄观堂、铁影壁等景点，下列说法正确的有？", "options": ["A.澄观堂建于乾隆十一年（1746年）", "B.其楠木大殿为快雪堂", "C.三进院落为澄观堂→浴兰轩→快雪堂", "D.铁影壁为元代遗物，由中性火山岩制成，色泽酷似铸铁", "E.西天梵境为道教宫观"], "answer": "ABCD", "explain": "澄观堂乾隆十一年（1746年）建，楠木大殿为快雪堂，三进院落澄观堂→浴兰轩→快雪堂；铁影壁为元代、中性火山岩、色泽酷似铸铁；西天梵境是皇家佛堂（藏传佛教寺院），非道教宫观。", "source": "乾隆十一年（1746年）、楠木大殿为快雪堂、三进院落澄观堂→浴兰轩→快雪堂；元代、中性火山岩、色泽酷似铸铁；皇家佛堂（藏传佛教寺院）"}, {"section": "北海", "layer": "core", "type": "single", "q": "关于画舫斋，下列说法正确的是？", "options": ["A.是清代的皇家佛堂", "B.建于乾隆二十二年（1757年），是乾隆读书休憩赏画避暑的行宫，慈禧常来此游幸听评书，光绪与翁同龢曾居此读书", "C.曾为太子读书处", "D.是帝后垂钓赏月观烟火之所"], "answer": "B", "explain": "画舫斋建于乾隆二十二年（1757年），为乾隆读书休憩赏画避暑的行宫；慈禧常游幸听评书；光绪与翁同龢曾居此读书。", "source": "乾隆二十二年（1757年）；乾隆读书休憩赏画避暑的行宫、慈禧常游幸听评书、光绪与翁同龢曾居此读书"}, {"section": "北海", "layer": "core", "type": "single", "q": "慈禧乘小火车到静心斋用膳，其起点是？", "options": ["A.中海水云榭", "B.北海团城", "C.中海瀛秀园门（紫光阁旁）", "D.西天梵境"], "answer": "C", "explain": "慈禧乘小火车用膳的起点为中海瀛秀园门（紫光阁旁）。", "source": "慈禧乘小火车用膳的起点：中海瀛秀园门（紫光阁旁）"}, {"section": "北海", "layer": "core", "type": "single", "q": "静心斋正殿镜清斋取\"明镜止水、鉴照心性\"之意；静心斋始建于？", "options": ["A.乾隆二十二年（1757年）", "B.乾隆十一年（1746年）", "C.乾隆三十五年（1770年）", "D.乾隆二十一年（1756年）"], "answer": "D", "explain": "静心斋乾隆二十一年（1756年）始建，正殿镜清斋寓意明镜止水、鉴照心性。", "source": "乾隆二十一年（1756年）始建；正殿镜清斋（明镜止水、鉴照心性）"}, {"section": "北海", "layer": "core", "type": "single", "q": "乾隆三十五年（1770年）为孝圣皇太后八十寿辰而建、由乾隆御笔\"极乐世界\"匾额的极乐世界（小西天），其主殿是？", "options": ["A.中国最大的方亭式宫殿", "B.藏式覆钵式塔", "C.楠木大殿", "D.三卷勾连搭戏楼"], "answer": "A", "explain": "极乐世界乾隆三十五年（1770年）为孝圣皇太后八十寿辰而建，俗称\"小西天\"，主殿是中国最大方亭式宫殿，乾隆御笔\"极乐世界\"。", "source": "乾隆三十五年（1770年）为孝圣皇太后八十寿辰而建、\"小西天\"、中国最大方亭式宫殿、乾隆御笔\"极乐世界\""}, {"section": "北海", "layer": "core", "type": "single", "q": "北海公园西天梵境的用途是（ ）。", "options": ["A. 皇家佛堂（藏传佛教寺院），用于供奉佛像、举办法事、翻译经文", "B. 帝后及近臣垂钓、赏月、观看烟火之处", "C. 太子读书之处，后乾隆亦常来养性", "D. 帝后至阐福寺礼佛时沐浴、更衣、用膳、休息的行宫"], "answer": "A", "explain": "西天梵境为皇家佛堂（藏传佛教寺院），是皇室礼佛之所。B项为五龙亭的用途，C项为静心斋的用途，D项为澄观堂的用途，均为北岸相邻景区的不同功能。", "source": "西天梵境的用途：为皇家佛堂（藏传佛教寺院），明代始建称'大西天禅林'，清乾隆二十四年（1759年）重修改今名，用于供奉佛像、举办法事、翻译经文，是皇室礼佛之所。", "patch": true}, {"section": "北海", "type": "single", "q": "元代时，北海琼华岛被赐名为（　）。", "options": ["A. 万寿山（万岁山）", "B. 瑶屿", "C. 大宁离宫", "D. 景山"], "answer": "A", "explain": "元代琼华岛赐名“万寿山（万岁山）”，水域称“太液池”。瑶屿为辽代名称，大宁离宫为金代离宫，景山为清代另一处山体之名。", "source": "元代：琼华岛赐名“万寿山（万岁山）”，水域称“太液池”", "layer": "ext"}, {"section": "北海", "type": "judge", "q": "北海地区在历史上原为永定河（古高梁河）的故道。", "answer": "对", "explain": "原文明确北海地区在历史上原为永定河（古高梁河）的故道，河道南迁后经辽、金引水营建逐渐形成湖泊园林。", "source": "北海地区在历史上原为永定河（古高梁河）的故道。永定河河道自然南迁后，留下一片原野与池塘（洼地积水），后历经辽、金引水营建，逐渐形成湖泊园林。", "layer": "ext"}, {"section": "北海", "type": "multi", "q": "下列属于北海公园内“园中园”的有（　）。", "options": ["A. 静心斋", "B. 濠濮间", "C. 画舫斋", "D. 小西天（极乐世界）", "E. 绮望楼"], "answer": "ABCD", "explain": "静心斋、濠濮间、画舫斋、小西天均为北海园内“园中园”；绮望楼是景山正南山脚下的建筑，不属于北海。", "source": "北海公园内的主要“园中园”（独立成景的袖珍园林）包括：静心斋……濠濮间（东岸）；画舫斋（东岸，又称水殿）；小西天（极乐世界）（北岸，宗教性园中园）", "layer": "ext"}, {"section": "北海", "type": "single", "q": "“燕京八景”中位于北京三海（北海、中海、南海）区域的共有（　）。", "options": ["A. 一景", "B. 两景", "C. 三景", "D. 四景"], "answer": "B", "explain": "位于三海区域的共两景：北海的琼岛春阴与中海的太液秋风，南海无燕京八景入选。", "source": "“燕京八景”中位于北京三海（北海、中海、南海）区域的共有两景：1. 琼岛春阴——在北海琼华岛……2. 太液秋风——在中海东岸水云榭", "layer": "ext"}, {"section": "北海", "type": "judge", "q": "金世宗营建大宁离宫的时间是大定三年至十九年，即1063—1079年。", "answer": "错", "explain": "年代有误，应为1163—1179年，而非1063—1079年。", "source": "金代营建的皇家离宫：大宁离宫（太宁宫），金世宗大定三年至十九年（1163—1179 年）以瑶屿（琼华岛）为中心修建，是金代皇家离宫，基本奠定今日北海格局。", "layer": "ext"}, {"section": "北海", "type": "single", "q": "连接北海公园南岸与琼华岛的石桥是（　）。", "options": ["A. 金水桥", "B. 永安桥", "C. 卢沟桥", "D. 银锭桥"], "answer": "B", "explain": "连接南岸（团城/园前门）与琼华岛的石桥为永安桥，又称“堆云积翠桥”“太液桥”。", "source": "连接南岸（团城/园前门）与琼华岛的石桥为永安桥（又称“堆云积翠桥”“太液桥”），始建于元代", "layer": "ext"}, {"section": "北海", "type": "judge", "q": "北海永安桥始建于明代，乾隆八年（1743年）改建为三孔拱券石桥。", "answer": "错", "explain": "始建朝代有误，永安桥始建于元代，而非明代；乾隆八年改建为三孔拱券石桥无误。", "source": "连接南岸（团城/园前门）与琼华岛的石桥为永安桥（又称“堆云积翠桥”“太液桥”），始建于元代，乾隆八年（1743 年）改建为三孔拱券石桥。", "layer": "ext"}, {"section": "北海", "type": "multi", "q": "按资料中的“五部分”概括法，北海白塔的组成部分包括（　）。", "options": ["A. 塔基", "B. 塔身", "C. 相轮", "D. 华盖", "E. 塔顶"], "answer": "ABCD", "explain": "五部分为塔基、塔身、相轮（十三天）、华盖（宝盖）、塔刹（鎏金宝珠）。E项“塔顶”表述有误，应为“塔刹”。", "source": "组成部分：由塔基（十字折角须弥座）、塔身（覆钵/宝瓶）、相轮（十三天）、华盖（宝盖，饰日月火焰）、塔刹（鎏金宝珠）五部分组成", "layer": "ext"}, {"section": "北海", "type": "single", "q": "北海永安寺始建于（　）。", "options": ["A. 清顺治八年（1651年）", "B. 清乾隆六年（1741年）", "C. 清乾隆八年（1743年）", "D. 清顺治十二年（1655年）"], "answer": "A", "explain": "永安寺始建于清顺治八年（1651年），初名白塔寺；乾隆六年（1741年）改称永安寺。", "source": "始建年代：清顺治八年（1651 年），因西藏喇嘛恼木汗请求，在广寒殿废址上建藏式白塔并建“白塔寺”；乾隆六年（1741 年）改称永安寺。", "layer": "ext"}, {"section": "北海", "type": "judge", "q": "北海白塔高35.9米，塔基边长约18.2米，塔肚最大直径约14米。", "answer": "对", "explain": "与原文数据完全一致：塔高35.9米，塔基边长约18.2米，塔肚最大直径约14米。", "source": "关键数据：塔高 35.9 米，塔基边长约 18.2 米，塔肚最大直径约 14 米，是北海的标志与全园最高点。", "layer": "ext"}, {"section": "北海", "type": "single", "q": "北海永安寺普安殿内供奉的主尊宗喀巴，其所创教派是（　）。", "options": ["A. 宁玛派", "B. 萨迦派", "C. 格鲁派（黄教）", "D. 噶举派"], "answer": "C", "explain": "普安殿内主尊为藏传佛教格鲁派（黄教）创始人宗喀巴像，宗喀巴所创教派为藏传佛教格鲁派（黄教）。", "source": "普安殿内供奉：主尊为藏传佛教格鲁派（黄教）创始人宗喀巴像；宗喀巴所创教派为藏传佛教格鲁派（黄教）", "layer": "ext"}, {"section": "北海", "type": "judge", "q": "北海团城上的古油松被康熙皇帝册封为“遮荫侯”。", "answer": "错", "explain": "册封者有误，应为清乾隆皇帝，而非康熙皇帝。", "source": "团城上有金代油松与白皮松等古树，其中古油松被乾隆皇帝册封为“遮荫侯”（爵名“侯”）……另有白皮松被封为“白袍将军”。", "layer": "ext"}, {"section": "北海", "type": "multi", "q": "北海阅古楼所藏《三希堂石渠宝笈法帖》中的“三希”包括（　）。", "options": ["A. 王羲之《快雪时晴帖》", "B. 王献之《中秋帖》", "C. 王珣《伯远帖》", "D. 《快雪堂法帖》"], "answer": "ABC", "explain": "“三希”指王羲之《快雪时晴帖》、王献之《中秋帖》、王珣《伯远帖》；《快雪堂法帖》为北海快雪堂所藏法帖石刻，不属“三希”。", "source": "收录自魏晋至明末 135 位书法家、340 件（帖）作品（涵盖王羲之《快雪时晴帖》、王献之《中秋帖》、王珣《伯远帖》“三希”及历代名家墨迹）", "layer": "ext"}, {"section": "北海", "type": "single", "q": "北海白塔的建筑形制为（　）。", "options": ["A. 楼阁式塔", "B. 密檐式塔", "C. 藏式覆钵式（喇嘛塔）", "D. 金刚宝座式塔"], "answer": "C", "explain": "北海白塔为藏式（覆钵式/喇嘛塔），整体“上圆下方”，下为方形折角须弥座，塔身呈宝瓶形（覆钵）。", "source": "建筑形制：为藏式（覆钵式/喇嘛塔），整体“上圆下方”，下为方形折角须弥座，象征“须弥山”；塔身呈宝瓶形（覆钵），通体洁白。", "layer": "ext"}, {"section": "北海", "type": "judge", "q": "北海极乐世界（小西天）建成于清乾隆三十五年（1770年），是为庆祝乾隆生母孝圣皇太后八十寿辰而建。", "answer": "对", "explain": "与原文一致：乾隆三十五年（1770年）建成，为庆祝乾隆生母孝圣皇太后八十寿辰而建，祈寿福国。", "source": "修建原因：清乾隆三十五年（1770 年）建成，为庆祝乾隆生母孝圣皇太后八十寿辰而建，祈寿福国。俗称：“小西天”。", "layer": "ext"}, {"section": "北海", "type": "single", "q": "北海阅古楼是为保存法帖石刻而建，其建于（　）。", "options": ["A. 乾隆十二年（1747年）", "B. 乾隆十八年（1753年）", "C. 乾隆二十二年（1757年）", "D. 乾隆十一年（1746年）"], "answer": "B", "explain": "阅古楼建于乾隆十八年（1753年）；乾隆十二年（1747年）是法帖刻石开始之年，注意区分。", "source": "阅古楼位于白塔山西麓，呈半圆形双层延楼，乾隆十八年（1753 年）为保存法帖石刻而建（法帖刻石始于乾隆十二年，1747 年）。", "layer": "ext"}, {"section": "北海", "type": "judge", "q": "永定河河道自然南迁后，北海地区历经元、明两代引水营建，逐渐形成湖泊园林。", "answer": "错", "explain": "朝代有误，应为历经辽、金引水营建，而非元、明两代。", "source": "永定河河道自然南迁后，留下一片原野与池塘（洼地积水），后历经辽、金引水营建，逐渐形成湖泊园林。", "layer": "ext"}, {"section": "北海", "type": "multi", "q": "下列关于北海铁影壁的说法，正确的有（　）。", "options": ["A. 为元代遗物", "B. 由一块中性火山岩雕成", "C. 色泽棕褐、质地坚硬，酷似铸铁，故得名", "D. 原是元大都健德门外古庙影壁", "E. 清代建造"], "answer": "ABCD", "explain": "铁影壁为元代遗物，由中性火山岩雕成，色泽棕褐酷似铸铁而得名，原是元大都健德门外古庙影壁。E项“清代建造”错误。", "source": "建造朝代：元代遗物。材质：由一块中性火山岩（中性火成岩/火山块砾岩）雕成。得名原因：其色泽棕褐、质地坚硬，酷似铸铁……原是元大都健德门外古庙影壁", "layer": "ext"}, {"section": "北海", "type": "single", "q": "北海团城上被乾隆皇帝册封为“遮荫侯”的是（　）。", "options": ["A. 古油松", "B. 白皮松", "C. 古柏", "D. 国槐"], "answer": "A", "explain": "古油松被乾隆皇帝册封为“遮荫侯”；白皮松被封为“白袍将军”，注意区分。", "source": "团城上有金代油松与白皮松等古树，其中古油松被乾隆皇帝册封为“遮荫侯”（爵名“侯”）……另有白皮松被封为“白袍将军”。", "layer": "ext"}, {"section": "北海", "type": "judge", "q": "明代时，万寿山、太液池归入皇城西苑，统称“西苑”。", "answer": "对", "explain": "与原文一致：明代万寿山、太液池归入皇城西苑，统称“西苑”；清代才定型并习称“北海”。", "source": "明代：万寿山、太液池归入皇城西苑，统称“西苑”；清代：定型并习称“北海”。", "layer": "ext"}, {"section": "北海", "type": "single", "q": "北海公园濠濮间修建于（　）。", "options": ["A. 清乾隆二十一年（1756年）", "B. 清乾隆二十二年（1757年）", "C. 清乾隆二十三年（1758年）", "D. 清乾隆十八年（1753年）"], "answer": "B", "explain": "濠濮间修建于清乾隆二十二年（1757年），由乾隆皇帝亲定其名，名称取自《庄子》与《世说新语》典故。", "source": "修建年代：清乾隆二十二年（1757 年）。命名者：乾隆皇帝亲定其名。", "layer": "ext"}, {"section": "北海", "type": "judge", "q": "“燕京八景”中的“太液秋风”一景位于中海东岸水云榭。", "answer": "对", "explain": "与原文一致：太液秋风在中海东岸水云榭，乾隆御碑立于水云榭中；琼岛春阴才在北海琼华岛。", "source": "太液秋风——在中海东岸水云榭（乾隆御碑立于水云榭中）。", "layer": "ext"}, {"section": "北海", "type": "multi", "q": "下列关于北海永安桥的说法，正确的有（　）。", "options": ["A. 又称“堆云积翠桥”", "B. 又称“太液桥”", "C. 始建于元代", "D. 乾隆八年（1743年）改建为三孔拱券石桥", "E. 始建于明代"], "answer": "ABCD", "explain": "永安桥又称“堆云积翠桥”“太液桥”，始建于元代，乾隆八年（1743年）改建为三孔拱券石桥。E项“始建于明代”错误。", "source": "石桥为永安桥（又称“堆云积翠桥”“太液桥”），始建于元代，乾隆八年（1743 年）改建为三孔拱券石桥。", "layer": "ext"}, {"section": "北海", "type": "single", "q": "北海公园静心斋的原名是（　）。", "options": ["A. 画舫斋", "B. 镜清斋", "C. 濠濮间", "D. 快雪堂"], "answer": "B", "explain": "静心斋原名“镜清斋”，俗称“乾隆小花园”，位于北岸。", "source": "静心斋（原名镜清斋，俗称“乾隆小花园”，北岸）", "layer": "ext"}, {"section": "北海", "type": "judge", "q": "北海白塔的塔基为圆形须弥座，象征“须弥山”。", "answer": "错", "explain": "塔基形状有误，应为方形（十字）折角须弥座，而非圆形须弥座。", "source": "整体“上圆下方”，下为方形折角须弥座，象征“须弥山”……由塔基（十字折角须弥座）……五部分组成。", "layer": "ext"}, {"section": "北海", "type": "single", "q": "清末慈禧太后乘小火车到静心斋用膳，其起点是（　）。", "options": ["A. 中海瀛秀园门（紫光阁旁）", "B. 北海团城", "C. 北海北岸", "D. 西苑紫光阁北门外"], "answer": "A", "explain": "西苑铁路南起中海的瀛秀园门外（紫光阁一带），经福华门、阳泽门沿北海西岸至静心斋门前设站，起点为中海瀛秀园门（紫光阁旁）。", "source": "慈禧乘小火车用膳的起点：西苑铁路南起中海的瀛秀园门外（紫光阁一带）……即起点为中海瀛秀园门（紫光阁旁）。", "layer": "ext"}, {"section": "北海", "type": "judge", "q": "北海阅古楼内嵌《三希堂石渠宝笈法帖》石刻495方，收录自魏晋至明末135位书法家的340件作品。", "answer": "对", "explain": "与原文数据完全一致：石刻495方，135位书法家、340件（帖）作品，是我国现存最完整的古代书法集成刻石。", "source": "楼内嵌《三希堂石渠宝笈法帖》石刻 495 方，收录自魏晋至明末 135 位书法家、340 件（帖）作品。", "layer": "ext"}, {"section": "北海", "type": "multi", "q": "下列关于北海濠濮间的说法，正确的有（　）。", "options": ["A. 建于清乾隆二十二年（1757年）", "B. 由乾隆皇帝亲定其名", "C. 名称取自《庄子》与《世说新语》典故", "D. 位于北海北岸"], "answer": "ABC", "explain": "濠濮间建于乾隆二十二年（1757年），乾隆亲定其名，取自《庄子》《世说新语》典故；其位于北海东岸而非北岸，D错。", "source": "濠濮间（东岸）……修建年代：清乾隆二十二年（1757 年）。命名者：乾隆皇帝亲定其名。名称出处：取自《庄子》与《世说新语》典故。", "layer": "ext"}, {"section": "北海", "type": "single", "q": "北海地区在历史上原为（　）的故道。", "options": ["A. 潮白河", "B. 永定河（古高梁河）", "C. 温榆河", "D. 拒马河"], "answer": "B", "explain": "北海地区在历史上原为永定河（古高梁河）的故道，河道南迁后经辽、金引水营建形成湖泊园林。", "source": "北海地区在历史上原为永定河（古高梁河）的故道。", "layer": "ext"}, {"section": "北海", "type": "judge", "q": "北海极乐世界殿内高悬的“极乐世界”四字金匾为慈禧太后御笔。", "answer": "错", "explain": "题写者有误，殿内“极乐世界”四字金匾为乾隆皇帝御笔，而非慈禧太后。", "source": "所悬匾额题写者：殿内高悬金匾“极乐世界”四字为乾隆皇帝御笔。", "layer": "ext"}, {"section": "北海", "type": "single", "q": "金代以瑶屿（琼华岛）为中心在今北海地区营建的皇家离宫是（　）。", "options": ["A. 大宁离宫", "B. 瑶屿行宫", "C. 广寒殿", "D. 畅春园"], "answer": "A", "explain": "金世宗大定年间营建大宁离宫（又称太宁宫、万宁宫），基本奠定今日北海格局；瑶屿行宫为辽代，广寒殿为元代建筑。", "source": "金代：世宗建“大宁离宫”（又称太宁宫、万宁宫）……以瑶屿（琼华岛）为中心修建，基本奠定今日北海格局。", "layer": "ext"}, {"section": "北海", "type": "multi", "q": "下列关于北海澄观堂、快雪堂与铁影壁的说法，正确的有（　）。", "options": ["A. 澄观堂与浴兰轩建于清乾隆十一年（1746年）", "B. 快雪堂为一座金丝楠木大殿", "C. 铁影壁为元代遗物", "D. 铁影壁由一块中性火山岩雕成", "E. 快雪堂因藏《三希堂法帖》石刻而得名"], "answer": "ABCD", "explain": "快雪堂因藏《快雪堂法帖》石刻而得名，并非《三希堂法帖》（后者藏于阅古楼），E错；其余四项均与原文相符。", "source": "澄观堂与浴兰轩建于清乾隆十一年（1746 年）……快雪堂（一座金丝楠木大殿，因藏《快雪堂法帖》石刻……而得名）……铁影壁：元代遗物，由一块中性火山岩雕成。", "layer": "ext"}, {"section": "北海", "type": "single", "q": "北海永安寺中轴线上的主殿法轮殿内供奉的是（　）。", "options": ["A. 释迦牟尼", "B. 弥勒", "C. 大威德金刚", "D. 宗喀巴"], "answer": "A", "explain": "法轮殿为主殿，供释迦牟尼；正觉殿供弥勒，善因殿供大威德金刚，普安殿供宗喀巴。", "source": "主要殿宇：山门、法轮殿（主殿，供释迦牟尼）、正觉殿（供弥勒）、普安殿、善因殿（供大威德金刚）。", "layer": "ext"}, {"section": "北海", "type": "single", "q": "北海永安桥北端牌楼额题的是（　）。", "options": ["A. “积翠”", "B. “堆云”", "C. “琼岛”", "D. “春阴”"], "answer": "B", "explain": "桥两端牌楼南端额题“积翠”、北端额题“堆云”，合称“积翠”“堆云”牌坊。", "source": "南端牌楼额题“积翠”，北端牌楼额题“堆云”，合称“积翠”“堆云”牌坊。", "layer": "ext"}, {"section": "北海", "type": "multi", "q": "下列属于北海五龙亭中各亭名称的有（　）。", "options": ["A. 龙泽亭", "B. 澄祥亭", "C. 滋香亭", "D. 涌瑞亭", "E. 辑芳亭"], "answer": "ABCD", "explain": "五龙亭中为龙泽亭，两侧为澄祥亭、滋香亭、涌瑞亭、浮翠亭；辑芳亭是景山五方亭之一，不属于北海。", "source": "五亭临水一字排开，中为龙泽亭……两侧分别为澄祥亭、滋香亭、涌瑞亭、浮翠亭。", "layer": "ext"}, {"section": "北海", "type": "single", "q": "北海永安寺普安殿内宗喀巴主尊两侧的坐像是（　）。", "options": ["A. 贾曹杰与克珠杰", "B. 阿难与迦叶", "C. 舍利弗与目犍连", "D. 莲花生与寂护"], "answer": "A", "explain": "普安殿两侧坐像为宗喀巴两大弟子贾曹杰与克珠杰（即后世达赖、班禅体系之源）。", "source": "殿内两侧坐像为其两大弟子——贾曹杰与克珠杰（一说为达赖、班禅像）。", "layer": "ext"}, {"section": "北海", "type": "single", "q": "北海白塔的高度为（　）。", "options": ["A. 29.9米", "B. 32.5米", "C. 35.9米", "D. 40.8米"], "answer": "C", "explain": "白塔塔高35.9米，塔基边长约18.2米，塔肚最大直径约14米，是全园最高点。", "source": "关键数据：塔高 35.9 米，塔基边长约 18.2 米，塔肚最大直径约 14 米。", "layer": "ext"}, {"section": "北海", "type": "single", "q": "北海团城上被乾隆皇帝册封为“白袍将军”的是（　）。", "options": ["A. 古油松", "B. 白皮松", "C. 古柏", "D. 国槐"], "answer": "B", "explain": "白皮松被封为“白袍将军”；古油松则被封为“遮荫侯”，注意区分。", "source": "古油松被乾隆皇帝册封为“遮荫侯”……另有白皮松被封为“白袍将军”。", "layer": "ext"}, {"section": "北海", "type": "single", "q": "北海公园静心斋的俗称是（　）。", "options": ["A. 乾隆小花园", "B. 慈禧西苑行宫", "C. 小颐和园", "D. 镜中园"], "answer": "A", "explain": "静心斋原名镜清斋，俗称“乾隆小花园”，为乾隆仿江南园林之作。", "source": "静心斋（原名镜清斋，俗称“乾隆小花园”，北岸）。", "layer": "ext"}, {"section": "北海", "type": "single", "q": "清末曾与师傅翁同龢在画舫斋居住读书的皇帝是（　）。", "options": ["A. 光绪帝", "B. 同治帝", "C. 咸丰帝", "D. 宣统帝"], "answer": "A", "explain": "光绪帝曾与师傅翁同龢在画舫斋居住读书；画舫斋为乾隆读书、休憩、赏画、避暑的行宫。", "source": "光绪帝曾与师傅翁同龢在此居住读书。斋内以水池为中心，藏乾隆朝名家画作。", "layer": "ext"}, {"section": "北海", "type": "single", "q": "北海静心斋始建的时间是（　）。", "options": ["A. 乾隆十八年（1753年）", "B. 乾隆二十一年（1756年）", "C. 乾隆二十四年（1759年）", "D. 乾隆三十五年（1770年）"], "answer": "B", "explain": "静心斋清乾隆二十一年（1756年）始建，乾隆二十三年（1758年）竣工，为太子读书之处。", "source": "修建年代：清乾隆二十一年（1756 年）始建，乾隆二十三年（1758 年）竣工。", "layer": "ext"}, {"section": "北海", "type": "single", "q": "北海极乐世界（小西天）主殿是中国最大的（　）宫殿建筑。", "options": ["A. 方亭式", "B. 重檐庑殿式", "C. 八角攒尖式", "D. 十字脊式"], "answer": "A", "explain": "主殿“极乐世界”殿为中国最大的方亭式宫殿建筑，总面积约1200平方米，横梁跨度13.5米，四面环水。", "source": "主殿“极乐世界”殿为中国最大的方亭式宫殿建筑（总面积约 1200 平方米，横梁跨度 13.5 米），四面环水。", "layer": "ext"}, {"section": "景山", "layer": "core", "type": "single", "q": "景山被列为全国重点文物保护单位的时间是（　）", "options": ["2001年，第五批", "1996年，第四批", "1982年，第二批", "1961年，第一批"], "answer": "A", "explain": "景山于2001年被列为第五批全国重点文物保护单位，注意勿与1996年第四批混淆。", "source": "2001年、第五批（勿混：非1996年第四批）"}, {"section": "景山", "layer": "core", "type": "judge", "q": "寿皇殿为黄琉璃瓦重檐歇山顶，面阔九间、进深五间，体现“九五之尊”。", "answer": "错", "explain": "寿皇殿为黄琉璃瓦重檐庑殿顶（非歇山顶），面阔九间、进深五间，取“九五之尊”之意。", "source": "仿太庙、黄琉璃瓦重檐庑殿顶（面阔九间进深五间、九五之尊）"}, {"section": "景山", "layer": "core", "type": "multi", "q": "下列关于景山位置的表述，正确的有（　）", "options": ["位于北京内城中心", "位于紫禁城之北", "地处中轴线上", "是北京内城的几何中心与制高点", "位于皇城以南"], "answer": "ABCD", "explain": "景山位于内城中心、紫禁城之北、中轴线上，是内城的几何中心与制高点。", "source": "内城中心、紫禁城之北、中轴线上、几何中心与制高点"}, {"section": "景山", "layer": "core", "type": "single", "q": "元代曾把景山一带作为皇帝躬耕之所，当时称为（　）", "options": ["后苑", "西苑", "南苑", "御苑"], "answer": "A", "explain": "元代把景山一带作为皇帝躬耕之所，称“后苑”。", "source": "元代、“后苑”、兴庆阁与集祥阁为皇家粮仓旧址"}, {"section": "景山", "layer": "core", "type": "judge", "q": "元代曾把景山一带作为皇帝躬耕之所，称“后苑”，其中兴庆阁与观德阁为皇家粮仓旧址。", "answer": "错", "explain": "皇家粮仓旧址是兴庆阁与集祥阁，并非观德阁。", "source": "元代、“后苑”、兴庆阁与集祥阁为皇家粮仓旧址"}, {"section": "景山", "layer": "core", "type": "single", "q": "明永乐十八年（1420年）景山堆筑成山，当时称为（　）", "options": ["万岁山", "青山", "景山", "红山"], "answer": "A", "explain": "明代称“万岁山”（俗称镇山、煤山）；元代称“青山”，清顺治十二年（1655年）更名“景山”。", "source": "明“万岁山（俗称镇山、煤山）”、清“景山”；明永乐十八年（1420年）"}, {"section": "景山", "layer": "core", "type": "judge", "q": "清军入关后，称崇祯帝自缢的那棵槐树为“罪槐”，加铁链，皇族路过须下马。", "answer": "对", "explain": "清军入关后称此树为“罪槐”，加铁链，并规定皇族路过须下马。", "source": "“罪槐”、加铁链、皇族路过须下马"}, {"section": "景山", "layer": "core", "type": "multi", "q": "下列关于景山名称沿革与含义的表述，正确的有（　）", "options": ["元代称“青山”", "明代称“万岁山”，俗称镇山、煤山", "清顺治十二年（1655年）更名“景山”", "“景山”之名取《诗经》中“高大”之意，兼有御景之地、景仰之意", "“景山”之名出自《论语》"], "answer": "ABCD", "explain": "景山元称“青山”，明称“万岁山”（俗称镇山、煤山），清顺治十二年（1655年）更名“景山”；其名有“高大”之意（出《诗经》），亦为御景之地、含景仰之意，与《论语》无关。", "source": "元“青山”、明“万岁山（俗称镇山、煤山）”、清“景山”；清顺治十二年（1655年）；“高大”之意（《诗经》）、御景之地、景仰之意"}, {"section": "景山", "layer": "core", "type": "single", "q": "下列关于观德殿的说法，正确的是（　）", "options": ["始建于明万历年间，明代为帝王习射之所", "始建于清顺治年间，明代为帝王斋戒之所", "始建于明永乐年间，为皇家粮仓旧址", "清代道光帝曾停灵于此殿"], "answer": "A", "explain": "观德殿始建于明万历年间，明代为帝王习射之所（取“可以观德行”之意）；道光帝为例外，停灵于圆明园正大光明殿。", "source": "明万历年间；帝王习射之所（“可以观德行”）；道光帝例外、停灵圆明园正大光明殿"}, {"section": "景山", "layer": "core", "type": "judge", "q": "五方亭中的万春亭为黄瓦绿剪边、三重檐四角攒尖，是中轴线上的最高点。", "answer": "对", "explain": "万春亭黄瓦绿剪边、三重檐四角攒尖，位居中轴线最高点。", "source": "万春亭（黄瓦绿剪边、三重檐四角攒尖、中轴线最高点）"}, {"section": "景山", "layer": "core", "type": "single", "q": "“明思宗殉国处”——1644年崇祯帝自缢的槐树位于景山（　）", "options": ["东麓（东坡）", "西麓（西坡）", "南麓（南坡）", "北麓（北坡）"], "answer": "A", "explain": "崇祯帝自缢的槐树位于景山东麓（东坡），即“明思宗殉国处”（1644年）。", "source": "景山东麓（东坡）、“明思宗殉国处”（1644年）"}, {"section": "景山", "layer": "core", "type": "judge", "q": "景山北部的主要景点包括寿皇殿建筑群（中轴线上仅次于故宫的第二大建筑群）、观德殿、永思殿、兴庆阁、集祥阁和关帝庙（护国忠义庙）。", "answer": "对", "explain": "以上均为景山北部主要景点，寿皇殿建筑群为中轴线上仅次于故宫的第二大建筑群。", "source": "寿皇殿建筑群（中轴线上仅次于故宫第二大建筑群）、观德殿、永思殿、兴庆阁、集祥阁、关帝庙（护国忠义庙）"}, {"section": "景山", "layer": "core", "type": "multi", "q": "下列关于景山五方亭的表述，正确的有（　）", "options": ["建于乾隆十五年（1750年）", "从东到西依次为周赏亭、观妙亭、万春亭、辑芳亭、富览亭", "周赏亭为孔雀蓝瓦紫晶剪边、重檐圆攒尖", "辑芳亭为孔雀蓝瓦紫晶剪边", "亭内所供五方佛于1900年被八国联军劫毁"], "answer": "ABCE", "explain": "辑芳亭为翡翠绿瓦黄剪边（非孔雀蓝瓦紫晶剪边）；观妙亭同为翡翠绿瓦黄剪边、重檐八角攒尖，富览亭为孔雀蓝瓦紫晶剪边。其余各项均正确。", "source": "乾隆十五年（1750年）；周赏亭（孔雀蓝瓦紫晶剪边、重檐圆攒尖）→观妙亭（翡翠绿瓦黄剪边、重檐八角攒尖）→万春亭→辑芳亭（翡翠绿瓦黄剪边）→富览亭（孔雀蓝瓦紫晶剪边）；五方佛，1900年被八国联军劫毁"}, {"section": "景山", "layer": "core", "type": "single", "q": "五方亭中，万春亭内供奉的造像是（　）", "options": ["毗卢遮那佛（大日如来）", "宝生佛", "阿閦佛", "阿弥陀佛"], "answer": "A", "explain": "万春亭供毗卢遮那佛（大日如来）；周赏亭供宝生佛、观妙亭供阿閦佛、辑芳亭供阿弥陀佛、富览亭供不空成就佛，合为五方佛。", "source": "万春亭供毗卢遮那佛（大日如来）；周赏宝生佛、观妙阿閦佛、辑芳阿弥陀佛、富览不空成就佛"}, {"section": "景山", "layer": "core", "type": "judge", "q": "寿皇殿自1955年起由北京市少年宫使用，直至2013年11月腾退。", "answer": "错", "explain": "北京市少年宫于1956年1月1日正式成立，并非1955年；2013年11月腾退无误。", "source": "1956年1月1日正式成立、2013年11月腾退（勿混：1956年、非1955年）"}, {"section": "景山", "layer": "core", "type": "single", "q": "正对景山南门的绮望楼建于乾隆十五年，办官学时供奉孔子牌位，其东南侧曾设的机构是（　）", "options": ["八旗子弟学校", "国子监", "宗人府", "上书房"], "answer": "A", "explain": "绮望楼正对景山南门，乾隆十五年建，办官学时供奉孔子牌位，东南侧曾设八旗子弟学校。", "source": "绮望楼（乾隆十五年建）；孔子牌位；八旗子弟学校"}, {"section": "景山", "layer": "core", "type": "multi", "q": "下列关于观德殿在清代停灵情况的表述，正确的有（　）", "options": ["以孝贤皇后富察氏为首停灵于此", "此后乾隆、嘉庆、咸丰、同治、光绪诸帝后多停灵于此", "道光帝为例外，停灵于圆明园正大光明殿", "慈禧太后也曾停灵于此"], "answer": "ABC", "explain": "观德殿清代停灵以孝贤皇后富察氏为首，此后乾隆、嘉庆、咸丰、同治、光绪诸帝后多停灵于此；道光帝例外，停灵于圆明园正大光明殿。", "source": "孝贤皇后富察氏为首、此后乾隆嘉庆咸丰同治光绪诸帝后多停灵于此（勿混：道光帝例外、停灵圆明园正大光明殿）"}, {"section": "景山", "layer": "core", "type": "single", "q": "明代山前殿，康熙年间皇帝经常宴请各地来京朝贺的文武官员、各部落首领以及（　）", "options": ["公使", "传教士", "外国商队", "各地举人"], "answer": "A", "explain": "康熙年间，皇帝在山前殿宴请各地来京朝贺的文武官员、各部落首领和公使。", "source": "康熙年间宴请各地来京朝贺文武官员、各部落首领、公使"}, {"section": "景山", "layer": "core", "type": "single", "q": "寿皇门别称“戟门”，门内曾列120根金戟；寿皇殿月台上陈设铜鼎炉四座、铜鹤一对、铜鹿一对，宫门前置石狮两对（四座）。寿皇殿殿南宝坊的形制是（　）", "options": ["三座四柱三间九楼", "两座四柱三间五楼", "一座四柱三间七楼", "五座三间四柱三楼"], "answer": "A", "explain": "寿皇殿殿南为三座四柱三间九楼宝坊；寿皇门别称戟门，门内曾列120根金戟；月台陈设铜鼎炉四座、铜鹤一对、铜鹿一对，宫门前石狮两对（四座）。", "source": "戟门（门内曾列120根金戟）；三座四柱三间九楼宝坊；石狮两对（四座）；铜鼎炉四座、铜鹤一对、铜鹿一对"}, {"section": "景山", "layer": "core", "type": "multi", "q": "下列关于寿皇殿的表述，正确的有（　）", "options": ["始建于明万历十三年（1585年）", "乾隆十五年（1750年）建成于中轴线上", "仿太庙而建", "“绍闻天下”匾为乾隆御笔", "仿奉先殿而建"], "answer": "ABCD", "explain": "寿皇殿明万历十三年（1585年）始建，乾隆十五年（1750年）建成于中轴线上，仿太庙而建，“绍闻天下”匾为乾隆御笔。", "source": "明万历十三年（1585年）始建、乾隆十五年（1750年）建成于中轴线上、仿太庙；乾隆御笔"}, {"section": "景山", "layer": "core", "type": "single", "q": "寿皇殿后部神龛以康熙帝牌位居中，东西列雍正至光绪八代帝后神御牌位。历史上亲祭寿皇殿次数最多的皇帝是（　）", "options": ["光绪帝，共421次", "乾隆帝，共421次", "康熙帝，共242次", "嘉庆帝，共120次"], "answer": "A", "explain": "光绪帝亲祭寿皇殿次数最多，达421次。", "source": "康熙居中、东西列雍正至光绪八代帝后神御牌位；光绪帝、421次"}, {"section": "景山", "layer": "core", "type": "single", "q": "寿皇殿在北京市少年宫腾退后，经修缮重新开放的时间是（　）", "options": ["2018年11月", "2013年11月", "2016年1月", "2020年10月"], "answer": "A", "explain": "寿皇殿2013年11月腾退，2018年11月修缮后重新开放。", "source": "2013年11月腾退、2018年11月修缮后重新开放"}, {"section": "景山", "type": "single", "q": "历史上曾把景山一带作为皇帝躬耕之所的朝代是（　）。", "options": ["A. 辽代", "B. 金代", "C. 元代", "D. 明代"], "answer": "C", "explain": "元世祖忽必烈营建大都时，将景山一带辟为“后苑”，元代皇帝曾在此躬耕，以昭示天下劝课农桑。", "source": "元代。元世祖忽必烈营建大都时，将景山一带辟为专供皇帝游赏的“后苑”，元代皇帝曾在此躬耕，以昭示天下劝课农桑", "layer": "ext"}, {"section": "景山", "type": "judge", "q": "景山于2001年由国务院公布为第五批全国重点文物保护单位。", "answer": "对", "explain": "与原文一致：景山于2001年由国务院公布为第五批全国重点文物保护单位。", "source": "景山于 2001 年由国务院公布为第五批全国重点文物保护单位。", "layer": "ext"}, {"section": "景山", "type": "multi", "q": "景山在明清历史上曾出现过的名称有（　）。", "options": ["A. 青山", "B. 万岁山", "C. 镇山", "D. 煤山", "E. 万寿山"], "answer": "ABCD", "explain": "元代称“青山”（亦有“镇山”之说），明代称“万岁山”，俗称“镇山”“煤山”，清代改称“景山”。万寿山是元代北海琼华岛的赐名，与景山无关。", "source": "历史名称：元代称“青山”（亦有“镇山”之说），为皇城后苑；明代称“万岁山”，俗称“镇山”“煤山”；清代改称“景山”并沿用至今。", "layer": "ext"}, {"section": "景山", "type": "single", "q": "景山被称为“万岁山”始于（　）。", "options": ["A. 明永乐十八年（1420年）", "B. 明万历十三年（1585年）", "C. 清顺治十二年（1655年）", "D. 清乾隆十五年（1750年）"], "answer": "A", "explain": "明永乐十八年（1420年），明成祖朱棣营建北京时堆筑五峰，取名“万岁山”；清顺治十二年（1655年）更名“景山”。", "source": "“万岁山”年代：明永乐年间（永乐十八年，1420 年），明成祖朱棣营建北京时……形成五峰，取名“万岁山”。", "layer": "ext"}, {"section": "景山", "type": "judge", "q": "明永乐十八年（1420年），明成祖朱棣将开挖紫禁城筒子河及太液池的泥土堆筑于此，形成五峰，取名“景山”。", "answer": "错", "explain": "当时取名为“万岁山”，更名“景山”是清顺治十二年（1655年）之事。", "source": "明永乐年间（永乐十八年，1420 年），明成祖朱棣营建北京时，将开挖紫禁城筒子河及太液池的泥土、拆毁元宫的渣土堆筑于此，形成五峰，取名“万岁山”。", "layer": "ext"}, {"section": "景山", "type": "single", "q": "清军入关后，顺治帝给崇祯帝自缢的那棵槐树加上铁链，称之为（　）。", "options": ["A. 忠槐", "B. 罪槐", "C. 思槐", "D. 御槐"], "answer": "B", "explain": "清军入关后，顺治帝为笼络人心，给此树加上铁链，称之为“罪槐”（亦称“弑君罪树”）。", "source": "清军入关后，顺治帝为笼络人心，给此树加上铁链，称之为“罪槐”（亦称“弑君罪树”），并规定清室皇族成员路过此地须下马步行。", "layer": "ext"}, {"section": "景山", "type": "judge", "q": "崇祯帝朱由检于景山西坡的歪脖古槐树下自缢身亡。", "answer": "错", "explain": "方位有误，应为景山东坡（东麓），而非西坡。", "source": "位置：景山东麓（东坡）山石之上（今“明思宗殉国处”）……于景山东坡歪脖古槐树下自缢身亡，时年 33 岁。", "layer": "ext"}, {"section": "景山", "type": "multi", "q": "下列属于景山五方亭的有（　）。", "options": ["A. 周赏亭", "B. 观妙亭", "C. 万春亭", "D. 辑芳亭", "E. 濠濮间"], "answer": "ABCD", "explain": "五方亭从东到西依次为周赏亭、观妙亭、万春亭、辑芳亭、富览亭。濠濮间是北海公园东岸的园中园，与景山无关。", "source": "从东到西五亭名称、琉璃瓦颜色及形制：周赏亭（东起第一峰）……观妙亭（东起第二峰）……万春亭（中峰）……辑芳亭（西起第二峰）……富览亭（西起第一峰）", "layer": "ext"}, {"section": "景山", "type": "single", "q": "景山五方亭建立于（　）。", "options": ["A. 明永乐十八年（1420年）", "B. 清顺治十二年（1655年）", "C. 清乾隆十五年（1750年）", "D. 清乾隆三十五年（1770年）"], "answer": "C", "explain": "景山五方亭建立于清乾隆十五年（1750年）。", "source": "建立年代：清乾隆十五年（1750 年）。", "layer": "ext"}, {"section": "景山", "type": "judge", "q": "清代亲往寿皇殿祭祀次数最多的皇帝是光绪帝，据记载曾亲往祭祀421次。", "answer": "对", "explain": "与原文一致：光绪帝曾亲往寿皇殿祭祀421次，为清代亲往祭祀次数最多的皇帝。", "source": "亲往祭祀次数最多的皇帝：光绪帝，据记载曾亲往寿皇殿祭祀 421 次。", "layer": "ext"}, {"section": "景山", "type": "single", "q": "景山万春亭内供奉的佛教造像是（　）。", "options": ["A. 宝生佛", "B. 阿閦佛", "C. 阿弥陀佛", "D. 毗卢遮那佛"], "answer": "D", "explain": "万春亭（中峰）内供毗卢遮那佛（大日如来，为密宗金刚界五方如来之首）；宝生佛在周赏亭，阿閦佛在观妙亭，阿弥陀佛在辑芳亭。", "source": "万春亭（中峰）：黄琉璃瓦、绿琉璃瓦剪边，三重檐四角攒尖顶（北京中轴线最高点）；内供毗卢遮那佛（大日如来，为密宗金刚界五方如来之首）。", "layer": "ext"}, {"section": "景山", "type": "judge", "q": "今景山北部的兴庆阁、集祥阁即元代贮存皇帝亲耕所获粮食的皇家粮仓旧址。", "answer": "对", "explain": "与原文一致：元代皇帝曾在景山一带躬耕，兴庆阁、集祥阁为元代贮存亲耕粮食的皇家粮仓旧址。", "source": "今景山北部的兴庆阁、集祥阁即元代贮存皇帝亲耕所获粮食的皇家粮仓旧址。", "layer": "ext"}, {"section": "景山", "type": "multi", "q": "下列属于寿皇殿殿前月台（须弥座）上陈设的有（　）。", "options": ["A. 铜鼎炉四座", "B. 铜鹤一对", "C. 铜鹿一对", "D. 石狮两对"], "answer": "ABC", "explain": "月台上陈列铜鼎炉四座、铜鹤一对、铜鹿一对（鹤象征长寿、鹿象征福禄）；石狮两对（四座）分列于砖城门（宫墙正门）前，不在月台上。", "source": "殿前月台陈设：月台（须弥座）上陈列铜鼎炉四座、铜鹤一对、铜鹿一对（鹤象征长寿、鹿象征福禄）。", "layer": "ext"}, {"section": "景山", "type": "single", "q": "景山南侧山脚下、正对景山南门（景山门）的建筑是（　）。", "options": ["A. 观德殿", "B. 绮望楼", "C. 寿皇殿", "D. 兴庆阁"], "answer": "B", "explain": "正对景山南门的建筑是绮望楼，乾隆十五年（1750年）在明代“山前殿”旧址上兴建。", "source": "正对景山南门（景山门）的建筑：绮望楼，乾隆十五年（1750 年）在明代“山前殿”旧址上兴建，黄琉璃筒瓦歇山顶，重楼重檐，立于山脚中轴线上。", "layer": "ext"}, {"section": "景山", "type": "judge", "q": "清顺治十二年（1655年），万岁山更名为“景山”并沿用至今。", "answer": "对", "explain": "与原文一致：清顺治十二年（1655年）更名“景山”；明代称“万岁山”，俗称“镇山”“煤山”。", "source": "更名“景山”年代：清顺治十二年（1655 年）……清代改称“景山”并沿用至今。", "layer": "ext"}, {"section": "景山", "type": "single", "q": "观德殿在明代的用途是（　）。", "options": ["A. 帝王习射（射箭）之所", "B. 帝后停灵之所", "C. 皇帝宴请官员之所", "D. 官学生读书之处"], "answer": "A", "explain": "观德殿始建于明万历年间，为明代帝王习射（射箭）之所，取《礼记·射义》“可以观德行”而得名；清代才作为停灵之所。", "source": "明代用途：为明代帝王习射（射箭）之所，取《礼记·射义》“可以观德行”而得名。", "layer": "ext"}, {"section": "景山", "type": "judge", "q": "1900年八国联军将景山五方亭内供奉的五尊铜铸镏金佛像全部劫走。", "answer": "错", "explain": "细节有误：八国联军劫走四尊、毁一尊（万春亭毗卢遮那佛），并非五尊全部劫走；今万春亭佛像为后来重塑。", "source": "五亭原各供奉铜铸镏金佛像一尊，统称“五方佛”，1900 年八国联军劫走四尊、毁一尊（万春亭毗卢遮那佛），今万春亭佛像为后来重塑。", "layer": "ext"}, {"section": "景山", "type": "multi", "q": "关于“景山”名称由来的主流说法，下列正确的有（　）。", "options": ["A. “景”有“高大”之意，语出《诗经·殷武》“陟彼景山，松柏丸丸”", "B. 此处为帝后“御景”之地", "C. 含有“景仰”之意", "D. 因明代在山上堆煤而得名"], "answer": "ABC", "explain": "景山得名主流有三说：①“景”有高大之意，语出《诗经·殷武》；②帝后“御景”之地；③含“景仰”之意。“煤山”只是明代俗称，并非“景山”得名之由，D错。", "source": "名称由来（主流有三种说法）：①“景”有“高大”之意，语出《诗经·殷武》……②此处为帝后“御景”之地；③含有“景仰”之意。", "layer": "ext"}, {"section": "景山", "type": "single", "q": "寿皇殿始建年代是（　）。", "options": ["A. 明万历十三年（1585年）", "B. 明永乐十八年（1420年）", "C. 清乾隆十四年（1749年）", "D. 清乾隆十五年（1750年）"], "answer": "A", "explain": "寿皇殿始建于明万历十三年（1585年）；乾隆十四年（1749年）命移建，乾隆十五年（1750年）建成于景山正北中轴线上。", "source": "始建年代：明万历十三年（1585 年）。改建到中轴线上年代：清乾隆十四年（1749 年）命移建，乾隆十五年（1750 年）建成于景山正北中轴线上。", "layer": "ext"}, {"section": "景山", "type": "judge", "q": "清代历朝帝后的梓宫均曾停灵于观德殿，道光帝也不例外。", "answer": "错", "explain": "道光帝例外，其梓宫停灵于圆明园正大光明殿，并未停灵于观德殿。", "source": "此后清代历朝帝后……梓宫多曾停灵于此（道光帝例外，其停灵于圆明园正大光明殿）。", "layer": "ext"}, {"section": "景山", "type": "single", "q": "北京市少年宫正式在寿皇殿成立的时间是（　）。", "options": ["A. 1955年", "B. 1956年1月1日", "C. 1957年", "D. 2013年"], "answer": "B", "explain": "1955年文化部文物局指示将寿皇殿划归少年宫使用；1956年1月1日北京市少年宫正式在寿皇殿成立，使用至2013年11月腾退迁出。", "source": "1955 年文化部文物局指示将寿皇殿院内全部建筑划归少年宫使用；1956 年 1 月 1 日，北京市少年宫正式在寿皇殿成立。", "layer": "ext"}, {"section": "景山", "type": "multi", "q": "下列属于景山北部（山后）主要景点的有（　）。", "options": ["A. 寿皇殿建筑群", "B. 观德殿", "C. 永思殿", "D. 关帝庙（护国忠义庙）", "E. 绮望楼"], "answer": "ABCD", "explain": "景山北部主要景点包括寿皇殿建筑群、观德殿、永思殿、兴庆阁、集祥阁、关帝庙等；绮望楼位于景山南侧山脚下，不属于山后，E错。", "source": "景山北部……主要景点包括：寿皇殿建筑群……观德殿、永思殿、兴庆阁、集祥阁……关帝庙（护国忠义庙）等。", "layer": "ext"}, {"section": "景山", "type": "single", "q": "景山被列为全国重点文物保护单位的批次是（　）。", "options": ["A. 第三批", "B. 第四批", "C. 第五批", "D. 第六批"], "answer": "C", "explain": "景山于2001年由国务院公布为第五批全国重点文物保护单位。", "source": "景山于 2001 年由国务院公布为第五批全国重点文物保护单位。", "layer": "ext"}, {"section": "景山", "type": "single", "q": "景山在明清北京城中的位置是（　）。", "options": ["A. 内城中心、紫禁城之北、皇城之中", "B. 紫禁城之南、皇城之外", "C. 内城西北隅、积水潭之畔", "D. 外城中心、正阳门之南"], "answer": "A", "explain": "景山位于明清北京内城中心、紫禁城（宫城）之北、皇城之中，坐落在北京中轴线上，是明清北京城的几何中心与制高点。", "source": "景山位于明清北京内城中心、紫禁城（宫城）之北、皇城之中，坐落在北京中轴线上。", "layer": "ext"}, {"section": "景山", "type": "multi", "q": "下列关于寿皇殿的说法，正确的有（　）。", "options": ["A. 始建于明万历十三年（1585年）", "B. 清乾隆十五年（1750年）建成于景山正北中轴线上", "C. 仿太庙规制而建", "D. 黄琉璃瓦重檐庑殿顶，面阔九间、进深五间", "E. 仿天坛祈年殿规制而建"], "answer": "ABCD", "explain": "寿皇殿始建于明万历十三年（1585年），乾隆十五年（1750年）建成于景山正北中轴线上，仿太庙规制，黄琉璃瓦重檐庑殿顶、面阔九间进深五间。E项“仿天坛祈年殿”错误。", "source": "始建年代：明万历十三年（1585 年）……仿太庙规制而建……黄琉璃瓦重檐庑殿顶，面阔九间、进深五间。", "layer": "ext"}, {"section": "景山", "type": "single", "q": "明崇祯帝朱由检于景山自缢身亡时，时年（　）。", "options": ["A. 31岁", "B. 33岁", "C. 35岁", "D. 38岁"], "answer": "B", "explain": "明崇祯十七年（1644年）农历三月十九日，崇祯帝于景山东坡歪脖古槐树下自缢身亡，时年33岁。", "source": "明崇祯十七年（1644 年，农历三月十九日）……于景山东坡歪脖古槐树下自缢身亡，时年 33 岁。", "layer": "ext"}, {"section": "景山", "type": "single", "q": "景山五方亭中，观妙亭（东起第二峰）所覆琉璃瓦为（　）。", "options": ["A. 黄琉璃瓦、绿琉璃瓦剪边", "B. 翡翠绿琉璃瓦、黄琉璃瓦剪边", "C. 孔雀蓝琉璃瓦、紫晶色琉璃瓦剪边", "D. 翡翠绿琉璃瓦、紫晶色琉璃瓦剪边"], "answer": "B", "explain": "观妙亭覆翡翠绿琉璃瓦、黄琉璃瓦剪边；黄瓦绿剪边为万春亭，孔雀蓝瓦紫晶剪边为周赏亭与富览亭。", "source": "观妙亭（东起第二峰）：翡翠绿琉璃瓦、黄琉璃瓦剪边，重檐八角攒尖顶；内供阿閦佛。", "layer": "ext"}, {"section": "景山", "type": "single", "q": "景山五方亭中，富览亭（西起第一峰）内供奉的佛像是（　）。", "options": ["A. 宝生佛", "B. 阿閦佛", "C. 阿弥陀佛", "D. 不空成就佛"], "answer": "D", "explain": "富览亭内供不空成就佛；宝生佛在周赏亭，阿閦佛在观妙亭，阿弥陀佛在辑芳亭。", "source": "富览亭（西起第一峰）：孔雀蓝琉璃瓦、紫晶色琉璃瓦剪边，重檐圆攒尖顶；内供不空成就佛。", "layer": "ext"}, {"section": "景山", "type": "single", "q": "景山绮望楼在乾隆年间办官学时内供孔子牌位，其东南侧曾设置的机构是（　）。", "options": ["A. 八旗子弟学校（八旗学舍）", "B. 国子监", "C. 上书房", "D. 南书房"], "answer": "A", "explain": "绮望楼东南曾建八旗子弟学校（八旗学舍），供官学生读书习艺，今已无存。", "source": "东南侧曾设机构：绮望楼东南曾建八旗子弟学校（八旗学舍），供官学生读书习艺，今已无存。", "layer": "ext"}, {"section": "景山", "type": "single", "q": "至清康熙年间，皇帝经常在景山山前殿宴请的对象是（　）。", "options": ["A. 各地来京朝贺的文武官员、各部落首领、公使等", "B. 八旗官学生", "C. 后宫嫔妃及皇子", "D. 来华外国传教士"], "answer": "A", "explain": "清康熙年间，皇帝经常在山前殿宴请各地来京朝贺的文武官员、各部落首领、公使等；殿前曾设校场观看宗室射箭。", "source": "至清康熙年间，皇帝经常在山前殿宴请各地来京朝贺的文武官员、各部落首领、公使等。", "layer": "ext"}, {"section": "景山", "type": "single", "q": "清代首位在观德殿停灵的帝后是（　）。", "options": ["A. 孝贤皇后富察氏", "B. 孝圣皇太后", "C. 慈安太后", "D. 慈禧太后"], "answer": "A", "explain": "乾隆十三年（1748年）孝贤皇后富察氏崩逝，观德殿成为其在京停灵之所，为首位在此停灵者。", "source": "乾隆十三年（1748 年）孝贤皇后富察氏崩逝，观德殿成为其在京停灵之所，为首位在此停灵者。", "layer": "ext"}, {"section": "景山", "type": "single", "q": "寿皇殿作为北京市少年宫使用，腾退迁出的时间是（　）。", "options": ["A. 2008年", "B. 2013年11月", "C. 2016年", "D. 2018年11月"], "answer": "B", "explain": "寿皇殿作为北京市少年宫使用至2013年11月腾退迁出；2018年11月为修缮后重新向公众开放的时间。", "source": "寿皇殿作为北京市少年宫使用至 2013 年 11 月腾退迁出，2018 年 11 月修缮后重新向公众开放。", "layer": "ext"}, {"section": "雍和宫", "layer": "core", "type": "single", "q": "雍和宫的占地面积约为（ ）。", "options": ["A. 4.6公顷", "B. 6.6公顷", "C. 8.6公顷", "D. 10.6公顷"], "answer": "B", "explain": "雍和宫占地约6.6公顷，合66400平方米。", "source": "约6.6公顷（66400平方米）"}, {"section": "雍和宫", "layer": "core", "type": "judge", "q": "雍和宫占地面积约6.6公顷，合66400平方米。", "answer": "对", "explain": "与背诵版一致：雍和宫占地约6.6公顷（66400平方米）。", "source": "约6.6公顷（66400平方米）"}, {"section": "雍和宫", "layer": "core", "type": "multi", "q": "清代雍和宫在历史上经历的时期包括（ ）。", "options": ["A. 雍亲王府", "B. 行宫", "C. 藏传佛教寺院", "D. 摄政王府"], "answer": "ABC", "explain": "雍和宫经历雍亲王府（1694年始建）→行宫（1725年）→藏传佛教寺院（1744年）三个时期。", "source": "雍亲王府（1694年始建）→行宫（1725年）→藏传佛教寺院（1744年）"}, {"section": "雍和宫", "layer": "core", "type": "single", "q": "沿雍和宫中路自南向北，排在雍和门（天王殿）之后的建筑是（ ）。", "options": ["A. 昭泰门", "B. 雍和宫大殿", "C. 法轮殿", "D. 万福阁"], "answer": "B", "explain": "中路顺序为：昭泰门→雍和门（天王殿）→雍和宫大殿→永佑殿→法轮殿→万福阁→绥成楼。", "source": "昭泰门→雍和门（天王殿）→雍和宫大殿→永佑殿→法轮殿→万福阁→绥成楼"}, {"section": "雍和宫", "layer": "core", "type": "judge", "q": "雍和宫属于藏传佛教萨迦派寺院。", "answer": "错", "explain": "雍和宫属藏传佛教格鲁派（黄教），而非萨迦派。", "source": "格鲁派（黄教）"}, {"section": "雍和宫", "layer": "core", "type": "single", "q": "格鲁派创始人宗喀巴的诞生地是（ ）。", "options": ["A. 西藏拉萨", "B. 青海湟中县", "C. 甘肃夏河", "D. 四川甘孜"], "answer": "B", "explain": "宗喀巴1357年生于青海湟中县，该地为塔尔寺所在地。", "source": "青海湟中县（1357年生，塔尔寺所在地）"}, {"section": "雍和宫", "layer": "core", "type": "judge", "q": "格鲁派创始人宗喀巴1357年出生于青海湟中县，该地为塔尔寺所在地。", "answer": "对", "explain": "与背诵版一致：宗喀巴诞生于青海湟中县（1357年生，塔尔寺所在地）。", "source": "青海湟中县（1357年生，塔尔寺所在地）"}, {"section": "雍和宫", "layer": "core", "type": "multi", "q": "清政府将雍和宫改为藏传佛教寺院的原因及意义包括（ ）。", "options": ["A. 为先帝祈福", "B. 团结蒙藏、安定边疆", "C. 使其成为清政府管理全国藏传佛教事务的中心", "D. 作为清代帝后的陵寝祭祀场所"], "answer": "ABC", "explain": "改寺意在为先帝祈福、团结蒙藏安定边疆，并使雍和宫成为清政府管理全国藏传佛教事务的中心。", "source": "为先帝祈福、团结蒙藏安定边疆、清政府管理全国藏传佛教事务中心"}, {"section": "雍和宫", "layer": "core", "type": "single", "q": "下列建筑中，不属于雍和宫“伽蓝七堂”的是（ ）。", "options": ["A. 昭泰门", "B. 钟楼", "C. 讲经殿", "D. 戒台楼"], "answer": "D", "explain": "“伽蓝七堂”为昭泰门、钟楼、鼓楼、雍和门、雍和宫殿、讲经殿、密宗殿七座，戒台楼不在其列。", "source": "昭泰门、钟楼、鼓楼、雍和门、雍和宫殿、讲经殿、密宗殿七座"}, {"section": "雍和宫", "layer": "core", "type": "judge", "q": "雍正五年（1727年），雍亲王府更名为“雍和宫”。", "answer": "错", "explain": "更名“雍和宫”是在雍正三年（1725年），不是雍正五年。", "source": "更名“雍和宫”时间：雍正三年（1725年）"}, {"section": "雍和宫", "layer": "core", "type": "single", "q": "雍和宫改为藏传佛教寺院的时间是（ ）。", "options": ["A. 康熙三十三年（1694年）", "B. 雍正三年（1725年）", "C. 乾隆九年（1744年）", "D. 乾隆十五年（1750年）"], "answer": "C", "explain": "雍和宫经历雍亲王府（1694年始建）→行宫（1725年）→藏传佛教寺院（1744年）三个时期。", "source": "雍亲王府（1694年始建）→行宫（1725年）→藏传佛教寺院（1744年）"}, {"section": "雍和宫", "layer": "core", "type": "judge", "q": "雍和宫中路建筑自南向北依次为：宝坊院、辇道、昭泰门、雍和门（天王殿）、雍和宫大殿、永佑殿、法轮殿、万福阁、绥成楼。", "answer": "对", "explain": "与背诵版所列中路建筑名称及顺序完全一致。", "source": "宝坊院（三座牌楼）→辇道→昭泰门→雍和门（天王殿）→雍和宫大殿→永佑殿→法轮殿→万福阁→绥成楼"}, {"section": "雍和宫", "layer": "core", "type": "multi", "q": "咸丰朝以前，雍和宫熬制的腊八粥分赐的对象包括（ ）。", "options": ["A. 宫廷", "B. 王公大臣", "C. 寺院僧人", "D. 京城百姓", "E. 蒙古各盟旗王府"], "answer": "ABCD", "explain": "腊八粥分赐宫廷、王公大臣、寺院僧人及京城百姓，不含蒙古各盟旗王府。", "source": "分赐宫廷、王公大臣、寺院僧人及京城百姓"}, {"section": "雍和宫", "layer": "core", "type": "single", "q": "出生于雍王府如意室、并称雍和宫为“龙潜福地”的皇帝是（ ）。", "options": ["A. 康熙帝", "B. 雍正帝", "C. 乾隆帝弘历", "D. 嘉庆帝"], "answer": "C", "explain": "乾隆帝弘历生于雍王府如意室，故称雍和宫为“龙潜福地”。", "source": "乾隆帝弘历（生于如意室、“龙潜福地”）"}, {"section": "雍和宫", "layer": "core", "type": "judge", "q": "雍和宫最大规模的扩建自乾隆九年（1744年）始，至乾隆二十年（1755年）告竣。", "answer": "错", "explain": "扩建告竣于乾隆十五年（1750年），不是乾隆二十年。", "source": "最大规模扩建：乾隆九年（1744年）至十五年（1750年）告竣"}, {"section": "雍和宫", "layer": "core", "type": "single", "q": "清政府将雍和宫改为藏传佛教寺院后，雍和宫成为（ ）。", "options": ["A. 皇家祭祖的家庙", "B. 清政府管理全国藏传佛教事务的中心", "C. 皇帝驻跸的行宫别苑", "D. 蒙藏贵族子弟的官学"], "answer": "B", "explain": "改寺意在为先帝祈福、团结蒙藏安定边疆，使之成为清政府管理全国藏传佛教事务的中心。", "source": "为先帝祈福、团结蒙藏安定边疆、清政府管理全国藏传佛教事务中心"}, {"section": "雍和宫", "layer": "core", "type": "judge", "q": "雍和宫中轴线主要建筑匾额均为乾隆皇帝御笔，以满、汉、蒙、藏四体文字题写。", "answer": "对", "explain": "与背诵版一致：匾额为乾隆皇帝御笔，用满、汉、蒙、藏四体文字。", "source": "乾隆皇帝御笔；满、汉、蒙、藏四体文字"}, {"section": "雍和宫", "layer": "core", "type": "multi", "q": "雍和宫大殿佛像前陈设的“七珍”包括（ ）。", "options": ["A. 金轮宝", "B. 白象宝", "C. 神珠宝", "D. 珊瑚宝", "E. 玉女宝"], "answer": "ABCE", "explain": "七珍为金轮宝、白象宝、绀马宝、神珠宝、玉女宝、主藏臣宝、主兵臣宝，无珊瑚宝。", "source": "金轮宝、白象宝、绀马宝、神珠宝、玉女宝、主藏臣宝、主兵臣宝"}, {"section": "雍和宫", "layer": "core", "type": "single", "q": "“金瓶掣签”制度确立于乾隆五十七年（1792年）颁布的（ ）。", "options": ["A. 《钦定藏内善后章程》", "B. 《理藩院则例》", "C. 《大清会典》", "D. 《蒙古律例》"], "answer": "A", "explain": "乾隆五十七年（1792年）《钦定藏内善后章程》确立金瓶掣签制度，两只金瓶分置拉萨大昭寺与北京雍和宫。", "source": "乾隆五十七年1792年《钦定藏内善后章程》确立"}, {"section": "雍和宫", "layer": "core", "type": "judge", "q": "清代雍和宫的荐新礼，是按节令将时鲜果蔬供于佛像及乾隆影像之前。", "answer": "错", "explain": "荐新礼供于佛像及雍正影像前，不是乾隆影像。", "source": "按节令供时鲜果蔬于佛像及雍正影像前"}, {"section": "雍和宫", "layer": "core", "type": "single", "q": "雍和宫金刚驱魔神舞俗称（ ）。", "options": ["A. “打鬼”“跳布扎”", "B. “驱傩”“逐疫”", "C. “跳神”“萨满”", "D. “社火”“走会”"], "answer": "A", "explain": "金刚驱魔神舞于农历正月二十九、二月初一（大建三十日）举行，意在驱祟避邪、祈愿人寿年丰国泰民安，俗称“打鬼”“跳布扎”。", "source": "驱祟避邪、祈愿人寿年丰国泰民安、俗称“打鬼”“跳布扎”"}, {"section": "雍和宫", "layer": "core", "type": "judge", "q": "“金瓶掣签”所用的两只金瓶，一只存放于西藏拉萨大昭寺，一只存放于北京雍和宫。", "answer": "对", "explain": "与背诵版一致：一只西藏拉萨大昭寺、一只北京雍和宫。", "source": "一只西藏拉萨大昭寺、一只北京雍和宫（乾隆五十七年1792年《钦定藏内善后章程》确立）"}, {"section": "雍和宫", "layer": "core", "type": "multi", "q": "关于永佑殿，下列说法正确的有（ ）。", "options": ["A. 殿内供奉三尊白檀木雕佛像，各高2.35米", "B. 三尊佛像居中者为无量寿佛，东为狮吼佛、西为药师佛", "C. 《绿度母》由孝圣宪皇后钮祜禄氏主持、以堆绫补绣工艺制作", "D. 《绿度母》由慈禧太后主持制作"], "answer": "ABC", "explain": "永佑殿供三尊各高2.35米的白檀木佛像：中无量寿佛、东狮吼佛、西药师佛；《绿度母》系孝圣宪皇后钮祜禄氏主持、堆绫补绣工艺制成，与慈禧无关。", "source": "三尊白檀木雕佛像各高2.35米：中无量寿佛、东狮吼佛、西药师佛；孝圣宪皇后钮祜禄氏主持、堆绫补绣工艺"}, {"section": "雍和宫", "layer": "core", "type": "single", "q": "宝坊院现存牌楼的数量是（ ）。", "options": ["A. 二座", "B. 三座", "C. 四座", "D. 五座"], "answer": "B", "explain": "宝坊院现存牌楼三座，东、西、南各一，乾隆九年（1744年）建，额题乾隆御笔，为四柱三间七楼/九楼式木牌楼，黄琉璃瓦顶。", "source": "三座（东、西、南各一）、乾隆九年（1744年）建、额题乾隆御笔、四柱三间七楼/九楼式木牌楼、黄琉璃瓦顶"}, {"section": "雍和宫", "layer": "core", "type": "judge", "q": "雍和宫金刚驱魔神舞于每年农历正月十五日举行。", "answer": "错", "explain": "金刚驱魔神舞时间为农历正月二十九日、二月初一（大建为三十日），不是正月十五。", "source": "农历正月二十九日、二月初一（大建为三十日）"}, {"section": "雍和宫", "layer": "core", "type": "single", "q": "法轮殿内宗喀巴像东侧的讲经说法台（东经座）为（ ）所用。", "options": ["A. 达赖", "B. 班禅", "C. 章嘉呼图克图", "D. 哲布尊丹巴"], "answer": "B", "explain": "东经座为班禅所用、西经座为达赖所用，记忆口诀“东班禅、西达赖”。", "source": "东经座为班禅所用、西经座为达赖所用（勿混：东班禅、西达赖）"}, {"section": "雍和宫", "layer": "core", "type": "judge", "q": "咸丰朝以前熬腊八粥所用大锅高1.5米、直径2.5米、重约8吨，为雍和宫“四宝”之一。", "answer": "对", "explain": "与背诵版一致：大锅高1.5米、直径2.5米、重约8吨，系“四宝”之一。", "source": "高1.5米、直径2.5米、重约8吨、“四宝”之一"}, {"section": "雍和宫", "layer": "core", "type": "multi", "q": "法轮殿的建筑特色包括（ ）。", "options": ["A. 汉藏结合式建筑", "B. 平面呈十字形", "C. 殿顶开五座天窗式暗楼", "D. 上耸五座镏金宝塔"], "answer": "ABCD", "explain": "法轮殿为汉藏结合式，平面十字形，有五座天窗式暗楼、五座镏金宝塔，是僧众诵经及重大佛事的核心场所（“大经堂”）。", "source": "汉藏结合式、平面十字形、五座天窗式暗楼、五座镏金宝塔；僧众诵经及重大佛事核心场所（“大经堂”）"}, {"section": "雍和宫", "layer": "core", "type": "single", "q": "辇道院内的辇道（御路）长约（ ）。", "options": ["A. 100米", "B. 200米", "C. 300米", "D. 400米"], "answer": "B", "explain": "辇道院南起宝坊院、北至昭泰门，辇道（御路）约200米。", "source": "南起宝坊院、北至昭泰门、辇道（御路）约200米"}, {"section": "雍和宫", "layer": "core", "type": "judge", "q": "辇道院南起昭泰门、北至宝坊院。", "answer": "错", "explain": "方向颠倒了：辇道院南起宝坊院、北至昭泰门。", "source": "南起宝坊院、北至昭泰门"}, {"section": "雍和宫", "layer": "core", "type": "single", "q": "辇道院东西两侧小门之内为（ ）。", "options": ["A. 佛仓", "B. 僧舍", "C. 经堂", "D. 斋堂"], "answer": "A", "explain": "辇道院东西两侧小门内为佛仓。", "source": "东西两侧小门内为佛仓"}, {"section": "雍和宫", "layer": "core", "type": "judge", "q": "雍和门（天王殿）殿内正中供弥勒菩萨（布袋和尚），两侧为四大天王，弥勒背后为韦驮。", "answer": "对", "explain": "与背诵版一致：正中弥勒菩萨（布袋和尚）、两侧四大天王、弥勒背后韦驮。", "source": "正中弥勒菩萨（布袋和尚）、两侧四大天王、弥勒背后韦驮"}, {"section": "雍和宫", "layer": "core", "type": "multi", "q": "雍和宫“木雕三绝”包括（ ）。", "options": ["A. 白檀木迈达拉佛（万福阁）", "B. 金丝楠木雕佛龛（昭佛楼）", "C. 紫檀木五百罗汉山（法轮殿）", "D. 青铜须弥山（雍和宫大殿前）"], "answer": "ABC", "explain": "“木雕三绝”为白檀木迈达拉佛（万福阁）、金丝楠木雕佛龛（昭佛楼）、紫檀木五百罗汉山（法轮殿）；青铜须弥山为铜铸，不在其列。", "source": "白檀木迈达拉佛（万福阁）、金丝楠木雕佛龛（昭佛楼）、紫檀木五百罗汉山（法轮殿）"}, {"section": "雍和宫", "layer": "core", "type": "single", "q": "咸丰朝以前雍和宫熬腊八粥所用大锅重约（ ）。", "options": ["A. 5吨", "B. 8吨", "C. 10吨", "D. 12吨"], "answer": "B", "explain": "大锅高1.5米、直径2.5米、重约8吨，为雍和宫“四宝”之一。", "source": "高1.5米、直径2.5米、重约8吨、“四宝”之一"}, {"section": "雍和宫", "layer": "core", "type": "judge", "q": "法轮殿平面呈方形，殿顶上耸三座镏金宝塔。", "answer": "错", "explain": "法轮殿平面呈十字形，上耸五座镏金宝塔（并有五座天窗式暗楼），不是方形三座。", "source": "汉藏结合式、平面十字形、五座天窗式暗楼、五座镏金宝塔"}, {"section": "雍和宫", "layer": "core", "type": "single", "q": "雍和门（天王殿）殿内正中供奉的是（ ）。", "options": ["A. 弥勒菩萨（布袋和尚）", "B. 释迦牟尼", "C. 宗喀巴", "D. 韦驮"], "answer": "A", "explain": "殿内正中供弥勒菩萨（布袋和尚），两侧四大天王，弥勒背后为韦驮。", "source": "正中弥勒菩萨（布袋和尚）、两侧四大天王、弥勒背后韦驮"}, {"section": "雍和宫", "layer": "core", "type": "judge", "q": "雍和宫戒台楼建于乾隆四十五年（1780年），为迎六世班禅进京、乾隆受戒而建，楼内戒台为汉白玉五层戒台。", "answer": "错", "explain": "建造年代与缘由表述正确，但层数有误：资料记载楼内戒台为汉白玉三层戒台（一说），并非五层。", "source": "戒台楼位于法轮殿西侧，建于乾隆四十五年（1780年），为迎六世班禅进京、乾隆受戒而建。楼内保存的戒台（戒坛）以汉白玉石雕砌而成……一说为汉白玉三层戒台。", "patch": true}, {"section": "雍和宫", "layer": "core", "type": "multi", "q": "法轮殿紫檀木五百罗汉山上的罗汉雕像，其铸造材质包括（ ）。", "options": ["A. 金", "B. 银", "C. 铁", "D. 铅", "E. 锡"], "answer": "ABCE", "explain": "罗汉雕像以金、银、铜、铁、锡五金铸造，不含铅。", "source": "紫檀木；金、银、铜、铁、锡五金铸造"}, {"section": "雍和宫", "layer": "core", "type": "single", "q": "雍和宫大殿在雍王府时期称为（ ）。", "options": ["A. 金銮殿", "B. 太和殿", "C. 银安殿", "D. 永安殿"], "answer": "C", "explain": "雍和宫大殿在雍王府时期称银安殿，用于处理政务、举行礼仪、升殿受贺。", "source": "银安殿、处理政务、举行礼仪、升殿受贺"}, {"section": "雍和宫", "layer": "core", "type": "single", "q": "雍和宫大殿前的青铜须弥山，是明代万历年间由太监（ ）供奉的。", "options": ["A. 冯保", "B. 魏忠贤", "C. 王振", "D. 刘瑾"], "answer": "A", "explain": "须弥山为青铜铸造，明代万历年间太监冯保供奉。", "source": "青铜铸造……明代万历年间太监冯保供奉"}, {"section": "雍和宫", "layer": "core", "type": "multi", "q": "关于万福阁迈达拉佛，下列说法正确的有（ ）。", "options": ["A. 佛像地上高18米、地下8米，总高26米", "B. 由整株白檀木雕成，重约100吨", "C. 1990年载入《吉尼斯世界纪录》", "D. 系六世班禅进贡"], "answer": "ABC", "explain": "迈达拉佛为整株白檀木，地上18米、地下8米、总高26米、重约100吨，1990年载入《吉尼斯世界纪录》，系七世达赖进贡而非六世班禅。", "source": "整株白檀木、地上18米、地下8米、总高26米、重约100吨、1990年载入《吉尼斯世界纪录》、七世达赖进贡"}, {"section": "雍和宫", "layer": "core", "type": "single", "q": "关于雍和宫大殿前象征佛教宇宙“世界中心”的须弥山，其通高为（ ）。", "options": ["A. 1.5米", "B. 2.35米", "C. 2.76米", "D. 3.5米"], "answer": "C", "explain": "须弥山青铜铸造，山体高约1.5米、通高2.76米；1.5米是山体高度，2.35米是永佑殿白檀木佛像高度，注意区分。", "source": "青铜铸造、山体高约1.5米、通高2.76米、象征佛教宇宙“世界中心”"}, {"section": "雍和宫", "layer": "core", "type": "single", "q": "雍和宫大殿内供奉横三世佛，其中西侧供奉的是（ ）。", "options": ["A. 燃灯佛（过去）", "B. 弥勒佛（未来）", "C. 药师佛", "D. 无量寿佛"], "answer": "A", "explain": "横三世佛：中释迦牟尼（现在）、西燃灯（过去）、东弥勒（未来），两侧塑十八罗汉。", "source": "横三世佛（竖三世佛）：中释迦牟尼（现在）、西燃灯（过去）、东弥勒（未来）、两侧十八罗汉"}, {"section": "雍和宫", "layer": "core", "type": "multi", "q": "关于万福阁院落，下列说法正确的有（ ）。", "options": ["A. 昭佛楼内供奉的主尊为旃檀佛，系铜质镀金释迦牟尼立像", "B. 戒台楼内戒台以汉白玉石雕砌", "C. 戒台建于乾隆四十五年（1780年），为迎接六世班禅而建", "D. 迈达拉佛两侧的凤眼香以沉香木制成"], "answer": "ABC", "explain": "旃檀佛为铜质镀金释迦牟尼立像，呈“曹衣出水”风格；戒台汉白玉石雕砌，乾隆四十五年（1780年）为迎六世班禅而建；凤眼香材质为古代植物化石（硅化木），非沉香木。", "source": "旃檀佛（铜质镀金释迦牟尼立像、“曹衣出水”风格）；汉白玉石雕砌、建于乾隆四十五年（1780年）为迎六世班禅；古代植物化石（硅化木）"}, {"section": "雍和宫", "layer": "core", "type": "single", "q": "雍和宫大殿内释迦牟尼佛像左右两侧的弟子是（ ）。", "options": ["A. 左迦叶、右阿难", "B. 左阿难、右迦叶", "C. 目犍连、舍利弗", "D. 文殊、普贤"], "answer": "A", "explain": "释迦牟尼左右弟子为左迦叶、右阿难。", "source": "左迦叶、右阿难"}, {"section": "雍和宫", "layer": "core", "type": "single", "q": "乾隆皇帝撰写《喇嘛说》时的年龄是（ ）。", "options": ["A. 71周岁", "B. 81周岁（虚岁82岁）", "C. 82周岁", "D. 91周岁"], "answer": "B", "explain": "乾隆撰写《喇嘛说》时81周岁（虚岁82岁），“82周岁”为干扰项。", "source": "81周岁（虚岁82岁）"}, {"section": "雍和宫", "layer": "core", "type": "multi", "q": "关于法轮殿院内文物，下列说法正确的有（ ）。", "options": ["A. 鱼龙变化盆系乾隆出生第三天所用的“洗三盆”", "B. 殿内藏有《甘珠尔》108部", "C. 殿内藏有《丹珠尔》207部", "D. 殿内坛城为五彩金刚砂大威德金刚坛城"], "answer": "ABCD", "explain": "四项均与背诵版一致：鱼龙变化盆为乾隆“洗三盆”；《大藏经》含《甘珠尔》108部、《丹珠尔》207部；另有五彩金刚砂大威德金刚坛城。", "source": "乾隆出生第三天“洗三盆”；《甘珠尔》108部、《丹珠尔》207部；五彩金刚砂大威德金刚坛城"}, {"section": "雍和宫", "layer": "core", "type": "single", "q": "《喇嘛说》方碑四面分别镌刻满、汉、蒙、藏四种文字，其北面所刻为（ ）。", "options": ["A. 满文", "B. 汉文", "C. 蒙文", "D. 藏文"], "answer": "B", "explain": "方碑四面为南满、北汉、东蒙、西藏，北面刻汉文。", "source": "满、汉、蒙、藏四种文字（南满、北汉、东蒙、西藏）"}, {"section": "雍和宫", "layer": "core", "type": "single", "q": "雍和宫四学殿中，研习医学（医方明）的是（ ）。", "options": ["A. 讲经殿", "B. 密宗殿", "C. 数学殿", "D. 药师殿"], "answer": "D", "explain": "四学殿为讲经殿（显宗）、密宗殿、数学殿（时轮）、药师殿（医学），研习医学者为药师殿。", "source": "讲经殿（显宗）、密宗殿、数学殿（时轮）、药师殿（医学）"}, {"section": "雍和宫", "layer": "core", "type": "single", "q": "雍正帝驾崩后，灵柩曾停放于雍和宫的（ ）。", "options": ["A. 永佑殿", "B. 法轮殿", "C. 雍和宫大殿", "D. 万福阁"], "answer": "A", "explain": "雍正帝驾崩后停灵于永佑殿，永佑殿于十五日内改覆黄琉璃瓦。", "source": "永佑殿（十五日内改覆黄琉璃瓦）"}, {"section": "雍和宫", "layer": "core", "type": "single", "q": "万福阁得名的原因是（ ）。", "options": ["A. 乾隆皇帝御赐“万福”二字", "B. 各层供奉小佛像近万尊，且“佛”与“福”读音相近", "C. 阁内藏《万福经》万卷", "D. 为太后祝寿祈福而建"], "answer": "B", "explain": "万福阁各层供奉小佛像近万尊，因“佛”与“福”读音相近而得名。", "source": "各层供奉小佛像近万尊、“佛”与“福”读音相近"}, {"section": "雍和宫", "layer": "core", "type": "single", "q": "雍和宫戒台楼内保存的汉白玉戒台，其层数为（ ）。", "options": ["A. 一层", "B. 二层", "C. 三层", "D. 五层"], "answer": "C", "explain": "戒台楼位于法轮殿西侧，建于乾隆四十五年（1780年），为迎六世班禅进京、乾隆受戒而建；楼内戒台以汉白玉石雕砌而成，资料记载为三层（一说为汉白玉三层戒台）。", "source": "戒台楼位于法轮殿西侧，建于乾隆四十五年（1780年），为迎六世班禅进京、乾隆受戒而建。楼内保存的戒台（戒坛）以汉白玉石雕砌而成……一说为汉白玉三层戒台。", "patch": true}, {"section": "雍和宫", "type": "single", "q": "藏传佛教格鲁派创始人宗喀巴生于哪一年？", "options": ["A. 1337年", "B. 1357年", "C. 1377年", "D. 1397年"], "answer": "B", "explain": "宗喀巴诞生于青海湟中县（今塔尔寺所在地），生于1357年。", "source": "宗喀巴诞生地：青海湟中县（今塔尔寺所在地），生于 1357 年，是藏传佛教格鲁派创始人。", "layer": "ext"}, {"section": "雍和宫", "type": "judge", "q": "雍和宫占地面积约6.6公顷，即66,400平方米。", "answer": "对", "explain": "原文：占地面积约6.6公顷（66,400平方米），官方与多数资料采用此数据。", "source": "占地面积：约 6.6 公顷（66,400 平方米）。", "layer": "ext"}, {"section": "雍和宫", "type": "multi", "q": "下列建筑中，属于雍和宫中路（中轴线上）建筑的有（ ）。", "options": ["A. 昭泰门", "B. 雍和门", "C. 法轮殿", "D. 万福阁", "E. 太和殿"], "answer": "ABCD", "explain": "雍和宫中路建筑由南向北为：宝坊院→辇  "options": ["A. 金轮宝", "B. 白象宝", "C. 绀马宝", "D. 玉女宝", "E. 夜明珠"], "answer": "ABCD", "explain": "七珍为：金轮宝、白象宝、绀马宝、神珠宝、玉女宝、主藏臣宝、主兵臣宝。夜明珠不在其中。", "source": "佛像前供奉的七珍（转轮圣王七宝）：金轮宝、白象宝、绀马宝、神珠宝、玉女宝、主藏臣宝、主兵臣宝。", "layer": "ext"}, {"section": "雍和宫", "type": "single", "q": "雍和宫辇道院中专供清代皇帝乘辇礼佛的辇道（御路）全长约多少？", "options": ["A. 约100米", "B. 约150米", "C. 约200米", "D. 约300米"], "answer": "C", "explain": "辇道全长约200米（一说约152米），东西两侧开有小门，内为佛仓（活佛行馆）。", "source": "院中有一条用方砖铺砌、专供清代皇帝乘辇礼佛的辇道（御路），全长约 200 米（一说约 152 米）；辇道东西两侧开有小门，内为佛仓（活佛行馆）。", "layer": "ext"}, {"section": "雍和宫", "type": "judge", "q": "雍正帝驾崩后，梓宫（棺椁）曾停灵于雍和宫的法轮殿。", "answer": "错", "explain": "雍正帝驾崩后梓宫停灵于永佑殿（雍正即位前的正寝殿，后改名\"神御殿\"），不是法轮殿。", "source": "雍正十三年（1735 年）雍正帝驾崩后，梓宫（棺椁）曾停灵于雍和宫的永佑殿（雍正即位前的正寝殿，后改名\"神御殿\"，供奉雍正影像）。", "layer": "ext"}, {"section": "雍和宫", "type": "single", "q": "雍和门（天王殿）殿内正中金漆雕龙宝座上供奉的是哪尊造像？", "options": ["A. 弥勒菩萨（布袋和尚）像", "B. 韦驮像", "C. 四大天王像", "D. 宗喀巴大师像"], "answer": "A", "explain": "正中金漆雕龙宝座上供奉笑口常开、袒胸露腹的弥勒菩萨（布袋和尚）像。", "source": "正中金漆雕龙宝座上供奉笑口常开、袒胸露腹的弥勒菩萨（布袋和尚）像；东西两侧相对而立的是泥金彩塑四大天王。", "layer": "ext"}, {"section": "雍和宫", "type": "judge", "q": "万福阁内迈达拉佛地上部分高18米，地下埋入8米，总高26米。", "answer": "对", "explain": "原文：迈达拉佛地上部分高18米、地下埋入8米（总高26米），1990年载入《吉尼斯世界纪录》。", "source": "万福阁内迈达拉佛（弥勒站像）由整株白檀木（白檀香木）雕成：地上部分高 18 米、地下埋入 8 米（总高 26 米）。", "layer": "ext"}, {"section": "雍和宫", "type": "multi", "q": "下列关于雍和宫\"木雕三绝\"及其放置位置的说法，正确的有（ ）。", "options": ["A. 白檀木迈达拉佛——置于万福阁", "B. 金丝楠木雕佛龛——置于昭佛楼", "C. 紫檀木五百罗汉山——置于法轮殿", "D. 白檀木迈达拉佛——置于法轮殿", "E. 紫檀木五百罗汉山——置于昭佛楼"], "answer": "ABC", "explain": "木雕三绝：白檀木迈达拉佛在万福阁，金丝楠木雕佛龛在昭佛楼（佛龛里外三层、共雕九十九条金龙），紫檀木五百罗汉山在法轮殿。D、E位置张冠李戴。", "source": "木雕三绝及位置：①白檀木迈达拉佛（弥勒大佛）——置于万福阁；②金丝楠木雕佛龛——置于昭佛楼（乾隆生母礼佛之所）；③紫檀木五百罗汉山——置于法轮殿。", "layer": "ext"}, {"section": "雍和宫", "type": "single", "q": "雍和门（天王殿）内弥勒像背后供奉的是哪尊造像？", "options": ["A. 四大天王像", "B. 韦驮像", "C. 燃灯佛像", "D. 药师佛像"], "answer": "B", "explain": "弥勒像背后供奉戴盔披甲、手持降魔金刚杵的韦驮像，面对后方的大雄宝殿。殿外东钟西鼓，门前有铜狮一对。", "source": "弥勒像背后供奉戴盔披甲、手持降魔金刚杵的韦驮像（面对后方的大雄宝殿/雍和宫大殿）。殿外东钟西鼓，门前有铜狮一对。", "layer": "ext"}, {"section": "雍和宫", "type": "judge", "q": "御碑亭内《喇嘛说》方碑南面刻汉文、北面刻满文、东面刻蒙文、西面刻藏文。", "answer": "错", "explain": "方碑南面满文、北面汉文、东面蒙文、西面藏文，题干南北两面文字颠倒了。", "source": "方碑四面文字：御碑亭内方碑四面分别镌刻满、汉、蒙、藏四种文字的《喇嘛说》（南面满文、北面汉文、东面蒙文、西面藏文）。", "layer": "ext"}, {"section": "雍和宫", "type": "single", "q": "雍和宫大殿（雍和宫殿）在雍亲王府时期称为什么？", "options": ["A. 银安殿", "B. 神御殿", "C. 天王殿", "D. 大佛楼"], "answer": "A", "explain": "雍和宫大殿在雍亲王府时期为银安殿，是雍亲王处理政务、举行礼仪、升殿受贺的场所。", "source": "雍和宫大殿（雍和宫殿，相当于一般寺庙的大雄宝殿）在雍亲王府时期为银安殿，是雍亲王处理政务、举行礼仪、升殿受贺的场所。", "layer": "ext"}, {"section": "雍和宫", "type": "judge", "q": "雍和宫的前身雍亲王府始建于雍正三年（1725年），是胤禛的府邸。", "answer": "错", "explain": "雍亲王府于康熙三十三年（1694年）始建；雍正三年（1725年）是升格为行宫、始称\"雍和宫\"。", "source": "三个时期：①雍亲王府时期（康熙三十三年/1694 年始建，胤禛的府邸）。", "layer": "ext"}, {"section": "雍和宫", "type": "multi", "q": "下列关于法轮殿的说法，正确的有（ ）。", "options": ["A. 平面呈十字形，四面各出抱厦", "B. 黄琉璃瓦顶上矗立五座镏金宝塔", "C. 是僧众集中诵经、举办重大佛事活动的核心场所，俗称\"大经堂\"", "D. 西墙经架陈列《丹珠尔》207部", "E. 为汉藏结合式建筑"], "answer": "ABCE", "explain": "法轮殿西墙陈列藏文《甘珠尔》（佛语部）108部，东墙陈列《丹珠尔》（论疏部）207部，D项方位错误。殿内还陈放大威德金刚坛城及乾隆\"洗三盆\"（鱼龙变化盆）。", "source": "法轮殿为汉藏结合式建筑，平面呈十字形，黄琉璃瓦顶上建五座天窗式暗楼，其上矗立五座镏金宝塔；西墙经架陈列藏文《甘珠尔》108 部，东墙经架陈列《丹珠尔》207 部。", "layer": "ext"}, {"section": "雍和宫", "type": "single", "q": "雍和宫大殿前的青铜须弥山，原为明代万历年间何人所供奉？", "options": ["A. 司礼监掌印太监冯保", "B. 太监魏忠贤", "C. 太监刘瑾", "D. 航海家郑和"], "answer": "A", "explain": "须弥山原为明代万历年间司礼监掌印太监冯保所供奉，后移置此处。山体高约1.5米、通高2.76米。", "source": "原为明代万历年间司礼监掌印太监冯保所供奉，后移置此处。", "layer": "ext"}, {"section": "雍和宫", "type": "judge", "q": "\"金瓶掣签\"制度由乾隆五十七年（1792年）颁布的《钦定藏内善后章程》确立。", "answer": "对", "explain": "原文明确此制由乾隆五十七年（1792年）《钦定藏内善后章程》确立。", "source": "此制由乾隆五十七年（1792 年）《钦定藏内善后章程》确立。", "layer": "ext"}, {"section": "雍和宫", "type": "single", "q": "雍和宫大殿内供奉的横三世佛中，位于西侧的是哪尊佛？", "options": ["A. 释迦牟尼佛", "B. 燃灯佛", "C. 弥勒佛", "D. 无量寿佛"], "answer": "B", "explain": "横三世佛：中间释迦牟尼佛（现在佛），西侧燃灯佛（过去佛），东侧弥勒佛（未来佛），两侧列十八罗汉像。", "source": "正中供奉横三世佛（竖三世佛）——中间释迦牟尼佛（现在佛），西侧燃灯佛（过去佛），东侧弥勒佛（未来佛），三尊均为青铜泥金佛像；两侧列十八罗汉像。", "layer": "ext"}, {"section": "雍和宫", "type": "judge", "q": "\"金瓶掣签\"中掣定西藏地区转世活佛的金瓶安供于北京雍和宫。", "answer": "错", "explain": "掣定西藏地区转世活佛的金瓶供奉于拉萨大昭寺；安供于北京雍和宫的一只掣定蒙古、青海等地转世活佛。", "source": "一只供奉于西藏拉萨大昭寺（掣定西藏地区转世活佛）；一只安供于北京雍和宫（掣定蒙古、青海等地转世活佛）。", "layer": "ext"}, {"section": "雍和宫", "type": "multi", "q": "下列关于法轮殿内五百罗汉山的说法，正确的有（ ）。", "options": ["A. 整座山体由紫檀木精雕而成", "B. 山高约2.5米、宽约3米", "C. 五百罗汉分别用金、银、铜、铁、锡五种金属铸造", "D. 每尊罗汉高约10厘米", "E. 五百罗汉为泥塑彩绘而成"], "answer": "ABCD", "explain": "五百罗汉山由紫檀木雕成，高约2.5米、宽约3米；罗汉用金、银、铜、铁、锡（五金）铸造，每尊高约10厘米，并非泥塑彩绘。", "source": "五百罗汉山材质：整座山体由紫檀木精雕而成（高约 2.5 米、宽约 3 米）。五百罗汉雕像材质：山上的五百罗汉分别用金、银、铜、铁、锡（五金）五种金属铸造，每尊高约 10 厘米。", "layer": "ext"}, {"section": "雍和宫", "type": "single", "q": "雍和宫大殿内释迦牟尼像左侧的弟子立像是哪位？", "options": ["A. 阿难", "B. 迦叶", "C. 目犍连", "D. 舍利弗"], "answer": "B", "explain": "释迦牟尼像左右弟子：左为迦叶、右为阿难两尊弟子立像。", "source": "释迦牟尼像左右弟子：左为迦叶、右为阿难两尊弟子立像。", "layer": "ext"}, {"section": "雍和宫", "type": "judge", "q": "雍和宫大殿在雍亲王府时期称为银安殿，是雍亲王处理政务、举行礼仪、升殿受贺的场所。", "answer": "对", "explain": "原文：雍和宫大殿在雍亲王府时期为银安殿，是接待文武官员的正殿；乾隆九年改庙后成为寺院正殿。", "source": "雍和宫大殿在雍亲王府时期为银安殿，是雍亲王处理政务、举行礼仪、升殿受贺的场所（接待文武官员的正殿）。", "layer": "ext"}, {"section": "雍和宫", "type": "single", "q": "乾隆皇帝撰写《喇嘛说》时的年龄是多少？", "options": ["A. 71周岁", "B. 81周岁", "C. 82周岁", "D. 91周岁"], "answer": "B", "explain": "《喇嘛说》碑立于乾隆五十七年（1792年），乾隆帝生于1711年，撰写时为81周岁（虚岁82岁）。", "source": "《喇嘛说》碑立于乾隆五十七年（1792 年），乾隆帝生于 1711 年，撰写时为其 81 周岁（虚岁 82 岁）。", "layer": "ext"}, {"section": "雍和宫", "type": "judge", "q": "雍和宫大殿前的青铜须弥山，原为明代万历年间司礼监掌印太监冯保所供奉，后移置此处。", "answer": "对", "explain": "原文明确须弥山原为明代万历年间司礼监掌印太监冯保所供奉，后移置于此。", "source": "原为明代万历年间司礼监掌印太监冯保所供奉，后移置此处。", "layer": "ext"}, {"section": "雍和宫", "type": "multi", "q": "雍和宫建筑群在清代历史上经历的三个时期包括（ ）。", "options": ["A. 雍亲王府时期", "B. 皇帝行宫时期", "C. 藏传佛教寺院时期", "D. 皇家园林时期"], "answer": "ABC", "explain": "三个时期为：雍亲王府时期（1694年始建）、行宫时期（1725年升格）、藏传佛教寺院时期（1744年改庙）。无皇家园林时期。", "source": "三个时期：①雍亲王府时期（康熙三十三年/1694 年始建）；②行宫时期（雍正三年/1725 年升格为皇帝行宫）；③藏传佛教寺院时期（乾隆九年/1744 年）。", "layer": "ext"}, {"section": "雍和宫", "type": "single", "q": "雍和宫永佑殿内正中供奉的是哪尊佛？", "options": ["A. 药师佛", "B. 狮吼佛", "C. 无量寿佛（长寿佛）", "D. 燃灯佛"], "answer": "C", "explain": "永佑殿正中及两侧供三尊白檀木雕佛像，各高2.35米：中间无量寿佛（长寿佛），东侧狮吼佛，西侧药师佛。", "source": "殿内供奉：正中及两侧供三尊白檀木雕佛像，各高 2.35 米——中间为无量寿佛（长寿佛），东侧为狮吼佛，西侧为药师佛。", "layer": "ext"}, {"section": "雍和宫", "type": "judge", "q": "雍和宫大殿内供奉的横三世佛中，东侧为燃灯佛（过去佛），西侧为弥勒佛（未来佛）。", "answer": "错", "explain": "东西两侧颠倒了：西侧为燃灯佛（过去佛），东侧为弥勒佛（未来佛），中间为释迦牟尼佛。", "source": "中间释迦牟尼佛（现在佛），西侧燃灯佛（过去佛），东侧弥勒佛（未来佛），三尊均为青铜泥金佛像。", "layer": "ext"}, {"section": "雍和宫", "type": "single", "q": "永佑殿内《绿度母》堆绫补绣像由谁主持制作？", "options": ["A. 乾隆皇帝生母孝圣宪皇后钮祜禄氏", "B. 孝庄文皇后", "C. 慈禧太后", "D. 乾隆皇后富察氏"], "answer": "A", "explain": "《绿度母》由乾隆生母孝圣宪皇后钮祜禄氏（\"甄嬛\"原型）主持，带领宫中绣女以数千块绸子制成。", "source": "《绿度母》制作者：殿内西壁供奉的《绿度母》堆绫补绣像，由乾隆皇帝生母孝圣宪皇后钮祜禄氏（\"甄嬛\"原型）主持。", "layer": "ext"}, {"section": "雍和宫", "type": "judge", "q": "雍和宫大殿内释迦牟尼像左侧弟子为阿难，右侧弟子为迦叶。", "answer": "错", "explain": "左右颠倒了：释迦牟尼像左为迦叶、右为阿难两尊弟子立像。", "source": "释迦牟尼像左右弟子：左为迦叶、右为阿难两尊弟子立像。", "layer": "ext"}, {"section": "雍和宫", "type": "multi", "q": "下列关于雍和宫改为藏传佛教寺院的原因及意义，正确的有（ ）。", "options": ["A. 孝敬父皇雍正，以佛力常年为先帝祈福", "B. 借宗教纽带团结蒙藏民族、安定边疆", "C. 按礼制先帝潜邸不可作常人居所，只能改为宗庙", "D. 成为清政府管理全国藏传佛教事务的中心", "E. 为乾隆皇帝本人出家修行之所"], "answer": "ABCD", "explain": "原因：孝敬父皇祈福、政治考量（\"兴黄教即所以安众蒙古\"）、礼制所限；意义：成为全国藏传佛教事务中心与连接中央同蒙藏地方的纽带。E项无据。", "source": "原因一是孝敬父皇雍正……二是深层政治考量——借宗教纽带团结蒙藏民族、安定边疆，且按礼制先帝潜邸不可作常人居所……成为清政府管理全国藏传佛教事务的中心。", "layer": "ext"}, {"section": "雍和宫", "type": "single", "q": "法轮殿内正中宗喀巴大师铜坐像高多少？", "options": ["A. 2.35米", "B. 6.1米", "C. 6.2米", "D. 18米"], "answer": "B", "explain": "法轮殿内正中宗喀巴大师铜坐像高6.1米，东西两侧各设一座讲经说法台。", "source": "法轮殿内正中宗喀巴大师铜坐像（高 6.1 米）东西两侧各设一座木质雕花高台经座（讲经说法台）。", "layer": "ext"}, {"section": "雍和宫", "type": "judge", "q": "雍和宫永佑殿内正中供奉的是药师佛。", "answer": "错", "explain": "永佑殿正中供奉无量寿佛（长寿佛），东侧为狮吼佛，西侧为药师佛。", "source": "正中及两侧供三尊白檀木雕佛像，各高 2.35 米——中间为无量寿佛（长寿佛），东侧为狮吼佛，西侧为药师佛。", "layer": "ext"}, {"section": "雍和宫", "type": "single", "q": "法轮殿内宗喀巴大师像两侧的讲经说法台，西经座为谁所用？", "options": ["A. 班禅大师", "B. 达赖喇嘛", "C. 章嘉活佛", "D. 哲布尊丹巴"], "answer": "B", "explain": "东西两座经座专为达赖、班禅来雍和宫讲法而设：东经座为班禅大师所用，西经座为达赖喇嘛所用。", "source": "专为达赖、班禅来雍和宫讲法而设：东经座为班禅大师所用，西经座为达赖喇嘛所用。", "layer": "ext"}, {"section": "雍和宫", "type": "judge", "q": "法轮殿内宗喀巴大师像两侧的讲经说法台，西经座为班禅大师所用，东经座为达赖喇嘛所用。", "answer": "错", "explain": "东西颠倒了：东经座为班禅大师所用，西经座为达赖喇嘛所用。", "source": "东经座为班禅大师所用，西经座为达赖喇嘛所用。", "layer": "ext"}, {"section": "雍和宫", "type": "multi", "q": "下列关于雍和宫宝坊院现存牌楼的说法，正确的有（ ）。", "options": ["A. 现存东、西、南三座牌楼", "B. 均建于清乾隆九年（1744年）", "C. 额题均为乾隆皇帝御笔", "D. 黄琉璃瓦顶，北牌楼等级最高", "E. 均为六柱五间式石牌楼"], "answer": "ABCD", "explain": "三座牌楼建于乾隆九年，额题均为乾隆御笔，规制为四柱三间七楼/九楼式木牌楼、黄琉璃瓦顶，北牌楼为ثلاث间四柱九楼庑殿顶等级最高。E项柱式材质均错。", "source": "现存三座牌楼（东、西、南各一），均建于清乾隆九年（1744 年），额题均为乾隆皇帝御笔。规制为四柱三间七楼/九楼式木牌楼，黄琉璃瓦顶（北牌楼等级最高）。", "layer": "ext"}, {"section": "雍和宫", "type": "single", "q": "雍和宫占地面积约6.6公顷，合多少平方米？", "options": ["A. 45,800平方米", "B. 60,400平方米", "C. 66,400平方米", "D. 76,400平方米"], "answer": "C", "explain": "原文：占地面积约6.6公顷（66,400平方米），官方与多数资料采用此数据。", "source": "占地面积：约 6.6 公顷（66,400 平方米）。", "layer": "ext"}, {"section": "雍和宫", "type": "judge", "q": "永佑殿内《绿度母》堆绫补绣像由乾隆皇帝生母孝圣宪皇后钮祜禄氏主持制成。", "answer": "对", "explain": "《绿度母》由孝圣宪皇后钮祜禄氏（\"甄嬛\"原型）主持，带领宫中绣女以数千块绸子、采用堆绣与补绣工艺制成。", "source": "《绿度母》堆绫补绣像，由乾隆皇帝生母孝圣宪皇后钮祜禄氏（\"甄嬛\"原型）主持，带领宫中绣女以数千块绸子制成。", "layer": "ext"}, {"section": "雍和宫", "type": "single", "q": "雍和宫属于藏传佛教的哪一派系？", "options": ["A. 宁玛派", "B. 萨迦派", "C. 噶举派", "D. 格鲁派"], "answer": "D", "explain": "雍和宫属于藏传佛教格鲁派，乾隆九年（1744年）改为格鲁派寺院。", "source": "派系：雍和宫属于藏传佛教格鲁派（俗称\"黄教\"，因僧人着黄衣黄帽得名）。", "layer": "ext"}, {"section": "雍和宫", "type": "multi", "q": "清代咸丰朝以前，雍和宫腊八粥的分配对象包括（ ）。", "options": ["A. 供佛、供僧", "B. 宫廷", "C. 王公大臣", "D. 京城百姓", "E. 外国使节"], "answer": "ABCD", "explain": "腊八粥除供佛、供僧外，还分赐宫廷、王公大臣、寺院僧人及京城百姓等，规模盛大。无分赐外国使节之说。", "source": "雍和宫每年腊八节熬制腊八粥，除供佛、供僧外，还分赐宫廷、王公大臣、寺院僧人及京城百姓等，规模盛大。", "layer": "ext"}, {"section": "雍和宫", "type": "single", "q": "藏传佛教格鲁派俗称\"黄教\"，其得名原因是什么？", "options": ["A. 僧人着黄衣黄帽", "B. 寺院均覆黄琉璃瓦", "C. 以黄色哈达为最高礼遇", "D. 宗喀巴出生于黄土高原"], "answer": "A", "explain": "原文：格鲁派俗称\"黄教\"，因僧人着黄衣黄帽得名。", "source": "派系：雍和宫属于藏传佛教格鲁派（俗称\"黄教\"，因僧人着黄衣黄帽得名）。", "layer": "ext"}, {"section": "雍和宫", "type": "single", "q": "出生于雍亲王府（今雍和宫）如意室的皇帝是哪一位？", "options": ["A. 康熙帝", "B. 雍正帝", "C. 乾隆帝", "D. 嘉庆帝"], "answer": "C", "explain": "乾隆帝（弘历）生于雍亲王府如意室；雍正帝本人出生于紫禁城，并非生于雍王府。", "source": "出生于雍王府的皇帝：乾隆帝（弘历），生于雍亲王府（今雍和宫）如意室。", "layer": "ext"}, {"section": "雍和宫", "type": "multi", "q": "下列关于雍和宫中轴线上主要建筑匾额的说法，正确的有（ ）。", "options": ["A. 多为乾隆皇帝亲笔题写", "B. 文字采用满、汉、蒙、藏四种文字", "C. 包括\"雍和宫\"\"万福阁\"\"昭泰门\"等匾额", "D. 均为雍正皇帝御笔题写"], "answer": "ABC", "explain": "中轴线上主要建筑（昭泰门、雍和门、雍和宫殿、万福阁等）匾额多为乾隆亲笔，用满、汉、蒙、藏四种文字。D项雍正御笔错误。", "source": "中轴线上主要建筑（昭泰门、雍和门、雍和宫殿、万福阁等）的匾额多为乾隆皇帝亲笔题写，匾额文字采用满、汉、蒙、藏四种文字。", "layer": "ext"}, {"section": "雍和宫", "type": "single", "q": "雍正帝驾崩后，其梓宫（棺椁）曾停灵于雍和宫的哪座殿宇？", "options": ["A. 法轮殿", "B. 雍和宫大殿", "C. 永佑殿", "D. 万福阁"], "answer": "C", "explain": "雍正十三年（1735年）雍正帝驾崩后，梓宫停灵于永佑殿（雍正即位前的正寝殿，后改名\"神御殿\"）。", "source": "雍正十三年（1735 年）雍正帝驾崩后，梓宫（棺椁）曾停灵于雍和宫的永佑殿。", "layer": "ext"}, {"section": "雍和宫", "type": "single", "q": "为迎雍正帝梓宫，雍和宫主要殿宇在多少日内改覆黄琉璃瓦？", "options": ["A. 七日", "B. 十五日", "C. 三十日", "D. 四十九日"], "answer": "B", "explain": "原文：为迎棺椁，雍和宫主要殿宇在十五日内改覆黄琉璃瓦。", "source": "为迎棺椁，雍和宫主要殿宇在十五日内改覆黄琉璃瓦。", "layer": "ext"}, {"section": "雍和宫", "type": "multi", "q": "下列关于雍和宫永佑殿内供奉造像的说法，正确的有（ ）。", "options": ["A. 供三尊白檀木雕佛像", "B. 各高2.35米", "C. 东侧为狮吼佛", "D. 西侧为药师佛", "E. 正中为燃灯佛"], "answer": "ABCD", "explain": "永佑殿正中及两侧供三尊白檀木雕佛像，各高2.35米：中间无量寿佛（长寿佛）、东狮吼佛、西药师佛。E项正中为燃灯佛错误。", "source": "正中及两侧供三尊白檀木雕佛像，各高 2.35 米——中间为无量寿佛（长寿佛），东侧为狮吼佛，西侧为药师佛。", "layer": "ext"}, {"section": "雍和宫", "type": "single", "q": "雍和宫每年跳金刚驱魔神舞的具体日期是哪两天？", "options": ["A. 正月初一、正月十五日", "B. 正月二十九日、二月初一日", "C. 二月初八日、二月十五日", "D. 腊月初八日、腊月二十三日"], "answer": "B", "explain": "正月二十九日、二月初一日（大建为三十日）两天跳金刚驱魔神舞（俗称\"打鬼\"\"跳布扎\"）。", "source": "其中正月二十九日、二月初一日（大建为三十日）两天跳金刚驱魔神舞（俗称\"打鬼\"\"跳布扎\"，藏语\"羌姆\"）。", "layer": "ext"}, {"section": "雍和宫", "type": "single", "q": "雍和宫每年举办\"大愿祈祷法会\"（善愿日/传昭大会）的时间是？", "options": ["A. 农历正月初一日至正月十五日", "B. 农历正月二十三日至二月初一日", "C. 农历二月初一日至二月初八日", "D. 农历腊月初一日至腊月初八日"], "answer": "B", "explain": "雍和宫每年农历正月二十三日至二月初一日举办\"大愿祈祷法会\"。", "source": "雍和宫每年农历正月二十三日至二月初一日举办\"大愿祈祷法会\"（善愿日/传昭大会）。", "oos": true, "layer": "ext"}, {"section": "雍和宫", "type": "multi", "q": "下列属于法轮殿内陈设的有（ ）。", "options": ["A. 藏文《甘珠尔》（佛语部）108部", "B. 《丹珠尔》（论疏部）207部", "C. 五彩金刚砂制成的大威德金刚坛城", "D. 相传为乾隆出生第三天洗浴所用的鱼龙变化盆（洗三盆）", "E. 青铜铸造的大威德金刚坛城"], "answer": "ABCD", "explain": "法轮殿西墙陈列《甘珠尔》108部、东墙《丹珠尔》207部；坛城以五彩金刚砂制成而非青铜铸造；鱼龙变化盆相传为乾隆\"洗三盆\"。E项材质错误。", "source": "西墙经架陈列藏文《甘珠尔》108 部，东墙经架陈列《丹珠尔》207 部；陈放用五彩金刚砂制成的大威德金刚坛城；鱼龙变化盆相传为乾隆皇帝出生第三天洗浴所用的\"洗三盆\"。", "layer": "ext"}, {"section": "雍和宫", "type": "single", "q": "雍和宫熬腊八粥所用的大铜锅重约多少？", "options": ["A. 3吨", "B. 5吨", "C. 8吨", "D. 12吨"], "answer": "C", "explain": "大铜锅高1.5米、直径2.5米、重约8吨，为雍和宫\"四宝\"之一。", "source": "大铜锅尺寸：雍和门前鼓楼脚下的大铜锅，高 1.5 米、直径 2.5 米、重约 8 吨。", "layer": "ext"}, {"section": "雍和宫", "type": "single", "q": "雍和宫熬腊八粥所用的大铜锅由何机构制造？", "options": ["A. 清宫造办处", "B. 景德镇御窑厂", "C. 西藏雪堆白作坊", "D. 京城民间铜匠铺"], "answer": "A", "explain": "大铜锅由清宫造办处制造，为雍和宫\"四宝\"之一，原置于东阿斯门外铜锅院。", "source": "重约 8 吨，由清宫廷造办处制造，为雍和宫\"四宝\"之一（原置于东阿斯门外铜锅院，腊八节用以熬粥）。", "layer": "ext"}, {"section": "雍和宫", "type": "single", "q": "万福阁内迈达拉佛（弥勒大佛）于哪一年载入《吉尼斯世界纪录》？", "options": ["A. 1980年", "B. 1986年", "C. 1990年", "D. 1996年"], "answer": "C", "explain": "迈达拉佛1990年载入《吉尼斯世界纪录》，为中国最大的独木雕佛。", "source": "1990 年载入《吉尼斯世界纪录》，为中国最大的独木雕佛。", "layer": "ext"}, {"section": "雍和宫", "type": "single", "q": "万福阁内迈达拉佛（弥勒站像）的材质是什么？", "options": ["A. 整株白檀木", "B. 金丝楠木", "C. 紫檀木", "D. 青铜泥金"], "answer": "A", "explain": "迈达拉佛由整株白檀木（白檀香木）雕成，为雍和宫\"木雕三绝\"之一。", "source": "万福阁内迈达拉佛（弥勒站像）由整株白檀木（白檀香木）雕成。", "layer": "ext"}, {"section": "雍和宫", "type": "single", "q": "御碑亭内《喇嘛说》方碑的高度是多少？", "options": ["A. 2.76米", "B. 6.1米", "C. 6.2米", "D. 6.6米"], "answer": "C", "explain": "御碑亭内方碑高6.2米、每面宽1.45米，四面镌刻满、汉、蒙、藏四种文字的《喇嘛说》。", "source": "御碑亭内方碑（高 6.2 米、每面宽 1.45 米）四面分别镌刻满、汉、蒙、藏四种文字的《喇嘛说》。", "layer": "ext"}, {"section": "雍和宫", "type": "single", "q": "御碑亭内《喇嘛说》方碑的西面镌刻的是哪种文字？", "options": ["A. 满文", "B. 汉文", "C. 蒙文", "D. 藏文"], "answer": "D", "explain": "方碑南面满文、北面汉文、东面蒙文、西面藏文。", "source": "（南面满文、北面汉文、东面蒙文、西面藏文），上覆石雕宝盖，下雕莲花宝座。", "layer": "ext"}, {"section": "雍和宫", "type": "single", "q": "\"万福阁\"名称的由来是什么？", "options": ["A. 建庙初期阁内各层供奉小佛像近万尊，\"佛\"与\"福\"读音相近", "B. 乾隆皇帝御赐阁名，祈愿万福", "C. 阁内收藏佛经近万卷，\"卷\"谐音\"福\"", "D. 为雍正帝祈福万寿无疆而建"], "answer": "A", "explain": "建庙初期阁内各层供奉小佛像近万尊，因\"佛\"与\"福\"读音相近，故得名\"万福阁\"（亦作\"万佛阁\"）。", "source": "建庙初期阁内各层供奉小佛像近万尊，因\"佛\"与\"福\"读音相近，故得名\"万福阁\"（亦作\"万佛阁\"）。", "layer": "ext"}, {"section": "雍和宫", "type": "single", "q": "万福阁院落东侧昭佛楼内供奉的主尊造像是哪一尊？", "options": ["A. 旃檀佛（旃檀释迦牟尼立像）", "B. 迈达拉佛", "C. 绿度母像", "D. 无量寿佛"], "answer": "A", "explain": "昭佛楼内供奉主尊旃檀佛（旃檀释迦牟尼立像），铜质镀金立像；昭佛楼原为乾隆生母孝圣宪皇后私用佛堂。", "source": "昭佛楼（原为乾隆生母孝圣宪皇后私用佛堂）内供奉的主尊为旃檀佛（旃檀释迦牟尼立像）——铜质镀金立像。", "layer": "ext"}, {"section": "雍和宫", "type": "single", "q": "昭佛楼内旃檀佛立像属于哪种典型造像风格？", "options": ["A. 吴带当风", "B. 曹衣出水", "C. 秀骨清像", "D. 健陀罗式"], "answer": "B", "explain": "旃檀佛为典型唐式\"曹衣出水\"风格，右手举与胸齐作无畏印，左手下垂作与愿印。", "source": "为典型唐式\"曹衣出水\"风格（右手举与胸齐作无畏印，左手下垂作与愿印）。", "layer": "ext"}, {"section": "雍和宫", "type": "single", "q": "戒台楼建于何时、因何而建？", "options": ["A. 乾隆九年，改宫建庙时", "B. 乾隆四十五年，为迎六世班禅进京、乾隆受戒而建", "C. 乾隆五十七年，为立《喇嘛说》碑而建", "D. 雍正三年，王府升格行宫时"], "answer": "B", "explain": "戒台楼位于法轮殿西侧，建于乾隆四十五年（1780年），为迎六世班禅进京、乾隆受戒而建；楼内戒台以汉白玉石雕砌而成。", "source": "戒台楼位于法轮殿西侧，建于乾隆四十五年（1780 年），为迎六世班禅进京、乾隆受戒而建。", "layer": "ext"}, {"section": "雍和宫", "type": "single", "q": "万福阁内迈达拉佛左右后方\"凤眼香\"的材质是什么？", "options": ["A. 沉香木", "B. 檀香木", "C. 古代植物化石（硅化木）", "D. 金丝楠木"], "answer": "C", "explain": "\"凤眼香\"材质为古代植物化石（硅化木/树木化石），由蒙古沙漠采来，为珍贵天然奇木。", "source": "万福阁内迈达拉佛左右后方的\"凤眼香\"，材质为古代植物化石（硅化木/树木化石），由蒙古沙漠采来。", "layer": "ext"}, {"section": "奥林匹克公园", "layer": "core", "type": "single", "q": "北京奥林匹克公园区域内集中了北京市31个奥运场馆中的（ ）。", "options": ["33%", "44%", "55%", "66%"], "answer": "B", "explain": "背诵版明确：奥林匹克公园容纳北京市31个奥运场馆中的44%。", "source": "容纳北京市 31 个奥运场馆中的 44%"}, {"section": "奥林匹克公园", "layer": "core", "type": "judge", "q": "北京奥林匹克公园位于朝阳区中轴线最北端，总占地面积约11.59平方公里。", "answer": "对", "explain": "背诵版明确：北京奥林匹克公园位于朝阳区中轴线最北端，总占地11.59平方公里。", "source": "朝阳区中轴线最北端；总占地 11.59 平方公里"}, {"section": "奥林匹 国家体育馆：竞技体操、蹦床、手球（决赛；预赛在奥体中心体育馆）；残奥会轮椅篮球"}, {"section": "奥林匹克公园", "layer": "core", "type": "judge", "q": "2008年奥运会和2022年冬奥会的主体育场均为国家体育场（鸟巢），它是唯一的双奥开闭幕式场馆。", "answer": "对", "explain": "背诵版明确：两届奥运会主体育场均为国家体育场（鸟巢），是唯一双奥开闭幕式场馆。", "source": "主体育场均为国家体育场（鸟巢，唯一双奥开闭幕式场馆）"}, {"section": "奥林匹克公园", "layer": "core", "type": "single", "q": "2008年北京奥运会火炬传递的主题和火炬名称分别是（ ）。", "options": ["“和谐之旅”，“祥云”", "“和谐之旅”，“飞扬”", "“点燃激情 传递梦想”，“祥云”", "“一起向未来”，“飞扬”"], "answer": "A", "explain": "2008年火炬传递主题为“和谐之旅”，口号“点燃激情 传递梦想”，火炬名“祥云”；C把口号当成了主题。", "source": "主题“和谐之旅”、口号“点燃激情 传递梦想”、火炬“祥云”"}, {"section": "奥林匹克公园", "layer": "core", "type": "judge", "q": "2008年北京奥运会开幕式按简体中文笔画排序入场，首先入场的是中国代表队，主题曲《我和你》由刘欢和莎拉·布莱曼演唱。", "answer": "错", "explain": "按简体中文笔画排序入场，首先入场的是希腊代表队，不是中国队；主题曲表述正确。", "source": "按简体中文笔画排序、首先入场希腊；主题曲《我和你》（刘欢、莎拉·布莱曼）"}, {"section": "奥林匹克公园", "layer": "core", "type": "multi", "q": "关于北顶娘娘庙，下列说法正确的有（ ）。", "options": ["位于水立方南侧，其景观“北顶飞霞”为奥园十八景之一", "占地约10000平方米，为四进院落", "院落顺序为山门殿、天王殿、娘娘殿、东岳殿、玉皇殿", "2003年被列为第七批全国重点文物保护单位", "为保护该庙，水立方北移约100米"], "answer": "ABCE", "explain": "2003年北顶娘娘庙列为第七批“市级”文物保护单位，不是全国重点文物保护单位，D错误；现为北京民俗博物馆分馆。", "source": "水立方南侧；景观“北顶飞霞”（奥园十八景）；占地约 10000 平方米；山门殿→天王殿→娘娘殿→东岳殿→玉皇殿（四进院落）；2003 年第七批市级文保；为保庙水立方北移约 100 米"}, {"section": "奥林匹克公园", "layer": "core", "type": "single", "q": "2008年北京奥运会开幕式上，点燃“祥云”主火炬的中国运动员是（ ）。", "options": ["姚明", "李宁", "刘欢", "许海峰"], "answer": "B", "explain": "由“体操王子”李宁点燃主火炬；姚明是中国代表团旗手，刘欢是主题曲演唱者。", "source": "旗手姚明；点火李宁（“体操王子”）"}, {"section": "奥林匹克公园", "layer": "core", "type": "judge", "q": "2008年北京奥运会的特设项目是武术，其奖牌计入奥运奖牌榜。", "answer": "错", "explain": "特设项目确为武术，但它既非表演也非正式比赛项目，奖牌不计入奥运奖牌榜。", "source": "奥运史上首个特设项目（既非表演也非正式比赛项目）；奖牌不计入奥运奖牌榜"}, {"section": "奥林匹克公园", "layer": "core", "type": "single", "q": "2008年北京奥运会期间，唯一接受港澳台和海外侨胞捐资兴建的场馆是（ ）。", "options": ["国家体育场（鸟巢）", "国家游泳中心（水立方）", "国家体育馆", "国家会议中心"], "answer": "B", "explain": "唯一捐资场馆是国家游泳中心（水立方），捐款超8.3亿元人民币，其中最大一笔为霍英东2亿港元。", "source": "唯一捐资场馆：国家游泳中心（水立方）；捐款超 8.3 亿元人民币（最大一笔霍英东 2 亿港元）"}, {"section": "奥林匹克公园", "layer": "core", "type": "judge", "q": "2015年7月31日，在马来西亚吉隆坡举行的国际奥委会第128次全会上，巴赫宣布北京获得第24届冬奥会主办权。", "answer": "对", "explain": "背诵版明确：2015年7月31日，马来西亚吉隆坡，国际奥委会第128次全会，巴赫宣布，北京以44票对40票战胜阿拉木图。", "source": "2015 年 7 月 31 日；马来西亚吉隆坡；国际奥委会第 128 次全会；巴赫宣布；44 票对 40 票胜阿拉木图"}, {"section": "奥林匹克公园", "layer": "core", "type": "multi", "q": "关于2008年北京奥运会火炬传递的规模，下列说法正确的有（ ）。", "options": ["3月24日在希腊奥林匹亚取火，历时130天", "总里程约13.7万公里，其中境内约4万公里", "火炬手21880名，另有护跑手5000名", "境外传递经过21个城市，境内覆盖31省区市113个城市和地区", "5月8日奥运圣火首次登上珠穆朗玛峰"], "answer": "ABCDE", "explain": "各选项均与背诵版一致；该次传递是奥运史上传递距离最长、范围最广、人数最多的一次。", "source": "3 月 24 日希腊奥林匹亚取火；历时 130 天；总里程约 13.7 万公里（境外 9.7＋境内 4 万）；火炬手 21880 名＋护跑手 5000；境外 21 个城市；境内 31 省区市 113 个城市和地区；5 月 8 日首登珠峰"}, {"section": "奥林匹克公园", "layer": "core", "type": "single", "q": "2008年北京奥林匹克水上公园位于（ ），承担赛艇、皮划艇、马拉松游泳项目，产生32枚金牌。", "options": ["朝阳区", "海淀区", "顺义区", "延庆区"], "answer": "C", "explain": "北京奥林匹克水上公园位于顺义区潮白河畔。", "source": "水上公园位于顺义区（潮白河畔）；赛艇、皮划艇、马拉松游泳，产生 32 枚金牌"}, {"section": "奥林匹克公园", "layer": "core", "type": "judge", "q": "2022年北京冬奥会延庆赛区主要承办高山滑雪、雪车、雪橇项目，产生21枚金牌；本届冬奥会共有91个国家和地区参赛。", "answer": "对", "explain": "背诵版明确：延庆赛区承办高山滑雪、雪车、雪橇（21枚金牌）；冬奥会参赛91个国家和地区（冬残奥会为48个）。", "source": "延庆（高山滑雪、雪车、雪橇，21 枚金牌）；参赛 91 个国家和地区（勿混：冬残奥会 48 个国家和地区）"}, {"section": "奥林匹克公园", "layer": "core", "type": "single", "q": "2008年北京奥运会武术特设项目的举办时间和地点是（ ）。", "options": ["8月21日至24日，奥体中心体育馆", "8月21日至24日，国家体育馆", "8月8日至24日，奥体中心体育馆", "8月8日至24日，北京射击馆"], "answer": "A", "explain": "武术特设项目于2008年8月21日至24日在奥体中心体育馆举行，设15枚金牌，有43个国家和地区的128名运动员参加。", "source": "2008 年 8 月 21 日至 24 日；奥体中心体育馆；15 枚金牌；43 个国家和地区 128 名运动员"}, {"section": "奥林匹克公园", "layer": "core", "type": "judge", "q": "北京是世界上唯一的'双奥之城'。", "answer": "对", "explain": "2008年北京举办第29届夏季奥运会，2022年又举办第24届冬季奥运会，北京由此成为奥林匹克历史上第一座（也是目前唯一一座）既举办过夏季奥运会又举办过冬季奥运会的城市。", "source": "世界上唯一的'双奥之城'是北京（中国北京）……北京由此成为奥林匹克历史上第一座（也是目前唯一一座）既举办过夏季奥运会又举办过冬季奥运会的城市。", "patch": true}, {"section": "奥林匹克公园", "layer": "core", "type": "multi", "q": "关于2008年北京奥运会奖牌，下列说法正确的有（ ）。", "options": ["采用“金镶玉”设计，直径70毫米、厚6毫米",
