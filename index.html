"北京地区的红色教育基地", "type": "multi", "q": "下列属于圆明园西洋楼景区“西洋十景”的有（　）。", "options": ["A. 谐奇趣", "B. 海晏堂", "C. 大水法", "D. 听鹂轩"], "answer": "ABC", "explain": "西洋十景包括谐奇趣、万花阵、养雀笼、方外观、海晏堂、远瀛观、大水法、观水法、线法山、线法墙等；听鹂轩是宋庆龄故居内的古建筑。", "source": "建成“西洋十景”：谐奇趣、万花阵（迷宫）、养雀笼、方外观、海晏堂、远瀛观、大水法、观水法、线法山、线法墙（画）等"}, {"section": "北京地区的红色教育基地", "type": "single", "q": "由北京党组织创办的第一所工人学校是（　）。", "options": ["A. 长辛店劳动补习学校", "B. 中法大学", "C. 国立蒙藏学校", "D. 留法勤工俭学法文预备学校"], "answer": "A", "explain": "长辛店劳动补习学校1921年1月正式开学，是北京党组织创办的第一所工人学校，毛泽东评价“中国工人运动还是从长辛店铁路工厂开始的”。", "source": "由北京党组织创办的第一所工人学校是长辛店劳动补习学校……1921年1月正式开学"}, {"section": "北京地区的红色教育基地", "type": "judge", "q": "卢沟桥原名“广利桥”，因永定河旧称卢沟河，元代改称卢沟桥，西方又称“马可·波罗桥”。", "answer": "对", "explain": "卢沟桥初名“广利”，因永定河旧称卢沟河，元代改称卢沟桥；西方又称“马可·波罗桥”，“卢沟晓月”为燕京八景之一。", "source": "卢沟桥的原名为“广利桥”（初名“广利”，因永定河旧称卢沟河，元代改称卢沟桥）；西方又称“马可·波罗桥”"}, {"section": "北京地区的红色教育基地", "type": "single", "q": "被誉为“人民第一堡垒”的红色景观是（　）。", "options": ["A. 古北口长城抗战纪念馆", "B. 北京焦庄户地道战遗址", "C. 房山区堂上村", "D. 长辛店工人俱乐部"], "answer": "B", "explain": "1947年11月顺义县人民政府授予焦庄户村“人民第一堡垒”光荣称号，即北京焦庄户地道战遗址。", "source": "1947年11月，顺义县人民政府授予焦庄户村“人民第一堡垒”光荣称号"}, {"section": "北京地区的红色教育基地", "type": "judge", "q": "《共产党宣言》首个中文全译本由陈望道依据英文译本并参照日文译本翻译完成。", "answer": "错", "explain": "陈望道是依据日文译本并参照英文译本翻译的，题干将二者颠倒了。", "source": "翻译者是陈望道（浙江义乌分水塘村人），依据日文译本并参照英文译本翻译，1920年4月下旬完成译稿"}, {"section": "北京地区的红色教育基地", "type": "multi", "q": "中国国家博物馆“古代中国”基本陈列中展出的商周青铜器有（　）。", "options": ["A. “后母戊”青铜方鼎", "B. 四羊青铜方尊", "C. “利”青铜簋", "D. “盂”青铜鼎"], "answer": "ABCD", "explain": "四者均为“古代中国”基本陈列夏商西周部分展出的著名青铜器：后母戊鼎为已知最重的青铜器，四羊方尊是现存商代最大青铜方尊，利簋称“西周第一青铜器”，大盂鼎为西周册命物证。", "source": "展出的著名商周青铜器主要有：“后母戊”青铜方鼎……四羊青铜方尊……“利”青铜簋……“盂”青铜鼎"}, {"section": "北京地区的红色教育基地", "type": "single", "q": "歌曲《没有共产党就没有新中国》的创作者是（　）。", "options": ["A. 曹火星", "B. 马福", "C. 张爱萍", "D. 萧克"], "answer": "A", "explain": "1943年晋察冀边区群众剧社19岁的共产党员曹火星在房山区堂上村创作此歌；马福是焦庄户老村长，张爱萍题写焦庄户馆名。", "source": "晋察冀边区群众剧社19岁的共产党员曹火星随创作小分队来到堂上村……连夜创作了歌曲《没有共产党就没有中国》（初稿）"}, {"section": "北京地区的红色教育基地", "type": "judge", "q": "五四运动孕育的五四精神以爱国、进步、民主、科学为主要内容，其核心是科学精神。", "answer": "错", "explain": "五四精神的核心是爱国主义精神，不是科学精神。", "source": "五四运动孕育了以爱国、进步、民主、科学为主要内容的伟大五四精神，其核心是爱国主义精神"}, {"section": "北京地区的红色教育基地", "type": "single", "q": "中国共产党“进京赶考”的第一站是（　）。", "options": ["A. 西柏坡", "B. 香山（双清别墅）", "C. 中南海", "D. 北大红楼"], "answer": "B", "explain": "1949年3月23日毛泽东率中央机关离开西柏坡“进京赶考”，3月25日进驻香山，毛泽东住进双清别墅，香山被称为“进京赶考第一站”。", "source": "1949年3月23日毛泽东率中共中央机关、解放军总部离开西柏坡“进京赶考”，3月25日抵达北平、进驻香山"}, {"section": "北京地区的红色教育基地", "type": "judge", "q": "1918年10月邵飘萍在北京独资创办《京报》，创刊时手书“铁肩辣手”四字悬于编辑室。", "answer": "对", "explain": "邵飘萍1918年10月在北京独资创办《京报》，编辑部初设宣武门外魏染胡同30、32号，创刊时手书“铁肩辣手”悬于编辑室。", "source": "1918年10月邵飘萍在北京独资创办《京报》，编辑部初设宣武门外魏染胡同30、32号……创刊时手书“铁肩辣手”悬于编辑室"}, {"section": "北京地区的红色教育基地", "type": "multi", "q": "下列关于北京奥林匹克公园的说法正确的有（　）。", "options": ["A. 是北京传统城市中轴线向北的延长线", "B. “鸟巢”居东、“水立方”居西，演绎“天圆地方”理念", "C. 龙形水系与古城“六海”形成“双龙拱卫中轴”景观", "D. 北端以人工堆筑的仰山压轴，与景山南北呼应", "E. 使北京城市中轴线缩短至13公里"], "answer": "ABCD", "explain": "2008年奥运会后北京中轴线向北延伸至26公里而非缩短至13公里（13公里是1990年亚运会北延后的长度）；其余四项均与原文相符。", "source": "奥林匹克公园是北京传统城市中轴线向北的延长线……使北京城市中轴线延伸至26公里"}, {"section": "北京地区的红色教育基地", "type": "single", "q": "长辛店二七纪念馆馆名的题写者是（　）。", "options": ["A. 邓小平", "B. 彭真", "C. 江泽民", "D. 张爱萍"], "answer": "B", "explain": "长辛店二七纪念馆馆名由彭真（时任全国人大常委会委员长）亲笔题写；邓小平题写的是中国人民抗日战争纪念馆馆名。", "source": "长辛店二七纪念馆馆名由彭真（时任全国人大常委会委员长）亲笔题写"}, {"section": "北京地区的红色教育基地", "type": "judge", "q": "1923年京汉铁路“二七”大罢工的指挥部设在长辛店大街的火神庙。", "answer": "错", "explain": "指挥部设在长辛店大街174号的“刘铁铺”（工人俱乐部旧址）；火神庙是当年警察局驻地、惨案发生地之一，二者不可混淆。", "source": "二七大罢工指挥部设在长辛店工人俱乐部旧址，即丰台区长辛店大街174号的“刘铁铺”……火神庙，当时是警察局驻地"}, {"section": "北京地区的红色教育基地", "type": "single", "q": "中国人民革命军事博物馆楼顶托举的“八一”军徽直径为（　）。", "options": ["A. 5米", "B. 6米", "C. 8米", "D. 10米"], "answer": "B", "explain": "军事博物馆展览大楼高94.7米，顶端托举着直径6米的镀金中国人民解放军“八一”军徽。", "source": "展览大楼中央7层、两侧4层，高94.7米，顶端托举着金碧辉煌、直径6米的镀金中国人民解放军“八一”军徽"}, {"section": "北京地区的红色教育基地", "type": "judge", "q": "1924—1925年期间，中法大学党支部书记由陈毅担任。", "answer": "对", "explain": "陈毅1923年入中法大学学习并由团员转为党员，1924—1925年任中法大学党支部书记；1923年书记为肖明。", "source": "1924—1925年，中法大学党支部书记由陈毅担任；陈毅1923年进入中法大学学习并由团员转为党员"}, {"section": "北京地区的红色教育基地", "type": "multi", "q": "下列关于卢沟桥与宛平城的说法正确的有（　）。", "options": ["A. 卢沟桥为11孔联拱石桥，全长266.5米、宽9.3米", "B. 卢沟桥1961年列为第一批全国重点文物保护单位", "C. 宛平城位于卢沟桥东侧，明代原名“拱北城”", "D. 宛平城东西长640米、南北宽320米", "E. 宛平城设有东、南两座城门"], "answer": "ABCD", "explain": "宛平城只有东“顺治门”、西“永昌门”两座城门，是东西向设门而非东、南两座；其余各项均与原文相符。", "source": "为11孔联拱石桥，全长266.5米、宽9.3米……1961年列为第一批全国重点文物保护单位……城东西长640米、南北宽320米，只有东“顺治门”、西“永昌门”两座城门"}, {"section": "北京地区的红色教育基地", "type": "single", "q": "圆明园“西洋楼景区”的设计者是（　）。", "options": ["A. 意大利传教士郎世宁", "B. 法国神甫蒋友仁", "C. 王致诚", "D. 熊希龄"], "answer": "A", "explain": "西洋楼由意大利传教士郎世宁设计，法国神甫蒋友仁协助，王致诚等参与，中国工匠施工。", "source": "由意大利传教士郎世宁设计，法国神甫蒋友仁协助（另有王致诚、艾启蒙、杨自新、利博明、戴卡维等参与），中国工匠施工"}, {"section": "北京地区的红色教育基地", "type": "judge", "q": "中国共产党第一位女党员缪伯英是湖南长沙人，中国共产党成立后曾任西城支部第一任书记。", "answer": "对", "explain": "缪伯英（1899—1929，湖南长沙人）是党史上第一名女团员、第一名女党员，党成立后任西城支部第一任书记。", "source": "中国共产党第一位女党员是缪伯英（1899—1929，湖南长沙人）……中国共产党成立后任西城支部第一任书记"}, {"section": "北京地区的红色教育基地", "type": "single", "q": "1986年天安门广场被评为“北京十六景”之一的景观名称是（　）。", "options": ["A. 紫禁余晖", "B. 天安丽日", "C. 卢沟狮醒", "D. 红楼大观"], "answer": "B", "explain": "1986年评选的“北京十六景”中，天安门广场以“天安丽日”之名当选；“紫禁余晖”指故宫，“卢沟狮醒”指卢沟桥。", "source": "天安门广场即以“天安丽日”之名当选"}, {"section": "北京地区的红色教育基地", "type": "judge", "q": "长辛店二七纪念馆馆名由时任国家副主席王震亲笔题写。", "answer": "错", "explain": "馆名由彭真（时任全国人大常委会委员长）题写；王震是1983年奠基时的时任国家副主席，二人角色不可混淆。", "source": "长辛店二七纪念馆馆名由彭真（时任全国人大常委会委员长）亲笔题写……时任国家副主席王震奠基"}, {"section": "北京地区的红色教育基地", "type": "multi", "q": "下列关于北大“红楼”的说法正确的有（　）。", "options": ["A. 1916年动工、1918年8月落成", "B. 因楼体主要用红砖砌成而得名", "C. 位于今东城区五四大街29号，平面呈“工”字形", "D. 是新文化运动的营垒、五四爱国运动的策源地", "E. 毛泽东曾在此任北大图书馆馆长"], "answer": "ABCD", "explain": "毛泽东在北大图书馆任的是助理员而非馆长；1920年10月李大钊在红楼创建北京共产主义小组，其余各项均与原文相符。", "source": "红楼建于1916年动工、1918年8月落成……因楼体主要用红砖砌成……位于今东城区五四大街29号，平面呈“工”字形……毛泽东曾在此任图书馆助理员"}, {"section": "北京地区的红色教育基地", "type": "single", "q": "北京市规划展览馆的前身是（　）。", "options": ["A. 前门商业大厦", "B. 老北京火车站", "C. 首都博物馆", "D. 北京展览馆"], "answer": "A", "explain": "北京市规划展览馆位于东城区前门东大街20号（老北京火车站东侧），由原前门商业大厦改扩建而成，2004年9月24日开放。", "source": "是由原前门商业大厦（曾火爆京城的一座商场）改扩建而成，2004年9月24日正式对公众开放"}, {"section": "北京地区的红色教育基地", "type": "judge", "q": "中国人民革命军事博物馆展览大楼高94.7米，顶端托举的镀金“八一”军徽直径为6米。", "answer": "对", "explain": "军博展览大楼中央7层、两侧4层，高94.7米，顶端托举直径6米的镀金“八一”军徽。", "source": "展览大楼中央7层、两侧4层，高94.7米，顶端托举着金碧辉煌、直径6米的镀金中国人民解放军“八一”军徽"}, {"section": "北京地区的红色教育基地", "type": "single", "q": "宋庆龄故居原是清末（　）的花园。", "options": ["A. 明珠府第", "B. 醇亲王府", "C. 成亲王府", "D. 和珅别院"], "answer": "B", "explain": "宋庆龄故居原是清末醇亲王府（“北府”）的花园，即摄政王府花园；明珠府第、和珅别院、成亲王府均为其沿革中的早期阶段。", "source": "故居原是清末醇亲王府（“北府”）的花园，即摄政王府花园"}, {"section": "北京地区的红色教育基地", "type": "judge", "q": "北京市规划展览馆位于前门东大街20号，是由老北京火车站改扩建而成的。", "answer": "错", "explain": "规划馆是由原前门商业大厦改扩建而成，只是位置在老北京火车站东侧，并非由火车站改建。", "source": "位于东城区前门东大街20号（老北京火车站东侧），是由原前门商业大厦（曾火爆京城的一座商场）改扩建而成"}, {"section": "北京地区的红色教育基地", "type": "multi", "q": "下列中国共产党早期北京革命活动旧址中，位于西城区的有（　）。", "options": ["A. 中山公园来今雨轩", "B. 绍兴会馆", "C. 平民通讯社旧址（福佑寺）", "D. 北京女子高等师范学校旧址", "E. 长辛店工人俱乐部旧址"], "answer": "ABCD", "explain": "全市31处旧址中西城区占8处，含来今雨轩、绍兴会馆、平民通讯社、女高师旧址等；长辛店工人俱乐部旧址位于丰台区。", "source": "西城区占8处，主要有……⑤北京女子高等师范学校旧址……⑥中山公园来今雨轩……⑦绍兴会馆……⑧平民通讯社旧址（福佑寺）"}, {"section": "北京地区的红色教育基地", "type": "single", "q": "《新青年》编辑部随陈独秀由上海迁至北京的时间是（　）。", "options": ["A. 1915年9月", "B. 1916年9月", "C. 1917年1月", "D. 1920年初"], "answer": "C", "explain": "1917年1月蔡元培聘陈独秀为北大文科学长，编辑部随迁北京；1915年9月为《青年杂志》创刊、1916年9月更名《新青年》、1920年初迁回上海。", "source": "1917年1月蔡元培出任北京大学校长，聘陈独秀为文科学长，《新青年》编辑部随陈独秀由上海迁至北京"}, {"section": "北京地区的红色教育基地", "type": "judge", "q": "曹火星在房山区堂上村创作的歌曲初稿名为《没有共产党就没有中国》，1950年经毛泽东建议加上一个“新”字后才定为今名。", "answer": "对", "explain": "1943年曹火星创作初稿《没有共产党就没有中国》；1950年毛泽东指出“没有共产党的时候，中国早就有了”，建议加“新”字。", "source": "连夜创作了歌曲《没有共产党就没有中国》（初稿）……1950年毛泽东……建议加一个“新”字，遂定名为《没有共产党就没有新中国》"}, {"section": "北京地区的红色教育基地", "type": "single", "q": "卢沟桥桥上石狮的数量，导游讲解的通用口径为（　）。", "options": ["A. 281只", "B. 501只", "C. 627只", "D. 485只"], "answer": "B", "explain": "桥上望柱281根、石狮501只；“627只”出自《从海记》的另一种记载，导游讲解通用501只。", "source": "桥上望柱281根、石狮501只……石狮数量有“501只”与“627只”两种记载，导游讲解通用501只"}, {"section": "北京地区的红色教育基地", "type": "multi", "q": "下列关于1933年古北口战役的说法正确的有（　）。", "options": ["A. 发生于1933年3月，属长城抗战", "B. 打响了北京地区抗日战争第一枪", "C. 是长城抗战中规模最大、最惨烈的战役之一", "D. 阵亡将士360余名安葬于“肉丘坟”", "E. 由萧克指挥并取得胜利"], "answer": "ABCD", "explain": "萧克指挥的是1939年成立的冀热察挺进军；古北口战役由中国军队（第二十五师等）进行，与萧克无关。", "source": "1933年3月的古北口战役是长城抗战中规模最大、最惨烈的战役之一，被称为打响北京地区抗日战争第一枪之战……安葬古北口战役阵亡将士360余名"}, {"section": "北京地区的红色教育基地", "type": "single", "q": "1918年11月15日，李大钊发表著名演说《庶民的胜利》的地点是（　）。", "options": ["A. 天安门前", "B. 中央公园", "C. 北大红楼", "D. 陶然亭"], "answer": "A", "explain": "1918年11月15日北京大学在天安门前举行演讲大会，李大钊发表《庶民的胜利》，权威党史资料以“天安门前”为准。", "source": "1918年11月15日，北京大学在天安门前（天安门旁）举行演讲大会，李大钊在会上发表著名演说《庶民的胜利》"}, {"section": "北京地区的红色教育基地", "type": "single", "q": "1927年4月6日，李大钊被捕的地点是（　）。", "options": ["A. 西交民巷京师看守所", "B. 东交民巷苏联驻华使馆", "C. 西城区文华胡同24号", "D. 北大红楼"], "answer": "B", "explain": "奉系军阀京师警察厅闯入东交民巷苏联使馆区逮捕李大钊；西交民巷京师看守所是其就义地，文华胡同24号是其居住时间最长的住所。", "source": "1927年4月6日……闯入东交民巷苏联使馆区逮捕李大钊及留京的国共两党工作人员60余人"}, {"section": "北京地区的红色教育基地", "type": "multi", "q": "下列关于香山双清别墅与“进京赶考”的说法正确的有（　）。", "options": ["A. 双清别墅位于香山公园南麓半山腰", "B. 因院内石壁下有两眼清泉而得名", "C. “双清”二字为乾隆题写于石壁", "D. 1949年3月25日毛泽东率中共中央进驻香山", "E. 党中央在香山驻留了365天"], "answer": "ABCD", "explain": "党中央在香山驻留181天（1949年3月25日至9月21日），不是365天；其余各项与原文相符。", "source": "双清别墅位于海淀区香山公园南麓半山腰……因院内石壁下有两眼清泉……乾隆题“双清”二字于石壁……至9月21日的181天里"}, {"section": "北京地区的红色教育基地", "type": "single", "q": "李大钊烈士陵园位于（　）。", "options": ["A. 海淀区香山东麓万安公墓内", "B. 西城区陶然亭公园锦秋墩", "C. 东城区五四大街", "D. 丰台区卢沟桥畔"], "answer": "A", "explain": "李大钊烈士陵园位于海淀区香山东麓万安公墓内，1983年建成；陶然亭公园锦秋墩是高君宇烈士墓所在地。", "source": "李大钊烈士陵园位于北京海淀区香山东麓万安公墓内（香山东万安里1号），1983年建成，占地2200平方米"}, {"section": "北京地区的红色教育基地", "type": "single", "q": "五四运动前后，毛泽东第二次来到北京是（　）。", "options": ["A. 1918年8月，组织湖南青年赴法勤工俭学", "B. 1919年12月，率湖南驱张代表团进京", "C. 1919年3月，在北大二院听李大钊演讲", "D. 1918年10月，开始任北大图书馆助理员"], "answer": "B", "explain": "第二次为1919年12月率驱张（张敬尧）代表团进京；1918年8月到京是第一次，听课与任图书馆助理员均在第一次期间。", "source": "第二次在1919年12月（率湖南驱张代表团进京，为驱逐湖南军阀张敬尧寻求各方支持）"}, {"section": "北京地区的红色教育基地", "type": "multi", "q": "下列关于国家博物馆“古代中国”陈列中商周青铜器的说法正确的有（　）。", "options": ["A. “后母戊”青铜方鼎重832.84千克，是目前已知中国古代最重的青铜器", "B. 四羊青铜方尊1938年出土于湖南宁乡", "C. “利”青铜簋铭文印证“武王伐纣”的史实", "D. “盂”青铜鼎铭文记载周康王对盂的“册命”", "E. “后母戊”青铜方鼎出土于陕西临潼"], "answer": "ABCD", "explain": "后母戊鼎1939年出土于河南安阳武官村；陕西临潼是利簋的出土地，二者不可混淆。", "source": "“后母戊”青铜方鼎……重832.84千克，是目前已知中国古代最重的青铜器，1939年出土于河南安阳武官村……“利”青铜簋……1976年出土于陕西临潼"}, {"section": "北京地区的红色教育基地", "type": "single", "q": "中国共产党第一个少数民族党支部的诞生地是（　）。", "options": ["A. 中法大学", "B. 北京蒙藏学校", "C. 北京女子高等师范学校", "D. 长辛店劳动补习学校"], "answer": "B", "explain": "北京蒙藏学校（旧址在今西城区小石虎胡同33号）诞生了党在少数民族中建立的第一个党支部（第一个蒙古族党支部）。", "source": "中国共产党第一个少数民族党支部诞生地是北京蒙藏学校（国立蒙藏专门学校，旧址在今西城区小石虎胡同33号）"}, {"section": "北京地区的红色教育基地", "type": "single", "q": "中共蒙藏学校支部（党在少数民族中建立的第一个党支部）的书记是（　）。", "options": ["A. 乌兰夫", "B. 肖明", "C. 多松年", "D. 陈毅"], "answer": "C", "explain": "多松年任中共蒙藏学校支部书记；陈毅是1924—1925年中法大学党支部书记，肖明是1923年中法大学支部书记。", "source": "多松年、乌兰夫、奎璧、吉雅泰……陆续入党并成立中共蒙藏学校支部，多松年任书记"}, {"section": "北京地区的红色教育基地", "type": "multi", "q": "下列关于圆明园及西洋楼景区的说法正确的有（　）。", "options": ["A. 圆明三园指圆明园、长春园、绮春园", "B. 西洋楼景区位于长春园北部，有“东方凡尔赛宫”之誉", "C. 谐奇趣、海晏堂、大水法是三大欧式喷泉景观", "D. 海晏堂前十二生肖兽首按十二时辰依次喷水", "E. 西洋楼面积约占圆明园的二分之一"], "answer": "ABCD", "explain": "西洋楼面积仅占圆明园的五十分之一，而非二分之一；其余各项均与原文相符。", "source": "西洋楼面积仅占圆明园的五十分之一，偏居长春园北隅……谐奇趣、海晏堂、大水法是三大欧式喷泉景观"}, {"section": "北京地区的红色教育基地", "type": "single", "q": "中共中央第一份机关报《向导》周报的首任主编是（　）。", "options": ["A. 陈独秀", "B. 瞿秋白", "C. 蔡和森", "D. 彭述之"], "answer": "C", "explain": "《向导》1922年9月13日在上海创刊，蔡和森任主编，其后彭述之、瞿秋白继任；陈独秀题写刊名并撰写发刊词。", "source": "1922年9月13日在上海创刊，16开本，由蔡和森任主编（其后彭述之、瞿秋白继任），陈独秀题写刊名、撰写发刊词"}, {"section": "北京地区的红色教育基地", "type": "single", "q": "2008年奥运会后，北京城市中轴线延伸至（　）。", "options": ["A. 7.8公里", "B. 13公里", "C. 21公里", "D. 26公里"], "answer": "D", "explain": "传统中轴线长约7.8公里，1990年亚运会北延至13公里，2008年奥运会再次北延后延伸至26公里。", "source": "北京传统中轴线南起永定门、北至钟鼓楼（明清形成，长约7.8公里）……2008年奥运会再次北延……延伸至26公里"}, {"section": "北京地区的红色教育基地", "type": "multi", "q": "下列关于全民族抗战初期殉国将领的说法正确的有（　）。", "options": ["A. 佟麟阁时任国民革命军第二十九军副军长", "B. 佟麟阁是全民族抗战爆发后牺牲的第一位军级将领", "C. 赵登禹是抗战殉国的第一位师长", "D. 佟麟阁、赵登禹均于1937年7月28日在南苑殉国", "E. 张自忠于1937年7月在南苑殉国"], "answer": "ABCD", "explain": "张自忠是1940年枣宜会战牺牲的抗战殉国最高将领（集团军总司令），并非1937年牺牲于南苑。", "source": "佟麟阁……1937年7月28日……壮烈殉国，时年45岁……同日在南苑牺牲的还有第一三二师师长赵登禹……“集团军总司令”则是1940年枣宜会战牺牲的张自忠"}, {"section": "北京地区的红色教育基地", "type": "single", "q": "长辛店劳动补习学校正式开学的时间是（　）。", "options": ["A. 1920年10月", "B. 1921年1月", "C. 1921年5月", "D. 1922年4月"], "answer": "B", "explain": "1920年10月开始筹办，1921年1月正式开学；1921年5月1日在此成立长辛店铁路工人会。", "source": "李大钊派邓中夏、张国焘、罗章龙等到长辛店筹办，1921年1月正式开学，校址在丰台区长辛店大街祠堂口1号"}, {"section": "北京地区的红色教育基地", "type": "single", "q": "高君宇烈士墓位于（　）。", "options": ["A. 陶然亭公园", "B. 万安公墓", "C. 香山公园", "D. 中山公园"], "answer": "A", "explain": "高君宇1925年病逝后依遗愿葬于西城区陶然亭公园湖心岛锦秋墩北麓，与石评梅墓合称“高石之墓”；万安公墓是李大钊烈士陵园所在。", "source": "高君宇烈士墓位于西城区陶然亭公园湖心岛锦秋墩北麓……依其遗愿葬于陶然亭湖畔"}, {"section": "北京地区的红色教育基地", "type": "single", "q": "“中国人民抗日战争纪念馆”馆名的题写者是（　）。", "options": ["A. 邓小平", "B. 江泽民", "C. 彭真", "D. 张爱萍"], "answer": "A", "explain": "馆名由邓小平题写；江泽民1997年为二期工程竣工题词；彭真题写二七纪念馆馆名；张爱萍题写焦庄户地道战遗址纪念馆馆名。", "source": "馆名由邓小平同志亲自题写：“中国人民抗日战争纪念馆”11个鎏金大字……镶嵌于纪念馆正面宽大的花岗岩石门额上"}, {"section": "北京地区的红色教育基地", "type": "single", "q": "抗战时期焦庄户村挖建的地道网全长为（　）。", "options": ["A. 830米", "B. 15华里", "C. 23公里", "D. 23华里（约11.5公里）"], "answer": "D", "explain": "焦庄户地道全长23华里（约11.5公里）；830米是现供参观的地道长度。", "source": "历时三年挖建以焦庄户村为中心、向四周各村辐射的地道网，地道全长23华里（11.5公里）……现供参观的地道长830米"}, {"section": "北京地区的红色教育基地", "type": "single", "q": "古北口长城抗战纪念馆位于北京市（　）。", "options": ["A. 顺义区", "B. 密云区", "C. 房山区", "D. 延庆区"], "answer": "B", "explain": "纪念馆位于密云区古北口镇古北口村南关，居“古北口战役阵亡将士公墓”（肉丘坟）西侧。", "source": "古北口长城抗战纪念馆位于北京市密云区古北口镇古北口村南关……居于……“古北口战役阵亡将士公墓”西侧"}, {"section": "北京地区的红色教育基地", "type": "single", "q": "打响北京地区解放战争第一枪的是（　）。", "options": ["A. 古北口战役", "B. 古北口保卫战", "C. 南苑保卫战", "D. 七七事变"], "answer": "B", "explain": "1946年1月的古北口保卫战打响北京地区解放战争第一枪；1933年古北口战役是北京地区抗战第一枪，注意区分。", "source": "打响北京地区解放战争第一枪的保卫战是古北口保卫战（1946年1月）"}, {"section": "北京地区的红色教育基地", "type": "single", "q": "长辛店二七纪念馆正式开馆的时间是（　）。", "options": ["A. 1983年2月6日", "B. 1986年2月7日", "C. 1987年2月7日", "D. 1987年7月7日"], "answer": "C", "explain": "该馆1983年2月6日奠基，1987年2月7日正式开馆，讲解以“1983年奠基、1987年2月7日开馆”为准。", "source": "于1983年2月6日由中华全国总工会、铁道部、北京市共同投资兴建，时任国家副主席王震奠基，1987年2月7日正式开馆"}, {"section": "北京地区的红色教育基地", "type": "single", "q": "八路军冀热察挺进军的司令员是（　）。", "options": ["A. 萧克", "B. 陈毅", "C. 赵尔陆", "D. 郭天民"], "answer": "A", "explain": "1939年2月7日冀热察挺进军在平西三坡成立，萧克任司令员兼政治委员，统一指挥平西、平北、冀东抗日武装；赵尔陆、郭天民是古北口保卫战中纵队司令员。", "source": "1939年2月7日，八路军冀热察挺进军在平西三坡（今野三坡）正式成立，萧克任司令员兼政治委员"}, {"section": "北京地区的红色教育基地", "type": "single", "q": "中华人民共和国名誉主席宋庆龄同志故居位于北京市（　）。", "options": ["A. 西城区文华胡同24号", "B. 西城区魏染胡同30号", "C. 西城区后海北沿46号", "D. 西城区小石虎胡同33号"], "answer": "C", "explain": "宋庆龄故居位于后海北沿46号，原为清末醇亲王府花园；文华胡同24号是李大钊故居，魏染胡同30、32号是京报馆旧址，小石虎胡同33号是蒙藏学校旧址。", "source": "中华人民共和国名誉主席宋庆龄同志故居位于北京市西城区后海北沿46号（什刹海后海北岸）"}, {"section": "北京地区的红色教育基地", "type": "single", "q": "“新北京十六景”评选结果正式公布的时间是（　）。", "options": ["A. 1986年3月", "B. 1986年7月7日", "C. 1986年9月24日", "D. 1986年10月9日"], "answer": "D", "explain": "1986年3月发起评选，从40个候选景点中评出16景，结果于1986年10月9日公布，天安门广场以“天安丽日”之名当选。", "source": "1986年3月……共同发起“新北京十六景”评选，从40个候选景点中评选出16景，结果于1986年10月9日公布"}, {"section": "北京地区的红色教育基地", "type": "single", "q": "铭文印证“武王伐纣”在甲子日的史实、被称为“西周第一青铜器”的是（　）。", "options": ["A. “后母戊”青铜方鼎", "B. 四羊青铜方尊", "C. “利”青铜簋", "D. “盂”青铜鼎"], "answer": "C", "explain": "利簋1976年出土于陕西临潼，器内底铸铭文4行33字，印证武王伐纣在甲子日的史实，被称为“西周第一青铜器”。", "source": "“利”青铜簋（利簋）：西周早期，1976年出土于陕西临潼，器内底铸铭文4行33字，印证“武王伐纣”在甲子日的史实"}, {"section": "北京胡同及四合院", "type": "single", "q": "元大都唯一见诸文献且700多年名称沿用未改的胡同是（　）。", "options": ["A. 三庙街", "B. 砖塔胡同", "C. 灵境胡同", "D. 钱市胡同"], "answer": "B", "explain": "砖塔胡同因东口元代\"万松老人塔\"得名，元人李好古杂剧《张生煮海》中已有记载，被罗哲文称为\"北京胡同之根\"。", "source": "以砖塔胡同为最典型……是元大都唯一见诸文献且700多年名称沿用未改的胡同。"}, {"section": "北京胡同及四合院", "type": "judge", "q": "三庙街的前身是辽金时期金中都最繁华的商业街\"檀州街\"，距今已有900余年，是北京现存年代最久远的街巷之一。", "answer": "对", "explain": "原文明确记载三庙街前身即金中都\"檀州街\"，距今已有900余年。", "source": "其前身即辽金时期金中都最繁华的商业街\"檀州街\"……距今已有900余年，是北京现存年代最久远的街巷之一。"}, {"section": "北京胡同及四合院", "type": "multi", "q": "下列元大都城门与今址对应正确的有（　）。", "options": ["A. 丽正门——今正阳门一带", "B. 崇仁门——今东直门", "C. 齐化门——今朝阳门", "D. 和义门——今阜成门", "E. 平则门——今西直门"], "answer": "ABC", "explain": "和义门为今西直门、平则门为今阜成门，D、E两项张冠李戴；丽正门今正阳门一带、崇仁门今东直门、齐化门今朝阳门均正确。", "source": "正中为丽正门（今正阳门一带）……正中为崇仁门（今东直门）、南为齐化门（今朝阳门）……正中为和义门（今西直门）、南为平则门（今阜成门）。"}, {"section": "北京胡同及四合院", "type": "single", "q": "北京最宽的胡同是（　），最宽处达32.18米。", "options": ["A. 灵境胡同", "B. 东交民巷", "C. 南锣鼓巷", "D. 砖塔胡同"], "answer": "A", "explain": "最宽的胡同为灵境胡同（西城区，东起府右街，西至西单北大街），最宽处达32.18米。", "source": "最宽的胡同——灵境胡同（西城区，东起府右街，西至西单北大街，与辟才胡同相通），最宽处达32.18米。"}, {"section": "北京胡同及四合院", "type": "judge", "q": "北京最窄的胡同钱市胡同全长55米，平均宽仅0.7米，最窄处仅0.4米。", "answer": "对", "explain": "钱市胡同全长55米，平均宽0.7米，最窄处0.4米，两人对面需侧身而过。", "source": "最窄的胡同——钱市胡同……胡同全长55米，平均宽仅0.7米，最窄处仅0.4米，两人对面需侧身而过。"}, {"section": "北京胡同及四合院", "type": "single", "q": "北京最长的胡同东交民巷，全长约（　）。", "options": ["A. 786米", "B. 1472米", "C. 1552米", "D. 1818米"], "answer": "C", "explain": "东交民巷东起崇文门内大街，西至天安门广场东侧路，全长约1552米（约1.6公里）。", "source": "最长的胡同——东交民巷（东起崇文门内大街，西至天安门广场东侧路），全长约1552米（约1.6公里）。"}, {"section": "北京胡同及四合院", "type": "judge", "q": "东交民巷被列强正式划为外国\"使馆界\"的时间是1900年八国联军攻入北京之日。", "answer": "错", "explain": "正式划为使馆界的时间是1901年9月7日《辛丑条约》签订；1900年义和团\"庚子之围\"是导火索而非设界时间。", "source": "东交民巷被正式划为外国\"使馆界\"的时间是1901年（清光绪二十七年）9月7日。"}, {"section": "北京胡同及四合院", "type": "multi", "q": "下列属于北京四合院临街宅门等级序列的有（　）。", "options": ["A. 王府大门", "B. 广亮大门", "C. 金柱大门", "D. 如意门", "E. 垂花门"], "answer": "ABCD", "explain": "宅门等级序列为：王府大门＞广亮大门＞金柱大门＞蛮子门＞如意门＞墙垣式门；垂花门属四合院内门（二门），不在临街宅门等级序列之内。", "source": "\"大门等级\"通行序列为：王府大门＞广亮大门＞金柱大门＞蛮子门＞如意门＞墙垣式门……垂花门属四合院内门（二门），不在临街宅门的等级序列之内。"}, {"section": "北京胡同及四合院", "type": "single", "q": "北京最短的胡同是（　），长约30余米，现已并入杨梅竹斜街。", "options": ["A. 一尺大街", "B. 钱市胡同", "C. 辟才胡同", "D. 果子巷"], "answer": "A", "explain": "最短的胡同为一尺大街，位于大栅栏历史文化街区内、今杨梅竹斜街西段，长约30余米。", "source": "最短的胡同——一尺大街，位于大栅栏历史文化街区内、今杨梅竹斜街西段，长约30余米。"}, {"section": "北京胡同及四合院", "type": "judge", "q": "五道营胡同明代属崇教坊，因守城兵营驻扎称\"武德卫营\"，清代属正黄旗，依\"武德\"谐音改称\"五道营\"。", "answer": "错", "explain": "五道营胡同清代属镶黄旗而非正黄旗，其余表述正确。", "source": "明代属崇教坊，因有守城兵营驻扎，称\"武德卫营\"；清代属镶黄旗，依\"武德\"谐音改称\"五道营\"。"}, {"section": "北京胡同及四合院", "type": "single", "q": "南锣鼓巷的全长为（　）。", "options": ["A. 632米", "B. 786米", "C. 1472米", "D. 1552米"], "answer": "B", "explain": "南锣鼓巷北起鼓楼东大街，南止地安门东大街，全长786米，宽8米。", "source": "南锣鼓巷位于北京市东城区，南北走向，北起鼓楼东大街，南止地安门东大街（平安大街）……全长786米，宽8米。"}, {"section": "北京胡同及四合院", "type": "judge", "q": "北京最短的胡同一尺大街原有6座店铺，路北3家为酒馆、铁匠铺、理发店，路南3家为刻字店。", "answer": "错", "explain": "一尺大街原有6座店铺，应为路北3家刻字店，路南3家为酒馆、铁匠铺、理发店，题干南北颠倒。", "source": "原有6座店铺（路北3家刻字店，路南3家为酒馆、铁匠铺、理发店），现已并入杨梅竹斜街。"}, {"section": "北京胡同及四合院", "type": "multi", "q": "下列属于北京城内\"四大天主堂\"的有（　）。", "options": ["A. 王府井天主堂（东堂）", "B. 宣武门天主堂（南堂）", "C. 西直门天主堂（西堂）", "D. 西什库天主堂（北堂）", "E. 圣米厄尔教堂"], "answer": "ABCD", "explain": "四大天主堂为东堂王府井天主堂、南堂宣武门天主堂、西堂西直门天主堂、北堂西什库天主堂；东交民巷的圣米厄尔教堂不在\"四大堂\"之列。", "source": "东堂——王府井天主堂……南堂——宣武门天主堂……西堂——西直门天主堂……北堂——西什库天主堂。东交民巷的圣米厄尔教堂……不在\"四大堂\"之列。"}, {"section": "北京胡同及四合院", "type": "single", "q": "南锣鼓巷的\"水准点碑\"标示的是老北京内城的最高点，其海拔为（　）。", "options": ["A. 39米", "B. 45米", "C. 49米", "D. 53米"], "answer": "C", "explain": "水准点碑为民国时期所立，标示老北京内城最高点，海拔49米。", "source": "该碑为民国时期所立……标示的是老北京内城的最高点，海拔49米。"}, {"section": "北京胡同及四合院", "type": "judge", "q": "东交民巷原名\"东江米巷\"，元朝时与西交民巷本为一条胡同，明清两代为\"五部六府\"所在地。", "answer": "对", "explain": "原文记载东交民巷原名\"东江米巷\"，因地处南粮北运要地得名，明清两代为\"五部六府\"所在地。", "source": "东交民巷原名\"东江米巷\"，元朝时与西交民巷本为一条胡同……明清两代为\"五部六府\"所在地。"}, {"section": "北京胡同及四合院", "type": "single", "q": "北京四合院的标准（典型）形式是（　）。", "options": ["A. 一进院落", "B. 二进院落", "C. 三进院落", "D. 四进院落"], "answer": "C", "explain": "标准形式为三进院落，在二进院落基础上于正房之后加一排后罩房，形成\"前院—正院—后院\"三段式布局。", "source": "标准形式——三进院落（典型／标准四合院，属中型四合院）：在二进院落基础上沿纵深方向发展，于正房之后加一排后罩房。"}, {"section": "北京胡同及四合院", "type": "judge", "q": "南锣鼓巷水准点碑通体由汉白玉制成，碑高1米、宽0.2米，此类石碑目前在全市存留不超过5块。", "answer": "错", "explain": "碑高1米、宽0.2米、汉白玉制成均正确，但此类石碑目前全市存留不超过3块，而非5块。", "source": "碑高1米、宽0.2米，通体由汉白玉制成……此类石碑目前在全市存留不超过3块，现以玻璃罩保护。"}, {"section": "北京胡同及四合院", "type": "multi", "q": "经考古钻探与文献印证，金中都东部遗留至今的\"开放型胡同\"有（　）。", "options": ["A. 北柳巷", "B. 南柳巷", "C. 魏染胡同", "D. 四川营", "E. 灵境胡同"], "answer": "ABCD", "explain": "金中都遗留至今的\"开放型胡同\"有北柳巷、南柳巷、魏染胡同、四川营、果子巷、米市胡同、椿树胡同等；灵境胡同为明代得名，不在其列。", "source": "金中都东部遗留至今的\"开放型胡同\"还有北柳巷、南柳巷、魏染胡同、四川营、果子巷、米市胡同、椿树胡同等。"}, {"section": "北京胡同及四合院", "type": "single", "q": "婉容旧居位于北京市东城区（　）。", "options": ["A. 南锣鼓巷37号", "B. 帽儿胡同37号", "C. 五道营胡同37号", "D. 东四三条37号"], "answer": "B", "explain": "婉容旧居位于东城区交道口街道帽儿胡同37号院，是溥仪皇后郭布罗·婉容的婚前住所。", "source": "婉容旧居位于北京市东城区交道口街道帽儿胡同37号院（旧宅园）……是清朝末代皇帝溥仪的皇后郭布罗·婉容的婚前住所。"}, {"section": "北京胡同及四合院", "type": "judge", "q": "北堂西什库天主堂主体建筑为哥特式，被认为是巴黎圣母院的翻版，讲经大堂内有明柱36根。", "answer": "对", "explain": "原文明确记载西什库天主堂主体为哥特式，被认为是巴黎圣母院的翻版，讲经大堂内有明柱36根。", "source": "主体建筑为哥特式，被认为是巴黎圣母院的翻版，讲经大堂内有明柱36根。"}, {"section": "北京胡同及四合院", "type": "single", "q": "北京白云观所属的道教流派是（　）。", "options": ["A. 正一道龙虎宗", "B. 全真道龙门派", "C. 全真道华山派", "D. 正一道茅山宗"], "answer": "B", "explain": "北京白云观是道教全真道龙门派的祖庭，享有\"全真第一丛林\"之誉，是北方道教的中心。", "source": "北京白云观位于西城区白云观街（西便门外），是道教全真道龙门派的祖庭，享有\"全真第一丛林\"之誉。"}, {"section": "北京胡同及四合院", "type": "multi", "q": "下列关于婉容旧居的说法正确的有（　）。", "options": ["A. 位于东城区交道口街道帽儿胡同", "B. 西路为居住区，由四进院落组成", "C. 东路为小型私家园林，设有三进院落", "D. 1984年被公布为北京市第三批文物保护单位", "E. 是末代皇后婉容的出生地"], "answer": "ABCD", "explain": "婉容旧居分东西两路，西路居住区四进、东路园林三进，1984年列入北京市第三批文保单位；E错，准确表述应为\"婚前住所\"而非出生地。", "source": "该宅是……婉容的婚前住所……西路为居住区，由四进院落组成；东路为小型私家园林，设有三进院落。1984年，该宅邸被公布为北京市第三批文物保护单位。"}, {"section": "北京胡同及四合院", "type": "single", "q": "北京金代胡同中最具代表性、清代因第三座关帝庙坐落此街而定名的是（　）。", "options": ["A. 砖塔胡同", "B. 三庙街", "C. 魏染胡同", "D. 果子巷"], "answer": "B", "explain": "三庙街前身为金中都\"檀州街\"，清代因第三座关帝庙（头庙、二庙、三庙）坐落此街而定名，距今900余年。", "source": "清代因第三座关帝庙（头庙、二庙、三庙）坐落此街而定名\"三庙街\"，距今已有900余年。"}, {"section": "北京胡同及四合院", "type": "single", "q": "据《析津志》记载，元大都全城划分为（　）坊，有\"三百八十四火巷、二十九胡同\"。", "options": ["A. 30", "B. 40", "C. 50", "D. 60"], "answer": "C", "explain": "《析津志》记载元大都全城划分为50坊，全城街巷胡同合计400余条。", "source": "据《析津志》记载，元大都全城划分为50坊，有\"三百八十四火巷、二十九胡同\"，全城街巷胡同合计400余条。"}, {"section": "北京胡同及四合院", "type": "multi", "q": "北京四合院影壁按位置与平面形式，常见式样有（　）。", "options": ["A. 独立影壁", "B. 座山影壁", "C. 雁翅影壁", "D. 撇山影壁", "E. 九龙壁"], "answer": "ABCD", "explain": "常见式样三大类：大门内侧一字影壁（独立影壁、座山影壁）、大门外一字影壁与雁翅影壁、大门两侧的撇山影壁（反八字影壁）；九龙壁不在其列。", "source": "常见式样有三大类：①大门内侧的一字影壁……称\"独立影壁\"……称\"座山影壁\"……③撇山影壁（反八字影壁）。"}, {"section": "北京胡同及四合院", "type": "single", "q": "北京最宽的胡同灵境胡同，最宽处达（　）。", "options": ["A. 28.18米", "B. 30.18米", "C. 32.18米", "D. 36.18米"], "answer": "C", "explain": "灵境胡同位于西城区，东起府右街，西至西单北大街，最宽处达32.18米。", "source": "最宽的胡同——灵境胡同（西城区，东起府右街，西至西单北大街，与辟才胡同相通），最宽处达32.18米。"}, {"section": "北京胡同及四合院", "type": "single", "q": "钱市胡同是清代官办（　）交易\"钱市\"的遗存，为早期金融市场的雏形，胡同即因此得名。", "options": ["A. 银钱", "B. 粮食", "C. 丝绸", "D. 茶叶"], "answer": "A", "explain": "钱市胡同是清代官办银钱交易\"钱市\"的遗存，为早期金融市场的雏形，胡同即因此得名。", "source": "是清代官办银钱交易\"钱市\"的遗存，为早期金融市场的雏形，胡同即因此得名。"}, {"section": "北京胡同及四合院", "type": "single", "q": "南锣鼓巷以南北主街为轴线，东西两侧各对称分布8条平行胡同，共（　）条，呈\"鱼骨状\"。", "options": ["A. 8条", "B. 10条", "C. 12条", "D. 16条"], "answer": "D", "explain": "南锣鼓巷东西两侧各对称分布8条平行胡同，共16条，呈\"鱼骨状\"（俗称\"蜈蚣巷\"）。", "source": "以南北主街为轴线，东西两侧各对称分布8条平行胡同，共16条，呈\"鱼骨状\"（俗称\"蜈蚣巷\"）。"}, {"section": "北京胡同及四合院", "type": "single", "q": "五道营胡同东起雍和宫大街、西止安定门内大街，全长（　）。", "options": ["A. 55米", "B. 300米", "C. 632米", "D. 786米"], "answer": "C", "explain": "五道营胡同呈东西走向，全长632米，宽6米，共有院落69个。", "source": "东起雍和宫大街，西止安定门内大街……全长632米，宽6米（最窄处约3米），共有院落69个。"}, {"section": "北京胡同及四合院", "type": "single", "q": "北京四合院的宅门一般辟于院落（　），体现\"坎宅巽门\"的原则。", "options": ["A. 东北角", "B. 东南角", "C. 西南角", "D. 西北角"], "answer": "B", "explain": "宅门辟于院落东南角\"巽\"位，体现\"坎宅巽门\"原则，取紫气东来、引东南风而挡西北风之意。", "source": "宅门辟于院落东南角\"巽\"位，体现\"坎宅巽门\"的原则（取紫气东来、引东南风而挡西北风之意）。"}, {"section": "北京胡同及四合院", "type": "single", "q": "旧时所谓\"大门不出，二门不迈\"中的\"二门\"，指的是四合院中的（　）。", "options": ["A. 屏门", "B. 垂花门", "C. 广亮大门", "D. 如意门"], "answer": "B", "explain": "垂花门位于中轴线上、正房与倒座之间，是内宅与外宅的分界线，\"大门不出，二门不迈\"即指此门。", "source": "垂花门（二门、内门）……是内宅与外宅的分界线和唯一通道……旧时\"大门不出，二门不迈\"即指此门。"}, {"section": "北京胡同及四合院", "type": "single", "q": "老北京俗语\"东四西单鼓楼前\"中，\"鼓楼前\"指的是（　）。", "options": ["A. 鼓楼东大街", "B. 地安门外大街", "C. 前门大街", "D. 东四北大街"], "answer": "B", "explain": "\"鼓楼前\"即钟鼓楼以南、地安门以北的地安门外大街，是元大都\"前朝后市\"规制中\"后市\"所在地。", "source": "鼓楼前——即钟鼓楼以南、地安门以北的地安门外大街（长约800米），是元大都\"前朝后市\"规制中\"后市\"的所在地。"}, {"section": "北京商业街及老字号", "type": "single", "q": "2005年被北京老字号协会授予\"京城养生老字号，历史悠久第一家\"称号的是（　）。", "options": ["A. 同仁堂", "B. 鹤年堂", "C. 六必居", "D. 天源酱园"], "answer": "B", "explain": "鹤年堂2005年获此称号，注意勿与同仁堂混淆；鹤年堂是北京医药行业现存历史最悠久的老字号。", "source": "鹤年堂——被北京老字号协会于2005年授予\"京城养生老字号，历史悠久第一家\"称号。"}, {"section": "北京商业街及老字号", "type": "judge", "q": "鹤年堂创建于明永乐三年（1405年），相传由元末明初回回诗人、浙江药商丁鹤年创建于牛街一带。", "answer": "对", "explain": "原文记载鹤年堂创建于明永乐三年（1405年），相传由丁鹤年创建于牛街一带。", "source": "鹤年堂创建于明永乐三年（1405年），相传由元末明初回回诗人、浙江药商丁鹤年创建于牛街一带。"}, {"section": "北京商业街及老字号", "type": "multi", "q": "下列属于清真餐馆老字号的有（　）。", "options": ["A. 东来顺", "B. 鸿宾楼", "C. 烤肉宛", "D. 丰泽园", "E. 全聚德"], "answer": "ABC", "explain": "东来顺（涮羊肉）、鸿宾楼、烤肉宛（烤牛肉）均为清真餐馆老字号；丰泽园为鲁菜老字号，全聚德为烤鸭老字号。", "source": "清真餐馆：东来顺（以涮羊肉闻名）、鸿宾楼（创建于清咸丰三年1853年……）、又一顺、烤肉宛（创建于清康熙二十五年1686年，以烤牛肉闻名）……"}, {"section": "北京商业街及老字号", "type": "single", "q": "号称\"中国布鞋第一家\"的老字号是（　）。", "options": ["A. 内联升", "B. 瑞蚨祥", "C. 盛锡福", "D. 马聚源"], "answer": "A", "explain": "内联升2006年获商务部首批\"中华老字号\"认定，同年被中国商业联合会授予\"中国布鞋第一家\"荣誉称号。", "source": "内联升——号称\"中国布鞋第一家\"……2006年获商务部首批\"中华老字号\"认定，同年被中国商业联合会授予\"中国布鞋第一家\"荣誉称号。"}, {"section": "北京商业街及老字号", "type": "judge", "q": "瑞蚨祥为开国大典第一面五星红旗提供面料，该国旗长460厘米、高338厘米，现藏中国国家博物馆。", "answer": "对", "explain": "1949年9月宋树信在瑞蚨祥寻得红绸黄缎，制成国旗长460厘米、高338厘米。", "source": "在前门外大栅栏的瑞蚨祥寻得做旗面的红绸与做五角星的黄缎，连夜赶制成长460厘米、高338厘米的新中国第一面国旗。"}, {"section": "北京商业街及老字号", "type": "single", "q": "以经营\"烧卖\"为主要特色、相传得乾隆皇帝赐蝠头匾的老字号是（　）。", "options": ["A. 天福号", "B. 都一处", "C. 大顺斋", "D. 东来顺"], "answer": "B", "explain": "都一处创建于清乾隆三年（1738年），创始人王瑞福，以烧卖为主要特色，每个烧卖皮标准不少于24个褶。", "source": "都一处——以经营\"烧卖（烧麦）\"为主要特色。创建于清乾隆三年（1738年），创始人王瑞福（山西人）……相传因除夕夜独此一家营业而得乾隆皇帝赐\"都一处\"蝠头匾。"}, {"section": "北京商业街及老字号", "type": "judge", "q": "便宜坊创建于明永乐十四年（1416年），是北京现存历史最悠久的老饭庄，为焖炉烤鸭代表。", "answer": "对", "explain": "便宜坊创建于明永乐十四年（1416年），是焖炉烤鸭代表，为北京现存历史最悠久的老饭庄。", "source": "便宜坊（焖炉烤鸭代表，创建于明永乐十四年（1416年），是北京现存历史最悠久的老饭庄）。"}, {"section": "北京商业街及老字号", "type": "multi", "q": "下列属于琉璃厂商业街区老字号的有（　）。", "options": ["A. 荣宝斋", "B. 一得阁", "C. 戴月轩", "D. 中国书店", "E. 内联升"], "answer": "ABCD", "explain": "荣宝斋（木版水印）、一得阁（墨汁）、戴月轩（湖笔）、中国书店（古籍）均为琉璃厂老字号；内联升总店位于前门外大栅栏。", "source": "琉璃厂商业街区的老字号：荣宝斋……一得阁……戴月轩……中国书店……汲古阁……清秘阁……萃文阁等。"}, {"section": "北京商业街及老字号", "type": "single", "q": "北京酱菜老字号中，被称为\"老酱园\"的是（　）。", "options": ["A. 天源酱园", "B. 桂馨斋", "C. 六必居", "D. 王致和"], "answer": "C", "explain": "六必居创建于明嘉靖九年（1530年），由山西临汾赵存仁、赵存义、赵存礼兄弟创办，称\"老酱园\"；天源为\"京酱园\"，桂馨斋为\"南酱园\"。", "source": "\"老酱园\"——六必居。创建于明嘉靖九年（1530年），由山西临汾赵存仁、赵存义、赵存礼兄弟创办。"}, {"section": "北京商业街及老字号", "type": "judge", "q": "全聚德创建于清咸丰三年（1853年），创始人杨全仁，被誉为\"中国第一餐饮品牌\"。", "answer": "错", "explain": "全聚德创建于清同治三年（1864年）；清咸丰三年（1853年）是内联升、鸿宾楼的创建年代。", "source": "全聚德——被誉为\"中国第一餐饮品牌\"……创建于清同治三年（1864年），创始人杨全仁（杨寿山）。"}, {"section": "北京商业街及老字号", "type": "single", "q": "北京酱菜老字号中，被称为\"京酱园\"、做法出自清宫厨师的是（　）。", "options": ["A. 六必居", "B. 天源酱园", "C. 桂馨斋", "D. 大顺斋"], "answer": "B", "explain": "天源酱园开业于清同治八年（1869年），创始人刘湛轩，其酱菜做法出自清宫厨师，是\"京作\"酱菜代表。", "source": "\"京酱园\"——天源酱园。开业于清同治八年（1869年），创始人刘湛轩……其酱菜做法出自清宫厨师。"}, {"section": "北京商业街及老字号", "type": "judge", "q": "东安市场始建于清光绪三十一年（1905年），是北京最早出现的综合性市场。", "answer": "错", "explain": "东安市场始建于清光绪二十九年（1903年），1903年东安市场建成也是王府井兴起的重要标志。", "source": "东安市场——北京（也是二十世纪中国）最早出现的综合性市场。始建于清光绪二十九年（1903年）。"}, {"section": "北京商业街及老字号", "type": "multi", "q": "下列主要经营鲁菜（山东菜）的老字号有（　）。", "options": ["A. 丰泽园", "B. 同和居", "C. 东兴楼", "D. 萃华楼", "E. 鸿宾楼"], "answer": "ABCD", "explain": "丰泽园、同和居、东兴楼（\"八大楼\"之首）、萃华楼均为鲁菜老字号；鸿宾楼为清真餐馆老字号。", "source": "主要经营鲁菜（山东菜）的老字号：丰泽园……此外还有同和居、东兴楼（\"八大楼\"之首）、萃华楼、致美楼、泰丰楼等。"}, {"section": "北京商业街及老字号", "type": "single", "q": "北京地区创办最早的电影院是（　），1905年在此拍摄并首映中国第一部电影《定军山》。", "options": ["A. 平安电影院", "B. 大观楼", "C. 吉祥戏院", "D. 天桥剧场"], "answer": "B", "explain": "大观楼位于前门外大栅栏街，1902年由任庆泰收购定名，1905年首映《定军山》，是北京地区创办最早的电影院。", "source": "大观楼……位于前门外大栅栏街（今西城区大栅栏街36号），是北京地区创办最早的电影院……1905年改称\"大观楼影戏园\"，在此拍摄并首映中国第一部电影《定军山》。"}, {"section": "北京商业街及老字号", "type": "judge", "q": "明弘治元年（1488年）为治治安令居民出资在胡同口设木栅栏，廊房四条所建栅栏最小，故名\"大栅栏\"。", "answer": "错", "explain": "廊房四条所建栅栏最大（而非最小），故名\"大栅栏\"。", "source": "明弘治元年（1488年）为治治安令居民出资在胡同口设木栅栏，廊房四条所建栅栏最大，故名\"大栅栏\"。"}, {"section": "北京商业街及老字号", "type": "single", "q": "荣膺\"中华第一街\"称号的商业街区是（　）。", "options": ["A. 前门大街", "B. 王府井大街", "C. 西单商业街", "D. 大栅栏"], "answer": "B", "explain": "王府井大街荣膺\"中华第一街\"称号，南起东长安街、北至五四大街，全长约1818米，1999年9月11日步行街正式开街。", "source": "王府井大街——荣膺\"中华第一街\"……南起东长安街、北至五四大街，全长约1818米……1999年9月11日王府井商业步行街正式开街。"}, {"section": "北京商业街及老字号", "type": "judge", "q": "大顺斋创办于明崇祯末年（约1640年），创办人刘大顺为南京上元回民，以风味独特的糖火烧誉满京城。", "answer": "对", "explain": "大顺斋创办于明崇祯末年，刘大顺随运粮船北上落脚通州，以糖火烧闻名，兼营各类南味清真糕点。", "source": "大顺斋。创办于明崇祯末年（约1640年），创办人刘大顺为南京上元回民……以风味独特的糖火烧誉满京城。"}, {"section": "北京商业街及老字号", "type": "multi", "q": "下列关于内联升的说法正确的有（　）。", "options": ["A. 创建于清咸丰三年（1853年）", "B. 创始人赵廷", "C. 总店位于前门外大栅栏街34号", "D. \"千层底布鞋制作技艺\"2008年列入国家级非物质文化遗产名录", "E. 创建于清同治元年（1862年）"], "answer": "ABCD", "explain": "内联升创建于清咸丰三年（1853年），创始人赵廷，总店位于大栅栏街34号，千层底技艺2008年列入国家级非遗；清同治元年（1862年）是瑞蚨祥的创建年代。", "source": "内联升。创建于清咸丰三年（1853年），总店坐落在北京市西城区前门外大栅栏街34号……其\"千层底布鞋制作技艺\"2008年列入国家级非物质文化遗产名录。"}, {"section": "北京商业街及老字号", "type": "single", "q": "被誉为\"夜食者的天堂\"的著名美食商业街是（　）。", "options": ["A. 牛街", "B. 簋街", "C. 烟袋斜街", "D. 马连道茶城"], "answer": "B", "explain": "簋街即东城区东直门内大街，全长约1472米，150余家商铺中餐饮占约90%，被誉为\"夜食者的天堂\"。", "source": "簋街——被誉为\"夜食者的天堂\"。即北京市东城区东直门内大街……全长约1472米……街内150余家商铺中餐饮占约90%。"}, {"section": "北京商业街及老字号", "type": "judge", "q": "王府井大街元代称\"十王府街\"，明代称\"丁字街\"，清光绪三十一年（1905年）正式定名\"王府井大街\"。", "answer": "错", "explain": "应为元代称\"丁字街\"，明代建十王府称\"十王府街\"，题干将元明两代名称颠倒。", "source": "元代称\"丁字街\"，明代建十王府称\"十王府街\"，清光绪三十一年（1905年）正式定名\"王府井大街\"。"}, {"section": "北京商业街及老字号", "type": "single", "q": "北京烤鸭两大做法中，焖炉烤鸭的代表老字号是（　）。", "options": ["A. 全聚德", "B. 便宜坊", "C. 丰泽园", "D. 东兴楼"], "answer": "B", "explain": "焖炉烤鸭凭炉壁余温\"暗火\"焖烤，以便宜坊为代表；全聚德为挂炉烤鸭代表。", "source": "焖炉烤鸭——用砖砌地炉……凭炉壁余温\"暗火\"焖烤……以便宜坊为代表。"}, {"section": "北京商业街及老字号", "type": "judge", "q": "红桥市场2005年被授予\"京城珍珠第一家\"称号，2010年由北京市商务委员会授予\"北京市特色市场\"。", "answer": "对", "explain": "红桥市场2005年获\"京城珍珠第一家\"，2008年定为\"北京特色市场\"，2010年获授\"北京市特色市场\"。", "source": "2005年被授予\"京城珍珠第一家\"称号，2008年北京奥运会期间被定为\"北京特色市场\"，2010年由北京市商务委员会授予\"北京市特色市场\"。"}, {"section": "北京商业街及老字号", "type": "multi", "q": "下列属于六必居代表产品的有（　）。", "options": ["A. 稀黄酱", "B. 甜酱八宝菜", "C. 甜酱黄瓜", "D. 白糖蒜", "E. 糖火烧"], "answer": "ABCD", "explain": "六必居代表产品有稀黄酱、甜酱八宝菜、甜酱萝卜、甜酱黄瓜、白糖蒜等；糖火烧是大顺斋的代表产品。", "source": "代表产品有稀黄酱、甜酱八宝菜、甜酱萝卜、甜酱黄瓜、甜酱甘露、甜酱黑菜、甜酱包瓜、白糖蒜等。"}, {"section": "北京商业街及老字号", "type": "single", "q": "以帽子为主要经营特色、1911年始创于天津、以皮帽制作最为著名的老字号是（　）。", "options": ["A. 马聚源", "B. 盛锡福", "C. 内联升", "D. 瑞蚨祥"], "answer": "B", "explain": "盛锡福1911年始创于天津，创始人刘锡三，以皮帽制作最著名，\"盛锡福皮帽制作技艺\"2008年列入国家级非遗名录。", "source": "盛锡福——以帽子为主要经营特色。1911年始创于天津，创始人刘锡三……以皮帽制作最为著名。"}, {"section": "北京商业街及老字号", "type": "judge", "q": "什刹海荷花市场最繁盛于清代，1916年正式开办，1990年重新开市并改为常年市场。", "answer": "错", "explain": "荷花市场最繁盛于民国时期（1920—1936年为其黄金时代），而非清代；其余表述正确。", "source": "1916年……正式开办，最繁盛于民国时期（1920—1936年为其黄金时代）。1990年重新开市并改为常年市场。"}, {"section": "北京商业街及老字号", "type": "single", "q": "以\"炮制虽繁，必不敢省人工；品味虽贵，必不敢减物力\"为店训的老字号是（　）。", "options": ["A. 鹤年堂", "B. 同仁堂", "C. 六必居", "D. 天福号"], "answer": "B", "explain": "该店训属同仁堂，并将\"修合无人见，存心有天知\"作为立身信条；同仁堂创建于清康熙八年（1669年），创始人乐显扬。", "source": "同仁堂——以\"炮制虽繁，必不敢省人工；品味虽贵，必不敢减物力\"为店训，并将\"修合无人见，存心有天知\"作为立身信条。"}, {"section": "北京商业街及老字号", "type": "judge", "q": "天福号创建于清乾隆三年（1738年），其酱肘子制作技艺于2006年列入第二批国家级非物质文化遗产名录。", "answer": "错", "explain": "天福号创建于清乾隆三年（1738年）正确，但酱肘子制作技艺是2008年列入第二批国家级非遗名录，非2006年。", "source": "创建于清乾隆三年（1738年）……2008年\"天福号酱肘子制作技艺\"列入第二批国家级非物质文化遗产名录。"}, {"section": "北京商业街及老字号", "type": "multi", "q": "下列关于同仁堂与鹤年堂药品特色的说法正确的有（　）。", "options": ["A. 同仁堂以丸、散、膏、丹等传统中成药著称", "B. 鹤年堂以汤剂、饮片著称", "C. 同仁堂自雍正元年（1723年）起供奉清宫御药房达188年", "D. 老北京民谚称\"丸散膏丹同仁堂，汤剂饮片鹤年堂\"", "E. 鹤年堂创建于清康熙八年（1669年）"], "answer": "ABCD", "explain": "清康熙八年（1669年）是同仁堂的创建年代，鹤年堂创建于明永乐三年（1405年），故E错；其余四项均与原文相符。", "source": "同仁堂创建于清康熙八年（1669年）……自雍正元年（1723年）起供奉清宫御药房达188年……民谚\"丸散膏丹同仁堂，汤剂饮片鹤年堂\"。"}, {"section": "北京商业街及老字号", "type": "single", "q": "鹤年堂作为京城历史最悠久的中医药养生老字号，以（　）为核心。", "options": ["A. \"调元气、养太和\"", "B. \"炮制虽繁，必不敢省人工\"", "C. \"修合无人见，存心有天知\"", "D. \"但愿世间人无病，哪怕架上药生尘\""], "answer": "A", "explain": "鹤年堂以\"调元气、养太和\"为核心；B、C、D均为同仁堂店训与信条，注意区分。", "source": "以\"调元气、养太和\"为核心，2008年\"鹤年堂中医药养生文化\"列入国家级非物质文化遗产名录。"}, {"section": "北京商业街及老字号", "type": "judge", "q": "老北京歌谣\"头顶马聚源、身穿瑞蚨祥、脚踩内联升\"中，瑞蚨祥是以丝绸为主要经营特色的老字号。", "answer": "对", "explain": "瑞蚨祥以丝绸（绸布、缎匹）为主要经营特色，荣获\"中国丝绸第一品牌\"，歌谣所指即此店。", "source": "老北京歌谣\"头顶马聚源、身穿瑞蚨祥、脚踩内联升\"即指此店。瑞蚨祥——以丝绸（绸布、缎匹）为主要经营特色。"}, {"section": "北京商业街及老字号", "type": "single", "q": "内联升千层底布鞋制作讲究，男鞋底纳（　），每平方寸纳81针。", "options": ["A. 31层", "B. 33层", "C. 35层", "D. 38层"], "answer": "C", "explain": "内联升千层底布鞋男鞋底纳35层、女鞋底纳31层，每平方寸纳81针，一双鞋底逾2000针。", "source": "男鞋底纳35层、女鞋底纳31层，每平方寸纳81针，一双鞋底逾2000针，需四五天方能完成。"}, {"section": "北京商业街及老字号", "type": "multi", "q": "下列关于什刹海的说法正确的有（　）。", "options": ["A. 由前海、后海、西海组成", "B. 向有\"北方水乡\"之誉", "C. 沿岸有烟袋斜街、荷花市场、酒吧茶艺一条街", "D. 是北京城内唯一融湖泊水景、王府古建、胡同四合院与商业休闲于一体的开放型传统商业街区", "E. 位于北京市东城区"], "answer": "ABCD", "explain": "什刹海位于北京市西城区而非东城区，故E错；其余四项均为原文表述。", "source": "什刹海……位于北京市西城区，由前海、后海、西海组成，沿岸有烟袋斜街、荷花市场、酒吧茶艺一条街等……向有\"北方水乡\"之誉。"}, {"section": "北京商业街及老字号", "type": "single", "q": "瑞蚨祥前门总店位于北京市西城区前门外大栅栏街（　）。", "options": ["A. 5号", "B. 18号", "C. 34号", "D. 36号"], "answer": "A", "explain": "瑞蚨祥前门总店位于大栅栏街5号（导游考试以此为准）；34号为内联升总店，36号为大观楼。", "source": "所在位置：北京市西城区前门外大栅栏街5号（瑞蚨祥前门总店……）。"}, {"section": "北京商业街及老字号", "type": "single", "q": "北京酱菜老字号中，被称为\"南酱园\"、有\"冬菜老店\"之称的是（　）。", "options": ["A. 六必居", "B. 天源酱园", "C. 桂馨斋", "D. 大顺斋"], "answer": "C", "explain": "桂馨斋始建于清乾隆元年（1736年），又称\"铁门酱园\"，仿南方风味制作，擅长冬菜、梅干菜，有\"冬菜老店\"之称。", "source": "\"南酱园\"——桂馨斋……仿南方风味制作，口感偏甜、甜咸适口，擅长冬菜、梅干菜、佛手疙瘩，有\"冬菜老店\"之称。"}, {"section": "北京商业街及老字号", "type": "multi", "q": "下列关于东安市场的说法正确的有（　）。", "options": ["A. 始建于清光绪二十九年（1903年）", "B. 因邻近皇城东安门而得名", "C. 前身为废弃的八旗神机营操场", "D. 东来顺涮羊肉即发迹于此", "E. 是北京地区创办最早的电影院"], "answer": "ABCD", "explain": "北京地区创办最早的电影院是大观楼，而非东安市场，故E错；东安市场是北京最早出现的综合性市场，其余四项正确。", "source": "东安市场——北京……最早出现的综合性市场。始建于清光绪二十九年（1903年）……因邻近皇城东安门而得名。其前身为废弃的八旗神机营操场……东来顺涮羊肉即发迹于此。"}, {"section": "北京商业街及老字号", "type": "single", "q": "1902年收购\"马思远茶楼\"并定名\"大观楼\"、被誉为\"中国电影之父\"的是（　）。", "options": ["A. 任庆泰", "B. 杨全仁", "C. 刘锡三", "D. 赵廷"], "answer": "A", "explain": "1902年由\"中国电影之父\"任庆泰（任景丰）收购并定名\"大观楼\"，1905年在此首映《定军山》。", "source": "1902年由\"中国电影之父\"任庆泰（任景丰）收购并定名\"大观楼\"。"}, {"section": "北京商业街及老字号", "type": "single", "q": "北京城内回族聚族而居最大的街区是（　）。", "options": ["A. 牛街", "B. 天桥", "C. 簋街", "D. 烟袋斜街"], "answer": "A", "explain": "牛街位于西城区，是北京城内回族聚族而居最大的街区，以牛街礼拜寺为中心，相传已有千年历史。", "source": "牛街——以多民族文化交融……为特色的传统商业街区。位于北京市西城区，是北京城内回族聚族而居最大的街区。"}, {"section": "北京商业街及老字号", "type": "single", "q": "曾被称为\"京城最大的平民娱乐场所\"、侯宝林与新凤霞等均在此成名的是（　）。", "options": ["A. 天桥市场", "B. 东安市场", "C. 红桥市场", "D. 荷花市场"], "answer": "A", "explain": "天桥位于北京中轴线南部、正阳门以南，清末民国形成大型平民市场，\"天桥八大怪\"、侯宝林、新凤霞等均在此成名。", "source": "天桥（天桥市场）——曾被称为\"京城最大的平民娱乐场所\"……\"天桥八大怪\"、侯宝林、新凤霞、关学曾等均在此成名。"}, {"section": "北京商业街及老字号", "type": "single", "q": "被誉为\"夜食者的天堂\"的簋街，即北京市东城区（　）。", "options": ["A. 东直门内大街", "B. 东四北大街", "C. 地安门外大街", "D. 西直门内大街"], "answer": "A", "explain": "簋街即东城区东直门内大街，东起东直门立交桥、西至交道口东大街，全长约1472米。", "source": "簋街——被誉为\"夜食者的天堂\"。即北京市东城区东直门内大街，东起东直门立交桥、西至交道口东大街，全长约1472米。"}, {"section": "北京商业街及老字号", "type": "single", "q": "被誉为\"中国第一餐饮品牌\"的全聚德创建于（　）。", "options": ["A. 清咸丰三年（1853年）", "B. 清同治三年（1864年）", "C. 清同治元年（1862年）", "D. 清光绪二十九年（1903年）"], "answer": "B", "explain": "全聚德创建于清同治三年（1864年），创始人杨全仁（杨寿山）；1853年为内联升、鸿宾楼创建年，1862年为瑞蚨祥创建年。", "source": "全聚德——被誉为\"中国第一餐饮品牌\"……创建于清同治三年（1864年），创始人杨全仁（杨寿山）。"}, {"section": "北京商业街及老字号", "type": "single", "q": "以1416年\"金陵老便宜坊\"在北京开业为始，北京烤鸭约有多少年的历史（　）。", "options": ["A. 300多年", "B. 400多年", "C. 600多年", "D. 800多年"], "answer": "C", "explain": "一般以明永乐十四年（1416年）\"金陵老便宜坊\"开业为北京烤鸭之始，至今已逾600年，导游考试以\"600多年\"最通行。", "source": "北京烤鸭的历史：约600多年。一般以明永乐十四年（1416年）\"金陵老便宜坊\"在北京开业为北京烤鸭之始。"}, {"section": "北京商业街及老字号", "type": "single", "q": "创建于1930年、借中南海园林\"丰泽园\"为字号、以葱烧海参闻名的鲁菜老字号是（　）。", "options": ["A. 丰泽园", "B. 同和居", "C. 东兴楼", "D. 萃华楼"], "answer": "A", "explain": "丰泽园创建于1930年，寓\"菜肴丰饶、味道润泽\"，为京城\"八大楼\"之一，是北京经营正宗鲁菜的代表。", "source": "丰泽园（创建于1930年，借中南海园林\"丰泽园\"为字号，寓\"菜肴丰饶、味道润泽\"……以葱烧海参、九转大肠、香酥鸡、银丝卷闻名）。"}, {"section": "北京市旅游条例及时事政治", "type": "single", "q": "航天员张陆累计进行（　）出舱活动，刷新了中国航天员个人出舱活动次数的纪录。", "options": ["A. 5次", "B. 6次", "C. 7次", "D. 8次"], "answer": "C", "explain": "航天员张陆累计进行7次出舱活动，刷新中国航天员个人出舱活动次数纪录。", "source": "航天员张陆累计进行7次出舱活动，刷新了中国航天员个人出舱活动次数的纪录。"}, {"section": "北京市旅游条例及时事政治", "type": "judge", "q": "根据《全国年节及纪念日放假办法》，我国全体公民放假的节日放假天数总计13天。", "answer": "对", "explain": "全体公民放假的节日包括元旦、春节、清明节、劳动节、端午节、中秋节、国庆节，放假天数总计13天。", "source": "我国全体公民放假的节日包括元旦、春节、清明节、劳动节、端午节、中秋节、国庆节，放假天数总计13天。"}, {"section": "北京市旅游条例及时事政治", "type": "multi", "q": "2026年迎来建校130周年的交通类院校有（　）。", "options": ["A. 上海交通大学", "B. 西安交通大学", "C. 西南交通大学", "D. 北京交通大学", "E. 华东交通大学"], "answer": "ABCD", "explain": "2026年是上海交通大学、西安交通大学、西南交通大学、北京交通大学四所院校建校130周年，华东交通大学不在其列。", "source": "2026年是上海交通大学、西安交通大学、西南交通大学、北京交通大学等四所院校建校130周年。"}, {"section": "北京市旅游条例及时事政治", "type": "single", "q": "截至目前，我国入选联合国旅游组织\"最佳旅游乡村\"总数达到（　）。", "options": ["A. 15个", "B. 17个", "C. 19个", "D. 21个"], "answer": "C", "explain": "我国入选联合国旅游组织\"最佳旅游乡村\"总数达到19个。", "source": "截至目前，我国入选联合国旅游组织\"最佳旅游乡村\"总数达到19个。"}, {"section": "北京市旅游条例及时事政治", "type": "judge", "q": "全球首个年货物吞吐量超14亿吨的大港是中国上海港。", "answer": "错", "explain": "全球首个年货物吞吐量超14亿吨的大港是中国宁波舟山港，而非上海港。", "source": "全球首个年货物吞吐量超14亿吨的大港是中国宁波舟山港。"}, {"section": "北京市旅游条例及时事政治", "type": "single", "q": "继民法典后，我国第二部以\"法典\"命名的法律是（　）。", "options": ["A. 《中华人民共和国生态环境法典》", "B. 《中华人民共和国教育法典》", "C. 《中华人民共和国行政法典》", "D. 《中华人民共和国劳动法典》"], "answer": "A", "explain": "第二部以\"法典\"命名的法律是《中华人民共和国生态环境法典》。", "source": "继民法典后，我国第二部以\"法典\"命名的法律是《中华人民共和国生态环境法典》。"}, {"section": "北京市旅游条例及时事政治", "type": "judge", "q": "浙江常山和四川四姑娘山经联合国教科文组织执行局第224届会议审议成为世界地质公园，至此我国世界地质公园增至51处。", "answer": "对", "explain": "原文明确记载我国世界地质公园增至51处。", "source": "我国浙江常山和四川四姑娘山通过会议审议，正式成为世界地质公园。至此，我国世界地质公园增至51处。"}, {"section": "北京市旅游条例及时事政治", "type": "multi", "q": "在联合国教科文组织执行局第224届会议上，我国正式成为世界地质公园的有（　）。", "options": ["A. 浙江常山", "B. 四川四姑娘山", "C. 湖南张家界", "D. 云南石林"], "answer": "AB", "explain": "在法国巴黎召开的第224届会议上，浙江常山和四川四姑娘山通过审议正式成为世界地质公园。", "source": "在法国巴黎召开的联合国教科文组织执行局第224届会议上，我国浙江常山和四川四姑娘山通过会议审议，正式成为世界地质公园。"}, {"section": "北京市旅游条例及时事政治", "type": "single", "q": "2026年是中国工农红军长征胜利（　）周年。", "options": ["A. 80周年", "B. 85周年", "C. 90周年", "D. 95周年"], "answer": "C", "explain": "2026年是中国工农红军长征胜利90周年。", "source": "2026年是中国工农红军长征胜利90周年。"}, {"section": "北京市旅游条例及时事政治", "type": "judge", "q": "\"十四五\"规划收官之年，我国成为世界上首个发明专利有效量超过600万件的国家。", "answer": "错", "explain": "我国成为世界上首个发明专利有效量超过500万件的国家，而非600万件。", "source": "成为世界上首个发明专利有效量超过500万件的国家。"}, {"section": "北京市旅游条例及时事政治", "type": "single", "q": "2026年4月15日是第（　）个全民国家安全教育日。", "options": ["A. 9", "B. 10", "C. 11", "D. 12"], "answer": "C", "explain": "2026年4月15日是第11个全民国家安全教育日，主题为\"统筹发展和安全 护航'十五五'新征程\"。", "source": "2026年4月15日是第11个全民国家安全教育日，活动主题为\"统筹发展和安全 护航'十五五'新征程\"。"}, {"section": "北京市旅游条例及时事政治", "type": "judge", "q": "自2026年起，将每年4月第一周设立为\"全民阅读活动周\"。", "answer": "错", "explain": "应为每年4月第四周设立为\"全民阅读活动周\"，而非第一周。", "source": "自2026年起，将每年4月第四周设立为\"全民阅读活动周\"。"}, {"section": "北京市旅游条例及时事政治", "type": "multi", "q": "2026年迎来的重要周年纪念有（　）。", "options": ["A. 中国工农红军长征胜利90周年", "B. 中美\"乒乓外交\"55周年", "C. 中国同巴基斯坦建交75周年", "D. 中俄战略协作伙伴关系建立30周年", "E. 《中俄睦邻友好合作条约》签署20周年"], "answer": "ABCD", "explain": "《中俄睦邻友好合作条约》签署为25周年而非20周年，故E错；其余四项均与原文相符。", "source": "2026年是中国工农红军长征胜利90周年……中美\"乒乓外交\"55周年纪念……庆祝两国建交75周年……中俄战略协作伙伴关系建立30周年和《中俄睦邻友好合作条约》签署25周年。"}, {"section": "北京市旅游条例及时事政治", "type": "single", "q": "结束为期12天试航、靠泊上海外高桥码头的第二艘国产大型邮轮是（　）。", "options": ["A. \"爱达·魔都号\"", "B. \"爱达·花城号\"", "C. \"海洋石油283\"", "D. \"垦利10-2\"号"], "answer": "B", "explain": "第二艘国产大型邮轮\"爱达·花城号\"结束为期12天试航，全船149项试航项目悉数通过验证。", "source": "第二艘国产大型邮轮\"爱达·花城号\"结束为期12天的试航，靠泊上海外高桥码头，全船149项试航项目悉数通过严苛验证。"}, {"section": "北京市旅游条例及时事政治", "type": "judge", "q": "5月22日是国际生物多样性日，2026年的主题为\"护一方生灵 泽万物共荣\"。", "answer": "对", "explain": "原文明确记载5月22日为国际生物多   c.classList.add('on'); curSec = c.dataset.s; applyFilter();
};
function applyFilter() {
  document.querySelectorAll('.card').forEach(card => {
    const st = progress[card.dataset.idx];
    let okT;
    if (curType === 'all') okT = true;
    else if (curType === 'undo') okT = !st;
    else if (curType === 'wronged') okT = st === 'w';
    else okT = card.dataset.type === curType;
    const okS = curSec === 'all' || card.dataset.sec === curSec;
    card.classList.toggle('hidden', !(okT && okS));
  });
  refreshScore();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}
function refreshScore() {
  let a = 0, c = 0, w = 0;
  document.querySelectorAll('.card:not(.hidden)').forEach(card => {
    const st = progress[card.dataset.idx];
    if (st === 'c') { a++; c++; } else if (st === 'w') { a++; w++; }
  });
  document.getElementById('answered').textContent = a;
  document.getElementById('correct').textContent = c;
  document.getElementById('wrong').textContent = w;
  document.getElementById('rate').textContent = a ? Math.round(c/a*100)+'%' : '—';
}
document.getElementById('resetTop').onclick = () => {
  if (!confirm('清空全部答题进度，重新做一遍？')) return;
  progress = {}; saveProgress(); location.reload();
};

const list = document.getElementById('list');
DATA.forEach((q, i) => {
  const card = document.createElement('div');
  card.className = 'card'; card.dataset.type = q.type; card.dataset.sec = q.section; card.dataset.idx = i;
  const label = q.type === 'multi' ? ' <span style="font-size:12px;color:var(--sub);font-weight:400">（多选，选出后点「提交」）</span>' : '';
  let optsHtml = '';
  if (q.type === 'judge') {
    optsHtml = `<div class="opts"><div class="opt" data-v="对">A. 对</div><div class="opt" data-v="错">B. 错</div></div>`;
  } else {
    optsHtml = `<div class="opts">` + q.options.map((o, j) =>
      `<div class="opt" data-v="${'ABCDEFG'[j]}">${o}</div>`).join('') +
      (q.type === 'multi' ? `<button class="multi-submit" disabled>提交</button>` : '') + `</div>`;
  }
  const srcHtml = q.source ? `<div class="src"><span class="srctag">📖 资料原文</span><div class="srcbody">${q.source}</div></div>` : '';
  card.innerHTML = `
    <div class="qhead"><span class="qnum">${i + 1}.</span><span class="qsec">${q.section} · ${TYPE_NAME[q.type]}</span></div>
    <div class="qtext">${q.q}${label}</div>
    ${optsHtml}
    <div class="explain"><span class="verdict"></span><b>答案：${q.answer}</b>　${q.explain || ''}${srcHtml}</div>`;
  list.appendChild(card);

  const opts = card.querySelectorAll('.opt');
  const explain = card.querySelector('.explain');
  const verdict = card.querySelector('.verdict');
  const done = ok => {
    progress[i] = ok ? 'c' : 'w'; saveProgress();
    verdict.textContent = ok ? '✓ 回答正确' : '✗ 回答错误';
    verdict.className = 'verdict ' + (ok ? 'ok' : 'bad');
    explain.classList.add('show');
    opts.forEach(o => o.classList.add('disabled'));
    refreshScore();
  };

  if (q.type === 'multi') {
    const btn = card.querySelector('.multi-submit');
    const picked = new Set();
    opts.forEach(o => o.onclick = () => {
      if (o.classList.contains('disabled')) return;
      const v = o.dataset.v;
      picked.has(v) ? (picked.delete(v), o.classList.remove('picked')) : (picked.add(v), o.classList.add('picked'));
      btn.disabled = picked.size === 0;
    });
    btn.onclick = () => {
      if (btn.disabled) return;
      btn.disabled = true;
      const mine = [...picked].sort().join('');
      const ok = mine === q.answer;
      opts.forEach(o => {
        const v = o.dataset.v;
        if (q.answer.includes(v)) o.classList.add('right');
        else if (picked.has(v)) o.classList.add('wrong');
      });
      done(ok);
    };
  } else {
    opts.forEach(o => o.onclick = () => {
      if (o.classList.contains('disabled')) return;
      const ok = o.dataset.v === q.answer;
      opts.forEach(x => { if (x.dataset.v === q.answer) x.classList.add('right'); });
      if (!ok) o.classList.add('wrong');
      done(ok);
    });
  }
});

// 恢复已答状态（锁定+展示对错，但不自动展开解析）
DATA.forEach((q, i) => {
  const st = progress[i]; if (!st) return;
  const card = list.children[i];
  card.querySelectorAll('.opt').forEach(o => o.classList.add('disabled'));
  const btn = card.querySelector('.multi-submit'); if (btn) btn.disabled = true;
});
refreshScore();
</script>
</body>
</html>
