。古稀门是皇乾殿院落西角门。", "source": "圜丘坛周围 4 座：东泰元门、南昭亨门、西广利门、北成贞门（取《易经·乾卦》“元、亨、利、贞”，称“天之四德”）"}, {"section": "天坛", "type": "single", "q": "明嘉靖帝采纳哪位给事中的建议，恢复天地分祀旧制？（ ）", "options": ["A. 夏言", "B. 朱棣", "C. 朱厚熜", "D. 弘历"], "answer": "A", "explain": "嘉靖九年（1530年），嘉靖帝采纳给事中夏言的建议恢复天地分祀旧制；朱棣、朱厚熜、弘历分别为永乐帝、嘉靖帝、乾隆帝。", "source": "明嘉靖九年（1530 年）。嘉靖帝采纳给事中夏言建议，恢复天地分祀旧制"}, {"section": "天坛", "type": "judge", "q": "明清两代共有22位皇帝在天坛举行过祭祀大典，共计654次。", "answer": "对", "explain": "原文明确明清两代共有22位皇帝在天坛举行过祭祀大典，共计654次。", "source": "明清两代共有 22 位皇帝在天坛举行过祭祀大典，共计 654 次。"}, {"section": "天坛", "type": "single", "q": "天坛初建时的名称是（ ）。", "options": ["A. 天地坛", "B. 天坛", "C. 祈谷坛", "D. 大享殿"], "answer": "A", "explain": "天坛初名“天地坛”，因建成时兼具祭天与祭地功能（大祀殿实行天地合祀）而得名，嘉靖九年（1530年）天地分祀后更名“天坛”。", "source": "初建名称：“天地坛”。命名原因：因建成时兼具祭天与祭地的功能（在大祀殿实行天地合祀），故名“天地坛”。"}, {"section": "天坛", "type": "judge", "q": "历史上在天坛举行第一次祭祀盛典的时间是明永乐十八年（1420年）。", "answer": "错", "explain": "第一次祭祀盛典为明永乐十九年（1421年）正月，永乐十八年（1420年）是天坛始建建成之年。", "source": "明永乐十九年（1421 年）正月（正月十一日甲戌日），明成祖朱棣率文武百官在北京天地坛大祀殿“大祀天地于南郊”"}, {"section": "天坛", "type": "multi", "q": "历史上对天坛初建、改建和扩建做出贡献的皇帝有（ ）。", "options": ["A. 明永乐帝（朱棣）", "B. 明嘉靖帝（朱厚熜）", "C. 清乾隆帝（弘历）", "D. 明崇祯帝"], "answer": "ABC", "explain": "明永乐帝初建天坛（天地坛），明嘉靖帝改建更制（天地分祀、建圜丘、大享殿等），清乾隆帝大规模扩建改建。原文未提及明崇祯帝。", "source": "1. 明永乐帝（朱棣）——初建。2. 明嘉靖帝（朱厚熜）——改建（更制）。3. 清乾隆帝（弘历）——大规模扩建、改建。"}, {"section": "天坛", "type": "single", "q": "天坛内百年以上古树的数量是（ ）。", "options": ["A. 654株", "B. 3562株", "C. 6000株", "D. 6万余株"], "answer": "B", "explain": "天坛现有各类树木6万多株，其中百年以上古树3562株（或“3500多株”）。6万余株为树木总数。", "source": "天坛现有各类树木 6 万多株，其中百年以上古树 3562 株（或“3500 多株”）。"}, {"section": "天坛", "type": "judge", "q": "民国七年（1918年）1月1日，天坛辟为天坛公园，正式对外开放。", "answer": "对", "explain": "原文载明民国七年（1918年）1月1日（元旦），天坛辟为天坛公园，正式对外开放。", "source": "民国七年（1918 年）1 月 1 日（元旦），天坛辟为天坛公园，正式对外开放。"}, {"section": "天坛", "type": "single", "q": "祈年殿的总高约为（ ）。", "options": ["A. 28米", "B. 29米", "C. 38米", "D. 45米"], "answer": "C", "explain": "祈年殿总高约38米（一说38.2米），坐落于三层汉白玉圆台之上。", "source": "高度：总高约 38 米（一说 38.2 米；殿身高约 31.6—32 米，连同三层坛台）"}, {"section": "天坛", "type": "judge", "q": "祈年殿内圈龙井柱共4根，象征一日十二个时辰。", "answer": "错", "explain": "内圈龙井柱4根象征一年四季（春夏秋冬）；象征一日十二时辰的是外圈12根檐柱。", "source": "内圈 龙井柱（通天柱） 4 根（高 19.2 米、直 径 1.2 米） 一年四季（春夏秋 冬）；外圈 檐柱 12 根 一日 12 个时辰"}, {"section": "天坛", "type": "multi", "q": "下列建筑中，属于祈谷坛建筑群的有（ ）。", "options": ["A. 祈年殿", "B. 皇乾殿", "C. 七十二长廊（供菜廊）", "D. 皇穹宇", "E. 宰牲亭"], "answer": "ABCE", "explain": "祈谷坛建筑群包括祈年门、祈年殿、皇乾殿、东西配殿、神厨、神库、宰牲亭、七十二长廊、具服台、七星石；皇穹宇属圜丘坛建筑群。", "source": "祈谷坛建筑群：祈年门、祈年殿、皇乾殿、东西配殿、神厨、神库、宰牲亭、七十二长廊（供菜廊）、具服台、七星石。"}, {"section": "天坛", "type": "single", "q": "现存祈年殿最后一次重建竣工于（ ）。", "options": ["A. 光绪十五年（1889年）", "B. 光绪十六年（1890年）", "C. 光绪二十二年（1896年）", "D. 光绪三十三年（1907年）"], "answer": "C", "explain": "祈年殿1889年遭雷击焚毁，1890年开始重建，光绪二十二年（1896年）重建竣工，历时6年。", "source": "光绪十六年（1890 年）开始重建……光绪二十二年（1896 年）重建竣工，历时 6 年。现存祈年殿即此次重建后的形制。"}, {"section": "天坛", "type": "judge", "q": "回音壁是皇穹宇的圆形围墙，用山东临清澄浆砖“磨砖对缝”砌成。", "answer": "对", "explain": "原文明确回音壁为皇穹宇的圆形围墙，由山东临清澄浆砖“磨砖对缝”砌成。", "source": "回音壁—皇穹宇的圆形围墙（高 3.72 米、厚 0.9 米、直径 61.5 米、周长 193.2 米，山东临清澄浆砖“磨砖对缝”砌成）"}, {"section": "天坛", "type": "single", "q": "祈年殿遭雷击起火焚毁的时间是（ ）。", "options": ["A. 光绪十五年（1889年）", "B. 光绪十六年（1890年）", "C. 光绪二十二年（1896年）", "D. 光绪三十三年（1907年）"], "answer": "A", "explain": "清光绪十五年（1889年）八月二十四日，祈年殿遭雷击（雷火）起火焚毁，因楹柱为沉香（檀香）木，燃烧时香飘数里。", "source": "清光绪十五年（1889 年）八月二十四日（公历 9 月 18 日），祈年殿遭雷击（雷火）起火焚毁"}, {"section": "天坛", "type": "judge", "q": "明清时期皇帝每年冬至日到圜丘坛祭天，祭天大典于日出前七刻（约凌晨4时15分）开始。", "answer": "对", "explain": "原文：祭天时间为每年冬至日，开始时间为日出前七刻（约凌晨4时15分），以望灯杆上点亮灯笼为大典开始与结束的时间标志。", "source": "祭天时间：每年冬至日。开始时间：日出前七刻（约凌晨4时15分），届时望灯杆上点亮灯笼作为大典开始与结束的时间标志。"}, {"section": "天坛", "type": "multi", "q": "下列关于祈年殿丹陛浮雕的说法，正确的有（ ）。", "options": ["A. 共有三组石浮雕", "B. 上层为“双龙山海”", "C. 中层为“双凤山海”", "D. 下层为“瑞云山海”", "E. 自上而下依次象征风、云、龙"], "answer": "ABCD", "explain": "祈年殿南三层石阶（丹陛）共三组浮雕，自上而下为“双龙山海”“双凤山海”“瑞云山海”，即上层刻龙、中层刻凤、下层刻云。E项顺序与原文不符。", "source": "祈年殿南三层石阶（丹陛）上共有三组石浮雕，自上而下依次为“双龙山海”、“双凤山海”、“瑞云山海”（即上层刻龙、中层刻凤、下层刻云）"}, {"section": "天坛", "type": "single", "q": "明清时期皇帝举行祈谷大典的时辰是（ ）。", "options": ["A. 日出前三刻", "B. 日出前五刻", "C. 日出前七刻", "D. 日出之时"], "answer": "C", "explain": "祈谷大典于日出前七刻（约凌晨4时15分）行礼，天色未亮，需燃殿内灯具。", "source": "时辰：日出前七刻（约凌晨 4 时 15 分）行礼，天色未亮，需燃殿内灯具。"}, {"section": "天坛", "type": "judge", "q": "祭天大典开始时，皇帝拜位位于圜丘坛上层坛面正南台阶前。", "answer": "错", "explain": "皇帝拜位位于圜丘坛中层坛面正南台阶前，而非上层。", "source": "皇帝拜位：位于圜丘坛中层坛面正南台阶前（皇帝由此向最上层天心石北侧的皇天上帝、祖宗及众神牌位跪拜）。"}, {"section": "天坛", "type": "single", "q": "祈年殿内圈龙井柱的数量及象征含义是（ ）。", "options": ["A. 4根，象征一年四季", "B. 12根，象征一年12个月", "C. 24根，象征一年24节气", "D. 28根，象征二十八星宿"], "answer": "A", "explain": "内圈龙井柱（通天柱）4根，象征一年四季；金柱12根象征12个月，中外圈合计24根象征24节气，总计28根象征二十八星宿。", "source": "内圈 龙井柱（通天柱） 4 根（高 19.2 米、直 径 1.2 米） 一年四季（春夏秋 冬）"}, {"section": "天坛", "type": "judge", "q": "圜丘坛的内壝墙呈方形，外壝墙呈圆形，即「内方外圆」，象征「天圆地方」。", "answer": "错", "explain": "应为内壝墙呈圆形、外壝墙呈方形，即「内圆外方」。", "source": "内壝墙（内墙）呈圆形，外壝墙（外墙）呈方形——「内圆外方」，象征「天圆地方」（红墙蓝瓦）。"}, {"section": "天坛", "type": "multi", "q": "丹陛桥上的三条石板路包括（ ）。", "options": ["A. 神道（神路）", "B. 御道（御路）", "C. 王道（王路）", "D. 官道"], "answer": "ABC", "explain": "丹陛桥三条石板路自东向西为：中间神道（皇天上帝专用）、东侧御道（皇帝专用）、西侧王道（王公百官行走）。", "source": "三条石板路（自东向西）：中间：神道（神路）……东侧：御道（御路）——供皇帝专用；西侧：王道（王路）——供陪祀的王公、百官行走。"}, {"section": "天坛", "type": "single", "q": "祈年殿宝顶下的雷公柱象征（ ）。", "options": ["A. 一年四季", "B. 一年24节气", "C. 三十六天罡", "D. 皇帝“一统天下”"], "answer": "D", "explain": "祈年殿宝顶下雷公柱1根，象征皇帝“一统天下”；童柱8根（合计36根）象征三十六天罡。", "source": "宝顶下 雷公柱 1 根 皇帝“一统天下”"}, {"section": "天坛", "type": "judge", "q": "圜丘坛上层坛面直径为九丈，中层为十五丈，下层为二十一丈。", "answer": "对", "explain": "原文：上层九丈（一九）、中层十五丈（三五）、下层二十一丈（三七）。", "source": "上层 九丈（一九）取义一；中层 十五丈（三五）取义三、五；下层 二十一丈（三七）取义三、七。"}, {"section": "天坛", "type": "single", "q": "皇乾殿的作用是（ ）。", "options": ["A. 宰杀祭祀牲畜的场所", "B. 制作烹饪祭品的厨房", "C. 平时供奉神版的“天库”", "D. 存放祭器礼器的库房"], "answer": "C", "explain": "皇乾殿位于祈谷坛以北，是平时供奉祈谷坛祭祀正位与配位神版的大殿，相当于祈谷坛的“天库”。A、B、D分别为宰牲亭、神厨、神库的用途。", "source": "作用：是平时供奉祈谷坛祭祀正位（皇天上帝）与配位（清代前八位皇帝）神版（神牌）的大殿，相当于祈谷坛的“天库”"}, {"section": "天坛", "type": "judge", "q": "圜丘坛望灯杆始建于明永乐年间，初建1座，明崇祯年间增至3座。", "answer": "错", "explain": "望灯杆始建于明嘉靖年间，不是永乐年间。", "source": "望灯杆：高约9丈（约30米），始建于明嘉靖年间（初建1座，明崇祯年间增至3座；1915年袁世凯祭天时拆掉2根，现仅存其一，1993年复建）。"}, {"section": "天坛", "type": "multi", "q": "天坛中的四大声学现象包括（ ）。", "options": ["A. 回音壁", "B. 三音石", "C. 天心石", "D. 对话石", "E. 七星石"], "answer": "ABCD", "explain": "天坛四大声学现象为回音壁、三音石、天心石（亿兆景从石）、对话石；七星石是祈谷坛东南方的八块青石，不属于声学现象。", "source": "天坛中的四大声学现象：1. 回音壁……2. 三音石……3. 天心石（亿兆景从石）……4. 对话石……"}, {"section": "天坛", "type": "single", "q": "皇乾殿院落西角门称为（ ）。", "options": ["A. 古稀门", "B. 成贞门", "C. 泰元门", "D. 广利门"], "answer": "A", "explain": "清乾隆皇帝年满七十（古稀）后，因年事已高、行礼不便绕行，特于皇乾殿院落西侧开辟此门，故名“古稀门”。", "source": "该门称“古稀门”。清乾隆皇帝年满七十（古稀）之后……特于皇乾殿院落西侧开辟此门，以便出入，故名“古稀门”。"}, {"section": "天坛", "type": "judge", "q": "祭天大典时望灯杆上悬挂的大灯笼内立5只巨蜡，故称「蟠龙通宵宝蜡」。", "answer": "对", "explain": "灯笼内立5只巨蜡（蟠龙通宵宝蜡）。", "source": "蜡烛：灯笼内立5只巨蜡（蟠龙通宵宝蜡），故称「盘龙（蟠龙）通宵宝蜡」。"}, {"section": "天坛", "type": "single", "q": "供菜廊（七十二长廊）共有（ ）。", "options": ["A. 36间", "B. 54间", "C. 72间", "D. 108间"], "answer": "C", "explain": "供菜廊位于祈谷坛东砖门外，是一条连檐通脊的曲尺形长廊，共72间，长350米、宽5米，俗称“七十二连房”。", "source": "是一条连檐通脊的曲尺形长廊，共 72 间，长 350 米、宽 5 米，俗称“七十二连房”"}, {"section": "天坛", "type": "judge", "q": "皇穹宇东配殿供奉夜明之神（月）、云师、雨师、风伯、雷师神牌。", "answer": "错", "explain": "夜明之神（月）等供奉于西配殿；东配殿供奉大明之神（日）、北斗七星、金木水火土五星、二十八宿、周天星辰神牌。", "source": "东配殿供奉大明之神（日）、北斗七星、金木水火土五星、二十八宿、周天星辰神牌；西配殿供奉夜明之神（月）、云师、雨师、风伯、雷师神牌。"}, {"section": "天坛", "type": "multi", "q": "下列属于明清皇帝圜丘坛祭天大典九项仪程的有（ ）。", "options": ["A. 燔柴迎帝神", "B. 奠玉帛", "C. 斋戒", "D. 望燎"], "answer": "ABD", "explain": "九项仪程为：燔柴迎帝神、奠玉帛、进俎、初献礼、亚献礼、终献礼、撤馔、送帝神、望燎。「斋戒」不在其中。", "source": "九项仪程：燔柴迎帝神（燔柴迎神）、奠玉帛、进俎、初献礼、亚献礼、终献礼、撤馔、送帝神（送神）、望燎。"}, {"section": "天坛", "type": "single", "q": "丹陛桥上供皇天上帝专用、连皇帝也不可行走的石板路是（ ）。", "options": ["A. 中间的神道（神路）", "B. 东侧的御道（御路）", "C. 西侧的王道（王路）", "D. 官道"], "answer": "A", "explain": "丹陛桥三条石板路自东向西：中间神道供皇天上帝专用，皇帝亦不可行走；东侧御道供皇帝专用；西侧王道供王公百官行走。", "source": "中间：神道（神路）——供皇天上帝（天帝）专用，皇帝亦不可行走"}, {"section": "天坛", "type": "judge", "q": "斋宫主体建筑坐西朝东（面向东），以示皇帝对天称臣、不敢称尊。", "answer": "对", "explain": "祭天建筑坐北朝南，皇帝在「天」面前只能退居臣子之位，故斋宫坐西朝东。", "source": "斋宫主体建筑的朝向：坐西朝东（面向东）。……故斋宫坐西朝东，以示对天称臣、不敢称尊。"}, {"section": "天坛", "type": "single", "q": "三音石位于皇穹宇殿前甬道由北向南第（ ）块石板。", "options": ["A. 第一块", "B. 第二块", "C. 第三块", "D. 第十八块"], "answer": "C", "explain": "三音石为皇穹宇殿前甬道由北向南第三块石板，恰为回音壁圆心，击掌可听到三声回音；第十八块为对话石。", "source": "三音石—皇穹宇殿前甬道由北向南第三块石板（恰为回音壁圆心）。在此击掌可听到三声回音"}, {"section": "天坛", "type": "judge", "q": "斋宫正殿内悬挂的匾额为「玉振金声」，系乾隆御笔。", "answer": "错", "explain": "斋宫正殿匾额为「钦若昊天」（乾隆御笔）；「玉振金声」匾在神乐署凝禧殿。", "source": "斋宫正殿内悬挂匾额的内容及题写者：钦若昊天，乾隆御笔。"}, {"section": "天坛", "type": "multi", "q": "下列关于圜丘坛三层坛面直径的说法正确的有（ ）。", "options": ["A. 上层直径九丈", "B. 中层直径十五丈", "C. 下层直径二十一丈", "D. 三层直径之和为50丈"], "answer": "ABC", "explain": "三层直径分别为九丈、十五丈、二十一丈，之和为45丈（9+15+21），D错误。", "source": "上层 九丈（一九）；中层 十五丈（三五）；下层 二十一丈（三七）……三层坛面直径之和为45丈（9+15+21）。"}, {"section": "天坛", "type": "single", "q": "祭天大典开始时，皇帝的拜位位于圜丘坛（ ）。", "options": ["A. 上层坛面正南台阶前", "B. 中层坛面正南台阶前", "C. 下层坛面正北台阶前", "D. 外壝墙内棂星门前"], "answer": "B", "explain": "皇帝拜位位于圜丘坛中层坛面正南台阶前，由此向最上层天心石北侧的神位跪拜。", "source": "皇帝拜位：位于圜丘坛中层坛面正南台阶前（皇帝由此向最上层天心石北侧的皇天上帝、祖宗及众神牌位跪拜）。"}, {"section": "天坛", "type": "judge", "q": "明初（神乐观时期）神乐署中乐生、舞生均由道士充任，清乾隆年间尽逐道士后改由八旗子弟充任。", "answer": "对", "explain": "明初乐生、舞生均由道士（道童）充任；乾隆年间严禁乐官习道教、尽逐道士后，改由年少俊秀的八旗子弟充任。", "source": "明初（神乐观时期）乐生、舞生均由道士（道童）充任——神乐观内官员、乐舞生皆为道士。清乾隆年间严禁乐官习道教、尽逐道士后，乐舞生改由年少俊秀的八旗子弟充任。"}, {"section": "天坛", "type": "single", "q": "圜丘坛三层坛面直径之和为45丈，既是九的倍数，又暗含（ ）之意。", "options": ["A. 二十八星宿", "B. 二十四节气", "C. 九五之尊", "D. 三十六天罡"], "answer": "C", "explain": "三层坛面直径之和为45丈（9+15+21），既是九的倍数，又暗含「九五之尊」之意。", "source": "三层坛面直径之和为45丈（9+15+21），既是九的倍数，又暗含「九五之尊」之意。"}, {"section": "天坛", "type": "judge", "q": "天坛按南京天地坛规制建成，初名“天地坛”，后经明嘉靖、清乾隆等朝增建改建，至清乾隆年间最终形成今日格局。", "answer": "对", "explain": "原文明确天坛按南京天地坛规制始建建成，初名“天地坛”，至清乾隆年间最终形成今日格局。", "source": "始建与建成：明永乐十八年（1420 年）始建并建成（按南京天地坛规制），初名“天地坛”；后经明嘉靖、清乾隆等朝增建改建，至清乾隆年间最终形成今日格局。"}, {"section": "天坛", "type": "multi", "q": "下列属于圜丘坛周围附属设施的有（ ）。", "options": ["A. 燔柴炉", "B. 瘗坎", "C. 铁燎炉", "D. 望灯杆", "E. 斋宫"], "answer": "ABCD", "explain": "圜丘坛附属设施包括燔柴炉、瘗坎、铁燎炉、望灯杆、具服台、宰牲亭神厨神库、皇穹宇、棂星门24座等；斋宫为独立建筑群，不在圜丘坛附属设施之列。", "source": "燔柴炉……瘗坎……铁燎炉……望灯杆……具服台……宰牲亭、神厨、神库（坛东）；皇穹宇（坛北，即「天库」）；棂星门24座。"}, {"section": "天坛", "type": "single", "q": "圜丘坛三层栏板分别为72、108、180块，合计（ ）块。", "options": ["A. 3402块", "B. 378块", "C. 360块", "D. 365块"], "answer": "C", "explain": "三层栏板分别为72、108、180块，合计360块。", "source": "三层栏板分别为72、108、180块，合计360块；三层共378个「九」，扇形石合计3402块。"}, {"section": "天坛", "type": "judge", "q": "天坛整体布局呈“回”字形，由两道坛墙环护，分为内坛、外坛两部分，主要建筑集中于外坛。", "answer": "错", "explain": "天坛由两道坛墙环护分为内坛、外坛，但主要建筑集中于内坛，而非外坛。", "source": "整体布局呈“回”字形，由两道坛墙环护，分为内坛、外坛两部分，主要建筑集中于内坛。"}, {"section": "天坛", "type": "single", "q": "天心石（太极石、亿兆景从石）位于（ ）。", "options": ["A. 圜丘坛上层台面正中", "B. 圜丘坛中层台面正中", "C. 皇穹宇殿前甬道第三块石板处", "D. 燔柴炉东侧"], "answer": "A", "explain": "天心石位于圜丘坛上层（第三层）台面正中，又称太极石、亿兆景从石。", "source": "位于圜丘坛上层（第三层）台面正中的圆形石板，又称太极石、亿兆景从石（坛面中心即为天心石，祭天时正位幄次设于天心石稍北，南向）。"}, {"section": "天坛", "type": "judge", "q": "七星石中七块大青石代表东岳泰山七峰，清乾隆时增置的小青石代表昆仑山。", "answer": "错", "explain": "清乾隆时在东北方位增置的小青石代表长白山（满族龙兴之地），而非昆仑山。", "source": "清乾隆时在东北方位增置一块小青石，代表长白山（满族龙兴之地），寓意满族亦为华夏一员。"}, {"section": "天坛", "type": "multi", "q": "下列属于皇穹宇东配殿供奉内容的有（ ）。", "options": ["A. 大明之神（日）", "B. 北斗七星", "C. 金木水火土五星", "D. 夜明之神（月）"], "answer": "ABC", "explain": "东配殿供奉大明之神（日）、北斗七星、金木水火土五星、二十八宿、周天星辰神牌；夜明之神（月）供奉于西配殿。", "source": "东配殿供奉大明之神（日）、北斗七星、金木水火土五星、二十八宿、周天星辰神牌。"}, {"section": "天坛", "type": "single", "q": "圜丘坛燔柴炉位于坛的（ ），祭天开始时焚烧牛犊以「燔柴迎帝神」。", "options": ["A. 东北方", "B. 东南方", "C. 西南方", "D. 西北方"], "answer": "B", "explain": "燔柴炉位于东南，绿琉璃砖砌，高约9尺。", "source": "燔柴炉（东南，绿琉璃砖砌，高约9尺）——祭天开始时焚烧牛犊以「燔柴迎帝神」，礼毕焚烧皇天上帝祭品，皇帝在西侧望燎位行「望燎」礼。"}, {"section": "天坛", "type": "judge", "q": "明清两代在天坛祭祀次数最多的是清乾隆帝，他在位60年，共到天坛祭祀145次。", "answer": "错", "explain": "乾隆帝在位60年到天坛祭祀155次，题干“145次”与原文不符。", "source": "其中清乾隆帝最多——在位 60 年，到天坛祭祀 155 次。"}, {"section": "天坛", "type": "single", "q": "圜丘坛瘗坎的用途是（ ）。", "options": ["A. 焚化清代前八位皇帝配位供品", "B. 掩埋牛尾、牛毛、牛血", "C. 吊挂祭天大灯笼", "D. 供皇帝盥洗更衣"], "answer": "B", "explain": "瘗坎位于燔柴炉东侧，为圆形凹坑，掩埋牛尾、牛毛、牛血，喻祭天同时不忘祭地。", "source": "瘗坎（燔柴炉东侧，圆形凹坑）——掩埋牛尾、牛毛、牛血，喻祭天同时不忘祭地。"}, {"section": "天坛", "type": "judge", "q": "天坛现有各类树木6万多株，其中百年以上古树3562株。", "answer": "对", "explain": "原文载明天坛现有各类树木6万多株，其中百年以上古树3562株（或“3500多株”）。", "source": "天坛现有各类树木 6 万多株，其中百年以上古树 3562 株（或“3500 多株”）。"}, {"section": "天坛", "type": "multi", "q": "下列关于圜丘坛望灯杆的说法正确的有（ ）。", "options": ["A. 高约9丈（约30米）", "B. 始建于明嘉靖年间", "C. 明崇祯年间增至3座", "D. 1915年后仍存3座"], "answer": "ABC", "explain": "1915年袁世凯祭天时拆掉2根，现仅存其一，1993年复建，故D错误。", "source": "望灯杆：高约9丈（约30米），始建于明嘉靖年间（初建1座，明崇祯年间增至3座；1915年袁世凯祭天时拆掉2根，现仅存其一，1993年复建）。"}, {"section": "天坛", "type": "single", "q": "祭天大典时望灯杆上吊挂的大灯笼直径为（ ）。", "options": ["A. 0.9米", "B. 1.3米", "C. 2.15米", "D. 2.5米"], "answer": "B", "explain": "灯笼直径1.3米、高2.15米。", "source": "灯笼：祭天大典时在望灯杆上吊挂直径1.3米、高2.15米的大灯笼。"}, {"section": "天坛", "type": "judge", "q": "天地坛更名为“天坛”，是在明嘉靖九年（1530年）实行天地分祀之后。", "answer": "对", "explain": "明嘉靖九年（1530年）天地分祀后，天地坛更名为“天坛”（主流官方口径为嘉靖九年）。", "source": "改称时间：明嘉靖九年（1530 年）天地分祀后，天地坛更名为“天坛”。"}, {"section": "天坛", "type": "single", "q": "望灯杆被拆掉2根发生于（ ）。", "options": ["A. 1907年光绪帝祭天时", "B. 1915年袁世凯祭天时", "C. 1918年天坛辟为公园时", "D. 1937年改造园林步廊时"], "answer": "B", "explain": "1915年袁世凯祭天时拆掉2根，现仅存其一，1993年复建。", "source": "始建于明嘉靖年间（初建1座，明崇祯年间增至3座；1915年袁世凯祭天时拆掉2根，现仅存其一，1993年复建）。"}, {"section": "天坛", "type": "judge", "q": "祈年殿是明清两代皇帝孟春（正月）祈谷的专用建筑，在此举行祈谷大典。", "answer": "对", "explain": "祈年殿为明清两代皇帝孟春（正月）祈谷的专用建筑，祈求风调雨顺、五谷丰登。", "source": "作用：明清两代皇帝孟春（正月）祈谷的专用建筑，在此举行祈谷大典，祈求皇天上帝保佑风调雨顺、五谷丰登。"}, {"section": "天坛", "type": "multi", "q": "下列关于斋宫正殿月台陈设的说法正确的有（ ）。", "options": ["A. 月台上左右各一座石亭", "B. 北侧为斋戒铜人亭", "C. 南侧为时辰亭", "D. 正面台阶中间为云纹浮雕丹陛"], "answer": "ABCD", "explain": "月台上左右各一座石亭：北侧（左）斋戒铜人亭，南侧（右）时辰亭；正面台阶中间为云纹浮雕丹陛。", "source": "月台（丹墀）上左右各一座石亭：北侧（左）：斋戒铜人亭……南侧（右）：时辰亭……正面台阶中间为云纹浮雕丹陛。"}, {"section": "天坛", "type": "single", "q": "皇穹宇西配殿供奉的神牌是（ ）。", "options": ["A. 大明之神（日）、北斗七星神牌", "B. 夜明之神（月）、云师、雨师、风伯、雷师神牌", "C. 金木水火土五星、二十八宿神牌", "D. 皇天上帝及清代前八位皇帝神牌"], "answer": "B", "explain": "西配殿供奉夜明之神（月）、云师、雨师、风伯、雷师神牌；A、C为东配殿，D为正殿。", "source": "西配殿供奉夜明之神（月）、云师、雨师、风伯、雷师神牌。"}, {"section": "天坛", "type": "judge", "q": "祈年殿遭焚毁后，光绪十六年（1890年）开始重建，历时8年竣工。", "answer": "错", "explain": "祈年殿1890年开始重建，光绪二十二年（1896年）竣工，历时6年，而非8年。", "source": "光绪十六年（1890 年）开始重建……光绪二十二年（1896 年）重建竣工，历时 6 年。"}, {"section": "天坛", "type": "single", "q": "清朝皇穹宇大殿殿顶覆盖的琉璃瓦颜色为（ ）。", "options": ["A. 黄色", "B. 绿色", "C. 蓝色（青色）", "D. 黑色"], "answer": "C", "explain": "皇穹宇大殿覆蓝色（青色）琉璃瓦，鎏金宝顶，象征青天。", "source": "蓝色（青色）琉璃瓦，鎏金宝顶，象征青天。"}, {"section": "天坛", "type": "judge", "q": "供菜廊位于祈谷坛西侧，是明清时期运送祭祀供品的专用通道。", "answer": "错", "explain": "供菜廊位于祈谷坛东砖门外（祈谷坛东侧），而非西侧；其作为运送祭祀供品专用通道的表述正确。", "source": "位置：位于祈谷坛东砖门外（祈谷坛东侧）……作用：明清时期是运送祭祀供品的专用通道。"}, {"section": "天坛", "type": "multi", "q": "下列关于神乐署的说法正确的有（ ）。", "options": ["A. 正殿即凝禧殿", "B. 明代正殿称「太和殿」", "C. 归礼部太常寺管辖", "D. 凝禧殿内悬乾隆御笔「玉振金声」匾"], "answer": "ABCD", "explain": "神乐署正殿即凝禧殿，明代称太和殿，康熙年间改名；归礼部太常寺管辖；殿内悬乾隆御笔「玉振金声」匾（青地金书）。", "source": "神乐署正殿即凝禧殿：明代称「太和殿」……明清时期神乐署的管理部门：归礼部太常寺管辖。殿内悬挂乾隆皇帝御笔「玉振金声」匾（青地金书）。"}, {"section": "天坛", "type": "single", "q": "清朝皇穹宇大殿内神版上使用的文字是（ ）。", "options": ["A. 汉文一种", "B. 满文一种", "C. 满文与汉文两种", "D. 满、汉、蒙三种"], "answer": "C", "explain": "皇穹宇大殿内神版使用满文与汉文两种文字。", "source": "清朝皇穹宇大殿内神版上使用的文字：使用满文与汉文两种文字。"}, {"section": "天坛", "type": "judge", "q": "圜丘坛是明清两代皇帝冬至日举行“祀天”（祭天）大典的场所，俗称祭天台、拜天台。", "answer": "对", "explain": "原文明确圜丘坛为明清两代皇帝冬至日祭天大典场所，俗称祭天台、拜天台、祭台。", "source": "明清两代皇帝冬至日举行“祀天”（祭天）大典的场所，俗称祭天台、拜天台、祭台。"}, {"section": "天坛", "type": "single", "q": "斋宫正殿得名「无梁殿」的原因是（ ）。", "options": ["A. 殿内不用一根立柱", "B. 砖券拱顶结构，殿内不用梁枋大木", "C. 殿顶无正脊", "D. 殿内不设大梁式匾额"], "answer": "B", "explain": "正殿面阔五间，为砖券拱顶结构，殿内不用梁枋大木（不露栋梁榱桷痕迹），故名「无梁殿」。", "source": "正殿面阔五间，为砖券拱顶结构，殿内不用梁枋大木（不露栋梁榱桷痕迹），故名「无梁殿」。"}, {"section": "天坛", "type": "judge", "q": "圜丘坛祭天大典九项仪程的最后一项是「送帝神」。", "answer": "错", "explain": "九项仪程依次为燔柴迎帝神、奠玉帛、进俎、初献礼、亚献礼、终献礼、撤馔、送帝神、望燎，最后一项是「望燎」，「送帝神」为第八项。", "source": "九项仪程：燔柴迎帝神（燔柴迎神）、奠玉帛、进俎、初献礼、亚献礼、终献礼、撤馔、送帝神（送神）、望燎。"}, {"section": "天坛", "type": "multi", "q": "下列坛门中，属于祈谷坛的有（ ）。", "options": ["A. 东天门", "B. 西天门", "C. 北天门", "D. 泰元门", "E. 昭亨门"], "answer": "ABC", "explain": "祈谷坛东、西、北3座坛门为东天门、西天门、北天门；泰元门、昭亨门为圜丘坛周围四门之二。", "source": "祈谷坛东、西、北 3 座：东天门、西天门、北天门（成贞门一门两用，亦为祈谷坛的南天门）。"}, {"section": "天坛", "type": "single", "q": "斋宫正殿月台三出陛的正阶为（ ）。", "options": ["A. 9级", "B. 12级", "C. 13级", "D. 15级"], "answer": "C", "explain": "月台崇基石栏、三出陛，正阶13级，左右各15级。", "source": "绿琉璃瓦庑殿顶，汉白玉石基与石栏，殿前月台崇基石栏、三出陛（正阶13级，左右各15级），正面台阶中间为云纹浮雕丹陛。"}, {"section": "天坛", "type": "judge", "q": "圜丘坛内壝墙呈圆形、外壝墙呈方形，红墙蓝瓦，象征「天圆地方」。", "answer": "对", "explain": "内壝墙圆形、外壝墙方形，即「内圆外方」，红墙蓝瓦，象征「天圆地方」。", "source": "内壝墙（内墙）呈圆形，外壝墙（外墙）呈方形——「内圆外方」，象征「天圆地方」（红墙蓝瓦）。"}, {"section": "天坛", "type": "single", "q": "斋宫正殿月台上的斋戒铜人亭位于（ ）。", "options": ["A. 月台北侧（左）", "B. 月台南侧（右）", "C. 正殿之内", "D. 丹陛桥北端"], "answer": "A", "explain": "月台上左右各一座石亭，北侧（左）为斋戒铜人亭，南侧（右）为时辰亭。", "source": "北侧（左）：斋戒铜人亭——石制四柱，绿琉璃瓦方形攒尖顶……南侧（右）：时辰亭——小型殿宇式石龛。"}, {"section": "天坛", "type": "judge", "q": "圜丘坛上层坛面围绕天心石铺9圈扇形石，其中第9圈为81块。", "answer": "对", "explain": "上层坛面围绕天心石铺9圈扇形石，第1圈9块，递加至第9圈81块。", "source": "上层坛面围绕天心石铺9圈扇形石（第1圈9块……第9圈81块），中下层亦各9圈递加9块。"}, {"section": "天坛", "type": "multi", "q": "下列关于七星石的说法，正确的有（ ）。", "options": ["A. 位于祈谷坛（长廊）东南方", "B. 实为八块青石", "C. 七块大青石代表东岳泰山七峰", "D. 清乾隆时增置一块小青石代表长白山", "E. 石上凿有云形纹样"], "answer": "ABCD", "explain": "七星石实为八块青石，石上凿的是山形纹样而非云形纹样，其余四项与原文相符。", "source": "七星石：位于祈谷坛（长廊）东南方，实为八块青石，石上凿有山形纹样。其中七块大青石为明嘉靖年间放置，代表东岳泰山七峰……清乾隆时在东北方位增置一块小青石，代表长白山"}, {"section": "天坛", "type": "single", "q": "斋戒铜人亭内陈设的铜铸人像相传仿（ ）而制。", "options": ["A. 唐朝宰相魏徵", "B. 明嘉靖帝", "C. 清乾隆帝", "D. 袁世凯"], "answer": "A", "explain": "皇帝斋戒时陈设一尊铜铸人像，相传仿唐朝宰相魏徵而制，用以警示皇帝虔诚斋戒。", "source": "皇帝斋戒时于座上陈设一尊铜铸人像（乌纱玉带、手持「斋戒」牌），相传仿唐朝宰相魏徵而制，用以警示皇帝虔诚斋戒。"}, {"section": "天坛", "type": "judge", "q": "圜丘坛三层栏板合计360块，三层坛面共有378个「九」。", "answer": "对", "explain": "三层栏板分别为72、108、180块，合计360块；三层共378个「九」。", "source": "三层栏板分别为72、108、180块，合计360块；三层共378个「九」，扇形石合计3402块。"}, {"section": "天坛", "type": "single", "q": "斋宫正殿月台南侧时辰亭的用途是（ ）。", "options": ["A. 放置时辰牌，由钦天监官员届时进牌", "B. 陈设铜铸斋戒人像", "C. 存放祭器礼器", "D. 排演中和韶乐"], "answer": "A", "explain": "时辰亭为小型殿宇式石龛，设窄高石座，用于放置时辰牌，由钦天监官员届时进牌。", "source": "南侧（右）：时辰亭——小型殿宇式石龛，设窄高石座，用于放置时辰牌（由钦天监官员届时进牌，皇帝依所奏时辰起驾出宫临坛行礼）。"}, {"section": "天坛", "type": "judge", "q": "祭天时正位幄次设于天心石稍南，坐北朝南。", "answer": "错", "explain": "祭天时正位幄次设于天心石稍北，南向，而非稍南。", "source": "坛面中心即为天心石，祭天时正位幄次设于天心石稍北，南向。"}, {"section": "天坛", "type": "multi", "q": "明嘉靖帝对天坛的改建（更制）包括（ ）。", "options": ["A. 改天地合祀为天地分祀", "B. 天地坛更名为“天坛”", "C. 在南郊建圜丘坛祭天", "D. 建成圆形三重檐大享殿", "E. 将大享殿三色琉璃瓦统一改为蓝色"], "answer": "ABCD", "explain": "将三色琉璃瓦统一改为蓝色、改大享殿为祈年殿是清乾隆帝的举措，其余四项均为明嘉靖帝改建内容。", "source": "嘉靖九年（1530 年）改天地合祀为分祀……天地坛更名为“天坛”；嘉靖十七年撤大祀殿，二十四年（1545 年）在原址建成圆形三重檐大享殿。"}, {"section": "天坛", "type": "single", "q": "斋宫正殿内悬挂的乾隆御笔匾额内容为（ ）。", "options": ["A. 玉振金声", "B. 钦若昊天", "C. 皇天上帝", "D. 中和韶乐"], "answer": "B", "explain": "斋宫正殿悬挂「钦若昊天」匾，乾隆御笔；「玉振金声」匾在神乐署凝禧殿。", "source": "斋宫正殿内悬挂匾额的内容及题写者：钦若昊天，乾隆御笔。"}, {"section": "天坛", "type": "judge", "q": "圜丘坛燔柴炉东北方有8座铁燎炉，用于焚化清代前8位皇帝配位供品。", "answer": "对", "explain": "铁燎炉位于燔柴炉东北方共8座，焚化清代前8位皇帝配位供品；内壝东西棂星门外各2座焚化从位供品。", "source": "铁燎炉（燎炉）——燔柴炉东北方8座（焚化清代前8位皇帝配位供品），内壝东西棂星门外各2座（焚化从位供品）。"}, {"section": "天坛", "type": "single", "q": "神乐署正殿（凝禧殿）在明代称为（ ）。", "options": ["A. 大祀殿", "B. 大享殿", "C. 太和殿", "D. 显佑殿"], "answer": "C", "explain": "神乐署正殿即凝禧殿，明代称「太和殿」，清康熙年间由康熙帝赐名改为「凝禧殿」。", "source": "明代称「太和殿」（因与紫禁城太和殿重名，清康熙年间／一说康熙十二年1673年由康熙帝赐名改为「凝禧殿」）。"}, {"section": "天坛", "type": "judge", "q": "皇穹宇正殿东西两侧前方各设4个方形石台，供奉清代前八位已故皇帝的配位神牌。", "answer": "对", "explain": "正殿正中须弥座供奉皇天上帝神牌，左右（东西两侧）前方各4个方形石台供奉清代前八位已故皇帝配位神牌。", "source": "左右（东西两侧）前方各4个方形石台，供奉清代前八位已故皇帝的配位神牌。"}, {"section": "天坛", "type": "multi", "q": "祈年殿的建筑理念体现在（ ）。", "options": ["A. 殿为圆形，象征“天圆”", "B. 三重檐蓝色琉璃瓦象征苍天", "C. 鎏金宝顶层层向上收举，表现“天人合一”", "D. 殿内柱网按天象、历法排列", "E. 是中国古代歇山式建筑仅存的一例"], "answer": "ABCD", "explain": "祈年殿是中国古代明堂式建筑仅存的一例，而非歇山式；其余四项均为原文所述建筑理念。", "source": "殿为圆形，象征“天圆”；三重檐蓝色（青色）琉璃瓦，象征苍天……是中国古代明堂式建筑仅存的一例。"}, {"section": "天坛", "type": "single", "q": "清乾隆年间尽逐道士后，神乐署乐舞生改由（ ）充任。", "options": ["A. 年少俊秀的八旗子弟", "B. 太常寺官员", "C. 宫中太监", "D. 汉族举人"], "answer": "A", "explain": "乾隆年间严禁乐官习道教、尽逐道士后，乐舞生改由年少俊秀的八旗子弟充任，由朝廷指派协律郎培训。", "source": "清乾隆年间严禁乐官习道教、尽逐道士后，乐舞生改由年少俊秀的八旗子弟充任，由朝廷指派协律郎培训。"}, {"section": "天坛", "type": "judge", "q": "清朝皇穹宇大殿内神版上仅使用汉文一种文字。", "answer": "错", "explain": "皇穹宇大殿内神版使用满文与汉文两种文字，并非仅用汉文。", "source": "清朝皇穹宇大殿内神版上使用的文字：使用满文与汉文两种文字。"}, {"section": "天坛", "type": "single", "q": "天坛的占地面积约为（ ）。", "options": ["A. 173公顷", "B. 273公顷", "C. 373公顷", "D. 473公顷"], "answer": "B", "explain": "天坛占地面积273公顷（约273万平方米），相当于紫禁城的近4倍。", "source": "占地面积：273 公顷（约 273 万平方米），相当于紫禁城的近 4 倍。"}, {"section": "天坛", "type": "judge", "q": "望灯杆上的望灯只是祭天大典的位置标志，与仪式的开始和结束时间无关。", "answer": "错", "explain": "望灯既是祭天大典的位置标志，也是仪式开始和结束的时间标志。", "source": "望灯既是祭天大典的位置标志，也是仪式开始和结束的时间标志。"}, {"section": "天坛", "type": "multi", "q": "关于祈年殿三层石栏与丹陛浮雕的呼应，正确的有（ ）。", "options": ["A. 上层望柱饰云龙、出水为螭首（龙头）", "B. 中层饰翔凤、出水为凤首", "C. 下层饰朵云、出水为云朵", "D. 整体寓意“龙凤呈祥”，表现君权至上", "E. 三层望柱均饰云龙"], "answer": "ABCD", "explain": "三层石栏上层饰云龙、中层饰翔凤、下层饰朵云，并非均饰云龙；其余四项与原文相符。", "source": "三层石栏上层望柱饰云龙、出水为螭首（龙头）；中层饰翔凤、出水为凤首；下层饰朵云、出水为云朵——整体寓意“龙凤呈祥”，表现君权至上。"}, {"section": "天坛", "type": "single", "q": "天坛坛域的平面形状特征是（ ）。", "options": ["A. 北圆南方", "B. 南圆北方", "C. 东西皆圆", "D. 内外皆方"], "answer": "A", "explain": "天坛坛域北呈圆形、南为方形（“北圆南方”），寓意“天圆地方”，两重坛墙俗称“天地墙”。", "source": "坛域北呈圆形、南为方形（“北圆南方”），寓意“天圆地方”；因两重坛墙南方北圆，俗称“天地墙”。"}, {"section": "天坛", "type": "judge", "q": "明清时期神乐署归礼部太常寺管辖，是明清两朝最高的「礼乐学府」。", "answer": "对", "explain": "神乐署归礼部太常寺管辖，是礼部太常寺官及乐部执事官生演礼演乐之地，为明清两朝最高的「礼乐学府」。", "source": "明清时期神乐署的管理部门：归礼部太常寺管辖。……是礼部太常寺官及乐部执事官生演礼演乐之地，为明清两朝最高的「礼乐学府」。"}, {"section": "天坛", "type": "single", "q": "天坛三道坛墙中，分隔圜丘坛与祈谷坛的是（ ）。", "options": ["A. 外坛墙", "B. 内坛墙", "C. 两坛之间的东西向隔墙", "D. 两坛之间的南北向隔墙"], "answer": "C", "explain": "三道坛墙为外坛墙、内坛墙、分隔圜丘坛与祈谷坛之间的东西向隔墙。", "source": "三道坛墙：①外坛墙；②内坛墙；③分隔圜丘坛与祈谷坛之间的东西向隔墙。"}, {"section": "天坛", "type": "multi", "q": "下列建筑中，属于圜丘坛建筑群的有（ ）。", "options": ["A. 皇穹宇", "B. 燔柴炉", "C. 望灯杆", "D. 瘗坎", "E. 皇乾殿"], "answer": "ABCD", "explain": "圜丘坛建筑群包括圜丘、皇穹宇、四座天门、燔柴炉、瘗坎、铁燎炉、望灯杆、具服台、南宰牲亭与南神厨；皇乾殿属祈谷坛建筑群。", "source": "圜丘坛建筑群：圜丘、皇穹宇（含回音壁、三音石、对话石）、四座天门……燔柴炉、瘗坎、铁燎炉、望灯杆、具服台、南宰牲亭与南神厨。"}, {"section": "天坛", "type": "single", "q": "圜丘坛周围泰元、昭亨、广利、成贞四座坛门的命名取自（ ）。", "options": ["A. 《诗经》", "B. 《尚书》", "C. 《易经·乾卦》“元、亨、利、贞”", "D. 《礼记》"], "answer": "C", "explain": "圜丘坛四门取《易经·乾卦》“元、亨、利、贞”，称“天之四德”。", "source": "东泰元门、南昭亨门、西广利门、北成贞门（取《易经·乾卦》“元、亨、利、贞”，称“天之四德”）"}, {"section": "天坛", "type": "single", "q": "1420年按南京天地坛规制建成北京天地坛、实行天地合祀的皇帝是（ ）。", "options": ["A. 明太祖朱元璋", "B. 明成祖朱棣", "C. 明嘉靖帝朱厚熜", "D. 清顺治帝"], "answer": "B", "explain": "明永乐帝（朱棣）初建，永乐十八年（1420年）按南京天地坛规制建成北京天地坛，实行天地合祀。", "source": "明永乐帝（朱棣）——初建。永乐十八年（1420 年）按南京天地坛规制建成北京天地坛（含大祀殿、大祀门、皇乾殿等），实行天地合祀。"}, {"section": "天坛", "type": "multi", "q": "关于祈谷坛建筑群中宰牲亭、神厨、神库的用途，正确的有（ ）。", "options": ["A. 宰牲亭是宰杀祭祀所用牲畜的场所", "B. 神厨是制作、烹饪祭品的厨房", "C. 神库是存放祭器、礼器及供品的库房", "D. 祈谷大典前一日供品在神库供案陈列，皇帝亲自检验", "E. 神厨平时供奉“皇天上帝”神版"], "answer": "ABCD", "explain": "平时供奉神版的是皇乾殿而非神厨；其余四项与原文相符。", "source": "宰牲亭：宰杀祭祀所用牲畜……神厨：制作、烹饪祭品（供品）的厨房……神库：存放祭器、礼器及供品的库房；祈谷大典前一日，供品在神库供案上按各神位分别陈列，皇帝亲自检验后再送上祈年殿。"}, {"section": "天坛", "type": "single", "q": "清乾隆帝在位60年间，到天坛祭祀的次数为（ ）。", "options": ["A. 145次", "B. 155次", "C. 165次", "D. 654次"], "answer": "B", "explain": "清乾隆帝到天坛祭祀155次，为明清两代最多；654次为明清22位皇帝祭祀总次数。", "source": "其中清乾隆帝最多——在位 60 年，到天坛祭祀 155 次。"}, {"section": "天坛", "type": "single", "q": "明成祖朱棣率文武百官在北京天地坛举行首次天地合祀大典的时间是（ ）。", "options": ["A. 明永乐十八年（1420年）", "B. 明永乐十九年（1421年）正月", "C. 明嘉靖九年（1530年）", "D. 清顺治二年（1645年）"], "answer": "B", "explain": "明永乐十九年（1421年）正月，朱棣在天地坛大祀殿举行首次天地合祀大典，标志着明朝正式迁都北京。", "source": "明永乐十九年（1421 年）正月（正月十一日甲戌日），明成祖朱棣率文武百官在北京天地坛大祀殿“大祀天地于南郊”，举行首次天地合祀大典，标志着明朝正式迁都北京。"}, {"section": "天坛", "type": "multi", "q": "下列关于天坛四大声学现象的说法，正确的有（ ）。", "options": ["A. 回音壁是皇穹宇的圆形围墙", "B. 三音石恰为回音壁的圆心", "C. 天心石位于圜丘上层台面正中", "D. 对话石是皇穹宇殿前甬道第18块石板", "E. 在三音石上击掌可听到两声回音"], "answer": "ABCD", "explain": "在三音石（甬道第三块石板）上击掌可听到三声回音，第一、二块石板分别听到一声、两声；其余四项与原文相符。", "source": "三音石—皇穹宇殿前甬道由北向南第三块石板（恰为回音壁圆心）。在此击掌可听到三声回音；第一、二块石板分别听到一声、两声（合称“三才石”）。"}, {"section": "天坛", "type": "single", "q": "天坛初建时得名“天地坛”的原因是（ ）。", "options": ["A. 坛域北圆南方", "B. 建成时兼具祭天与祭地的功能", "C. 由天地两道坛墙环护", "D. 取“天圆地方”之意"], "answer": "B", "explain": "因建成时兼具祭天与祭地功能（在大祀殿实行天地合祀），故名“天地坛”。", "source": "命名原因：因建成时兼具祭天与祭地的功能（在大祀殿实行天地合祀），故名“天地坛”。"}, {"section": "天坛", "type": "single", "q": "天坛辟为天坛公园、正式对外开放的时间是（ ）。", "options": ["A. 1907年", "B. 1918年1月1日", "C. 1949年", "D. 1961年"], "answer": "B", "explain": "民国七年（1918年）1月1日（元旦），天坛辟为天坛公园，正式对外开放。", "source": "民国七年（1918 年）1 月 1 日（元旦），天坛辟为天坛公园，正式对外开放。"}, {"section": "天坛", "type": "multi", "q": "下列属于圜丘坛祭天大典九项仪程的有（ ）。", "options": ["A. 进俎", "B. 初献礼", "C. 亚献礼", "D. 终献礼", "E. 进时辰牌"], "answer": "ABCD", "explain": "九项仪程为燔柴迎帝神、奠玉帛、进俎、初献礼、亚献礼、终献礼、撤馔、送帝神、望燎；「进时辰牌」为斋宫时辰亭的环节，不在九项仪程内。", "source": "九项仪程：燔柴迎帝神（燔柴迎神）、奠玉帛、进俎、初献礼、亚献礼、终献礼、撤馔、送帝神（送神）、望燎。"}, {"section": "天坛", "type": "single", "q": "祈年殿坐落于（ ）之上。", "options": ["A. 三层汉白玉圆台（祈谷坛）", "B. 三层须弥座方台", "C. 丹陛桥", "D. 单层青石台基"], "answer": "A", "explain": "祈年殿坐落于三层汉白玉圆台（祈谷坛，高约6米）之上，为鎏金宝顶、蓝瓦红柱的三重檐圆形大殿。", "source": "坐落于三层汉白玉圆台（祈谷坛，高约 6 米）之上，为鎏金宝顶、蓝瓦红柱的三重檐圆形大殿。"}, {"section": "天坛", "type": "single", "q": "祈年殿遭雷火焚毁后，开始重建的时间是（ ）。", "options": ["A. 光绪十五年（1889年）", "B. 光绪十六年（1890年）", "C. 光绪二十二年（1896年）", "D. 光绪三十三年（1907年）"], "answer": "B", "explain": "祈年殿1889年焚毁，光绪十六年（1890年）开始重建，因图纸无存由工匠凭记忆制图施工，1896年竣工。", "source": "重建：光绪十六年（1890 年）开始重建（因图纸档案无存，工部召集曾参与修缮的工匠凭记忆制图施工）"}, {"section": "天坛", "type": "multi", "q": "下列关于圜丘坛建筑中「九」之运用的说法正确的有（ ）。", "options": ["A. 上层坛面围绕天心石铺9圈扇形石", "B. 中下层坛面亦各9圈递加9块", "C. 三层坛面共有378个「九」", "D. 扇形石合计3402块", "E. 三层栏板合计365块"], "answer": "ABCD", "explain": "三层栏板分别为72、108、180块，合计360块，而非365块，故E错误。", "source": "坛面石板、栏板、台阶亦皆用「九」及九的倍数……三层栏板分别为72、108、180块，合计360块；三层共378个「九」，扇形石合计3402块。"}, {"section": "天坛", "type": "single", "q": "明清时期皇帝举行祈谷礼的时间是每年（ ）。", "options": ["A. 冬至日", "B. 孟春（正月）上辛日", "C. 孟夏遇旱之日", "D. 秋分日"], "answer": "B", "explain": "祈谷礼于每年孟春（正月）上辛日举行（后定为立春后第一个辛日），遇国丧则改次辛日或下辛日。", "source": "时间：每年孟春（正月）上辛日（正月第一个辛日；后定为立春后第一个辛日）。如遇国丧则改次辛日或下辛日。"}, {"section": "天坛", "type": "single", "q": "祈年殿内中圈12根金柱象征（ ）。", "options": ["A. 一年12个月", "B. 一日12个时辰", "C. 一年24节气", "D. 天上二十八星宿"], "answer": "A", "explain": "中圈金柱12根象征一年12个月；外圈檐柱12根象征一日12时辰，中外圈合计24根象征24节气。", "source": "中圈 金柱 12 根 一年 12 个月；外圈 檐柱 12 根 一日 12 个时辰"}, {"section": "天坛", "type": "multi", "q": "下列关于圜丘坛周围附属设施位置的说法正确的有（ ）。", "options": ["A. 燔柴炉位于坛的东南", "B. 瘗坎位于燔柴炉东侧", "C. 望灯杆位于坛的西南", "D. 皇穹宇位于坛北", "E. 宰牲亭、神厨、神库位于坛西"], "answer": "ABCD", "explain": "宰牲亭、神厨、神库位于坛东，而非坛西，故E错误。", "source": "燔柴炉（东南……）……瘗坎（燔柴炉东侧……）……望灯杆（西南……）……宰牲亭、神厨、神库（坛东）；皇穹宇（坛北，即「天库」）。"}, {"section": "天坛", "type": "single", "q": "祈年殿内正中靠北（龙凤石以北）方形高石台上安放的神版是（ ）。", "options": ["A. 清代前八位已故皇帝配位神版", "B. “皇天上帝”正位神版", "C. 日月星辰从位神牌", "D. 五岳五镇神牌"], "answer": "B", "explain": "殿内正中靠北石台上设雕龙宝座与屏风，安放“皇天上帝”（正位）神版；东西两侧较低石台安放清代前八位皇帝配位神版。", "source": "殿内正中靠北（龙凤石以北）有一方形高石台，台上设雕龙宝座与屏风，安放“皇天上帝”（正位）神版"}, {"section": "天坛", "type": "single", "q": "皇乾殿的位置在（ ）。", "options": ["A. 祈年殿以南", "B. 祈谷坛（祈年殿）以北", "C. 丹陛桥东侧", "D. 圜丘坛以北"], "answer": "B", "explain": "皇乾殿位于祈谷坛（祈年殿）以北，是平时供奉神版的大殿，相当于祈谷坛的“天库”。", "source": "位置：位于祈谷坛（祈年殿）以北。"}, {"section": "天坛", "type": "multi", "q": "皇穹宇西配殿供奉的神牌包括（ ）。", "options": ["A. 夜明之神（月）", "B. 云师", "C. 雨师", "D. 北斗七星", "E. 雷师"], "answer": "ABCE", "explain": "西配殿供奉夜明之神（月）、云师、雨师、风伯、雷师神牌；北斗七星供奉于东配殿。", "source": "西配殿供奉夜明之神（月）、云师、雨师、风伯、雷师神牌。"}, {"section": "天坛", "type": "single", "q": "皇乾殿院落西角门“古稀门”的开辟与哪位皇帝有关？（ ）", "options": ["A. 康熙帝", "B. 雍正帝", "C. 乾隆帝", "D. 嘉庆帝"], "answer": "C", "explain": "清乾隆皇帝年满七十（古稀）后，因年事已高、行礼不便绕行，特于皇乾殿院落西侧开辟此门，故名“古稀门”。", "source": "清乾隆皇帝年满七十（古稀）之后，因年事已高、到皇乾殿行礼时不便绕行，特于皇乾殿院落西侧开辟此门，以便出入，故名“古稀门”。"}, {"section": "天坛", "type": "single", "q": "丹陛桥的长度和宽度约为（ ）。", "options": ["A. 长350米、宽5米", "B. 长360米、宽约29米", "C. 长273米、宽32米", "D. 长193米、宽61米"], "answer": "B", "explain": "丹陛桥长360米、宽约29米，高出地面约2.5—4米，北高南低，是北京最古老的“立交桥”。长350米宽5米为供菜廊数据。", "source": "长度与宽度：长 360 米，宽约 29 米（另有 28 米、30 米之说，为不同测量口径）；高出地面约 2.5—4 米，北高南低，是北京最古老的“立交桥”。"}, {"section": "天坛", "type": "multi", "q": "下列关于斋戒铜人亭的说法正确的有（ ）。", "options": ["A. 石制四柱，绿琉璃瓦方形攒尖顶", "B. 高5.5米、宽2.16米", "C. 亭内设高1.3米须弥座", "D. 铜人手持「斋戒」牌", "E. 铜像常年陈设于亭内不撤"], "answer": "ABCD", "explain": "上祭时间一到即撤去铜像，并非常年陈设，故E错误。", "source": "斋戒铜人亭——石制四柱，绿琉璃瓦方形攒尖顶，高5.5米、宽2.16米，亭内设高1.3米须弥座。……手持「斋戒」牌……上祭时间一到即撤去铜像。"}, {"section": "天坛", "type": "single", "q": "祈谷坛具服台位于（ ）。", "options": ["A. 丹陛桥北端（中段偏北）东侧", "B. 祈年殿南侧丹陛之下", "C. 皇乾殿院落西侧", "D. 圜丘坛外墙南面"], "answer": "A", "explain": "祈谷坛具服台位于丹陛桥北端（中段偏北）东侧，坐东朝西，三面围以汉白玉雕石栏杆，供皇帝盥洗更换祭服。", "source": "位于丹陛桥北端（中段偏北）东侧，坐东朝西，三面围以汉白玉雕石栏杆。"}, {"section": "天坛", "type": "single", "q": "站在皇穹宇殿前甬道第18块石板上说话，30多米外配殿角落可清晰听到，此石是（ ）。", "options": ["A. 三音石", "B. 天心石", "C. 对话石", "D. 亿兆景从石"], "answer": "C", "explain": "对话石为皇穹宇殿前甬道第18块石板，站其上说话，30多米外东配殿东北角（或西配殿西北角）可清晰听到。", "source": "对话石—皇穹宇殿前甬道第 18 块石板。站在此石上说话，30 多米外东配殿东北角（或西配殿西北角）可清晰听到，反之亦然。"}, {"section": "天坛", "type": "multi", "q": "下列关于天坛斋宫的说法正确的有（ ）。", "options": ["A. 主体建筑坐西朝东", "B. 正殿为砖券拱顶结构，殿内不用梁枋大木", "C. 正殿覆绿琉璃瓦", "D. 正殿覆黄色琉璃瓦以显帝王之尊", "E. 正殿内悬乾隆御笔「钦若昊天」匾"], "answer": "ABCE", "explain": "帝王寝宫本应覆黄色琉璃瓦，但皇帝对天称臣，故改用低于黄色的绿色琉璃瓦，D错误。", "source": "正殿面阔五间，为砖券拱顶结构，殿内不用梁枋大木……绿琉璃瓦庑殿顶……故改用低于黄色的绿色琉璃瓦……钦若昊天，乾隆御笔。"}, {"section": "天坛", "type": "single", "q": "明清时期皇帝到圜丘坛举行祭天大典的时间是每年（ ）。", "options": ["A. 立春后第一个辛日", "B. 冬至日", "C. 正月上辛日", "D. 夏至日"], "answer": "B", "explain": "祭天时间为每年冬至日；立春后第一个辛日、正月上辛日为祈谷礼时间。", "source": "祭天时间：每年冬至日。"}, {"section": "天坛", "type": "single", "q": "圜丘坛祭天大典开始与结束的时间标志是（ ）。", "options": ["A. 钦天监官员进时辰牌", "B. 斋宫钟楼鸣钟", "C. 燔柴炉点火", "D. 望灯杆上点亮灯笼"], "answer": "D", "explain": "日出前七刻行礼，届时望灯杆上点亮灯笼作为大典开始与结束的时间标志。", "source": "开始时间：日出前七刻（约凌晨4时15分），届时望灯杆上点亮灯笼作为大典开始与结束的时间标志。"}, {"section": "天坛", "type": "multi", "q": "关于神乐署乐舞生的充任与培训，下列说法正确的有（ ）。", "options": ["A. 明初乐生、舞生由道士充任", "B. 清乾隆年间后乐舞生改由八旗子弟充任", "C. 乐舞生由朝廷指派协律郎培训", "D. 乐舞生由太常寺官员兼任", "E. 「玉振金声」寓意中和韶乐集众音之大成"], "answer": "ABCE", "explain": "乾隆年间尽逐道士后，乐舞生改由年少俊秀的八旗子弟充任，由朝廷指派协律郎培训，并非太常寺官员兼任，D错误。", "source": "明初（神乐观时期）乐生、舞生均由道士（道童）充任……乐舞生改由年少俊秀的八旗子弟充任，由朝廷指派协律郎培训。……寓意：中和韶乐集众音之大成。"}, {"section": "天坛", "type": "single", "q": "圜丘坛祭天大典九项仪程中，「燔柴迎帝神」之后紧接着的仪程是（ ）。", "options": ["A. 进俎", "B. 奠玉帛", "C. 初献礼", "D. 撤馔"], "answer": "B", "explain": "九项仪程顺序为：燔柴迎帝神、奠玉帛、进俎、初献礼、亚献礼、终献礼、撤馔、送帝神、望燎。", "source": "九项仪程：燔柴迎帝神（燔柴迎神）、奠玉帛、进俎、初献礼、亚献礼、终献礼、撤馔、送帝神（送神）、望燎。"}, {"section": "天坛", "type": "single", "q": "圜丘坛外壝墙的形状为（ ）。", "options": ["A. 圆形", "B. 椭圆形", "C. 方形", "D. 八角形"], "answer": "C", "explain": "内壝墙呈圆形，外壝墙呈方形，「内圆外方」象征「天圆地方」。", "source": "内壝墙（内墙）呈圆形，外壝墙（外墙）呈方形——「内圆外方」，象征「天圆地方」。"}, {"section": "天坛", "type": "single", "q": "圜丘坛中层坛面直径为十五丈，其取义为（ ）。", "options": ["A. 一", "B. 三、五", "C. 三、七", "D. 九五"], "answer": "B", "explain": "中层十五丈（三五），取义三、五；上层九丈（一九）取义一，下层二十一丈（三七）取义三、七。", "source": "中层 十五丈（三五） 取义三、五。"}, {"section": "天坛", "type": "single", "q": "圜丘坛三层坛面所铺扇形石合计为（ ）。", "options": ["A. 360块", "B. 378块", "C. 3402块", "D. 24块"], "answer": "C", "explain": "扇形石合计3402块；360块为三层栏板总数，378为「九」的个数。", "source": "三层栏板分别为72、108、180块，合计360块；三层共378个「九」，扇形石合计3402块。"}, {"section": "天坛", "type": "single", "q": "「亿兆景从石」指的是（ ）。", "options": ["A. 三音石", "B. 对话石", "C. 丹陛石", "D. 天心石"], "answer": "D", "explain": "天心石位于圜丘坛上层台面正中，又称太极石、亿兆景从石。", "source": "位于圜丘坛上层（第三层）台面正中的圆形石板，又称太极石、亿兆景从石。"}, {"section": "天坛", "type": "single", "q": "圜丘坛燔柴炉在祭天开始时的用途是（ ）。", "options": ["A. 焚烧牛犊以「燔柴迎帝神」", "B. 焚化从位供品", "C. 掩埋牛尾、牛毛、牛血", "D. 吊挂祭天大灯笼"], "answer": "A", "explain": "燔柴炉在祭天开始时焚烧牛犊以「燔柴迎帝神」，礼毕焚烧皇天上帝祭品；焚化从位供品用铁燎炉，掩埋牛尾等用瘗坎。", "source": "燔柴炉（东南，绿琉璃砖砌，高约9尺）——祭天开始时焚烧牛犊以「燔柴迎帝神」，礼毕焚烧皇天上帝祭品。"}, {"section": "天坛", "type": "single", "q": "圜丘坛周围棂星门共有（ ）。", "options": ["A. 8座", "B. 12座", "C. 18座", "D. 24座"], "answer": "D", "explain": "圜丘坛附属设施中棂星门共24座。", "source": "棂星门24座。"}, {"section": "天坛", "type": "single", "q": "圜丘坛望灯杆的高度约为（ ）。", "options": ["A. 9尺", "B. 9丈（约30米）", "C. 19.2米", "D. 38米"], "answer": "B", "explain": "望灯杆高约9丈（约30米）；9尺为燔柴炉高，19.2米为祈年殿龙井柱高，38米为祈年殿总高。", "source": "望灯杆（西南，高约9丈／30米）。"}, {"section": "天坛", "type": "single", "q": "祭天大典时望灯杆上吊挂的大灯笼高（ ）。", "options": ["A. 0.9米", "B. 1.3米", "C. 2.15米", "D. 2.5米"], "answer": "C", "explain": "大灯笼直径1.3米、高2.15米。", "source": "灯笼：祭天大典时在望灯杆上吊挂直径1.3米、高2.15米的大灯笼。"}, {"section": "天坛", "type": "single", "q": "皇穹宇正殿正中汉白玉雕花圆形石座（须弥座）上供奉的是（ ）。", "options": ["A. 清代前八位皇帝配位神牌", "B. 皇天上帝神牌", "C. 大明之神（日）神牌", "D. 夜明之神（月）神牌"], "answer": "B", "explain": "正殿正中须弥座上供奉「皇天上帝」神牌（正位）；配位神牌在两侧方形石台，日月神牌在东西配殿。", "source": "正殿正中汉白玉雕花圆形石座（须弥座）上供奉「皇天上帝」神牌（正位）。"}, {"section": "天坛", "type": "single", "q": "清朝皇穹宇大殿覆蓝色（青色）琉璃瓦、鎏金宝顶，其象征意义是（ ）。", "options": ["A. 象征黄土", "B. 象征青天", "C. 象征五行之水", "D. 象征皇权"], "answer": "B", "explain": "皇穹宇大殿覆蓝色（青色）琉璃瓦，鎏金宝顶，象征青天。", "source": "蓝色（青色）琉璃瓦，鎏金宝顶，象征青天。"}, {"section": "天坛", "type": "single", "q": "天坛斋宫主体建筑坐西朝东的原因是（ ）。", "options": ["A. 顺应北京冬季主导风向", "B. 皇帝在「天」面前只能退居臣子之位，以示对天称臣", "C. 与祈年殿轴线保持一致", "D. 便于皇帝自紫禁城出入"], "answer": "B", "explain": "祭天建筑坐北朝南，皇帝在「天」面前只能退居臣子之位，故斋宫坐西朝东，以示对天称臣、不敢称尊。", "source": "祭天建筑坐北朝南，皇帝在「天」面前只能退居臣子之位，故斋宫坐西朝东，以示对天称臣、不敢称尊。"}, {"section": "天坛", "type": "single", "q": "斋宫正殿月台三出陛，左右两侧台阶各为（ ）。", "options": ["A. 9级", "B. 12级", "C. 13级", "D. 15级"], "answer": "D", "explain": "殿前月台崇基石栏、三出陛，正阶13级，左右各15级。", "source": "殿前月台崇基石栏、三出陛（正阶13级，左右各15级），正面台阶中间为云纹浮雕丹陛。"}, {"section": "天坛", "type": "single", "q": "斋宫正殿殿顶覆盖的琉璃瓦颜色为（ ）。", "options": ["A. 黄色", "B. 蓝色", "C. 绿色", "D. 黑色"], "answer": "C", "explain": "斋宫殿顶覆绿色琉璃瓦（正殿红墙绿瓦），因皇帝在皇天上帝面前不敢妄自尊大，故改用低于黄色的绿色。", "source": "斋宫殿顶琉璃瓦的颜色：绿色琉璃瓦（正殿红墙绿瓦）。"}, {"section": "天坛", "type": "single", "q": "斋宫月台斋戒铜人亭内陈设的铜铸人像，手持的牌上书写的是（ ）。", "options": ["A. 「钦若昊天」", "B. 「时辰」", "C. 「斋戒」", "D. 「敬天」"], "answer": "C", "explain": "铜铸人像乌纱玉带、手持「斋戒」牌，相传仿唐朝宰相魏徵而制，用以警示皇帝虔诚斋戒。", "source": "亭内设高1.3米须弥座。皇帝斋戒时于座上陈设一尊铜铸人像（乌纱玉带、手持「斋戒」牌），相传仿唐朝宰相魏徵而制。"}, {"section": "天坛", "type": "single", "q": "神乐署正殿由「太和殿」赐名改为「凝禧殿」是在（ ）。", "options": ["A. 明永乐年间", "B. 明嘉靖年间", "C. 清顺治年间", "D. 清康熙年间"], "answer": "D", "explain": "明代称「太和殿」，因与紫禁城太和殿重名，清康熙年间（一说康熙十二年1673年）由康熙帝赐名改为「凝禧殿」。", "source": "明代称「太和殿」（因与紫禁城太和殿重名，清康熙年间／一说康熙十二年1673年由康熙帝赐名改为「凝禧殿」）。"}, {"section": "天坛", "type": "single", "q": "神乐署凝禧殿内「玉振金声」匾的典故出自（ ）。", "options": ["A. 《论语》", "B. 《孟子·万章下》", "C. 《易经·乾卦》", "D. 《诗经》"], "answer": "B", "explain": "「玉振金声」语出《孟子·万章下》「集大成也者，金声而玉振之也」，寓意中和韶乐集众音之大成。", "source": "寓意：中和韶乐集众音之大成，以表达对天神的歌颂与崇敬（语出《孟子·万章下》「集大成也者，金声而玉振之也」）。"}, {"section": "颐和园", "type": "single", "q": "仁寿殿是慈禧太后和光绪皇帝在园中临朝理政、接受恭贺和接见外宾的场所，其功能相当于紫禁城的（　）。", "options": ["A. 中和殿", "B. 太和殿", "C. 保和殿", "D. 乾清宫"], "answer": "B", "explain": "原文明确指出仁寿殿“功能相当于紫禁城的太和殿”。", "source": "仁寿殿是颐和园宫廷区的正殿，为慈禧太后和光绪皇帝在园中临朝理政、接受恭贺和接见外宾的场所（功能相当于紫禁城的太和殿）。"}, {"section": "颐和园", "type": "judge", "q": "仁寿殿的前身为清漪园时期的勤政殿，始建于乾隆十五年（1750年），咸丰十年（1860年）被英法联军焚毁，光绪十二年（1886年）重建并改名为“仁寿殿”。", "answer": "对", "explain": "与原文记载完全一致：始建1750年、1860年被焚、1886年重建改名仁寿殿。", "source": "其前身为清漪园时期的勤政殿，始建于乾隆十五年（1750年），咸丰十年（1860年）被英法联军焚毁；光绪十二年（1886年）重建，并改名为“仁寿殿”。"}, {"section": "颐和园", "type": "multi", "q": "下列建筑中，属于玉澜堂附属建筑的有（　）。", "options": ["A. 霞芬室", "B. 藕香榭", "C. 夕佳楼", "D. 养云轩", "E. 宜芸馆"], "answer": "ABCD", "explain": "玉澜堂前殿为霞芬室、后殿为藕香榭，院内东西配殿分别为夕佳楼、养云轩；宜芸馆不在原文所述附属建筑之列。", "source": "霞芬室（前殿）、藕香榭（后殿），均为光绪帝起居、读书之所。院内东西配殿分别为夕佳楼、养云轩。"}, {"section": "颐和园", "type": "single", "q": "“仁寿殿”之“仁寿”二字出自（　），取“仁者寿考”之意。", "options": ["A. 《论语·学而》", "B. 《孟子·梁惠王》", "C. 《论语·雍也》", "D. 《大学》"], "answer": "C", "explain": "“仁寿”二字出自《论语·雍也》“知者乐，仁者寿”，寓意施仁政者长寿。", "source": "“仁寿”二字出自《论语·雍也》“知者乐，仁者寿”，取“仁者寿考”之意，寓意施仁政者长寿。"}, {"section": "颐和园", "type": "judge", "q": "仁寿殿前月台两侧的铜龙、铜凤为高约4米的香炉，作龙凤对舞之姿，其规制为龙居中、凤在外。", "answer": "错", "explain": "铜龙凤香炉特殊之处在于凤居中、龙在外（一般规制为龙居中），取“凤在上、龙在下”之意，象征慈禧实际掌权。", "source": "铜龙、铜凤：置于仁寿殿前月台两侧，为香炉（高约4米），作龙凤对舞之姿。其特殊之处在于凤居中、龙在外（一般规制为龙居中）。"}, {"section": "颐和园", "type": "single", "q": "乐寿堂院内种植玉兰、海棠、牡丹，谐音寓意（　）。", "options": ["A. 六合太平", "B. 玉堂富贵", "C. 龙凤呈祥", "D. 河清海晏"], "answer": "B", "explain": "院内植玉兰、海棠、牡丹，谐音“玉堂富贵”；“六合太平”指堂前铜鹿、铜鹤与大铜瓶。", "source": "玉堂富贵：院内植玉兰、海棠、牡丹，谐音“玉堂富贵”。"}, {"section": "颐和园", "type": "judge", "q": "仁寿殿前的铜麒麟俗谓“四不像”，原置于圆明园长春园，于民国二十六年（1937年）移入颐和园。", "answer": "对", "explain": "原文：铜麒麟俗谓“四不像”（龙头、鹿角、狮眼、虎背、熊腰、蛇鳞、牛尾），原置于圆明园长春园，1937年移入颐和园。", "source": "铜麒麟：位于仁寿殿前，为瑞兽（俗谓“四不像”……）。原置于圆明园长春园，圆明园焚毁后于民国二十六年（1937年）移入颐和园。"}, {"section": "颐和园", "type": "multi", "q": "颐和园长廊上自东向西建有四座八角重檐亭，下列属于这四座亭名的有（　）。", "options": ["A. 留佳亭", "B. 寄澜亭", "C. 秋水亭", "D. 清遥亭", "E. 知春亭"], "answer": "ABCD", "explain": "长廊四亭为留佳、寄澜、秋水、清遥，取“留寄秋清”之意；知春亭在东堤岸外小岛上，不属于长廊四亭。", "source": "廊上自东向西建有四座八角重檐亭，分别题名留佳、寄澜、秋水、清遥（取“留寄秋清”之意）。"}, {"section": "颐和园", "type": "single", "q": "乐寿堂堂前陈列的“六合太平”陈设是指（　）。", "options": ["A. 铜鹿、铜鹤与大铜瓶", "B. 铜龙、铜凤与铜麒麟", "C. 玉兰、海棠与牡丹", "D. 紫檀木百寿屏风"], "answer": "A", "explain": "堂前陈列铜鹿、铜鹤与大铜瓶，“鹿鹤瓶”谐音“六合太平”（天下太平）。", "source": "六合太平：堂前陈列铜鹿、铜鹤与大铜瓶，“鹿鹤瓶”谐音“六合太平”（天下太平）。"}, {"section": "颐和园", "type": "judge", "q": "青芝岫为一块巨型北太湖石，清代士大夫米万钟于房山发现此石，欲运回私家园林“勺园”未果，民间遂称“败家石”。", "answer": "错", "explain": "米万钟是明代士大夫（宛平人），不是清代；因运石耗资巨大、家道中落，民间称“败家石”。", "source": "明代士大夫米万钟（宛平人）于房山发现此石，欲运回私家园林“勺园”，因体积庞大、耗费巨资未果，石弃于良乡，米氏因此家道中落，民间称“败家石”。"}, {"section": "颐和园", "type": "single", "q": "青芝岫（败家石）被乾隆帝命人运至清漪园，置于（　）前。", "options": ["A. 仁寿殿", "B. 玉澜堂", "C. 排云殿", "D. 乐寿堂"], "answer": "D", "explain": "乾隆帝南巡途经见此石，命运至清漪园乐寿堂前，赐名“青芝岫”。", "source": "乾隆帝南巡途经见之，命运至清漪园乐寿堂前，赐名“青芝岫”，并题“玉英”“莲秀”等字。"}, {"section": "颐和园", "type": "judge", "q": "戊戌变法后，慈禧太后曾将光绪皇帝软禁于玉澜堂，玉澜堂院落以砖墙封死。", "answer": "对", "explain": "原文明确记载：戊戌变法后，慈禧曾将光绪软禁于玉澜堂，院落以砖墙封死。", "source": "戊戌变法后，慈禧曾将光绪软禁于此，玉澜堂院落以砖墙封死。"}, {"section": "颐和园", "type": "multi", "q": "昆明湖中按“一池三山”传统设有三岛，下列属于这三岛的有（　）。", "options": ["A. 南湖岛", "B. 藻鉴堂岛", "C. 治镜阁岛", "D. 知春亭岛", "E. 琼华岛"], "answer": "ABC", "explain": "“一池三山”三岛为南湖岛（最大）、藻鉴堂岛、治镜阁岛；知春亭岛是东堤岸外小岛，不在三岛之列。", "source": "三岛：昆明湖中按“一池三山”传统设三岛——南湖岛（最大，上有广润灵雨祠/龙王庙）、藻鉴堂岛、治镜阁岛。"}, {"section": "颐和园", "type": "single", "q": "扬仁风位于谐趣园以北、万寿山南麓，是一座（　）殿宇。", "options": ["A. 圆形", "B. 扇形", "C. 六角形", "D. 方形"], "answer": "B", "explain": "扬仁风是一座扇形（扇面形）殿宇，殿内地面、宝座、装修均作扇面状，整体如一柄展开折扇。", "source": "扬仁风位于谐趣园以北、万寿山南麓，是一座扇形（扇面形）殿宇……整体如一柄展开折扇。"}, {"section": "颐和园", "type": "judge", "q": "智慧海位于万寿山最高处、佛香阁之前，是一座重檐歇山顶的木结构佛殿。", "answer": "错", "explain": "智慧海位于佛香阁之后（非之前），且是一座无梁殿——全用砖石拱券砌成，不用梁柱，并非木结构。", "source": "智慧海位于万寿山最高处、佛香阁之后，是一座无梁殿（全用砖石拱券砌成，不用梁柱），供奉佛教诸神。"}, {"section": "颐和园", "type": "single", "q": "排云殿之名出自晋代郭璞《游仙诗》中的（　）。", "options": ["A. “知者乐，仁者寿”", "B. “神仙排云出，但见金银台”", "C. “扬仁风，慰黎庶”", "D. “以物外之静趣，谐寸田之中和”"], "answer": "B", "explain": "排云殿名出自郭璞《游仙诗》“神仙排云出，但见金银台”，喻众仙排云而至。", "source": "其名出自晋代郭璞《游仙诗》“神仙排云出，但见金银台”，喻众仙排云而至。"}, {"section": "颐和园", "type": "judge", "q": "苏州街又称“万寿买卖街”，位于后湖（苏州河）两岸，仿江南水乡市肆而建，1986年依档案复建，全长约300米。", "answer": "对", "explain": "与原文一致：苏州街位于后湖两岸，咸丰十年（1860年）被英法联军焚毁，1986年依档案复建，全长约300米。", "source": "苏州街（又称“万寿买卖街”）位于后湖（苏州河）两岸，仿江南水乡市肆而建……1986年依档案复建，全长约300米。"}, {"section": "颐和园", "type": "multi", "q": "颐和园西堤六桥仿杭州苏堤而建，下列桥名属于西堤六桥的有（　）。", "options": ["A. 界湖桥", "B. 玉带桥", "C. 镜桥", "D. 柳桥", "E. 绣漪桥"], "answer": "ABCD", "explain": "西堤六桥自北而南为界湖桥、豳风桥、玉带桥、镜桥、练桥、柳桥；绣漪桥（罗锅桥）位于东堤南端、昆明湖出水口，不在六桥之列。", "source": "西堤六桥（仿杭州苏堤）：自北而南为界湖桥、豳风桥、玉带桥、镜桥、练桥、柳桥。"}, {"section": "颐和园", "type": "single", "q": "宝云阁（铜亭）建于清乾隆二十年（1755年），其通高为（　）。", "options": ["A. 41米", "B. 21米", "C. 7.55米", "D. 36米"], "answer": "C", "explain": "宝云阁通高7.55米，重约41.4万斤（约207吨）；41米为佛香阁高度，21米为佛香阁石砌高台高度。", "source": "宝云阁俗称“铜亭”……建于清乾隆二十年（1755年）；通高7.55米，重约41.4万斤（约207吨）；为重檐歇山顶。"}, {"section": "颐和园", "type": "judge", "q": "“仁寿”二字取“仁者寿考”之意，寓意施仁政者长寿。", "answer": "对", "explain": "原文：“仁寿”二字出自《论语·雍也》“知者乐，仁者寿”，取“仁者寿考”之意，寓意施仁政者长寿。", "source": "“仁寿”二字出自《论语·雍也》“知者乐，仁者寿”，取“仁者寿考”之意，寓意施仁政者长寿。"}, {"section": "颐和园", "type": "single", "q": "颐和园的标志性建筑佛香阁，其形制为（　）。", "options": ["A. 六面三层四重檐", "B. 八面三层四重檐", "C. 八面四层三重檐", "D. 四面三层四重檐"], "answer": "B", "explain": "佛香阁形制为八面三层四重檐，通体攒尖，黄琉璃瓦绿剪边，通高约41米。", "source": "形制：八面三层四重檐，通体攒尖，黄琉璃瓦绿剪边。高度：通高约41米。"}, {"section": "颐和园", "type": "judge", "q": "仁寿殿前铜麒麟俗谓“四不像”，其特征为龙头、鹿角、狮眼、虎背、豹腰、蛇鳞、牛尾。", "answer": "错", "explain": "“四不像”为龙头、鹿角、狮眼、虎背、熊腰、蛇鳞、牛尾，“豹腰”应为“熊腰”。", "source": "铜麒麟：位于仁寿殿前，为瑞兽（俗谓“四不像”：龙头、鹿角、狮眼、虎背、熊腰、蛇鳞、牛尾）。"}, {"section": "颐和园", "type": "multi", "q": "下列关于乐寿堂吉祥陈设与植物寓意的说法，正确的有（　）。", "options": ["A. 堂前铜鹿、铜鹤与大铜瓶谐音“六合太平”", "B. 院内植玉兰、海棠、牡丹谐音“玉堂富贵”", "C. 堂前铜龙、铜凤寓意“龙凤呈祥”", "D. 堂内紫檀木雕“百寿”屏风刻不同写法的“寿”字", "E. 院内植松、竹、梅寓意“岁寒三友”"], "answer": "ABD", "explain": "铜龙凤香炉在仁寿殿前而非乐寿堂；“岁寒三友”之说原文无据。A、B、D均与原文一致。", "source": "六合太平：堂前陈列铜鹿、铜鹤与大铜瓶……玉堂富贵：院内植玉兰、海棠、牡丹……百寿屏风：堂内紫檀木雕“百寿”屏风。"}, {"section": "颐和园", "type": "single", "q": "今佛香阁内供奉的明代万历年间铸造的千手观音铜像，1989年由文物部门自城内（　）移入。", "options": ["A. 大报恩延寿寺", "B. 泰安寺", "C. 弥陀寺", "D. 广润灵雨祠"], "answer": "C", "explain": "千手观音铜像原供于弥陀寺，1989年由文物部门自城内弥陀寺移入佛香阁供奉。", "source": "今阁内供奉明代万历年间铸造的千手观音铜像……原供于弥陀寺，1989年由文物部门自城内弥陀寺移入佛香阁供奉。"}, {"section": "颐和园", "type": "judge", "q": "乐寿堂堂内有紫檀木雕“百寿”屏风，上刻不同写法的“寿”字。", "answer": "对", "explain": "与原文一致：乐寿堂堂内紫檀木雕“百寿”屏风，上刻不同写法的“寿”字。", "source": "百寿屏风：堂内紫檀木雕“百寿”屏风，上刻不同写法的“寿”字。"}, {"section": "颐和园", "type": "single", "q": "谐趣园始建于乾隆十六年（1751年），初名（　），系仿江苏无锡寄畅园而建。", "options": ["A. 寄畅园", "B. 惠山园", "C. 勺园", "D. 清漪园"], "answer": "B", "explain": "谐趣园初名惠山园，仿无锡寄畅园而建；嘉庆十六年（1811年）重修后改名“谐趣园”。", "source": "始建于乾隆十六年（1751年），初名惠山园，系仿江苏无锡寄畅园而建；嘉庆十六年（1811年）重修后改名“谐趣园”。"}, {"section": "颐和园", "type": "judge", "q": "排云殿于光绪十二年（1886年）在文昌阁东侧原大报恩延寿寺基址上改建而成。", "answer": "错", "explain": "排云殿是在文昌阁西侧（非东侧）原大报恩延寿寺基址上改建，咸丰十年原寺被焚毁。", "source": "排云殿于光绪十二年（1886年）在文昌阁西侧原大报恩延寿寺基址上改建而成（咸丰十年原寺被焚毁）。"}, {"section": "颐和园", "type": "multi", "q": "下列关于玉澜堂的说法，正确的有（　）。", "options": ["A. 是光绪皇帝的寝宫", "B. 前殿为霞芬室、后殿为藕香榭", "C. 戊戌变法后慈禧曾将光绪软禁于此", "D. 院内悬有“复殿留景”匾", "E. 是慈禧太后的寝宫与用膳之处"], "answer": "ABCD", "explain": "慈禧的寝宫与用膳之处是乐寿堂，不是玉澜堂，故E错误；其余四项均与原文一致。", "source": "玉澜堂是光绪皇帝的寝宫……另有“复殿留景”匾……戊戌变法后，慈禧曾将光绪软禁于此，玉澜堂院落以砖墙封死。"}, {"section": "颐和园", "type": "single", "q": "位于西堤南端、与文昌阁隔湖相望、内供关圣帝君的宿云檐，其原名是（　）。", "options": ["A. 贝阙", "B. 撷秀", "C. 敷华", "D. 清晏"], "answer": "A", "explain": "宿云檐原名“贝阙”，内供关圣帝君（关羽），象征“武”，与东堤北端象征“文”的文昌阁构成“文武辅弼”格局。", "source": "宿云檐（原名“贝阙”）：位于西堤南端（与文昌阁隔湖相望），内供关圣帝君（关羽），象征“武”。"}, {"section": "颐和园", "type": "judge", "q": "佛香阁矗立于万寿山前山中央一座高41米的石砌高台之上。", "answer": "错", "explain": "石砌高台高21米；41米是佛香阁的通高，二者不可混淆。", "source": "佛香阁是颐和园的标志性建筑，矗立于万寿山前山中央的石砌高台（高21米）之上……通高约41米。"}, {"section": "颐和园", "type": "single", "q": "连接东堤与南湖岛的十七孔桥全长150米，桥栏望柱上雕有石狮（　）。", "options": ["A. 485只", "B. 501只", "C. 544只", "D. 627只"], "answer": "C", "explain": "十七孔桥桥栏望柱上雕544只石狮，仿卢沟桥，又兼取苏州宝带桥之韵。", "source": "十七孔桥：连接东堤与南湖岛，全长150米，桥栏望柱上雕544只石狮（仿卢沟桥，又兼取苏州宝带桥之韵）。"}, {"section": "颐和园", "type": "judge", "q": "谐趣园于嘉庆十六年（1811年）重修后改名，取“以物外之静趣，谐寸田之中和”之意。", "answer": "对", "explain": "与原文一致：嘉庆十六年重修后由惠山园改名“谐趣园”，取“以物外之静趣，谐寸田之中和”之意。", "source": "嘉庆十六年（1811年）重修后改名“谐趣园”，取“以物外之静趣，谐寸田之中和”之意。"}, {"section": "颐和园", "type": "multi", "q": "下列关于智慧海的说法，正确的有（　）。", "options": ["A. 是一座全用砖石拱券砌成、不用梁柱的无梁殿", "B. 位于万寿山最高处、佛香阁之后", "C. 殿外壁面嵌有无量寿佛琉璃小像", "D. 殿前牌坊额题“众香界”，坊后照壁题“祗树林”", "E. 为重檐歇山顶木结构佛殿"], "answer": "ABCD", "explain": "智慧海是无梁殿，全用砖石拱券砌成，并非木结构，E错误；其余均与原文一致。", "source": "智慧海位于万寿山最高处、佛香阁之后，是一座无梁殿……殿外壁面嵌有无量寿佛琉璃小像；殿前牌坊额题“众香界”，坊后照壁题“祗树林”。"}, {"section": "颐和园", "type": "single", "q": "仁寿殿重建并改名为“仁寿殿”的时间是（　）。", "options": ["A. 乾隆十五年（1750年）", "B. 咸丰十年（1860年）", "C. 光绪十二年（1886年）", "D. 民国二十六年（1937年）"], "answer": "C", "explain": "仁寿殿前身勤政殿始建于1750年，1860年被英法联军焚毁，1886年重建并改名“仁寿殿”。", "source": "咸丰十年（1860年）被英法联军焚毁；光绪十二年（1886年）重建，并改名为“仁寿殿”。"}, {"section": "颐和园", "type": "judge", "q": "昆明湖东堤铜牛铸于乾隆二十年（1755年），牛背铸有乾隆《金牛铭》，取“铁牛镇水”之意。", "answer": "对", "explain": "与原文一致：铜牛铸于乾隆二十年（1755年），牛背铸乾隆《金牛铭》，取大禹治水铸牛镇水患之意。", "source": "铜牛：铸于乾隆二十年（1755年），置于东堤，牛背铸乾隆《金牛铭》，取“铁牛镇水”（大禹治水铸牛镇水患）之意。"}, {"section": "颐和园", "type": "single", "q": "仁寿殿前的铜麒麟原置于（　），1937年移入颐和园。", "options": ["A. 紫禁城太和殿前", "B. 圆明园长春园", "C. 承德避暑山庄", "D. 房山米氏勺园"], "answer": "B", "explain": "铜麒麟原置于圆明园长春园，圆明园焚毁后于民国二十六年（1937年）移入颐和园。", "source": "原置于圆明园长春园，圆明园焚毁后于民国二十六年（1937年）移入颐和园。"}, {"section": "颐和园", "type": "multi", "q": "下列关于玉带桥的说法，正确的有（　）。", "options": ["A. 是西堤六桥中最高的一座", "B. 是西堤六桥中唯一的高拱石桥", "C. 矢高约7.5米", "D. 以汉白玉砌筑，桥拱如玉带", "E. 单孔净跨约17米"], "answer": "ABCD", "explain": "玉带桥单孔净跨约11.38米，不是17米，E错误；其余均与原文一致。", "source": "其中玉带桥最高（唯一高拱石桥，矢高约7.5米，单孔净跨约11.38米，以汉白玉砌筑，桥拱如玉带）。"}, {"section": "颐和园", "type": "single", "q": "扇形殿宇“扬仁风”的名称取自（　），乾隆以此标榜“宣扬仁政”。", "options": ["A. 《论语·雍也》“知者乐，仁者寿”", "B. 《晋书·袁宏传》“扬仁风，慰黎庶”", "C. 郭璞《游仙诗》“神仙排云出，但见金银台”", "D. 《长安客话》“路从此分，四通八达”"], "answer": "B", "explain": "扬仁风名称取自《晋书·袁宏传》“扬仁风，慰黎庶”，又传说与“扇枕温衾”孝亲典故及王羲之“题扇”故事相关。", "source": "名称取自《晋书·袁宏传》“扬仁风，慰黎庶”，乾隆以此标榜“宣扬仁政”。"}, {"section": "颐和园", "type": "single", "q": "排云殿是光绪十二年在原（　）基址上改建而成的。", "options": ["A. 大报恩延寿寺", "B. 弥陀寺", "C. 泰安寺", "D. 广润灵雨祠"], "answer": "A", "explain": "排云殿在文昌阁西侧原大报恩延寿寺基址上改建而成，咸丰十年原寺被焚毁。", "source": "排云殿于光绪十二年（1886年）在文昌阁西侧原大报恩延寿寺基址上改建而成（咸丰十年原寺被焚毁）。"}, {"section": "颐和园", "type": "single", "q": "宝云阁（铜亭）是中国现存最大的铜铸佛殿，其重量约为（　）。", "options": ["A. 5吨", "B. 41吨", "C. 207吨", "D. 500吨"], "answer": "C", "explain": "宝云阁重约41.4万斤（约207吨）；5吨是佛香阁内千手观音铜像的重量。", "source": "通高7.55米，重约41.4万斤（约207吨）……是中国现存最大的铜铸佛殿。"}, {"section": "颐和园", "type": "single", "q": "佛香阁内供奉的明代万历年间铸造的千手观音铜像，其高度约为（　）。", "options": ["A. 3米", "B. 5米", "C. 7.55米", "D. 21米"], "answer": "B", "explain": "千手观音铜像高约5米、重约5吨，1989年自城内弥陀寺移入佛香阁。", "source": "今阁内供奉明代万历年间铸造的千手观音铜像（高约5米、重约5吨）。"}, {"section": "颐和园", "type": "single", "q": "云辉玉宇牌楼位于排云门南、昆明湖北岸，其南面额题（　），喻众星拱卫北斗、帝王如中枢。", "options": ["A. 云辉玉宇", "B. 星拱瑶枢", "C. 众香界", "D. 吉祥云"], "answer": "B", "explain": "云辉玉宇牌楼北面额“云辉玉宇”，南面额“星拱瑶枢”（喻众星拱卫北斗，帝王如中枢）。", "source": "云辉玉宇牌楼（排云门南、昆明湖北岸）：北面额“云辉玉宇”，南面额“星拱瑶枢”。"}, {"section": "颐和园", "type": "single", "q": "颐和园长廊东西起于邀月门、止于石丈亭，是中国园林中最长的游廊，全长约（　）。", "options": ["A. 300米", "B. 520米", "C. 728米", "D. 986米"], "answer": "C", "explain": "长廊全长约728米，共273间，廊枋绘有14000余幅彩画。", "source": "长廊东西起于邀月门、止于石丈亭，全长约728米，共273间，是中国园林中最长的游廊。"}, {"section": "颐和园", "type": "single", "q": "石舫“清晏舫”取“河清海晏、天下太平”之意，同时喻（　）的治国警训。", "options": ["A. “水能载舟，亦能覆舟”", "B. “居安思危，戒奢以俭”", "C. “仁者乐山，智者乐水”", "D. “生于忧患，死于安乐”"], "answer": "A", "explain": "乾隆题“清晏舫”，取“河清海晏、天下太平”之意，喻“水能载舟，亦能覆舟”的治国警训。", "source": "乾隆题“清晏舫”，取“河清海晏、天下太平”之意，喻“水能载舟，亦能覆舟”的治国警训。"}, {"section": "颐和园", "type": "single", "q": "谐趣园重修后由“惠山园”改名为“谐趣园”是在（　）。", "options": ["A. 乾隆十六年（1751年）", "B. 乾隆二十年（1755年）", "C. 嘉庆十六年（1811年）", "D. 光绪十二年（1886年）"], "answer": "C", "explain": "谐趣园始建于乾隆十六年（1751年），嘉庆十六年（1811年）重修后改名“谐趣园”。", "source": "始建于乾隆十六年（1751年），初名惠山园……嘉庆十六年（1811年）重修后改名“谐趣园”。"}, {"section": "颐和园", "type": "single", "q": "乾隆在昆明湖东堤铸铜牛并亲题《金牛铭》，其取意源于（　）。", "options": ["A. 老子骑牛出函谷关", "B. 大禹治水铸牛镇水患", "C. 牛郎织女的民间传说", "D. 农耕社会重牛的传统"], "answer": "B", "explain": "铜牛取“铁牛镇水”（大禹治水铸牛镇水患）之意。", "source": "牛背铸乾隆《金牛铭》，取“铁牛镇水”（大禹治水铸牛镇水患）之意。"}, {"section": "颐和园", "type": "single", "q": "颐和园西堤六桥中最高、也是唯一的高拱石桥是（　）。", "options": ["A. 界湖桥", "B. 豳风桥", "C. 玉带桥", "D. 柳桥"], "answer": "C", "explain": "玉带桥为西堤六桥中最高者，唯一高拱石桥，矢高约7.5米，以汉白玉砌筑，桥拱如玉带。", "source": "其中玉带桥最高（唯一高拱石桥，矢高约7.5米，单孔净跨约11.38米，以汉白玉砌筑，桥拱如玉带）。"}, {"section": "颐和园", "type": "single", "q": "位于东堤南端、昆明湖出水口，因拱如罗锅得名、被称为通往昆明湖“第一桥”的是（　）。", "options": ["A. 十七孔桥", "B. 玉带桥", "C. 绣漪桥", "D. 练桥"], "answer": "C", "explain": "绣漪桥又称“罗锅桥”，汉白玉单孔高拱桥，高约9米，是通往昆明湖的“第一桥”。", "source": "绣漪桥（又称“罗锅桥”）：位于东堤南端、昆明湖出水口……是通往昆明湖的“第一桥”，因拱如罗锅得名。"}, {"section": "长城", "type": "single", "q": "秦长城依据“因地形，用险制塞”的原则修筑，其主持者大将蒙恬率军民（　）北逐匈奴后所筑。", "options": ["A. 十万", "B. 二十万", "C. 三十万", "D. 五十万"], "answer": "C", "explain": "原文：主持者为大将蒙恬，率三十万军民北逐匈奴后所筑。", "source": "主持者为大将蒙恬，率三十万军民北逐匈奴后所筑。"}, {"section": "长城", "type": "judge", "q": "据国家文物局长城资源调查，历代长城分布于15个省、自治区、直辖市，涉及404个县（市、区），各类遗存总数43721处（座/段）。", "answer": "对", "explain": "与原文数据一致：15个省级行政区、404个县、43721处遗存。", "source": "历代长城分布于15个省、自治区、直辖市……涉及404个县（市、区），各类遗存总数43721处（座/段）。"}, {"section": "长城", "type": "multi", "q": "长城的主要建筑构造类型多样，下列属于长城建筑构造的有（　）。", "options": ["A. 城墙（墙壕）", "B. 敌楼（敌台）", "C. 烽火台（烟墩）", "D. 关堡（城堡）", "E. 四合院"], "answer": "ABCD", "explain": "长城建筑构造包括城墙、敌楼、墙台、烽火台、壕堑/界壕、关堡/城堡等；四合院与长城构造无关。", "source": "城墙（墙壕）：主体。敌楼（敌台）……烽火台（烟墩）……壕堑/界壕……关堡/城堡：驻军与指挥据点。"}, {"section": "长城", "type": "single", "q": "明代大规模修筑长城约（　），几乎与明朝相始终。", "options": ["A. 8次", "B. 12次", "C. 18次", "D. 28次"], "answer": "C", "explain": "明代大规模修筑长城约18次（一说20余次），几乎与明朝相始终。", "source": "明代大规模修筑长城约18次（一说20余次），几乎与明朝相始终。"}, {"section": "长城", "type": "judge", "q": "中国最早的长城是秦国所筑的秦长城，约建于公元前3世纪。", "answer": "错", "explain": "最早的长城是楚国所筑楚方城，约建于公元前7世纪（春秋时期）；秦长城西起临洮、东至辽东，并非最早。", "source": "最早：楚国所筑楚方城，约建于公元前7世纪（春秋时期），为中国最早的长城。"}, {"section": "长城", "type": "single", "q": "明初献策“高筑墙，广积粮，缓称王”、奠定边防思想的人物是（　）。", "options": ["A. 朱升", "B. 刘基", "C. 徐达", "D. 戚继光"], "answer": "A", "explain": "朱升献策“高筑墙，广积粮，缓称王”，为明初建国方略，奠定边防思想。", "source": "朱升献策“高筑墙，广积粮，缓称王”（明初建国方略，奠定边防思想）。"}, {"section": "长城", "type": "judge", "q": "明长城西起嘉峪关（甘肃），东至辽宁虎山（丹东）。", "answer": "对", "explain": "与原文一致；注意汉长城为西起新疆罗布泊、东至辽东，二者起止点不同。", "source": "明长城：西起嘉峪关（甘肃），东至辽宁虎山（丹东）。"}, {"section": "长城", "type": "multi", "q": "居庸关云台券洞内壁刻有六种文字的佛经与造塔功德记，下列属于这六种文字的有（　）。", "options": ["A. 汉文", "B. 藏文", "C. 西夏文", "D. 八思巴文", "E. 满文"], "answer": "ABCD", "explain": "六种文字为汉、藏、西夏、梵、维吾尔（畏兀儿）、八思巴文，其中西夏文、八思巴文尤为珍贵；满文不在其列。", "source": "券洞内壁刻有六种文字的佛经与造塔功德记——汉、藏、西夏、梵、维吾尔（畏兀儿）、八思巴文。"}, {"section": "长城", "type": "single", "q": "明代于成化二年（1466年）确立了（　），规范报警。", "options": ["A. 卫所制度", "B. 烽燧制度", "C. 屯田制度", "D. 巡检制度"], "answer": "B", "explain": "成化二年（1466年）确立烽燧制度，规范报警。", "source": "成化二年（1466年）确立烽燧制度，规范报警。"}, {"section": "长城", "type": "judge", "q": "明长城总长8851.8千米，该数据由国家文物局于2012年公布。", "answer": "错", "explain": "8851.8千米是2009年国家文物局公布的明长城总长；2012年公布的是历代长城总长21196.18千米。", "source": "明长城总长：8851.8千米（2009年国家文物局公布）。历代长城总长：21196.18千米（2012年国家文物局公布）。"}, {"section": "长城", "type": "single", "q": "明代任蓟辽总督、督建慕田峪、水关等段长城的人物是（　）。", "options": ["A. 蒙恬", "B. 徐达", "C. 戚继光", "D. 谭纶"], "answer": "D", "explain": "谭纶任蓟辽总督，督建慕田峪、水关等段长城；戚继光为蓟镇总兵，创修空心敌台。", "source": "谭纶任蓟辽总督，督建慕田峪、水关等段长城。"}, {"section": "长城", "type": "judge", "q": "戚继光任蓟镇总兵，于隆庆二年（1568年）起主持蓟镇军务，创修空心敌台，使长城防御体系臻于完备。", "answer": "对", "explain": "与原文一致：戚继光隆庆二年（1568年）起主持蓟镇军务，创修空心敌台。", "source": "戚继光（蓟镇总兵）于隆庆二年（1568年）起主持蓟镇军务，创修空心敌台，使长城防御体系臻于完备。"}, {"section": "长城", "type": "multi", "q": "明代沿关沟自北向南设有五重防线，下列属于这五重防线的有（　）。", "options": ["A. 岔道城", "B. 八达岭", "C. 上关城", "D. 居庸关", "E. 古北口"], "answer": "ABCD", "explain": "五重防线自北向南为：岔道城→八达岭→上关城→居庸关→南口城；古北口不在关沟防线之内。", "source": "明代沿关沟自北向南设五重防线：岔道城（前哨/藩篱）→八达岭（拳锋/居庸外镇）→上关城（双肋）→居庸关（咽喉/指挥中心）→南口城（唇齿/后援）。"}, {"section": "长城", "type": "single", "q": "据2012年国家文物局《关于北京市长城认定的批复》，北京市长城现存墙体461段，全长（　）。", "options": ["A. 474.06千米", "B. 520.77千米", "C. 46.71千米", "D. 600千米"], "answer": "B", "explain": "北京段全长520.77千米，其中明长城约474.06千米、北齐长城约46.71千米；“约600千米”为早前资料的旧口径。", "source": "现存墙体461段、全长520.77千米（其中明长城约474.06千米，北齐长城约46.71千米）。"}, {"section": "长城", "type": "judge", "q": "黄花城水长城位于密云区，因修建水库水位上升，三段长城被水自然断开、没入湖中，形成“长城戏水”奇观。", "answer": "错", "explain": "黄花城水长城位于怀柔区九渡河镇西水峪，不是密云区；其余描述与原文一致。", "source": "黄花城水长城（怀柔区九渡河镇西水峪）：建于明永乐年间，因修建水库（灏明湖）水位上升，三段长城被水自然断开、没入湖中。"}, {"section": "长城", "type": "single", "q": "位于怀柔区渤海镇小火焰山（海拔约1020米）的“北京结”是（　）。", "options": ["A. 内长城与外长城的交汇点", "B. 北京长城最东端起点", "C. 明代长城的最高敌楼", "D. 关沟五重防线的最北前哨"], "answer": "A", "explain": "“北京结”位于怀柔区渤海镇小火焰山，是内长城与外长城的交汇点。", "source": "“北京结”：位于怀柔区渤海镇小火焰山（海拔约1020米），是内长城与外长城的交汇点。"}, {"section": "长城", "type": "judge", "q": "汉长城西起新疆罗布泊，东至辽东。", "answer": "对", "explain": "与原文一致：汉长城西起新疆罗布泊，东至辽东。注意与秦长城（西起临洮）区分。", "source": "汉长城：西起新疆罗布泊，东至辽东。"}, {"section": "长城", "type": "multi", "q": "下列关于司马台长城的说法，正确的有（　）。", "options": ["A. 是我国唯一完整保留明代原貌的长城", "B. 以“险、密、奇、巧、全”著称", "C. 仙女楼是司马台最精美的敌楼", "D. 望京楼为制高点，海拔986米", "E. 核心段全长19千米"], "answer": "ABCD", "explain": "核心段全长约5.4千米，“绵延19千米”之说通常指含连接金山岭的整体段落，故E错误；其余四项均与原文一致。", "source": "司马台长城（密云区古北口镇）：我国唯一完整保留明代原貌的长城，以“险、密、奇、巧、全”著称……望京楼为制高点，海拔986米。"}, {"section": "长城", "type": "single", "q": "司马台长城是我国唯一完整保留明代原貌的长城，其东起望京楼、西至后川口的核心段全长约5.4千米，共有敌楼（　）。", "options": ["A. 25座", "B. 35座", "C. 45座", "D. 55座"], "answer": "B", "explain": "司马台长城核心段全长约5.4千米，敌楼35座，以“险、密、奇、巧、全”著称。", "source": "东起望京楼、西至后川口，核心段全长约5.4千米，敌楼35座。"}, {"section": "长城", "type": "judge", "q": "烽火台（烟墩）是独立于城墙之外的报警设施，昼举火、夜燃烟。", "answer": "错", "explain": "烽火台的报警方式为昼燃烟、夜举火，题干将昼夜颠倒。", "source": "烽火台（烟墩）：独立于城墙之外的报警设施，昼燃烟、夜举火。"}, {"section": "长城", "type": "single", "q": "慕田峪正关台建于明永乐二年（1404年），其形制特点是（　）。", "options": ["A. 空心三眼楼，可登临远望北京城", "B. 三座敌楼并矗一台，在长城中极为罕见", "C. 双面垛口墙，可两面御敌", "D. 纯砖石拱券砌成的无梁敌台"], "answer": "B", "explain": "慕田峪正关台为三座敌楼并矗一台的实体台（主楼居中、两侧略小、上下两层），在长城中极为罕见。", "source": "慕田峪正关台（怀柔区）：建于明永乐二年（1404年），为三座敌楼并矗一台的实体台……在长城中极为罕见。"}, {"section": "长城", "type": "judge", "q": "居庸关现存关城为明代所建，设南北二门，与倒马关、紫荆关并称“内三关”。", "answer": "对", "explain": "与原文一致：明洪武三年徐达重修居庸关关城，现存关城设南北二门，与倒马关、紫荆关并称“内三关”。", "source": "现存关城为明代所建，设南北二门，与倒马关、紫荆关并称“内三关”。"}, {"section": "长城", "type": "multi", "q": "下列关于历代长城起止的说法，正确的有（　）。", "options": ["A. 秦长城西起临洮，东至辽东", "B. 汉长城西起新疆罗布泊，东至辽东", "C. 明长城西起嘉峪关，东至辽宁虎山", "D. 明长城西起山海关，东至嘉峪关", "E. 汉长城西起临洮，东至罗布泊"], "answer": "ABC", "explain": "明长城西起嘉峪关、东至辽宁虎山（丹东），D方向颠倒且起止错误；汉长城西起罗布泊而非临洮，E错误。", "source": "秦长城：西起临洮……汉长城：西起新疆罗布泊，东至辽东；明长城：西起嘉峪关（甘肃），东至辽宁虎山（丹东）。"}, {"section": "长城", "type": "single", "q": "居庸关云台建于元代，始于至正二年（1342年），成于（　）。", "options": ["A. 至正五年（1345年）", "B. 至正八年（1348年）", "C. 洪武三年（1370年）", "D. 永乐二年（1404年）"], "answer": "A", "explain": "云台始于至正二年（1342年），成于至正五年（1345年），原为过街塔基座。", "source": "修建时间：建于元代，始于至正二年（1342年），成于至正五年（1345年）。"}, {"section": "长城", "type": "judge", "q": "居庸关云台上原建五座白色喇嘛塔（过街塔），元末明初俱毁。", "answer": "错", "explain": "云台上原建三座（非五座）白色喇嘛塔，元末明初三塔俱毁，后于台上改建佛殿。", "source": "原喇嘛塔数量：台上原建三座白色喇嘛塔（过街塔）；元末明初三塔俱毁。"}, {"section": "长城", "type": "single", "q": "八达岭关城的建城时间为（　）。", "options": ["A. 明洪武三年（1370年）", "B. 明弘治十八年（1505年）", "C. 明嘉靖十八年（1539年）", "D. 明万历十年（1582年）"], "answer": "B", "explain": "八达岭关城建于明弘治十八年（1505年）；嘉靖十八年（1539年）刻东门额“居庸外镇”，万历十年（1582年）刻西门额“北门锁钥”。", "source": "关城建城：明弘治十八年（1505年）……东门额“居庸外镇”：刻于嘉靖十八年（1539年）……西门额“北门锁钥”：刻于万历十年（1582年）。"}, {"section": "长城", "type": "judge", "q": "慕田峪段长城两面皆设垛口墙（“双面垛口”），可两面御敌。", "answer": "对", "explain": "与原文一致：慕田峪段为“双面垛口”；北京结—河防口一带怀柔长城亦为“双边垛口”，向东则为单边垛口。", "source": "慕田峪段长城两面皆设垛口墙（“双面垛口”），可两面御敌。"}, {"section": "长城", "type": "multi", "q": "下列关于明代修筑长城的说法，正确的有（　）。", "options": ["A. 朱升献策“高筑墙，广积粮，缓称王”", "B. 成化二年（1466年）确立烽燧制度", "C. 戚继光创修空心敌台", "D. 谭纶任蓟辽总督，督建慕田峪、水关等段长城", "E. 明代大规模修筑长城约8次"], "answer": "ABCD", "explain": "明代大规模修筑长城约18次（一说20余次），E错误；其余四项均与原文一致。", "source": "明代大规模修筑长城约18次……朱升献策……成化二年（1466年）确立烽燧制度……戚继光……创修空心敌台；谭纶任蓟辽总督，督建慕田峪、水关等段长城。"}, {"section": "长城", "type": "single", "q": "据国家文物局长城资源调查，历代长城分布于（　）个省、自治区、直辖市。", "options": ["A. 11个", "B. 13个", "C. 15个", "D. 17个"], "answer": "C", "explain": "历代长城分布于15个省、自治区、直辖市，涉及404个县（市、区），各类遗存总数43721处。", "source": "历代长城分布于15个省、自治区、直辖市：北京、天津、河北、山西、内蒙古……新疆。"}, {"section": "长城", "type": "judge", "q": "八达岭古长城（残长城）自然风景区即石峡关长城所在地，位于八达岭长城景区东南约5公里处。", "answer": "错", "explain": "八达岭古长城位于八达岭长城景区西南（非东南）约5公里处，属延庆区八达岭镇石峡村。", "source": "位于八达岭长城景区西南约5公里（约10华里）处，属延庆区八达岭镇石峡村。"}, {"section": "长城", "type": "single", "q": "中国最早的长城是（　）。", "options": ["A. 秦长城", "B. 楚方城", "C. 齐长城", "D. 魏长城"], "answer": "B", "explain": "楚国所筑楚方城约建于公元前7世纪（春秋时期），为中国最早的长城。", "source": "最早：楚国所筑楚方城，约建于公元前7世纪（春秋时期），为中国最早的长城。"}, {"section": "长城", "type": "multi", "q": "下列关于居庸关云台的说法，正确的有（　）。", "options": ["A. 原为过街塔基座", "B. 成于元至正五年（1345年）", "C. 券洞内壁刻有六种文字的佛经与造塔功德记", "D. 台上原建三座白色喇嘛塔", "E. 台上的泰安寺建于元代"], "answer": "ABCD", "explain": "泰安寺建于明正统年间（清康熙四十一年毁于火），并非元代，E错误；其余均与原文一致。", "source": "云台位于居庸关关城之中，原为过街塔基座……成于至正五年（1345年）……台上原建三座白色喇嘛塔……明正统年间建泰安寺。"}, {"section": "长城", "type": "single", "q": "秦长城的起止为（　）。", "options": ["A. 西起临洮，东至辽东", "B. 西起嘉峪关，东至虎山", "C. 西起罗布泊，东至辽东", "D. 西起临洮，东至山海关"], "answer": "A", "explain": "秦长城西起临洮（今甘肃岷县一带），东至辽东；西起嘉峪关、东至虎山的是明长城。", "source": "秦长城：西起临洮（今甘肃岷县一带），东至辽东。"}, {"section": "长城", "type": "single", "q": "依据“因地形，用险制塞”原则主持修筑秦长城的大将是（　）。", "options": ["A. 王翦", "B. 蒙恬", "C. 李信", "D. 章邯"], "answer": "B", "explain": "秦长城主持者为大将蒙恬，率三十万军民北逐匈奴后所筑。", "source": "主持者为大将蒙恬，率三十万军民北逐匈奴后所筑。"}, {"section": "长城", "type": "multi", "q": "下列关于八达岭的说法，正确的有（　）。", "options": ["A. 位于延庆区军都山关沟古道北口，是居庸关的前哨", "B. 距北京城约60公里", "C. 其名取“路从此分，四通八达”之意", "D. 最高敌楼为北八楼，迎敌面有6个箭窗", "E. 八达岭防御体系的“西大门”指慕田峪长城"], "answer": "ABCD", "explain": "防御体系的“西大门”指石峡关长城（八达岭残长城），不是慕田峪，E错误；其余均与原文一致。", "source": "八达岭长城位于北京市延庆区军都山关沟古道北口，是居庸关的前哨……距北京城约60公里……防御体系的“西大门”：指石峡关长城。"}, {"section": "长城", "type": "single", "q": "2012年国家文物局公布的历代长城（含所有时代）总长为（　）。", "options": ["A. 8851.8千米", "B. 21196.18千米", "C. 520.77千米", "D. 43721千米"], "answer": "B", "explain": "历代长城总长21196.18千米（2012年公布）；8851.8千米是2009年公布的明长城总长。", "source": "历代长城总长：21196.18千米（2012年国家文物局公布，含所有时代）。"}, {"section": "长城", "type": "single", "q": "据2012年国家文物局认定，北京市长城全长520.77千米，其中明长城约为（　）。", "options": ["A. 46.71千米", "B. 474.06千米", "C. 550千米", "D. 600千米"], "answer": "B", "explain": "北京段明长城约474.06千米，北齐长城约46.71千米；“约550千米”为早前资料的旧口径。", "source": "全长520.77千米（其中明长城约474.06千米，北齐长城约46.71千米）。"}, {"section": "长城", "type": "single", "q": "长城敌楼（敌台）分实心墙台与空心敌台两种，其中空心敌台的功能是（　）。", "options": ["A. 仅用于巡逻据守", "B. 可驻兵、储械、瞭望", "C. 专供点燃烽火报警", "D. 作为关城指挥据点"], "answer": "B", "explain": "实心墙台仅用于巡逻据守；空心敌台可驻兵、储械、瞭望。", "source": "敌楼（敌台）：分实心墙台（仅用于巡逻据守）与空心敌台（可驻兵、储械、瞭望）。"}, {"section": "长城", "type": "single", "q": "明代沿关沟自北向南设五重防线，其中最北的前哨（藩篱）是（　）。", "options": ["A. 八达岭", "B. 岔道城", "C. 上关城", "D. 南口城"], "answer": "B", "explain": "五重防线自北向南为：岔道城（前哨/藩篱）→八达岭→上关城→居庸关→南口城（唇齿/后援）。", "source": "明代沿关沟自北向南设五重防线：岔道城（前哨/藩篱）→八达岭（拳锋/居庸外镇）→上关城（双肋）→居庸关（咽喉/指挥中心）→南口城（唇齿/后援）。"}, {"section": "长城", "type": "single", "q": "居庸关始有关城之筑是在（　）。", "options": ["A. 北魏太平真君七年（446年）", "B. 北齐天保六年（555年）", "C. 明洪武三年（1370年）", "D. 明弘治十八年（1505年）"], "answer": "A", "explain": "北魏太平真君七年（446年）始有关城之筑；北齐天保六年长城经此，居庸关始成长城线上的重要隘口。", "source": "北魏太平真君七年（446年）始有关城之筑；北齐天保六年（555年）长城经此。"}, {"section": "长城", "type": "single", "q": "八达岭关城西门额“北门锁钥”刻于（　），喻八达岭为京师与居庸关之锁钥。", "options": ["A. 弘治十八年（1505年）", "B. 嘉靖十八年（1539年）", "C. 万历十年（1582年）", "D. 隆庆二年（1568年）"], "answer": "C", "explain": "西门额“北门锁钥”刻于万历十年（1582年）；嘉靖十八年（1539年）刻的是东门额“居庸外镇”。", "source": "西门额“北门锁钥”：刻于万历十年（1582年），喻八达岭为京师与居庸关之锁钥。"}, {"section": "长城", "type": "single", "q": "八达岭海拔最高的敌楼北八楼（俗称“好汉坡”“观日台”），其海拔为（　）。", "options": ["A. 888米", "B. 986米", "C. 1020米", "D. 446米"], "answer": "A", "explain": "北八楼海拔888米，迎敌面有6个箭窗（居各楼之首）；986米为司马台望京楼海拔，1020米为北京结所在小火焰山海拔。", "source": "最高敌楼：北八楼（俗称“好汉坡”“观日台”），为八达岭海拔最高的敌楼，海拔888米。"}, {"section": "明十三陵", "type": "single", "q": "明成祖朱棣葬入长陵的时间是（ ）。", "options": ["A. 永乐七年（1409年）", "B. 永乐十一年（1413年）", "C. 永乐二十二年（1424年）", "D. 宣德二年（1427年）"], "answer": "C", "explain": "永乐二十二年（1424年）七月十八日朱棣北征途中崩于榆木川，同年十二月十九日葬入长陵。", "source": "永乐二十二年（1424年）七月十八日朱棣北征途中崩于榆木川，同年十二月十九日葬入长陵，与徐皇后合葬。"}, {"section": "明十三陵", "type": "judge", "q": "明十三陵位于北京市昌平区天寿山麓，是明朝十三位皇帝陵墓的总称。", "answer": "对", "explain": "原文表述正确。明十三陵位于北京市昌平区天寿山麓，为明朝十三位皇帝陵墓的总称。", "source": "明十三陵位于北京市昌平区天寿山麓，是明朝十三位皇帝陵墓的总称。"}, {"section": "明十三陵", "type": "multi", "q": "下列明代皇帝中，未葬入十三陵的有（ ）。", "options": ["A. 明太祖朱元璋", "B. 建文帝朱允炆", "C. 明代宗朱祁钰", "D. 明英宗朱祁镇"], "answer": "ABC", "explain": "朱元璋葬南京明孝陵；建文帝靖难之变后下落不明无陵墓；代宗朱祁钰以\"王\"礼葬于北京西郊金山（景泰陵）。英宗朱祁镇葬裕陵，在十三陵内。", "source": "明太祖朱元璋：葬于南京明孝陵。建文帝朱允炆：靖难之变后下落不明，无陵墓。明代宗朱祁钰（景泰帝）：以\"王\"礼葬于北京西郊金山，即景泰陵。"}, {"section": "明十三陵", "type": "single", "q": "永乐皇帝朱棣将昌平黄土山改名为（ ）。", "options": ["A. 万寿山", "B. 天寿山", "C. 大峪山", "D. 金山"], "answer": "B", "explain": "朱棣将黄土山改名为\"天寿山\"，寓意皇位国运与天同寿。", "source": "永乐皇帝朱棣将黄土山改名为\"天寿山\"（寓意皇位国运与天同寿）。"}, {"section": "明十三陵", "type": "judge", "q": "明朝在位时间最长的皇帝是明世宗朱厚熜（嘉靖帝），在位48年。", "answer": "错", "explain": "明朝在位时间最长的是明神宗朱翊钧（万历帝），在位48年；嘉靖帝在位45年，为第二长。", "source": "明朝在位时间最长的皇帝是明神宗朱翊钧（万历帝），在位48年。明世宗朱厚熜（嘉靖帝）在位45年，为明朝在位第二长的皇帝。"}, {"section": "明十三陵", "type": "single", "q": "十三陵中建筑规模仅次于长陵、排名第二的陵寝是（ ）。", "options": ["A. 定陵", "B. 昭陵", "C. 永陵", "D. 献陵"], "answer": "C", "explain": "建筑规模第二大的陵寝是永陵（世宗嘉靖帝陵），仅次于长陵。", "source": "建筑规模第二大的陵寝：永陵（世宗嘉靖帝陵），仅次于长陵。"}, {"section": "明十三陵", "type": "judge", "q": "卜选昌平黄土山为皇家吉壤的风水术士主要是明初江西籍术士廖均卿。", "answer": "对", "explain": "永乐六年（1408年）礼部尚书赵羾奉旨带领廖均卿等人踏勘，最终在昌平黄土山找到\"万年吉壤\"。", "source": "卜选昌平黄土山（后称天寿山）为皇家吉壤的风水术士，主要是明初江西籍风水术士廖均卿。明永乐六年（1408年），礼部尚书赵羾奉旨带领廖均卿等人在北京附近踏勘。"}, {"section": "明十三陵", "type": "multi", "q": "明朝沿用宫人殉葬制度的皇帝有（ ）。", "options": ["A. 明太祖朱元璋", "B. 明成祖朱棣", "C. 明英宗朱祁镇", "D. 明宣宗朱瞻基"], "answer": "ABD", "explain": "朱元璋首开明朝人殉恶例，成祖朱棣、仁宗朱高炽、宣宗朱瞻基乃至代宗朱祁钰均沿用；明英宗朱祁镇遗诏废止宫人殉葬。", "source": "明太祖朱元璋首开明朝人殉恶例，其后成祖朱棣、仁宗朱高炽、宣宗朱瞻基，乃至代宗朱祁钰（景泰帝）等均沿用宫人殉葬。废除宫人殉葬制度的皇帝：明英宗朱祁镇。"}, {"section": "明十三陵", "type": "single", "q": "十三陵中建筑规模最小的陵寝是（ ）。", "options": ["A. 思陵", "B. 庆陵", "C. 德陵", "D. 康陵"], "answer": "A", "explain": "思陵（崇祯帝陵）原为其宠妃田氏墓改建，占地仅约6500平方米，约为长陵二百分之一。", "source": "建筑规模最小的陵寝：思陵（思宗崇祯帝陵，原为其宠妃田氏墓改建，占地仅约6500平方米，约为长陵二百分之一）。"}, {"section": "明十三陵", "type": "judge", "q": "明朝废除宫人殉葬制度的皇帝是明代宗朱祁钰。", "answer": "错", "explain": "废除宫人殉葬制度的是明英宗朱祁镇。天顺八年（1464年）正月临终遗诏明令废止。", "source": "废除宫人殉葬制度的皇帝：明英宗朱祁镇。天顺八年（1464年）正月临终遗诏明令废止：\"用人殉葬，吾不忍也，此事宜自我止，后世勿复为。\""}, {"section": "明十三陵", "type": "single", "q": "中华人民共和国成立后，十三陵中第一座有计划进行大规模复原修葺的陵寝是（ ）。", "options": ["A. 长陵", "B. 定陵", "C. 昭陵", "D. 永陵"], "answer": "C", "explain": "昭陵于1980年代按\"修旧如旧\"原则复原，是十三陵中地面建筑最完整、典制最完备的开放陵园之一。", "source": "中华人民共和国成立后，明十三陵中第一座有计划进行大规模复原修葺的陵寝是昭陵。昭陵于1980年代按\"修旧如旧\"原则复原。"}, {"section": "明十三陵", "type": "judge", "q": "明成祖朱棣是明太祖朱元璋的第三子。", "answer": "错", "explain": "朱棣为明太祖朱元璋第四子，洪武三年封燕王。", "source": "明太祖朱元璋第四子（洪武三年封燕王）。"}, {"section": "明十三陵", "type": "multi", "q": "明十三陵中为皇帝本人生前所建\"寿宫\"的陵寝有（ ）。", "options": ["A. 长陵", "B. 永陵", "C. 定陵", "D. 昭陵"], "answer": "ABC", "explain": "主要有三座为皇帝本人生前所建\"寿宫\"：长陵（成祖朱棣）、永陵（世宗朱厚熜）、定陵（神宗朱翊钧）。", "source": "墓主生前修建的陵寝：明十三陵中主要有三座为皇帝本人生前所建\"寿宫\"——长陵（成祖朱棣）、永陵（世宗朱厚熜）、定陵（神宗朱翊钧）。"}, {"section": "明十三陵", "type": "single", "q": "十三陵中拥有外罗城建筑结构的陵寝是（ ）。", "options": ["A. 长陵", "B. 永陵", "C. 定陵", "D. 景陵"], "answer": "B", "explain": "永陵在方院和宝城之外有一道前七陵都没有的\"外罗城\"，为嘉靖帝拟将皇妃从葬于陵园内而设计。", "source": "拥有外罗城建筑结构的陵寝：永陵（方院和宝城之外有一道前七陵都没有的\"外罗城\"，为嘉靖帝按世宗旨意拟将皇妃从葬于陵园内而设计）。"}, {"section": "明十三陵", "type": "judge", "q": "1956年5月，经国务院批准对定陵地下宫殿进行试掘，这是新中国成立后经批准第一座有计划发掘的帝王陵。", "answer": "对", "explain": "1956年5月试掘，1958年7月试掘成功，是新中国成立后经批准第一座有计划发掘的帝王陵。", "source": "1956年5月，经国务院批准对定陵地下宫殿进行试掘，1958年7月试掘成功，是新中国成立后经批准第一座有计划发掘的帝王陵。"}, {"section": "明十三陵", "type": "single", "q": "十三陵中俗称\"哑巴院\"的建筑，其正式名称是（ ）。", "options": ["A. 月牙城", "B. 外罗城", "C. 宝城", "D. 方城"], "answer": "A", "explain": "\"哑巴院\"正式名称为\"月牙城\"，指方城之后、宝顶之前那道月牙形挡土墙围合出的封闭院落。", "source": "\"哑巴院\"的正式名称及采用形制者：正式名称为\"月牙城\"（指方城之后、宝顶之前那道月牙形挡土墙围合出的封闭院落）。"}, {"section": "明十三陵", "type": "judge", "q": "十三陵神路排列石像生18对共36尊，其中石兽6种各二卧二立，石人3类各4尊。", "answer": "对", "explain": "石兽6种（狮、獬豸、骆驼、象、麒麟、马）各二卧二立共24尊；石人3类（武臣、文臣、勋臣）各4尊共12尊。", "source": "排列石像生18对（共36尊）。石兽6种，各二卧二立（共24尊）：狮、獬豸、骆驼、象、麒麟、马；石人3类，各4尊（共12尊）：武臣（将军）、文臣、勋臣。"}, {"section": "明十三陵", "type": "multi", "q": "下列建筑设施中，属于十三陵神路（由南而北）上的有（ ）。", "options": ["A. 石牌坊", "B. 大红门", "C. 神功圣德碑亭", "D. 龙凤门", "E. 祾恩殿"], "answer": "ABCD", "explain": "神路上的建筑设施由南而北为石牌坊、三孔石桥、大红门、下马碑、神功圣德碑亭、石望柱、石像生、龙凤门、五孔桥、七孔桥等。祾恩殿为陵宫建筑，不在神路上。", "source": "神路上的建筑设施（由南而北）：石牌坊、三孔（三空）石桥、大红门（大宫门）、下马碑、神功圣德碑亭（及四隅汉白玉华表）、石望柱、石像生、龙凤门（棂星门）、五孔桥、七孔桥等。"}, {"section": "明十三陵", "type": "single", "q": "十三陵区内唯一的太监墓，墓主人是（ ）。", "options": ["A. 王承恩", "B. 田义", "C. 魏忠贤", "D. 王安"], "answer": "A", "explain": "十三陵区内唯一的太监墓，墓主为王承恩。", "source": "唯一的太监墓：墓主为王承恩。"}, {"section": "明十三陵", "type": "judge", "q": "定陵地宫共7座石门，全部以汉白玉制成。", "answer": "错", "explain": "前、中、后三室主石门为汉白玉制成，左右配殿及甬道四座为青石小门。", "source": "地宫共7座石门（前、中、后三殿及左右配殿甬道）。其中前、中、后三室主石门为汉白玉制成；左右配殿及甬道四座为青石小门。"}, {"section": "明十三陵", "type": "single", "q": "嘉靖皇帝在十三陵区域内修建但未启用的\"显陵\"，后来用以安葬隆庆帝，即（ ）。", "options": ["A. 庆陵", "B. 昭陵", "C. 德陵", "D. 裕陵"], "answer": "B", "explain": "嘉靖所建未启用的\"显陵\"被用以安葬穆宗朱载坖（隆庆帝），即昭陵。", "source": "嘉靖所建未启用的\"显陵\"：被用以安葬穆宗朱载坖（隆庆帝），即昭陵。"}, {"section": "明十三陵", "type": "judge", "q": "献陵位于天寿山黄山寺一岭（西峰）之下，在长陵的东北侧。", "answer": "错", "explain": "献陵位于天寿山黄山寺一岭（西峰）之下，在长陵的西北侧，而非东北侧。", "source": "献陵的位置：位于天寿山黄山寺一岭（西峰）之下，在长陵的西北侧。"}, {"section": "明十三陵", "type": "multi", "q": "十三陵中宝城直径排名前三的陵寝有（ ）。", "options": ["A. 长陵", "B. 永陵", "C. 定陵", "D. 思陵"], "answer": "ABC", "explain": "第一名长陵（直径101丈8尺，约340米）；第二名永陵（直径81丈，约259米）；第三名定陵（仿永陵而建，规制略小）。", "source": "宝城直径排名前三：第一名长陵（宝城直径101丈8尺，约340米）；第二名永陵（直径81丈，约259米）；第三名定陵（仿永陵而建，规制略小）。"}, {"section": "明十三陵", "type": "single", "q": "葬在\"景泰洼\"的皇帝是（ ）。", "options": ["A. 明代宗朱祁钰", "B. 明光宗朱常洛", "C. 明熹宗朱由校", "D. 明英宗朱祁镇"], "answer": "B", "explain": "景泰洼原为景泰帝被废后捣毁的陵址，后光宗朱常洛仓促下葬于此，是为庆陵。", "source": "葬在\"景泰洼\"的皇帝：明光宗朱常洛（庆陵）。景泰洼原为景泰帝朱祁钰被废后捣毁的陵址，后光宗朱常洛仓促下葬于此，是为庆陵。"}, {"section": "明十三陵", "type": "judge", "q": "十三陵各陵封土均采用\"宝城宝顶\"式，其作用是保护地下玄宫、封固坟冢，并象征\"天圆地方\"的宇宙观与皇权永固。", "answer": "对", "explain": "各陵封土均为宝城宝顶式：地宫之上砌圆形砖城（宝城），城内填土堆成圆顶（宝顶），作用与题干所述一致。", "source": "十三陵各陵封土均采用\"宝城宝顶\"式……作用：保护地下玄宫（墓室）、封固坟冢，并象征\"天圆地方\"的宇宙观与皇权永固。"}, {"section": "明十三陵", "type": "single", "q": "长陵神功圣德碑碑阳（正面）碑文的御撰者是（ ）。", "options": ["A. 明成祖朱棣", "B. 明仁宗朱高炽", "C. 明宣宗朱瞻基", "D. 明世宗朱厚熜"], "answer": "B", "explain": "碑阳为明仁宗朱高炽御撰（约3000余字），由明初书法家程南云书丹，落款\"洪熙元年（1425年）四月十七日\"。", "source": "碑阳（正面）：明仁宗朱高炽御撰（约3000余字），由明初书法家程南云书丹……落款\"洪熙元年（1425年）四月十七日\"。"}, {"section": "明十三陵", "type": "judge", "q": "长陵祾恩殿内60根巨柱皆为整根楠木，其中最粗者底径达1.124米。", "answer": "对", "explain": "殿内木构件均用金丝楠木加工而成，60根巨柱皆为整根楠木，最粗底径达1.124米。", "source": "均用名贵金丝楠木加工而成（60根巨柱皆为整根楠木，最粗底径达1.124米）。"}, {"section": "明十三陵", "type": "multi", "q": "下列关于长陵神功圣德碑四面碑文的说法，正确的有（ ）。", "options": ["A. 碑阳为明仁宗朱高炽御撰", "B. 碑阴为清乾隆帝御制《哀明陵三十韵》", "C. 碑右为清嘉庆九年嘉庆帝御制文", "D. 碑左为明宣宗朱瞻基御制诗"], "answer": "ABC", "explain": "碑左（东侧）为清乾隆《修明陵成遂因临视用乙巳诗韵》（1787年）等御制诗及修陵记，并非明宣宗御制诗。", "source": "碑阴：清乾隆五十年（1785年）乾隆帝御制《哀明陵三十韵》。碑左（东侧）：清乾隆《修明陵成遂因临视用乙巳诗韵》（1787年）等御制诗及修陵记。碑右（西侧）：清嘉庆九年（1804年）嘉庆帝御制文。"}, {"section": "明十三陵", "type": "single", "q": "长陵祾恩殿是仿照（ ）修建的。", "options": ["A. 南京明孝陵享殿", "B. 明代皇宫金銮殿（奉天殿）", "C. 天坛祈年殿", "D. 太庙前殿"], "answer": "B", "explain": "长陵祾恩殿仿照明代皇宫金銮殿（奉天殿/皇极殿，即北京紫禁城太和殿前身）修建。", "source": "仿照建筑：长陵祾恩殿仿照明代皇宫金銮殿（奉天殿/皇极殿，即北京紫禁城太和殿前身）。"}, {"section": "明十三陵", "type": "judge", "q": "明神宗朱翊钧于万历四十八年（泰昌元年，1620年）十月三日葬入定陵。", "answer": "对", "explain": "定陵墓主为明神宗朱翊钧与孝端显皇后、孝靖皇后，1620年十月三日葬入定陵。", "source": "下葬时间：万历四十八年（泰昌元年，1620年）十月三日葬入定陵。"}, {"section": "明十三陵", "type": "single", "q": "祾恩殿建成后，奉命将仁孝徐皇后神位奉安于长陵祾恩殿内的皇子是（ ）。", "options": ["A. 赵王朱高燧", "B. 汉王朱高煦", "C. 太子朱高炽", "D. 周王朱橚"], "answer": "A", "explain": "永乐十四年（1416年）三月祾恩殿建成后，赵王朱高燧（朱棣第三子）奉命将仁孝徐皇后神位安置于祾恩殿内。", "source": "永乐十四年（1416年）三月祾恩殿建成后，赵王朱高燧（朱棣第三子）奉命将仁孝徐皇后神位安置于祾恩殿内。"}, {"section": "明十三陵", "type": "judge", "q": "十三陵中第一座形制完备的\"哑巴院\"（月牙城）是献陵。", "answer": "错", "explain": "十三陵中第一座形制完备的\"哑巴院\"（月牙城）是昭陵，其宝城内封土填满、前置弧形砖墙拦挡。", "source": "其中昭陵是十三陵中第一座形制完备的\"哑巴院\"（月牙城），其宝城内封土填满、前置弧形砖墙拦挡。"}, {"section": "明十三陵", "type": "multi", "q": "截至目前，明十三陵景区中常年开放的核心\"三陵一路\"包括（ ）。", "options": ["A. 长陵", "B. 定陵", "C. 昭陵", "D. 长陵神路（神道）", "E. 裕陵"], "answer": "ABCD", "explain": "长陵、定陵、昭陵和神路为常年开放的核心\"三陵一路\"；康陵、永陵、思陵、景陵为预约开放，裕陵尚未开放。", "source": "其中长陵、定陵、昭陵和神路为常年开放的核心\"三陵一路\"；永陵、思陵于2024年12月首次向公众开放（预约），景陵于2025年12月开放。"}, {"section": "明十三陵", "type": "single", "q": "长陵祾恩殿内摆放的永乐皇帝铜像，是按照文物专家（ ）的建议设置的。", "options": ["A. 吴晗", "B. 郑振铎", "C. 单士元", "D. 夏鼐"], "answer": "C", "explain": "依照著名文物专家单士元（故宫博物院研究员）的建议设置，意在观其姿容、缅其功业。", "source": "依照著名文物专家单士元（故宫博物院研究员）的建议设置的，意在观其姿容、缅其功业。"}, {"section": "明十三陵", "type": "judge", "q": "长陵神功圣德碑亭内立螭首龟趺石碑，碑高7.91米。", "answer": "对", "explain": "碑亭为重檐歇山顶方亭，四面辟券门，内立螭首龟趺石碑，高7.91米。", "source": "长陵神功圣德碑亭为重檐歇山顶方亭，四面辟券门，内立螭首龟趺石碑，高7.91米。"}, {"section": "明十三陵", "type": "single", "q": "定陵工程历时约6年，耗银约（ ）。", "options": ["A. 300万两", "B. 500万两", "C. 800万两", "D. 1000万两"], "answer": "C", "explain": "定陵于万历十二年（1584年）十一月动工，万历十八年（1590年）六月地面建筑完工，历时约6年，耗银约800万两。", "source": "定陵于万历十二年（1584年）十一月动工，万历十八年（1590年）六月地面建筑完工，历时约6年；工程耗银约800万两。"}, {"section": "明十三陵", "type": "judge", "q": "\"祾恩\"二字中，\"祾\"取\"罔极之恩\"之意，\"恩\"取\"祭而受福\"之意。", "answer": "错", "explain": "含义恰相反：\"祾\"取\"祭而受福\"之意，\"恩\"取\"罔极之恩\"之意。", "source": "\"祾\"取\"祭而受福\"之意，\"恩\"取\"罔极之恩\"之意（谓至此祭祀可得先帝护佑）。"}, {"section": "明十三陵", "type": "multi", "q": "下列关于\"前方后圆\"建筑形制的说法，正确的有（ ）。", "options": ["A. 由明太祖朱元璋的明孝陵首创", "B. 前为方形陵宫院落（祾恩门、祾恩殿等）", "C. 后为圆形宝城宝顶", "D. 十三陵诸陵以长陵为首继承并完善了这一制度", "E. 由明成祖朱棣的长陵首创"], "answer": "ABCD", "explain": "\"前方后圆\"由明孝陵首创而非长陵；长陵为首的十三陵诸陵只是继承并完善了这一制度。", "source": "\"前方后圆\"建筑形制：由明太祖朱元璋的明孝陵首创……十三陵诸陵（以长陵为首）继承并完善了这一制度。"}, {"section": "明十三陵", "type": "single", "q": "定陵发掘中，关键的\"指路小石碑\"是在第（ ）条探沟中发现的。", "options": ["A. 一", "B. 二", "C. 三", "D. 四"], "answer": "C", "explain": "发掘中开挖3条探沟，刻\"此石至金刚墙前皮十六丈深三丈五尺\"的指路小石碑在第三条探沟中发现，引导找到地宫入口金刚墙。", "source": "发掘中开挖3条探沟；关键的\"指路小石碑\"（刻\"此石至金刚墙前皮十六丈深三丈五尺\"）是在第三条探沟中发现，引导找到了地宫入口金刚墙。"}, {"section": "明十三陵", "type": "judge", "q": "裕陵是明英宗朱祁镇的陵寝，其年号为正统、天顺。", "answer": "对", "explain": "裕陵葬朱祁镇，年号正统、天顺（英宗，夺门之变复辟后改元天顺）。", "source": "裕陵——朱祁镇，年号正统、天顺（英宗，夺门之变复辟后改元天顺）。"}, {"section": "明十三陵", "type": "single", "q": "明世宗朱厚熜（嘉靖帝）在位（ ），为明朝在位第二长的皇帝。", "options": ["A. 42年", "B. 45年", "C. 48年", "D. 50年"], "answer": "B", "explain": "嘉靖帝在位45年，为明朝在位第二长的皇帝；最长的是万历帝，在位48年。", "source": "明世宗朱厚熜（嘉靖帝）在位45年，为明朝在位第二长的皇帝。"}, {"section": "明十三陵", "type": "multi", "q": "下列关于长陵营建历程的说法，正确的有（ ）。", "options": ["A. 始建于永乐七年（1409年）五月", "B. 永乐十一年（1413年）正月地下玄宫建成", "C. 永乐十四年（1416年）三月祾恩殿建成", "D. 宣德二年（1427年）三月陵园殿宇工程大体告竣", "E. 前后工期近28年"], "answer": "ABCD", "explain": "长陵前后工期近18年，而非28年；其余各节点时间均与原文一致。", "source": "始建于明永乐七年（1409年）五月；永乐十一年（1413年）正月地下玄宫建成；永乐十四年（1416年）三月祾恩殿建成；宣德二年（1427年）三月……大体告竣，前后工期近18年。"}, {"section": "明十三陵", "type": "single", "q": "与明成祖朱棣合葬于长陵的仁孝文皇后徐氏，是（ ）的长女。", "options": ["A. 徐达", "B. 赵羾", "C. 廖均卿", "D. 程南云"], "answer": "A", "explain": "长陵墓主为明成祖朱棣与仁孝文皇后徐氏（徐达长女）。赵羾为礼部尚书，廖均卿为风水术士，程南云为书法家。", "source": "墓主人：明成祖朱棣（永乐帝）与仁孝文皇后徐氏（徐达长女）。"}, {"section": "明十三陵", "type": "single", "q": "明仁宗朱高炽为其皇考永乐皇帝朱棣初上的庙号是（ ）。", "options": ["A. 太祖", "B. 太宗", "C. 成祖", "D. 世宗"], "answer": "B", "explain": "朱高炽初上朱棣庙号为\"太宗\"（谥\"文皇帝\"），嘉靖十七年（1538年）世宗改庙号为\"成祖\"。", "source": "朱高炽初上朱棣庙号为\"太宗\"（谥\"文皇帝\"）。嘉靖十七年（1538年）世宗朱厚熜改庙号为\"成祖\"。"}, {"section": "明十三陵", "type": "multi", "q": "下列关于定陵地宫（地下玄宫）结构的说法，正确的有（ ）。", "options": ["A. 由前、中、后、左、右五座高大殿室组成", "B. 总面积约1195平方米", "C. 全石结构拱券顶、无梁柱", "D. 后室设棺床，停放万历帝及两皇后棺椁", "E. 左右配殿陈列帝后神座与长明灯"], "answer": "ABCD", "explain": "左右配殿为横向长方形，无陈设；帝后汉白玉石神座及黄琉璃五供、青花大瓷缸（长明灯）设于中室。", "source": "中室设帝后汉白玉石神座及黄琉璃五供、青花大瓷缸（长明灯）；后室（最大）设棺床……左右配殿为横向长方形，无陈设。"}, {"section": "明十三陵", "type": "single", "q": "长陵始建于（ ）。", "options": ["A. 永乐五年（1407年）", "B. 永乐七年（1409年）", "C. 永乐十一年（1413年）", "D. 永乐十四年（1416年）"], "answer": "B", "explain": "长陵始建于明永乐七年（1409年）五月；1413年玄宫建成，1416年祾恩殿建成。", "source": "修建时间：始建于明永乐七年（1409年）五月。"}, {"section": "明十三陵", "type": "single", "q": "长陵地下玄宫建成于（ ）。", "options": ["A. 永乐七年（1409年）", "B. 永乐十一年（1413年）", "C. 永乐十四年（1416年）", "D. 宣德二年（1427年）"], "answer": "B", "explain": "明永乐十一年（1413年）正月长陵玄宫落成；1416年祾恩殿建成，1427年陵园殿宇大体告竣。", "source": "地下玄宫建成时间：明永乐十一年（1413年）正月长陵玄宫落成。"}, {"section": "明十三陵", "type": "multi", "q": "长陵祾恩殿所用金丝楠木采自（ ）一带的深山密林。", "options": ["A. 四川", "B. 湖广（湖南、湖北）", "C. 云南", "D. 浙江"], "answer": "ABC", "explain": "楠木采自四川、湖广、云南一带深山密林，采伐转运极为艰难，\"一木至京，费银竟达万两\"。", "source": "楠木采自四川、湖广（湖南、湖北）、云南一带深山密林，采伐转运极为艰难。"}, {"section": "明十三陵", "type": "single", "q": "明世宗朱厚熜将长陵陵殿易名为\"祾恩殿\"是在（ ）。", "options": ["A. 洪熙元年（1425年）", "B. 天顺八年（1464年）", "C. 嘉靖十七年（1538年）", "D. 万历十八年（1590年）"], "answer": "C", "explain": "明世宗朱厚熜于嘉靖十七年（1538年）将陵殿易名\"祾恩\"，同年亦改朱棣庙号为\"成祖\"。", "source": "\"祾恩\"含义：明世宗朱厚熜于嘉靖十七年（1538年）将陵殿易名。"}, {"section": "明十三陵", "type": "single", "q": "明楼前设石五供的制度首创于（ ）。", "options": ["A. 明孝陵", "B. 长陵", "C. 定陵", "D. 显陵"], "answer": "B", "explain": "石五供系长陵首创（孝陵不设），此后各陵沿以为制，仅供象征性祭祀，不真点香烛。", "source": "五供系长陵首创（孝陵不设），此后各陵沿以为制，仅供象征性祭祀，不真点香烛。"}, {"section": "明十三陵", "type": "multi", "q": "安葬于昭陵的皇后有（ ）。", "options": ["A. 孝懿皇后李氏", "B. 孝安皇后陈氏", "C. 孝定皇后李氏", "D. 孝端显皇后王氏"], "answer": "ABC", "explain": "昭陵葬明穆宗朱载坖及孝懿皇后李氏、孝安皇后陈氏、孝定皇后李氏（神宗生母）；孝端显皇后王氏葬定陵。", "source": "昭陵的墓主人是明穆宗朱载坖（隆庆帝）及其三位皇后——孝懿皇后李氏、孝安皇后陈氏、孝定皇后李氏（神宗生母）。"}, {"section": "明十三陵", "type": "single", "q": "陵前设立石像生（石翁仲）的传统始于（ ）。", "options": ["A. 秦汉", "B. 唐宋", "C. 元代", "D. 明清"], "answer": "A", "explain": "石像生传统始于秦汉，兴于唐宋，盛于明清；明清（尤其明孝陵）集其大成并制度化。", "source": "石像生（又称石翁仲……）的传统始于秦汉，兴于唐宋，盛于明清。"}, {"section": "明十三陵", "type": "single", "q": "现存最早的石像生实物是（ ）。", "options": ["A. 秦始皇铸翁仲铜像", "B. 西汉霍去病墓石雕", "C. 东汉墓前石兽", "D. 明孝陵神道石像生"], "answer": "B", "explain": "现存最早的石像生实物为西汉霍去病墓石雕（马踏匈奴等）；秦始皇翁仲铜像仅为传说。", "source": "现存最早的石像生实物为西汉霍去病墓石雕（马踏匈奴等）。"}, {"section": "明十三陵", "type": "single", "q": "十三陵神路（长陵神道）南起（ ），北抵长陵。", "options": ["A. 石牌坊", "B. 大红门", "C. 神功圣德碑亭", "D. 龙凤门"], "answer": "A", "explain": "神路南起石牌坊，北抵长陵；大红门、碑亭、龙凤门均为神路上的建筑设施。", "source": "起止点与长度：神路（长陵神道，又称总神道）南起石牌坊，北抵长陵。"}, {"section": "明十三陵", "type": "single", "q": "定陵位于天寿山陵域（ ）。", "options": ["A. 天寿山主峰南麓", "B. 大峪山东麓", "C. 黄山寺一岭之下", "D. 金山西郊"], "answer": "B", "explain": "定陵位于天寿山陵域大峪山东麓；天寿山主峰南麓是长陵，黄山寺一岭之下是献陵。", "source": "位置与朝向：定陵位于天寿山陵域大峪山东麓。"}, {"section": "明十三陵", "type": "single", "q": "定陵整体建筑的朝向为（ ）。", "options": ["A. 坐北朝南", "B. 坐西北朝东南", "C. 坐东朝西", "D. 坐南朝北"], "answer": "B", "explain": "定陵依大峪山山势，整体朝向坐西北朝东南，与十三陵多数帝陵坐北朝南略有偏转。", "source": "整体建筑朝向为坐西北朝东南（依大峪山山势，与十三陵多数帝陵坐北朝南略有偏转）。"}, {"section": "明十三陵", "type": "single", "q": "定陵地宫（地下玄宫）距地面深约（ ）。", "options": ["A. 17米", "B. 22米", "C. 27米", "D. 37米"], "answer": "C", "explain": "定陵地宫距地面深约27米，由前、中、后、左、右五座高大殿室组成。", "source": "地宫（地下玄宫）距地面深约27米，由前、中、后、左、右五座高大殿室组成。"}, {"section": "明十三陵", "type": "single", "q": "定陵地宫出土的十二龙九凤冠，现收藏于（ ）。", "options": ["A. 故宫博物院", "B. 中国国家博物馆", "C. 明十三陵（定陵）博物馆", "D. 首都博物馆"], "answer": "C", "explain": "定陵出土的十二龙九凤冠收藏于明十三陵（定陵）博物馆。", "source": "十二龙九凤冠收藏地点：明十三陵（定陵）博物馆。"}, {"section": "明十三陵", "type": "single", "q": "昭陵的墓主人是（ ）。", "options": ["A. 明穆宗朱载坖", "B. 明神宗朱翊钧", "C. 明光宗朱常洛", "D. 明熹宗朱由校"], "answer": "A", "explain": "昭陵墓主为明穆宗朱载坖（隆庆帝）及其三位皇后；朱翊钧葬定陵，朱常洛葬庆陵，朱由校葬德陵。", "source": "昭陵的墓主人是明穆宗朱载坖（隆庆帝）及其三位皇后。"}, {"section": "明十三陵", "type": "single", "q": "定陵发掘中，\"指路小石碑\"引导考古人员找到了地宫入口的（ ）。", "options": ["A. 金刚墙", "B. 宝城", "C. 月牙城", "D. 明楼"], "answer": "A", "explain": "小石碑刻\"此石至金刚墙前皮十六丈深三丈五尺\"，在第三条探沟中发现，引导找到地宫入口金刚墙。", "source": "关键的\"指路小石碑\"……引导找到了地宫入口金刚墙。"}, {"section": "周口店北京人遗址", "type": "single", "q": "周口店镇位于北京市（ ），处于太行山余脉大房山东南麓。", "options": ["A. 昌平区", "B. 房山区", "C. 海淀区", "D. 延庆区"], "answer": "B", "explain": "周口店镇位于北京市房山区，处于太行山余脉大房山东南麓，距市区约46—50公里。", "source": "位置：周口店镇于北京市房山区，处于太行山余脉大房山东南麓，距市区约46—50公里。"}, {"section": "周口店北京人遗址", "type": "judge", "q": "周口店\"北京人\"遗址于1987年作为文化遗产列入《世界遗产名录》。", "answer": "对", "explain": "1987年列入《世界遗产名录》（遴选标准(iii)(vi)），世界遗产委员会评价其阐明了人类进化的进程。", "source": "周口店\"北京人\"遗址于1987年作为文化遗产列入《世界遗产名录》（遴选标准(iii)(vi)）。"}, {"section": "周口店北京人遗址", "type": "multi", "q": "周口店遗址涵盖的古人类演化阶段包括（ ）。", "options": ["A. 直立人（\"北京人\"）", "B. 早期智人（新洞人）", "C. 晚期智人（山顶洞人）", "D. 早期现代人（田园洞人）"], "answer": "ABCD", "explain": "周口店遗址涵盖直立人、早期智人、晚期智人三个阶段，另含田园洞早期现代人，被称为\"远古人类的演化序列\"。", "source": "周口店遗址涵盖直立人（\"北京人\"）、早期智人（新洞人）和晚期智人（山顶洞人）三个阶段（另含田园洞早期现代人），被称为\"远古人类的演化序列\"。"}, {"section": "周口店北京人遗址", "type": "single", "q": "周口店镇地势的最高点是（ ），海拔1307米。", "options": ["A. 龙骨山", "B. 鸡骨山", "C. 猫耳山", "D. 大房山主峰"], "answer": "C", "explain": "周口店镇海拔最高点为猫耳山，海拔1307米；东部平原最低点海拔44.6米。", "source": "海拔最高点：猫耳山，海拔1307米（东部平原最低点海拔44.6米）。"}, {"section": "周口店北京人遗址", "type": "judge", "q": "周口店镇地势东南高、西北低，西部为山麓平原，东部为石灰岩丘陵。", "answer": "错", "explain": "周口店镇地势西北高、东南低；西部为石灰岩丘陵、岗地，东部为山麓平原。", "source": "地势：地势西北高、东南低；西部为石灰岩丘陵、岗地，东部为山麓平原。"}, {"section": "周口店北京人遗址", "type": "single", "q": "周口店\"北京人\"（直立人）生活的年代为距今约（ ）。", "options": ["A. 170万年", "B. 70万年至20万年", "C. 10万年至3万年", "D. 2.7万年至3.4万年"], "answer": "B", "explain": "\"北京人\"（直立人）生活年代距今约70万年至20万年，属旧石器时代早期。", "source": "\"北京人\"（直立人）生活年代：距今约70万年至20万年（旧石器时代早期）。"}, {"section": "周口店北京人遗址", "type": "judge", "q": "1929年12月2日，裴文中发现了第一颗完整的\"北京人\"头盖骨化石。", "answer": "对", "explain": "中国古生物学家、古人类学家裴文中于1929年12月2日发现第一颗完整的\"北京人\"头盖骨化石。", "source": "中国古生物学家、古人类学家裴文中于1929年12月2日发现第一颗完整的\"北京人\"头盖骨化石。"}, {"section": "周口店北京人遗址", "type": "multi", "q": "周口店山顶洞的结构分为（ ）等部分。", "options": ["A. 洞口", "B. 上室", "C. 下室", "D. 下窨"], "answer": "ABCD", "explain": "山顶洞分为洞口、上室、下室、下窨四部分。", "source": "山顶洞的结构：山顶洞分为洞口、上室、下室、下窨四部分。"}, {"section": "周口店北京人遗址", "type": "single", "q": "最早对周口店遗址进行发掘和研究的学者是（ ）。", "options": ["A. 裴文中", "B. 师丹斯基", "C. 葛兰阶", "D. 安特生"], "answer": "D", "explain": "瑞典地质学家、考古学家安特生1918年首次到周口店鸡骨山（第6地点）考察，是最早发掘和研究该遗址的学者。", "source": "最早发掘和研究的学者：瑞典地质学家、考古学家安特生（J. G. Andersson），1918年首次到周口店鸡骨山（第6地点）考察。"}, {"section": "周口店北京人遗址", "type": "judge", "q": "周口店山顶洞人生活的年代距今约18万年。", "answer": "错", "explain": "山顶洞人（晚期智人）生活年代距今约3万年前左右，最新测定介于距今约2.7万—3.4万年之间；早期教材曾称\"约1.8万年\"，已更正。", "source": "山顶洞人（晚期智人）生活年代：距今约3万年前左右（最新测定数据介于距今约2.7万—3.4万年之间；早期中学教材曾称\"距今约1.8万年\"，现已改为约3万年）。"}, {"section": "周口店北京人遗址", "type": "single", "q": "1927年起主持周口店遗址大规模系统发掘和研究工作的机构是（ ）。", "options": ["A. 中国科学院古脊椎动物与古人类研究所", "B. 中国地质调查所", "C. 北京协和医学院", "D. 中央研究院历史语言研究所"], "answer": "B", "explain": "1927年由中国地质调查所（与北京协和医学院合作，获美国洛克菲勒基金会资助）主持，开启大规模系统发掘与研究。", "source": "1927年资助大规模系统发掘：由中国地质调查所（与北京协和医学院合作，获美国洛克菲勒基金会资助）主持，开启周口店遗址大规模系统发掘与研究。"}, {"section": "周口店北京人遗址", "type": "judge", "q": "周口店遗址第14地点（俗称\"鱼岭\"）出土鱼化石约2000尾，形成于中新世。", "answer": "对", "explain": "第14地点出土鱼化石约2000尾，形成于中新世（约距今1400万年前）。", "source": "第14地点（俗称\"鱼岭\"）出土鱼化石约2000尾，形成于中新世（约距今1400万年前）。"}, {"section": "周口店北京人遗址", "type": "multi", "q": "\"北京人\"制造石器采用的打制方法有（ ）。", "options": ["A. 锤击法", "B. 砸击法", "C. 砧击法", "D. 磨制法"], "answer": "ABC", "explain": "打制方法以锤击法为主，砸击法次之，偶见砧击法；原料以脉石英、砂岩、燧石、水晶等为主。磨制法为新石器时代特征。", "source": "打制方法以锤击法为主，砸击法次之，偶见砧击法；原料多取自遗址附近，以脉石英（石英岩）、砂岩、燧石、水晶等为主，多为小型石器。"}, {"section": "周口店北京人遗址", "type": "single", "q": "原存于北京的\"北京人\"与\"山顶洞人\"化石（100余件）在转运过程中遗失的时间是（ ）。", "options": ["A. 1937年卢沟桥事变后", "B. 1941年太平洋战争爆发前后", "C. 1945年抗战胜利后", "D. 1949年前后"], "answer": "B", "explain": "1941年太平洋战争爆发前后，100余件人类化石及动物化石在转运过程中遗失，至今下落不明。", "source": "1941年太平洋战争爆发前后，原存于北京的\"北京人\"与\"山顶洞人\"化石（100余件人类化石及动物化石）在转运过程中遗失，至今下落不明。"}, {"section": "周口店北京人遗址", "type": "judge", "q": "周口店镇地势的最高点是猫耳山，海拔1307米。", "answer": "对", "explain": "周口店镇海拔最高点为猫耳山，海拔1307米；东部平原最低点海拔44.6米。", "source": "海拔最高点：猫耳山，海拔1307米（东部平原最低点海拔44.6米）。"}, {"section": "周口店北京人遗址", "type": "single", "q": "\"地质公园（Geopark）\"概念于20世纪90年代起源于（ ）。", "options": ["A. 美国", "B. 中国", "C. 欧洲（法国等）", "D. 日本"], "answer": "C", "explain": "\"地质公园\"概念于1990年代起源于欧洲（法国等）。", "source": "\"地质公园（Geopark）\"概念于1990年代起源于欧洲（法国等）。"}, {"section": "周口店北京人遗址", "type": "judge", "q": "周口店\"北京人\"（直立人）生活的年代属旧石器时代晚期。", "answer": "错", "explain": "\"北京人\"生活年代距今约70万年至20万年，属旧石器时代早期，而非晚期。", "source": "\"北京人\"（直立人）生活年代：距今约70万年至20万年（旧石器时代早期）。"}, {"section": "周口店北京人遗址", "type": "multi", "q": "周口店遗址第1地点（猿人洞）保护建筑工程荣获的奖项有（ ）。", "options": ["A. 联合国教科文组织亚太地区文化遗产保护奖·创新奖", "B. 2019年亚洲建筑师协会建筑奖保护项目类金奖", "C. 中国钢结构工程奖金奖", "D. 全国博物馆十大陈列展览精品奖"], "answer": "ABC", "explain": "全国博物馆十大陈列展览精品奖是2015年周口店遗址博物馆新馆基本陈列所获，并非猿人洞保护棚的奖项。", "source": "周口店遗址第1地点（猿人洞）保护建筑工程荣获联合国教科文组织亚太地区文化遗产保护奖·创新奖；此前/此后还获2019年亚洲建筑师协会建筑奖保护项目类金奖、中国钢结构工程奖金奖等。"}, {"section": "周口店北京人遗址", "type": "single", "q": "周口店遗址中发现的灰烬层最厚处达（ ），表明\"北京人\"已能长期控制、保存火种。", "options": ["A. 2米", "B. 4米", "C. 6米", "D. 8米"], "answer": "C", "explain": "遗址中发现5个灰烬层、3处灰堆，灰烬层最厚处达6米，并有大量烧骨、烧石。", "source": "遗址中发现5个灰烬层、3处灰堆，灰烬层最厚处达6米，并有大量烧骨、烧石。表明\"北京人\"不仅懂得用火，而且已能长期控制、保存火种。"}, {"section": "周口店北京人遗址", "type": "judge", "q": "\"地质公园（Geopark）\"概念于20世纪90年代起源于美国。", "answer": "错", "explain": "\"地质公园\"概念于1990年代起源于欧洲（法国等），并非美国。", "source": "\"地质公园（Geopark）\"概念于1990年代起源于欧洲（法国等）。"}, {"section": "周口店北京人遗址", "type": "single", "q": "1966年周口店遗址发现的\"北京人\"部分头骨，现保存于（ ）。", "options": ["A. 中国国家博物馆", "B. 周口店北京人遗址博物馆", "C. 中国科学院古脊椎动物与古人类研究所", "D. 北京自然博物馆"], "answer": "C", "explain": "现保存于中国科学院古脊椎动物与古人类研究所（北京）。", "source": "现保存于中国科学院古脊椎动物与古人类研究所（北京）。"}, {"section": "周口店北京人遗址", "type": "judge", "q": "1927年起，周口店遗址的大规模系统发掘和研究工作由中国地质调查所主持。", "answer": "对", "explain": "1927年由中国地质调查所（与北京协和医学院合作，获美国洛克菲勒基金会资助）主持，开启大规模系统发掘。", "source": "1927年资助大规模系统发掘：由中国地质调查所（与北京协和医学院合作，获美国洛克菲勒基金会资助）主持。"}, {"section": "周口店北京人遗址", "type": "multi", "q": "1921年来到周口店龙骨山进行试掘的专家有（ ）。", "options": ["A. 安特生", "B. 师丹斯基", "C. 葛兰阶", "D. 裴文中", "E. 李捷"], "answer": "ABC", "explain": "1921年安特生与奥地利古生物学家师丹斯基、美国古生物学家葛兰阶等来龙骨山试掘；裴文中1929年发现头盖骨，李捷等1927年发现第4地点。", "source": "1921年来龙骨山试掘：安特生与奥地利古生物学家师丹斯基（O. Zdansky）、美国古生物学家葛兰阶（W. Granger）等。"}, {"section": "周口店北京人遗址", "type": "single", "q": "周口店北京人遗址博物馆新馆正式向公众开放的时间是（ ）。", "options": ["A. 2008年8月8日", "B. 2014年5月18日", "C. 2015年5月18日", "D. 2019年10月1日"], "answer": "B", "explain": "2014年5月18日（国际博物馆日）正式向公众开放。", "source": "开馆时间：2014年5月18日（国际博物馆日）正式向公众开放。"}, {"section": "周口店北京人遗址", "type": "judge", "q": "周口店遗址中发现5个灰烬层、3处灰堆，灰烬层最厚处达6米。", "answer": "对", "explain": "遗址中发现5个灰烬层、3处灰堆，灰烬层最厚处达6米，并有大量烧骨、烧石。", "source": "遗址中发现5个灰烬层、3处灰堆，灰烬层最厚处达6米，并有大量烧骨、烧石。"}, {"section": "周口店北京人遗址", "type": "single", "q": "周口店北京人遗址博物馆新馆建筑面积为（ ），约为老馆的8倍。", "options": ["A. 5093平方米", "B. 7093平方米", "C. 8093平方米", "D. 10093平方米"], "answer": "C", "explain": "新馆建筑面积8093平方米（约8000余平方米，为老馆8倍），建筑形式源于周口店遗址的重要文化元素——石器。", "source": "建筑面积：新馆建筑面积8093平方米（约8000余平方米，为老馆8倍）。"}, {"section": "周口店北京人遗址", "type": "multi", "q": "周口店遗址第1地点（猿人洞）的考古发现包括（ ）。", "options": ["A. 代表约40个\"北京人\"个体的人类化石", "B. 近200件人类化石", "C. 10万余件石器", "D. 近200种动物化石", "E. 约2000尾鱼化石"], "answer": "ABCD", "explain": "约2000尾鱼化石出土于第14地点（鱼岭），并非第1地点。", "source": "第1地点（猿人洞）发现代表约40个\"北京人\"个体的近200件人类化石、10万余件石器、数层灰烬和近200种动物化石。"}, {"section": "周口店北京人遗址", "type": "single", "q": "周口店\"北京人\"遗址于（ ）作为文化遗产列入《世界遗产名录》。", "options": ["A. 1985年", "B. 1987年", "C. 1991年", "D. 2000年"], "answer": "B", "explain": "周口店\"北京人\"遗址于1987年作为文化遗产列入《世界遗产名录》（遴选标准(iii)(vi)）。", "source": "周口店\"北京人\"遗址于1987年作为文化遗产列入《世界遗产名录》（遴选标准(iii)(vi)）。"}, {"section": "周口店北京人遗址", "type": "si
