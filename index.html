爆发的时间是（ ）。", "options": ["A. 1919年5月4日", "B. 1919年6月3日", "C. 1921年5月4日", "D. 1918年5月4日"], "answer": "A", "explain": "五四运动爆发于1919年5月4日。", "source": "15. \"五四运动\"爆发的时间：1919 年 5 月 4 日"}, {"section": "天安门及天安门广场", "type": "judge", "q": "现在天安门城楼悬挂的毛主席画像高6米、宽4.6米，加上像框总重量约2.5吨。", "answer": "错", "explain": "画像高6米、宽4.6米正确，但加上像框总重量约为1.5吨，不是2.5吨。", "source": "画像高 6 米、宽 4.6 米，加上像框总重量约 1.5 吨。"}, {"section": "天安门及天安门广场", "type": "multi", "q": "明清时期，皇帝及随从人员从天安门出入的重大礼仪活动有（ ）。", "options": ["A. 祭天（圜丘坛）", "B. 祭地（方泽坛）", "C. 祈谷（祈谷坛）", "D. 耕耤田（先农坛）", "E. 册封贵妃"], "answer": "ABCD", "explain": "凡祭天、祭地、祈谷、耕耤田、御驾亲征等重大礼仪活动皇帝均从天安门出入；册封贵妃不在其列。", "source": "凡祭天（圜丘坛）、祭地（方泽坛）、祈谷（祈谷坛）、耕耤田（先农坛）、御驾亲征等重大礼仪活动，皇帝及随从人员均从天安门出入。"}, {"section": "天安门及天安门广场", "type": "single", "q": "近代历史上天安门广场首次对外开放的时间是（ ）。", "options": ["A. 1912年1月", "B. 1914年5月", "C. 1919年5月", "D. 1924年10月"], "answer": "B", "explain": "天安门广场近代对外开放时间为1914年（民国三年）5月。", "source": "17. 近代历史上天安门广场对外开放的时间：1914 年（民国三年）5 月"}, {"section": "天安门及天安门广场", "type": "judge", "q": "天安门前外金水桥上的7座石桥中，御路桥最长最宽，其桥栏望柱雕云龙纹。", "answer": "对", "explain": "原文明确：御路桥最长最宽，桥栏望柱雕云龙纹；其余6座桥望柱柱头为火炬形。", "source": "御路桥最长最宽，桥栏望柱雕云龙纹；其余6座桥（皇族桥、品级桥、公生桥）望柱柱头均为火炬形（火焰式）"}, {"section": "天安门及天安门广场", "type": "single", "q": "1950年改造天安门广场时，因游行队伍宽度需要，将天安门前华表、石狮各向东西移位（ ）。", "options": ["A. 3米", "B. 6米", "C. 9米", "D. 10米"], "answer": "B", "explain": "1950年将天安门前华表、石狮各向东西移位6米，并拓宽长安街。", "source": "1950 年：因游行队伍宽度需要，将天安门前华表、石狮各向东西移位 6 米；拓宽长安街。"}, {"section": "天安门及天安门广场", "type": "judge", "q": "今日长安街东起通州区，西至石景山区，2019年西延工程贯通后延伸至门头沟区，号称\"百里长街\"。", "answer": "对", "explain": "原文：东起通州区，西至石景山区（首钢东门；2019年西延工程贯通后延伸至门头沟区），即\"百里长街\"。", "source": "东起通州区（北京城市副中心，运河文化广场一带），西至石景山区（首钢东门；2019年西延工程贯通后延伸至门头沟区），即\"百里长街\"。"}, {"section": "天安门及天安门广场", "type": "multi", "q": "天安门城楼建筑中体现数字\"九\"的做法有（ ）。", "options": ["A. 面阔九间、进深五间", "B. 檐角小兽九只", "C. 门窗共36扇，为四\"九\"", "D. 每扇券门门钉共81颗，为\"九九\""], "answer": "ABCD", "explain": "四项均体现数字\"九\"：面阔九间进深五间取\"九五之尊\"；檐角小兽九只；门窗36扇为四\"九\"；门钉81颗为\"九九\"。", "source": "面阔九间、进深五间……檐角小兽九只；门窗共 36 扇，为四\"九\"；……共 81 颗镏金门钉，为\"九九\"。"}, {"section": "天安门及天安门广场", "type": "single", "q": "1958年为迎接国庆十周年扩建后，天安门广场的总面积为（ ）。", "options": ["A. 34万平方米", "B. 40万平方米", "C. 44万平方米", "D. 50万平方米"], "answer": "C", "explain": "1958年扩建后广场扩至南北长880米、东西宽500米，总面积44万平方米。", "source": "广场扩至南北长 880 米、东西宽 500 米、总面积 44 万平方米。"}, {"section": "天安门及天安门广场", "type": "judge", "q": "人民英雄纪念碑是新中国成立后在天安门广场修建的第一座大型建筑，也是中国历史上最大的纪念碑。", "answer": "对", "explain": "原文第38条明确表述，人民英雄纪念碑是新中国第一座大型纪念性建筑物。", "source": "人民英雄纪念碑——新中国成立后在天安门广场修建的第一座大型建筑，也是中国历史上最大的纪念碑。"}, {"section": "天安门及天安门广场", "type": "single", "q": "1958年10月至1959年9月，在天安门广场西侧建成的建筑是（ ）。", "options": ["A. 人民大会堂", "B. 中国革命和历史博物馆", "C. 人民英雄纪念碑", "D. 毛主席纪念堂"], "answer": "A", "explain": "1958年10月—1959年9月：广场西侧建人民大会堂，东侧建中国革命和历史博物馆（今中国国家博物馆）。", "source": "1958 年 10 月—1959 年 9 月：广场西侧建人民大会堂，东侧建中国革命和历史博物馆（今中国国家博物馆）。"}, {"section": "天安门及天安门广场", "type": "judge", "q": "金水桥南北两侧的汉白玉石狮雕刻于明宣德年间。", "answer": "错", "explain": "石狮雕刻于明永乐年间，不是宣德年间；华表才是立于明成化元年（1465）。", "source": "石狮：金水桥南北两侧各一对（共4只），雕刻于明永乐年间。"}, {"section": "天安门及天安门广场", "type": "multi", "q": "天安门前外金水桥上，数量为2座的桥有（ ）。", "options": ["A. 御路桥", "B. 皇族桥", "C. 品级桥", "D. 公生桥"], "answer": "BCD", "explain": "外金水河7座桥中：御路桥正中1座，皇族桥2座、品级桥2座、公生桥2座。", "source": "御路桥（正中 1 座）……皇族桥（2 座）……品级桥（2 座）……公生桥（2 座）"}, {"section": "天安门及天安门广场", "type": "single", "q": "今日天安门广场可容纳举行盛大集会的人数为（ ）。", "options": ["A. 50万人", "B. 80万人", "C. 100万人", "D. 120万人"], "answer": "C", "explain": "天安门广场可容纳100万人举行盛大集会，是世界上最大的城市中心广场。", "source": "可容纳 100 万人举行盛大集会"}, {"section": "天安门及天安门广场", "type": "judge", "q": "狭义长安街（东单—西单）长约3.7—4千米，俗称\"百里长街\"。", "answer": "错", "explain": "狭义长安街俗称\"十里长街\"；\"百里长街\"指全线。", "source": "狭义长安街（东单—西单）长约3.7—4千米，俗称\"十里长街\"；建国门—复兴门约6.7千米。"}, {"section": "天安门及天安门广场", "type": "single", "q": "天安门城楼对公众首次开放的时间是（ ）。", "options": ["A. 1988年1月1日", "B. 1988年10月1日", "C. 1990年1月1日", "D. 1980年1月1日"], "answer": "A", "explain": "天安门城楼于1988年1月1日对公众首次开放。", "source": "21. 天安门城楼对公众首次开放的时间：1988 年 1 月 1 日"}, {"section": "天安门及天安门广场", "type": "judge", "q": "天安门 德怀"], "answer": "ABC", "explain": "二层设有毛泽东、周恩来、刘少奇、朱德、邓小平、陈云同志革命业绩纪念室，不含彭德怀。", "source": "纪念室：二层设有毛泽东、周恩来、刘少奇、朱德、邓小平、陈云同志革命业绩纪念室"}, {"section": "天安门及天安门广场", "type": "single", "q": "天安门前外金水桥上，除御路桥外，其余6座桥的望柱柱头形制是（ ）。", "options": ["A. 云龙纹柱头", "B. 火炬形（火焰式）柱头", "C. 莲花形柱头", "D. 狮子形柱头"], "answer": "B", "explain": "其余6座桥（皇族桥、品级桥、公生桥）望柱柱头均为火炬形（火焰式）；云龙纹是御路桥的望柱纹样。", "source": "其余6座桥（皇族桥、品级桥、公生桥）望柱柱头均为火炬形（火焰式），上面刻阴线24道，称\"二十四气\"式（寓意二十四节气）。"}, {"section": "天安门及天安门广场", "type": "judge", "q": "\"天子五门\"制度始见于《周礼》，五门自外而内依次为皋门、库门、雉门、应门、路门。", "answer": "对", "explain": "原文：\"天子五门\"始见于《周礼》，自外而内为皋门、库门、雉门、应门、路门（路门一曰毕门）。", "source": "始见于《周礼》……天子五门自外而内为：皋门、库门、雉门、应门、路门（路门一曰毕门）。"}, {"section": "天安门及天安门广场", "type": "single", "q": "除御路桥外，其余6座金水桥望柱上刻阴线（ ）道，称\"二十四气\"式。", "options": ["A. 12", "B. 18", "C. 24", "D. 36"], "answer": "C", "explain": "望柱上刻阴线24道，称\"二十四气\"式，寓意二十四节气。", "source": "望柱柱头均为火炬形（火焰式），上面刻阴线24道，称\"二十四气\"式（寓意二十四节气）。"}, {"section": "天安门及天安门广场", "type": "judge", "q": "清顺治八年改名时，紫禁城内三大殿取\"安\"字，皇城四门则统一带\"和\"字。", "answer": "错", "explain": "恰好相反：内宫三大殿改名太和殿、中和殿、保和殿，取\"和\"字；皇城四门统一带\"安\"字，即内\"和\"外\"安\"。", "source": "三大殿由皇极殿、中极殿、建极殿改名为太和殿、中和殿、保和殿（内宫取\"和\"）；皇城四门则统一带\"安\"字。"}, {"section": "天安门及天安门广场", "type": "multi", "q": "下列属于北京20世纪\"50年代十大建筑\"的有（ ）。", "options": ["A. 人民大会堂", "B. 民族文化宫", "C. 北京火车站", "D. 钓鱼台国宾馆", "E. 中国美术馆"], "answer": "ABCD", "explain": "十大建筑为：人民大会堂、中国革命和历史博物馆、中国人民革命军事博物馆、民族文化宫、民族饭店、北京火车站、北京工人体育场、全国农业展览馆、钓鱼台国宾馆、华侨大厦；中国美术馆不在其中。", "source": "人民大会堂、中国革命和历史博物馆、中国人民革命军事博物馆、民族文化宫、民族饭店、北京火车站、北京工人体育场、全国农业展览馆、钓鱼台国宾馆、华侨大厦。"}, {"section": "天安门及天安门广场", "type": "single", "q": "天安门城楼前后各有一对汉白玉华表，共4座，立于（ ）。", "options": ["A. 明永乐年间", "B. 明成化元年（1465年）", "C. 明嘉靖年间", "D. 清顺治年间"], "answer": "B", "explain": "华表立于明成化元年（1465年）；金水桥石狮才是明永乐年间雕刻的。", "source": "华表：天安门城楼前后各一对（共4座），立于明成化元年（1465）；石狮：金水桥南北两侧各一对（共4只），雕刻于明永乐年间。"}, {"section": "天安门及天安门广场", "type": "judge", "q": "千步廊御路东侧有工部木仓，西侧有户部米仓。", "answer": "错", "explain": "御路东侧为户部米仓，西侧为工部木仓，题中东、西颠倒。", "source": "御路东侧有户部米仓，西侧有工部木仓。"}, {"section": "天安门及天安门广场", "type": "single", "q": "截至2019年，长安街全线总里程约为（ ）。", "options": ["A. 3.7千米", "B. 6.7千米", "C. 55千米", "D. 120千米"], "answer": "C", "explain": "截至2019年长安街全线总里程约55千米；3.7—4千米是狭义长安街（东单—西单），6.7千米是建国门—复兴门，120米是最大红线宽度。", "source": "截至2019年长安街全线总里程约55千米（\"百里长街\"常见数据约44—50千米，因统计口径不同略有差异）；最大红线宽度120米"}, {"section": "天安门及天安门广场", "type": "judge", "q": "历史上皇城最南端的城门于清顺治元年（1644年）改称大清门，1977年在其旧址建成毛主席纪念堂。", "answer": "对", "explain": "该门由大明门（明）→大清门（清顺治元年1644）→中华门（1912），1958年3月拆除，1977年在旧址建成毛主席纪念堂。", "source": "大明门（明）→ 大清门（清顺治元年 1644）→ 中华门（1912 年民国）→ 1958 年 3 月拆除，1977 年在其旧址……建成毛主席纪念堂。"}, {"section": "天安门及天安门广场", "type": "multi", "q": "下列关于人民大会堂的说法，正确的有（ ）。", "options": ["A. 设计总工程师为张镈", "B. 建筑面积17.18万平方米，建筑高度46.5米", "C. 平面呈\"山\"字形，四面开门", "D. 从破土动工到竣工交付用时约2年"], "answer": "ABC", "explain": "D错误：1958年10月28日动工，1959年9月10日竣工，仅用约10个月。", "source": "总设计师：张镈。建筑面积：17.18万平方米；建筑高度：46.5米。1958年10月28日破土动工，1959年9月10日竣工交付，仅用约10个月。平面形式：\"山\"字形"}, {"section": "天安门及天安门广场", "type": "single", "q": "天安门城楼两侧观礼台的总容量约为（ ）。", "options": ["A. 7300人", "B. 10000人", "C. 15000人", "D. 21000人"], "answer": "D", "explain": "原文：观礼台总容量约21000人（一说翻建后可容纳1万余人，资料口径不一）；7300平方米是1952年临时观礼台占地面积。", "source": "总容量约21000人（一说翻建后可容纳1万余人；资料口径不一）。"}, {"section": "天安门及天安门广场", "type": "judge", "q": "明清\"三法司\"中，都察院负责审判，刑部负责监察。", "answer": "错", "explain": "刑部主审判、都察院主监察、大理寺主复核，题中刑部与都察院职能对调。", "source": "刑部（审判）、都察院（监察）、大理寺（复核），重大案件由三法司会审（秋审、朝审）。"}, {"section": "天安门及天安门广场", "type": "single", "q": "开国大典上由毛泽东主席升起的第一面五星红旗，如今收藏于（ ）。", "options": ["A. 故宫博物院", "B. 中国人民革命军事博物馆", "C. 中国国家博物馆", "D. 毛主席纪念堂"], "answer": "C", "explain": "该国旗1951年7月1日由北京市人民政府拨交原中国革命博物馆珍藏，今在中国国家博物馆《复兴之路》基本陈列中展出。", "source": "中国国家博物馆（1951年7月1日由北京市人民政府拨交原中国革命博物馆珍藏，今在《复兴之路》基本陈列中展出）。"}, {"section": "天安门及天安门广场", "type": "judge", "q": "1947年天安门广场发生\"反饥饿、反内战、反迫害\"游行；1900年八国联军还曾在此屯兵耀武。", "answer": "对", "explain": "原文在列举广场重大事件时明确包含1947年\"反饥饿、反内战、反迫害\"游行及1900年八国联军屯兵耀武。", "source": "1947 年\"反饥饿、反内战、反迫害\"游行……1900 年八国联军还曾在此屯兵耀武。"}, {"section": "天安门及天安门广场", "type": "multi", "q": "下列关于中国国家博物馆基本陈列的说法，正确的有（ ）。", "options": ["A. 《古代中国》从距今约170万年前的元谋人一直展示到清王朝灭亡", "B. 《古代中国》由远古时期、夏商西周时期等八个部分组成", "C. 《复兴之路》展示1840年鸦片战争以来中华民族实现伟大复兴的艰辛探索历程", "D. 《复兴之路》展品中包括开国大典升起的第一面五星红旗"], "answer": "ABCD", "explain": "四项均与原文相符：《古代中国》八个部分、从元谋人到清亡；《复兴之路》五部分、含第一面五星红旗、林则徐虎门销烟奏折等。", "source": "以王朝更替为主要脉络、以珍贵文物为核心，从距今约170万年前的元谋人一直到清王朝灭亡。组成部分：远古时期……明清时期八个部分。展出1280多件珍贵文物……包括开国大典升起的第一面五星红旗"}, {"section": "天安门及天安门广场", "type": "single", "q": "中华人民共和国国旗图案的设计者是（ ）。", "options": ["A. 梁思成", "B. 张仃", "C. 周令钊", "D. 曾联松"], "answer": "D", "explain": "国旗图案设计者是曾联松；梁思成、林徽因主持国徽设计，周令钊是开国大典毛主席画像作者。", "source": "设计者：曾联松。《中华人民共和国国旗法》于1990年6月28日通过并公布。"}, {"section": "天安门及天安门广场", "type": "judge", "q": "五四运动爆发于1919年6月3日。", "answer": "错", "explain": "五四运动爆发时间为1919年5月4日，而非6月3日。", "source": "15. \"五四运动\"爆发的时间：1919 年 5 月 4 日"}, {"section": "天安门及天安门广场", "type": "single", "q": "天安门新升旗仪式中，礼号手的站立位置是（ ）。", "options": ["A. 金水桥上", "B. 天安门城楼上的吹奏台", "C. 国旗杆基座旁", "D. 人民英雄纪念碑前"], "answer": "B", "explain": "礼号手登上天安门城楼（城楼上的吹奏台）演奏。", "source": "礼号手位置：登上天安门城楼（城楼上的吹奏台）演奏"}, {"section": "天安门及天安门广场", "type": "judge", "q": "近代历史上，天安门广场于民国三年（1914年）5月首次对外开放。", "answer": "对", "explain": "原文：近代历史上天安门广场对外开放的时间为1914年（民国三年）5月。", "source": "17. 近代历史上天安门广场对外开放的时间：1914 年（民国三年）5 月"}, {"section": "天安门及天安门广场", "type": "multi", "q": "清朝\"内和外安\"思想在北京城建筑中的体现有（ ）。", "options": ["A. 重建承天门并改名天安门", "B. 紫禁城内三大殿改名太和殿、中和殿、保和殿", "C. 皇城四门统一带\"安\"字", "D. 内宫取\"和\"、外城取\"安\"，以求清朝统治长治久安", "E. 将紫禁城护城河改名为金水河"], "answer": "ABCD", "explain": "清顺治八年重建承天门并改名天安门，三大殿改名太和、中和、保和（内宫取\"和\"），皇城四门统一带\"安\"字（外城取\"安\"），寓意长治久安；E项于原文无据。", "source": "清顺治八年（1651）重建承天门并改名天安门……内\"和\"外\"安\"，寓意内宫和睦、外城安定，以求清朝统治\"长治久安\"。"}, {"section": "天安门及天安门广场", "type": "single", "q": "天安门新升旗仪式中，国旗实际升至杆顶的时长为（ ）。", "options": ["A. 2分07秒", "B. 46秒", "C. 60秒", "D. 90秒"], "answer": "B", "explain": "全程（含护旗队行进）保持2分07秒；按《国歌法》国歌完整演奏一遍，实际升旗为46秒。", "source": "升旗时长：从护旗队行进至旗杆基座位置，到国旗升至杆顶，全程保持2分07秒；按《国歌法》国歌完整演奏一遍，实际升旗为46秒。"}, {"section": "天安门及天安门广场", "type": "judge", "q": "天安门广场每日于升旗时间前一小时开放，22:00清场，参观实行免费预约。", "answer": "对", "explain": "原文：每日升旗时间前一小时开放，22:00清场；实行预约参观（免费）。", "source": "每日升旗时间前一小时开放，22:00 清场；实行预约参观（免费）。"}, {"section": "天安门及天安门广场", "type": "single", "q": "天安门广场旗杆两侧绿地位于中心广场北半部东西两侧，每侧面积约为（ ）。", "options": ["A. 4800平方米", "B. 9600平方米", "C. 2400平方米", "D. 7300平方米"], "answer": "A", "explain": "两侧各约4800平方米，合计9600平方米；9600是合计数，注意不要混淆。", "source": "位于中心广场北半部东西两侧，两侧各约4800平方米，合计9600平方米，象征我国960万平方公里的领土。"}, {"section": "天安门及天安门广场", "type": "judge", "q": "天安门城楼1988年对外开放的目的之一是筹集城楼修缮资金。", "answer": "错", "explain": "开放目的为：一是顺乎民意、满足群众登楼参观的愿望；二是作为北京国际旅游年的重要旅游项目，与筹集修缮资金无关。", "source": "一是顺乎民意、满足群众登楼参观的愿望；二是作为北京国际旅游年的重要旅游项目。"}, {"section": "天安门及天安门广场", "type": "multi", "q": "明清两代在千步廊办理的具体政务包括（ ）。", "options": ["A. 吏部、兵部\"月选官掣签\"", "B. 礼部会试\"磨勘\"", "C. 刑部\"秋审\"\"朝审\"", "D. 户部征收关税"], "answer": "ABC", "explain": "千步廊办理的具体政务：吏部、兵部\"月选官掣签\"（选官抽签）、礼部会试\"磨勘\"（复核试卷）、刑部\"秋审\"\"朝审\"（复核死刑案件）；原文未提户部征收关税。", "source": "吏部、兵部\"月选官掣签\"（选官抽签）、礼部会试\"磨勘\"（复核试卷）、刑部\"秋审\"\"朝审\"（复核死刑案件）。"}, {"section": "天安门及天安门广场", "type": "single", "q": "决定建立人民英雄纪念碑的会议及时间是（ ）。", "options": ["A. 1949年10月1日开国大典", "B. 1949年9月30日中国人民政治协商会议第一届全体会议", "C. 1952年8月1日动工之时", "D. 1958年5月1日揭幕之时"], "answer": "B", "explain": "1949年9月30日政协第一届全体会议通过决议，当日下午举行奠基典礼；1952年8月1日动工，1958年5月1日揭幕。", "source": "决定建立：1949年9月30日，中国人民政治协商会议第一届全体会议通过决议；当日下午毛泽东率全体政协委员在天安门广场举行奠基典礼。"}, {"section": "天安门及天安门广场", "type": "judge", "q": "开国大典时天安门城楼上悬挂的毛主席画像由张仃绘制。", "answer": "错", "explain": "开国大典时天安门城楼毛主席画像的作者是周令钊，张仃是国徽设计者之一。", "source": "24. 开国大典时天安门城楼上悬挂的毛主席画像的作者：周令钊。"}, {"section": "天安门及天安门广场", "type": "single", "q": "人民英雄纪念碑建筑设计与方案的主持者是（ ）。", "options": ["A. 刘开渠", "B. 杨廷宝", "C. 梁思成", "D. 张镈"], "answer": "C", "explain": "建筑设计与方案由梁思成主持；林徽因负责碑座碑身装饰纹样；刘开渠主持浮雕创作；张镈是人民大会堂总设计师。", "source": "主要设计者：建筑设计与方案由梁思成主持，林徽因负责碑座、碑身全套装饰纹样设计（并实际组织设计工作）；浮雕创作由刘开渠主持。"}, {"section": "天安门及天安门广场", "type": "judge", "q": "天安门城楼面阔九间、进深五间，取《周易》\"九五，飞龙在天\"的\"九五之尊\"之意。", "answer": "对", "explain": "原文：面阔九间、进深五间——取《周易》\"九五，飞龙在天\"的\"九五之尊\"。", "source": "面阔九间、进深五间——取《周易》\"九五，飞龙在天\"的\"九五之尊\""}, {"section": "天安门及天安门广场", "type": "multi", "q": "历史上皇城最南端城门（有\"国门\"之称）曾使用过的名称有（ ）。", "options": ["A. 大明门", "B. 大清门", "C. 中华门", "D. 天安门"], "answer": "ABC", "explain": "该门名称变化：大明门（明）→大清门（清顺治元年1644）→中华门（1912年民国），1958年3月拆除；天安门系承天门所改，非此门。", "source": "大明门（明）→ 大清门（清顺治元年 1644）→ 中华门（1912 年民国）→ 1958 年 3 月拆除。"}, {"section": "天安门及天安门广场", "type": "single", "q": "人民英雄纪念碑碑顶采用的建筑式样是（ ）。", "options": ["A. 重檐歇山顶", "B. 上有卷云、下有垂幔的小庑殿顶", "C. 四角攒尖顶", "D. 平顶"], "answer": "B", "explain": "碑顶采用民族传统建筑形式——上有卷云、下有垂幔的小庑殿顶。", "source": "碑顶建筑式样：采用民族传统建筑形式——上有卷云、下有垂幔的小庑殿顶。"}, {"section": "天安门及天安门广场", "type": "judge", "q": "天安门前外金水桥中，皇族桥、品级桥、公生桥的望柱柱头上刻阴线12道，称\"二十四气\"式。", "answer": "错", "explain": "阴线为24道而非12道，称\"二十四气\"式，寓意二十四节气。", "source": "望柱柱头均为火炬形（火焰式），上面刻阴线24道，称\"二十四气\"式（寓意二十四节气）。"}, {"section": "天安门及天安门广场", "type": "single", "q": "中国国家博物馆改扩建工程竣工、新馆正式开放的时间是（ ）。", "options": ["A. 2003年2月28日", "B. 2011年3月1日", "C. 2012年5月18日", "D. 2009年10月1日"], "answer": "B", "explain": "2011年3月1日改扩建工程竣工暨《复兴之路》基本陈列复展，新馆正式开放；2003年2月28日是正式挂牌时间。", "source": "2011年3月1日，改扩建工程竣工暨《复兴之路》基本陈列复展，新馆正式开放"}, {"section": "天安门及天安门广场", "type": "judge", "q": "天安门城楼前后的4座汉白玉华表立于明永乐年间。", "answer": "错", "explain": "华表立于明成化元年（1465）；明永乐年间雕刻的是金水桥南北两侧的石狮。", "source": "华表：天安门城楼前后各一对（共4座），立于明成化元年（1465）；石狮：……雕刻于明永乐年间。"}, {"section": "天安门及天安门广场", "type": "multi", "q": "历史上在天安门广场发生的重大事件有（ ）。", "options": ["A. 五四运动", "B. 五卅运动", "C. \"一二·九\"学生运动", "D. \"四五运动\"", "E. 秋收起义"], "answer": "ABCD", "explain": "广场重大事件包括1919年五四运动、1925年五卅运动、1926年三一八惨案、1935年一二·九运动、1947年\"反饥饿、反内战、反迫害\"游行、1949年开国大典、1976年四五运动；秋收起义与天安门广场无关。", "source": "1919 年\"五四\"运动；1925 年\"五卅\"运动；……1935 年\"一二·九\"学生运动；……1976 年\"四五运动\"等。"}, {"section": "天安门及天安门广场", "type": "single", "q": "人民英雄纪念碑碑心石的产地是（ ）。", "options": ["A. 河北曲阳", "B. 山东青岛崂山余脉浮山（大金顶）", "C. 北京房山", "D. 山东泰山"], "answer": "B", "explain": "碑心石产自山东省青岛市崂山余脉——浮山（大金顶）的花岗岩；河北曲阳石匠承担的是浮雕的具体雕刻。", "source": "碑心石的产地：山东省青岛市崂山余脉——浮山（大金顶）的花岗岩。"}, {"section": "天安门及天安门广场", "type": "judge", "q": "截至2019年，长安街全线总里程约55千米，最大红线宽度120米。", "answer": "对", "explain": "原文：截至2019年长安街全线总里程约55千米；最大红线宽度120米，路面宽47—80米。", "source": "截至2019年长安街全线总里程约55千米……最大红线宽度120米，路面宽47—80米，最宽处80米。"}, {"section": "天安门及天安门广场", "type": "single", "q": "人民英雄纪念碑南面碑文中\"三十年以来\"所指的历史时期是（ ）。", "options": ["A. 1919年五四运动以来的新民主主义革命", "B. 1946年起的解放战争", "C. 1840年鸦片战争以来的近代史", "D. 1921年中国共产党成立以来的革命历程"], "answer": "A", "explain": "\"三年\"指1946年起的解放战争；\"三十年\"指1919年五四运动以来的新民主主义革命；\"一千八百四十年\"指1840年鸦片战争。", "source": "\"三年\"指1946年起的解放战争；\"三十年\"指1919年五四运动以来的新民主主义革命；\"一千八百四十年\"指1840年鸦片战争，即中国近代史的起点。"}, {"section": "天安门及天安门广场", "type": "judge", "q": "天安门城楼两侧观礼台的总容量约为21000人。", "answer": "对", "explain": "原文：观礼台总容量约21000人（一说翻建后可容纳1万余人，资料口径不一）。", "source": "总容量约21000人（一说翻建后可容纳1万余人；资料口径不一）。"}, {"section": "天安门及天安门广场", "type": "multi", "q": "20世纪50年代对天安门广场的改造措施包括（ ）。", "options": ["A. 1950年将天安门前华表、石狮各向东西移位6米", "B. 1951年拆除东、西三座门", "C. 1952年8月拆除长安左门、长安右门", "D. 1958年拆除中华门、棋盘街及广场红墙"], "answer": "ABCD", "explain": "四项均属20世纪50年代广场改造内容：1950年移位华表石狮并拓宽长安街；1951年拆东西三座门；1952年8月拆长安左右门；1958年拆中华门、棋盘街及广场红墙，扩至44万平方米。", "source": "1950 年：……各向东西移位 6 米……1951 年：拆除东、西三座门。1952 年 8 月：拆除长安左门、长安右门……1958 年：……拆除中华门、棋盘街及广场红墙。"}, {"section": "天安门及天安门广场", "type": "single", "q": "主持人民英雄纪念碑浮雕设计与雕刻工作的负责人是（ ）。", "options": ["A. 梁思成", "B. 林徽因", "C. 刘开渠", "D. 杨廷宝"], "answer": "C", "explain": "浮雕创作由刘开渠主持，具体雕刻由河北曲阳石匠承担；梁思成主持建筑设计，林徽因负责装饰纹样。", "source": "负责人：刘开渠，主持浮雕的设计与雕刻工作；具体雕刻由河北曲阳石匠承担。"}, {"section": "天安门及天安门广场", "type": "judge", "q": "天安门广场旗杆两侧的绿地每侧约4800平方米，是1999年国庆50周年前改造时新增的。", "answer": "对", "explain": "绿地为1999年国庆50周年前改造时新增，位于中心广场北半部东西两侧，两侧各约4800平方米。", "source": "1999年国庆50周年前改造时新增，位于中心广场北半部东西两侧，两侧各约4800平方米，合计9600平方米"}, {"section": "天安门及天安门广场", "type": "single", "q": "毛主席纪念堂设计方案的提出者是（ ）。", "options": ["A. 张开济", "B. 张镈", "C. 梁思成", "D. 杨廷宝"], "answer": "D", "explain": "设计方案提出者是南京工学院杨廷宝教授；张开济是观礼台及中国革命和历史博物馆设计者，张镈是人民大会堂总设计师。", "source": "设计方案提出者：南京工学院杨廷宝（杨庭宝）教授"}, {"section": "天安门及天安门广场", "type": "judge", "q": "中华人民共和国国旗图案的设计者是曾联松。", "answer": "对", "explain": "国旗图案设计者为曾联松；《国旗法》于1990年6月28日通过并公布。", "source": "设计者：曾联松。《中华人民共和国国旗法》于1990年6月28日通过并公布。"}, {"section": "天安门及天安门广场", "type": "multi", "q": "关于今日天安门广场的特点，说法正确的有（ ）。", "options": ["A. 位于北京中轴线核心", "B. 是世界上最大的城市中心广场", "C. 被誉为\"中国第一风景\"", "D. 2024年作为\"北京中轴线\"的构成要素列入《世界遗产名录》"], "answer": "ABCD", "explain": "四项均与原文相符：广场位于北京中轴线核心，是世界上最大的城市中心广场，被誉为\"中国第一风景\"，2024年列入《世界遗产名录》。", "source": "位于北京中轴线核心，世界上最大的城市中心广场；……被誉为\"中国第一风景\"；2024年作为\"北京中轴线\"的构成要素列入《世界遗产名录》。"}, {"section": "天安门及天安门广场", "type": "single", "q": "明清时期的正阳门建筑组群，现今仅存（ ）。", "options": ["A. 城楼与瓮城", "B. 城楼与箭楼", "C. 箭楼与五牌楼", "D. 城楼与正阳桥"], "answer": "B", "explain": "明清构成含四门、城楼、箭楼、瓮城、正阳桥、五牌楼；现今仅存城楼与箭楼。", "source": "明清构成：四门、城楼、箭楼、瓮城、正阳桥、五牌楼。现今构成：仅存城楼与箭楼。"}, {"section": "天安门及天安门广场", "type": "judge", "q": "天安门新升旗仪式中，国旗从旗杆基座升至杆顶实际用时46秒。", "answer": "对", "explain": "全程（含护旗队行进）2分07秒；按《国歌法》国歌完整演奏一遍，实际升旗为46秒。", "source": "全程保持2分07秒；按《国歌法》国歌完整演奏一遍，实际升旗为46秒。"}, {"section": "天安门及天安门广场", "type": "single", "q": "清末正阳门在1900年庚子之变中被毁后，重修完工的时间是（ ）。", "options": ["A. 1902年", "B. 1903年", "C. 1906年", "D. 1911年"], "answer": "C", "explain": "1902年清廷命袁世凯、陈璧筹修，1903年动工，1906年完工，用银43万余两。", "source": "1903年（光绪二十九年）动工，1906年完工，用银43万余两。"}, {"section": "天安门及天安门广场", "type": "judge", "q": "人民英雄纪念碑的建筑设计与方案由刘开渠主持。", "answer": "错", "explain": "建筑设计与方案由梁思成主持；刘开渠主持的是浮雕创作。", "source": "建筑设计与方案由梁思成主持，林徽因负责碑座、碑身全套装饰纹样设计……浮雕创作由刘开渠主持。"}, {"section": "天安门及天安门广场", "type": "multi", "q": "中华人民共和国国徽图案的组成部分包括（ ）。", "options": ["A. 国旗（五星）", "B. 天安门", "C. 齿轮", "D. 麦稻穗（嘉禾）", "E. 华表"], "answer": "ABCD", "explain": "国徽图案由国旗（五星）、天安门、齿轮、麦稻穗（嘉禾）、红绶带组成，不含华表。", "source": "28. 国徽的图案组成：国旗（五星）、天安门、齿轮、麦稻穗（嘉禾）、红绶带。"}, {"section": "天安门及天安门广场", "type": "single", "q": "人民大会堂举行最高规格新闻发布会的地点是（ ）。", "options": ["A. 万人大礼堂", "B. 三楼中央大厅（\"金色大厅\"）", "C. 大宴会厅", "D. 东门外广场"], "answer": "B", "explain": "最高规格新闻发布会在三楼中央大厅即\"金色大厅\"；东门外广场是欢迎外国贵宾仪式的地点。", "source": "最高规格新闻发布会：人民大会堂三楼中央大厅，即\"金色大厅\"。"}, {"section": "天安门及天安门广场", "type": "judge", "q": "人民英雄纪念碑碑顶采用上有卷云、下有垂幔的小庑殿顶，属民族传统建筑形式。", "answer": "对", "explain": "碑顶采用民族传统建筑形式——上有卷云、下有垂幔的小庑殿顶。", "source": "碑顶建筑式样：采用民族传统建筑形式——上有卷云、下有垂幔的小庑殿顶。"}, {"section": "天安门及天安门广场", "type": "single", "q": "中国历史博物馆和中国革命博物馆的总设计师是（ ）。", "options": ["A. 张开济", "B. 张镈", "C. 杨廷宝", "D. 梁思成"], "answer": "A", "explain": "张开济任中国历史博物馆和中国革命博物馆总设计师；张镈是人民大会堂总设计师，杨廷宝提出毛主席纪念堂方案。", "source": "中国历史博物馆和中国革命博物馆的总设计师：张开济。"}, {"section": "天安门及天安门广场", "type": "judge", "q": "人民英雄纪念碑浮雕的具体雕刻由苏州御窑工匠承担。", "answer": "错", "explain": "浮雕具体雕刻由河北曲阳石匠承担；苏州（及江宁等地）烧制的是天安门城楼大殿地面的金砖。", "source": "负责人：刘开渠，主持浮雕的设计与雕刻工作；具体雕刻由河北曲阳石匠承担。"}, {"section": "天安门及天安门广场", "type": "multi", "q": "关于天安门前外金水桥，说法正确的有（ ）。", "options": ["A. 共7座并列的三孔拱券式汉白玉石桥", "B. 御路桥位于正中，为皇帝、皇后专用", "C. 公生桥位于太庙、社稷坛南门前", "D. 品级桥供四品以下官员行走"], "answer": "ABC", "explain": "外金水河上跨7座三孔拱券式汉白玉石桥；御路桥正中1座，皇帝、皇后专用；公生桥位于太庙、社稷坛南门前；品级桥供三品以上官员行走，四品以下官员走公生桥，D错。", "source": "天安门前外金水河上跨 7 座并列的三孔拱券式汉白玉石桥……品级桥（2 座）——三品以上官员行走……公生桥……供四品以下官员、兵弁、杂役行走。"}, {"section": "天安门及天安门广场", "type": "single", "q": "中国国家博物馆正式挂牌的时间是（ ）。", "options": ["A. 2003年2月28日", "B. 2011年3月1日", "C. 1959年9月10日", "D. 2012年12月1日"], "answer": "A", "explain": "2003年2月28日正式挂牌，馆名由江泽民同志题写；2011年3月1日是新馆重新开放时间。", "source": "2003年2月28日，馆名由江泽民同志题写。"}, {"section": "天安门及天安门广场", "type": "judge", "q": "纪念碑南面碑文中\"三十年以来\"指1919年五四运动以来的新民主主义革命。", "answer": "对", "explain": "\"三年\"指1946年起的解放战争；\"三十年\"指1919年五四运动以来的新民主主义革命。", "source": "\"三十年\"指1919年五四运动以来的新民主主义革命"}, {"section": "天安门及天安门广场", "type": "single", "q": "《周礼·考工记》\"匠人营国，方九里，旁三门\"中\"旁三门\"指的是（ ）。", "options": ["A. 都城每边开三座城门", "B. 都城共开三座城门", "C. 每座城门辟三个门洞", "D. 皇城一侧开三座门"], "answer": "A", "explain": "\"方九里，旁三门\"即都城九里见方，每边开三座城门。", "source": "即：都城九里见方，每边开三座城门。"}, {"section": "天安门及天安门广场", "type": "judge", "q": "明清正阳门建筑组群中的瓮城与五牌楼至今保存完好。", "answer": "错", "explain": "明清组群含四门、城楼、箭楼、瓮城、正阳桥、五牌楼；现今仅存城楼与箭楼。", "source": "明清构成：四门、城楼、箭楼、瓮城、正阳桥、五牌楼。现今构成：仅存城楼与箭楼。"}, {"section": "天安门及天安门广场", "type": "multi", "q": "下列关于天安门前外金水桥的说法，正确的有（ ）。", "options": ["A. 外金水河上跨7座并列的三孔拱券式汉白玉石桥", "B. 御路桥位于正中，供皇帝、皇后专用", "C. 皇族桥共2座，供宗室王公行走", "D. 品级桥供三品以上官员行走", "E. 公生桥供三品以上官员行走"], "answer": "ABCD", "explain": "E错误：公生桥供四品以下官员、兵弁、杂役行走；品级桥才供三品以上官员行走。", "source": "御路桥（正中1座）——皇帝、皇后专用；皇族桥（2座）——宗室王公行走；品级桥（2座）——三品以上官员行走；公生桥（2座）——供四品以下官员、兵弁、杂役行走。"}, {"section": "天安门及天安门广场", "type": "single", "q": "\"天子五门\"自外而内排列，位置最靠内的一门是（ ）。", "options": ["A. 皋门", "B. 库门", "C. 雉门", "D. 路门"], "answer": "D", "explain": "天子五门自外而内为皋门、库门、雉门、应门、路门（路门一曰毕门），最内为路门。", "source": "天子五门自外而内为：皋门、库门、雉门、应门、路门（路门一曰毕门）。"}, {"section": "天安门及天安门广场", "type": "single", "q": "明清时期天安门前的\"天街\"，是今天（ ）的前身。", "options": ["A. 长安街", "B. 前门大街", "C. 地安门大街", "D. 王府井大街"], "answer": "A", "explain": "明清时期天安门前\"T\"形广场北侧横街称\"天街\"，即今长安街的前身。", "source": "明清时期天安门前\"T\"形广场北侧横街的名称：称\"天街\"，即今长安街的前身。"}, {"section": "天安门及天安门广场", "type": "multi", "q": "下列关于天安门新升旗仪式的说法，正确的有（ ）。", "options": ["A. 礼号手登上天安门城楼上的吹奏台演奏", "B. 从护旗队行进至旗杆基座到国旗升至杆顶全程保持2分07秒", "C. 按《国歌法》国歌完整演奏一遍，实际升旗为46秒", "D. 仪式完毕后军乐团演奏《歌唱祖国》"], "answer": "ABCD", "explain": "四项均与原文相符：礼号手在城楼吹奏台；全程2分07秒；实际升旗46秒；完毕奏《歌唱祖国》。", "source": "礼号手位置：登上天安门城楼（城楼上的吹奏台）演奏；全程保持2分07秒……实际升旗为46秒；仪式完毕后演奏曲目：《歌唱祖国》"}, {"section": "天安门及天安门广场", "type": "single", "q": "明清时期天安门广场东侧的长安左门俗称（ ）。", "options": ["A. 虎门", "B. 龙门", "C. 国门", "D. 生门"], "answer": "B", "explain": "东侧长安左门俗称\"龙门\"；西侧长安右门俗称\"虎门\"。", "source": "东侧：长安左门，俗称\"龙门\"；西侧：长安右门，俗称\"虎门\"。"}, {"section": "天安门及天安门广场", "type": "single", "q": "明清时期刑部在千步廊办理的\"秋审\"\"朝审\"是指（ ）。", "options": ["A. 选官抽签", "B. 复核试卷", "C. 复核死刑案件", "D. 审理民事纠纷"], "answer": "C", "explain": "刑部\"秋审\"\"朝审\"为复核死刑案件；选官抽签是吏部、兵部\"月选官掣签\"，复核试卷是礼部会试\"磨勘\"。", "source": "吏部、兵部\"月选官掣签\"（选官抽签）、礼部会试\"磨勘\"（复核试卷）、刑部\"秋审\"\"朝审\"（复核死刑案件）。"}, {"section": "天安门及天安门广场", "type": "multi", "q": "下列关于人民英雄纪念碑基座浮雕的说法，正确的有（ ）。", "options": ["A. 大碑座四周镶嵌8幅历史主题汉白玉浮雕", "B. 浮雕高2米、总长40.68米，共约170个人物", "C. \"胜利渡江\"浮雕两侧另有\"支援前线\"与\"欢迎人民解放军\"2幅装饰性浮雕", "D. 基座浮雕合计10幅，概括中国百余年革命史"], "answer": "ABCD", "explain": "四项均与原文相符：8幅历史主题浮雕高2米、总长40.68米、约170人物；加2幅装饰性浮雕合计10幅。", "source": "大碑座（下层须弥座）四周镶嵌8幅历史主题汉白玉浮雕（高2米、总长40.68米，共约170个人物）……合计10幅浮雕，概括中国百余年革命史。"}, {"section": "天安门及天安门广场", "type": "single", "q": "下列城门名称中，属于清代皇城城门的是（ ）。", "options": ["A. 大明门", "B. 承天门", "C. 大清门", "D. 北安门"], "answer": "C", "explain": "清代皇城城门为大清门、天安门、长安左门、长安右门、东安门、西安门、地安门；大明门、承天门、北安门均为明代名称。", "source": "清代：大清门、天安门、长安左门、长安右门、东安门、西安门、地安门。"}, {"section": "天安门及天安门广场", "type": "single", "q": "为明代大明门书写门联的是（ ）。", "options": ["A. 解缙", "B. 郑玄", "C. 杨廷宝", "D. 梁思成"], "answer": "A", "explain": "原文明确：明代大明门门联的书写者为解缙。郑玄为汉代注经家，杨廷宝为毛主席纪念堂设计方案提出者，梁思成为人民英雄纪念碑建筑设计主持者。", "source": "8. 明代大明门门联的书写者：解缙"}, {"section": "天安门及天安门广场", "type": "multi", "q": "关于毛主席纪念堂的内部布局与瞻仰厅细节，下列说法正确的有（ ）。", "options": ["A. 建设工程仅用时6个月", "B. 二层设有毛泽东、周恩来、刘少奇、朱德、邓小平、陈云同志革命业绩纪念室", "C. 北大厅是瞻仰参观入口和举行纪念活动的场所，可容700多人", "D. 瞻仰厅内毛泽东遗体着灰色中山装、覆盖中国共产党党旗，棺床为黑色花岗岩"], "answer": "ABCD", "explain": "四项均与原文相符：用时仅6个月；二层设六位革命家纪念室；北大厅可容700多人；瞻仰厅遗体着灰色中山装覆党旗、黑色花岗岩棺床。", "source": "用时：仅6个月。二层设有毛泽东、周恩来、刘少奇、朱德、邓小平、陈云同志革命业绩纪念室。北大厅……可容700多人。毛泽东遗体着灰色中山装、覆盖中国共产党党旗，棺床为黑色花岗岩"}, {"section": "天安门及天安门广场", "type": "single", "q": "清朝时期，下列机构中设于天安门广场东侧的是（ ）。", "options": ["A. 刑部", "B. 都察院", "C. 大理寺", "D. 太医院"], "answer": "D", "explain": "广场东侧设宗人府、吏部、户部、礼部、兵部、工部、鸿胪寺、钦天监、太医院等文职衙门；刑部、都察院、大理寺（三法司）设于西侧。", "source": "东侧（文）：宗人府、吏部、户部、礼部、兵部、工部、鸿胪寺、钦天监、太医院等文职衙门。"}, {"section": "天安门及天安门广场", "type": "single", "q": "明清\"三法司\"中承担监察职能的是（ ）。", "options": ["A. 都察院", "B. 刑部", "C. 大理寺", "D. 鸿胪寺"], "answer": "A", "explain": "三法司中刑部主审判、都察院主监察、大理寺主复核；鸿胪寺不在三法司之列。", "source": "刑部（审判）、都察院（监察）、大理寺（复核），重大案件由三法司会审（秋审、朝审）。"}, {"section": "天安门及天安门广场", "type": "multi", "q": "关于人民大会堂的内部功能布局，下列说法正确的有（ ）。", "options": ["A. 内部中央为万人大礼堂，北部为宴会厅，南部为全国人大常委会办公楼", "B. 大宴会厅面积7000多平方米，可容纳5000人宴会或1万人酒会", "C. 欢迎外国贵宾的仪式在人民大会堂东门外广场举行", "D. 最高规格新闻发布会在三楼中央大厅\"金色大厅\"举行", "E. 万人大礼堂高46.5米"], "answer": "ABCD", "explain": "E错误：46.5米是人民大会堂的建筑高度；万人大礼堂宽76米、深60米、高33米。", "source": "中央为万人大礼堂，北部为宴会厅，南部为全国人大常委会办公楼；大宴会厅……可容纳5000人宴会或1万人酒会；东门外广场；三楼中央大厅，即\"金色大厅\"；万人大礼堂：宽76米、深60米、高33米；建筑高度：46.5米。"}, {"section": "天安门及天安门广场", "type": "single", "q": "明清时期选择在天安门城楼举行颁诏礼，是因为天安门是明清皇城的（ ）。", "options": ["A. 正门", "B. 东门", "C. 西门", "D. 北门"], "answer": "A", "explain": "天安门是明清皇城的正门，寓\"承天启运、受命于天\"之意，皇帝在此颁布诏书，是国家最高等级的典礼。", "source": "天安门是明清皇城的正门，寓\"承天启运、受命于天\"之意。"}, {"section": "天安门及天安门广场", "type": "single", "q": "明清皇帝举行耕耤田典礼时，自天安门出入前往的是（ ）。", "options": ["A. 圜丘坛", "B. 方泽坛", "C. 祈谷坛", "D. 先农坛"], "answer": "D", "explain": "祭天往圜丘坛、祭地往方泽坛、祈谷往祈谷坛、耕耤田往先农坛。", "source": "凡祭天（圜丘坛）、祭地（方泽坛）、祈谷（祈谷坛）、耕耤田（先农坛）、御驾亲征等重大礼仪活动，皇帝及随从人员均从天安门出入。"}, {"section": "天安门及天安门广场", "type": "multi", "q": "下列关于中国国家博物馆的说法，正确的有（ ）。", "options": ["A. 中国历史博物馆和中国革命博物馆的总设计师是张开济", "B. 2003年2月28日正式挂牌，馆名由江泽民同志题写", "C. 2011年3月1日改扩建工程竣工，新馆正式开放", "D. 开国大典升起的第一面五星红旗在其《复兴之路》基本陈列中展出", "E. 新馆展厅共24个"], "answer": "ABCD", "explain": "E错误：新馆展厅48个，展览面积近7万平方米，藏品140余万件，是世界上单体建筑面积最大的博物馆。", "source": "中国历史博物馆和中国革命博物馆的总设计师：张开济。2003年2月28日，馆名由江泽民同志题写。2011年3月1日……新馆正式开放。展厅48个……今在《复兴之路》基本陈列中展出。"}, {"section": "天安门及天安门广场", "type": "single", "q": "1949年10月1日开国大典时，在天安门广场参加的群众人数为（ ）。", "options": ["A. 10万军民", "B. 20万军民", "C. 30万军民", "D. 50万军民"], "answer": "C", "explain": "原文：参加开国大典的群众人数为30万军民。", "source": "16. 参加开国大典的群众人数：30 万军民"}, {"section": "天安门及天安门广场", "type": "single", "q": "1951年对天安门广场的改造内容是（ ）。", "options": ["A. 拆除长安左门、长安右门", "B. 拆除东、西三座门", "C. 拆除中华门", "D. 拆除棋盘街"], "answer": "B", "explain": "1951年拆除东、西三座门；1952年8月拆除长安左门、长安右门；1958年拆除中华门、棋盘街及广场红墙。", "source": "1951 年：拆除东、西三座门。"}, {"section": "天安门及天安门广场", "type": "multi", "q": "下列关于正阳门的说法，正确的有（ ）。", "options": ["A. 明清时期正阳门建筑组群由四门、城楼、箭楼、瓮城、正阳桥、五牌楼构成", "B. 箭楼自2024年12月26日恢复对外开放，内设中轴线主题展览", "C. 1902年清廷命直隶总督袁世凯、顺天府尹陈璧筹修正阳门", "D. 因工部档案被毁，重修时按崇文门、宣武门形制放大重建", "E. 重修于1903年动工、1906年完工，用银43万余两"], "answer": "ABCDE", "explain": "五项均与原文相符：明清组群六部分；箭楼2024年12月26日恢复开放；1902年袁世凯、陈璧筹修；按崇文门、宣武门形制放大；1903年动工、1906年完工，用银43万余两。", "source": "明清构成：四门、城楼、箭楼、瓮城、正阳桥、五牌楼。箭楼自2024年12月26日恢复对外开放……1902年清廷命直隶总督袁世凯、顺天府尹陈璧筹修……按崇文门、宣武门形制放大重建；1903年动工，1906年完工，用银43万余两。"}, {"section": "天安门及天安门广场", "type": "single", "q": "1954年6月，天安门城楼两侧观礼台改建为砖混结构永久性观礼台，占地约（ ）。", "options": ["A. 2470平方米", "B. 7300平方米", "C. 9600平方米", "D. 1.5万平方米"], "answer": "A", "explain": "1952年搭建的砖木结构临时性观礼台占地约7300平方米；1954年6月改建为砖混结构永久性观礼台，占地约2470平方米。", "source": "1954 年 6 月才改建为砖混结构永久性观礼台（占地约 2470 平方米）。"}, {"section": "天安门及天安门广场", "type": "single", "q": "今日天安门广场的东西宽度为（ ）。", "options": ["A. 400米", "B. 500米", "C. 800米", "D. 880米"], "answer": "B", "explain": "今日天安门广场南北长880米、东西宽500米，面积44万平方米。", "source": "南北长 880 米，东西宽 500 米，面积 44 万平方米（44 公顷）。"}, {"section": "天安门及天安门广场", "type": "single", "q": "天安门城楼被公布为全国重点文物保护单位的年份是（ ）。", "options": ["A. 1956年", "B. 1961年", "C. 1982年", "D. 1988年"], "answer": "B", "explain": "原文：全国重点文物保护单位公布时间为1961年；1988年1月1日是城楼对公众首次开放的时间。", "source": "20. 全国重点文物保护单位公布时间：1961 年"}, {"section": "天安门及天安门广场", "type": "single", "q": "1988年1月1日起，公众首次可以登临参观的是（ ）。", "options": ["A. 天安门城楼", "B. 正阳门箭楼", "C. 人民英雄纪念碑碑顶", "D. 毛主席纪念堂"], "answer": "A", "explain": "天安门城楼于1988年1月1日对公众首次开放。", "source": "21. 天安门城楼对公众首次开放的时间：1988 年 1 月 1 日"}, {"section": "天安门及天安门广场", "type": "single", "q": "天安门城楼大殿内红漆立柱的数量为（ ）。", "options": ["A. 36根", "B. 49根", "C. 60根", "D. 81根"], "answer": "C", "explain": "城楼大殿有60根红漆立柱，直径约92厘米。", "source": "城楼大殿有 60 根红漆立柱（直径约 92 厘米）。"}, {"section": "天安门及天安门广场", "type": "single", "q": "天安门城楼地面铺设的\"金砖\"，其烧制地点是（ ）。", "options": ["A. 苏州（及江宁等地）", "B. 景德镇", "C. 临清", "D. 曲阳"], "answer": "A", "explain": "城楼地面铺设的\"金砖\"为苏州（及江宁等地）烧制的御窑金砖。", "source": "地面铺设\"金砖\"，为苏州（及江宁等地）烧制的御窑金砖。"}, {"section": "天安门及天安门广场", "type": "single", "q": "现悬挂于天安门城楼的毛主席画像，加上像框总重量约为（ ）。", "options": ["A. 1吨", "B. 1.5吨", "C. 2.5吨", "D. 5吨"], "answer": "B", "explain": "画像高6米、宽4.6米，加上像框总重量约1.5吨。", "source": "画像高 6 米、宽 4.6 米，加上像框总重量约 1.5 吨。"}, {"section": "天安门及天安门广场", "type": "single", "q": "中华人民共和国国徽最后方案的浮雕图案完善及模型制作者是（ ）。", "options": ["A. 梁思成", "B. 林徽因", "C. 高庄", "D. 张光宇"], "answer": "C", "explain": "最后方案采用清华小组方案，由清华大学教授高庄完善浮雕图案并制作国徽模型。", "source": "最后方案采用清华小组方案，由清华大学教授高庄完善浮雕图案并制作国徽模型。"}, {"section": "天安门及天安门广场", "type": "single", "q": "天安门前外金水桥中的公生桥，供（ ）行走。", "options": ["A. 宗室王公", "B. 三品以上官员", "C. 四品以下官员、兵弁、杂役", "D. 皇帝、皇后"], "answer": "C", "explain": "公生桥（2座）位于太庙、社稷坛南门前，供四品以下官员、兵弁、杂役行走；宗室王公走皇族桥，三品以上官员走品级桥，皇帝、皇后走御路桥。", "source": "公生桥（2 座）——位于太庙（今劳动人民文化宫）、社稷坛（今中山公园）南门前，供四品以下官员、兵弁、杂役行走。"}, {"section": "天安门及天安门广场", "type": "single", "q": "天安门前外金水桥7座石桥中，御路桥的桥栏望柱雕刻纹样是（ ）。", "options": ["A. 云龙纹", "B. 火炬形", "C. 莲花纹", "D. 云凤纹"], "answer": "A", "explain": "御路桥最长最宽，桥栏望柱雕云龙纹；其余6座桥望柱柱头均为火炬形（火焰式）。", "source": "御路桥最长最宽，桥栏望柱雕云龙纹；其余6座桥（皇族桥、品级桥、公生桥）望柱柱头均为火炬形（火焰式）"}, {"section": "天安门及天安门广场", "type": "single", "q": "人民英雄纪念碑碑座、碑身的装饰纹样，以最能代表中国传统文化的（ ）风格为蓝本。", "options": ["A. 汉代", "B. 唐代", "C. 宋代", "D. 明代"], "answer": "B", "explain": "装饰纹样以最能代表中国传统文化的唐代（盛唐）风格为蓝本。", "source": "装饰纹样则以最能代表中国传统文化的唐代（盛唐）风格为蓝本，花环花卉选定牡丹、荷花、菊花"}, {"section": "天安门及天安门广场", "type": "single", "q": "天安门前的汉白玉石狮共4只，分立于金水桥南北两侧，雕刻于（ ）。", "options": ["A. 明洪武年间", "B. 明永乐年间", "C. 明成化年间", "D. 明嘉靖年间"], "answer": "B", "explain": "石狮雕刻于明永乐年间；明成化元年（1465）立的是城楼前后的华表。", "source": "石狮：金水桥南北两侧各一对（共4只），雕刻于明永乐年间。"}, {"section": "天安门及天安门广场", "type": "single", "q": "俗称\"十里长街\"的狭义长安街（东单—西单）长约（ ）。", "options": ["A. 3.7—4千米", "B. 6.7千米", "C. 55千米", "D. 80千米"], "answer": "A", "explain": "狭义长安街（东单—西单）长约3.7—4千米；6.7千米是建国门—复兴门段，55千米是全线总里程。", "source": "狭义长安街（东单—西单）长约3.7—4千米，俗称\"十里长街\"；建国门—复兴门约6.7千米。"}, {"section": "天安门及天安门广场", "type": "single", "q": "今日\"百里长街\"长安街东起（ ），西至石景山区。", "options": ["A. 朝阳区", "B. 通州区", "C. 东城区", "D. 海淀区"], "answer": "B", "explain": "今日长安街东起通州区（北京城市副中心，运河文化广场一带），西至石景山区，2019年西延工程贯通后延伸至门头沟区。", "source": "东起通州区（北京城市副中心，运河文化广场一带），西至石景山区（首钢东门；2019年西延工程贯通后延伸至门头沟区）"}, {"section": "天安门及天安门广场", "type": "single", "q": "天安门城楼两侧观礼台的设计者是（ ）。", "options": ["A. 张开济", "B. 张镈", "C. 杨廷宝", "D. 梁思成"], "answer": "A", "explain": "观礼台设计者为张开济（同期还设计了中国革命和历史博物馆）；张镈是人民大会堂总设计师，杨廷宝提出毛主席纪念堂设计方案。", "source": "设计者：张开济（我国著名建筑师，同期还设计了中国革命和历史博物馆）。"}, {"section": "天安门及天安门广场", "type": "single", "q": "新中国成立后在天安门广场修建的第一座大型建筑是（ ）。", "options": ["A. 人民大会堂", "B. 人民英雄纪念碑", "C. 毛主席纪念堂", "D. 中国革命和历史博物馆"], "answer": "B", "explain": "人民英雄纪念碑是新中国成立后在天安门广场修建的第一座大型建筑，也是中国历史上最大的纪念碑。", "source": "人民英雄纪念碑——新中国成立后在天安门广场修建的第一座大型建筑，也是中国历史上最大的纪念碑。"}, {"section": "天安门及天安门广场", "type": "single", "q": "人民英雄纪念碑的奠基典礼举行于（ ）。", "options": ["A. 1949年9月30日下午", "B. 1949年10月1日", "C. 1952年8月1日", "D. 1958年5月1日"], "answer": "A", "explain": "1949年9月30日政协第一届全体会议通过决议，当日下午毛泽东率全体政协委员在天安门广场举行奠基典礼。", "source": "当日下午毛泽东率全体政协委员在天安门广场举行奠基典礼。"}, {"section": "天安门及天安门广场", "type": "single", "q": "人民英雄纪念碑正式动工兴建的时间是（ ）。", "options": ["A. 1949年9月30日", "B. 1952年8月1日", "C. 1958年4月22日", "D. 1958年5月1日"], "answer": "B", "explain": "1952年8月1日正式动工兴建；1949年9月30日是决议与奠基，1958年4月22日落成。", "source": "动工：1952年8月1日正式动工兴建。"}, {"section": "天安门及天安门广场", "type": "single", "q": "人民英雄纪念碑揭幕仪式举行的时间是（ ）。", "options": ["A. 1958年4月22日", "B. 1958年5月1日", "C. 1958年10月1日", "D. 1959年10月1日"], "answer": "B", "explain": "纪念碑1958年4月22日落成，1958年5月1日举行揭幕仪式。", "source": "落成与揭幕：1958年4月22日落成，1958年5月1日举行揭幕仪式。"}, {"section": "天安门及天安门广场", "type": "single", "q": "人民英雄纪念碑碑座、碑身全套装饰纹样设计（并实际组织设计工作）的负责人是（ ）。", "options": ["A. 林徽因", "B. 梁思成", "C. 刘开渠", "D. 杨廷宝"], "answer": "A", "explain": "林徽因负责碑座、碑身全套装饰纹样设计；梁思成主持建筑设计与方案，刘开渠主持浮雕创作。", "source": "林徽因负责碑座、碑身全套装饰纹样设计（并实际组织设计工作）"}, {"section": "天安门及天安门广场", "type": "single", "q": "人民英雄纪念碑碑身形制的设计蓝本是（ ）。", "options": ["A. 颐和园万寿山昆明湖碑", "B. 北海公园九龙壁", "C. 明十三陵神功圣德碑", "D. 故宫太和殿丹陛石"], "answer": "A", "explain": "碑身原型参考颐和园万寿山昆明湖碑（清代石碑）的形制，并放大改造。", "source": "设计蓝本：碑身原型参考颐和园万寿山昆明湖碑（清代石碑）的形制，并放大改造"}, {"section": "天安门及天安门广场", "type": "single", "q": "人民英雄纪念碑北面（正面，面向天安门）\"人民英雄永垂不朽\"八个鎏金大字由（ ）亲笔题写。", "options": ["A. 毛泽东", "B. 周恩来", "C. 朱德", "D. 刘少奇"], "answer": "A", "explain": "北面为毛泽东主席亲笔题写；南面碑文是毛泽东撰文、周恩来总理亲笔书写。", "source": "北面（正面，面向天安门）：毛泽东主席亲笔题写的\"人民英雄永垂不朽\"八个鎏金大字。"}, {"section": "天安门及天安门广场", "type": "single", "q": "人民英雄纪念碑装饰花环花卉选定牡丹、荷花、（ ），象征高贵、纯洁、坚韧。", "options": ["A. 梅花", "B. 兰花", "C. 菊花", "D. 桂花"], "answer": "C", "explain": "花环花卉选定牡丹、荷花、菊花，象征高贵、纯洁、坚韧。", "source": "花环花卉选定牡丹、荷花、菊花，象征高贵、纯洁、坚韧。"}, {"section": "天安门及天安门广场", "type": "single", "q": "《中华人民共和国国旗法》通过并公布的时间是（ ）。", "options": ["A. 1949年9月27日", "B. 1982年12月4日", "C. 1990年6月28日", "D. 1997年7月1日"], "answer": "C", "explain": "《中华人民共和国国旗法》于1990年6月28日通过并公布；国旗设计者是曾联松。", "source": "设计者：曾联松。《中华人民共和国国旗法》于1990年6月28日通过并公布。"}, {"section": "天安门及天安门广场", "type": "single", "q": "天安门新升旗仪式完毕后，军乐团演奏的曲目是（ ）。", "options": ["A. 《义勇军进行曲》", "B. 《歌唱祖国》", "C. 《东方红》", "D. 《我和我的祖国》"], "answer": "B", "explain": "仪式完毕后军乐团演奏《歌唱祖国》。", "source": "仪式完毕后演奏曲目：《歌唱祖国》"}, {"section": "天安门及天安门广场", "type": "single", "q": "人民英雄纪念碑碑心石所用的石料是（ ）。", "options": ["A. 花岗岩", "B. 汉白玉", "C. 大理石", "D. 青石"], "answer": "A", "explain": "碑心石为山东省青岛市崂山余脉——浮山（大金顶）的花岗岩；汉白玉用于基座浮雕。", "source": "碑心石的产地：山东省青岛市崂山余脉——浮山（大金顶）的花岗岩。"}, {"section": "天安门及天安门广场", "type": "single", "q": "天安门广场旗杆两侧绿地合计9600平方米，其寓意是象征（ ）。", "options": ["A. 我国960万平方公里的领土", "B. 我国56个民族大团结", "C. 新中国百年奋斗历程", "D. 9600万共产党员"], "answer": "A", "explain": "绿地两侧各约4800平方米、合计9600平方米，象征我国960万平方公里的领土。", "source": "两侧各约4800平方米，合计9600平方米，象征我国960万平方公里的领土。"}, {"section": "天安门及天安门广场", "type": "single", "q": "毛主席纪念堂门额\"毛主席纪念堂\"六个镏金大字的题写者是（ ）。", "options": ["A. 毛泽东", "B. 周恩来", "C. 华国锋", "D. 郭沫若"], "answer": "C", "explain": "门额由华国锋题写，匾由8块石料组成；设计方案由南京工学院杨廷宝教授提出。", "source": "门额题写者：华国锋题写\"毛主席纪念堂\"六个镏金大字（匾由8块石料组成）。"}, {"section": "天安门及天安门广场", "type": "single", "q": "毛主席纪念堂的核心、正中安放水晶棺的厅堂是（ ）。", "options": ["A. 北大厅", "B. 瞻仰厅", "C. 南大厅", "D. 宣教厅"], "answer": "B", "explain": "瞻仰厅是纪念堂核心，正中安放水晶棺；北大厅是入口和举行纪念活动场所，南大厅是出口大厅。", "source": "瞻仰厅：纪念堂核心，正中安放水晶棺"}, {"section": "天安门及天安门广场", "type": "single", "q": "毛主席纪念堂北大厅毛主席汉白玉坐像背后的巨幅绒绣是（ ）。", "options": ["A. 《江山如此多娇》", "B. 《祖国大地》", "C. 《万里长城》", "D. 《旭日东升》"], "answer": "B", "explain": "坐像背后为巨幅绒绣《祖国大地》（祖国山河图），寓意毛泽东同志与祖国锦绣山河永远同在。", "source": "北大厅墙壁背景图案：坐像背后为巨幅绒绣《祖国大地》（祖国山河图）"}, {"section": "天安门及天安门广场", "type": "single", "q": "毛主席纪念堂南大厅北墙镌刻的毛泽东手迹诗词是（ ）。", "options": ["A. 《沁园春·雪》", "B. 《满江红·和郭沫若同志》", "C. 《七律·长征》", "D. 《水调歌头·游泳》"], "answer": "B", "explain": "南大厅北墙镌刻毛泽东同志手迹《满江红·和郭沫若同志》，银胎鎏金镶于汉白玉墙面。", "source": "南大厅北墙镌刻诗词的作者：毛泽东同志手迹《满江红·和郭沫若同志》（银胎鎏金镶于汉白玉墙面）"}, {"section": "天安门及天安门广场", "type": "single", "q": "1900年庚子之变中，正阳门箭楼被烧毁的直接起因是（ ）。", "options": ["A. 义和团火烧大栅栏老德记洋货店，火势蔓延", "B. 八国联军直接炮击箭楼", "C. 雷击引发大火", "D. 瓮城内驻军失火"], "answer": "A", "explain": "义和团为抵制洋货火烧大栅栏老德记洋货店（西药房），火势蔓延烧毁箭楼；两个多月后英军所雇印度兵失火又烧毁城楼。", "source": "义和团为抵制洋货火烧大栅栏老德记洋货店（西药房），火势蔓延烧毁箭楼"}, {"section": "故宫（紫禁城）", "type": "single", "q": "紫禁城落成建成的时间是（ ）。", "options": ["A. 明永乐四年（1406年）", "B. 明永乐十五年（1417年）", "C. 明永乐十八年（1420年）", "D. 明永乐二十二年（1424年）"], "answer": "C", "explain": "紫禁城于明永乐十八年（1420年）十一月／十二月落成。", "source": "建成：明永乐十八年（1420 年）十一月／十二月紫禁城落成。"}, {"section": "故宫（紫禁城）", "type": "judge", "q": "紫禁城始建于明永乐四年（1406年），由明成祖朱棣下诏营建北京宫殿。", "answer": "对", "explain": "原文：始建为明永乐四年（1406年），明成祖朱棣下诏营建北京宫殿。", "source": "始建：明永乐四年（1406 年），明成祖朱棣下诏营建北京宫殿。"}, {"section": "故宫（紫禁城）", "type": "multi", "q": "明清时期，太和殿举行的重大典礼包括（ ）。", "options": ["A. 皇帝登极即位", "B. 皇帝大婚", "C. 册立皇后", "D. 命将出征"], "answer": "ABCD", "explain": "太和殿主要仪式：皇帝登极即位、皇帝大婚、册立皇后、命将出征，以及万寿节、元旦、冬至朝贺等。", "source": "主要仪式：皇帝登极即位、皇帝大婚、册立皇后、命将出征；每年万寿节（皇帝生日）、元旦、冬至三大节皇帝在此接受文武百官朝贺……"}, {"section": "故宫（紫禁城）", "type": "single", "q": "紫禁城工程设计和营造的蓝本是（ ）。", "options": ["A. 元大都宫殿", "B. 南京故宫（南京明故宫）", "C. 沈阳故宫", "D. 明中都宫殿"], "answer": "B", "explain": "据《明史》记载，紫禁城初建后宫殿规制与南京皇宫基本相同，以南京故宫为蓝本。", "source": "蓝本：南京故宫（南京明故宫）。据《明史》记载，紫禁城初建后宫殿规制与南京皇宫基本相同……"}, {"section": "故宫（紫禁城）", "type": "judge", "q": "紫禁城自1406年下诏营建至1420年建成，前后共计16年。", "answer": "错", "explain": "建造时长为14年（1406—1420），题干'16年'错误。", "source": "建造时长：自 1406 年下诏至 1420 年建成，前后共计 14 年。"}, {"section": "故宫（紫禁城）", "type": "single", "q": "明朝入主紫禁城的皇帝共有（ ）。", "options": ["A. 12位", "B. 14位", "C. 16位", "D. 17位"], "answer": "B", "explain": "原文明确：明朝入主紫禁城的皇帝数量为14位。", "source": "明朝入主紫禁城的皇帝数量：14 位。"}, {"section": "故宫（紫禁城）", "type": "judge", "q": "1924年11月5日，冯玉祥发动'北京政变'后，由鹿钟麟执行，将溥仪驱逐出紫禁城。", "answer": "对", "explain": "与原文一致：1924年11月5日，摄政内阁公布《修正清室优待条件》，由鹿钟麟执行驱逐溥仪。", "source": "1924 年 11 月 5 日。冯玉祥发动'北京政变'后，摄政内阁公布《修正清室优待条件》，由鹿钟麟执行，将溥仪驱逐出宫。"}, {"section": "故宫（紫禁城）", "type": "multi", "q": "太和殿前月台（丹陛）上的陈设包括（ ）。", "options": ["A. 日晷、嘉量各一", "B. 铜龟、铜鹤各一对", "C. 铜鼎（鼎式香炉）18座", "D. 铜鎏金狮一对"], "answer": "ABC", "explain": "太和殿月台上为日晷（东）、嘉量（西）各一，铜龟铜鹤各一对，铜鼎18座；铜鎏金狮一对在乾清门前。", "source": "月台（丹陛）上：日晷（东）、嘉量（西）各一；铜龟、铜鹤各一对；铜鼎（鼎式香炉）18 座。"}, {"section": "故宫（紫禁城）", "type": "single", "q": "1914年在紫禁城咸安宫原址上修建的建筑是（ ）。", "options": ["A. 畅音阁", "B. 宝蕴楼", "C. 文渊阁", "D. 御景亭"], "answer": "B", "explain": "1914年在咸安宫原址上修建宝蕴楼。", "source": "1914 年在紫禁城咸安宫原址上修建的建筑：宝蕴楼。"}, {"section": "故宫（紫禁城）", "type": "judge", "q": "故宫博物院成立于1925年10月1日。", "answer": "错", "explain": "故宫博物院成立于1925年10月10日，题干'10月1日'错误。", "source": "故宫博物院成立的时间：1925 年 10 月 10 日"}, {"section": "故宫（紫禁城）", "type": "single", "q": "1924年将溥仪驱逐出紫禁城的具体执行者是（ ）。", "options": ["A. 冯玉祥", "B. 鹿钟麟", "C. 陈珪", "D. 吴中"], "answer": "B", "explain": "冯玉祥发动'北京政变'后，由鹿钟麟执行将溥仪驱逐出宫。冯玉祥是政变发动者而非执行者。", "source": "冯玉祥发动'北京政变'后，摄政内阁公布《修正清室优待条件》，由鹿钟麟执行，将溥仪驱逐出宫。"}, {"section": "故宫（紫禁城）", "type": "judge", "q": "明清两代颁朔礼均在每年农历十月初一举行，明代在太和门（奉天门／皇极门），清代在午门。", "answer": "对", "explain": "与原文一致：每年农历十月初一（明清同）；明在太和门，清在午门。", "source": "每年农历十月初一（明清同）；明在太和门（奉天门／皇极门），清在午门。"}, {"section": "故宫（紫禁城）", "type": "multi", "q": "太和殿前嘉量所构成的容量单位包括（ ）。", "options": ["A. 斛", "B. 斗", "C. 升", "D. 石"], "answer": "ABC", "explain": "嘉量由斛、斗、升、合、龠五种容量单位构成，不含'石'。", "source": "由斛、斗、升、合、龠五种容量单位构成：正中圆柱体上部为斛、下部为斗；左耳为升；右耳上截为合、下截为龠。"}, {"section": "故宫（紫禁城）", "type": "single", "q": "清代'御门听政'的地点在（ ）。", "options": ["A. 太和门", "B. 乾清门", "C. 午门", "D. 隆宗门"], "answer": "B", "explain": "清初'御门听政'移至乾清门，康熙六年（1667年）玄烨亲政后形成制度。", "source": "清代：清初'御门听政'移至乾清门；康熙六年（1667 年）玄烨亲政后形成制度、日以为常。"}, {"section": "故宫（紫禁城）", "type": "judge", "q": "太和殿前月台（丹陛）上，日晷置于西侧，嘉量置于东侧。", "answer": "错", "explain": "原文为日晷在东、嘉量在西，题干方位颠倒。", "source": "月台（丹陛）上：日晷（东）、嘉量（西）各一；铜龟、铜鹤各一对；铜鼎（鼎式香炉）18 座。"}, {"section": "故宫（紫禁城）", "type": "single", "q": "清顺治皇帝入关后举行登基大典的地点是（ ）。", "options": ["A. 太和殿", "B. 保和殿", "C. 皇极门（今太和门）", "D. 午门"], "answer": "C", "explain": "因前朝三大殿已被李自成焚毁，顺治元年（1644年）九月登基大典在皇极门（今太和门）举行。", "source": "顺治元年（1644 年）九月，顺治帝定鼎北京后，因前朝三大殿已被李自成焚毁，登基大典在皇极门（今太和门）举行，并颁布大赦令。"}, {"section": "故宫（紫禁城）", "type": "judge", "q": "太和殿檐角安放10个走兽，依次为龙、凤、狮子、天马、海马、狻猊、押鱼、獬豸、斗牛、行什。", "answer": "对", "explain": "与原文一致，太和殿檐角安放10个走兽。", "source": "太和殿檐角安放 10 个走兽，龙、凤、狮子、天马、海马、狻猊、押鱼、獬豸、斗牛、行什。"}, {"section": "故宫（紫禁城）", "type": "multi", "q": "乾清宫前丹陛（露台）上的陈设包括（ ）。", "options": ["A. 铜龟、铜鹤各二", "B. 日晷、嘉量各一", "C. 宝鼎（鎏金香炉）4座", "D. 铜鼎18座"], "answer": "ABC", "explain": "乾清宫前露台上：铜龟铜鹤各二，日晷嘉量各一，宝鼎4座；铜鼎18座是太和殿前的陈设。", "source": "露台（月台）上：铜龟、铜鹤各二，日晷、嘉量各一，宝鼎（鎏金香炉）4 座；正中出丹陛接高台甬路通往乾清门。"}, {"section": "故宫（紫禁城）", "type": "single", "q": "清顺治二年（1645年），奉天殿被改名为（ ）。", "options": ["A. 皇极殿", "B. 中极殿", "C. 建极殿", "D. 太和殿"], "answer": "D", "explain": "太和殿名称演变：明初奉天殿→嘉靖四十一年改皇极殿→清顺治二年改太和殿。", "source": "太和殿：明初奉天殿，明嘉靖四十一年（1562）改皇极殿，清顺治二年（1645）改太和殿。"}, {"section": "故宫（紫禁城）", "type": "judge", "q": "太和殿区域的鎏金太平缸均铸造于明永乐年间。", "answer": "错", "explain": "太平缸均为清乾隆年间铸造，缸上部刻'大清乾隆年造'字样，题干'明永乐年间'错误。", "source": "铸造时间：均为清乾隆年间铸造，缸上部刻'大清乾隆年造'字样。"}, {"section": "故宫（紫禁城）", "type": "single", "q": "明嘉靖四十一年（1562年），华盖殿被改名为（ ）。", "options": ["A. 中极殿", "B. 皇极殿", "C. 建极殿", "D. 中和殿"], "answer": "A", "explain": "中和殿名称演变：明初华盖殿→嘉靖四十一年改中极殿→清顺治二年改中和殿。", "source": "中和殿：明初华盖殿，明嘉靖四十一年（1562）改中极殿，清顺治二年（1645）改中和殿。"}, {"section": "故宫（紫禁城）", "type": "judge", "q": "在保和殿举行殿试，始于清乾隆五十四年（1789年），此后成为定制。", "answer": "对", "explain": "与原文一致：清乾隆五十四年（1789年）始定于保和殿举行殿试。", "source": "清乾隆五十四年（1789 年）始定于保和殿，此后成定制。"}, {"section": "故宫（紫禁城）", "type": "multi", "q": "下列关于太和殿区域鎏金太平缸的说法，正确的有（ ）。", "options": ["A. 均为清乾隆年间铸造", "B. 每口约重1696公斤，可贮水约2000升", "C. 又称'门海''吉祥缸''太平缸'，寓意以水克火", "D. 1900年八国联军以刺刀刮削鎏金，缸身至今留有刀痕"], "answer": "ABCD", "explain": "四项均与原文一致：乾隆年间铸造、重约1696公斤、储水防火又称门海、1900年被八国联军刮削。", "source": "每口约重 1696 公斤……均为清乾隆年间铸造……故称'门海''吉祥缸''太平缸'……1900 年八国联军以刺刀刮削鎏金，缸身至今留有刀痕。"}, {"section": "故宫（紫禁城）", "type": "single", "q": "1915年袁世凯复辟时，曾将太和殿改名为（ ）。", "options": ["A. 奉天殿", "B. 承运殿", "C. 体元殿", "D. 建极殿"], "answer": "B", "explain": "1915年袁世凯复辟时改太和殿为'承运殿'、中和殿为'体元殿'、保和殿为'建极殿'，旋即废止。", "source": "1915 年袁世凯复辟时曾一度改太和殿为'承运殿'、中和殿为'体元殿'、保和殿为'建极殿'，旋即废止。"}, {"section": "故宫（紫禁城）", "type": "judge", "q": "李自成在紫禁城中即位的地点是武英殿。", "answer": "对", "explain": "与原文一致：李自成在紫禁城中即位于武英殿。", "source": "李自成在紫禁城中即位的地点：武英殿。"}, {"section": "故宫（紫禁城）", "type": "single", "q": "太和殿的俗称是（ ）。", "options": ["A. 金銮殿", "B. 承运殿", "C. 奉天殿", "D. 皇极殿"], "answer": "A", "explain": "太和殿俗称'金銮殿'，是举行国家重大典礼的场所。", "source": "太和殿俗称'金銮殿'，是举行国家重大典礼的场所，并非日常办公地。"}, {"section": "故宫（紫禁城）", "type": "judge", "q": "康熙皇帝在紫禁城中禁锢废太子胤礽的地点是乾清宫。", "answer": "错", "explain": "禁锢胤礽的地点是咸安宫，题干'乾清宫'错误。", "source": "咸安宫。康熙四十七年（1708 年）九月首次废太子胤礽，将其幽禁于咸安宫……仍禁锢于咸安宫。"}, {"section": "故宫（紫禁城）", "type": "multi", "q": "下列关于武英殿的说法，正确的有（ ）。", "options": ["A. 康熙八年（1669年）康熙帝曾一度移居武英殿", "B. 康熙十九年（1680年）设武英殿修书处于左右廊房", "C. 李自成在紫禁城中即位于武英殿", "D. 清兵入关之初多尔衮以武英殿作为处理政务之所"], "answer": "ABCD", "explain": "四项均见原文：康熙移居、设修书处、李自成即位、多尔衮理事均在武英殿。", "source": "康熙八年（1669 年）……康熙帝曾一度移居武英殿。康熙十九年（1680 年）设'武英殿修书处'……李自成……即位……武英殿。多尔衮……以武英殿作为理事之所。"}, {"section": "故宫（紫禁城）", "type": "single", "q": "太和殿前月台上的铜鼎（鼎式香炉）共有（ ）。", "options": ["A. 8座", "B. 10座", "C. 18座", "D. 24座"], "answer": "C", "explain": "太和殿前有铜鼎（鼎式香炉）18座，寓意当时内地18省。", "source": "铜鼎 18 座——大典时焚香用，寓意当时内地 18 省。"}, {"section": "故宫（紫禁城）", "type": "judge", "q": "清代皇子皇孙上学读书的上书房位于乾清门内西侧、乾清宫周围的庑房。", "answer": "错", "explain": "方位错误。上书房位于乾清门内东侧、乾清宫周围的庑房（乾清宫东庑），由翰林任师傅。", "source": "上书房，位于乾清门内东侧、乾清宫周围的庑房（乾清宫东庑）。皇子皇孙在此读书，由翰林任师傅。"}, {"section": "故宫（紫禁城）", "type": "single", "q": "太和殿檐角安放的走兽数量为（ ）。", "options": ["A. 8个", "B. 9个", "C. 10个", "D. 12个"], "answer": "C", "explain": "太和殿檐角安放10个走兽：龙、凤、狮子、天马、海马、狻猊、押鱼、獬豸、斗牛、行什。", "source": "太和殿檐角安放 10 个走兽，龙、凤、狮子、天马、海马、狻猊、押鱼、獬豸、斗牛、行什。"}, {"section": "故宫（紫禁城）", "type": "judge", "q": "交泰殿今悬“无为”匾为康熙帝亲笔原题。", "answer": "错", "explain": "“无为”匾为康熙帝原题，但今悬者为乾隆帝恭摹康熙御笔，并非康熙亲笔原件。", "source": "康熙帝原题，今悬者为乾隆帝恭摹康熙御笔。"}, {"section": "故宫（紫禁城）", "type": "multi", "q": "下列建筑中，属于前朝东路文华殿组群的有（ ）。", "options": ["A. 文渊阁", "B. 传心殿", "C. 内阁", "D. 断虹桥"], "answer": "ABC", "explain": "东路文华殿组群含文华门、文华殿、文渊阁、传心殿、内阁等；断虹桥属西路武英殿组群（武英殿前内金水河上）。", "source": "东路——文华殿组群：文华门、文华殿、主敬殿、本仁殿、集义殿、文渊阁、传心殿……内阁……箭亭。西路——武英殿组群：……断虹桥……"}, {"section": "故宫（紫禁城）", "type": "single", "q": "紫禁城珍宝馆现存最大的玉雕作品是（ ）。", "options": ["A. 《会昌九老图》玉山", "B. 《秋山行旅图》玉山", "C. 《大禹治水图》玉山", "D. 《松鹤延年图》玉山"], "answer": "C", "explain": "最大的一件为《大禹治水图》玉山，系新疆和田青玉，世称'玉器之王'。", "source": "最大的一件：《大禹治水图》玉山——为新疆和田（密勒塔山）青玉，是世界上最大的和田玉雕，世称'玉器之王'。"}, {"section": "故宫（紫禁城）", "type": "judge", "q": "清代坤宁宫经改造后，正间及西暖阁成为宫中萨满教祭神的主要场所，东暖阁则为皇帝大婚的洞房。", "answer": "对", "explain": "清顺治十二年（1655年）仿沈阳故宫清宁宫改造后如此；康熙、同治、光绪三帝大婚及溥仪结婚均在东暖阁行合卺礼。", "source": "正间及西暖阁（西四间）连通，成为宫中萨满教祭神的主要场所……东暖阁（东两间）为皇帝大婚的洞房"}, {"section": "故宫（紫禁城）", "type": "single", "q": "中和殿'中和'一词的思想依据出自（ ）。", "options": ["A. 《论语》", "B. 《孟子》", "C. 《礼记·中庸》", "D. 《周易》"], "answer": "C", "explain": "'中和'出自《礼记·中庸》：'中也者，天下之大本也；和也者，天下之达道也。'", "source": "出自《礼记·中庸》：'中也者，天下之大本也；和也者，天下之达道也。致中和，天地位焉，万物育焉。'"}, {"section": "故宫（紫禁城）", "type": "judge", "q": "钦安殿是紫禁城中位于中轴线上的唯一道观，供奉玄天上帝（真武大帝），为道教北方之水神。", "answer": "对", "explain": "明清皇帝于立春、立夏、立秋、立冬等节令至此拈香行礼，祈求水神保佑皇宫、消弭火灾；其南为天一门，取“天一生水”之意以镇火。", "source": "钦安殿是紫禁城中位于中轴线上的唯一道观（神殿）……供奉玄天上帝（真武大帝、玄武大帝），为道教北方之水神。"}, {"section": "故宫（紫禁城）", "type": "multi", "q": "下列关于清代千叟宴的说法，正确的有（ ）。", "options": ["A. 清代共举行4次千叟宴", "B. 康熙五十二年（1713年）在畅春园举行", "C. 乾隆五十年（1785年）在乾清宫举行，与宴者3000余人", "D. 嘉庆元年（1796年）由太上皇乾隆在宁寿宫皇极殿举办"], "answer": "ABCD", "explain": "四项均与原文一致：共4次，1713畅春园、1722乾清宫、1785乾清宫、1796宁寿宫皇极殿。", "source": "共举行 4 次：康熙五十二年（1713 年）三月——畅春园……乾隆五十年（1785 年）正月——乾清宫（与宴者 3000 余人，设席 800 桌）；嘉庆元年（1796 年）正月——宁寿宫皇极殿（太上皇乾隆举办）。"}, {"section": "故宫（紫禁城）", "type": "single", "q": "皇帝在举行祭祀先农活动的前一日，阅视祝版的地点是（ ）。", "options": ["A. 太和殿", "B. 中和殿", "C. 保和殿", "D. 文华殿"], "answer": "B", "explain": "皇帝举行祭祀先农活动的前一日，在中和殿阅视祝版。", "source": "皇帝在举行祭祀先农活动的前一日，阅视祝版的地点：中和殿。"}, {"section": "故宫（紫禁城）", "type": "judge", "q": "绛雪轩因轩前原有海棠树5株，海棠花瓣飘落时色白如雪，宛若雪花片片缤纷而降，故得此名。", "answer": "对", "explain": "绛雪轩位于御花园东南，座东面西；乾隆有诗“徕春何处归来早，堆秀山前绛雪轩”。", "source": "轩前原有海棠树 5 株，海棠初放时颜色殷红，花瓣飘落时色白如雪，宛若雪花片片缤纷而降，故名“绛雪轩”"}, {"section": "故宫（紫禁城）", "type": "single", "q": "乾清宫前东西丹陛下安设的铜鎏金小殿名称是（ ）。", "options": ["A. 江山社稷金殿", "B. 金銮殿", "C. 三希堂", "D. 体元殿"], "answer": "A", "explain": "名称为江山社稷金殿（又称'江山社稷亭'），象征皇帝是江山与土地的唯一占有者和最高统治者。", "source": "江山社稷金殿（又称'江山社稷亭'）。东西丹陛下各有一文石台，台上各安设一座铜质鎏金小殿……"}, {"section": "故宫（紫禁城）", "type": "judge", "q": "洪熙元年（1425年）五月十二日，明仁宗朱高炽猝死于乾清宫，在位仅约8个月。", "answer": "错", "explain": "地点错误。明仁宗朱高炽猝死于御花园钦安殿，非乾清宫；葬于十三陵献陵。", "source": "洪熙元年（1425 年）五月十二日猝死于钦安殿（葬于十三陵献陵），在位仅约 8 个月。"}, {"section": "故宫（紫禁城）", "type": "multi", "q": "紫禁城珍宝馆现存三件主要大玉雕作品包括（ ）。", "options": ["A. 《大禹治水图》玉山", "B. 《会昌九老图》玉山", "C. 《秋山行旅图》玉山", "D. 《松鹤延年图》玉山"], "answer": "ABC", "explain": "三件大玉雕为《大禹治水图》玉山、《会昌九老图》玉山、《秋山行旅图》玉山，无《松鹤延年图》玉山。", "source": "《大禹治水图》玉山、《会昌九老图》玉山、《秋山行旅图》玉山。"}, {"section": "故宫（紫禁城）", "type": "single", "q": "康熙十九年（1680年）设于武英殿、掌管刊印装潢书籍的机构是（ ）。", "options": ["A. 内阁大库", "B. 方略馆", "C. 武英殿修书处", "D. 御书处"], "answer": "C", "explain": "康熙十九年（1680年）设'武英殿修书处'（书局）于左右廊房，掌管刊印、装潢书籍。", "source": "康熙十九年（1680 年）设'武英殿修书处'（书局）于左右廊房，掌管刊印、装潢书籍，由亲王大臣总理。"}, {"section": "故宫（紫禁城）", "type": "judge", "q": "养心殿为“工”字形格局，前殿与后殿以穿廊相连。", "answer": "对", "explain": "前殿（正殿）为皇帝理政、小朝会之所，后殿为皇帝寝宫，二者以穿廊相连成“工”字形。", "source": "为“工”字形（前殿与后殿以穿廊相连）格局"}, {"section": "故宫（紫禁城）", "type": "single", "q": "清兵入关之初，摄政王多尔衮处理政务的地点是（ ）。", "options": ["A. 乾清宫", "B. 武英殿", "C. 文华殿", "D. 养心殿"], "answer": "B", "explain": "摄政王多尔衮先行抵京，以武英殿作为理事（处理政务）之所。", "source": "武英殿。清兵入关之初，摄政王多尔衮先行抵京，以武英殿作为理事（处理政务）之所……"}, {"section": "故宫（紫禁城）", "type": "judge", "q": "自雍正起至宣统，先后有8位清帝在养心殿居住并处理日常政务。", "answer": "对", "explain": "即雍正、乾隆、嘉庆、道光、咸丰、同治、光绪、宣统八帝，养心殿成为清王朝实际的政治决策中心。", "source": "自雍正起至宣统，先后有 8 位清帝（雍正、乾隆、嘉庆、道光、咸丰、同治、光绪、宣统）在此居住并处理日常政务"}, {"section": "故宫（紫禁城）", "type": "multi", "q": "下列关于交泰殿内部陈设的说法，正确的有（ ）。", "options": ["A. 明间设宝座", "B. 宝座上方悬康熙帝御书“无为”匾", "C. 东次间设大自鸣钟", "D. 西次间设铜壶滴漏", "E. 宝座后板屏上为乾隆帝御制《交泰殿铭》"], "answer": "ABE", "explain": "C、D方位颠倒：应为东次间设铜壶滴漏、西次间设大自鸣钟。", "source": "明间设宝座，上悬康熙帝御书“无为”匾；宝座后板屏上为乾隆帝御制《交泰殿铭》；东次间设铜壶滴漏；西次间设大自鸣钟"}, {"section": "故宫（紫禁城）", "type": "single", "q": "紫禁城文渊阁是仿照（ ）修建的。", "options": ["A. 江苏扬州文汇阁", "B. 浙江宁波范氏天一阁", "C. 承德避暑山庄文津阁", "D. 杭州文澜阁"], "answer": "B", "explain": "文渊阁仿照浙江宁波范氏天一阁修建。", "source": "紫禁城文渊阁是仿照哪座建筑修建的：仿照浙江宁波范氏天一阁修建。"}, {"section": "故宫（紫禁城）", "type": "judge", "q": "养心殿大修后于2025年10月10日重新向公众开放。", "answer": "错", "explain": "时间错误。养心殿重新开放时间为2025年12月26日；1925年10月10日是故宫博物院成立的时间。", "source": "养心殿大修后重新开放的时间：2025 年 12 月 26 日重新向公众开放。"}, {"section": "故宫（紫禁城）", "type": "single", "q": "乾清门的屋顶形制是（ ）。", "options": ["A. 重檐庑殿顶", "B. 重檐歇山顶", "C. 单檐歇山顶", "D. 单檐庑殿顶"], "answer": "C", "explain": "乾清门为单檐歇山顶，面阔5间、进深3间，高约16米。", "source": "乾清门屋顶形制：单檐歇山顶。面阔 5 间、进深 3 间，高约 16 米……"}, {"section": "故宫（紫禁城）", "type": "judge", "q": "“明窗开笔”仪式于每年正月初一（元旦）子时（零时）在养心殿东暖阁举行。", "answer": "对", "explain": "皇帝用“金瓯永固杯”饮屠苏酒，点燃“玉烛长调”烛台，以“万年青笔”书写新年吉语，并翻阅当年历书；此制自雍正时期起。", "source": "养心殿东暖阁。每年正月初一（元旦）子时（零时），皇帝在此举行“明窗开笔”仪式"}, {"section": "故宫（紫禁城）", "type": "multi", "q": "清代曾在坤宁宫东暖阁行合卺礼（皇帝大婚洞房）的有（ ）。", "options": ["A. 康熙帝", "B. 雍正帝", "C. 同治帝", "D. 光绪帝", "E. 溥仪"], "answer": "ACDE", "explain": "康熙、同治、光绪三帝大婚及溥仪结婚均在坤宁宫东暖阁行合卺礼；雍正以后皇后不再居此，坤宁宫实为专供祭神之所。", "source": "东暖阁（东两间）为皇帝大婚的洞房（康熙、同治、光绪三帝大婚，溥仪结婚均在此行合卺礼）"}, {"section": "故宫（紫禁城）", "type": "single", "q": "清廷因西北用兵设'军机房'（军机处前身）的时间是（ ）。", "options": ["A. 康熙十九年（1680年）", "B. 雍正七年（1729年）", "C. 雍正十年（1732年）", "D. 乾隆五十四年（1789年）"], "answer": "B", "explain": "雍正七年（1729年）因西北用兵设'军机房'，雍正十年改称'办理军机处'。", "source": "雍正七年（1729 年）因西北用兵设'军机房'，雍正十年改称'办理军机处'，简称军机处。"}, {"section": "故宫（紫禁城）", "type": "judge", "q": "慈禧太后通过三次垂帘（同治、光绪两朝）操纵朝政达38年。", "answer": "错", "explain": "年数错误。慈禧通过三次垂帘操纵朝政达48年，非38年。", "source": "慈禧通过三次垂帘（同治、光绪两朝）操纵朝政达 48 年。"}, {"section": "故宫（紫禁城）", "type": "single", "q": "明朝'壬寅宫变'发生的地点是（ ）。", "options": ["A. 乾清宫", "B. 坤宁宫", "C. 养心殿", "D. 咸安宫"], "answer": "A", "explain": "明嘉靖二十一年（1542年，壬寅年），以杨金英为首的宫女谋刺嘉靖帝，事发地点即在乾清宫。", "source": "乾清宫。明嘉靖二十一年（1542 年，壬寅年），以杨金英为首的宫女谋刺嘉靖帝，事发地点即在乾清宫。"}, {"section": "故宫（紫禁城）", "type": "judge", "q": "紫禁城宁寿宫区皇极殿是仿照太和殿的建筑形制修建的。", "answer": "错", "explain": "皇极殿仿照乾清宫的建筑形制修建；宁寿门仿乾清门，养性殿仿养心殿。", "source": "紫禁城皇极殿是仿照哪座宫殿修建的：仿照乾清宫的建筑形制。"}, {"section": "故宫（紫禁城）", "type": "multi", "q": "下列养心殿匾额与题写者对应正确的有（ ）。", "options": ["A. “中正仁和”匾——雍正帝", "B. “勤政亲贤”匾——雍正帝", "C. “三希堂”匾——乾隆帝", "D. “无为”匾——康熙帝", "E. “随安室”匾——光绪帝（清末重书）"], "answer": "ABCE", "explain": "D错误：“无为”匾悬于交泰殿（康熙帝原题、乾隆恭摹），并非养心殿匾额；西暖阁另有“惟以一人治天下，岂为天下奉一人”对联。", "source": "“中正仁和”匾——雍正帝御笔……“勤政亲贤”匾——雍正帝御笔……“三希堂”匾——乾隆帝题……（东暖阁清末悬光绪重书“随安室”匾等。）"}, {"section": "故宫（紫禁城）", "type": "single", "q": "清代皇子皇孙上学读书的地点是（ ）。", "options": ["A. 上书房", "B. 懋勤殿", "C. 文渊阁", "D. 传心殿"], "answer": "A", "explain": "上书房位于乾清门内东侧、乾清宫东庑，皇子皇孙在此读书，由翰林任师傅；懋勤殿是康熙帝幼年读书处。", "source": "上书房，位于乾清门内东侧、乾清宫周围的庑房（乾清宫东庑）。皇子皇孙在此读书，由翰林任师傅。"}, {"section": "故宫（紫禁城）", "type": "judge", "q": "关于紫禁城的设计者，通行说法为蒯祥（字廷瑞，苏州人，明代'蒯鲁班'）。", "answer": "对", "explain": "与原文一致：通行说法为蒯祥；考试按教材通说答'以南京故宫为蓝本、设计者蒯祥'即可。", "source": "关于设计者：通行说法为蒯祥（字廷瑞，苏州人，明代'蒯鲁班'）……考试按教材通说答'以南京故宫为蓝本、设计者蒯祥'即可。"}, {"section": "故宫（紫禁城）", "type": "single", "q": "康熙帝幼年曾在（ ）读书。", "options": ["A. 乾清宫东庑上书房", "B. 乾清宫西庑懋勤殿", "C. 武英殿", "D. 南薰殿"], "answer": "B", "explain": "康熙帝幼年曾读书于乾清宫西庑的懋勤殿；上书房在乾清宫东庑，是皇子皇孙读书处。", "source": "康熙帝幼年亦曾读书于乾清宫西庑的懋勤殿。"}, {"section": "故宫（紫禁城）", "type": "judge", "q": "明朝入主紫禁城的皇帝共有16位。", "answer": "错", "explain": "明朝入主紫禁城的皇帝数量为14位，题干'16位'错误。", "source": "明朝入主紫禁城的皇帝数量：14 位。"}, {"section": "故宫（紫禁城）", "type": "multi", "q": "下列属于“明窗开笔”仪式内容的有（ ）。", "options": ["A. 用“金瓯永固杯”饮屠苏酒", "B. 点燃“玉烛长调”烛台", "C. 以“万年青笔”书写新年吉语", "D. 翻阅当年历书", "E. 在太和殿接受百官朝贺"], "answer": "ABCD", "explain": "仪式在养心殿东暖阁举行，祈愿风调雨顺、国泰民安；E为太和殿三大节朝贺内容，与明窗开笔无关。", "source": "用“金瓯永固杯”饮屠苏酒，点燃“玉烛长调”烛台，以“万年青笔”书写新年吉语，并翻阅当年历书，祈愿风调雨顺、国泰民安。"}, {"section": "故宫（紫禁城）", "type": "single", "q": "交泰殿位于（ ）。", "options": ["A. 太和殿与中和殿之间", "B. 乾清宫与坤宁宫之间", "C. 坤宁宫与御花园之间", "D. 乾清门与乾清宫之间"], "answer": "B", "explain": "交泰殿位于乾清宫与坤宁宫之间，为内廷后三宫之一。", "source": "位置：位于乾清宫与坤宁宫之间，为内廷后三宫之一。"}, {"section": "故宫（紫禁城）", "type": "judge", "q": "宝蕴楼是1914年在紫禁城咸安宫原址上修建的建筑。", "answer": "对", "explain": "与原文一致：1914年在紫禁城咸安宫原址上修建宝蕴楼。", "source": "1914 年在紫禁城咸安宫原址上修建的建筑：宝蕴楼。"}, {"section": "故宫（紫禁城）", "type": "single", "q": "御花园钦安殿始建于（ ）。", "options": ["A. 明永乐四年（1406年）", "B. 明永乐十八年（1420年）", "C. 明嘉靖十四年（1535年）", "D. 明嘉靖十五年（1536年）"], "answer": "B", "explain": "钦安殿始建于明永乐十八年（1420年）；嘉靖十四年（1535年）添建墙垣自成院落。", "source": "始建于明永乐十八年（1420 年），嘉靖十四年（1535 年）添建墙垣自成院落"}, {"section": "故宫（紫禁城）", "type": "judge", "q": "明代'御门听政'在奉天门（今太和门）举行，文武官员每天拂晓到此早朝。", "answer": "对", "explain": "与原文一致：明代在奉天门（后皇极门，今太和门），文武官员每天拂晓到此早朝。", "source": "明代：在奉天门（后皇极门，今太和门），文武官员每天拂晓到此早朝，皇帝亲自接受朝拜、处理政事。"}, {"section": "故宫（紫禁城）", "type": "multi", "q": "三希堂因内府收藏三件晋人法帖稀世之宝而得名，这三件东晋书法作品是（ ）。", "options": ["A. 王羲之《快雪时晴帖》", "B. 王献之《中秋帖》", "C. 王珣《伯远帖》", "D. 王珣《中秋帖》", "E. 王献之《伯远帖》"], "answer": "ABC", "explain": "三件法帖为王羲之《快雪时晴帖》、王献之《中秋帖》、王珣《伯远帖》；D、E作者与作品张冠李戴。", "source": "王羲之《快雪时晴帖》、王献之《中秋帖》、王珣《伯远帖》。"}, {"section": "故宫（紫禁城）", "type": "single", "q": "御花园钦安殿的殿顶形制为（ ）。", "options": ["A. 单檐歇山顶", "B. 重檐盝顶", "C. 重檐庑殿顶", "D. 圆形攒尖顶"], "answer": "B", "explain": "钦安殿殿顶为重檐盝顶；单檐歇山顶是乾清门的屋顶形制。", "source": "殿顶为重檐盝顶。"}, {"section": "故宫（紫禁城）", "type": "judge", "q": "太和殿是明清皇帝日常办公、处理政务的场所。", "answer": "错", "explain": "太和殿是举行国家重大典礼的场所，并非日常办公地。", "source": "太和殿俗称'金銮殿'，是举行国家重大典礼的场所，并非日常办公地。"}, {"section": "故宫（紫禁城）", "type": "single", "q": "乾隆时期，珍藏于御花园摛藻堂内的古籍是（ ）。", "options": ["A. 《四库全书》", "B. 《四库全书荟要》", "C. 《三希堂记》", "D. 《交泰殿铭》"], "answer": "B", "explain": "乾隆时期摛藻堂内珍藏《四库全书荟要》。", "source": "乾隆时期，珍藏于御花园摛藻堂内的古籍：《四库全书荟要》。"}, {"section": "故宫（紫禁城）", "type": "judge", "q": "太和殿前嘉量由斛、斗、升、合、龠五种容量单位构成。", "answer": "对", "explain": "与原文一致：嘉量由斛、斗、升、合、龠五种容量单位构成。", "source": "由斛、斗、升、合、龠五种容量单位构成：正中圆柱体上部为斛、下部为斗；左耳为升；右耳上截为合、下截为龠。"}, {"section": "故宫（紫禁城）", "type": "multi", "q": "下列宫殿中属于紫禁城东六宫的有（ ）。", "options": ["A. 景仁宫", "B. 承乾宫", "C. 永寿宫", "D. 延禧宫", "E. 储秀宫"], "answer": "ABD", "explain": "东六宫为景仁宫、承乾宫、钟粹宫、景阳宫、永和宫、延禧宫；永寿宫、储秀宫属西六宫。东西六宫均为后妃居所，建于明永乐十八年（1420年）。", "source": "东六宫（中轴线东侧）：景仁宫、承乾宫、钟粹宫、景阳宫、永和宫、延禧宫。西六宫（中轴线西侧）：永寿宫、翊坤宫、储秀宫、咸福宫、长春宫、太极殿。"}, {"section": "故宫（紫禁城）", "type": "single", "q": "绛雪轩位于御花园（ ），座东面西。", "options": ["A. 东南", "B. 东北", "C. 西南", "D. 西北"], "answer": "A", "explain": "绛雪轩位于御花园东南，座东面西，因轩前海棠花落色白如雪而得名。", "source": "绛雪轩位于御花园东南，座东面西。"}, {"section": "故宫（紫禁城）", "type": "judge", "q": "冬季为防止太平缸内贮水结冰，缸外套棉套、下设炭火（'熟火处'）。", "answer": "对", "explain": "与原文一致：冬季缸外套棉套、下设炭火（'熟火处'）防冻。", "source": "冬季缸外套棉套、下设炭火（'熟火处'）防冻。"}, {"section": "故宫（紫禁城）", "type": "single", "q": "御花园堆秀山拆观花殿后叠石为山的时间是（ ）。", "options": ["A. 明永乐十八年（1420年）", "B. 明嘉靖十四年（1535年）", "C. 明万历十一年（1583年）", "D. 清乾隆三十九年（1774年）"], "answer": "C", "explain": "堆秀山位于钦安殿东北，明万历十一年（1583年）拆观花殿后叠石为山，券门石匾曰“堆秀”。", "source": "堆秀山位于钦安殿东北，明万历十一年（1583 年）拆观花殿后叠石为山，券门石匾曰“堆秀”"}, {"section": "故宫（紫禁城）", "type": "judge", "q": "中和殿'中和'一词的思想依据出自《孟子》。", "answer": "错", "explain": "'中和'出自《礼记·中庸》，题干'《孟子》'错误。", "source": "出自《礼记·中庸》：'中也者，天下之大本也；和也者，天下之达道也。'"}, {"section": "故宫（紫禁城）", "type": "multi", "q": "畅音阁是故宫现存规模最大的戏台，其三层自上而下依次为（ ）。", "options": ["A. 福台", "B. 禄台", "C. 寿台", "D. 喜台", "E. 仙台"], "answer": "ABC", "explain": "畅音阁位于宁寿宫区东路，共3层，上为“福台”、中为“禄台”、下为“寿台”；楼北为帝后看戏的阅是楼，楼南为后台扮戏楼。", "source": "共 3 层（上为“福台”、中为“禄台”、下为“寿台”），每层之间有楼梯相通；楼北为帝后看戏的阅是楼，楼南为后台扮戏楼。"}, {"section": "故宫（紫禁城）", "type": "single", "q": "御花园堆秀山上亭子的名称是（ ）。", "options": ["A. 御景亭", "B. 江山社稷亭", "C. 天一阁", "D. 阅是楼"], "answer": "A", "explain": "堆秀山上建亭名“御景亭”；江山社稷亭为乾清宫前铜鎏金小殿，阅是楼为畅音阁北帝后看戏之处。", "source": "山上建亭，名“御景亭”。"}, {"section": "故宫（紫禁城）", "type": "judge", "q": "皇帝举行祭祀先农活动的前一日，在保和殿阅视祝版。", "answer": "错", "explain": "阅视祝版的地点是中和殿，题干'保和殿'错误。", "source": "皇帝在举行祭祀先农活动的前一日，阅视祝版的地点：中和殿。"}, {"section": "故宫（紫禁城）", "type": "single", "q": "驾崩于御花园钦安殿的明仁宗朱高炽（年号洪熙），在位时间约为（ ）。", "options": ["A. 8个月", "B. 1年", "C. 10年", "D. 20年"], "answer": "A", "explain": "朱高炽永乐二十二年（1424年）八月即位，洪熙元年（1425年）五月十二日猝死于钦安殿，在位仅约8个月，葬十三陵献陵。", "source": "永乐二十二年（1424 年）八月即位，洪熙元年（1425 年）五月十二日猝死于钦安殿（葬于十三陵献陵），在位仅约 8 个月。"}, {"section": "故宫（紫禁城）", "type": "judge", "q": "清兵入关之初，摄政王多尔衮以文华殿作为处理政务之所。", "answer": "错", "explain": "多尔衮处理政务的地点是武英殿，题干'文华殿'错误。", "source": "武英殿。清兵入关之初，摄政王多尔衮先行抵京，以武英殿作为理事（处理政务）之所。"}, {"section": "故宫（紫禁城）", "type": "multi", "q": "下列关于宁寿宫区建筑仿建对应关系的说法，正确的有（ ）。", "options": ["A. 皇极殿仿乾清宫", "B. 宁寿宫形制同坤宁宫", "C. 宁寿门仿乾清门", "D. 养性殿仿养心殿", "E. 皇极殿仿太和殿"], "answer": "ABCD", "explain": "E错误：皇极殿仿乾清宫而非太和殿。皇极殿为太上皇临朝受贺之处，嘉庆元年（1796年）太上皇乾隆曾在此举行千叟宴。", "source": "仿照乾清宫的建筑形制……其北的宁寿宫则形制同坤宁宫……宁寿门仿乾清门，养性殿仿养心殿。嘉庆元年（1796 年）太上皇乾隆曾在此举行千叟宴。"}, {"section": "故宫（紫禁城）", "type": "single", "q": "养心殿西暖阁内又隔出的小室是（ ）。", "options": ["A. 梅坞", "B. 三希堂", "C. 体顺堂", "D. 燕喜堂"], "answer": "B", "explain": "西暖阁为皇帝批阅奏折、召见大臣之所，其内又隔出三希堂；梅坞在养心殿西侧，体顺堂、燕喜堂在后殿。", "source": "西暖阁：皇帝批阅奏折、召见大臣之所，其内又隔出三希堂"}, {"section": "故宫（紫禁城）", "type": "judge", "q": "军机处位于乾清门内东侧，其西侧对称位置为九卿值房。", "answer": "错", "explain": "军机处位于乾清门内西侧、隆宗门内北侧；乾清门东侧对称位置为九卿值房，题干东西颠倒。", "source": "位于乾清门内西侧、隆宗门内北侧……乾清门东侧对称位置为九卿值房。"}, {"section": "故宫（紫禁城）", "type": "single", "q": "养心殿后殿中，贵妃居住的场所是（ ）。", "options": ["A. 体顺堂", "B. 燕喜堂", "C. 梅坞", "D. 随安室"], "answer": "B", "explain": "后殿为皇帝寝宫，东为皇后居“体顺堂”，西为贵妃居“燕喜堂”；“梅坞”在养心殿西侧，为乾隆三十九年添建。", "source": "后殿：皇帝寝宫（东为皇后居“体顺堂／体顺房”，西为贵妃居“燕喜堂”）；西侧另有“梅坞”（乾隆三十九年添建）。"}, {"section": "故宫（紫禁城）", "type": "judge", "q": "紫禁城文渊阁是仿照浙江宁波范氏天一阁修建的。", "answer": "对", "explain": "与原文一致：文渊阁仿照浙江宁波范氏天一阁修建。", "source": "紫禁城文渊阁是仿照哪座建筑修建的：仿照浙江宁波范氏天一阁修建。"}, {"section": "故宫（紫禁城）", "type": "multi", "q": "据《明史》记载，紫禁城初建后，与南京明故宫一致的布局包括（ ）。", "options": ["A. 中轴线上的奉天、华盖、谨身三殿", "B. 文华、武英两殿", "C. 东西六宫", "D. 乾清宫、坤宁宫"], "answer": "ABC", "explain": "原文：中轴线上的奉天、华盖、谨身三殿，文华、武英两殿，东西六宫等布局均与南京明故宫一致；未提及乾清宫、坤宁宫。", "source": "中轴线上的奉天、华盖、谨身三殿，文华、武英两殿，东西六宫等布局均与南京明故宫一致。"}, {"section": "故宫（紫禁城）", "type": "single", "q": "养心殿的名称出自（ ）。", "options": ["A. 《论语》", "B. 《孟子》", "C. 《礼记》", "D. 《周易》"], "answer": "B", "explain": "出自《孟子·尽心下》“养心莫善于寡欲”，寄托帝王培养本心、克制欲望的愿望。", "source": "出自《孟子·尽心下》：“养心莫善于寡欲。”"}, {"section": "故宫（紫禁城）", "type": "judge", "q": "清代上书房设于乾清宫东庑，皇子皇孙在此读书，由翰林任师傅。", "answer": "对", "explain": "上书房位于乾清门内东侧、乾清宫周围的庑房（乾清宫东庑），是清代皇子皇孙读书之处。", "source": "上书房，位于乾清门内东侧、乾清宫周围的庑房（乾清宫东庑）。皇子皇孙在此读书，由翰林任师傅。"}, {"section": "故宫（紫禁城）", "type": "single", "q": "雍正帝移居养心殿守孝的时间是（ ）。", "options": ["A. 康熙六十一年（1722年）", "B. 雍正元年（1723年）", "C. 康熙五十二年（1713年）", "D. 乾隆元年（1736年）"], "answer": "A", "explain": "雍正帝以乾清宫为“皇考六十余年所御”、居之心有不忍，于康熙六十一年（1722年）移居养心殿守孝，此后未再回乾清宫。", "source": "于康熙六十一年（1722 年）移居养心殿守孝，此后未再回乾清宫。"}, {"section": "故宫（紫禁城）", "type": "judge", "q": "钦安殿于明嘉靖十四年添建墙垣自成院落，其南为天一门，取“天一生水”之意以镇火。", "answer": "对", "explain": "钦安殿始建于明永乐十八年（1420年），嘉靖十四年（1535年）添建墙垣自成院落，南为天一门。", "source": "始建于明永乐十八年（1420 年），嘉靖十四年（1535 年）添建墙垣自成院落（南为天一门，取“天一生水”之意以镇火）。"}, {"section": "故宫（紫禁城）", "type": "multi", "q": "清顺治二年（1645年）改名后，紫禁城前朝的建筑名称包括（ ）。", "options": ["A. 太和殿", "B. 中和殿", "C. 保和殿", "D. 太和门"], "answer": "ABCD", "explain": "清顺治二年改名：皇极殿改太和殿、中极殿改中和殿、建极殿改保和殿、皇极门改太和门。", "source": "太和殿/中和殿/保和殿/太和门：清顺治二年（1645）改名。"}, {"section": "故宫（紫禁城）", "type": "single", "q": "养心殿明间（正殿）“中正仁和”匾的题写者是（ ）。", "options": ["A. 康熙帝", "B. 雍正帝", "C. 乾隆帝", "D. 光绪帝"], "answer": "B", "explain": "“中正仁和”匾为雍正帝御笔，“中正”取义《周易》履卦“刚中正，履帝位而不疚，光明也”。", "source": "明间（正殿）：“中正仁和”匾——雍正帝御笔。"}, {"section": "故宫（紫禁城）", "type": "judge", "q": "乾隆时期，珍藏于御花园摛藻堂内的古籍是《四库全书》。", "answer": "错", "explain": "应为《四库全书荟要》，而非《四库全书》。", "source": "乾隆时期，珍藏于御花园摛藻堂内的古籍：《四库全书荟要》。"}, {"section": "故宫（紫禁城）", "type": "single", "q": "养心殿大修后重新向公众开放的时间是（ ）。", "options": ["A. 2025年10月10日", "B. 2025年12月26日", "C. 2024年12月26日", "D. 1925年10月10日"], "answer": "B", "explain": "养心殿大修后于2025年12月26日重新向公众开放；1925年10月10日为故宫博物院成立日。", "source": "养心殿大修后重新开放的时间：2025 年 12 月 26 日重新向公众开放。"}, {"section": "故宫（紫禁城）", "type": "judge", "q": "绛雪轩位于御花园东南，座西面东。", "answer": "错", "explain": "朝向错误。绛雪轩座东面西，并非座西面东。", "source": "绛雪轩位于御花园东南，座东面西。"}, {"section": "故宫（紫禁城）", "type": "multi", "q": "太和殿檐角安放的走兽包括（ ）。", "options": ["A. 龙", "B. 凤", "C. 天马", "D. 行什", "E. 麒麟"], "answer": "ABCD", "explain": "太和殿檐角10个走兽为龙、凤、狮子、天马、海马、狻猊、押鱼、獬豸、斗牛、行什，不含麒麟。", "source": "太和殿檐角安放 10 个走兽，龙、凤、狮子、天马、海马、狻猊、押鱼、獬豸、斗牛、行什。"}, {"section": "故宫（紫禁城）", "type": "single", "q": "三希堂原为乾隆皇帝的书房，其初名为（ ）。", "options": ["A. 温室", "B. 随安室", "C. 梅坞", "D. 燕喜堂"], "answer": "A", "explain": "三希堂位于养心殿西暖阁内，是西暖阁南侧隔出的一间小室，初名“温室”；“随安室”为东暖阁清末光绪重书之匾。", "source": "位于养心殿西暖阁内，是西暖阁南侧隔出的一间小室，原为乾隆皇帝的书房，初名“温室”。"}, {"section": "故宫（紫禁城）", "type": "judge", "q": "御花园堆秀山位于钦安殿东南，山上建有御景亭。", "answer": "错", "explain": "方位错误。堆秀山位于钦安殿东北，明万历十一年拆观花殿后叠石为山，山上亭名“御景亭”。", "source": "堆秀山位于钦安殿东北，明万历十一年（1583 年）拆观花殿后叠石为山，券门石匾曰“堆秀”，山上建亭，名“御景亭”。"}, {"section": "故宫（紫禁城）", "type": "single", "q": "乾隆解释“三希堂”名称所含“修身进取”之意，化用了“士希贤，贤希圣，圣希天”一句，此句出自（ ）。", "options": ["A. 宋·周敦颐《通书·志学》", "B. 《孟子·尽心下》", "C. 《礼记·中庸》", "D. 《周易》履卦"], "answer": "A", "explain": "乾隆化用宋周敦颐《通书·志学》“士希贤，贤希圣，圣希天”，以此自期勤勉不息。", "source": "化用宋周敦颐《通书·志学》“士希贤，贤希圣，圣希天”，表示士人希望成为贤人、贤人希望成为圣人、圣人希望成为知天之人"}, {"section": "故宫（紫禁城）", "type": "judge", "q": "养心殿之名出自《论语》，意为修养心性的最好办法是减少欲望。", "answer": "错", "explain": "出处错误。养心殿名出自《孟子·尽心下》“养心莫善于寡欲”，非《论语》。", "source": "出自《孟子·尽心下》：“养心莫善于寡欲。”意为修养心性的最好办法是减少欲望。"}, {"section": "故宫（紫禁城）", "type": "multi", "q": "下列建筑中，属于前朝西路武英殿组群的有（ ）。", "options": ["A. 断虹桥", "B. 浴德堂", "C. 南薰殿", "D. 传心殿"], "answer": "ABC", "explain": "西路武英殿组群含武英门、武英殿、浴德堂、断虹桥、南薰殿等；传心殿属东路文华殿组群。", "source": "西路——武英殿组群：武英门、武英殿、敬思殿、凝道殿、焕章殿、恒寿斋、浴德堂、断虹桥……南薰殿……"}, {"section": "故宫（紫禁城）", "type": "single", "q": "作为“垂帘听政”制度化的称谓，一般通说最早出现于（ ）。", "options": ["A. 战国时期", "B. 唐初", "C. 北宋初年", "D. 明代初年"], "answer": "B", "explain": "《旧唐书·高宗纪》载显庆五年（660年）唐高宗因风疾不能理政，武则天垂帘于御座后，为史书首见“垂帘”二字；虽有学者上溯至战国秦宣太后（前307年摄政），但制度化称谓一般从唐代算起。", "source": "通说起于唐初（唐高宗显庆年间）。《旧唐书·高宗纪》载：唐高宗显庆五年（660 年）起因风疾不能理政……此为史书首见“垂帘”二字。"}, {"section": "故宫（紫禁城）", "type": "judge", "q": "三希堂因收藏王羲之《快雪时晴帖》、王献之《中秋帖》、王珣《伯远帖》三件东晋法帖而得名。", "answer": "对", "explain": "三件晋人法帖稀世之宝贮藏于此，故名“三希堂”，乾隆并撰《三希堂记》阐释其意。", "source": "王羲之《快雪时晴帖》、王献之《中秋帖》、王珣《伯远帖》。"}, {"section": "故宫（紫禁城）", "type": "single", "q": "慈安、慈禧两宫皇太后携幼帝载淳于养心殿东暖阁正式垂帘听政，始于（ ）。", "options": ["A. 咸丰十年（1860年）", "B. 咸丰十一年（1861年）", "C. 同治元年（1862年）", "D. 光绪元年（1875年）"], "answer": "B", "explain": "咸丰十一年（1861年）辛酉政变后，十一月初一日两宫皇太后携幼帝载淳（同治）于养心殿东暖阁正式垂帘听政，中隔八扇黄屏风，并制定《垂帘章程》。", "source": "咸丰十一年（1861 年）辛酉政变后，咸丰十一年十一月初一日，慈安、慈禧两宫皇太后携幼帝载淳（同治）于养心殿东暖阁正式垂帘听政"}, {"section": "故宫（紫禁城）", "type": "judge", "q": "作为“垂帘听政”制度化的称谓，一般从战国时期秦国宣太后算起。", "answer": "错", "explain": "虽有学者上溯至战国秦宣太后（前307年摄政），但作为制度化称谓一般从唐代算起，《旧唐书·高宗纪》首见“垂帘”二字。", "source": "但作为“垂帘听政”制度化的称谓，一般从唐代算起。"}, {"section": "故宫（紫禁城）", "type": "multi", "q": "明清两代，皇帝在太和殿接受文武百官朝贺并向王公大臣赐宴的'三大节'包括（ ）。", "options": ["A. 万寿节", "B. 元旦", "C. 冬至", "D. 上元节"], "answer": "ABC", "explain": "三大节为万寿节（皇帝生日）、元旦、冬至；无上元节。", "source": "每年万寿节（皇帝生日）、元旦、冬至三大节皇帝在此接受文武百官朝贺并向王公大臣赐宴。"}, {"section": "故宫（紫禁城）", "type": "single", "q": "顺治皇帝因患天花（痘症）病逝于（ ）。", "options": ["A. 乾清宫", "B. 养心殿", "C. 武英殿", "D. 慈宁宫"], "answer": "B", "explain": "顺治十八年（1661年）顺治帝因患天花病逝于养心殿，年仅24岁。", "source": "顺治十八年（1661 年）顺治帝因患天花（痘症）病逝于养心殿，年仅 24 岁。"}, {"section": "故宫（紫禁城）", "type": "judge", "q": "紫禁城西六宫包括永寿宫、翊坤宫、储秀宫、咸福宫、长春宫、太极殿。", "answer": "对", "explain": "西六宫位于中轴线西侧，均为后妃居所，建于明永乐十八年（1420年）。", "source": "西六宫（中轴线西侧）：永寿宫、翊坤宫、储秀宫、咸福宫、长春宫、太极殿。"}, {"section": "故宫（紫禁城）", "type": "single", "q": "慈禧太后在紫禁城中庆祝五十大寿的地点是（ ）。", "options": ["A. 储秀宫", "B. 长春宫", "C. 翊坤宫", "D. 永寿宫"], "answer": "A", "explain": "光绪十年（1884年）为庆祝慈禧五十寿辰，耗银63万两整修储秀宫，并将翊坤宫后殿改为穿堂殿“体和殿”，使储秀宫与翊坤宫连通为四进院落。", "source": "光绪十年（1884 年）为庆祝慈禧五十寿辰，耗银 63 万两对储秀宫进行大规模整修……慈禧在五十寿辰时移居储秀宫并在此接受祝寿。"}, {"section": "故宫（紫禁城）", "type": "judge", "q": "顺治帝因患天花（痘症）病逝于乾清宫，年仅24岁。", "answer": "错", "explain": "地点错误。顺治十八年（1661年）顺治帝病逝于养心殿，非乾清宫。", "source": "顺治十八年（1661 年）顺治帝因患天花（痘症）病逝于养心殿，年仅 24 岁。"}, {"section": "故宫（紫禁城）", "type": "multi", "q": "下列关于乾清门的说法，正确的有（ ）。", "options": ["A. 屋顶形制为单檐歇山顶", "B. 面阔5间、进深3间", "C. 坐落在1.5米高的汉白玉须弥座上", "D. 门前有铜鎏金狮一对"], "answer": "ABCD", "explain": "四项均与原文一致：单檐歇山顶，面阔5间、进深3间，坐落在1.5米高汉白玉须弥座上，门前有铜鎏金狮一对、八字形琉璃影壁。", "source": "单檐歇山顶。面阔 5 间、进深 3 间，高约 16 米，坐落在 1.5 米高的汉白玉须弥座上……门前有铜鎏金狮一对、八字形琉璃影壁。"}, {"section": "故宫（紫禁城）", "type": "single", "q": "外西路慈宁宫在仁寿宫故址上拆大善殿建成的时间是（ ）。", "options": ["A. 明永乐十八年（1420年）", "B. 明嘉靖十五年（1536年）", "C. 明万历十一年（1583年）", "D. 清顺治十二年（1655年）"], "answer": "B", "explain": "慈宁宫俗称“太后宫”，位于内廷外西路、隆宗门以西，明嘉靖十五年（1536年）建成，清代孝庄文皇后曾居此至去世。", "source": "明嘉靖十五年（1536 年）在仁寿宫故址上拆大善殿建成，为皇太后的正宫"}, {"section": "故宫（紫禁城）", "type": "judge", "q": "光绪十年为庆祝慈禧五十寿辰，耗银63万两对储秀宫进行大规模整修。", "answer": "对", "explain": "同时将翊坤宫后殿改为穿堂殿“体和殿”，使储秀宫与翊坤宫连通为四进院落。", "source": "光绪十年（1884 年）为庆祝慈禧五十寿辰，耗银 63 万两对储秀宫进行大规模整修。"}, {"section": "故宫（紫禁城）", "type": "single", "q": "紫禁城自1406年下诏营建至1420年建成，前后共计（ ）。", "options": ["A. 10年", "B. 12年", "C. 14年", "D. 16年"], "answer": "C", "explain": "自1406年下诏至1420年建成，前后共计14年。", "source": "建造时长：自 1406 年下诏至 1420 年建成，前后共计 14 年。"}, {"section": "故宫（紫禁城）", "type": "judge", "q": "雍正帝于康熙六十一年（1722年）移居养心殿守孝，此后再未回乾清宫居住。", "answer": "对", "explain": "雍正帝以乾清宫为“皇考六十余年所御”、居之心有不忍，遂移居养心殿守孝，此后未再回乾清宫。", "source": "于康熙六十一年（1722 年）移居养心殿守孝，此后未再回乾清宫。"}, {"section": "故宫（紫禁城）", "type": "multi", "q": "清代在乾清宫举行的千叟宴有（ ）。", "options": ["A. 康熙五十二年（1713年）", "B. 康熙六十一年（1722年）", "C. 乾隆五十年（1785年）", "D. 嘉庆元年（1796年）"], "answer": "BC", "explain": "康熙六十一年正月、乾隆五十年正月两次在乾清宫举行；康熙五十二年在畅春园，嘉庆元年在宁寿宫皇极殿。", "source": "康熙六十一年（1722 年）正月——乾清宫；乾隆五十年（1785 年）正月——乾清宫（与宴者 3000 余人，设席 800 桌）。"}, {"section": "故宫（紫禁城）", "type": "single", "q": "溥仪被驱逐出紫禁城的时间是（ ）。", "options": ["A. 1912年2月12日", "B. 1924年11月5日", "C. 1925年10月10日", "D. 1914年11月5日"], "answer": "B", "explain": "1924年11月5日，冯玉祥发动'北京政变'后，由鹿钟麟执行，将溥仪驱逐出宫。", "source": "1924 年 11 月 5 日。冯玉祥发动'北京政变'后……由鹿钟麟执行，将溥仪驱逐出宫。"}, {"section": "故宫（紫禁城）", "type": "single", "q": "故宫博物院成立的时间是（ ）。", "options": ["A. 1924年11月5日", "B. 1925年10月10日", "C. 1914年10月10日", "D. 1925年1月1日"], "answer": "B", "explain": "故宫博物院成立于1925年10月10日。", "source": "故宫博物院成立的时间：1925 年 10 月 10 日"}, {"section": "故宫（紫禁城）", "type": "multi", "q": "下列关于紫禁城珍宝馆现存大玉雕的说法，正确的有（ ）。", "options": ["A. 包括《大禹治水图》玉山", "B. 包括《会昌九老图》玉山", "C. 最大的一件为《秋山行旅图》玉山", "D. 最大的一件为新疆和田青玉，世称'玉器之王'"], "answer": "ABD", "explain": "三件大玉雕为《大禹治水图》《会昌九老图》《秋山行旅图》玉山；最大的一件是《大禹治水图》玉山，为新疆和田青玉，世称'玉器之王'，故C错误。", "source": "《大禹治水图》玉山、《会昌九老图》玉山、《秋山行旅图》玉山。最大的一件：《大禹治水图》玉山——为新疆和田（密勒塔山）青玉，是世界上最大的和田玉雕，世称'玉器之王'。"}, {"section": "故宫（紫禁城）", "type": "single", "q": "清代颁朔礼的举行地点在（ ）。", "options": ["A. 太和门", "B. 午门", "C. 乾清门", "D. 奉天门"], "answer": "B", "explain": "明清颁朔礼均在每年农历十月初一举行；明在太和门（奉天门／皇极门），清在午门。", "source": "每年农历十月初一（明清同）；明在太和门（奉天门／皇极门），清在午门。"}, {"section": "故宫（紫禁城）", "type": "single", "q": "明初的谨身殿，即今天故宫前朝三大殿中的（ ）。", "options": ["A. 太和殿", "B. 中和殿", "C. 保和殿", "D. 文华殿"], "answer": "C", "explain": "保和殿名称演变：明初谨身殿→嘉靖四十一年改建极殿→清顺治二年改保和殿。", "source": "保和殿：明初谨身殿，明嘉靖四十一年（1562）改建极殿，清顺治二年（1645）改保和殿。"}, {"section": "故宫（紫禁城）", "type": "multi", "q": "下列关于御花园钦安殿的说法，正确的有（ ）。", "options": ["A. 是紫禁城中位于中轴线上的唯一道观", "B. 供奉玄天上帝（真武大帝）", "C. 始建于明永乐十八年（1420年）", "D. 殿顶为单檐歇山顶", "E. 嘉靖十四年（1535年）添建墙垣自成院落"], "answer": "ABCE", "explain": "D错误：钦安殿殿顶为重檐盝顶；单檐歇山顶是乾清门的屋顶形制。", "source": "钦安殿是紫禁城中位于中轴线上的唯一道观……始建于明永乐十八年（1420 年），嘉靖十四年（1535 年）添建墙垣自成院落……殿顶为重檐盝顶。"}, {"section": "故宫（紫禁城）", "type": "single", "q": "清代'御门听政'的时间，夏秋为（ ）。", "options": ["A. 辰初（约早7时）", "B. 辰正（约早8时）", "C. 卯正（约早6时）", "D. 巳初（约早9时）"], "answer": "A", "explain": "御门听政时间为夏秋辰初（约早7时）、冬春辰正（约早8时）。", "source": "时间为夏秋辰初（约早 7 时）、冬春辰正（约早 8 时）。"}, {"section": "故宫（紫禁城）", "type": "single", "q": "明清时期在太和殿举行的'金殿传胪'是指（ ）。", "options": ["A. 宣布殿试结果", "B. 皇帝大婚", "C. 命将出征", "D. 册立皇后"], "answer": "A", "explain": "'金殿传胪'即宣布殿试结果，是太和殿举行的重要仪式之一。", "source": "此外还有'金殿传胪'（宣布殿试结果）、为太皇太后／皇太后加徽号。"}, {"section": "故宫（紫禁城）", "type": "multi", "q": "下列关于养心殿的说法，正确的有（ ）。", "options": ["A. 为“工”字形格局，前殿与后殿以穿廊相连", "B. 前殿明间设宝座、屏风，为皇帝理政、小朝会之所", "C. 东暖阁为晚清垂帘听政之处", "D. 后殿西为皇后居“体顺堂”", "E. 大修后于2025年12月26日重新向公众开放"], "answer": "ABCE", "explain": "D错误：后殿东为皇后居“体顺堂”，西为贵妃居“燕喜堂”。", "source": "为“工”字形……前殿（正殿）：……明间设宝座、屏风……东暖阁：……晚清垂帘听政之处；后殿：皇帝寝宫（东为皇后居“体顺堂”，西为贵妃居“燕喜堂”）……2025年12月26日重新向公众开放。"}, {"section": "故宫（紫禁城）", "type": "single", "q": "太和殿前月台上日晷的象征意义是（ ）。", "options": ["A. 度量衡统一、公正平允", "B. 皇权'授时'", "C. 长寿、江山永固", "D. 以水克火"], "answer": "B", "explain": "日晷为古代计时器，象征皇权'授时'；嘉量象征度量衡统一，铜龟铜鹤象征长寿，太平缸寓意以水克火。", "source": "日晷——古代计时器，象征皇权'授时'。"}, {"section": "故宫（紫禁城）", "type": "single", "q": "在保和殿举行殿试始定于（ ）。", "options": ["A. 康熙六年（1667年）", "B. 雍正十年（1732年）", "C. 乾隆五十四年（1789年）", "D. 嘉庆元年（1796年）"], "answer": "C", "explain": "清乾隆五十四年（1789年）始定于保和殿举行殿试，此后成定制。", "source": "清乾隆五十四年（1789 年）始定于保和殿，此后成定制。"}, {"section": "故宫（紫禁城）", "type": "multi", "q": "下列关于三希堂的说法，正确的有（ ）。", "options": ["A. 位于养心殿西暖阁内", "B. 原为乾隆皇帝的书房，初名“温室”", "C. 因内府收藏三件晋人法帖稀世之宝而得名", "D. 雍正帝撰《三希堂记》阐释其意"], "answer": "ABC", "explain": "D错误：撰《三希堂记》者是乾隆帝，非雍正帝。", "source": "位于养心殿西暖阁内……原为乾隆皇帝的书房，初名“温室”……因内府收藏三件晋人法帖稀世之宝，贮藏于此，故名“三希堂”，乾隆并撰《三希堂记》阐释其意。"}, {"section": "故宫（紫禁城）", "type": "single", "q": "康熙八年（1669年），康熙帝曾一度移居武英殿，其原因是（ ）。", "options": ["A. 太和殿、乾清宫维修", "B. 躲避天花疫情", "C. 主持武英殿修书处", "D. 前朝三大殿被焚毁"], "answer": "A", "explain": "康熙八年因太和殿、乾清宫维修，康熙帝曾一度移居武英殿。", "source": "康熙八年（1669 年）因太和殿、乾清宫维修，康熙帝曾一度移居武英殿。"}, {"section": "故宫（紫禁城）", "type": "single", "q": "李自成占领紫禁城后，举行即位仪式的宫殿是（ ）。", "options": ["A. 太和殿", "B. 乾清宫", "C. 武英殿", "D. 文华殿"], "answer": "C", "explain": "李自成在紫禁城中即位的地点是武英殿。", "source": "李自成在紫禁城中即位的地点：武英殿。"}, {"section": "故宫（紫禁城）", "type": "multi", "q": "自雍正起至宣统，曾在养心殿居住并处理日常政务的清帝包括（ ）。", "options": ["A. 雍正帝", "B. 乾隆帝", "C. 康熙帝", "D. 咸丰帝", "E. 宣统帝"], "answer": "ABDE", "explain": "C错误：康熙帝不在其列。八帝为雍正、乾隆、嘉庆、道光、咸丰、同治、光绪、宣统。", "source": "自雍正起至宣统，先后有 8 位清帝（雍正、乾隆、嘉庆、道光、咸丰、同治、光绪、宣统）在此居住并处理日常政务。"}, {"section": "故宫（紫禁城）", "type": "single", "q": "康熙皇帝在紫禁城中禁锢废太子胤礽的地点是（ ）。", "options": ["A. 乾清宫", "B. 咸安宫", "C. 毓庆宫", "D. 上书房"], "answer": "B", "explain": "康熙四十七年九月首次废太子胤礽，将其幽禁于咸安宫；五十一年再度废黜，仍禁锢于咸安宫。", "source": "咸安宫。康熙四十七年（1708 年）九月首次废太子胤礽，将其幽禁于咸安宫……仍禁锢于咸安宫。"}, {"section": "故宫（紫禁城）", "type": "single", "q": "紫禁城后廷（内廷）的起点是（ ）。", "options": ["A. 午门", "B. 太和门", "C. 乾清门", "D. 神武门"], "answer": "C", "explain": "乾清门为紫禁城内廷的正宫门，乾清门以南为前朝（外朝），以北为后廷。", "source": "后廷（内廷）起点：乾清门——乾清门为紫禁城内廷的正宫门，乾清门以南为前朝（外朝），以北为后廷。"}, {"section": "故宫（紫禁城）", "type": "multi", "q": "下列关于咸丰十一年两宫皇太后垂帘听政的说法，正确的有（ ）。", "options": ["A. 在辛酉政变之后开始", "B. 两宫皇太后携幼帝载淳（同治）听政", "C. 两太后宝座设于皇帝宝座之后，中隔八扇黄屏风", "D. 慈禧通过三次垂帘操纵朝政达38年"], "answer": "ABC", "explain": "D错误：慈禧通过三次垂帘（同治、光绪两朝）操纵朝政达48年，非38年；此次垂帘并制定《垂帘章程》。", "source": "咸丰十一年（1861 年）辛酉政变后……携幼帝载淳（同治）于养心殿东暖阁正式垂帘听政，设两太后宝座于皇帝宝座之后，中隔八扇黄屏风（黄纱帘），并制定《垂帘章程》。"}, {"section": "故宫（紫禁城）", "type": "single", "q": "紫禁城军机处位于（ ）。", "options": ["A. 乾清门内西侧、隆宗门内北侧", "B. 乾清门内东侧", "C. 太和门西侧廊房", "D. 午门内东侧"], "answer": "A", "explain": "军机处位于乾清门内西侧、隆宗门内北侧；乾清门东侧对称位置为九卿值房。", "source": "位于乾清门内西侧、隆宗门内北侧（乾清门广场西侧一排低矮窄小的房屋中）。"}, {"section": "故宫（紫禁城）", "type": "single", "q": "乾清宫前露台（月台）上安设的宝鼎（鎏金香炉）共有（ ）。", "options": ["A. 2座", "B. 4座", "C. 10座", "D. 18座"], "answer": "B", "explain": "乾清宫前露台上宝鼎（鎏金香炉）4座；铜鼎18座是太和殿前的陈设。", "source": "露台（月台）上：铜龟、铜鹤各二，日晷、嘉量各一，宝鼎（鎏金香炉）4 座。"}, {"section": "故宫（紫禁城）", "type": "multi", "q": "下列关于御花园绛雪轩的说法，正确的有（ ）。", "options": ["A. 位于御花园东南", "B. 座东面西", "C. 轩前原有海棠树3株", "D. 因海棠花瓣飘落色白如雪而得名", "E. 乾隆有诗“徕春何处归来早，堆秀山前绛雪轩”"], "answer": "ABDE", "explain": "C错误：轩前原有海棠树5株，非3株。", "source": "绛雪轩位于御花园东南，座东面西。轩前原有海棠树 5 株……故名“绛雪轩”（乾隆有诗“徕春何处归来早，堆秀山前绛雪轩”）。"}, {"section": "故宫（紫禁城）", "type": "single", "q": "乾清宫前铜鎏金小殿（江山社稷金殿）的象征意义是（ ）。", "options": ["A. 皇权'授时'", "B. 度量衡统一", "C. 皇帝是江山与土地的唯一占有者和最高统治者", "D. 以水克火、金瓯无缺"], "answer": "C", "explain": "铜质鎏金小殿象征皇帝是江山与土地的唯一占有者和最高统治者。", "source": "台上各安设一座铜质鎏金小殿，象征皇帝是江山与土地的唯一占有者和最高统治者。"}, {"section": "故宫（紫禁城）", "type": "single", "q": "明朝'壬寅宫变'发生于（ ）。", "options": ["A. 明永乐十八年（1420年）", "B. 明嘉靖二十一年（1542年）", "C. 明万历十一年（1583年）", "D. 明洪熙元年（1425年）"], "answer": "B", "explain": "明嘉靖二十一年（1542年，壬寅年），以杨金英为首的宫女谋刺嘉靖帝，事发地点在乾清宫。", "source": "明嘉靖二十一年（1542 年，壬寅年），以杨金英为首的宫女谋刺嘉靖帝，事发地点即在乾清宫。"}, {"section": "故宫（紫禁城）", "type": "multi", "q": "光绪十年（1884年）为庆祝慈禧五十寿辰所采取的举措包括（ ）。", "options": ["A. 耗银63万两对储秀宫进行大规模整修", "B. 将翊坤宫后殿改为穿堂殿“体和殿”", "C. 使储秀宫与翊坤宫连通为四进院落", "D. 慈禧移居长春宫并在此接受祝寿"], "answer": "ABC", "explain": "D错误：慈禧在五十寿辰时移居储秀宫并在此接受祝寿，非长春宫。", "source": "耗银 63 万两对储秀宫进行大规模整修，并将翊坤宫后殿改为穿堂殿“体和殿”，使储秀宫与翊坤宫连通为四进院落；慈禧在五十寿辰时移居储秀宫并在此接受祝寿。"}, {"section": "故宫（紫禁城）", "type": "single", "q": "嘉庆元年（1796年）千叟宴的举办地点是（ ）。", "options": ["A. 乾清宫", "B. 畅春园", "C. 宁寿宫皇极殿", "D. 养心殿"], "answer": "C", "explain": "嘉庆元年（1796年）正月，太上皇乾隆在宁寿宫皇极殿举办千叟宴。", "source": "嘉庆元年（1796 年）正月——宁寿宫皇极殿（太上皇乾隆举办）。"}, {"section": "故宫（紫禁城）", "type": "single", "q": "据故宫博物院研究馆员考证，紫禁城最初的规划者是（ ）。", "options": ["A. 蒯祥", "B. 刘基（刘伯温）", "C. 陈珪", "D. 吴中"], "answer": "B", "explain": "据《明史》《明太宗实录》考证，最初规划者为刘基（刘伯温），总规划师与总负责人为泰宁侯陈珪，吴中参与主持，蒯祥实为'木工首'。", "source": "最初规划者为刘基（刘伯温，南京明故宫的规划者），总规划师与总负责人为泰宁侯陈珪，工部侍郎吴中等参与主持，蒯祥当时实为'木工首'。"}, {"section": "故宫（紫禁城）", "type": "multi", "q": "下列关于慈宁宫的说法，正确的有（ ）。", "options": ["A. 俗称“太后宫”", "B. 位于内廷外西路、隆宗门以西", "C. 明嘉靖十五年在仁寿宫故址上拆大善殿建成", "D. 清代孝庄文皇后曾居此至去世", "E. 宫北有紫禁城现存唯一的太后花园"], "answer": "ABCD", "explain": "E错误：慈宁宫花园在宫南，非宫北，是紫禁城现存唯一的太后花园。", "source": "俗称“太后宫”……位于内廷外西路、隆宗门以西，明嘉靖十五年（1536 年）在仁寿宫故址上拆大善殿建成……清代孝庄文皇后曾居此至去世……宫南有慈宁宫花园（紫禁城现存唯一的太后花园）。"}, {"section": "故宫（紫禁城）", "type": "single", "q": "太和殿区域鎏金太平缸的实际用途是（ ）。", "options": ["A. 陈列装饰", "B. 储水防火", "C. 蓄养观赏鱼", "D. 盛酒赐宴"], "answer": "B", "explain": "太平缸实际用途为储水防火，宫中称缸为'海'，寓意以水克火。", "source": "实际用途：储水防火——宫中称缸为'海'，房前设缸即'门前有海'，寓意以水克火。"}, {"section": "故宫（紫禁城）", "type": "single", "q": "下列走兽中，不在太和殿檐角10个走兽之列的是（ ）。", "options": ["A. 狻猊", "B. 獬豸", "C. 行什", "D. 鸱吻"], "answer": "D", "explain": "太和殿檐角10个走兽为龙、凤、狮子、天马、海马、狻猊、押鱼、獬豸、斗牛、行什，不含鸱吻。", "source": "太和殿檐角安放 10 个走兽，龙、凤、狮子、天马、海马、狻猊、押鱼、獬豸、斗牛、行什。"}, {"section": "故宫（紫禁城）", "type": "single", "q": "1915年袁世凯复辟时，曾将保和殿改名为（ ）。", "options": ["A. 建极殿", "B. 承运殿", "C. 体元殿", "D. 谨身殿"], "answer": "A", "explain": "1915年袁世凯复辟时改太和殿为'承运殿'、中和殿为'体元殿'、保和殿为'建极殿'，旋即废止。", "source": "1915 年袁世凯复辟时曾一度改太和殿为'承运殿'、中和殿为'体元殿'、保和殿为'建极殿'，旋即废止。"}, {"section": "故宫（紫禁城）", "type": "single", "q": "太和殿前月台（丹陛）上，嘉量置于（ ）。", "options": ["A. 东侧", "B. 西侧", "C. 南侧", "D. 北侧"], "answer": "B", "explain": "太和殿月台上日晷在东、嘉量在西，各一。", "source": "月台（丹陛）上：日晷（东）、嘉量（西）各一。"}, {"section": "故宫（紫禁城）", "type": "single", "q": "清代皇子皇孙读书的上书房位于（ ）。", "options": ["A. 乾清门内东侧", "B. 乾清门内西侧", "C. 乾清宫西庑", "D. 武英殿廊房"], "answer": "A", "explain": "上书房位于乾清门内东侧、乾清宫东庑；乾清宫西庑的懋勤殿是康熙帝幼年读书处。", "source": "上书房，位于乾清门内东侧、乾清宫周围的庑房（乾清宫东庑）。"}, {"section": "故宫（紫禁城）", "type": "single", "q": "交泰殿明间宝座上方今悬“无为”匾，其书写情况是（ ）。", "options": ["A. 康熙帝亲笔原题", "B. 乾隆帝恭摹康熙御笔", "C. 雍正帝御笔", "D. 光绪帝重书"], "answer": "B", "explain": "“无为”匾为康熙帝原题，今悬者为乾隆帝恭摹康熙御笔。", "source": "康熙帝原题，今悬者为乾隆帝恭摹康熙御笔。"}, {"section": "故宫（紫禁城）", "type": "single", "q": "清代坤宁宫仿沈阳故宫清宁宫改造的时间是（ ）。", "options": ["A. 顺治元年（1644年）", "B. 顺治十二年（1655年）", "C. 康熙八年（1669年）", "D. 雍正七年（1729年）"], "answer": "B", "explain": "清顺治十二年（1655年）仿沈阳故宫清宁宫改造坤宁宫，此后成为宫中萨满教祭神的主要场所。", "source": "清顺治十二年（1655 年）仿沈阳故宫清宁宫改造后……成为宫中萨满教祭神的主要场所。"}, {"section": "故宫（紫禁城）", "type": "single", "q": "御花园钦安殿供奉的主神是（ ）。", "options": ["A. 玉皇大帝", "B. 玄天上帝（真武大帝）", "C. 太上老君", "D. 关圣帝君"], "answer": "B", "explain": "钦安殿供奉玄天上帝（真武大帝、玄武大帝），为道教北方之水神，明清皇帝于四立节令至此拈香，祈求消弭火灾。", "source": "供奉玄天上帝（真武大帝、玄武大帝），为道教北方之水神。"}, {"section": "故宫（紫禁城）", "type": "single", "q": "御花园绛雪轩前原有海棠树（ ）株。", "options": ["A. 3", "B. 5", "C. 7", "D. 9"], "answer": "B", "explain": "轩前原有海棠树5株，海棠花瓣飘落时色白如雪，宛若雪花缤纷而降，故名“绛雪轩”。", "source": "轩前原有海棠树 5 株，海棠初放时颜色殷红，花瓣飘落时色白如雪……故名“绛雪轩”。"}, {"section": "故宫（紫禁城）", "type": "single", "q": "驾崩于御花园钦安殿的皇帝是（ ）。", "options": ["A. 明成祖朱棣", "B. 明仁宗朱高炽", "C. 明世宗朱厚熜", "D. 清世祖顺治帝"], "answer": "B", "explain": "明仁宗朱高炽（年号洪熙）于洪熙元年（1425年）五月十二日猝死于钦安殿，在位仅约8个月，葬于十三陵献陵。", "source": "洪熙元年（1425 年）五月十二日猝死于钦安殿（葬于十三陵献陵），在位仅约 8 个月。"}, {"section": "故宫（紫禁城）", "type": "single", "q": "养心殿中，晚清垂帘听政之处位于（ ）。", "options": ["A. 明间", "B. 东暖阁", "C. 西暖阁", "D. 后殿"], "answer": "B", "explain": "东暖阁为皇帝休息、明窗开笔及晚清垂帘听政之处；西暖阁为批阅奏折、召见大臣之所。", "source": "东暖阁：皇帝休息、明窗开笔及晚清垂帘听政之处。"}, {"section": "故宫（紫禁城）", "type": "single", "q": "自雍正起至宣统，先后在养心殿居住并处理日常政务的清帝共有（ ）位。", "options": ["A. 6", "B. 7", "C. 8", "D. 10"], "answer": "C", "explain": "即雍正、乾隆、嘉庆、道光、咸丰、同治、光绪、宣统八帝，养心殿成为清王朝实际的政治决策中心。", "source": "自雍正起至宣统，先后有 8 位清帝……在此居住并处理日常政务。"}, {"section": "故宫（紫禁城）", "type": "single", "q": "慈禧通过三次垂帘（同治、光绪两朝）操纵朝政达（ ）年。", "options": ["A. 28", "B. 38", "C. 48", "D. 58"], "answer": "C", "explain": "咸丰十一年辛酉政变后两宫皇太后于养心殿东暖阁垂帘听政，慈禧通过三次垂帘操纵朝政达48年。", "source": "慈禧通过三次垂帘（同治、光绪两朝）操纵朝政达 48 年。"}, {"section": "故宫（紫禁城）", "type": "single", "q": "紫禁城宁寿宫区皇极殿是仿照（ ）的建筑形制修建的。", "options": ["A. 太和殿", "B. 乾清宫", "C. 坤宁宫", "D. 养心殿"], "answer": "B", "explain": "皇极殿仿乾清宫；宁寿宫形制同坤宁宫，宁寿门仿乾清门，养性殿仿养心殿。", "source": "仿照乾清宫的建筑形制。"}, {"section": "故宫（紫禁城）", "type": "single", "q": "交泰殿内，东次间设有（ ）。", "options": ["A. 大自鸣钟", "B. 铜壶滴漏", "C. 宝座", "D. 《交泰殿铭》板屏"], "answer": "B", "explain": "交泰殿东次间设铜壶滴漏，西次间设大自鸣钟；宝座设于明间，《交泰殿铭》在宝座后板屏上。", "source": "东次间设铜壶滴漏；西次间设大自鸣钟。"}, {"section": "故宫（紫禁城）", "type": "single", "q": "清代坤宁宫门外东南设有（ ）。", "options": ["A. 祭天神杆", "B. 日晷", "C. 嘉量", "D. 铜鼎"], "answer": "A", "explain": "坤宁宫正间及西暖阁为萨满教祭神场所，设南、北、西三面炕，后檐设锅灶煮肉，门外东南设祭天神杆。", "source": "设南、北、西三面炕，后檐设锅灶煮肉；门外东南设祭天神杆。"}, {"section": "故宫（紫禁城）", "type": "single", "q": "养心殿西暖阁“勤政亲贤”匾的题写者是（ ）。", "options": ["A. 康熙帝", "B. 雍正帝", "C. 乾隆帝", "D. 咸丰帝"], "answer": "B", "explain": "西暖阁“勤政亲贤”匾为雍正帝御笔，并有“惟以一人治天下，岂为天下奉一人”对联。", "source": "西暖阁：“勤政亲贤”匾——雍正帝御笔；并有“惟以一人治天下，岂为天下奉一人”对联。"}, {"section": "故宫（紫禁城）", "type": "single", "q": "“明窗开笔”仪式中，皇帝书写新年吉语所用之笔称为（ ）。", "options": ["A. 金瓯永固杯", "B. 玉烛长调", "C. 万年青笔", "D. 万年枝"], "answer": "C", "explain": "仪式中用“金瓯永固杯”饮屠苏酒，点燃“玉烛长调”烛台，以“万年青笔”书写新年吉语。", "source": "用“金瓯永固杯”饮屠苏酒，点燃“玉烛长调”烛台，以“万年青笔”书写新年吉语。"}, {"section": "故宫（紫禁城）", "type": "single", "q": "三希堂所藏三件东晋法帖中，王珣的作品是（ ）。", "options": ["A. 《快雪时晴帖》", "B. 《中秋帖》", "C. 《伯远帖》", "D. 《三希堂记》"], "answer": "C", "explain": "《快雪时晴帖》为王羲之作，《中秋帖》为王献之作，《伯远帖》为王珣作；《三希堂记》是乾隆阐释堂名所撰之文。", "source": "王羲之《快雪时晴帖》、王献之《中秋帖》、王珣《伯远帖》。"}, {"section": "故宫（紫禁城）", "type": "single", "q": "下列宫殿中，属于西六宫的是（ ）。", "options": ["A. 景仁宫", "B. 承乾宫", "C. 延禧宫", "D. 长春宫"], "answer": "D", "explain": "西六宫为永寿宫、翊坤宫、储秀宫、咸福宫、长春宫、太极殿；景仁宫、承乾宫、延禧宫属东六宫。", "source": "西六宫（中轴线西侧）：永寿宫、翊坤宫、储秀宫、咸福宫、长春宫、太极殿。"}, {"section": "故宫（紫禁城）", "type": "single", "q": "畅音阁三层戏台中，位于中层的是（ ）。", "options": ["A. 福台", "B. 禄台", "C. 寿台", "D. 仙台"], "answer": "B", "explain": "畅音阁共3层，上为“福台”、中为“禄台”、下为“寿台”，每层之间有楼梯相通。", "source": "共 3 层（上为“福台”、中为“禄台”、下为“寿台”），每层之间有楼梯相通。"}, {"section": "故宫（紫禁城）", "type": "single", "q": "宁寿宫区中，仿养心殿而建的建筑是（ ）。", "options": ["A. 皇极殿", "B. 宁寿宫", "C. 宁寿门", "D. 养性殿"], "answer": "D", "explain": "宁寿门仿乾清门，养性殿仿养心殿；皇极殿仿乾清宫，宁寿宫形制同坤宁宫。", "source": "宁寿门仿乾清门，养性殿仿养心殿。"}, {"section": "故宫（紫禁城）", "type": "single", "q": "乾隆时期，《四库全书荟要》珍藏于御花园的（ ）。", "options": ["A. 摛藻堂", "B. 绛雪轩", "C. 钦安殿", "D. 御景亭"], "answer": "A", "explain": "《四库全书荟要》珍藏于御花园摛藻堂内。", "source": "乾隆时期，珍藏于御花园摛藻堂内的古籍：《四库全书荟要》。"}, {"section": "故宫（紫禁城）", "type": "single", "q": "紫禁城东西六宫均建于（ ）。", "options": ["A. 明永乐四年（1406年）", "B. 明永乐十八年（1420年）", "C. 明嘉靖十五年（1536年）", "D. 清顺治十二年（1655年）"], "answer": "B", "explain": "东西六宫均为后妃居所，建于明永乐十八年（1420年），各宫规制相近、自成院落。", "source": "均为后妃居所，建于明永乐十八年（1420 年），各宫规制相近、自成院落。"}, {"section": "故宫（紫禁城）", "type": "single", "q": "光绪十年整修储秀宫时，将翊坤宫后殿改为穿堂殿（ ），使储秀宫与翊坤宫连通为四进院落。", "options": ["A. 体和殿", "B. 养心殿", "C. 太极殿", "D. 咸福宫"], "answer": "A", "explain": "光绪十年为庆祝慈禧五十寿辰，耗银63万两整修储秀宫，并将翊坤宫后殿改为穿堂殿“体和殿”。", "source": "并将翊坤宫后殿改为穿堂殿“体和殿”，使储秀宫与翊坤宫连通为四进院落。"}, {"section": "故宫（紫禁城）", "type": "single", "q": "紫禁城外西路慈宁宫的俗称是（ ）。", "options": ["A. 太后宫", "B. 长寿宫", "C. 老佛爷宫", "D. 慈宁殿"], "answer": "A", "explain": "慈宁宫俗称“太后宫”，为皇太后的正宫，是明清太皇太后、皇太后、太妃嫔的居所。", "source": "俗称“太后宫”。慈宁宫位于内廷外西路、隆宗门以西……为皇太后的正宫。"}, {"section": "故宫（紫禁城）", "type": "single", "q": "明代坤宁宫的主要用途是（ ）。", "options": ["A. 皇帝寝宫", "B. 皇后的正宫（寝宫）", "C. 萨满教祭神场所", "D. 皇帝大婚洞房"], "answer": "B", "explain": "明代坤宁宫为皇后的正宫（寝宫）；清代改造后正间及西暖阁为萨满教祭神场所，东暖阁为皇帝大婚洞房。", "source": "明代：皇后的正宫（寝宫），为皇后起居之所。"}, {"section": "天坛", "type": "single", "q": "天坛始建并建成于（ ）。", "options": ["A. 明永乐十八年（1420年）", "B. 明永乐十九年（1421年）", "C. 明嘉靖九年（1530年）", "D. 明嘉靖二十四年（1545年）"], "answer": "A", "explain": "天坛于明永乐十八年（1420年）始建并建成，按南京天地坛规制，初名“天地坛”。1421年为首次祭祀盛典，1530年为天地分祀，1545年为大享殿建成。", "source": "明永乐十八年（1420 年）始建并建成（按南京天地坛规制），初名“天地坛”"}, {"section": "天坛", "type": "judge", "q": "天坛位于北京市东城区，正阳门（前门）外东南侧。", "answer": "对", "explain": "原文明确天坛位置为北京市东城区，正阳门（前门）外东南侧（天坛内东里7号）。", "source": "位置：北京市东城区，正阳门（前门）外东南侧（天坛内东里 7 号）。"}, {"section": "天坛", "type": "multi", "q": "下列关于天坛的说法，正确的有（ ）。", "options": ["A. 是世界上现存规模最大、形制最完备的古代祭天建筑群", "B. 坛域北圆南方，寓意“天圆地方”", "C. 1961年列为第一批全国重点文物保护单位", "D. 2007年评为国家5A级旅游景区", "E. 位于北京市西城区"], "answer": "ABCD", "explain": "天坛位于北京市东城区而非西城区，其余四项均与原文相符。", "source": "特点：世界上现存规模最大、形制最完备的古代祭天建筑群……1961 年列为第一批全国重点文物保护单位，1998 年列入《世界遗产名录》，2007 年评为国家 5A 级旅游景区。"}, {"section": "天坛", "type": "single", "q": "天坛列入《世界遗产名录》的时间是（ ）。", "options": ["A. 1961年", "B. 1998年", "C. 2007年", "D. 1918年"], "answer": "B", "explain": "天坛1998年列入《世界遗产名录》；1961年列为第一批全国重点文物保护单位，2007年评为国家5A级旅游景区，1918年辟为公园开放。", "source": "1961 年列为第一批全国重点文物保护单位，1998 年列入《世界遗产名录》，2007 年评为国家 5A 级旅游景区。"}, {"section": "天坛", "type": "judge", "q": "天坛占地面积273公顷，相当于紫禁城的近4倍。", "answer": "对", "explain": "原文载明天坛占地面积273公顷（约273万平方米），相当于紫禁城的近4倍。", "source": "占地面积：273 公顷（约 273 万平方米），相当于紫禁城的近 4 倍。"}, {"section": "天坛", "type": "single", "q": "明清两代到天坛祭祀次数最多的皇帝是（ ）。", "options": ["A. 明永乐帝", "B. 明嘉靖帝", "C. 清乾隆帝", "D. 清光绪帝"], "answer": "C", "explain": "清乾隆帝在位60年，到天坛祭祀155次，为明清两代祭祀次数最多的皇帝。", "source": "其中清乾隆帝最多——在位 60 年，到天坛祭祀 155 次。"}, {"section": "天坛", "type": "judge", "q": "天坛于1998年被列为第一批全国重点文物保护单位。", "answer": "错", "explain": "天坛1961年列为第一批全国重点文物保护单位，1998年列入的是《世界遗产名录》。", "source": "1961 年列为第一批全国重点文物保护单位，1998 年列入《世界遗产名录》，2007 年评为国家 5A 级旅游景区。"}, {"section": "天坛", "type": "multi", "q": "明清两代皇帝在天坛举行的祭祀活动包括（ ）。", "options": ["A. 冬至日于圜丘坛祭天", "B. 孟春（正月）于祈谷坛祈谷", "C. 孟夏遇旱于圜丘坛行常雩礼祈雨", "D. 春分日于祈年殿祭日"], "answer": "ABC", "explain": "天坛是明清皇帝“祭天”“祈谷”的场所：冬至于圜丘坛祭天，孟春于祈谷坛祈谷，孟夏遇旱于圜丘坛行常雩礼。原文无春分祭日于祈年殿之说。", "source": "作用：明清两代皇帝“祭天”“祈谷”的场所——冬至日于圜丘坛祭天，孟春（正月）于祈谷坛祈谷，孟夏遇旱则于圜丘坛行常雩礼（祈雨）。"}, {"section": "天坛", "type": "single", "q": "中国古代君王最后一次在天坛举行祭天仪式是在（ ）。", "options": ["A. 1889年", "B. 1896年", "C. 1907年", "D. 1918年"], "answer": "C", "explain": "光绪三十三年（1907年）为中国古代君王最后一次在天坛举行祭天仪式。", "source": "（光绪三十三年／1907 年为中国古代君王最后一次在天坛举行祭天仪式。）"}, {"section": "天坛", "type": "judge", "q": "天坛坛域北圆南方，寓意“天圆地方”，整体布局呈“回”字形。", "answer": "对", "explain": "原文明确坛域北圆南方，寓意“天圆地方”；整体布局呈“回”字形，由两道坛墙环护。", "source": "坛域北圆南方，寓意“天圆地方”；整体布局呈“回”字形；建筑设计集明、清两代技艺之大成"}, {"section": "天坛", "type": "single", "q": "明朝将天地合祀改为天地分祀的时间是（ ）。", "options": ["A. 明永乐十八年（1420年）", "B. 明永乐十九年（1421年）", "C. 明嘉靖九年（1530年）", "D. 清顺治二年（1645年）"], "answer": "C", "explain": "明嘉靖九年（1530年），嘉靖帝采纳给事中夏言建议，恢复天地分祀旧制。", "source": "明嘉靖九年（1530 年）。嘉靖帝采纳给事中夏言建议，恢复天地分祀旧制，建圜丘于南郊祭天、方泽于北郊祭地"}, {"section": "天坛", "type": "judge", "q": "七星石位于祈谷坛东南方，实为七块青石，石上凿有山形纹样。", "answer": "错", "explain": "七星石实为八块青石：七块大青石为明嘉靖年间放置，清乾隆时又增置一块小青石。", "source": "七星石：位于祈谷坛（长廊）东南方，实为八块青石，石上凿有山形纹样。"}, {"section": "天坛", "type": "multi", "q": "圜丘坛周围的四座天门包括（ ）。", "options": ["A. 泰元门", "B. 昭亨门", "C. 广利门", "D. 成贞门", "E. 古稀门"], "answer": "ABCD", "explain": "圜丘坛周围4座坛门为东泰元门、南昭亨门、西广利门、北成贞门，取《易经·乾卦》“元、亨、利、贞”
