ngle", "q": "\"北京人\"生活时期的主要猎物以（ ）为主。", "options": ["A. 鹿类", "B. 鱼类", "C. 鸟类", "D. 象类"], "answer": "A", "explain": "主要猎物以鹿类为主，包括肿骨大角鹿、葛氏斑鹿、梅花鹿，另有野猪、三门马、犀牛、羚羊、水牛等。", "source": "主要猎物：以鹿类为主，包括肿骨大角鹿、葛氏斑鹿、梅花鹿，另有野猪、三门马、犀牛、羚羊、水牛等。"}, {"section": "周口店北京人遗址", "type": "multi", "q": "据考古遗存与民族学类比推测，\"北京人\"时期的劳动分工包括（ ）。", "options": ["A. 男子负责狩猎", "B. 男子负责制造工具", "C. 女子负责采集朴树籽、植物根茎等", "D. 女子负责照看、管理火种", "E. 女子负责捕猎大型动物"], "answer": "ABCD", "explain": "男子主要负责狩猎与制造工具；女子主要负责采集与照看、管理火种。捕猎大型动物并非女子分工。", "source": "男子主要负责狩猎与制造工具；女子主要负责采集（朴树籽、植物根茎等）与照看、管理火种。"}, {"section": "周口店北京人遗址", "type": "single", "q": "1929年12月2日，发现第一颗完整\"北京人\"头盖骨化石的学者是（ ）。", "options": ["A. 安特生", "B. 师丹斯基", "C. 裴文中", "D. 李捷"], "answer": "C", "explain": "中国古生物学家、古人类学家裴文中于1929年12月2日发现第一颗完整的\"北京人\"头盖骨化石。", "source": "中国古生物学家、古人类学家裴文中于1929年12月2日发现第一颗完整的\"北京人\"头盖骨化石。"}, {"section": "周口店北京人遗址", "type": "single", "q": "1918年，瑞典学者安特生首次到周口店考察的地点是（ ）。", "options": ["A. 龙骨山（第1地点）", "B. 鸡骨山（第6地点）", "C. 鸽子堂", "D. 山顶洞"], "answer": "B", "explain": "安特生1918年首次到周口店鸡骨山（第6地点）考察；1921年才来到龙骨山试掘。", "source": "瑞典地质学家、考古学家安特生（J. G. Andersson），1918年首次到周口店鸡骨山（第6地点）考察。"}, {"section": "周口店北京人遗址", "type": "multi", "q": "下列关于周口店北京人遗址及博物馆的说法，正确的有（ ）。", "options": ["A. 遗址涵盖直立人、早期智人、晚期智人三个古人类演化阶段", "B. 新馆为国家一级博物馆", "C. 新馆建筑形式源于周口店遗址的文化元素——石器", "D. 馆藏文物7000多件", "E. 新馆建筑面积约为老馆的18倍"], "answer": "ABCD", "explain": "新馆建筑面积8093平方米，约为老馆的8倍，而非18倍；其余各项均与原文一致。", "source": "等级：国家一级博物馆。建筑形式源于……石器。藏品数量：馆藏文物7000多件。涵盖直立人、早期智人和晚期智人三个阶段。新馆建筑面积8093平方米……为老馆8倍。"}, {"section": "周口店北京人遗址", "type": "single", "q": "周口店猿人洞（第1地点）巨厚洞穴堆积的形成原因是（ ）。", "options": ["A. 河流长期冲积而成", "B. \"北京人\"长期居住的遗骨遗物与洞顶塌落石块、洞外流入泥沙层层堆积而成", "C. 火山喷发物堆积而成", "D. 冰川搬运沉积而成"], "answer": "B", "explain": "\"北京人\"在此断断续续生活近50万年，其遗骨、遗物、遗迹与洞顶塌落石块、洞外流入泥沙层层堆积而成。", "source": "\"北京人\"在此断断续续生活近50万年，其遗骨、遗物、遗迹与洞顶塌落的石块、洞外流入的泥沙在洞内一层层填充、堆积而成。"}, {"section": "周口店北京人遗址", "type": "single", "q": "因早年常有野鸽子栖息而得名的\"鸽子堂\"，1930年起的发掘主要证明了\"北京人\"（ ）。", "options": ["A. 已会建造房屋", "B. 已会制造石器并使用火", "C. 已会驯养家畜", "D. 已会种植谷物"], "answer": "B", "explain": "鸽子堂出土大量石制品（刮削器、尖状器、砍砸器等）和丰富的用火遗迹，证明\"北京人\"已会制造石器并使用火。", "source": "鸽子堂（第1地点）出土大量石制品……和丰富的用火遗迹……证明\"北京人\"已会制造石器并使用火。"}, {"section": "周口店北京人遗址", "type": "single", "q": "1941年太平洋战争爆发前后，在转运过程中遗失的原存于北京的\"北京人\"与\"山顶洞人\"人类化石和动物化石共有（ ）。", "options": ["A. 50多件", "B. 100多件", "C. 200多件", "D. 300多件"], "answer": "B", "explain": "1941年前后，100余件人类化石及动物化石在转运过程中遗失，至今下落不明。", "source": "原存于北京的\"北京人\"与\"山顶洞人\"化石（100余件人类化石及动物化石）在转运过程中遗失，至今下落不明。"}, {"section": "周口店北京人遗址", "type": "single", "q": "田园洞（第27地点）出土的\"田园洞人\"（早期现代人）化石，距今约（ ）。", "options": ["A. 70万—20万年", "B. 14万年", "C. 4.2万—3.85万年", "D. 1.8万年"], "answer": "C", "explain": "田园洞2001年发现、2003—2004年发掘，出土距今约4.2万—3.85万年的\"田园洞人\"化石34件。", "source": "出土距今约4.2万—3.85万年的\"田园洞人\"（早期现代人）化石34件及大量哺乳动物化石。"}, {"section": "周口店北京人遗址", "type": "single", "q": "周口店遗址第14地点（俗称\"鱼岭\"）出土的鱼化石，形成于（ ）。", "options": ["A. 更新世", "B. 中新世", "C. 上新世", "D. 全新世"], "answer": "B", "explain": "第14地点出土鱼化石约2000尾，形成于中新世（约距今1400万年前）。", "source": "第14地点（俗称\"鱼岭\"）出土鱼化石约2000尾，形成于中新世（约距今1400万年前）。"}, {"section": "周口店北京人遗址", "type": "single", "q": "周口店遗址发现不同时期各类化石和文化遗物的地点共有（ ）。", "options": ["A. 14处", "B. 21处", "C. 27处", "D. 33处"], "answer": "C", "explain": "周口店遗址发现不同时期各类化石和文化遗物地点的数量为27处。", "source": "周口店遗址发现不同时期各类化石和文化遗物地点的数量：27处。"}, {"section": "周口店北京人遗址", "type": "single", "q": "2015年，周口店遗址博物馆新馆基本陈列荣获的奖项是（ ）。", "options": ["A. 联合国教科文组织亚太地区文化遗产保护奖·创新奖", "B. 亚洲建筑师协会建筑奖保护项目类金奖", "C. 第十二届（2014年度）全国博物馆十大陈列展览精品奖", "D. 中国钢结构工程奖金奖"], "answer": "C", "explain": "2015年新馆基本陈列获第十二届（2014年度）全国博物馆十大陈列展览精品奖；其余三项为猿人洞保护棚所获奖项。", "source": "2015年，周口店遗址博物馆新馆基本陈列荣获第十二届（2014年度）全国博物馆十大陈列展览精品奖。"}, {"section": "大运河", "type": "single", "q": "中国大运河被列入《世界遗产名录》的时间是（　）。", "options": ["A. 2012年6月", "B. 2014年6月", "C. 2016年6月", "D. 2018年6月"], "answer": "B", "explain": "2014年6月22日，第38届世界遗产大会（多哈）列入《世界遗产名录》。", "source": "中国大运河于2014年6月22日在卡塔尔首都多哈召开的第38届世界遗产大会上，被联合国教科文组织列入《世界遗产名录》。"}, {"section": "大运河", "type": "judge", "q": "中国大运河于2014年6月22日在卡塔尔首都多哈召开的第38届世界遗产大会上，被联合国教科文组织列入《世界遗产名录》。", "answer": "对", "explain": "与原文一致：2014年6月22日，多哈，第38届世界遗产大会。", "source": "中国大运河于2014年6月22日在卡塔尔首都多哈召开的第38届世界遗产大会上，被联合国教科文组织列入《世界遗产名录》。"}, {"section": "大运河", "type": "multi", "q": "下列属于“中国大运河”组成部分的有（　）。", "options": ["A. 隋唐大运河", "B. 京杭大运河", "C. 浙东运河", "D. 灵渠", "E. 郑国渠"], "answer": "ABC", "explain": "中国大运河由隋唐大运河、京杭大运河、浙东运河三大部分组成；灵渠、郑国渠不在其列。", "source": "中国大运河是世界上建造时间最早、规模最大、里程最长的人工运河，由隋唐大运河、京杭大运河、浙东运河三大部分组成（统称“中国大运河”）。"}, {"section": "大运河", "type": "single", "q": "根据申遗资料，中国大运河由27段河道与31处遗产点构成，其河道总长度约为（　）。", "options": ["A. 58公里", "B. 190公里", "C. 1011公里", "D. 1797公里"], "answer": "C", "explain": "申遗口径河道总长度约1011公里；1797公里为京杭大运河全长。", "source": "根据申遗资料，中国大运河由27段河道与31处遗产点构成（合计58处遗产点段），河道总长度约1011公里。"}, {"section": "大运河", "type": "judge", "q": "中国大运河由隋唐大运河、京杭大运河、浙东运河三大部分组成，统称“中国大运河”。", "answer": "对", "explain": "与原文一致，三大部分为隋唐大运河、京杭大运河、浙东运河。", "source": "中国大运河是世界上建造时间最早、规模最大、里程最长的人工运河，由隋唐大运河、京杭大运河、浙东运河三大部分组成（统称“中国大运河”）。"}, {"section": "大运河", "type": "single", "q": "北京（通州）大运河文化旅游景区被确定为国家5A级旅游景区的时间是（　）。", "options": ["A. 2012年1月", "B. 2014年6月", "C. 2024年2月", "D. 2019年2月"], "answer": "C", "explain": "2024年2月（文旅部2024年批次）确定为5A，为北京市第9家、通州区首家。", "source": "北京（通州）大运河文化旅游景区于2024年2月（文旅部2024年批次）被确定为国家5A级旅游景区，成为北京市第9家、通州区首家国家5A级旅游景区。"}, {"section": "大运河", "type": "judge", "q": "大运河贯通海河、黄河、淮河、长江、珠江五大水系。", "answer": "错", "explain": "五大水系为海河、黄河、淮河、长江、钱塘江，不是珠江。", "source": "大运河贯通海河、黄河、淮河、长江、钱塘江五大水系"}, {"section": "大运河", "type": "multi", "q": "大运河贯通的五大水系包括（　）。", "options": ["A. 海河", "B. 黄河", "C. 淮河", "D. 长江", "E. 珠江"], "answer": "ABCD", "explain": "五大水系为海河、黄河、淮河、长江、钱塘江，不包括珠江。", "source": "大运河贯通海河、黄河、淮河、长江、钱塘江五大水系"}, {"section": "大运河", "type": "single", "q": "中国大运河最早开凿可追溯至春秋时期（公元前486年），吴国在江淮间开凿的最早河段是（　）。", "options": ["A. 邗沟", "B. 永济渠", "C. 江南河", "D. 通济渠"], "answer": "A", "explain": "公元前486年吴国在江淮间开凿邗沟，为大运河最早河段。", "source": "中国大运河最早开凿可追溯至春秋时期（公元前486年，吴国在江淮间开凿邗沟，为大运河最早河段）"}, {"section": "大运河", "type": "judge", "q": "元代科学家郭守敬主持规划并主持开挖通惠河，通惠河之名由元世祖忽必烈赐名。", "answer": "对", "explain": "与原文一致：郭守敬主持开挖，忽必烈赐名，取“通达惠济”之意。", "source": "元代科学家、天文学家、水利家郭守敬主持规划并主持开挖通惠河。通惠河之名由元世祖忽必烈赐名（取“通达惠济”之意）。"}, {"section": "大运河", "type": "single", "q": "隋唐大运河连通的政治中心是（　），北抵涿郡，南至余杭。", "options": ["A. 长安", "B. 洛阳", "C. 开封", "D. 大都"], "answer": "B", "explain": "隋唐大运河以洛阳为中心，北抵涿郡（今北京），南至余杭（今杭州）。", "source": "隋朝大运河连通的政治中心：以洛阳为中心，北抵涿郡（今北京），南至余杭（今杭州）。"}, {"section": "大运河", "type": "judge", "q": "京杭大运河最北段为北运河，其北端起自大都积水潭。", "answer": "错", "explain": "京杭大运河最北段是通惠河（北京段），不是北运河。", "source": "京杭大运河最北段为通惠河（北京段），其北端起自大都积水潭。"}, {"section": "大运河", "type": "multi", "q": "下列“运河四大名塔”与其所在地对应正确的有（　）。", "options": ["A. 通州燃灯塔——北京", "B. 临清舍利宝塔——山东", "C. 扬州文峰塔——江苏", "D. 杭州六和塔——浙江", "E. 西安大雁塔——陕西"], "answer": "ABCD", "explain": "运河四大名塔为通州燃灯塔（北京）、临清舍利宝塔（山东）、扬州文峰塔（江苏）、杭州六和塔（浙江）。", "source": "通州燃灯塔（又称佑胜教寺塔）——北京市（通州）；临清舍利宝塔——山东省（临清）；扬州文峰塔——江苏省（扬州）；杭州六和塔——浙江省（杭州）"}, {"section": "大运河", "type": "single", "q": "元代以后，北京地区漕运最发达、最重要的人工水道是（　）。", "options": ["A. 通惠河", "B. 会通河", "C. 南运河", "D. 江南运河"], "answer": "A", "explain": "元代以后通惠河（及相连的北运河）是北京地区漕运最发达、最重要的人工水道。", "source": "元代以后，通惠河（及相连的北运河）是北京地区漕运最发达、最重要的人工水道，将南方漕粮直运至都城积水潭。"}, {"section": "大运河", "type": "judge", "q": "中国大运河是世界上建造时间最早、规模最大、里程最长的人工运河。", "answer": "对", "explain": "与原文一致：大运河是世界建造时间最早、规模最大、里程最长的人工运河。", "source": "中国大运河是世界上建造时间最早、规模最大、里程最长的人工运河，由隋唐大运河、京杭大运河、浙东运河三大部分组成。"}, {"section": "大运河", "type": "single", "q": "明代修建北京城所用的“临清砖”（临清贡砖）产自（　）。", "options": ["A. 江苏扬州", "B. 山东临清", "C. 浙江杭州", "D. 河北张家湾"], "answer": "B", "explain": "“临清砖”产自山东临清。", "source": "明代修建北京城所用的“临清砖”（又称临清贡砖），产自山东临清。"}, {"section": "大运河", "type": "judge", "q": "根据申遗资料，中国大运河由27段河道与58处遗产点构成。", "answer": "错", "explain": "应为27段河道与31处遗产点构成，27+31合计58处遗产点段；题干把58误作遗产点数量。", "source": "根据申遗资料，中国大运河由27段河道与31处遗产点构成（合计58处遗产点段），河道总长度约1011公里。"}, {"section": "大运河", "type": "multi", "q": "下列名人故居（纪念馆）位于什刹海沿岸的有（　）。", "options": ["A. 宋庆龄故居", "B. 郭沫若纪念馆", "C. 梅兰芳纪念馆", "D. 老舍故居（丹柿小院）"], "answer": "ABCD", "explain": "四处均在原文列举的什刹海沿岸名人故居/纪念馆之列（老舍故居邻近什刹海文化区）。", "source": "宋庆龄故居——西城区后海北沿46号；郭沫若纪念馆——西城区前海西街18号；梅兰芳纪念馆——西城区护国寺街9号；老舍故居（丹柿小院）——东城区灯市口西街丰富胡同19号"}, {"section": "大运河", "type": "single", "q": "元代通惠河自大都积水潭向东，经通州至张家湾入白河（北运河），全长（　）。", "options": ["A. 164里（约82公里）", "B. 24里（约12公里）", "C. 1011里", "D. 189里"], "answer": "A", "explain": "元代通惠河全长164里，约82公里。", "source": "元代通惠河自大都积水潭（今什刹海）向东，经通州至张家湾入白河（北运河），全长164里（约82公里）。"}, {"section": "大运河", "type": "judge", "q": "通州文庙始建于明代，是北京地区现存最古老的孔庙之一。", "answer": "错", "explain": "通州文庙（通州学宫）始建于元大德二年（1298年），不是明代。", "source": "通州文庙（通州学宫）始建于元大德二年（1298年），是北京地区现存最古老的孔庙之一，位于通州古城内（今通州大成街）。"}, {"section": "大运河", "type": "single", "q": "通州文庙（通州学宫）始建于（　），是北京地区现存最古老的孔庙之一。", "options": ["A. 元大德二年（1298年）", "B. 清康熙三十五年（1696年）", "C. 乾隆四十一年（1776年）", "D. 咸丰二年（1852年）"], "answer": "A", "explain": "通州文庙始建于元大德二年（1298年），位于通州古城内（今通州大成街）。", "source": "通州文庙（通州学宫）始建于元大德二年（1298年），是北京地区现存最古老的孔庙之一，位于通州古城内（今通州大成街）。"}, {"section": "大运河", "type": "judge", "q": "京杭大运河全长约1797公里，其长度约为埃及苏伊士运河的9～10倍。", "answer": "对", "explain": "与原文一致：京杭大运河全长约1797公里，苏伊士运河约190公里，前者约为后者9～10倍。", "source": "京杭大运河全长约1797公里（一说1794公里）；埃及苏伊士运河全长约190公里……京杭大运河长度约为苏伊士运河9～10倍。"}, {"section": "大运河", "type": "multi", "q": "下列关于隋唐大运河的说法正确的有（　）。", "options": ["A. 以洛阳为中心", "B. 由广通渠（或通济渠）、永济渠、邗沟、江南河四段组成", "C. 北抵涿郡（今北京）", "D. 南至余杭（今杭州）", "E. 以大都为中心"], "answer": "ABCD", "explain": "隋唐大运河以洛阳为中心，由广通渠（或通济渠）、永济渠、邗沟、江南河四段组成，北抵涿郡、南至余杭；“以大都为中心”错误。", "source": "隋唐大运河主要由广通渠（或通济渠）、永济渠、邗沟、江南河四段组成（以洛阳为中心）……以洛阳为中心，北抵涿郡（今北京），南至余杭（今杭州）。"}, {"section": "大运河", "type": "single", "q": "通州八里桥的正式名称是（　）。", "options": ["A. 万宁桥", "B. 永通桥", "C. 银锭桥", "D. 高碑店桥"], "answer": "B", "explain": "八里桥正式名称为永通桥，因距通州城西八里而俗称八里桥。", "source": "正式名称：八里桥的正式名称为永通桥（因距通州城西八里，俗称八里桥）。"}, {"section": "大运河", "type": "judge", "q": "世界文化遗产“中国大运河”北京段列入的遗产点为澄清闸上闸、中闸两处，位于今西城区什刹海—地安门外一带。", "answer": "对", "explain": "与原文一致：北京段遗产点为澄清闸（上闸、中闸）两处，位于西城区什刹海—地安门外一带。", "source": "世界文化遗产“中国大运河”北京段列入的遗产点为澄清闸（上闸、中闸）两处，位于今西城区什刹海—地安门外一带。"}, {"section": "大运河", "type": "single", "q": "现存通州燃灯塔的重建时间，主流说法为（　）。", "options": ["A. 清康熙三十五年（1696年）", "B. 元大德二年（1298年）", "C. 1924年", "D. 明永乐年间"], "answer": "A", "explain": "现存通州燃灯塔为清代重建，主流说法为清康熙三十五年（1696年）。", "source": "现存通州燃灯塔为清代重建，主流说法为清康熙三十五年（1696年）重建"}, {"section": "大运河", "type": "multi", "q": "京杭大运河自北向南分为七段，下列属于其分段的有（　）。", "options": ["A. 通惠河", "B. 北运河", "C. 会通河", "D. 淮扬运河（里运河）", "E. 浙东运河"], "answer": "ABCD", "explain": "京杭大运河七段为通惠河、北运河、南运河、会通河、中河、淮扬运河（里运河）、江南运河；浙东运河属中国大运河三大组成部分之一，不在京杭大运河七段之内。", "source": "自北向南分为通惠河、北运河、南运河、会通河、中河、淮扬运河（里运河）、江南运河七段。"}, {"section": "大运河", "type": "single", "q": "中国大运河被列入《世界遗产名录》，是在联合国教科文组织第（　）届世界遗产大会上。", "options": ["A. 第35届", "B. 第36届", "C. 第37届", "D. 第38届"], "answer": "D", "explain": "2014年6月22日在卡塔尔多哈召开的第38届世界遗产大会上列入《世界遗产名录》。", "source": "中国大运河于2014年6月22日在卡塔尔首都多哈召开的第38届世界遗产大会上，被联合国教科文组织列入《世界遗产名录》。"}, {"section": "大运河", "type": "single", "q": "大运河沿线涉及的省级行政区共有（　）。", "options": ["A. 6个", "B. 7个", "C. 8个", "D. 10个"], "answer": "C", "explain": "沿线涉及北京、天津、河北、山东、河南、安徽、江苏、浙江8个省级行政区（2个直辖市、6个省），流经35座地级市。", "source": "沿线涉及北京、天津、河北、山东、河南、安徽、江苏、浙江8个省级行政区（2个直辖市、6个省），流经35座地级市（含直辖市辖区）级别城市。"}, {"section": "大运河", "type": "multi", "q": "下列属于元代郭守敬主持的水利工程及其成就的有（　）。", "options": ["A. 主持规划并开挖通惠河", "B. 白浮堰引水工程", "C. 解决大都漕运“水脊”难题", "D. 使江南漕船直抵积水潭", "E. 主持修建永通桥"], "answer": "ABCD", "explain": "元代郭守敬规划通惠河、白浮堰引水工程，解决大都漕运“水脊”难题，使江南漕船直抵积水潭；永通桥（八里桥）非其所建。", "source": "北京地区水利工程技术水平达到历史最高点的时期是元代（以郭守敬规划通惠河、白浮堰引水工程为代表，解决了大都漕运“水脊”难题，使江南漕船直抵积水潭）。"}, {"section": "大运河", "type": "single", "q": "金代迁都后成为漕运中心的城市是（　）。", "options": ["A. 洛阳", "B. 涿郡", "C. 余杭", "D. 中都"], "answer": "D", "explain": "金代迁都中都（今北京），中都（燕京/北京）成为漕运中心。", "source": "金代漕运中心：金代迁都中都（今北京），中都（燕京/北京）成为漕运中心。"}, {"section": "大运河", "type": "single", "q": "通州八里桥（永通桥）为三孔石拱桥，正中中间孔净高约（　），以便漕运船只通过。", "options": ["A. 约6.5米", "B. 约8.5米", "C. 约13米", "D. 约19.5米"], "answer": "B", "explain": "中孔净高约8.5米；19.5米为中孔净跨，13米为“桥面距水面”另一说。", "source": "永通桥为三孔石拱桥，正中中间孔（中孔）净高约8.5米（中孔净跨约19.5米），以便漕运船只通过。"}, {"section": "大运河", "type": "multi", "q": "下列关于通惠河的说法正确的有（　）。", "options": ["A. 河名由元世祖忽必烈赐名", "B. 取“通达惠济”之意", "C. 元代开通时沿河修筑水闸24座", "D. 澄清闸在元代原名海子闸", "E. 明代重修后以积水潭为水源起点"], "answer": "ABCD", "explain": "明代重修后通惠河改以玉泉山为水源起点，而非积水潭；其余四项均与原文一致。", "source": "通惠河之名由元世祖忽必烈赐名（取“通达惠济”之意）……沿河修筑水闸24座……澄清闸，在元代原名海子闸……明代重修后，通惠河改以玉泉山为水源起点。"}, {"section": "大运河", "type": "single", "q": "下列不属于“中国大运河”三大组成部分的是（　）。", "options": ["A. 隋唐大运河", "B. 京杭大运河", "C. 浙东运河", "D. 灵渠"], "answer": "D", "explain": "中国大运河由隋唐大运河、京杭大运河、浙东运河三大部分组成，灵渠不在其列。", "source": "中国大运河……由隋唐大运河、京杭大运河、浙东运河三大部分组成（统称“中国大运河”）。"}, {"section": "大运河", "type": "single", "q": "北京大学未名湖畔的博雅塔，是仿（　）形制而建的八角密檐式塔。", "options": ["A. 临清舍利宝塔", "B. 扬州文峰塔", "C. 通州燃灯塔", "D. 杭州六和塔"], "answer": "C", "explain": "博雅塔仿通州燃灯塔形制而建，1924年建，原为校园水塔。", "source": "北京大学未名湖畔的博雅塔，是仿通州燃灯塔形制而建的八角密檐式塔（1924年建，原为校园水塔）。"}, {"section": "大运河", "type": "single", "q": "万宁桥俗称“后门桥”，其中“后门”指的是明清皇城北门（　）。", "options": ["A. 天安门", "B. 地安门", "C. 德胜门", "D. 正阳门"], "answer": "B", "explain": "地安门为明清皇城北门，俗称“后门”，万宁桥紧邻其南，故俗称“后门桥”。", "source": "万宁桥……位于地安门外、地安门（明清皇城北门，俗称“后门”）之南，因紧邻“后门”且为桥，故民间俗称“后门桥”。"}, {"section": "大运河", "type": "single", "q": "位于西城区积水潭（西海）北岸、展示元代科学家水利与天文成就的名人纪念馆是（　）。", "options": ["A. 郭沫若纪念馆", "B. 梅兰芳纪念馆", "C. 郭守敬纪念馆", "D. 宋庆龄故居"], "answer": "C", "explain": "郭守敬纪念馆位于西城区德胜门西大街甲60号（西海北岸），纪念元代科学家郭守敬。", "source": "积水潭（西海）北岸的名人纪念馆：郭守敬纪念馆，位于西城区德胜门西大街甲60号（西海北岸），纪念元代科学家郭守敬。"}, {"section": "大运河", "type": "single", "q": "目前保存最完整的运河古闸是（　）。", "options": ["A. 澄清闸", "B. 海子闸", "C. 平津闸（高碑店闸）", "D. 万宁闸"], "answer": "C", "explain": "今平津闸（高碑店闸）是目前保存最完整的运河古闸。", "source": "保存最完整的运河古闸：今平津闸（高碑店闸）。"}, {"section": "大运河", "type": "single", "q": "北京现存规模最大、现状保存最完好的皇家仓廒是（　）。", "options": ["A. 南新仓", "B. 北新仓", "C. 富新仓", "D. 海运仓"], "answer": "A", "explain": "南新仓是北京现存规模最大、保存最完好的皇家仓廒，为明清两代储藏漕粮的“京仓”之一。", "source": "南新仓是北京现存规模最大、保存最完好的皇家仓廒（明清两代储藏漕粮的“京仓”之一）。"}, {"section": "大运河", "type": "single", "q": "银锭桥旁以烤肉闻名京华的餐饮老字号是（　）。", "options": ["A. 烤肉季", "B. 全聚德", "C. 便宜坊", "D. 砂锅居"], "answer": "A", "explain": "银锭桥旁以烤肉闻名京华的餐饮老字号为烤肉季（全称“烤肉季饭庄”）。", "source": "银锭桥旁以烤肉闻名京华的餐饮老字号：烤肉季（全称“烤肉季饭庄”）。"}, {"section": "中轴线", "type": "single", "q": "周武王封召公于燕所建、作为北京建城之始的城邑是（ ）。", "options": ["A. 蓟城", "B. 幽州城", "C. 南京城", "D. 金中都"], "answer": "A", "explain": "西周初年周武王封召公于燕，建蓟城，为北京建城之始。", "source": "北京地区最早的城市出现于西周初年（约公元前 11 世纪/公元前1045 年），周武王封召公于燕，建蓟城，为北京建城之始。"}, {"section": "中轴线", "type": "judge", "q": "北京地区最早的城市出现于西周初年，周武王封召公于燕，建蓟城，为北京建城之始。", "answer": "对", "explain": "原文：北京地区最早的城市出现于西周初年（约公元前11世纪/公元前1045年），周武王封召公于燕，建蓟城，为北京建城之始。", "source": "最早出现城市的时间：北京地区最早的城市出现于西周初年（约公元前 11 世纪/公元前1045 年），周武王封召公于燕，建蓟城，为北京建城之始。"}, {"section": "中轴线", "type": "multi", "q": "下列属于辽代\"五京\"的有（ ）。", "options": ["A. 上京", "B. 中京", "C. 东京", "D. 南京", "E. 北京"], "answer": "ABCD", "explain": "辽\"五京\"为上京、中京、东京、南京、西京，其中以北京地区为南京（又称燕京、析津府）；并无\"北京\"。", "source": "辽代以北京地区为南京（又称燕京、析津府），是辽\"五京\"（上京、中京、东京、南京、西京）之一。"}, {"section": "中轴线", "type": "single", "q": "北京城（尤其元大都、明清北京）的营造遵循（ ）\"左祖右社，面朝后市\"及中轴线对称的礼制原则。", "options": ["A. 《营造法式》", "B. 《周礼·考工记》", "C. 《梦溪笔谈》", "D. 《天工开物》"], "answer": "B", "explain": "北京城的营造遵循《周礼·考工记》\"左祖右社，面朝后市\"及中轴线对称的礼制原则。", "source": "北京城（尤其元大都、明清北京）的营造遵循《周礼·考工记》\"左祖右社，面朝后市\"及中轴线对称的礼制原则。"}, {"section": "中轴线", "type": "judge", "q": "辽代以北京地区为西京，是辽\"五京\"之一。", "answer": "错", "explain": "辽代以北京地区为南京（又称燕京、析津府），而非西京。", "source": "辽代以北京地区为南京（又称燕京、析津府），是辽\"五京\"（上京、中京、东京、南京、西京）之一。"}, {"section": "中轴线", "type": "single", "q": "北京中轴线始建于（ ）。", "options": ["A. 元至元四年（1267年）", "B. 元至元九年（1272年）", "C. 元至元二十二年（1285年）", "D. 明永乐十八年（1420年）"], "answer": "A", "explain": "北京中轴线始建于元代至元四年（1267年），始建大都，确立南北中轴线。1272年为钟鼓楼始建，1285年约为万宁桥始建，1420年为钟鼓楼重建。", "source": "北京中轴线始建于元代（至元四年，1267 年，始建大都），确立南北中轴线。"}, {"section": "中轴线", "type": "judge", "q": "中国历史上最早出现明确中轴线规划格局的是汉代长安城。", "answer": "错", "explain": "最早出现明确中轴线规划格局的是隋代大兴城（唐长安城），不是汉代长安城。", "source": "中国历史上最早出现明确中轴线规划格局的是隋代大兴城（唐长安城）；北京中轴线则承袭并发展了这一传统。"}, {"section": "中轴线", "type": "multi", "q": "北京中轴线集中表达的中华文明理念包括（ ）。", "options": ["A. 中正", "B. 中和", "C. 中庸", "D. 以中为尊、居中而治", "E. 重商抑农"], "answer": "ABCD", "explain": "北京中轴线集中表达了中华文明\"中正、中和、中庸\"的核心理念，以及\"天人合一、礼乐交融、尊卑有序、家国同构\"的宇宙观，体现\"以中为尊、居中而治\"的精神。", "source": "北京中轴线集中表达了中华文明\"中正、中和、中庸\"的核心理念，以及\"天人合一、礼乐交融、尊卑有序、家国同构\"的宇宙观与礼制秩序，体现\"以中为尊、居中而治\"的中华文明精神。"}, {"section": "中轴线", "type": "single", "q": "明清定型后的北京中轴线总长度约为（ ）。", "options": ["A. 3.75公里", "B. 5.8公里", "C. 7.8公里", "D. 10.2公里"], "answer": "C", "explain": "北京中轴线总长度（明清定型）约7.8公里（一说7.86公里）；3.75公里为元大都时期中轴线长度。", "source": "其总长度（明清定型）约 7.8 公里（一说 7.86 公里）。"}, {"section": "中轴线", "type": "judge", "q": "北京钟鼓楼于明永乐十八年（1420年）重建，清乾隆年间重修。", "answer": "对", "explain": "钟鼓楼始建于元至元九年（1272年），后毁；明永乐十八年（1420年）重建，清乾隆年间重修。", "source": "北京钟鼓楼始建于元至元九年（1272 年），后毁；明永乐十八年（1420 年）重建，清乾隆年间重修。"}, {"section": "中轴线", "type": "single", "q": "北京中轴线北起钟楼、鼓楼，南至（ ）。", "options": ["A. 正阳门", "B. 永定门", "C. 丽正门", "D. 天桥"], "answer": "B", "explain": "北京中轴线北起钟楼、鼓楼，向南经万宁桥、景山、故宫、端门、天安门、正阳门等，南至永定门。", "source": "北起钟楼、鼓楼，向南经万宁桥、景山、故宫（紫禁城）、端门、天安门……南至永定门。"}, {"section": "中轴线", "type": "judge", "q": "元大都时期的中轴线南起丽正门、北至钟鼓楼，长度约7.8公里。", "answer": "错", "explain": "元大都中轴线长度约3.75公里（一说3.9公里）；约7.8公里是明清定型后的中轴线总长度。", "source": "元大都中轴线南起丽正门、北至钟鼓楼，长度约3.75 公里（一说 3.9 公里），沿线有万宁桥、中心阁、鼓楼、钟楼及皇城宫殿。"}, {"section": "中轴线", "type": "multi", "q": "构成北京中轴线的古代建筑类型包括（ ）。", "options": ["A. 城门", "B. 桥梁", "C. 宫殿", "D. 坛庙", "E. 石窟"], "answer": "ABCD", "explain": "北京中轴线的古代建筑类型有城门、桥梁、宫殿、皇家园林、坛庙、城市广场、历史道路遗存等；无石窟。", "source": "城门（永定门、正阳门、天安门）、桥梁（万宁桥、外金水桥）、宫殿（故宫）、皇家园林（景山）、坛庙（太庙、社稷坛、天坛、先农坛）、城市广场（天安门广场建筑群）、历史道路遗存等多种类型。"}, {"section": "中轴线", "type": "single", "q": "天桥一带逐渐聚集民间艺人、杂耍、曲艺与商贩，形成平民游艺与商品市场，始于（ ）。", "options": ["A. 明永乐年间", "B. 清乾隆年间", "C. 清末同治、光绪年间", "D. 20世纪30年代"], "answer": "C", "explain": "天桥一带自清末同治、光绪年间（19世纪后半叶）逐渐形成平民游艺与商品市场，至民国初年达到鼎盛。", "source": "天桥一带自清末同治、光绪年间（19 世纪后半叶）逐渐聚集民间艺人、杂耍、曲艺与商贩，形成平民游艺与商品市场；至民国初年（1910 年代前后）达到鼎盛。"}, {"section": "中轴线", "type": "judge", "q": "北京鼓楼原设有大鼓24面、更鼓1面，用于报时。", "answer": "错", "explain": "鼓楼原设大鼓1面、更鼓24面，24面更鼓象征一年二十四节气。", "source": "鼓楼原设有大鼓 1 面、更鼓 24 面（用于报时），24 面象征一年二十四节气。"}, {"section": "中轴线", "type": "single", "q": "下列文学作品中，以天桥一带平民生活为背景、与北京中轴线存在直接关系的是（ ）。", "options": ["A. 老舍《龙须沟》", "B. 曹雪芹《红楼梦》", "C. 鲁迅《呐喊》", "D. 巴金《家》"], "answer": "A", "explain": "老舍的《龙须沟》以天桥一带平民生活为背景，天桥正位于中轴线南段平民区。", "source": "常指老舍的《龙须沟》（以天桥一带平民生活为背景，天桥正位于中轴线南段平民区），以及《茶馆》《四世同堂》等北京题材作品。"}, {"section": "中轴线", "type": "judge", "q": "景山于1928年辟为公园（景山公园）并向公众开放。", "answer": "对", "explain": "原文：景山于1928年辟为公园（景山公园）并向公众开放。", "source": "景山于 1928 年辟为公园（景山公园）并向公众开放。"}, {"section": "中轴线", "type": "multi", "q": "下列关于明清时期北京四重城功能的说法，正确的有（ ）。", "options": ["A. 宫城（紫禁城）为皇帝起居与朝政之所", "B. 皇城环绕宫城，设皇家园林、衙署、庙宇", "C. 内城为居民、衙署、市肆，普通官员与百姓主要聚居区", "D. 外城位于内城南面，以平民居住、商业为主，含天坛、先农坛", "E. 外城为皇帝祭天祈谷的专用区域"], "answer": "ABCD", "explain": "外城位于内城南面，以平民居住、商业（天桥、前门外大栅栏）为主，含天坛、先农坛，并非皇帝祭天专用区域。", "source": "1. 宫城（紫禁城）——皇帝起居与朝政之所……2. 皇城——环绕宫城，设皇家园林、衙署、庙宇……3. 内城——居民、衙署、市肆……4. 外城——位于内城南面，以平民居住、商业为主，含天坛、先农坛。"}, {"section": "中轴线", "type": "single", "q": "明代加筑外城、使北京中轴线由钟鼓楼至永定门全长约7.8公里定型的时间是（ ）。", "options": ["A. 明永乐十八年（1420年）", "B. 明正统四年（1439年）", "C. 明嘉靖三十二年（1553年）", "D. 明成化元年（1465年）"], "answer": "C", "explain": "明永乐年间营建北京、嘉靖三十二年（1553年）加筑外城后，中轴线定型，全长约7.8公里。", "source": "明永乐年间营建北京、嘉靖三十二年（1553 年）加筑外城后，中轴线定型，由钟鼓楼至永定门全长约 7.8 公里。"}, {"section": "中轴线", "type": "judge", "q": "社稷坛于1914年辟为中央公园，是北京最早由皇家坛庙转变为城市公园的园林。", "answer": "对", "explain": "社稷坛1914年辟为中央公园，1928年更名为中山公园，是中国最早开放的皇家坛庙园林。", "source": "社稷坛（明清皇家祭土谷之神之所）于 1914 年辟为中央公园，是北京最早由皇家坛庙转变为城市公园的园林；1928 年更名为中山公园。"}, {"section": "中轴线", "type": "single", "q": "北京中轴线上的几何与景观制高点是（ ）。", "options": ["A. 正阳门城楼", "B. 景山万春亭一带", "C. 钟鼓楼", "D. 天安门城楼"], "answer": "B", "explain": "景山（特别是景山万春亭一带）是北京中轴线上的几何与景观制高点，也是宫城北面的借景与风水屏障。", "source": "景山（特别是景山万春亭一带）是北京中轴线上的几何与景观制高点，也是宫城北面的借景与风水屏障。"}, {"section": "中轴线", "type": "judge", "q": "永定门箭楼于1958年拆除，城楼于1957年拆除。", "answer": "错", "explain": "永定门城楼于1958年拆除，箭楼于1957年拆除，题干将二者年代颠倒。", "source": "永定门城楼于 1958 年拆除，永定门箭楼于 1957 年拆除（2004—2005 年城楼依据旧貌复建）。"}, {"section": "中轴线", "type": "multi", "q": "下列北京中轴线坛庙与祭祀对象对应正确的有（ ）。", "options": ["A. 天坛——祭天", "B. 先农坛——祭农神（先农）", "C. 太庙——祭祖先", "D. 社稷坛——祭土神、谷神", "E. 太庙——祭天祈谷"], "answer": "ABCD", "explain": "天坛祭天、先农坛祭农神、太庙祭祖先（皇家宗庙）、社稷坛祭土神谷神；祭天祈谷属于天坛，不是太庙。", "source": "1. 天坛——祭天……2. 先农坛——祭农神（先农）并举行亲耕（耤田）典礼……3. 太庙——祭祖先……4. 社稷坛——祭土神、谷神。"}, {"section": "中轴线", "type": "single", "q": "北京中轴线列入《世界遗产名录》的时间是（ ）。", "options": ["A. 1987年12月", "B. 2008年8月", "C. 2014年6月", "D. 2024年7月"], "answer": "D", "explain": "北京中轴线于2024年7月列入《世界遗产名录》，是中国乃至世界现存最完整的传统都城中轴线。", "source": "北京中轴线（2024 年 7 月列入《世界遗产名录》，是中国乃至世界现存最完整的传统都城中轴线）。"}, {"section": "中轴线", "type": "judge", "q": "明清时期正阳门瓮城内，西北侧为观音庙，东南侧为关帝庙。", "answer": "错", "explain": "正阳门瓮城内西北侧为关帝庙（祭祀关羽），东南侧为观音庙（祭祀观音菩萨），题干方位颠倒。", "source": "明清时期正阳门（前门）瓮城内建有两座庙宇：西北侧为关帝庙（祭祀关羽），东南侧为观音庙（祭祀观音菩萨）。"}, {"section": "中轴线", "type": "single", "q": "北京中轴线遗产由（ ）处遗产构成要素组成。", "options": ["A. 12", "B. 15", "C. 18", "D. 20"], "answer": "B", "explain": "北京中轴线遗产由15处遗产构成要素组成，包括钟鼓楼、万宁桥、景山、故宫、端门、天安门、太庙、社稷坛、天坛、先农坛、永定门等。", "source": "北京中轴线遗产由 15 处遗产构成要素组成（钟鼓楼、万宁桥、景山、故宫、端门、天安门、外金水桥、太庙、社稷坛、天安门广场建筑群、正阳门、天坛、先农坛、永定门、中轴线南段道路遗存）。"}, {"section": "中轴线", "type": "judge", "q": "先农坛宰牲亭为重檐歇山顶，是国内现存唯一的明代重檐歇山顶建筑孤例。", "answer": "错", "explain": "先农坛宰牲亭为重檐悬山顶，是国内现存唯一的明代重檐悬山顶建筑孤例，不是歇山顶。", "source": "先农坛宰牲亭为重檐悬山顶，是国内现存唯一的明代重檐悬山顶建筑孤例。"}, {"section": "中轴线", "type": "multi", "q": "下列关于当代北京中轴线两次北延的说法，正确的有（ ）。", "options": ["A. 第一次北延为举办1990年第十一届北京亚运会", "B. 第一次北延延伸至亚运村/奥体中心一带", "C. 第二次北延为举办2008年第二十九届北京奥运会", "D. 第二次北延延伸至奥林匹克公园", "E. 第二次北延是为举办2010年上海世博会"], "answer": "ABCD", "explain": "两次北延分别为1990年北京亚运会（延至亚运村/奥体中心）和2008年北京奥运会（延至奥林匹克公园，含鸟巢、水立方及奥林匹克森林公园）；与上海世博会无关。", "source": "1. 第一次北延（1990 年前后）：为举办 1990 年第十一届北京亚运会……2. 第二次北延（2008 年前后）：为举办 2008 年第二十九届北京奥运会，中轴线进一步北延至奥林匹克公园。"}, {"section": "中轴线", "type": "single", "q": "北京钟楼的通高约为（ ）。", "options": ["A. 37.9米", "B. 47.9米", "C. 57.9米", "D. 63米"], "answer": "B", "explain": "北京钟楼通高约47.9米，砖石台基上建重檐歇山顶楼阁；63吨为所悬铜钟重量。", "source": "北京钟楼通高约 47.9 米（砖石台基上建重檐歇山顶楼阁）。"}, {"section": "中轴线", "type": "judge", "q": "正阳门于明正统四年（1439年）在城楼基础上增筑瓮城、箭楼及东西闸楼，形成完整瓮城防御体系。", "answer": "对", "explain": "正阳门明永乐十七年（1419年）改名并南移至今址；明正统四年（1439年）增筑瓮城、箭楼及东西闸楼。", "source": "明正统四年（1439 年）在城楼基础上增筑瓮城、箭楼及东西闸楼（形成完整瓮城防御体系），此后屡经修缮。"}, {"section": "中轴线", "type": "single", "q": "北京钟楼所悬铜钟的重量约为（ ）。", "options": ["A. 23吨", "B. 43吨", "C. 63吨", "D. 83吨"], "answer": "C", "explain": "钟楼所悬铜钟重约63吨，明永乐年间铸造，号称\"燕京古钟\"，为中国现存最重的大铜钟之一。", "source": "钟楼所悬铜钟重约 63 吨（明永乐年间铸造，号称\"燕京古钟\"，为中国现存最重的大铜钟之一）。"}, {"section": "中轴线", "type": "judge", "q": "辽代的南京即今北京地区，又称燕京、析津府。", "answer": "对", "explain": "辽代以北京地区为南京（又称燕京、析津府），是辽\"五京\"之一。", "source": "辽代以北京地区为南京（又称燕京、析津府），是辽\"五京\"（上京、中京、东京、南京、西京）之一。"}, {"section": "中轴线", "type": "multi", "q": "下列属于先农坛建筑群组成部分的有（ ）。", "options": ["A. 庆成宫", "B. 太岁殿", "C. 宰牲亭", "D. 观耕台", "E. 祈年殿"], "answer": "ABCD", "explain": "先农坛建筑群主要包括庆成宫、太岁殿、神厨、神库、宰牲亭、具服殿、观耕台、先农神坛、天神坛、地祇坛、斋宫等；祈年殿属天坛。", "source": "先农坛（北京古代建筑博物馆所在）建筑群主要包括庆成宫、太岁殿（前殿/拜殿）、神厨、神库、宰牲亭、具服殿、观耕台、先农神坛、天神坛、地祇坛、斋宫等。"}, {"section": "中轴线", "type": "single", "q": "北京钟鼓楼始建于（ ）。", "options": ["A. 元至元四年（1267年）", "B. 元至元九年（1272年）", "C. 元至元二十二年（1285年）", "D. 明永乐十七年（1419年）"], "answer": "B", "explain": "北京钟鼓楼始建于元至元九年（1272年），后毁；明永乐十八年（1420年）重建。", "source": "北京钟鼓楼始建于元至元九年（1272 年），后毁；明永乐十八年（1420 年）重建，清乾隆年间重修。"}, {"section": "中轴线", "type": "judge", "q": "北京城（尤其元大都、明清北京）的营造遵循《营造法式》\"左祖右社，面朝后市\"的礼制原则。", "answer": "错", "explain": "北京城营造遵循的是《周礼·考工记》\"左祖右社，面朝后市\"及中轴线对称的礼制原则，不是《营造法式》。", "source": "北京城（尤其元大都、明清北京）的营造遵循《周礼·考工记》\"左祖右社，面朝后市\"及中轴线对称的礼制原则。"}, {"section": "中轴线", "type": "single", "q": "北京中轴线上现存最古老的桥梁是（ ）。", "options": ["A. 外金水桥", "B. 内金水桥", "C. 万宁桥", "D. 卢沟桥"], "answer": "C", "explain": "万宁桥（又称海子桥、后门桥）建于元代，是北京中轴线上现存最古老的桥梁，也是大运河与中轴线的交汇点。", "source": "万宁桥（又称海子桥、后门桥），建于元代（约至元二十二年，1285 年前后），是北京中轴线上现存最古老的桥梁。"}, {"section": "中轴线", "type": "judge", "q": "明清北京的内城为居民、衙署、市肆所在，是普通官员与百姓的主要聚居区。", "answer": "对", "explain": "明清北京四重城中，内城为居民、衙署、市肆，普通官员与百姓主要聚居区。", "source": "3. 内城——居民、衙署、市肆，普通官员与百姓主要聚居区。"}, {"section": "中轴线", "type": "multi", "q": "新中国成立后，天安门广场经历的重大改扩建包括（ ）。", "options": ["A. 1950年代清理广场、建观礼台", "B. 1958—1959年建国十周年改扩建", "C. 1976—1977年毛主席纪念堂建设", "D. 1999年广场铺装与布局调整", "E. 2008年为迎奥运重建人民大会堂"], "answer": "ABCD", "explain": "天安门广场通常概括为四次重大改扩建：1950年代、1958—1959年、1976—1977年、1999年；无2008年重建人民大会堂之事。", "source": "新中国成立后，天安门广场经历了多次（通常概括为四次重大）改扩建：1950 年代（清理广场、建观礼台）、1958—1959 年（建国十周年改扩建……）、1976—1977 年（毛主席纪念堂建设）、1999 年（广场铺装与布局调整）等。"}, {"section": "中轴线", "type": "single", "q": "主持通惠河工程、与万宁桥兴建相关的水利专家是（ ）。", "options": ["A. 郭守敬", "B. 李春", "C. 蒯祥", "D. 样式雷"], "answer": "A", "explain": "万宁桥建于约至元二十二年（1285年前后），郭守敬主持通惠河工程时建。", "source": "万宁桥（又称海子桥、后门桥），建于元代（约至元二十二年，1285 年前后，郭守敬主持通惠河工程时建）。"}, {"section": "中轴线", "type": "judge", "q": "北京钟楼所悬铜钟重约47.9吨，号称\"燕京古钟\"。", "answer": "错", "explain": "钟楼所悬铜钟重约63吨；47.9米是钟楼的通高，题干将高度数值错置为重量。", "source": "钟楼所悬铜钟重约 63 吨（明永乐年间铸造，号称\"燕京古钟\"，为中国现存最重的大铜钟之一）。"}, {"section": "中轴线", "type": "single", "q": "中山公园内由圆明园移来的著名山石是（ ）。", "options": ["A. 青芝岫", "B. 青云片", "C. 冠云峰", "D. 皱云峰"], "answer": "B", "explain": "中山公园内由圆明园移来的著名山石为青云片，原属圆明园\"别有洞天\"景区遗石。", "source": "中山公园内由圆明园移来的著名山石为青云片（原属圆明园\"别有洞天\"景区遗石，后迁至中山公园）。"}, {"section": "中轴线", "type": "judge", "q": "万宁桥横跨通惠河入积水潭处，是世界文化遗产大运河与北京中轴线的交汇点。", "answer": "对", "explain": "万宁桥是大运河（通惠河终点）与北京中轴线的交汇点，通惠河东端止于积水潭（今什刹海）。", "source": "万宁桥正是世界文化遗产大运河（通惠河终点）与北京中轴线的交汇点——通惠河东端止于积水潭（今什刹海），万宁桥横跨通惠河入积水潭处。"}, {"section": "中轴线", "type": "multi", "q": "永定门内\"中轴历史道路遗存\"考古揭示的依次叠压道路所涉时代包括（ ）。", "options": ["A. 唐幽州", "B. 辽南京", "C. 金中都", "D. 元大都", "E. 秦代蓟城"], "answer": "ABCD", "explain": "考古揭示出自唐幽州、辽南京、金中都、元大都、明、清至近现代7条道路依次叠压（编号L1—L7）；不含秦代。", "source": "永定门内\"中轴历史道路遗存\"经考古发掘，揭示出自唐幽州、辽南京、金中都、元大都、明、清至近现代 7 条道路依次叠压（编号为 L1—L7）。"}, {"section": "中轴线", "type": "single", "q": "中山公园内\"保卫和平坊\"坊额\"保卫和平\"四字的题写者是（ ）。", "options": ["A. 毛泽东", "B. 郭沫若", "C. 徐悲鸿", "D. 齐白石"], "answer": "B", "explain": "\"保卫和平\"四字由郭沫若题写；该坊原为\"克林德碑\"，后改\"公理战胜坊\"，1952年改称\"保卫和平坊\"。", "source": "中山公园内\"保卫和平坊\"坊额\"保卫和平\"四字由郭沫若题写（该坊原为\"克林德碑\"，后改\"公理战胜坊\"，1952 年改称\"保卫和平坊\"）。"}, {"section": "中轴线", "type": "judge", "q": "四处坛庙中，天坛位于中轴线东侧外城，先农坛位于中轴线西侧外城。", "answer": "对", "explain": "天坛位于中轴线东侧外城，先农坛位于中轴线西侧外城，符合\"左祖右社\"等礼制布局。", "source": "1. 天坛——祭天（皇帝祭天祈谷，位于中轴线东侧外城）。2. 先农坛——祭农神（先农）并举行亲耕（耤田）典礼（位于中轴线西侧外城）。"}, {"section": "中轴线", "type": "single", "q": "太庙内围墙（红墙）内自南向北依次为戟门、享殿、寝殿、祧庙，其中面阔十一间、为祭祖主殿的是（ ）。", "options": ["A. 戟门", "B. 享殿", "C. 寝殿", "D. 祧庙"], "answer": "B", "explain": "享殿（前殿）为面阔十一间的最高规制大殿，是祭祖主殿；寝殿供奉历代帝后神主，祧庙供奉远祖。", "source": "太庙内围墙（红墙）内自南向北依次为戟门（庙门）、享殿（前殿/大殿）、寝殿（中殿）、祧庙（后殿）；其中享殿（前殿）为面阔十一间的最高规制大殿，是祭祖主殿。"}, {"section": "中轴线", "type": "judge", "q": "为举办2008年第二十九届北京奥运会，北京中轴线首次向北延伸。", "answer": "错", "explain": "首次北延是为1990年第十一届北京亚运会（延至亚运村/奥体中心）；2008年奥运会为第二次北延，延至奥林匹克公园。", "source": "1. 第一次北延（1990 年前后）：为举办 1990 年第十一届北京亚运会……2. 第二次北延（2008 年前后）：为举办 2008 年第二十九届北京奥运会。"}, {"section": "中轴线", "type": "multi", "q": "下列关于端门的说法，正确的有（ ）。", "options": ["A. 位于天安门之北、故宫午门之南", "B. 明清时主要用于存放皇帝卤簿（仪仗）", "C. 城楼为重檐歇山顶、面阔九间", "D. 城楼等级仅次于故宫太和殿的重檐庑殿顶", "E. 是明清北京内城的正门"], "answer": "ABCD", "explain": "端门位于天安门之北、故宫午门之南，是皇城的重要门户，明清时用于存放皇帝卤簿、作为朝会大典时官员集合与禁卫之所；城楼重檐歇山顶、面阔九间，等级仅次于太和殿重檐庑殿顶。皇城正门为天安门，端门并非内城正门。", "source": "端门位于天安门之北、故宫午门之南，是皇城的重要门户，明清时主要用于存放皇帝卤簿（仪仗）……端门城楼为重檐歇山顶，面阔九间，等级仅次于故宫太和殿的重檐庑殿顶。"}, {"section": "中轴线", "type": "single", "q": "端门城楼的屋顶建筑规制为（ ）。", "options": ["A. 重檐庑殿顶", "B. 重檐歇山顶", "C. 重檐悬山顶", "D. 单檐攒尖顶"], "answer": "B", "explain": "端门城楼为重檐歇山顶，面阔九间，等级仅次于故宫太和殿的重檐庑殿顶，与天安门城楼规制相当；端门明清时主要用于存放皇帝卤簿（仪仗）。", "source": "端门城楼为重檐歇山顶，面阔九间，等级仅次于故宫太和殿的重檐庑殿顶，与天安门城楼规制相当。"}, {"section": "中轴线", "type": "judge", "q": "中山公园\"保卫和平坊\"原为\"克林德碑\"，后改\"公理战胜坊\"，1952年改称\"保卫和平坊\"。", "answer": "对", "explain": "该坊原为\"克林德碑\"，后改\"公理战胜坊\"，1952年改称\"保卫和平坊\"，坊额四字由郭沫若题写。", "source": "中山公园内\"保卫和平坊\"坊额\"保卫和平\"四字由郭沫若题写（该坊原为\"克林德碑\"，后改\"公理战胜坊\"，1952 年改称\"保卫和平坊\"）。"}, {"section": "中轴线", "type": "single", "q": "天安门外外金水桥由木桥改建为汉白玉石桥的时间是（ ）。", "options": ["A. 明永乐十八年（1420年）", "B. 明正统四年（1439年）", "C. 明成化元年（1465年）", "D. 明嘉靖三十二年（1553年）"], "answer": "C", "explain": "外金水桥于明永乐年间（约1420年）始建为木桥，明成化元年（1465年）改建为汉白玉石桥（七座）。", "source": "天安门外外金水桥于明永乐年间（与天安门同时，约 1420 年）始建为木桥，后于明成化元年（1465 年）改建为汉白玉石桥（七座）。"}, {"section": "中轴线", "type": "judge", "q": "外金水桥改建为汉白玉石桥后共七座，对应天安门五门洞及两侧；内金水桥位于故宫午门前。", "answer": "对", "explain": "外金水桥明成化元年（1465年）改建为汉白玉石桥七座，对应天安门五门洞及两侧；内金水桥位于故宫午门前。", "source": "后于明成化元年（1465 年）改建为汉白玉石桥（七座，对应天安门五门洞及两侧）；内金水桥位于故宫午门前。"}, {"section": "中轴线", "type": "multi", "q": "下列属于北京中轴线15处遗产构成要素的有（ ）。", "options": ["A. 万宁桥", "B. 太庙", "C. 先农坛", "D. 永定门", "E. 颐和园"], "answer": "ABCD", "explain": "15处遗产构成要素为钟鼓楼、万宁桥、景山、故宫、端门、天安门、外金水桥、太庙、社稷坛、天安门广场建筑群、正阳门、天坛、先农坛、永定门、中轴线南段道路遗存；颐和园不在其中。", "source": "北京中轴线遗产由 15 处遗产构成要素组成（钟鼓楼、万宁桥、景山、故宫、端门、天安门、外金水桥、太庙、社稷坛、天安门广场建筑群、正阳门、天坛、先农坛、永定门、中轴线南段道路遗存）。"}, {"section": "中轴线", "type": "single", "q": "北京中轴线上规模最大、形制等级最高的城门建筑是（ ）。", "options": ["A. 永定门", "B. 正阳门", "C. 端门", "D. 天安门"], "answer": "D", "explain": "天安门（明清皇城正门）是北京中轴线上形制等级最高、规模最大的城门建筑，重檐歇山顶、面阔九间、黄琉璃瓦。", "source": "天安门（明清皇城正门）是北京中轴线上形制等级最高、规模最大的城门建筑（重檐歇山顶、面阔九间，黄琉璃瓦，为皇城正门之制）。"}, {"section": "中轴线", "type": "judge", "q": "太庙今为劳动人民文化宫，是中国保存最完整、规模最大的皇家祭祖建筑群。", "answer": "对", "explain": "太庙（今劳动人民文化宫）是明清两代皇帝祭祖的宗庙，规制最高、保存最完整。", "source": "太庙（今劳动人民文化宫），是明清两代皇帝祭祖的宗庙，规制最高、保存最完整。"}, {"section": "中轴线", "type": "single", "q": "永定门外燕墩四体方碑的立碑时间是（ ）。", "options": ["A. 康熙二十二年（1683年）", "B. 雍正八年（1730年）", "C. 乾隆十八年（1753年）", "D. 嘉庆元年（1796年）"], "answer": "C", "explain": "燕墩方碑四面刻清乾隆皇帝御制《皇都篇》与《帝都篇》，由乾隆亲笔御书，立碑于乾隆十八年（1753年）。", "source": "永定门外燕墩上的方碑，四面刻清乾隆皇帝御制《皇都篇》与《帝都篇》……碑文由清乾隆皇帝亲笔御书（立碑于乾隆十八年，1753 年）。"}, {"section": "中轴线", "type": "judge", "q": "永定门城楼拆除后，于2004—2005年依据旧貌复建。", "answer": "对", "explain": "永定门城楼1958年拆除、箭楼1957年拆除，2004—2005年城楼依据旧貌复建。", "source": "永定门城楼于 1958 年拆除，永定门箭楼于 1957 年拆除（2004—2005 年城楼依据旧貌复建）。"}, {"section": "中轴线", "type": "multi", "q": "下列关于北京建城之始的说法，正确的有（ ）。", "options": ["A. 最早的城市出现于西周初年", "B. 约为公元前1045年", "C. 周武王封召公于燕", "D. 所建城邑为蓟城", "E. 最早的城市出现于春秋时期"], "answer": "ABCD", "explain": "北京地区最早的城市出现于西周初年（约公元前11世纪/公元前1045年），周武王封召公于燕，建蓟城，为北京建城之始。", "source": "北京地区最早的城市出现于西周初年（约公元前 11 世纪/公元前1045 年），周武王封召公于燕，建蓟城，为北京建城之始。"}, {"section": "中轴线", "type": "single", "q": "先农坛历史上最后一次皇帝亲耕（祭祀先农）的时间是（ ）。", "options": ["A. 清乾隆年间", "B. 清道光二十年（1840年）", "C. 清光绪三十三年（1907年）", "D. 清宣统三年（1911年）"], "answer": "C", "explain": "清光绪三十三年（1907年）光绪帝亲行耤田礼，为清朝也是中国历史上最后一次皇帝亲耕。", "source": "清光绪三十三年（1907 年）光绪帝亲行耤田礼，为清朝也是中国历史上最后一次皇帝亲耕（祭祀先农）。"}, {"section": "中轴线", "type": "judge", "q": "太庙内围墙里的寝殿供奉远祖，祧庙供奉历代帝后神主。", "answer": "错", "explain": "太庙寝殿供奉历代帝后神主，祧庙供奉远祖，题干将二者供奉对象颠倒。", "source": "其中享殿（前殿）为面阔十一间的最高规制大殿，是祭祖主殿，寝殿供奉历代帝后神主，祧庙供奉远祖。"}, {"section": "中轴线", "type": "single", "q": "辽代\"五京\"之中，以北京地区为其一的是（ ）。", "options": ["A. 南京", "B. 东京", "C. 西京", "D. 中京"], "answer": "A", "explain": "辽代以北京地区为南京（又称燕京、析津府），是辽\"五京\"之一。", "source": "辽代以北京地区为南京（又称燕京、析津府），是辽\"五京\"（上京、中京、东京、南京、西京）之一。"}, {"section": "中轴线", "type": "multi", "q": "北京中轴线所表达的中华文明宇宙观与礼制秩序包括（ ）。", "options": ["A. 天人合一", "B. 礼乐交融", "C. 尊卑有序", "D. 家国同构", "E. 逐水草而居"], "answer": "ABCD", "explain": "北京中轴线集中表达\"中正、中和、中庸\"核心理念及\"天人合一、礼乐交融、尊卑有序、家国同构\"的宇宙观与礼制秩序。", "source": "以及\"天人合一、礼乐交融、尊卑有序、家国同构\"的宇宙观与礼制秩序。"}, {"section": "中轴线", "type": "single", "q": "中国历史上最早出现明确中轴线规划格局的都城是（ ）。", "options": ["A. 隋代大兴城", "B. 汉代长安城", "C. 北宋东京城", "D. 明代南京城"], "answer": "A", "explain": "中国历史上最早出现明确中轴线规划格局的是隋代大兴城（唐长安城）；北京中轴线承袭并发展了这一传统。", "source": "中国历史上最早出现明确中轴线规划格局的是隋代大兴城（唐长安城）；北京中轴线则承袭并发展了这一传统。"}, {"section": "中轴线", "type": "single", "q": "北京中轴线集中体现了\"（ ）\"的中华文明精神。", "options": ["A. 以中为尊、居中而治", "B. 依山傍水、因地制宜", "C. 崇文抑武、重文轻商", "D. 海纳百川、兼容并蓄"], "answer": "A", "explain": "北京中轴线集中表达\"中正、中和、中庸\"核心理念，体现\"以中为尊、居中而治\"的中华文明精神。", "source": "体现\"以中为尊、居中而治\"的中华文明精神。"}, {"section": "中轴线", "type": "multi", "q": "明清定型的北京中轴线自北向南沿线经过的建筑与遗存包括（ ）。", "options": ["A. 万宁桥", "B. 端门", "C. 外金水桥", "D. 正阳门", "E. 卢沟桥"], "answer": "ABCD", "explain": "中轴线北起钟楼、鼓楼，向南经万宁桥、景山、故宫、端门、天安门、外金水桥、天安门广场建筑群、正阳门、中轴线南段道路遗存，南至永定门；卢沟桥不在中轴线上。", "source": "北起钟楼、鼓楼，向南经万宁桥、景山、故宫（紫禁城）、端门、天安门、外金水桥、天安门广场建筑群、正阳门、中轴线南段道路遗存，南至永定门。"}, {"section": "中轴线", "type": "single", "q": "元大都时期中轴线的长度约为（ ）。", "options": ["A. 1.5公里", "B. 3.75公里", "C. 5.5公里", "D. 7.8公里"], "answer": "B", "explain": "元大都中轴线南起丽正门、北至钟鼓楼，长度约3.75公里（一说3.9公里）；7.8公里为明清定型后的总长度。", "source": "元大都中轴线南起丽正门、北至钟鼓楼，长度约3.75 公里（一说 3.9 公里）。"}, {"section": "中轴线", "type": "single", "q": "元大都中轴线南起（ ），北至钟鼓楼。", "options": ["A. 永定门", "B. 正阳门", "C. 丽正门", "D. 天安门"], "answer": "C", "explain": "元大都中轴线南起丽正门、北至钟鼓楼；永定门、正阳门为明清城南门，天安门为明清皇城正门。", "source": "元大都中轴线南起丽正门、北至钟鼓楼，长度约3.75 公里（一说 3.9 公里）。"}, {"section": "中轴线", "type": "multi", "q": "元大都时期中轴线沿线的建筑包括（ ）。", "options": ["A. 万宁桥", "B. 中心阁", "C. 钟楼", "D. 太庙", "E. 皇城宫殿"], "answer": "ABCE", "explain": "元大都中轴线沿线有万宁桥、中心阁、鼓楼、钟楼及皇城宫殿；太庙为明清皇家宗庙，不在元大都中轴线沿线列举中。", "source": "沿线有万宁桥、中心阁、鼓楼、钟楼及皇城宫殿。"}, {"section": "中轴线", "type": "single", "q": "元大都中轴线沿线建筑包括万宁桥、（ ）、鼓楼、钟楼及皇城宫殿。", "options": ["A. 中心阁", "B. 太和殿", "C. 午门", "D. 正阳门"], "answer": "A", "explain": "元大都中轴线沿线有万宁桥、中心阁、鼓楼、钟楼及皇城宫殿；太和殿、午门、正阳门均为明清建筑。", "source": "沿线有万宁桥、中心阁、鼓楼、钟楼及皇城宫殿。"}, {"section": "中轴线", "type": "single", "q": "除《龙须沟》外，原文所列与北京中轴线存在直接关系的老舍北京题材作品还有（ ）。", "options": ["A. 《茶馆》", "B. 《围城》", "C. 《边城》", "D. 《子夜》"], "answer": "A", "explain": "与中轴线直接关系的文学作品常指老舍的《龙须沟》以及《茶馆》《四世同堂》等北京题材作品。", "source": "常指老舍的《龙须沟》……以及《茶馆》《四世同堂》等北京题材作品。"}, {"section": "中轴线", "type": "multi", "q": "2008年前后北京中轴线第二次北延至奥林匹克公园，沿线新增的国家礼仪空间包括（ ）。", "options": ["A. 国家体育场\"鸟巢\"", "B. 国家游泳中心\"水立方\"", "C. 奥林匹克森林公园", "D. 亚运村", "E. 奥体中心"], "answer": "ABC", "explain": "第二次北延（2008年前后）延至奥林匹克公园，含国家体育场\"鸟巢\"、国家游泳中心\"水立方\"及奥林匹克森林公园；亚运村、奥体中心为第一次北延（1990年亚运会）所至。", "source": "中轴线进一步北延至奥林匹克公园（国家体育场\"鸟巢\"、国家游泳中心\"水立方\"及奥林匹克森林公园）。"}, {"section": "中轴线", "type": "single", "q": "北京鼓楼原设更鼓24面，其寓意是象征（ ）。", "options": ["A. 一年二十四节气", "B. 一天十二时辰", "C. 三十六天罡", "D. 一年十二个月"], "answer": "A", "explain": "鼓楼原设大鼓1面、更鼓24面用于报时，24面象征一年二十四节气。", "source": "鼓楼原设有大鼓 1 面、更鼓 24 面（用于报时），24 面象征一年二十四节气。"}, {"section": "中轴线", "type": "single", "q": "北京钟楼在砖石台基上所建楼阁的屋顶形式为（ ）。", "options": ["A. 重檐庑殿顶", "B. 重檐歇山顶", "C. 重檐悬山顶", "D. 单檐攒尖顶"], "answer": "B", "explain": "北京钟楼通高约47.9米，砖石台基上建重檐歇山顶楼阁。", "source": "北京钟楼通高约 47.9 米（砖石台基上建重檐歇山顶楼阁）。"}, {"section": "中轴线", "type": "multi", "q": "下列关于北京钟鼓楼的说法，正确的有（ ）。", "options": ["A. 始建于元至元九年（1272年）", "B. 明永乐十八年（1420年）重建", "C. 清乾隆年间重修", "D. 钟楼通高约47.9米", "E. 鼓楼通高约63米"], "answer": "ABCD", "explain": "钟鼓楼始建于元至元九年（1272年），明永乐十八年（1420年）重建，清乾隆年间重修；钟楼通高约47.9米，63吨为铜钟重量而非鼓楼高度。", "source": "北京钟鼓楼始建于元至元九年（1272 年），后毁；明永乐十八年（1420 年）重建，清乾隆年间重修。北京钟楼通高约 47.9 米。"}, {"section": "中轴线", "type": "single", "q": "北京中轴线上现存最古老的桥梁万宁桥，又称（ ）。", "options": ["A. 海子桥、后门桥", "B. 银锭桥、后门桥", "C. 金水桥、海子桥", "D. 卢沟桥、银锭桥"], "answer": "A", "explain": "万宁桥又称海子桥、后门桥，建于元代，是北京中轴线上现存最古老的桥梁。", "source": "万宁桥（又称海子桥、后门桥），建于元代（约至元二十二年，1285 年前后），是北京中轴线上现存最古老的桥梁。"}, {"section": "中轴线", "type": "single", "q": "大运河通惠河的东端止于（ ），万宁桥即横跨通惠河入该处。", "options": ["A. 昆明湖", "B. 积水潭（今什刹海）", "C. 北海", "D. 筒子河"], "answer": "B", "explain": "通惠河东端止于积水潭（今什刹海），万宁桥横跨通惠河入积水潭处，同时位于中轴线上。", "source": "通惠河东端止于积水潭（今什刹海），万宁桥横跨通惠河入积水潭处，同时位于中轴线上。"}, {"section": "中轴线", "type": "multi", "q": "下列关于中山公园的说法，正确的有（ ）。", "options": ["A. 前身为社稷坛，1914年辟为中央公园", "B. 1928年更名为中山公园", "C. 是中国最早开放的皇家坛庙园林", "D. 园内山石青云片由圆明园移来", "E. \"保卫和平\"坊额由齐白石题写"], "answer": "ABCD", "explain": "社稷坛1914年辟为中央公园，1928年更名中山公园，为中国最早开放的皇家坛庙园林；青云片原属圆明园\"别有洞天\"景区遗石；\"保卫和平\"四字由郭沫若题写，非齐白石。", "source": "社稷坛于 1914 年辟为中央公园……1928 年更名为中山公园，是为中国最早开放的皇家坛庙园林。青云片（原属圆明园\"别有洞天\"景区遗石）。郭沫若题写。"}, {"section": "中轴线", "type": "single", "q": "社稷坛1914年辟为中央公园后，于（ ）更名为中山公园。", "options": ["A. 1919年", "B. 1924年", "C. 1928年", "D. 1935年"], "answer": "C", "explain": "社稷坛1914年辟为中央公园，1928年更名为中山公园，是中国最早开放的皇家坛庙园林。", "source": "社稷坛于 1914 年辟为中央公园……1928 年更名为中山公园，是为中国最早开放的皇家坛庙园林。"}, {"section": "中轴线", "type": "single", "q": "皇家宗庙太庙位于天安门的（ ）。", "options": ["A. 东侧", "B. 西侧", "C. 南侧", "D. 北侧"], "answer": "A", "explain": "太庙祭祖先，位于天安门东侧；社稷坛位于天安门西侧，体现\"左祖右社\"。", "source": "3. 太庙——祭祖先（皇家宗庙，供奉历代帝后神主，位于天安门东侧）。"}, {"section": "中轴线", "type": "multi", "q": "下列关于先农坛的说法，正确的有（ ）。", "options": ["A. 是北京古代建筑博物馆所在地", "B. 宰牲亭为国内现存唯一的明代重檐悬山顶建筑孤例", "C. 清光绪三十三年（1907年）光绪帝亲行耤田礼为最后一次皇帝亲耕", "D. 皇帝亲耕（祭祀先农）止于1907年", "E. 最后一次皇帝亲祭先农在清宣统三年（1911年）"], "answer": "ABCD", "explain": "先农坛为北京古代建筑博物馆所在；宰牲亭为重檐悬山顶孤例；1907年光绪帝亲行耤田礼为最后一次皇帝亲耕，此后祭农礼仪渐废（敬祀制度名义延续至1911年，但皇帝亲祭止于1907年）。", "source": "清光绪三十三年（1907 年）光绪帝亲行耤田礼，为清朝也是中国历史上最后一次皇帝亲耕（祭祀先农）；此后祭农礼仪渐废……皇帝亲祭止于 1907 年。"}, {"section": "中轴线", "type": "single", "q": "端门的位置在（ ）。", "options": ["A. 天安门之南、正阳门之北", "B. 天安门之北、故宫午门之南", "C. 故宫午门之北、太和殿之南", "D. 正阳门之南、永定门之北"], "answer": "B", "explain": "端门位于天安门之北、故宫午门之南，是皇城的重要门户，为宫城前导门户。", "source": "端门位于天安门之北、故宫午门之南，是皇城的重要门户……为宫城前导门户。"}, {"section": "中轴线", "type": "single", "q": "明清时期，端门的主要用途是（ ）。", "options": ["A. 皇帝祭天祈谷", "B. 存放皇帝卤簿（仪仗）、大驾法驾", "C. 悬挂大鼓报时", "D. 皇帝亲耕耤田"], "answer": "B", "explain": "端门明清时主要用于存放皇帝卤簿（仪仗）、大驾法驾，并作为朝会、大典时官员集合与禁卫之所。", "source": "明清时主要用于存放皇帝卤簿（仪仗）、大驾法驾及作为朝会、大典时官员集合与禁卫之所。"}, {"section": "中轴线", "type": "multi", "q": "下列北京中轴线四处坛庙与其位置对应正确的有（ ）。", "options": ["A. 天坛——中轴线东侧外城", "B. 先农坛——中轴线西侧外城", "C. 太庙——天安门东侧", "D. 社稷坛——天安门西侧", "E. 太庙——天安门西侧"], "answer": "ABCD", "explain": "天坛位于中轴线东侧外城，先农坛位于中轴线西侧外城，太庙位于天安门东侧，社稷坛位于天安门西侧；太庙在西侧的说法错误。", "source": "天坛——祭天（……位于中轴线东侧外城）。先农坛——……（位于中轴线西侧外城）。太庙——祭祖先（……位于天安门东侧）。社稷坛——祭土神、谷神（……位于天安门西侧）。"}, {"section": "中轴线", "type": "single", "q": "新中国成立后，天安门广场经历的重大改扩建通常概括为（ ）次。", "options": ["A. 二次", "B. 三次", "C. 四次", "D. 五次"], "answer": "C", "explain": "天安门广场经历多次改扩建，通常概括为四次重大改扩建：1950年代、1958—1959年、1976—1977年、1999年。", "source": "新中国成立后，天安门广场经历了多次（通常概括为四次重大）改扩建……"}, {"section": "中轴线", "type": "single", "q": "永定门内\"中轴历史道路遗存\"经考古揭示出自唐幽州至近现代依次叠压的道路共（ ）条。", "options": ["A. 5条", "B. 6条", "C. 7条", "D. 9条"], "answer": "C", "explain": "考古揭示自唐幽州、辽南京、金中都、元大都、明、清至近现代7条道路依次叠压，编号L1—L7。", "source": "揭示出自唐幽州、辽南京、金中都、元大都、明、清至近现代 7 条道路依次叠压（编号为 L1—L7）。"}, {"section": "中轴线", "type": "single", "q": "永定门城楼被拆除的年代是（ ）。", "options": ["A. 1957年", "B. 1958年", "C. 1966年", "D. 1976年"], "answer": "B", "explain": "永定门城楼于1958年拆除，箭楼于1957年拆除，2004—2005年城楼依据旧貌复建。", "source": "永定门城楼于 1958 年拆除，永定门箭楼于 1957 年拆除。"}, {"section": "中轴线", "type": "single", "q": "正阳门（元称丽正门）改名正阳门并南移至今址的时间是（ ）。", "options": ["A. 元至元九年（1272年）", "B. 明永乐十七年（1419年）", "C. 明正统四年（1439年）", "D. 明嘉靖三十二年（1553年）"], "answer": "B", "explain": "正阳门于明永乐十七年（1419年）改名并南移至今址；明正统四年（1439年）增筑瓮城、箭楼及东西闸楼。", "source": "正阳门（元称丽正门）于明永乐十七年（1419 年）改名正阳门并南移至今址。"}, {"section": "中轴线", "type": "single", "q": "先农坛现为（ ）所在地。", "options": ["A. 中国国家博物馆", "B. 故宫博物院", "C. 北京古代建筑博物馆", "D. 首都博物馆"], "answer": "C", "explain": "先农坛为北京古代建筑博物馆所在，建筑群包括庆成宫、太岁殿、宰牲亭、观耕台等。", "source": "先农坛（北京古代建筑博物馆所在）建筑群主要包括庆成宫、太岁殿……等。"}, {"section": "中轴线", "type": "single", "q": "先农坛宰牲亭的屋顶建筑规制为（ ）。", "options": ["A. 重檐庑殿顶", "B. 重檐歇山顶", "C. 重檐悬山顶", "D. 单檐硬山顶"], "answer": "C", "explain": "先农坛宰牲亭为重檐悬山顶，是国内现存唯一的明代重檐悬山顶建筑孤例。", "source": "先农坛宰牲亭为重檐悬山顶，是国内现存唯一的明代重檐悬山顶建筑孤例。"}, {"section": "中轴线", "type": "single", "q": "天桥一带成为老北京最著名的平民游乐与市集区、达到鼎盛的时期是（ ）。", "options": ["A. 明永乐年间", "B. 清乾隆年间", "C. 清同治年间", "D. 民国初年（1910年代前后）"], "answer": "D", "explain": "天桥自清末同治、光绪年间逐渐聚集民间艺人与商贩，至民国初年（1910年代前后）达到鼎盛。", "source": "至民国初年（1910 年代前后）达到鼎盛，成为老北京最著名的平民游乐与市集区。"}, {"section": "中轴线", "type": "single", "q": "明清北京四重城中，以平民居住、商业为主且含天坛、先农坛的是（ ）。", "options": ["A. 宫城", "B. 皇城", "C. 内城", "D. 外城"], "answer": "D", "explain": "外城位于内城南面，以平民居住、商业（天桥、前门外大栅栏）为主，含天坛、先农坛。", "source": "4. 外城——位于内城南面，以平民居住、商业（天桥、前门外大栅栏）为主，含天坛、先农坛。"}, {"section": "中轴线", "type": "single", "q": "社稷坛的祭祀对象是（ ）。", "options": ["A. 天神", "B. 祖先", "C. 土神、谷神", "D. 农神（先农）"], "answer": "C", "explain": "社稷坛祭土神、谷神，象征江山社稷，位于天安门西侧。", "source": "4. 社稷坛——祭土神、谷神（象征江山社稷，位于天安门西侧）。"}, {"section": "中轴线", "type": "single", "q": "景山作为北京中轴线上的制高点，同时是宫城北面的（ ）。", "options": ["A. 军事瞭望台", "B. 借景与风水屏障", "C. 皇家祭坛", "D. 报时中心"], "answer": "B", "explain": "景山（特别是景山万春亭一带）是中轴线上的几何与景观制高点，也是宫城北面的借景与风水屏障。", "source": "景山（特别是景山万春亭一带）是北京中轴线上的几何与景观制高点，也是宫城北面的借景与风水屏障。"}, {"section": "恭王府", "type": "single", "q": "称恭王府为“一座恭王府，半部清代史”的著名学者是（　）。", "options": ["A. 侯仁之", "B. 郭沫若", "C. 启骧", "D. 张伯驹"], "answer": "A", "explain": "此说出自著名历史地理学家侯仁之。", "source": "称恭王府为“一座恭王府，半部清代史”的著名学者是侯仁之（著名历史地理学家）。"}, {"section": "恭王府", "type": "judge", "q": "称恭王府为“一座恭王府，半部清代史”的著名学者是历史地理学家侯仁之。", "answer": "对", "explain": "与原文一致：侯仁之，著名历史地理学家。", "source": "称恭王府为“一座恭王府，半部清代史”的著名学者是侯仁之（著名历史地理学家）。"}, {"section": "恭王府", "type": "multi", "q": "恭王府的历任主人包括（　）。", "options": ["A. 和珅", "B. 庆亲王永璘", "C. 恭亲王奕訢", "D. 醇亲王奕譞"], "answer": "ABC", "explain": "历任主人为和珅、庆亲王永璘、恭亲王奕訢；醇亲王奕譞的府邸在后海北沿，非恭王府主人。", "source": "和珅（乾隆朝权臣，宅第始建于乾隆四十一年，1776年）为其最初主人；庆亲王永璘……称“庆王府”；恭亲王奕訢……始称“恭王府”。"}, {"section": "恭王府", "type": "single", "q": "恭王府的名称由来是（　）。", "options": ["A. 因和珅而得名", "B. 因庆亲王永璘而得名", "C. 因恭亲王奕訢而得名", "D. 因醇亲王而得名"], "answer": "C", "explain": "因恭亲王奕訢而得名，此前曾为和珅宅第、庆王府。", "source": "名称由来：因恭亲王奕訢而得名。咸丰二年（1852年），奕訢迁入此宅，自此该宅第称为“恭王府”。此前它曾为和珅宅第、庆王府。"}, {"section": "恭王府", "type": "judge", "q": "恭王府于2012年被评定为国家5A级旅游景区，是目前国内唯一对公众开放的完整的清代王府建筑群。", "answer": "对", "explain": "与原文一致：2012年评为5A，国内唯一对公众开放的完整清代王府。", "source": "恭王府于2012年被评定为国家5A级旅游景区……恭王府是目前国内唯一对公众开放的完整的清代王府建筑群"}, {"section": "恭王府", "type": "single", "q": "奕訢迁入此宅、该宅第始称“恭王府”是在（　）。", "options": ["A. 乾隆四十一年（1776年）", "B. 嘉庆四年（1799年）", "C. 咸丰二年（1852年）", "D. 光绪二十四年（1898年）"], "answer": "C", "explain": "咸丰二年（1852年）奕訢迁入，自此称“恭王府”。", "source": "名称由来：因恭亲王奕訢而得名。咸丰二年（1852年），奕訢迁入此宅，自此该宅第称为“恭王府”。"}, {"section": "恭王府", "type": "judge", "q": "恭王府位于北京市西城区前海西街17号，由北面的府邸和南面的花园两部分组成，前园后府。", "answer": "错", "explain": "应为由南面的府邸和北面的花园两部分组成，前府后园。", "source": "位置：北京市西城区前海西街17号……建筑布局：由南面的府邸和北面的花园两部分组成，前府后园。"}, {"section": "恭王府", "type": "multi", "q": "下列属于恭王府“三绝”的有（　）。", "options": ["A. 西洋门", "B. 大戏楼", "C. 后罩楼", "D. 银安殿"], "answer": "ABC", "explain": "恭王府“三绝”为西洋门、大戏楼、后罩楼（加福字碑则称“三绝一宝”）。", "source": "恭王府“三绝”：西洋门、大戏楼、后罩楼（一说“三绝一宝”，加福字碑为“宝”）。"}, {"section": "恭王府", "type": "single", "q": "和珅宅第（恭王府前身）始建于（　）。", "options": ["A. 乾隆四十一年（1776年）", "B. 嘉庆四年（1799年）", "C. 咸丰二年（1852年）", "D. 同治年间"], "answer": "A", "explain": "和珅为最初主人，宅第始建于乾隆四十一年（1776年）。", "source": "和珅（乾隆朝权臣，宅第始建于乾隆四十一年，1776年）为其最初主人"}, {"section": "恭王府", "type": "judge", "q": "和珅败后，嘉庆帝将和宅（除公主府部分外）赐给同母弟庆郡王永璘，和宅自此成为庆王府。", "answer": "对", "explain": "与原文一致：嘉庆四年（1799年）和珅被赐死抄家后赐宅于永璘。", "source": "嘉庆四年（1799年）和珅被赐死抄家后，嘉庆帝将和宅（除公主府部分外）赐给久已觊觎此宅的同母弟庆郡王永璘，和宅自此成为庆王府。"}, {"section": "恭王府", "type": "single", "q": "和珅之子丰绅殷德的妻子是（　）。", "options": ["A. 荣寿固伦公主", "B. 固伦和孝公主", "C. 孝庄文皇后", "D. 慈禧太后"], "answer": "B", "explain": "丰绅殷德之妻为固伦和孝公主，是乾隆皇帝最幼的女儿。", "source": "丰绅殷德之妻的出身：为固伦和孝公主，是乾隆皇帝最幼的女儿（乾隆之女），下嫁和珅之子丰绅殷德。"}, {"section": "恭王府", "type": "judge", "q": "恭王府大门门钉为“横九竖九”排列，计81枚，与皇宫规制相同。", "answer": "错", "explain": "恭王府门钉为“横七竖九”计63枚，皇宫才是“横九竖九”81枚。", "source": "恭王府大门（一宫门/头宫门）门钉为“横七竖九”排列，计63枚（9列×7行）。其规制仅次于皇宫的“横九竖九”（81枚）"}, {"section": "恭王府", "type": "multi", "q": "据恭王府博物馆资料，清朝曾亲临恭王府的皇帝包括（　）。", "options": ["A. 乾隆", "B. 嘉庆", "C. 道光", "D. 咸丰", "E. 宣统"], "answer": "ABCD", "explain": "曾亲临恭王府的皇帝为乾隆、嘉庆、道光、咸丰、同治、光绪共六位，不含宣统。", "source": "据恭王府博物馆资料，曾亲临恭王府的皇帝分别为乾隆、嘉庆、道光、咸丰、同治、光绪共六位。"}, {"section": "恭王府", "type": "single", "q": "近代画坛并称“南张北溥”的是张大千与（　）。", "options": ["A. 溥伟", "B. 溥心畬", "C. 溥仪", "D. 溥杰"], "answer": "B", "explain": "“北溥”指溥心畬（恭亲王奕訢之孙溥儒，字心畬）。", "source": "“南张北溥”：指张大千与溥心畬（恭亲王奕訢之孙溥儒，字心畬），二人一南一北，并称近代画坛双璧。"}, {"section": "恭王府", "type": "judge", "q": "恭王府西路的锡晋斋仿照故宫宁寿宫乐寿堂的形制建造，其逾制仿建被列为和珅“二十大罪”第十三款“僭侈逾制”的罪证。", "answer": "对", "explain": "与原文一致：仿宁寿宫乐寿堂，金丝楠木两层仙楼，为第十三款罪证。", "source": "仿照故宫宁寿宫（具体为宁寿宫乐寿堂）的形制建造，内部用金丝楠木装修两层“仙楼”，其逾制仿建被列为和珅“二十大罪”第十三款“僭侈逾制”的罪证。"}, {"section": "恭王府", "type": "single", "q": "光绪二十四年（1898年）恭亲王奕訢病逝后，停灵于（　）。", "options": ["A. 嘉乐堂", "B. 银安殿", "C. 多福轩", "D. 葆光室"], "answer": "B", "explain": "奕訢病逝后停灵于银安殿，慈禧太后与光绪帝于次日亲临祭奠。", "source": "光绪二十四年（1898年）奕訢病逝后，停灵于银安殿，慈禧太后与光绪帝于次日亲临祭奠。"}, {"section": "恭王府", "type": "judge", "q": "恭王府花园的正式名称为朗润园。", "answer": "错", "explain": "正式名称为萃锦园；朗润园是恭亲王奕訢时期曾沿用的海淀旧园名。", "source": "恭王府花园的正式名称为萃锦园（民国时期定名；恭亲王奕訢时期曾沿用海淀旧园名“朗润园”，后溥儒居园中改称“萃锦园”）。"}, {"section": "恭王府", "type": "multi", "q": "北京城四座著名流杯亭包括（　）。", "options": ["A. 恭王府花园沁秋亭", "B. 中南海流水音亭", "C. 故宫乾隆花园禊赏亭", "D. 潭柘寺猗玕亭", "E. 颐和园谐趣园知鱼亭"], "answer": "ABCD", "explain": "四座著名流杯亭为恭王府沁秋亭、中南海流水音亭、故宫乾隆花园禊赏亭、潭柘寺猗玕亭。", "source": "1.恭王府花园沁秋亭（水寿亭）；2.中南海流水音亭；3.故宫乾隆花园禊赏亭（亦作“契赏亭”）；4.潭柘寺猗玕亭。"}, {"section": "恭王府", "type": "single", "q": "位于后海北岸的清朝“铁帽子”王府是（　）。", "options": ["A. 庆王府", "B. 醇亲王府（北府）", "C. 恭王府", "D. 礼亲王府"], "answer": "B", "explain": "后海北沿的醇亲王府（北府）是清代世袭罔替的“铁帽子王”府邸之一。", "source": "后海北岸的“铁帽子”王府：醇亲王府（北府），位于后海北沿，是清代世袭罔替的“铁帽子王”府邸之一"}, {"section": "恭王府", "type": "judge", "q": "恭王府秘云洞中的镇府之宝福字碑为乾隆皇帝御笔，被誉为“天下第一福”。", "answer": "错", "explain": "福字碑为清圣祖康熙皇帝御笔，上钤“康熙御笔之宝”印章，并非乾隆。", "source": "为清圣祖康熙皇帝御笔“福”字碑，上钤“康熙御笔之宝”印章……被誉为“天下第一福”，是恭王府的镇府之宝"}, {"section": "恭王府", "type": "single", "q": "称颂什刹海地区美景为“城中第一佳山水”的明代大学士是（　）。", "options": ["A. 李东阳", "B. 郭守敬", "C. 司马光", "D. 徐光启"], "answer": "A", "explain": "出自明代大学士李东阳（号西涯，世居什刹海一带）的诗句。", "source": "“城中第一佳山水”：出自明代大学士李东阳（号西涯，世居什刹海一带）的诗句"}, {"section": "恭王府", "type": "judge", "q": "恭王府大戏楼建于乾隆年间，砖木结构相传未用一根铁钉。", "answer": "错", "explain": "大戏楼建于同治年间（1862—1874年），不是乾隆年间。", "source": "戏楼（大戏楼）建筑特点：建于同治年间（1862—1874年），建筑面积约685平方米，采用三卷勾连搭全封闭式结构，砖木结构相传未用一根铁钉"}, {"section": "恭王府", "type": "multi", "q": "恭王府秘云洞中康熙御笔福字碑的“福”字可拆解为（　）。", "options": ["A. 多子", "B. 多才", "C. 多田", "D. 多寿", "E. 多金"], "answer": "ABCD", "explain": "福字可拆解为“多子、多才、多田、多寿、多福”，被誉为“天下第一福”，无“多金”一说。", "source": "此福字可拆解为“多子、多才、多田、多寿、多福”，被誉为“天下第一福”，是恭王府的镇府之宝（现为国家一级文物）。"}, {"section": "恭王府", "type": "single", "q": "清政府于1861年3月1日正式成立的政府机构是（　）。", "options": ["A. 总理各国事务衙门", "B. 军机处", "C. 内务府", "D. 理藩院"], "answer": "A", "explain": "1861年3月1日成立总理各国事务衙门（总理衙门），办理洋务及外交。", "source": "1861年3月1日成立的政府机构：总理各国事务衙门（简称“总理衙门”），是清政府为办理洋务及外交而设的中央机构。"}, {"section": "恭王府", "type": "judge", "q": "恭王府历经清乾隆、嘉庆、道光、咸丰、同治、光绪、宣统七代皇帝，见证了清王朝由盛转衰的历史。", "answer": "对", "explain": "与原文一致：恭王府历经七代皇帝，故有“一座恭王府，半部清代史”之说。", "source": "用以概括恭王府历经清乾隆、嘉庆、道光、咸丰、同治、光绪、宣统七代皇帝、见证清王朝由盛转衰的历史分量。"}, {"section": "恭王府", "type": "single", "q": "民国时期，恭王府府邸部分于1937年由（　）购置，作为其女生部（校舍）。", "options": ["A. 北京大学", "B. 清华大学", "C. 辅仁大学", "D. 燕京大学"], "answer": "C", "explain": "1937年由辅仁大学购置府邸作为女生部；此前溥伟曾将府邸抵押给天主教会。", "source": "府邸部分于1937年由辅仁大学购置，作为其女生部（校舍）；此前溥伟于1921年因债务将府邸抵押给天主教会"}, {"section": "恭王府", "type": "judge", "q": "庆亲王永璘是乾隆皇帝第十七子，也是嘉庆皇帝的同母弟。", "answer": "对", "explain": "与原文一致：永璘为乾隆第十七子、嘉庆同母弟，和珅败后此宅赐永璘，称“庆王府”。", "source": "庆亲王永璘（乾隆第十七子，嘉庆同母弟）——和珅败后此宅赐永璘，称“庆王府”。"}, {"section": "恭王府", "type": "multi", "q": "下列关于恭王府花园的说法正确的有（　）。", "options": ["A. 花园正式名称为萃锦园", "B. 西洋门由汉白玉雕砌，是园内唯一的西式建筑", "C. 独乐峰为高约5米的北太湖石，作用相当于影壁", "D. 花园中龙王庙供奉东海龙王", "E. “榆关”是居庸关的别称"], "answer": "ABCD", "explain": "“榆关”是山海关的别称，为长城象征，不是居庸关；其余四项均与原文一致。", "source": "榆关是山海关的别称，为长城象征……龙王庙供奉的龙王：供奉东海龙王……独乐峰为一块北太湖石孤赏石，高约5米……其作用相当于影壁/屏风。"}, {"section": "恭王府", "type": "single", "q": "恭王府大门（一宫门）的门钉数量为（　）。", "options": ["A. 81枚", "B. 63枚", "C. 49枚", "D. 108枚"], "answer": "B", "explain": "门钉“横七竖九”排列，计63枚（9列×7行），仅次于皇宫的81枚。", "source": "恭王府大门（一宫门/头宫门）门钉为“横七竖九”排列，计63枚（9列×7行）。其规制仅次于皇宫的“横九竖九”（81枚）"}, {"section": "恭王府", "type": "judge", "q": "近代画坛并称“南张北溥”中的“北溥”指溥心畬，即恭亲王奕訢之孙溥儒。", "answer": "对", "explain": "与原文一致：“北溥”为溥心畬（恭亲王奕訢之孙溥儒，字心畬），与张大千并称近代画坛双璧。", "source": "“南张北溥”：指张大千与溥心畬（恭亲王奕訢之孙溥儒，字心畬），二人一南一北，并称近代画坛双璧。"}, {"section": "恭王府", "type": "single", "q": "被称为恭王府“神殿”、用于满族萨满教祭祀的建筑是（　）。", "options": ["A. 银安殿", "B. 嘉乐堂", "C. 锡晋斋", "D. 多福轩"], "answer": "B", "explain": "嘉乐堂是恭王府的神殿，用于满族萨满教祭祀，紫禁城内对应的神殿为坤宁宫。", "source": "嘉乐堂是恭王府的神殿，用于满族萨满教祭祀（祭祖、祭神），殿内供奉祖先及诸神牌位……（紫禁城内对应的神殿为坤宁宫）。"}, {"section": "恭王府", "type": "judge", "q": "光绪二十四年（1898年）恭亲王奕訢病逝后，停灵于嘉乐堂，慈禧太后与光绪帝于次日亲临祭奠。", "answer": "错", "explain": "停灵位置是银安殿，不是嘉乐堂；嘉乐堂是王府的萨满祭祀神殿。", "source": "光绪二十四年（1898年）奕訢病逝后，停灵于银安殿，慈禧太后与光绪帝于次日亲临祭奠。"}, {"section": "恭王府", "type": "multi", "q": "下列关于恭王府建筑布局的说法正确的有（　）。", "options": ["A. 由南面的府邸和北面的花园两部分组成", "B. 前府后园", "C. 府邸分中、东、西三路", "D. 各路由多进四合院组成，沿严格中轴线排列", "E. 前园后府"], "answer": "ABCD", "explain": "恭王府由南面的府邸和北面的花园组成，前府后园；府邸分中、东、西三路，各由多进四合院组成，沿严格中轴线排列。“前园后府”错误。", "source": "建筑布局：由南面的府邸和北面的花园两部分组成，前府后园。府邸分中、东、西三路，各由多进四合院组成，沿严格中轴线排列。"}, {"section": "恭王府", "type": "single", "q": "民国年间购得西晋陆机《平复帖》并于1956年无偿捐献给国家的收藏家是（　）。", "options": ["A. 张伯驹", "B. 张大千", "C. 溥心畬", "D. 侯仁之"], "answer": "A", "explain": "张伯驹购得《平复帖》并于1956年无偿捐献国家，现藏故宫博物院。", "source": "张伯驹先生于民国年间购得西晋陆机《平复帖》，并于1956年将其无偿捐献给国家（现藏故宫博物院）。"}, {"section": "恭王府", "type": "judge", "q": "嘉乐堂是恭王府的神殿，用于满族萨满教祭祀，紫禁城内与之对应的神殿为太和殿。", "answer": "错", "explain": "紫禁城内对应的神殿是坤宁宫，不是太和殿。", "source": "嘉乐堂是恭王府的神殿，用于满族萨满教祭祀（祭祖、祭神）……（紫禁城内对应的神殿为坤宁宫）。"}, {"section": "恭王府", "type": "single", "q": "恭王府多福轩梁枋彩画绘有玉兰花、海棠花、牡丹花三种花卉，合称（　）。", "options": ["A. 岁寒三友", "B. 玉堂富贵", "C. 四季平安", "D. 锦上添花"], "answer": "B", "explain": "玉兰（玉）、海棠（堂）、牡丹（富贵）合称“玉堂富贵”，寓意吉祥富贵。", "source": "多福轩梁枋彩画绘有玉兰花、海棠花、牡丹花三种花卉，合称“玉堂富贵”（玉=玉兰，堂=海棠，富贵=牡丹），寓意吉祥富贵。"}, {"section": "恭王府", "type": "judge", "q": "道光帝曾赐奕訢与咸丰（奕詝）共创的枪法名曰“宝锷宣威”、刀法名曰“棣华协力”。", "answer": "错", "explain": "枪法名曰“棣华协力”、刀法名曰“宝锷宣威”，题干将二者颠倒了。", "source": "道光帝曾赐奕訢与咸丰（奕詝）共创的枪法名曰“棣华协力”、刀法名曰“宝锷宣威”，取兄弟协力共扶江山之意。"}, {"section": "恭王府", "type": "multi", "q": "下列属于恭王府花园核心建筑（景观）的有（　）。", "options": ["A. 西洋门", "B. 蝠池", "C. 安善堂", "D. 大戏楼", "E. 银安殿"], "answer": "ABCD", "explain": "花园核心包括西洋门、独乐峰、蝠池、安善堂、滴翠岩秘云洞福字碑、大戏楼、蝠厅等；银安殿是府邸核心建筑。", "source": "花园核心：西洋门（花园正门）、独乐峰、蝠池、安善堂、滴翠岩秘云洞福字碑、大戏楼、蝠厅等。"}, {"section": "恭王府", "type": "single", "q": "恭王府后罩楼俗称“99间半”，其实测房间约为（　）。", "options": ["A. 99间", "B. 108间", "C. 63间", "D. 189间"], "answer": "B", "explain": "后罩楼实测房间约108间，长约189米。", "source": "后罩楼横贯东、中、西三路，是一座长约189米的两层长楼……俗称“99间半”，实测房间约108间。"}, {"section": "恭王府", "type": "judge", "q": "恭王府大戏楼戏台下掏空放置多口大缸以增共鸣，无论坐于何处皆能清晰闻声。", "answer": "对", "explain": "与原文一致：大戏楼采用三卷勾连搭全封闭式结构，戏台下置大缸增共鸣。", "source": "采用三卷勾连搭全封闭式结构，砖木结构相传未用一根铁钉；戏台下掏空放置多口大缸以增共鸣，无论坐于何处皆清晰闻声。"}, {"section": "恭王府", "type": "single", "q": "恭王府花园西洋门门额石刻，外侧所刻文字为（　）。", "options": ["A. 秀挹恒春", "B. 静含太古", "C. 曲径通幽", "D. 赏心乐事"], "answer": "B", "explain": "门额石刻外侧为“静含太古”，内侧为“秀挹恒春”。", "source": "题额文字：门额石刻，外侧为“静含太古”，内侧为“秀挹恒春”。"}, {"section": "恭王府", "type": "judge", "q": "恭王府花园蝠池四周栽有柳树，春天柳絮飘落池中，与“蝠（福）”合为“富余”的谐音。", "answer": "错", "explain": "池周边种的是榆树，春天飘落的是形似铜钱的榆钱，与“蝠（福）”合为“富余”，不是柳树柳絮。", "source": "池周边种有榆树，春天榆钱（榆树果实，形似铜钱）纷纷飘落池中，与“蝠（福）”合为“富余”（福+余）的谐音。"}, {"section": "恭王府", "type": "multi", "q": "清晚期同治、光绪、宣统三朝位于什刹海地区的“铁帽子”王府包括（　）。", "options": ["A. 恭亲王府", "B. 醇亲王府", "C. 庆亲王府", "D. 礼亲王府"], "answer": "ABC", "explain": "清晚期恭亲王、醇亲王、庆亲王三座铁帽子王府均在什刹海地区；礼亲王府不在其列。", "source": "清晚期同治、光绪、宣统三朝的恭亲王、醇亲王、庆亲王三座铁帽子王府均在此区域。"}, {"section": "恭王府", "type": "single", "q": "恭王府花园蝠池四周栽种的树木是（　）。", "options": ["A. 柳树", "B. 槐树", "C. 榆树", "D. 海棠"], "answer": "C", "explain": "池周边种有榆树，春天榆钱飘落池中，与“蝠（福）”合为“富余”谐音。", "source": "池周边种有榆树，春天榆钱（榆树果实，形似铜钱）纷纷飘落池中，与“蝠（福）”合为“富余”（福+余）的谐音"}, {"section": "恭王府", "type": "judge", "q": "总理各国事务衙门成立于1861年3月1日，是清政府为办理洋务及外交而设的中央机构，恭亲王奕訢曾在此主政。", "answer": "对", "explain": "与原文一致：1861年3月1日成立总理各国事务衙门，奕訢曾在此主政并与西方列强谈判。", "source": "1861年3月1日成立的政府机构：总理各国事务衙门（简称“总理衙门”），是清政府为办理洋务及外交而设的中央机构。恭亲王奕訢曾在此主政。"}, {"section": "恭王府", "type": "single", "q": "恭王府被评定为国家5A级旅游景区的时间是（　）。", "options": ["A. 2002年", "B. 2007年", "C. 2012年", "D. 2017年"], "answer": "C", "explain": "恭王府于2012年被评定为国家5A级旅游景区。", "source": "恭王府于2012年被评定为国家5A级旅游景区（恭王府博物馆官网记载为2012年2月“荣膺国家5A级景区称号”）。"}, {"section": "恭王府", "type": "multi", "q": "恭王府多福轩梁枋彩画绘有“玉堂富贵”图案，其中包括的花卉有（　）。", "options": ["A. 玉兰花", "B. 海棠花", "C. 牡丹花", "D. 梅花", "E. 菊花"], "answer": "ABC", "explain": "玉兰（玉）、海棠（堂）、牡丹（富贵）合称“玉堂富贵”，无梅花、菊花。", "source": "多福轩梁枋彩画绘有玉兰花、海棠花、牡丹花三种花卉，合称“玉堂富贵”（玉=玉兰，堂=海棠，富贵=牡丹），寓意吉祥富贵。"}, {"section": "恭王府", "type": "single", "q": "目前国内唯一对公众开放的完整的清代王府建筑群是（　）。", "options": ["A. 恭王府", "B. 醇亲王府", "C. 庆亲王府", "D. 礼亲王府"], "answer": "A", "explain": "恭王府是目前国内唯一对公众开放的完整的清代王府建筑群。", "source": "恭王府是目前国内唯一对公众开放的完整的清代王府建筑群（“唯一保存最完整且对社会开放的清代王府”）。"}, {"section": "恭王府", "type": "single", "q": "恭王府的地址是北京市西城区（　）。", "options": ["A. 前海西街17号", "B. 前海西街18号", "C. 后海北沿46号", "D. 护国寺街9号"], "answer": "A", "explain": "恭王府位于西城区前海西街17号；前海西街18号为郭沫若纪念馆，后海北沿46号为宋庆龄故居，护国寺街9号为梅兰芳纪念馆。", "source": "位置：北京市西城区前海西街17号，位于什刹海（后海、前海）西岸。"}, {"section": "恭王府", "type": "multi", "q": "下列关于恭王府秘云洞康熙御笔福字碑的说法正确的有（　）。", "options": ["A. 位于花园滴翠岩下秘云洞中", "B. 上钤“康熙御笔之宝”印章", "C. 被誉为“天下第一福”", "D. 现为国家一级文物", "E. 为乾隆皇帝御笔"], "answer": "ABCD", "explain": "福字碑为清圣祖康熙皇帝御笔，不是乾隆御笔；其余四项均与原文一致。", "source": "为清圣祖康熙皇帝御笔“福”字碑，上钤“康熙御笔之宝”印章……被誉为“天下第一福”，是恭王府的镇府之宝（现为国家一级文物）。"}, {"section": "恭王府", "type": "single", "q": "恭王府总占地面积约为（　）。", "options": ["A. 约2.9万平方米", "B. 约3.2万平方米", "C. 约6.1万平方米", "D. 约10万平方米"], "answer": "C", "explain": "总占地面积约6.1万平方米（实测61120平方米），其中府邸约32260平方米、花园约28860平方米。", "source": "面积：总占地面积约6.1万平方米（恭王府《知识100问》实测为61120平方米），其中府邸约32260平方米、花园约28860平方米。"}, {"section": "恭王府", "type": "single", "q": "1860年英法联军入京时，恭亲王奕訢曾在恭王府的（　）与英法谈判。", "options": ["A. 银安殿", "B. 多福轩", "C. 嘉乐堂", "D. 锡晋斋"], "answer": "B", "explain": "1860年英法联军入京时，奕訢在恭王府多福轩与英法谈判。", "source": "恭亲王奕訢曾在此主政，并与西方列强谈判（1860年英法联军入京时，奕訢即在恭王府多福轩与英法谈判）。"}, {"section": "恭王府", "type": "multi", "q": "下列关于恭王府历史沿革的说法正确的有（　）。", "options": ["A. 和珅宅第始建于乾隆四十一年（1776年）", "B. 嘉庆四年（1799年）和珅被赐死抄家", "C. 咸丰二年（1852年）奕訢迁入，始称“恭王府”", "D. 1937年府邸由辅仁大学购置，作为其女生部", "E. 1921年奕訢因债务将府邸抵押给天主教会"], "answer": "ABCD", "explain": "1921年因债务将府邸抵押给天主教会的是溥伟，不是奕訢；其余四项均与原文一致。", "source": "此前溥伟于1921年因债务将府邸抵押给天主教会，后由有教会背景的辅仁大学代偿债务、取得产权……府邸部分于1937年由辅仁大学购置，作为其女生部（校舍）。"}, {"section": "恭王府", "type": "single", "q": "恭王府西路的锡晋斋是仿照故宫（　）的形制建造的。", "options": ["A. 宁寿宫乐寿堂", "B. 太和殿", "C. 乾清宫", "D. 坤宁宫"], "answer": "A", "explain": "锡晋斋仿故宫宁寿宫乐寿堂形制建造，内部以金丝楠木装修两层“仙楼”，为和珅“僭侈逾制”罪证。", "source": "锡晋斋仿建对象：仿照故宫宁寿宫（具体为宁寿宫乐寿堂）的形制建造，内部用金丝楠木装修两层“仙楼”。"}, {"section": "恭王府", "type": "single", "q": "恭王府“棣华轩”因悬挂（　）御书匾额而得名。", "options": ["A. 乾隆帝", "B. 嘉庆帝", "C. 道光帝", "D. 咸丰帝"], "answer": "D", "explain": "棣华轩因悬挂咸丰皇帝御书“棣华轩”匾额而得名，“棣华”取自《诗经·常棣》，喻兄弟情谊。", "source": "“棣华轩”名称的由来：因悬挂咸丰皇帝御书“棣华轩”匾额而得名。“棣华”取自《诗经·常棣》“常棣之华”，喻兄弟情谊。"}, {"section": "恭王府", "type": "single", "q": "位于恭王府后罩楼最西端、被称为中国古代唯一室内花园遗存的是（　）。", "options": ["A. 瞻霁楼", "B. 宝约楼", "C. 水法楼", "D. 后罩楼"], "answer": "C", "explain": "后罩楼最西端的“水法楼”（五间）将亭台楼阁、假山溪流搬入室内，是国内唯一的室内园林景观遗存。", "source": "中国古代唯一的室内花园遗存：位于后罩楼最西端的“水法楼”（五间）……是目前国内唯一的室内园林景观遗存。"}, {"section": "恭王府", "type": "single", "q": "恭王府花园的正式名称是（　）。", "options": ["A. 朗润园", "B. 萃锦园", "C. 独乐园", "D. 静明园"], "answer": "B", "explain": "花园正式名称为萃锦园（民国时期定名）；朗润园是奕訢时期曾沿用的海淀旧园名。", "source": "恭王府花园的正式名称为萃锦园（民国时期定名；恭亲王奕訢时期曾沿用海淀旧园名“朗润园”，后溥儒居园中改称“萃锦园”）。"}, {"section": "恭王府", "type": "single", "q": "恭王府花园独乐峰之名，借自北宋（　）《独乐园记》的意境。", "options": ["A. 李东阳", "B. 司马光", "C. 郭守敬", "D. 苏轼"], "answer": "B", "explain": "独乐峰名借北宋司马光《独乐园记》意境，取“独善其身”之意。", "source": "其名借北宋司马光《独乐园记》意境，取“独善其身”之意。"}, {"section": "恭王府", "type": "single", "q": "恭王府花园东路入口石碑上“曲径通幽”四字出自当代书法家（　）。", "options": ["A. 启骧", "B. 侯仁之", "C. 张伯驹", "D. 溥心畬"], "answer": "A", "explain": "“曲径通幽”四字出自当代书法家启骧之手。", "source": "“曲径通幽”题写者：出自当代书法家启骧之手（恭王府《知识100问》载：花园东路入口石碑上“曲径通幽”四字出自当代书法家启骧）。"}, {"section": "恭王府", "type": "single", "q": "恭王府大戏楼戏台正上方悬挂的篆书匾额内容是（　）。", "options": ["A. 静含太古", "B. 秀挹恒春", "C. 曲径通幽", "D. 赏心乐事"], "answer": "D", "explain": "戏台正上方悬篆书匾“赏心乐事”；“静含太古”“秀挹恒春”为西洋门门额，“曲径通幽”为花园东路石刻。", "source": "大戏楼戏台匾额内容：戏台正上方悬篆书匾“赏心乐事”。"}, {"section": "恭王府", "type": "single", "q": "恭王府花园中龙王庙供奉的是（　）。", "options": ["A. 东海龙王", "B. 西海龙王", "C. 南海龙王", "D. 北海龙王"], "answer": "A", "explain": "龙王庙供奉东海龙王，因恭王府拥有上万顷庄田，祭拜龙王祈求风调雨顺、庄田丰收。", "source": "龙王庙供奉的龙王：供奉东海龙王。因恭王府在关内关外拥有上万顷庄田，地租为主要经济来源。"}, {"section": "恭王府", "type": "single", "q": "恭王府“三绝一宝”中的“宝”指的是（　）。", "options": ["A. 独乐峰", "B. 福字碑", "C. 蝠池", "D. 榆关"], "answer": "B", "explain": "“三绝”为西洋门、大戏楼、后罩楼，“一宝”即康熙御笔福字碑。", "source": "恭王府“三绝”：西洋门、大戏楼、后罩楼（一说“三绝一宝”，加福字碑为“宝”）。"}, {"section": "恭王府", "type": "single", "q": "恭王府的镇府之宝康熙御笔福字碑位于花园的（　）。", "options": ["A. 滴翠岩下秘云洞", "B. 蝠池之畔", "C. 安善堂内", "D. 大戏楼内"], "answer": "A", "explain": "福字碑位于花园滴翠岩下秘云洞中，为清圣祖康熙皇帝御笔，被誉为“天下第一福”。", "source": "位于花园滴翠岩下秘云洞中，为清圣祖康熙皇帝御笔“福”字碑，上钤“康熙御笔之宝”印章。"}, {"section": "恭王府", "type": "single", "q": "恭王府花园内的流杯亭名为（　）。", "options": ["A. 流水音亭", "B. 禊赏亭", "C. 猗玕亭", "D. 沁秋亭"], "answer": "D", "explain": "恭王府花园流杯亭为沁秋亭（又称水寿亭）；流水音亭在中南海，禊赏亭在故宫乾隆花园，猗玕亭在潭柘寺。", "source": "1.恭王府花园沁秋亭（水寿亭）；2.中南海流水音亭；3.故宫乾隆花园禊赏亭（亦作“契赏亭”）；4.潭柘寺猗玕亭。"}, {"section": "恭王府", "type": "single", "q": "据恭王府博物馆资料，下列皇帝中未曾亲临恭王府的是（　）。", "options": ["A. 乾隆", "B. 道光", "C. 同治", "D. 宣统"], "answer": "D", "explain": "曾亲临恭王府的皇帝为乾隆、嘉庆、道光、咸丰、同治、光绪共六位，不含宣统。", "source": "据恭王府博物馆资料，曾亲临恭王府的皇帝分别为乾隆、嘉庆、道光、咸丰、同治、光绪共六位。"}, {"section": "恭王府", "type": "single", "q": "曾居住于恭王府的两位清朝最高等级（固伦）公主，是固伦和孝公主与（　）。", "options": ["A. 荣寿固伦公主", "B. 慈禧太后", "C. 隆裕太后", "D. 珍妃"], "answer": "A", "explain": "曾居恭王府的两位固伦公主为固伦和孝公主（乾隆女，居东路乐道堂）与荣寿固伦公主（恭亲王奕訢长女）；固伦公主为清代公主最高等级封号。", "source": "曾居恭王府的两位清朝最高等级公主：固伦和孝公主（乾隆女，居东路乐道堂）与荣寿固伦公主（恭亲王奕訢长女）。固伦公主为清代公主最高等级封号。"}, {"section": "北海", "type": "single", "q": "元代时，北海琼华岛被赐名为（　）。", "options": ["A. 万寿山（万岁山）", "B. 瑶屿", "C. 大宁离宫", "D. 景山"], "answer": "A", "explain": "元代琼华岛赐名“万寿山（万岁山）”，水域称“太液池”。瑶屿为辽代名称，大宁离宫为金代离宫，景山为清代另一处山体之名。", "source": "元代：琼华岛赐名“万寿山（万岁山）”，水域称“太液池”"}, {"section": "北海", "type": "judge", "q": "北海地区在历史上原为永定河（古高梁河）的故道。", "answer": "对", "explain": "原文明确北海地区在历史上原为永定河（古高梁河）的故道，河道南迁后经辽、金引水营建逐渐形成湖泊园林。", "source": "北海地区在历史上原为永定河（古高梁河）的故道。永定河河道自然南迁后，留下一片原野与池塘（洼地积水），后历经辽、金引水营建，逐渐形成湖泊园林。"}, {"section": "北海", "type": "multi", "q": "下列属于北海公园内“园中园”的有（　）。", "options": ["A. 静心斋", "B. 濠濮间", "C. 画舫斋", "D. 小西天（极乐世界）", "E. 绮望楼"], "answer": "ABCD", "explain": "静心斋、濠濮间、画舫斋、小西天均为北海园内“园中园”；绮望楼是景山正南山脚下的建筑，不属于北海。", "source": "北海公园内的主要“园中园”（独立成景的袖珍园林）包括：静心斋……濠濮间（东岸）；画舫斋（东岸，又称水殿）；小西天（极乐世界）（北岸，宗教性园中园）"}, {"section": "北海", "type": "single", "q": "“燕京八景”中位于北京三海（北海、中海、南海）区域的共有（　）。", "options": ["A. 一景", "B. 两景", "C. 三景", "D. 四景"], "answer": "B", "explain": "位于三海区域的共两景：北海的琼岛春阴与中海的太液秋风，南海无燕京八景入选。", "source": "“燕京八景”中位于北京三海（北海、中海、南海）区域的共有两景：1. 琼岛春阴——在北海琼华岛……2. 太液秋风——在中海东岸水云榭"}, {"section": "北海", "type": "judge", "q": "金世宗营建大宁离宫的时间是大定三年至十九年，即1063—1079年。", "answer": "错", "explain": "年代有误，应为1163—1179年，而非1063—1079年。", "source": "金代营建的皇家离宫：大宁离宫（太宁宫），金世宗大定三年至十九年（1163—1179 年）以瑶屿（琼华岛）为中心修建，是金代皇家离宫，基本奠定今日北海格局。"}, {"section": "北海", "type": "single", "q": "连接北海公园南岸与琼华岛的石桥是（　）。", "options": ["A. 金水桥", "B. 永安桥", "C. 卢沟桥", "D. 银锭桥"], "answer": "B", "explain": "连接南岸（团城/园前门）与琼华岛的石桥为永安桥，又称“堆云积翠桥”“太液桥”。", "source": "连接南岸（团城/园前门）与琼华岛的石桥为永安桥（又称“堆云积翠桥”“太液桥”），始建于元代"}, {"section": "北海", "type": "judge", "q": "北海永安桥始建于明代，乾隆八年（1743年）改建为三孔拱券石桥。", "answer": "错", "explain": "始建朝代有误，永安桥始建于元代，而非明代；乾隆八年改建为三孔拱券石桥无误。", "source": "连接南岸（团城/园前门）与琼华岛的石桥为永安桥（又称“堆云积翠桥”“太液桥”），始建于元代，乾隆八年（1743 年）改建为三孔拱券石桥。"}, {"section": "北海", "type": "multi", "q": "按资料中的“五部分”概括法，北海白塔的组成部分包括（　）。", "options": ["A. 塔基", "B. 塔身", "C. 相轮", "D. 华盖", "E. 塔顶"], "answer": "ABCD", "explain": "五部分为塔基、塔身、相轮（十三天）、华盖（宝盖）、塔刹（鎏金宝珠）。E项“塔顶”表述有误，应为“塔刹”。", "source": "组成部分：由塔基（十字折角须弥座）、塔身（覆钵/宝瓶）、相轮（十三天）、华盖（宝盖，饰日月火焰）、塔刹（鎏金宝珠）五部分组成"}, {"section": "北海", "type": "single", "q": "北海永安寺始建于（　）。", "options": ["A. 清顺治八年（1651年）", "B. 清乾隆六年（1741年）", "C. 清乾隆八年（1743年）", "D. 清顺治十二年（1655年）"], "answer": "A", "explain": "永安寺始建于清顺治八年（1651年），初名白塔寺；乾隆六年（1741年）改称永安寺。", "source": "始建年代：清顺治八年（1651 年），因西藏喇嘛恼木汗请求，在广寒殿废址上建藏式白塔并建“白塔寺”；乾隆六年（1741 年）改称永安寺。"}, {"section": "北海", "type": "judge", "q": "北海白塔高35.9米，塔基边长约18.2米，塔肚最大直径约14米。", "answer": "对", "explain": "与原文数据完全一致：塔高35.9米，塔基边长约18.2米，塔肚最大直径约14米。", "source": "关键数据：塔高 35.9 米，塔基边长约 18.2 米，塔肚最大直径约 14 米，是北海的标志与全园最高点。"}, {"section": "北海", "type": "single", "q": "北海永安寺普安殿内供奉的主尊宗喀巴，其所创教派是（　）。", "options": ["A. 宁玛派", "B. 萨迦派", "C. 格鲁派（黄教）", "D. 噶举派"], "answer": "C", "explain": "普安殿内主尊为藏传佛教格鲁派（黄教）创始人宗喀巴像，宗喀巴所创教派为藏传佛教格鲁派（黄教）。", "source": "普安殿内供奉：主尊为藏传佛教格鲁派（黄教）创始人宗喀巴像；宗喀巴所创教派为藏传佛教格鲁派（黄教）"}, {"section": "北海", "type": "judge", "q": "北海团城上的古油松被康熙皇帝册封为“遮荫侯”。", "answer": "错", "explain": "册封者有误，应为清乾隆皇帝，而非康熙皇帝。", "source": "团城上有金代油松与白皮松等古树，其中古油松被乾隆皇帝册封为“遮荫侯”（爵名“侯”）……另有白皮松被封为“白袍将军”。"}, {"section": "北海", "type": "multi", "q": "北海阅古楼所藏《三希堂石渠宝笈法帖》中的“三希”包括（　）。", "options": ["A. 王羲之《快雪时晴帖》", "B. 王献之《中秋帖》", "C. 王珣《伯远帖》", "D. 《快雪堂法帖》"], "answer": "ABC", "explain": "“三希”指王羲之《快雪时晴帖》、王献之《中秋帖》、王珣《伯远帖》；《快雪堂法帖》为北海快雪堂所藏法帖石刻，不属“三希”。", "source": "收录自魏晋至明末 135 位书法家、340 件（帖）作品（涵盖王羲之《快雪时晴帖》、王献之《中秋帖》、王珣《伯远帖》“三希”及历代名家墨迹）"}, {"section": "北海", "type": "single", "q": "北海白塔的建筑形制为（　）。", "options": ["A. 楼阁式塔", "B. 密檐式塔", "C. 藏式覆钵式（喇嘛塔）", "D. 金刚宝座式塔"], "answer": "C", "explain": "北海白塔为藏式（覆钵式/喇嘛塔），整体“上圆下方”，下为方形折角须弥座，塔身呈宝瓶形（覆钵）。", "source": "建筑形制：为藏式（覆钵式/喇嘛塔），整体“上圆下方”，下为方形折角须弥座，象征“须弥山”；塔身呈宝瓶形（覆钵），通体洁白。"}, {"section": "北海", "type": "judge", "q": "北海极乐世界（小西天）建成于清乾隆三十五年（1770年），是为庆祝乾隆生母孝圣皇太后八十寿辰而建。", "answer": "对", "explain": "与原文一致：乾隆三十五年（1770年）建成，为庆祝乾隆生母孝圣皇太后八十寿辰而建，祈寿福国。", "source": "修建原因：清乾隆三十五年（1770 年）建成，为庆祝乾隆生母孝圣皇太后八十寿辰而建，祈寿福国。俗称：“小西天”。"}, {"section": "北海", "type": "single", "q": "北海阅古楼是为保存法帖石刻而建，其建于（　）。", "options": ["A. 乾隆十二年（1747年）", "B. 乾隆十八年（1753年）", "C. 乾隆二十二年（1757年）", "D. 乾隆十一年（1746年）"], "answer": "B", "explain": "阅古楼建于乾隆十八年（1753年）；乾隆十二年（1747年）是法帖刻石开始之年，注意区分。", "source": "阅古楼位于白塔山西麓，呈半圆形双层延楼，乾隆十八年（1753 年）为保存法帖石刻而建（法帖刻石始于乾隆十二年，1747 年）。"}, {"section": "北海", "type": "judge", "q": "永定河河道自然南迁后，北海地区历经元、明两代引水营建，逐渐形成湖泊园林。", "answer": "错", "explain": "朝代有误，应为历经辽、金引水营建，而非元、明两代。", "source": "永定河河道自然南迁后，留下一片原野与池塘（洼地积水），后历经辽、金引水营建，逐渐形成湖泊园林。"}, {"section": "北海", "type": "multi", "q": "下列关于北海铁影壁的说法，正确的有（　）。", "options": ["A. 为元代遗物", "B. 由一块中性火山岩雕成", "C. 色泽棕褐、质地坚硬，酷似铸铁，故得名", "D. 原是元大都健德门外古庙影壁", "E. 清代建造"], "answer": "ABCD", "explain": "铁影壁为元代遗物，由中性火山岩雕成，色泽棕褐酷似铸铁而得名，原是元大都健德门外古庙影壁。E项“清代建造”错误。", "source": "建造朝代：元代遗物。材质：由一块中性火山岩（中性火成岩/火山块砾岩）雕成。得名原因：其色泽棕褐、质地坚硬，酷似铸铁……原是元大都健德门外古庙影壁"}, {"section": "北海", "type": "single", "q": "北海团城上被乾隆皇帝册封为“遮荫侯”的是（　）。", "options": ["A. 古油松", "B. 白皮松", "C. 古柏", "D. 国槐"], "answer": "A", "explain": "古油松被乾隆皇帝册封为“遮荫侯”；白皮松被封为“白袍将军”，注意区分。", "source": "团城上有金代油松与白皮松等古树，其中古油松被乾隆皇帝册封为“遮荫侯”（爵名“侯”）……另有白皮松被封为“白袍将军”。"}, {"section": "北海", "type": "judge", "q": "明代时，万寿山、太液池归入皇城西苑，统称“西苑”。", "answer": "对", "explain": "与原文一致：明代万寿山、太液池归入皇城西苑，统称“西苑”；清代才定型并习称“北海”。", "source": "明代：万寿山、太液池归入皇城西苑，统称“西苑”；清代：定型并习称“北海”。"}, {"section": "北海", "type": "single", "q": "北海公园濠濮间修建于（　）。", "options": ["A. 清乾隆二十一年（1756年）", "B. 清乾隆二十二年（1757年）", "C. 清乾隆二十三年（1758年）", "D. 清乾隆十八年（1753年）"], "answer": "B", "explain": "濠濮间修建于清乾隆二十二年（1757年），由乾隆皇帝亲定其名，名称取自《庄子》与《世说新语》典故。", "source": "修建年代：清乾隆二十二年（1757 年）。命名者：乾隆皇帝亲定其名。"}, {"section": "北海", "type": "judge", "q": "“燕京八景”中的“太液秋风”一景位于中海东岸水云榭。", "answer": "对", "explain": "与原文一致：太液秋风在中海东岸水云榭，乾隆御碑立于水云榭中；琼岛春阴才在北海琼华岛。", "source": "太液秋风——在中海东岸水云榭（乾隆御碑立于水云榭中）。"}, {"section": "北海", "type": "multi", "q": "下列关于北海永安桥的说法，正确的有（　）。", "options": ["A. 又称“堆云积翠桥”", "B. 又称“太液桥”", "C. 始建于元代", "D. 乾隆八年（1743年）改建为三孔拱券石桥", "E. 始建于明代"], "answer": "ABCD", "explain": "永安桥又称“堆云积翠桥”“太液桥”，始建于元代，乾隆八年（1743年）改建为三孔拱券石桥。E项“始建于明代”错误。", "source": "石桥为永安桥（又称“堆云积翠桥”“太液桥”），始建于元代，乾隆八年（1743 年）改建为三孔拱券石桥。"}, {"section": "北海", "type": "single", "q": "北海公园静心斋的原名是（　）。", "options": ["A. 画舫斋", "B. 镜清斋", "C. 濠濮间", "D. 快雪堂"], "answer": "B", "explain": "静心斋原名“镜清斋”，俗称“乾隆小花园”，位于北岸。", "source": "静心斋（原名镜清斋，俗称“乾隆小花园”，北岸）"}, {"section": "北海", "type": "judge", "q": "北海白塔的塔基为圆形须弥座，象征“须弥山”。", "answer": "错", "explain": "塔基形状有误，应为方形（十字）折角须弥座，而非圆形须弥座。", "source": "整体“上圆下方”，下为方形折角须弥座，象征“须弥山”……由塔基（十字折角须弥座）……五部分组成。"}, {"section": "北海", "type": "single", "q": "清末慈禧太后乘小火车到静心斋用膳，其起点是（　）。", "options": ["A. 中海瀛秀园门（紫光阁旁）", "B. 北海团城", "C. 北海北岸", "D. 西苑紫光阁北门外"], "answer": "A", "explain": "西苑铁路南起中海的瀛秀园门外（紫光阁一带），经福华门、阳泽门沿北海西岸至静心斋门前设站，起点为中海瀛秀园门（紫光阁旁）。", "source": "慈禧乘小火车用膳的起点：西苑铁路南起中海的瀛秀园门外（紫光阁一带）……即起点为中海瀛秀园门（紫光阁旁）。"}, {"section": "北海", "type": "judge", "q": "北海阅古楼内嵌《三希堂石渠宝笈法帖》石刻495方，收录自魏晋至明末135位书法家的340件作品。", "answer": "对", "explain": "与原文数据完全一致：石刻495方，135位书法家、340件（帖）作品，是我国现存最完整的古代书法集成刻石。", "source": "楼内嵌《三希堂石渠宝笈法帖》石刻 495 方，收录自魏晋至明末 135 位书法家、340 件（帖）作品。"}, {"section": "北海", "type": "multi", "q": "下列关于北海濠濮间的说法，正确的有（　）。", "options": ["A. 建于清乾隆二十二年（1757年）", "B. 由乾隆皇帝亲定其名", "C. 名称取自《庄子》与《世说新语》典故", "D. 位于北海北岸"], "answer": "ABC", "explain": "濠濮间建于乾隆二十二年（1757年），乾隆亲定其名，取自《庄子》《世说新语》典故；其位于北海东岸而非北岸，D错。", "source": "濠濮间（东岸）……修建年代：清乾隆二十二年（1757 年）。命名者：乾隆皇帝亲定其名。名称出处：取自《庄子》与《世说新语》典故。"}, {"section": "北海", "type": "single", "q": "北海地区在历史上原为（　）的故道。", "options": ["A. 潮白河", "B. 永定河（古高梁河）", "C. 温榆河", "D. 拒马河"], "answer": "B", "explain": "北海地区在历史上原为永定河（古高梁河）的故道，河道南迁后经辽、金引水营建形成湖泊园林。", "source": "北海地区在历史上原为永定河（古高梁河）的故道。"}, {"section": "北海", "type": "judge", "q": "北海极乐世界殿内高悬的“极乐世界”四字金匾为慈禧太后御笔。", "answer": "错", "explain": "题写者有误，殿内“极乐世界”四字金匾为乾隆皇帝御笔，而非慈禧太后。", "source": "所悬匾额题写者：殿内高悬金匾“极乐世界”四字为乾隆皇帝御笔。"}, {"section": "北海", "type": "single", "q": "金代以瑶屿（琼华岛）为中心在今北海地区营建的皇家离宫是（　）。", "options": ["A. 大宁离宫", "B. 瑶屿行宫", "C. 广寒殿", "D. 畅春园"], "answer": "A", "explain": "金世宗大定年间营建大宁离宫（又称太宁宫、万宁宫），基本奠定今日北海格局；瑶屿行宫为辽代，广寒殿为元代建筑。", "source": "金代：世宗建“大宁离宫”（又称太宁宫、万宁宫）……以瑶屿（琼华岛）为中心修建，基本奠定今日北海格局。"}, {"section": "北海", "type": "multi", "q": "下列关于北海澄观堂、快雪堂与铁影壁的说法，正确的有（　）。", "options": ["A. 澄观堂与浴兰轩建于清乾隆十一年（1746年）", "B. 快雪堂为一座金丝楠木大殿", "C. 铁影壁为元代遗物", "D. 铁影壁由一块中性火山岩雕成", "E. 快雪堂因藏《三希堂法帖》石刻而得名"], "answer": "ABCD", "explain": "快雪堂因藏《快雪堂法帖》石刻而得名，并非《三希堂法帖》（后者藏于阅古楼），E错；其余四项均与原文相符。", "source": "澄观堂与浴兰轩建于清乾隆十一年（1746 年）……快雪堂（一座金丝楠木大殿，因藏《快雪堂法帖》石刻……而得名）……铁影壁：元代遗物，由一块中性火山岩雕成。"}, {"section": "北海", "type": "single", "q": "北海永安寺中轴线上的主殿法轮殿内供奉的是（　）。", "options": ["A. 释迦牟尼", "B. 弥勒", "C. 大威德金刚", "D. 宗喀巴"], "answer": "A", "explain": "法轮殿为主殿，供释迦牟尼；正觉殿供弥勒，善因殿供大威德金刚，普安殿供宗喀巴。", "source": "主要殿宇：山门、法轮殿（主殿，供释迦牟尼）、正觉殿（供弥勒）、普安殿、善因殿（供大威德金刚）。"}, {"section": "北海", "type": "single", "q": "北海永安桥北端牌楼额题的是（　）。", "options": ["A. “积翠”", "B. “堆云”", "C. “琼岛”", "D. “春阴”"], "answer": "B", "explain": "桥两端牌楼南端额题“积翠”、北端额题“堆云”，合称“积翠”“堆云”牌坊。", "source": "南端牌楼额题“积翠”，北端牌楼额题“堆云”，合称“积翠”“堆云”牌坊。"}, {"section": "北海", "type": "multi", "q": "下列属于北海五龙亭中各亭名称的有（　）。", "options": ["A. 龙泽亭", "B. 澄祥亭", "C. 滋香亭", "D. 涌瑞亭", "E. 辑芳亭"], "answer": "ABCD", "explain": "五龙亭中为龙泽亭，两侧为澄祥亭、滋香亭、涌瑞亭、浮翠亭；辑芳亭是景山五方亭之一，不属于北海。", "source": "五亭临水一字排开，中为龙泽亭……两侧分别为澄祥亭、滋香亭、涌瑞亭、浮翠亭。"}, {"section": "北海", "type": "single", "q": "北海永安寺普安殿内宗喀巴主尊两侧的坐像是（　）。", "options": ["A. 贾曹杰与克珠杰", "B. 阿难与迦叶", "C. 舍利弗与目犍连", "D. 莲花生与寂护"], "answer": "A", "explain": "普安殿两侧坐像为宗喀巴两大弟子贾曹杰与克珠杰（即后世达赖、班禅体系之源）。", "source": "殿内两侧坐像为其两大弟子——贾曹杰与克珠杰（一说为达赖、班禅像）。"}, {"section": "北海", "type": "single", "q": "北海白塔的高度为（　）。", "options": ["A. 29.9米", "B. 32.5米", "C. 35.9米", "D. 40.8米"], "answer": "C", "explain": "白塔塔高35.9米，塔基边长约18.2米，塔肚最大直径约14米，是全园最高点。", "source": "关键数据：塔高 35.9 米，塔基边长约 18.2 米，塔肚最大直径约 14 米。"}, {"section": "北海", "type": "single", "q": "北海团城上被乾隆皇帝册封为“白袍将军”的是（　）。", "options": ["A. 古油松", "B. 白皮松", "C. 古柏", "D. 国槐"], "answer": "B", "explain": "白皮松被封为“白袍将军”；古油松则被封为“遮荫侯”，注意区分。", "source": "古油松被乾隆皇帝册封为“遮荫侯”……另有白皮松被封为“白袍将军”。"}, {"section": "北海", "type": "single", "q": "北海公园静心斋的俗称是（　）。", "options": ["A. 乾隆小花园", "B. 慈禧西苑行宫", "C. 小颐和园", "D. 镜中园"], "answer": "A", "explain": "静心斋原名镜清斋，俗称“乾隆小花园”，为乾隆仿江南园林之作。", "source": "静心斋（原名镜清斋，俗称“乾隆小花园”，北岸）。"}, {"section": "北海", "type": "single", "q": "清末曾与师傅翁同龢在画舫斋居住读书的皇帝是（　）。", "options": ["A. 光绪帝", "B. 同治帝", "C. 咸丰帝", "D. 宣统帝"], "answer": "A", "explain": "光绪帝曾与师傅翁同龢在画舫斋居住读书；画舫斋为乾隆读书、休憩、赏画、避暑的行宫。", "source": "光绪帝曾与师傅翁同龢在此居住读书。斋内以水池为中心，藏乾隆朝名家画作。"}, {"section": "北海", "type": "single", "q": "北海静心斋始建的时间是（　）。", "options": ["A. 乾隆十八年（1753年）", "B. 乾隆二十一年（1756年）", "C. 乾隆二十四年（1759年）", "D. 乾隆三十五年（1770年）"], "answer": "B", "explain": "静心斋清乾隆二十一年（1756年）始建，乾隆二十三年（1758年）竣工，为太子读书之处。", "source": "修建年代：清乾隆二十一年（1756 年）始建，乾隆二十三年（1758 年）竣工。"}, {"section": "北海", "type": "single", "q": "北海极乐世界（小西天）主殿是中国最大的（　）宫殿建筑。", "options": ["A. 方亭式", "B. 重檐庑殿式", "C. 八角攒尖式", "D. 十字脊式"], "answer": "A", "explain": "主殿“极乐世界”殿为中国最大的方亭式宫殿建筑，总面积约1200平方米，横梁跨度13.5米，四面环水。", "source": "主殿“极乐世界”殿为中国最大的方亭式宫殿建筑（总面积约 1200 平方米，横梁跨度 13.5 米），四面环水。"}, {"section": "景山", "type": "single", "q": "历史上曾把景山一带作为皇帝躬耕之所的朝代是（　）。", "options": ["A. 辽代", "B. 金代", "C. 元代", "D. 明代"], "answer": "C", "explain": "元世祖忽必烈营建大都时，将景山一带辟为“后苑”，元代皇帝曾在此躬耕，以昭示天下劝课农桑。", "source": "元代。元世祖忽必烈营建大都时，将景山一带辟为专供皇帝游赏的“后苑”，元代皇帝曾在此躬耕，以昭示天下劝课农桑"}, {"section": "景山", "type": "judge", "q": "景山于2001年由国务院公布为第五批全国重点文物保护单位。", "answer": "对", "explain": "与原文一致：景山于2001年由国务院公布为第五批全国重点文物保护单位。", "source": "景山于 2001 年由国务院公布为第五批全国重点文物保护单位。"}, {"section": "景山", "type": "multi", "q": "景山在明清历史上曾出现过的名称有（　）。", "options": ["A. 青山", "B. 万岁山", "C. 镇山", "D. 煤山", "E. 万寿山"], "answer": "ABCD", "explain": "元代称“青山”（亦有“镇山”之说），明代称“万岁山”，俗称“镇山”“煤山”，清代改称“景山”。万寿山是元代北海琼华岛的赐名，与景山无关。", "source": "历史名称：元代称“青山”（亦有“镇山”之说），为皇城后苑；明代称“万岁山”，俗称“镇山”“煤山”；清代改称“景山”并沿用至今。"}, {"section": "景山", "type": "single", "q": "景山被称为“万岁山”始于（　）。", "options": ["A. 明永乐十八年（1420年）", "B. 明万历十三年（1585年）", "C. 清顺治十二年（1655年）", "D. 清乾隆十五年（1750年）"], "answer": "A", "explain": "明永乐十八年（1420年），明成祖朱棣营建北京时堆筑五峰，取名“万岁山”；清顺治十二年（1655年）更名“景山”。", "source": "“万岁山”年代：明永乐年间（永乐十八年，1420 年），明成祖朱棣营建北京时……形成五峰，取名“万岁山”。"}, {"section": "景山", "type": "judge", "q": "明永乐十八年（1420年），明成祖朱棣将开挖紫禁城筒子河及太液池的泥土堆筑于此，形成五峰，取名“景山”。", "answer": "错", "explain": "当时取名为“万岁山”，更名“景山”是清顺治十二年（1655年）之事。", "source": "明永乐年间（永乐十八年，1420 年），明成祖朱棣营建北京时，将开挖紫禁城筒子河及太液池的泥土、拆毁元宫的渣土堆筑于此，形成五峰，取名“万岁山”。"}, {"section": "景山", "type": "single", "q": "清军入关后，顺治帝给崇祯帝自缢的那棵槐树加上铁链，称之为（　）。", "options": ["A. 忠槐", "B. 罪槐", "C. 思槐", "D. 御槐"], "answer": "B", "explain": "清军入关后，顺治帝为笼络人心，给此树加上铁链，称之为“罪槐”（亦称“弑君罪树”）。", "source": "清军入关后，顺治帝为笼络人心，给此树加上铁链，称之为“罪槐”（亦称“弑君罪树”），并规定清室皇族成员路过此地须下马步行。"}, {"section": "景山", "type": "judge", "q": "崇祯帝朱由检于景山西坡的歪脖古槐树下自缢身亡。", "answer": "错", "explain": "方位有误，应为景山东坡（东麓），而非西坡。", "source": "位置：景山东麓（东坡）山石之上（今“明思宗殉国处”）……于景山东坡歪脖古槐树下自缢身亡，时年 33 岁。"}, {"section": "景山", "type": "multi", "q": "下列属于景山五方亭的有（　）。", "options": ["A. 周赏亭", "B. 观妙亭", "C. 万春亭", "D. 辑芳亭", "E. 濠濮间"], "answer": "ABCD", "explain": "五方亭从东到西依次为周赏亭、观妙亭、万春亭、辑芳亭、富览亭。濠濮间是北海公园东岸的园中园，与景山无关。", "source": "从东到西五亭名称、琉璃瓦颜色及形制：周赏亭（东起第一峰）……观妙亭（东起第二峰）……万春亭（中峰）……辑芳亭（西起第二峰）……富览亭（西起第一峰）"}, {"section": "景山", "type": "single", "q": "景山五方亭建立于（　）。", "options": ["A. 明永乐十八年（1420年）", "B. 清顺治十二年（1655年）", "C. 清乾隆十五年（1750年）", "D. 清乾隆三十五年（1770年）"], "answer": "C", "explain": "景山五方亭建立于清乾隆十五年（1750年）。", "source": "建立年代：清乾隆十五年（1750 年）。"}, {"section": "景山", "type": "judge", "q": "清代亲往寿皇殿祭祀次数最多的皇帝是光绪帝，据记载曾亲往祭祀421次。", "answer": "对", "explain": "与原文一致：光绪帝曾亲往寿皇殿祭祀421次，为清代亲往祭祀次数最多的皇帝。", "source": "亲往祭祀次数最多的皇帝：光绪帝，据记载曾亲往寿皇殿祭祀 421 次。"}, {"section": "景山", "type": "single", "q": "景山万春亭内供奉的佛教造像是（　）。", "options": ["A. 宝生佛", "B. 阿閦佛", "C. 阿弥陀佛", "D. 毗卢遮那佛"], "answer": "D", "explain": "万春亭（中峰）内供毗卢遮那佛（大日如来，为密宗金刚界五方如来之首）；宝生佛在周赏亭，阿閦佛在观妙亭，阿弥陀佛在辑芳亭。", "source": "万春亭（中峰）：黄琉璃瓦、绿琉璃瓦剪边，三重檐四角攒尖顶（北京中轴线最高点）；内供毗卢遮那佛（大日如来，为密宗金刚界五方如来之首）。"}, {"section": "景山", "type": "judge", "q": "今景山北部的兴庆阁、集祥阁即元代贮存皇帝亲耕所获粮食的皇家粮仓旧址。", "answer": "对", "explain": "与原文一致：元代皇帝曾在景山一带躬耕，兴庆阁、集祥阁为元代贮存亲耕粮食的皇家粮仓旧址。", "source": "今景山北部的兴庆阁、集祥阁即元代贮存皇帝亲耕所获粮食的皇家粮仓旧址。"}, {"section": "景山", "type": "multi", "q": "下列属于寿皇殿殿前月台（须弥座）上陈设的有（　）。", "options": ["A. 铜鼎炉四座", "B. 铜鹤一对", "C. 铜鹿一对", "D. 石狮两对"], "answer": "ABC", "explain": "月台上陈列铜鼎炉四座、铜鹤一对、铜鹿一对（鹤象征长寿、鹿象征福禄）；石狮两对（四座）分列于砖城门（宫墙正门）前，不在月台上。", "source": "殿前月台陈设：月台（须弥座）上陈列铜鼎炉四座、铜鹤一对、铜鹿一对（鹤象征长寿、鹿象征福禄）。"}, {"section": "景山", "type": "single", "q": "景山南侧山脚下、正对景山南门（景山门）的建筑是（　）。", "options": ["A. 观德殿", "B. 绮望楼", "C. 寿皇殿", "D. 兴庆阁"], "answer": "B", "explain": "正对景山南门的建筑是绮望楼，乾隆十五年（1750年）在明代“山前殿”旧址上兴建。", "source": "正对景山南门（景山门）的建筑：绮望楼，乾隆十五年（1750 年）在明代“山前殿”旧址上兴建，黄琉璃筒瓦歇山顶，重楼重檐，立于山脚中轴线上。"}, {"section": "景山", "type": "judge", "q": "清顺治十二年（1655年），万岁山更名为“景山”并沿用至今。", "answer": "对", "explain": "与原文一致：清顺治十二年（1655年）更名“景山”；明代称“万岁山”，俗称“镇山”“煤山”。", "source": "更名“景山”年代：清顺治十二年（1655 年）……清代改称“景山”并沿用至今。"}, {"section": "景山", "type": "single", "q": "观德殿在明代的用途是（　）。", "options": ["A. 帝王习射（射箭）之所", "B. 帝后停灵之所", "C. 皇帝宴请官员之所", "D. 官学生读书之处"], "answer": "A", "explain": "观德殿始建于明万历年间，为明代帝王习射（射箭）之所，取《礼记·射义》“可以观德行”而得名；清代才作为停灵之所。", "source": "明代用途：为明代帝王习射（射箭）之所，取《礼记·射义》“可以观德行”而得名。"}, {"section": "景山", "type": "judge", "q": "1900年八国联军将景山五方亭内供奉的五尊铜铸镏金佛像全部劫走。", "answer": "错", "explain": "细节有误：八国联军劫走四尊、毁一尊（万春亭毗卢遮那佛），并非五尊全部劫走；今万春亭佛像为后来重塑。", "source": "五亭原各供奉铜铸镏金佛像一尊，统称“五方佛”，1900 年八国联军劫走四尊、毁一尊（万春亭毗卢遮那佛），今万春亭佛像为后来重塑。"}, {"section": "景山", "type": "multi", "q": "关于“景山”名称由来的主流说法，下列正确的有（　）。", "options": ["A. “景”有“高大”之意，语出《诗经·殷武》“陟彼景山，松柏丸丸”", "B. 此处为帝后“御景”之地", "C. 含有“景仰”之意", "D. 因明代在山上堆煤而得名"], "answer": "ABC", "explain": "景山得名主流有三说：①“景”有高大之意，语出《诗经·殷武》；②帝后“御景”之地；③含“景仰”之意。“煤山”只是明代俗称，并非“景山”得名之由，D错。", "source": "名称由来（主流有三种说法）：①“景”有“高大”之意，语出《诗经·殷武》……②此处为帝后“御景”之地；③含有“景仰”之意。"}, {"section": "景山", "type": "single", "q": "寿皇殿始建年代是（　）。", "options": ["A. 明万历十三年（1585年）", "B. 明永乐十八年（1420年）", "C. 清乾隆十四年（1749年）", "D. 清乾隆十五年（1750年）"], "answer": "A", "explain": "寿皇殿始建于明万历十三年（1585年）；乾隆十四年（1749年）命移建，乾隆十五年（1750年）建成于景山正北中轴线上。", "source": "始建年代：明万历十三年（1585 年）。改建到中轴线上年代：清乾隆十四年（1749 年）命移建，乾隆十五年（1750 年）建成于景山正北中轴线上。"}, {"section": "景山", "type": "judge", "q": "清代历朝帝后的梓宫均曾停灵于观德殿，道光帝也不例外。", "answer": "错", "explain": "道光帝例外，其梓宫停灵于圆明园正大光明殿，并未停灵于观德殿。", "source": "此后清代历朝帝后……梓宫多曾停灵于此（道光帝例外，其停灵于圆明园正大光明殿）。"}, {"section": "景山", "type": "single", "q": "北京市少年宫正式在寿皇殿成立的时间是（　）。", "options": ["A. 1955年", "B. 1956年1月1日", "C. 1957年", "D. 2013年"], "answer": "B", "explain": "1955年文化部文物局指示将寿皇殿划归少年宫使用；1956年1月1日北京市少年宫正式在寿皇殿成立，使用至2013年11月腾退迁出。", "source": "1955 年文化部文物局指示将寿皇殿院内全部建筑划归少年宫使用；1956 年 1 月 1 日，北京市少年宫正式在寿皇殿成立。"}, {"section": "景山", "type": "multi", "q": "下列属于景山北部（山后）主要景点的有（　）。", "options": ["A. 寿皇殿建筑群", "B. 观德殿", "C. 永思殿", "D. 关帝庙（护国忠义庙）", "E. 绮望楼"], "answer": "ABCD", "explain": "景山北部主要景点包括寿皇殿建筑群、观德殿、永思殿、兴庆阁、集祥阁、关帝庙等；绮望楼位于景山南侧山脚下，不属于山后，E错。", "source": "景山北部……主要景点包括：寿皇殿建筑群……观德殿、永思殿、兴庆阁、集祥阁……关帝庙（护国忠义庙）等。"}, {"section": "景山", "type": "single", "q": "景山被列为全国重点文物保护单位的批次是（　）。", "options": ["A. 第三批", "B. 第四批", "C. 第五批", "D. 第六批"], "answer": "C", "explain": "景山于2001年由国务院公布为第五批全国重点文物保护单位。", "source": "景山于 2001 年由国务院公布为第五批全国重点文物保护单位。"}, {"section": "景山", "type": "single", "q": "景山在明清北京城中的位置是（　）。", "options": ["A. 内城中心、紫禁城之北、皇城之中", "B. 紫禁城之南、皇城之外", "C. 内城西北隅、积水潭之畔", "D. 外城中心、正阳门之南"], "answer": "A", "explain": "景山位于明清北京内城中心、紫禁城（宫城）之北、皇城之中，坐落在北京中轴线上，是明清北京城的几何中心与制高点。", "source": "景山位于明清北京内城中心、紫禁城（宫城）之北、皇城之中，坐落在北京中轴线上。"}, {"section": "景山", "type": "multi", "q": "下列关于寿皇殿的说法，正确的有（　）。", "options": ["A. 始建于明万历十三年（1585年）", "B. 清乾隆十五年（1750年）建成于景山正北中轴线上", "C. 仿太庙规制而建", "D. 黄琉璃瓦重檐庑殿顶，面阔九间、进深五间", "E. 仿天坛祈年殿规制而建"], "answer": "ABCD", "explain": "寿皇殿始建于明万历十三年（1585年），乾隆十五年（1750年）建成于景山正北中轴线上，仿太庙规制，黄琉璃瓦重檐庑殿顶、面阔九间进深五间。E项“仿天坛祈年殿”错误。", "source": "始建年代：明万历十三年（1585 年）……仿太庙规制而建……黄琉璃瓦重檐庑殿顶，面阔九间、进深五间。"}, {"section": "景山", "type": "single", "q": "明崇祯帝朱由检于景山自缢身亡时，时年（　）。", "options": ["A. 31岁", "B. 33岁", "C. 35岁", "D. 38岁"], "answer": "B", "explain": "明崇祯十七年（1644年）农历三月十九日，崇祯帝于景山东坡歪脖古槐树下自缢身亡，时年33岁。", "source": "明崇祯十七年（1644 年，农历三月十九日）……于景山东坡歪脖古槐树下自缢身亡，时年 33 岁。"}, {"section": "景山", "type": "single", "q": "景山五方亭中，观妙亭（东起第二峰）所覆琉璃瓦为（　）。", "options": ["A. 黄琉璃瓦、绿琉璃瓦剪边", "B. 翡翠绿琉璃瓦、黄琉璃瓦剪边", "C. 孔雀蓝琉璃瓦、紫晶色琉璃瓦剪边", "D. 翡翠绿琉璃瓦、紫晶色琉璃瓦剪边"], "answer": "B", "explain": "观妙亭覆翡翠绿琉璃瓦、黄琉璃瓦剪边；黄瓦绿剪边为万春亭，孔雀蓝瓦紫晶剪边为周赏亭与富览亭。", "source": "观妙亭（东起第二峰）：翡翠绿琉璃瓦、黄琉璃瓦剪边，重檐八角攒尖顶；内供阿閦佛。"}, {"section": "景山", "type": "single", "q": "景山五方亭中，富览亭（西起第一峰）内供奉的佛像是（　）。", "options": ["A. 宝生佛", "B. 阿閦佛", "C. 阿弥陀佛", "D. 不空成就佛"], "answer": "D", "explain": "富览亭内供不空成就佛；宝生佛在周赏亭，阿閦佛在观妙亭，阿弥陀佛在辑芳亭。", "source": "富览亭（西起第一峰）：孔雀蓝琉璃瓦、紫晶色琉璃瓦剪边，重檐圆攒尖顶；内供不空成就佛。"}, {"section": "景山", "type": "single", "q": "景山绮望楼在乾隆年间办官学时内供孔子牌位，其东南侧曾设置的机构是（　）。", "options": ["A. 八旗子弟学校（八旗学舍）", "B. 国子监", "C. 上书房", "D. 南书房"], "answer": "A", "explain": "绮望楼东南曾建八旗子弟学校（八旗学舍），供官学生读书习艺，今已无存。", "source": "东南侧曾设机构：绮望楼东南曾建八旗子弟学校（八旗学舍），供官学生读书习艺，今已无存。"}, {"section": "景山", "type": "single", "q": "至清康熙年间，皇帝经常在景山山前殿宴请的对象是（　）。", "options": ["A. 各地来京朝贺的文武官员、各部落首领、公使等", "B. 八旗官学生", "C. 后宫嫔妃及皇子", "D. 来华外国传教士"], "answer": "A", "explain": "清康熙年间，皇帝经常在山前殿宴请各地来京朝贺的文武官员、各部落首领、公使等；殿前曾设校场观看宗室射箭。", "source": "至清康熙年间，皇帝经常在山前殿宴请各地来京朝贺的文武官员、各部落首领、公使等。"}, {"section": "景山", "type": "single", "q": "清代首位在观德殿停灵的帝后是（　）。", "options": ["A. 孝贤皇后富察氏", "B. 孝圣皇太后", "C. 慈安太后", "D. 慈禧太后"], "answer": "A", "explain": "乾隆十三年（1748年）孝贤皇后富察氏崩逝，观德殿成为其在京停灵之所，为首位在此停灵者。", "source": "乾隆十三年（1748 年）孝贤皇后富察氏崩逝，观德殿成为其在京停灵之所，为首位在此停灵者。"}, {"section": "景山", "type": "single", "q": "寿皇殿作为北京市少年宫使用，腾退迁出的时间是（　）。", "options": ["A. 2008年", "B. 2013年11月", "C. 2016年", "D. 2018年11月"], "answer": "B", "explain": "寿皇殿作为北京市少年宫使用至2013年11月腾退迁出；2018年11月为修缮后重新向公众开放的时间。", "source": "寿皇殿作为北京市少年宫使用至 2013 年 11 月腾退迁出，2018 年 11 月修缮后重新向公众开放。"}, {"section": "雍和宫", "type": "single", "q": "藏传佛教格鲁派创始人宗喀巴生于哪一年？", "options": ["A. 1337年", "B. 1357年", "C. 1377年", "D. 1397年"], "answer": "B", "explain": "宗喀巴诞生于青海湟中县（今塔尔寺所在地），生于1357年。", "source": "宗喀巴诞生地：青海湟中县（今塔尔寺所在地），生于 1357 年，是藏传佛教格鲁派创始人。"}, {"section": "雍和宫", "type": "judge", "q": "雍和宫占地面积约6.6公顷，即66,400平方米。", "answer": "对", "explain": "原文：占地面积约6.6公顷（66,400平方米），官方与多数资料采用此数据。", "source": "占地面积：约 6.6 公顷（66,400 平方米）。"}, {"section": "雍和宫", "type": "multi", "q": "下列建筑中，属于雍和宫中路（中轴线上）建筑的有（ ）。", "options": ["A. 昭泰门", "B. 雍和门", "C. 法轮殿", "D. 万福阁", "E. 太和殿"], "answer": "ABCD", "explain": "雍和宫中路建筑由南向北为：宝坊院→辇道→昭泰门→雍和门→雍和宫大殿→永佑殿→法轮殿→万福阁→绥成楼。太和殿属故宫。", "source": "中路上建筑名称及顺序（由南向北，沿中轴线）：宝坊院（三座牌楼）→ 辇道 → 昭泰门（山门）→ 雍和门（天王殿）→ 雍和宫大殿 → 永佑殿 → 法轮殿 → 万福阁 → 绥成楼。"}, {"section": "雍和宫", "type": "single", "q": "雍和宫（雍亲王府）始建于何时？", "options": ["A. 康熙三十三年（1694年）", "B. 雍正三年（1725年）", "C. 乾隆九年（1744年）", "D. 乾隆十五年（1750年）"], "answer": "A", "explain": "雍亲王府时期始于康熙三十三年（1694年）始建，为胤禛的府邸。", "source": "三个时期：①雍亲王府时期（康熙三十三年/1694 年始建，胤禛的府邸）。"}, {"section": "雍和宫", "type": "judge", "q": "雍和宫属于藏传佛教宁玛派，因僧人着红衣红帽得名。", "answer": "错", "explain": "雍和宫属于藏传佛教格鲁派，俗称\"黄教\"，因僧人着黄衣黄帽得名。", "source": "派系：雍和宫属于藏传佛教格鲁派（俗称\"黄教\"，因僧人着黄衣黄帽得名）。"}, {"section": "雍和宫", "type": "single", "q": "雍亲王府更名为\"雍和宫\"是在哪一年？", "options": ["A. 1694年", "B. 1725年", "C. 1744年", "D. 1792年"], "answer": "B", "explain": "清雍正三年（1725年），王府升格为行宫，赐名\"雍和宫\"。", "source": "雍亲王府更名\"雍和宫\"时间：清雍正三年（1725 年）（王府升格为行宫，赐名\"雍和宫\"）。"}, {"section": "雍和宫", "type": "judge", "q": "藏传佛教格鲁派创始人宗喀巴诞生于青海湟中县（今塔尔寺所在地），生于1357年。", "answer": "对", "explain": "原文明确：宗喀巴诞生地为青海湟中县（今塔尔寺所在地），生于1357年。", "source": "宗喀巴诞生地：青海湟中县（今塔尔寺所在地），生于 1357 年，是藏传佛教格鲁派创始人。"}, {"section": "雍和宫", "type": "multi", "q": "雍和宫中路前部体现\"伽蓝七堂\"式布局的七座建筑包括（ ）。", "options": ["A. 昭泰门", "B. 雍和宫殿", "C. 万福阁", "D. 讲经殿", "E. 密宗殿"], "answer": "ABDE", "explain": "七堂为：昭泰门、钟楼、鼓楼、雍和门（天王殿）、雍和宫殿（大雄宝殿）、讲经殿、密宗殿。万福阁属后部诸殿，不在其中。", "source": "雍和宫中路前部七座建筑——昭泰门、钟楼、鼓楼、雍和门（天王殿）、雍和宫殿（大雄宝殿）、讲经殿、密宗殿，呈现汉传佛教寺院\"七堂伽蓝\"的标准布局。"}, {"section": "雍和宫", "type": "single", "q": "雍和宫改为藏传佛教格鲁派寺院是在哪一年？", "options": ["A. 雍正三年（1725年）", "B. 雍正十三年（1735年）", "C. 乾隆九年（1744年）", "D. 乾隆十五年（1750年）"], "answer": "C", "explain": "乾隆九年（1744年）改为藏传佛教格鲁派寺院。", "source": "③藏传佛教寺院时期（乾隆九年/1744 年改为藏传佛教格鲁派寺院）。"}, {"section": "雍和宫", "type": "judge", "q": "雍正三年（1725年），雍和宫改为藏传佛教格鲁派寺院。", "answer": "错", "explain": "雍正三年（1725年）是升格为行宫、始称\"雍和宫\"；改为藏传佛教格鲁派寺院是乾隆九年（1744年）。", "source": "②行宫时期（雍正三年/1725 年升格为皇帝行宫，始称\"雍和宫\"）；③藏传佛教寺院时期（乾隆九年/1744 年改为藏传佛教格鲁派寺院）。"}, {"section": "雍和宫", "type": "single", "q": "雍和宫历史上最大规模扩建（宫改庙工程）告竣于哪一年？", "options": ["A. 乾隆九年（1744年）", "B. 乾隆十五年（1750年）", "C. 乾隆四十五年（1780年）", "D. 乾隆五十七年（1792年）"], "answer": "B", "explain": "乾隆九年（1744年）奉旨改宫建庙，持续扩建至乾隆十五年（1750年）宫改庙工程告竣。", "source": "最大规模扩建时间：乾隆九年（1744 年）奉旨改宫建庙，并持续扩建至乾隆十五年（1750 年）宫改庙工程告竣，为历史上最大规模扩建。"}, {"section": "雍和宫", "type": "judge", "q": "出生于雍亲王府（今雍和宫）如意室的皇帝是乾隆帝（弘历）。", "answer": "对", "explain": "乾隆帝弘历生于雍亲王府如意室；雍正帝本人出生于紫禁城，并非生于雍王府。", "source": "出生于雍王府的皇帝：乾隆帝（弘历），生于雍亲王府（今雍和宫）如意室，雍正、乾隆两代帝王曾居此，故称\"龙潜福地\"。"}, {"section": "雍和宫", "type": "multi", "q": "雍和宫四学殿（又称\"四大扎仓\"）的构成包括（ ）。", "options": ["A. 讲经殿（显宗殿）", "B. 密宗殿", "C. 数学殿（时轮殿）", "D. 药师殿（医学殿）", "E. 大经堂"], "answer": "ABCD", "explain": "四学殿由讲经殿、密宗殿、数学殿（时轮殿）、药师殿（医学殿）组成，分别学修显宗教义、密法、时轮历算、藏医药知识。", "source": "四学殿（又称\"四大扎仓\"）由讲经殿（显宗殿）、密宗殿、数学殿（时轮殿）、药师殿（医学殿）组成。"}, {"section": "雍和宫", "type": "single", "q": "\"金瓶掣签\"制度由哪一年颁布的《钦定藏内善后章程》确立？", "options": ["A. 1744年", "B. 1750年", "C. 1780年", "D. 1792年"], "answer": "D", "explain": "金瓶掣签制由乾隆五十七年（1792年）《钦定藏内善后章程》确立。", "source": "此制由乾隆五十七年（1792 年）《钦定藏内善后章程》确立。"}, {"section": "雍和宫", "type": "judge", "q": "金刚驱魔神舞俗称\"打鬼\"\"跳布扎\"，藏语称\"羌姆\"。", "answer": "对", "explain": "原文：金刚驱魔神舞俗称\"打鬼\"\"跳布扎\"，藏语\"羌姆\"，于正月二十九日、二月初一日跳。", "source": "其中正月二十九日、二月初一日（大建为三十日）两天跳金刚驱魔神舞（俗称\"打鬼\"\"跳布扎\"，藏语\"羌姆\"）。"}, {"section": "雍和宫", "type": "single", "q": "\"金瓶掣签\"所用两只金瓶中，掣定蒙古、青海等地转世活佛的一只安供于何处？", "options": ["A. 西藏拉萨大昭寺", "B. 北京雍和宫", "C. 青海塔尔寺", "D. 西藏布达拉宫"], "answer": "B", "explain": "一只供奉于拉萨大昭寺（掣定西藏地区转世活佛）；一只安供于北京雍和宫（掣定蒙古、青海等地转世活佛）。", "source": "金瓶掣签两只金瓶存放地点：一只供奉于西藏拉萨大昭寺（掣定西藏地区转世活佛）；一只安供于北京雍和宫（掣定蒙古、青海等地转世活佛）。"}, {"section": "雍和宫", "type": "judge", "q": "雍和宫熬腊八粥所用大铜锅高2.5米、直径1.5米、重约8吨。", "answer": "错", "explain": "大铜锅高1.5米、直径2.5米、重约8吨，题干将高与直径颠倒了。", "source": "大锅尺寸：雍和门前鼓楼脚下的大铜锅，高 1.5 米、直径 2.5 米、重约 8 吨，由清宫廷造办处制造，为雍和宫\"四宝\"之一。"}, {"section": "雍和宫", "type": "multi", "q": "雍和宫大殿佛像前供奉的\"七珍\"（转轮圣王七宝）包括（ ）。", "options": ["A. 金轮宝", "B. 白象宝", "C. 绀马宝", "D. 玉女宝", "E. 夜明珠"], "answer": "ABCD", "explain": "七珍为：金轮宝、白象宝、绀马宝、神珠宝、玉女宝、主藏臣宝、主兵臣宝。夜明珠不在其中。", "source": "佛像前供奉的七珍（转轮圣王七宝）：金轮宝、白象宝、绀马宝、神珠宝、玉女宝、主藏臣宝、主兵臣宝。"}, {"section": "雍和宫", "type": "single", "q": "雍和宫辇道院中专供清代皇帝乘辇礼佛的辇道（御路）全长约多少？", "options": ["A. 约100米", "B. 约150米", "C. 约200米", "D. 约300米"], "answer": "C", "explain": "辇道全长约200米（一说约152米），东西两侧开有小门，内为佛仓（活佛行馆）。", "source": "院中有一条用方砖铺砌、专供清代皇帝乘辇礼佛的辇道（御路），全长约 200 米（一说约 152 米）；辇道东西两侧开有小门，内为佛仓（活佛行馆）。"}, {"section": "雍和宫", "type": "judge", "q": "雍正帝驾崩后，梓宫（棺椁）曾停灵于雍和宫的法轮殿。", "answer": "错", "explain": "雍正帝驾崩后梓宫停灵于永佑殿（
