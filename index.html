<style>
:root {
  --bg: #f5f5f7; --card: #ffffff; --text: #1d1d1f; --sub: #6e6e73;
  --accent: #0071e3; --accent-soft: #e8f0fd;
  --ok: #34a853; --ok-soft: #e6f4ea; --bad: #d93025; --bad-soft: #fce8e6;
  --border: #d2d2d7; --radius: 18px;
}
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
body { background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",sans-serif; line-height:1.6; padding-bottom:80px; }
.wrap { max-width:820px; margin:0 auto; padding:0 16px; }
header { padding:40px 0 8px; text-align:center; }
header h1 { font-size:26px; font-weight:700; letter-spacing:-0.5px; }
header p { color:var(--sub); font-size:13px; margin-top:6px; }
.stats { display:flex; justify-content:center; gap:10px; flex-wrap:wrap; margin:18px 0 6px; }
.chip { background:var(--card); border:1px solid var(--border); border-radius:999px; padding:6px 16px; font-size:13px; color:var(--sub); }
.chip b { color:var(--text); font-size:15px; }
.toolbar { position:sticky; top:0; z-index:10; background:rgba(245,245,247,.88); backdrop-filter:saturate(180%) blur(20px); padding:12px 0; }
.tabs { display:flex; background:#e8e8ed; border-radius:12px; padding:3px; max-width:560px; margin:0 auto; }
.tab { flex:1; text-align:center; padding:8px 0; font-size:13px; border-radius:9px; cursor:pointer; color:var(--sub); font-weight:500; transition:all .2s; user-select:none; }
.tab.active { background:#fff; color:var(--text); box-shadow:0 1px 4px rgba(0,0,0,.08); font-weight:600; }
.secfilter { display:flex; gap:8px; overflow-x:auto; padding:12px 2px 2px; scrollbar-width:none; }
.secfilter::-webkit-scrollbar { display:none; }
.secfilter .chip { white-space:nowrap; cursor:pointer; flex-shrink:0; }
.secfilter .chip.on { background:var(--accent); border-color:var(--accent); color:#fff; }
.secfilter .chip.on b { color:#fff; }
.card { background:var(--card); border-radius:var(--radius); padding:22px; margin:14px 0; box-shadow:0 1px 3px rgba(0,0,0,.04); }
.qhead { display:flex; gap:10px; align-items:baseline; margin-bottom:12px; flex-wrap:wrap; }
.qnum { color:var(--accent); font-weight:700; font-size:15px; }
.qsec { font-size:12px; color:var(--sub); background:var(--bg); border-radius:6px; padding:2px 8px; }
.qoos { font-size:12px; color:#8e8e93; background:#ececf0; border:1px dashed var(--border); border-radius:6px; padding:2px 8px; }
.qtext { font-size:16px; font-weight:600; }
.opts { margin-top:14px; display:flex; flex-direction:column; gap:8px; }
.opt { border:1.5px solid var(--border); border-radius:12px; padding:11px 14px; font-size:15px; cursor:pointer; transition:all .15s; }
.opt:hover { border-color:var(--accent); }
.opt.picked { border-color:var(--accent); background:var(--accent-soft); }
.opt.right { border-color:var(--ok); background:var(--ok-soft); }
.opt.wrong { border-color:var(--bad); background:var(--bad-soft); }
.opt.disabled { cursor:default; }
.explain { display:none; margin-top:14px; padding:14px; background:var(--bg); border-radius:12px; font-size:14px; color:var(--sub); }
.explain.show { display:block; }
.explain b { color:var(--text); }
.verdict { font-weight:700; margin-right:6px; }
.verdict.ok { color:var(--ok); } .verdict.bad { color:var(--bad); }
.src { margin-top:10px; border-top:1px dashed var(--border); padding-top:10px; font-size:13px; }
.src .srctag { color:var(--accent); font-weight:600; font-size:13px; }
.src .srcbody { margin-top:6px; color:var(--sub); background:#fff; border:1px solid var(--border); border-radius:8px; padding:10px 12px; white-space:pre-wrap; }
.bigreset { display:inline-block; margin-top:14px; background:var(--bad); color:#fff; border:none; border-radius:12px; padding:10px 28px; font-size:15px; font-weight:600; cursor:pointer; box-shadow:0 2px 8px rgba(217,48,37,.25); }
.bigreset:active { transform:scale(.97); }
.multi-submit { margin-top:10px; align-self:flex-start; background:var(--accent); color:#fff; border:none; border-radius:10px; padding:9px 22px; font-size:14px; font-weight:600; cursor:pointer; }
.multi-submit:disabled { opacity:.4; cursor:default; }
.scorebar { position:fixed; bottom:0; left:0; right:0; background:rgba(255,255,255,.92); backdrop-filter:blur(20px); border-top:1px solid var(--border); padding:10px 16px; display:flex; justify-content:center; gap:20px; font-size:13px; color:var(--sub); z-index:20; flex-wrap:wrap; }
.scorebar b { color:var(--text); }
.resetbtn { cursor:pointer; color:var(--accent); font-weight:600; }
footer { text-align:center; color:var(--sub); font-size:12px; margin-top:30px; }
.hidden { display:none !important; }
</style>
</head>

re", "type": "single", "q": "近代历史上，天安门广场对外开放的时间是（ ）。", "options": ["A.1914年5月", "B.1912年1月", "C.1919年5月", "D.1924年10月"], "answer": "A", "explain": "1914年（民国三年）5月，朱启钤主持改造后广场对外开放；拆下的千步廊木料用于建中央公园（今中山公园）。", "source": "1914年（民国三年）5月；朱启钤主持改造；千步廊木料建中央公园（今中山公园）"}, {"section": "天安门及天安门广场", "layer": "core", "type": "judge", "q": "中华人民共和国国徽由梁思成、林徽因（清华大学营建系）与张仃、周令钊、张光宇（中央美院）共同设计，高庄完善浮雕图案并制作模型。", "answer": "对", "explain": "与背诵版原文一致：国徽为集体设计，高庄完善浮雕图案并制作模型，1950年6月28日通过、9月20日公布。", "source": "集体设计；梁思成、林徽因（清华大学营建系）与张仃、周令钊、张光宇（中央美院）共同设计；高庄完善浮雕图案并制作模型"}, {"section": "天安门及天安门广场", "layer": "core", "type": "single", "q": "1950年对天安门广场的改造内容是（ ）。", "options": ["A.华表、石狮各向东西移6米", "B.拆除东西三座门", "C.拆除长安左门、长安右门", "D.改建砖混永久性观礼台"], "answer": "A", "explain": "1950年华表石狮各向东西移6米；拆三座门在1951年，拆长安左右门在1952年8月，永久观礼台在1954年6月。", "source": "1950年华表石狮各向东西移6米；1951年拆东西三座门；1952年8月拆长安左右门"}, {"section": "天安门及天安门广场", "layer": "core", "type": "judge", "q": "天安门外金水桥中，御路桥的望柱刻阴线24道，称“二十四气”式。", "answer": "错", "explain": "刻阴线24道、称“二十四气”式的是除御路桥外的其余6座桥；御路桥望柱雕云龙纹。", "source": "御路桥望柱雕云龙纹；其余6座望柱柱头均为火炬形（火焰式）、刻阴线24道、称“二十四气”式"}, {"section": "天安门及天安门广场", "layer": "core", "type": "multi", "q": "历史上在天安门广场发生的重大事件包括（ ）。", "options": ["A.1935年一二·九学生运动", "B.1947年反饥饿、反内战、反迫害游行", "C.1949年10月1日开国大典", "D.1976年四五运动"], "answer": "ABCD", "explain": "四项均见于背诵版重大事件列表，另有五四运动、五卅运动、三一八惨案、1900年八国联军屯兵等。", "source": "1947年反饥饿反内战反迫害游行；1949年10月1日开国大典；1976年四五运动；1900年八国联军屯兵"}, {"section": "天安门及天安门广场", "layer": "core", "type": "single", "q": "天安门城楼两侧砖混永久性观礼台改建完成于（ ）。", "options": ["A.1954年6月", "B.1952年8月", "C.1951年", "D.1958年"], "answer": "A", "explain": "1952年8月拆长安左右门后建砖木临时观礼台，1954年6月改建为砖混永久性观礼台。", "source": "1952年8月拆长安左右门、建砖木临时观礼台；1954年6月改建砖混永久性观礼台"}, {"section": "天安门及天安门广场", "layer": "core", "type": "judge", "q": "天安门城楼前后的华表通高约20米、重约10吨，顶蹲“望天犼”。", "answer": "错", "explain": "华表通高约10米、重约20吨，顶蹲“望天犼”；题干将高度与重量数据互换。", "source": "华表……通高约10米、重约20吨、顶蹲“望天犼”"}, {"section": "天安门及天安门广场", "layer": "core", "type": "single", "q": "人民大会堂与中国革命和历史博物馆的建造时间是（ ）。", "options": ["A 山如此多娇》", "B. 《祖国大地》", "C. 《万里长城》", "D. 《旭日东升》"], "answer": "B", "explain": "坐像背后为巨幅绒绣《祖国大地》（祖国山河图），寓意毛泽东同志与祖国锦绣山河永远同在。", "source": "北大厅墙壁背景图案：坐像背后为巨幅绒绣《祖国大地》（祖国山河图）", "layer": "ext"}, {"section": "天安门及天安门广场", "type": "single", "q": "毛主席纪念堂南大厅北墙镌刻的毛泽东手迹诗词是（ ）。", "options": ["A. 《沁园春·雪》", "B. 《满江红·和郭沫若同志》", "C. 《七律·长征》", "D. 《水调歌头·游泳》"], "answer": "B", "explain": "南大厅北墙镌刻毛泽东同志手迹《满江红·和郭沫若同志》，银胎鎏金镶于汉白玉墙面。", "source": "南大厅北墙镌刻诗词的作者：毛泽东同志手迹《满江红·和郭沫若同志》（银胎鎏金镶于汉白玉墙面）", "layer": "ext"}, {"section": "天安门及天安门广场", "type": "single", "q": "1900年庚子之变中，正阳门箭楼被烧毁的直接起因是（ ）。", "options": ["A. 义和团火烧大栅栏老德记洋货店，火势蔓延", "B. 八国联军直接炮击箭楼", "C. 雷击引发大火", "D. 瓮城内驻军失火"], "answer": "A", "explain": "义和团为抵制洋货火烧大栅栏老德记洋货店（西药房），火势蔓延烧毁箭楼；两个多月后英军所雇印度兵失火又烧毁城楼。", "source": "义和团为抵制洋货火烧大栅栏老德记洋货店（西药房），火势蔓延烧毁箭楼", "layer": "ext"}, {"section": "故宫（紫禁城）", "layer": "core", "type": "single", "q": "紫禁城建成于下列哪一年？", "options": ["A. 明永乐四年（1406年）", "B. 明永乐十八年（1420年）", "C. 明永乐十四年（1416年）", "D. 明洪熙元年（1425年）"], "answer": "B", "explain": "紫禁城于永乐十八年（1420年）建成；永乐四年（1406年）为始建之年，前后共14年，主体营造仅约3年。", "source": "永乐十八年（1420年）建成；前后共14年（主体营造仅约3年）"}, {"section": "故宫（紫禁城）", "layer": "core", "type": "judge", "q": "紫禁城于明永乐二年（1404年）由朱棣下诏始建。", "answer": "错", "explain": "紫禁城始建年代为明永乐四年（1406年），朱棣下诏始建；永乐十八年（1420年）建成，前后共14年。", "source": "明永乐四年（1406年）朱棣下诏始建；永乐十八年（1420年）建成；前后共14年"}, {"section": "故宫（紫禁城）", "layer": "core", "type": "multi", "q": "关于明朝入主紫禁城的皇帝，下列说法正确的有（ ）。", "options": ["A. 共14位", "B. 自永乐朱棣起", "C. 至崇祯朱由检止", "D. 朱元璋、建文帝均曾以紫禁城为皇宫", "E. 朱元璋、建文帝在南京"], "answer": "ABCE", "explain": "明朝入主紫禁城的皇帝共14位，自永乐朱棣至崇祯朱由检；朱元璋、建文帝在南京，未曾入主紫禁城，故D错误。", "source": "14位；自永乐朱棣至崇祯朱由检；朱元璋、建文帝在南京"}, {"section": "故宫（紫禁城）", "layer": "core", "type": "single", "q": "紫禁城工程设计和营造的蓝本是下列哪座宫殿？", "options": ["A. 元大都宫殿", "B. 南京故宫（南京明故宫）", "C. 北宋开封宫殿", "D. 明中都凤阳宫殿"], "answer": "B", "explain": "紫禁城工程设计和营造以南京故宫（南京明故宫）为蓝本。", "source": "紫禁城工程设计和营造的蓝本：南京故宫（南京明故宫）"}, {"section": "故宫（紫禁城）", "layer": "core", "type": "judge", "q": "宝蕴楼于1914年6月2日开工，1915年6月竣工，其前身为咸安宫官学旧址。", "answer": "对", "explain": "宝蕴楼1914年6月2日开工，1915年6月竣工，位于咸安宫官学旧址。注意清代咸安宫有两处，另一处于乾隆十六年改建为寿安宫，勿混。", "source": "1914年6月2日开工→1915年6月竣工；咸安宫官学旧址"}, {"section": "故宫（紫禁城）", "layer": "core", "type": "single", "q": "紫禁城的设计者，通说为下列哪位？", "options": ["A. 刘基", "B. 陈珪", "C. 蒯祥", "D. 朱棣"], "answer": "C", "explain": "设计者通说为蒯祥。注意区分：据考证最初规划者为刘基，总负责为陈珪，勿混淆。", "source": "设计者通说蒯祥（勿混：故宫考证最初规划刘基、总负责陈珪）", "oos": true}, {"section": "故宫（紫禁城）", "layer": "core", "type": "judge", "q": "溥仪被驱逐出紫禁城的时间是1924年10月5日。", "answer": "错", "explain": "溥仪被驱逐出宫的时间为1924年11月5日（冯玉祥北京政变，鹿钟麟执行），不是10月5日。", "source": "溥仪被驱逐出宫的时间：1924年11月5日"}, {"section": "故宫（紫禁城）", "layer": "core", "type": "multi", "q": "下列宫殿与其明代旧名对应正确的有（ ）。", "options": ["A. 中和殿——华盖殿", "B. 中和殿——中极殿", "C. 保和殿——谨身殿", "D. 保和殿——建极殿", "E. 太和殿——谨身殿"], "answer": "ABCD", "explain": "中和殿：华盖殿→中极殿→中和殿；保和殿：谨身殿→建极殿→保和殿。太和殿前身为奉天殿、皇极殿，E错误。更名发生在嘉靖四十一年（1562年）、顺治二年（1645年）。", "source": "中和殿：华盖殿→中极殿→中和殿；保和殿：谨身殿→建极殿→保和殿；嘉靖四十一年（1562年）、顺治二年（1645年）"}, {"section": "故宫（紫禁城）", "layer": "core", "type": "single", "q": "明朝入主紫禁城的皇帝共有多少位？", "options": ["A. 12位", "B. 14位", "C. 16位", "D. 24位"], "answer": "B", "explain": "明朝入主紫禁城的皇帝共14位，自永乐朱棣至崇祯朱由检；朱元璋、建文帝在南京。", "source": "明朝入主紫禁城的皇帝数量：14位；自永乐朱棣至崇祯朱由检"}, {"section": "故宫（紫禁城）", "layer": "core", "type": "judge", "q": "故宫博物院成立之日恰逢第14个国庆日。", "answer": "对", "explain": "故宫博物院1925年10月10日成立并开放，是日为第14个国庆日。", "source": "1925年10月10日；第14个国庆日"}, {"section": "故宫（紫禁城）", "layer": "core", "type": "single", "q": "1914年在紫禁城咸安宫原址上修建、用作古物陈列所文物库房的建筑是（ ）。", "options": ["A. 文渊阁", "B. 摛藻堂", "C. 宝蕴楼", "D. 箭亭"], "answer": "C", "explain": "1914年在紫禁城咸安宫原址上修建宝蕴楼，作为古物陈列所文物库房。", "source": "1914年在紫禁城咸安宫原址上修建的建筑：宝蕴楼；古物陈列所文物库房"}, {"section": "故宫（紫禁城）", "layer": "core", "type": "judge", "q": "明清颁朔礼的地点相同：明代在午门、清代在太和门举行。", "answer": "错", "explain": "地点说反了：明代在太和门（奉天门→皇极门）、清代在午门举行。乾隆避弘历名讳改称颁朔。", "source": "明在太和门（奉天门→皇极门）、清在午门；乾隆避弘历名讳改称颁朔"}, {"section": "故宫（紫禁城）", "layer": "core", "type": "multi", "q": "关于明清两代“御门听政”，下列说法正确的有（ ）。", "options": ["A. 明代在太和门（奉天门、皇极门）举行", "B. 清代在乾清门举行", "C. 夏秋在辰初（早7时）", "D. 冬春在辰正（早8时）", "E. 清代在午门举行"], "answer": "ABCD", "explain": "御门听政明在太和门（奉天门、皇极门），清在乾清门；时间夏秋辰初（早7时）、冬春辰正（早8时）。清代听政不在午门，E错误。", "source": "明在太和门（奉天门、皇极门）；清在乾清门；夏秋辰初（早7时）、冬春辰正（早8时）"}, {"section": "故宫（紫禁城）", "layer": "core", "type": "single", "q": "1924年冯玉祥北京政变后，执行驱逐溥仪出宫任务的是（ ）。", "options": ["A. 鹿钟麟", "B. 冯玉祥本人", "C. 段祺瑞", "D. 张作霖"], "answer": "A", "explain": "1924年11月5日溥仪被驱逐出宫，背景为冯玉祥北京政变，由鹿钟麟执行。", "source": "1924年11月5日；冯玉祥北京政变；鹿钟麟执行"}, {"section": "故宫（紫禁城）", "layer": "core", "type": "judge", "q": "明清两代共有24位皇帝曾在太和殿举行登极等重大典礼。", "answer": "对", "explain": "太和殿为国家重大典礼场所，明清两代共24位皇帝在此举行登极、大婚等重大典礼。", "source": "国家重大典礼场所（金銮殿）……24位皇帝"}, {"section": "故宫（紫禁城）", "layer": "core", "type": "single", "q": "故宫博物院正式成立并开放的时间是（ ）。", "options": ["A. 1914年6月2日", "B. 1924年11月5日", "C. 1925年10月10日", "D. 1915年6月"], "answer": "C", "explain": "故宫博物院于1925年10月10日正式成立并开放，当天恰为第14个国庆日。", "source": "故宫博物院成立的时间：1925年10月10日；第14个国庆日；正式成立并开放"}, {"section": "故宫（紫禁城）", "layer": "core", "type": "judge", "q": "太和殿前的嘉量为圆形，乾清宫前的嘉量为方形。", "answer": "错", "explain": "正好相反：方形嘉量在太和殿前，圆形嘉量在乾清宫前。嘉量结构为圆柱上部斛下部斗、左耳升、右耳上合下龠。", "source": "圆柱上部斛下部斗、左耳升、右耳上合下龠（方形在太和殿前；圆形在乾清宫前）"}, {"section": "故宫（紫禁城）", "layer": "core", "type": "multi", "q": "明清两代在太和殿举行的重要仪式包括（ ）。", "options": ["A. 登极", "B. 大婚", "C. 册立皇后", "D. 命将出征", "E. 殿试"], "answer": "ABCD", "explain": "太和殿（金銮殿）为国家重大典礼场所，举行登极、大婚、册立皇后、命将出征，并于万寿节、元旦、冬至三大节受贺赐宴，行金殿传胪。殿试自乾隆五十四年起在保和殿举行，E错误。", "source": "国家重大典礼场所（金銮殿）；登极、大婚、册立皇后、命将出征；万寿节、元旦、冬至三大节受贺赐宴；金殿传胪"}, {"section": "故宫（紫禁城）", "layer": "core", "type": "single", "q": "明清两代颁朔礼举行的时间是每年（ ）。", "options": ["A. 农历正月初一", "B. 农历十月初一", "C. 冬至日", "D. 农历四月二十一日"], "answer": "B", "explain": "明清颁朔礼于每年农历十月初一举行（明清同）；乾隆时避弘历名讳改称颁朔。", "source": "明清颁朔礼举行的时间：每年农历十月初一（明清同）"}, {"section": "故宫（紫禁城）", "layer": "core", "type": "judge", "q": "太和殿区域鎏金太平缸每口约重1696公斤，铸于明永乐年间。", "answer": "错", "explain": "太平缸每口约1696公斤无误，但铸造时间为清乾隆年间，非明永乐年间。", "source": "每口约1696公斤；清乾隆年间铸造"}, {"section": "故宫（紫禁城）", "layer": "core", "type": "single", "q": "太和殿自明代以来的名称演变顺序是（ ）。", "options": ["A. 华盖殿→中极殿→中和殿", "B. 谨身殿→建极殿→保和殿", "C. 奉天殿→皇极殿→太和殿", "D. 奉天门→皇极门→太和门"], "answer": "C", "explain": "太和殿：奉天殿→皇极殿→太和殿。华盖殿→中极殿→中和殿为中和殿演变，谨身殿→建极殿→保和殿为保和殿演变，奉天门→皇极门→太和门为太和门演变。", "source": "太和殿：奉天殿→皇极殿→太和殿"}, {"section": "故宫（紫禁城）", "layer": "core", "type": "judge", "q": "皇帝在举行祭祀先农活动的当日于中和殿阅视祝版。", "answer": "错", "explain": "阅视祝版在祭祀先农活动的前一日进行，而非当日；亲耕前还要查验种子和农具。", "source": "中和殿；前一日阅视祝版"}, {"section": "故宫（紫禁城）", "layer": "core", "type": "multi", "q": "太和殿前的陈设及其寓意，下列说法正确的有（ ）。", "options": ["A. 铜龟、铜鹤各一对，象征长寿、江山永固", "B. 铜鼎18座，象征内地18省", "C. 东侧日晷用于授时", "D. 西侧嘉量为度量衡标准器", "E. 铜狮一对，象征皇权"], "answer": "ABCD", "explain": "太和殿前陈设有日晷（东）授时、嘉量（西）度量衡；铜龟、铜鹤各一对象征长寿江山永固；铜鼎18座象征内地18省。殿内还有金漆雕龙宝座、宝象甪端仙鹤香亭四对、轩辕镜。无铜狮一对之说，E错误。", "source": "铜龟、铜鹤各一对（长寿江山永固）；铜鼎18座（内地18省）；殿内金漆雕龙宝座、宝象甪端仙鹤香亭四对、轩辕镜"}, {"section": "故宫（紫禁城）", "layer": "core", "type": "single", "q": "清顺治皇帝入关后举行登基大典的地点是（ ）。", "options": ["A. 皇极门（今太和门）", "B. 太和殿", "C. 乾清门", "D. 武英殿"], "answer": "A", "explain": "顺治元年（1644年），顺治帝入关后登基于皇极门（今太和门）。", "source": "顺治元年（1644年）登基于皇极门（今太和门）"}, {"section": "故宫（紫禁城）", "layer": "core", "type": "judge", "q": "殿试改在保和殿举行后，传胪仪式也随之移至保和殿。", "answer": "错", "explain": "乾隆五十四年（1789年）殿试始定于保和殿，但传胪仍在太和殿（金殿传胪）。", "source": "清乾隆五十四年（1789年）始定于保和殿；传胪仍在太和殿"}, {"section": "故宫（紫禁城）", "layer": "core", "type": "single", "q": "太和殿前东侧设日晷、西侧设嘉量，二者用途分别是（ ）。", "options": ["A. 度量衡、授时", "B. 授时、度量衡", "C. 防火、计时", "D. 象征长寿、象征江山永固"], "answer": "B", "explain": "太和殿前日晷在东，用于授时；嘉量在西，为标准度量衡器。", "source": "日晷（东）授时、嘉量（西）度量衡"}, {"section": "故宫（紫禁城）", "layer": "core", "type": "judge", "q": "紫禁城前朝两翼建筑布局为“左武右文”，东西对称。", "answer": "错", "explain": "应为“左文右武”：东路文华殿组群，西路武英殿组群（武英殿、浴德堂、断虹桥、咸安宫等），东西对称，中间有内金水河、断虹桥。", "source": "左文右武；东路文华殿组群……西路武英殿组群（武英殿、浴德堂、断虹桥、咸安宫等）；内金水河、断虹桥；东西对称"}, {"section": "故宫（紫禁城）", "layer": "core", "type": "multi", "q": "太和殿垂脊兽中的走兽包括（ ）。", "options": ["A. 龙", "B. 凤", "C. 狻猊", "D. 獬豸", "E. 麒麟"], "answer": "ABCD", "explain": "太和殿垂脊兽共10个走兽：龙、凤、狮子、天马、海马、狻猊、押鱼、獬豸、斗牛、行什，为现存古建仅见。麒麟不在其列，E错误。", "source": "10个走兽（现存古建仅见）；龙、凤、狮子、天马、海马、狻猊、押鱼、獬豸、斗牛、行什"}, {"section": "故宫（紫禁城）", "layer": "core", "type": "single", "q": "太和殿前嘉量所包含的五种计量单位是（ ）。", "options": ["A. 石、斗、升、合、勺", "B. 斛、斗、升、合、龠", "C. 斛、斗、升、合、勺", "D. 斗、升、合、龠、撮"], "answer": "B", "explain": "太和殿前嘉量为铜鎏金，乾隆九年（1744年）铸、仿新莽嘉量，含斛、斗、升、合、龠五种单位。", "source": "铜鎏金；乾隆九年（1744年）铸、仿新莽嘉量；斛、斗、升、合、龠五种单位"}, {"section": "故宫（紫禁城）", "layer": "core", "type": "judge", "q": "李自成在武英殿即位后的次日即撤离北京并火烧皇宫。", "answer": "对", "explain": "李自成1644年四月二十九日在武英殿即位，次日撤离火烧皇宫。", "source": "1644年四月二十九日；次日撤离火烧皇宫"}, {"section": "故宫（紫禁城）", "layer": "core", "type": "single", "q": "太和殿垂脊兽中的“行什”是哪一年重建时所加？", "options": ["A. 康熙三十四年（1695年）", "B. 乾隆九年（1744年）", "C. 嘉靖四十一年（1562年）", "D. 乾隆五十四年（1789年）"], "answer": "A", "explain": "行什为康熙三十四年（1695年）重建太和殿时所加。太和殿垂脊兽10个走兽为现存古建仅见。", "source": "行什为康熙三十四年（1695年）重建时所加"}, {"section": "故宫（紫禁城）", "layer": "core", "type": "judge", "q": "禁锢太子胤礽的咸安宫于乾隆十六年（1751年）改建并易名为寿安宫。", "answer": "对", "explain": "康熙五十一年（1712年）胤礽再废仍禁锢于咸安宫；乾隆十六年（1751年）改建易名寿安宫。注意勿与官学南移后新址（即今宝蕴楼）混淆。", "source": "乾隆十六年（1751年）改建易名寿安宫（勿混：官学南移后新址即今宝蕴楼）"}, {"section": "故宫（紫禁城）", "layer": "core", "type": "multi", "q": "紫禁城前朝东路文华殿组群包括（ ）。", "options": ["A. 文华殿", "B. 文渊阁", "C. 传心殿", "D. 内阁", "E. 武英殿"], "answer": "ABCD", "explain": "东路文华殿组群包括文华殿、文渊阁、传心殿、内阁、箭亭等；武英殿属西路武英殿组群，E错误。另有内金水河、断虹桥，东西对称。", "source": "东路文华殿组群（文华殿、文渊阁、传心殿、内阁、箭亭等）"}, {"section": "故宫（紫禁城）", "layer": "core", "type": "single", "q": "太和殿区域鎏金太平缸（门海、吉祥缸）的实际用途是（ ）。", "options": ["A. 授时", "B. 储水防火", "C. 度量衡标准器", "D. 庆典礼器"], "answer": "B", "explain": "鎏金太平缸又称门海、吉祥缸、太平缸，实际用途为储水防火；每口约1696公斤，清乾隆年间铸造。", "source": "储水防火（门海、吉祥缸、太平缸）"}, {"section": "故宫（紫禁城）", "layer": "core", "type": "judge", "q": "军机处始设于雍正七年（1729年），初名即为“办理军机处”。", "answer": "错", "explain": "雍正七年（1729年）设军机房，雍正十年改称办理军机处，初名并非办理军机处。", "source": "雍正七年（1729年）设军机房→十年改办理军机处"}, {"section": "故宫（紫禁城）", "layer": "core", "type": "single", "q": "中和殿“中和”一词的思想依据出自（ ）。", "options": ["A. 《孟子·尽心下》", "B. 《礼记·中庸》", "C. 《通书·志学》", "D. 《论语》"], "answer": "B", "explain": "“中和”出自《礼记·中庸》：“中也者天下之大本也；和也者天下之达道也”，意为不偏不倚、恰如其分，即中庸之道。", "source": "《礼记·中庸》；“中也者天下之大本也；和也者天下之达道也”；不偏不倚、恰如其分；中庸之道"}, {"section": "故宫（紫禁城）", "layer": "core", "type": "judge", "q": "乾清宫前丹陛上的嘉量为方形，与太和殿前的圆形嘉量相对。", "answer": "错", "explain": "正好相反：乾清宫前为圆形嘉量，太和殿前为方形嘉量。", "source": "日晷、嘉量各一（圆形嘉量）"}, {"section": "故宫（紫禁城）", "layer": "core", "type": "multi", "q": "关于紫禁城文渊阁，下列说法正确的有（ ）。", "options": ["A. 乾隆三十九年（1774年）建", "B. 专贮《四库全书》", "C. 覆黑色琉璃瓦，寓防火之意", "D. 贮藏《四库全书荟要》"], "answer": "ABC", "explain": "文渊阁乾隆三十九年（1774年）建，专贮《四库全书》，覆黑色琉璃瓦体现防火理念。《四库全书荟要》贮于御花园摛藻堂，D错误。", "source": "乾隆三十九年（1774年）建；专贮《四库全书》；黑色琉璃瓦（防火理念）"}, {"section": "故宫（紫禁城）", "layer": "core", "type": "single", "q": "中和殿内乾隆御笔匾额的内容是（ ）。", "options": ["A. 中正仁和", "B. 勤政亲贤", "C. 无为", "D. 允执厥中"], "answer": "D", "explain": "中和殿内悬乾隆御笔“允执厥中”匾。“中正仁和”“勤政亲贤”为养心殿雍正御笔，“无为”为交泰殿康熙御书，注意区分。", "source": "乾隆御笔“允执厥中”匾"}, {"section": "故宫（紫禁城）", "layer": "core", "type": "judge", "q": "江山社稷金殿设于乾清宫前东西丹陛文石台上各一座，象征皇帝为江山土地的唯一占有者。", "answer": "对", "explain": "江山社稷金殿（江山社稷亭）位于乾清宫前东西丹陛文石台上各一座，象征皇帝为江山土地唯一占有者。", "source": "东西丹陛文石台上各一座；象征皇帝为江山土地唯一占有者"}, {"section": "故宫（紫禁城）", "layer": "core", "type": "single", "q": "皇帝举行祭祀先农活动的前一日，阅视祝版的地点是（ ）。", "options": ["A. 太和殿", "B. 中和殿", "C. 保和殿", "D. 文华殿"], "answer": "B", "explain": "皇帝祭祀先农前一日在中和殿阅视祝版，并于亲耕前查验种子和农具。", "source": "中和殿；前一日阅视祝版；亲耕前查验种子和农具"}, {"section": "故宫（紫禁城）", "layer": "core", "type": "judge", "q": "明朝\"壬寅宫变\"发生于嘉靖二十一年（1542年）的乾清宫，宫女杨金英参与谋刺嘉靖帝。", "answer": "对", "explain": "壬寅宫变发生于乾清宫，时间为嘉靖二十一年（1542年），宫女杨金英谋刺嘉靖帝，表述与原文一致。", "source": "明朝\"壬寅宫变\"发生的地点 乾清宫；嘉靖二十一年（1542年）；宫女杨金英谋刺"}, {"section": "故宫（紫禁城）", "layer": "core", "type": "multi", "q": "关于紫禁城乾清门，下列说法正确的有（ ）。", "options": ["A. 是后廷的起点，南为前朝、北为后廷", "B. 面阔5间", "C. 进深3间", "D. 施金龙和玺彩画", "E. 面阔9间、进深5间"], "answer": "ABCD", "explain": "乾清门为后廷起点（南前朝、北后廷），单檐歇山顶，面阔5间、进深3间，施金龙和玺彩画。E错误。", "source": "后廷起点乾清门（南前朝、北后廷）；单檐歇山顶；面阔5间进深3间；金龙和玺彩画"}, {"section": "故宫（紫禁城）", "layer": "core", "type": "single", "q": "殿试始定于保和殿举行的时间是（ ）。", "options": ["A. 乾隆二十六年（1761年）", "B. 乾隆五十四年（1789年）", "C. 康熙十九年（1680年）", "D. 顺治二年（1645年）"], "answer": "B", "explain": "清乾隆五十四年（1789年）始定殿试于保和殿举行；乾隆二十六年（1761年）定考试时间为四月二十一日。", "source": "清乾隆五十四年（1789年）始定于保和殿；考试时间乾隆二十六年（1761年）定四月二十一日"}, {"section": "故宫（紫禁城）", "layer": "core", "type": "judge", "q": "\"壬寅宫变\"之后，嘉靖皇帝移居南苑居住。", "answer": "错", "explain": "壬寅宫变后嘉靖帝移居的是西苑，而非南苑。", "source": "宫女杨金英谋刺；此后嘉靖移居西苑"}, {"section": "故宫（紫禁城）", "layer": "core", "type": "single", "q": "武英殿修书处设立于（ ）。", "options": ["A. 康熙八年（1669年）", "B. 康熙十九年（1680年）", "C. 乾隆三十九年（1774年）", "D. 顺治元年（1644年）"], "answer": "B", "explain": "康熙八年帝一度移居武英殿；康熙十九年（1680年）设武英殿修书处刊印书籍。", "source": "康熙八年帝一度移居；康熙十九年（1680年）设武英殿修书处刊印书籍"}, {"section": "故宫（紫禁城）", "layer": "core", "type": "judge", "q": "清代一共举行过3次千叟宴。", "answer": "错", "explain": "清代共举行4次千叟宴：康熙五十二年畅春园、康熙六十一年乾清宫、乾隆五十年乾清宫、嘉庆元年宁寿宫皇极殿。", "source": "清代举行千叟宴的次数和举办地点 共4次"}, {"section": "故宫（紫禁城）", "layer": "core", "type": "multi", "q": "紫禁城珍宝馆现存三件主要的大玉雕作品包括（ ）。", "options": ["A. 《大禹治水图》玉山", "B. 《会昌九老图》玉山", "C. 《秋山行旅图》玉山", "D. 《快雪时晴帖》"], "answer": "ABC", "explain": "三件大玉雕为《大禹治水图》《会昌九老图》《秋山行旅图》玉山。《快雪时晴帖》为王羲之书法，藏三希堂，D错误。", "source": "《大禹治水图》《会昌九老图》《秋山行旅图》玉山"}, {"section": "故宫（紫禁城）", "layer": "core", "type": "single", "q": "清康熙年间武英殿修书处刊印的书籍称“殿本”，其著名丛书为（ ）。", "options": ["A. 《四库全书》", "B. 《四库全书荟要》", "C. 聚珍版丛书", "D. 《通书》"], "answer": "C", "explain": "武英殿修书处刊印聚珍版丛书，所刻书称“殿本”。《四库全书》贮于文渊阁，《四库全书荟要》贮于摛藻堂，勿混。", "source": "设武英殿修书处刊印书籍；聚珍版丛书；殿本"}, {"section": "故宫（紫禁城）", "layer": "core", "type": "judge", "q": "清代皇子皇孙上学读书的上书房位于乾清门内东侧、乾清宫东庑，康熙幼年曾读书于西庑懋勤殿。", "answer": "对", "explain": "上书房在乾清门内东侧、乾清宫东庑，是清代皇子皇孙读书处；康熙幼年读书于西庑懋勤殿。", "source": "清代皇子皇孙上学读书的地点 上书房；乾清门内东侧、乾清宫东庑；康熙幼年读书于西庑懋勤殿"}, {"section": "故宫（紫禁城）", "layer": "core", "type": "single", "q": "1644年李自成在紫禁城中即位的地点是（ ）。", "options": ["A. 太和殿", "B. 乾清宫", "C. 武英殿", "D. 皇极门"], "answer": "C", "explain": "1644年四月二十九日，李自成在武英殿即位，次日撤离并火烧皇宫。", "source": "武英殿；1644年四月二十九日；次日撤离火烧皇宫"}, {"section": "故宫（紫禁城）", "layer": "core", "type": "judge", "q": "交泰殿内贮有乾隆十一年（1746年）钦定的二十五宝玺。", "answer": "对", "explain": "交泰殿贮存二十五宝玺，系乾隆十一年（1746年）钦定。", "source": "贮二十五宝玺（1746年钦定）"}, {"section": "故宫（紫禁城）", "layer": "core", "type": "multi", "q": "乾清宫前丹陛上的陈设包括（ ）。", "options": ["A. 铜龟、铜鹤各二", "B. 日晷、嘉量各一", "C. 宝鼎（鎏金香炉）4座", "D. 铜鼎18座"], "answer": "ABC", "explain": "乾清宫前丹陛上设铜龟、铜鹤各二，日晷、嘉量各一（圆形嘉量），宝鼎（鎏金香炉）4座。铜鼎18座为太和殿前陈设，D错误。", "source": "铜龟、铜鹤各二；日晷、嘉量各一（圆形嘉量）；宝鼎（鎏金香炉）4座"}, {"section": "故宫（紫禁城）", "layer": "core", "type": "single", "q": "清朝入主紫禁城后，摄政王多尔衮处理政务的地点是（ ）。", "options": ["A. 养心殿", "B. 武英殿", "C. 乾清宫", "D. 文华殿"], "answer": "B", "explain": "武英殿为摄政王多尔衮理事之所；顺治帝迁都之初亦居于此。", "source": "武英殿；摄政王理事之所；顺治帝迁都初亦居此"}, {"section": "故宫（紫禁城）", "layer": "core", "type": "judge", "q": "清代坤宁宫的东暖阁是萨满教祭神场所。", "answer": "错", "explain": "清代坤宁宫西暖阁才是萨满教祭神场所，东暖阁为皇帝大婚洞房。", "source": "清代萨满教祭神场所（西暖阁）；东暖阁为皇帝大婚洞房"}, {"section": "故宫（紫禁城）", "layer": "core", "type": "single", "q": "康熙皇帝在紫禁城中禁锢太子胤礽的地点是（ ）。", "options": ["A. 咸安宫", "B. 寿安宫", "C. 慈宁宫", "D. 储秀宫"], "answer": "A", "explain": "康熙五十一年（1712年）再废太子胤礽，仍禁锢于咸安宫（寿康宫后、长庚门内）。", "source": "咸安宫（寿康宫后、长庚门内）；康熙五十一年（1712年）再废仍禁锢于此"}, {"section": "故宫（紫禁城）", "layer": "core", "type": "judge", "q": "御花园钦安殿是一座佛教建筑，供奉释迦牟尼。", "answer": "错", "explain": "钦安殿是道教建筑，为中轴线上唯一的道观，供奉玄天上帝（真武大帝）。", "source": "道教建筑；中轴线唯一道观；供奉玄天上帝（真武大帝）"}, {"section": "故宫（紫禁城）", "layer": "core", "type": "multi", "q": "清代千叟宴曾在下列哪些地点举办（ ）。", "options": ["畅春园", "乾清宫", "宁寿宫皇极殿", "太和殿"], "answer": "ABC", "explain": "清代4次千叟宴地点为：康熙五十二年畅春园、康熙六十一年乾清宫、乾隆五十年乾清宫、嘉庆元年宁寿宫皇极殿；太和殿未举办过千叟宴。", "source": "康熙五十二年（1713年）畅春园→康熙六十一年（1722年）乾清宫→乾隆五十年（1785年）乾清宫→嘉庆元年（1796年）宁寿宫皇极殿"}, {"section": "故宫（紫禁城）", "layer": "core", "type": "single", "q": "紫禁城文渊阁是仿照下列哪座建筑修建的？", "options": ["A. 曲阜奎文阁", "B. 承德文津阁", "C. 浙江宁波范氏天一阁", "D. 南京文渊阁"], "answer": "C", "explain": "文渊阁仿浙江宁波范氏天一阁修建，乾隆三十九年（1774年）建，专贮《四库全书》。", "source": "浙江宁波范氏天一阁；乾隆三十九年（1774年）建；专贮《四库全书》"}, {"section": "故宫（紫禁城）", "layer": "core", "type": "judge", "q": "御花园绛雪轩因轩前有5株海棠树、花瓣飘落色白如雪而得名。", "answer": "对", "explain": "绛雪轩前有海棠树5株，花瓣飘落色白如雪，故名绛雪；晚清慈禧移太平花替代。", "source": "轩前海棠树5株；花瓣飘落色白如雪故名绛雪"}, {"section": "故宫（紫禁城）", "layer": "core", "type": "single", "q": "作为紫禁城后廷起点的乾清门，其屋顶形制为（ ）。", "options": ["A. 重檐庑殿顶", "B. 单檐歇山顶", "C. 重檐盝顶", "D. 单檐四角攒尖顶"], "answer": "B", "explain": "乾清门为单檐歇山顶。重檐盝顶为钦安殿，单檐四角攒尖顶为交泰殿，注意区分。", "source": "后廷起点乾清门（南前朝、北后廷）；单檐歇山顶"}, {"section": "故宫（紫禁城）", "layer": "core", "type": "judge", "q": "明仁宗朱高炽于洪熙元年（1425年）猝死于御花园钦安殿，在位仅约8个月。", "answer": "对", "explain": "明仁宗朱高炽（洪熙）洪熙元年（1425年）猝死于钦安殿，在位约8个月，葬献陵。", "source": "明仁宗朱高炽（洪熙）；洪熙元年（1425年）猝死于钦安殿；在位约8个月；葬献陵"}, {"section": "故宫（紫禁城）", "layer": "core", "type": "multi", "q": "下列属于交泰殿内部主要陈设及用途的有（ ）。", "options": ["东次间铜壶滴漏", "西次间大自鸣钟", "贮二十五宝玺", "皇后千秋节受贺", "高悬轩辕镜"], "answer": "ABCD", "explain": "交泰殿内有康熙御书\"无为\"匾、乾隆《交泰殿铭》，东次间铜壶滴漏（1745年）、西次间大自鸣钟（1798年），贮二十五宝玺，皇后千秋节在此受贺；轩辕镜是太和殿内陈设。", "source": "东次间铜壶滴漏（1745年）；西次间大自鸣钟（1798年）；贮二十五宝玺（1746年钦定）；皇后千秋节受贺"}, {"section": "故宫（紫禁城）", "layer": "core", "type": "single", "q": "紫禁城军机处位于（ ）。", "options": ["A. 乾清门内东侧", "B. 乾清门内西侧、隆宗门内北侧", "C. 太和门西侧", "D. 乾清宫东庑"], "answer": "B", "explain": "军机处位于乾清门内西侧、隆宗门内北侧；东侧对称为九卿值房。", "source": "乾清门内西侧、隆宗门内北侧……东侧对称为九卿值房"}, {"section": "故宫（紫禁城）", "layer": "core", "type": "judge", "q": "养心殿之名出自《论语》中的\"养心莫善于寡欲\"。", "answer": "错", "explain": "养心殿名出自《孟子·尽心下》\"养心莫善于寡欲\"，不是《论语》。", "source": "养心殿名称的由来 《孟子·尽心下》；\"养心莫善于寡欲\""}, {"section": "故宫（紫禁城）", "layer": "core", "type": "single", "q": "珍宝馆最大的玉雕作品《大禹治水图》玉山的材质与尺寸为（ ）。", "options": ["A. 和田青玉，高224厘米、重约5300多公斤", "B. 和田白玉，高169厘米、重约1696公斤", "C. 和田青玉，高5300厘米、重约224公斤", "D. 和田碧玉，高224厘米、重约5300多公斤"], "answer": "A", "explain": "最大的玉雕为《大禹治水图》玉山，和田青玉，高224厘米、重约5300多公斤，被誉为“玉器之王”。", "source": "最大《大禹治水图》玉山；和田青玉；高224厘米、重约5300多公斤（玉器之王）"}, {"section": "故宫（紫禁城）", "layer": "core", "type": "judge", "q": "养心殿自康熙年间起成为皇帝日常理政与起居之所。", "answer": "错", "explain": "养心殿自清雍正年间起成为皇帝日常理政与起居之所，雍正移居守孝；其后共8位清帝（雍正至宣统）居此。", "source": "清雍正年间起；雍正移居守孝；8位清帝（雍正→宣统）"}, {"section": "故宫（紫禁城）", "layer": "core", "type": "multi", "q": "曾在坤宁宫东暖阁行合卺礼（大婚洞房）的皇帝有（ ）。", "options": ["康熙", "同治", "光绪", "溥仪", "乾隆"], "answer": "ABCD", "explain": "坤宁宫东暖阁为皇帝大婚洞房，康熙、同治、光绪、溥仪在此行合卺礼。", "source": "东暖阁为皇帝大婚洞房（康熙、同治、光绪、溥仪行合卺礼）"}, {"section": "故宫（紫禁城）", "layer": "core", "type": "single", "q": "乾清宫前铜鎏金小殿的名称是（ ）。", "options": ["A. 金銮殿", "B. 江山社稷金殿（江山社稷亭）", "C. 御景亭", "D. 三希堂"], "answer": "B", "explain": "乾清宫前铜鎏金小殿称江山社稷金殿（江山社稷亭），东西丹陛文石台上各一座。", "source": "江山社稷金殿（江山社稷亭）；东西丹陛文石台上各一座"}, {"section": "故宫（紫禁城）", "layer": "core", "type": "judge", "q": "养心殿修缮工程于2015年12月18日启动，历时约10年，2025年12月26日重新开放。", "answer": "对", "explain": "养心殿2015年12月18日启动修缮，历时约10年，2025年12月26日重新开放，布陈1020件。", "source": "2025年12月26日重新开放；2015年12月18日启动修缮；历时约10年"}, {"section": "故宫（紫禁城）", "layer": "core", "type": "single", "q": "清代首次千叟宴（康熙五十二年，1713年）的举办地点是（ ）。", "options": ["畅春园", "乾清宫", "宁寿宫皇极殿", "太和殿"], "answer": "A", "explain": "康熙五十二年（1713年）千叟宴在畅春园举行；其后康熙六十一年、乾隆五十年在乾清宫，嘉庆元年在宁寿宫皇极殿。", "source": "康熙五十二年（1713年）畅春园→康熙六十一年（1722年）乾清宫→乾隆五十年（1785年）乾清宫→嘉庆元年（1796年）宁寿宫皇极殿"}, {"section": "故宫（紫禁城）", "layer": "core", "type": "judge", "q": "\"明窗开笔\"仪式于每年正月初一子时举行，自雍正时起。", "answer": "对", "explain": "明窗开笔在养心殿东暖阁举行，时间为正月初一子时，用金瓯永固杯、玉烛长调、万年青笔，雍正时起。", "source": "养心殿东暖阁；正月初一子时；金瓯永固杯、玉烛长调、万年青笔；雍正时起"}, {"section": "故宫（紫禁城）", "layer": "core", "type": "multi", "q": "关于御花园钦安殿，下列说法正确的有（ ）。", "options": ["是道教建筑", "是中轴线上唯一的道观", "供奉玄天上帝（真武大帝）", "屋顶为重檐盝顶", "供奉观音菩萨"], "answer": "ABCD", "explain": "钦安殿为道教建筑、中轴线唯一道观，供奉玄天上帝（真武大帝），取北方水神消弭火灾之意，重檐盝顶；不供奉观音菩萨。", "source": "道教建筑；中轴线唯一道观；供奉玄天上帝（真武大帝）；北方水神消弭火灾；重檐盝顶"}, {"section": "故宫（紫禁城）", "layer": "core", "type": "single", "q": "嘉庆元年（1796年）千叟宴的举办地点是（ ）。", "options": ["畅春园", "乾清宫", "宁寿宫皇极殿", "太和门"], "answer": "C", "explain": "嘉庆元年（1796年）千叟宴在宁寿宫皇极殿举行。", "source": "嘉庆元年（1796年）宁寿宫皇极殿"}, {"section": "故宫（紫禁城）", "layer": "core", "type": "judge", "q": "历史上垂帘听政通说起于唐初，即唐高宗显庆年间武则天垂帘。", "answer": "对", "explain": "垂帘听政通说起于唐初（唐高宗显庆年间、武则天垂帘）；另有战国秦宣太后之说（前307年）。", "source": "通说起于唐初（唐高宗显庆年间、武则天垂帘）"}, {"section": "故宫（紫禁城）", "layer": "core", "type": "single", "q": "交泰殿位于（ ）。", "options": ["乾清宫与坤宁宫之间", "太和殿与中和殿之间", "乾清门与乾清宫之间", "坤宁宫与御花园之间"], "answer": "A", "explain": "交泰殿位于乾清宫与坤宁宫之间，方形、单檐四角攒尖顶。", "source": "乾清宫与坤宁宫之间；方形、单檐四角攒尖顶"}, {"section": "故宫（紫禁城）", "layer": "core", "type": "judge", "q": "顺治皇帝因患天花驾崩于乾清宫，年仅24岁。", "answer": "错", "explain": "顺治帝驾崩于养心殿（顺治十八年，1661年），患天花，年仅24岁，地点不是乾清宫。", "source": "顺治皇帝驾崩的地点 养心殿；顺治十八年（1661年）；患天花；年仅24岁"}, {"section": "故宫（紫禁城）", "layer": "core", "type": "multi", "q": "关于养心殿的功能格局，下列说法正确的有（ ）。", "options": ["前殿用于理政", "东暖阁用于垂帘听政", "西暖阁用于批阅奏折", "后殿为寝宫", "后殿设武英殿修书处"], "answer": "ABCD", "explain": "养心殿\"工\"字形，前殿理政、东暖阁垂帘听政、西暖阁批阅奏折（内隔三希堂）、后殿寝宫；武英殿修书处设于武英殿，与养心殿无关。", "source": "前殿理政、东暖阁垂帘听政、西暖阁批阅奏折（内隔三希堂）；后殿寝宫"}, {"section": "故宫（紫禁城）", "layer": "core", "type": "single", "q": "交泰殿的屋顶形制是（ ）。", "options": ["重檐庑殿顶", "单檐四角攒尖顶", "单檐歇山顶", "重檐盝顶"], "answer": "B", "explain": "交泰殿为方形、单檐四角攒尖顶；单檐歇山顶是乾清门屋顶，重檐盝顶是钦安殿屋顶。", "source": "方形、单檐四角攒尖顶"}, {"section": "故宫（紫禁城）", "layer": "core", "type": "judge", "q": "紫禁城慈宁宫俗称太后宫，为皇太后正宫，建于嘉靖十五年（1536年），慈宁宫花园是现存唯一的太后花园。", "answer": "对", "explain": "慈宁宫俗称太后宫，为皇太后正宫，嘉靖十五年（1536年）建；慈宁宫花园是现存唯一太后花园。", "source": "太后宫；皇太后正宫；嘉靖十五年（1536年）建；慈宁宫花园（现存唯一太后花园）"}, {"section": "故宫（紫禁城）", "layer": "core", "type": "single", "q": "交泰殿现悬挂的\"无为\"匾额为（ ）。", "options": ["康熙帝御笔原匾", "乾隆帝恭摹康熙御笔", "雍正帝御笔", "嘉庆帝御笔"], "answer": "B", "explain": "\"无为\"原匾为康熙帝御笔，今悬挂者为乾隆帝恭摹康熙御笔；殿内另有乾隆《交泰殿铭》。", "source": "原匾康熙帝御笔；今悬者乾隆帝恭摹康熙御笔；乾隆《交泰殿铭》"}, {"section": "故宫（紫禁城）", "layer": "core", "type": "multi", "q": "\"明窗开笔\"仪式使用的器物有（ ）。", "options": ["金瓯永固杯", "玉烛长调", "万年青笔", "青花海碗"], "answer": "ABC", "explain": "明窗开笔在养心殿东暖阁举行，用金瓯永固杯、玉烛长调、万年青笔。", "source": "金瓯永固杯、玉烛长调、万年青笔"}, {"section": "故宫（紫禁城）", "layer": "core", "type": "single", "q": "清代坤宁宫西暖阁的主要用途是（ ）。", "options": ["皇帝大婚洞房", "萨满教祭神场所", "皇后起居正宫", "皇子读书处"], "answer": "B", "explain": "清代坤宁宫西暖阁为萨满教祭神场所，东暖阁为皇帝大婚洞房；明代坤宁宫为皇后正宫。", "source": "明代皇后正宫；清代萨满教祭神场所（西暖阁）；东暖阁为皇帝大婚洞房"}, {"section": "故宫（紫禁城）", "layer": "core", "type": "single", "q": "御花园钦安殿供奉的主神是（ ）。", "options": ["太上老君", "玄天上帝（真武大帝）", "关圣帝君", "文昌帝君"], "answer": "B", "explain": "钦安殿供奉玄天上帝（真武大帝），为北方水神，取消弭火灾之意。", "source": "供奉玄天上帝（真武大帝）；北方水神消弭火灾"}, {"section": "故宫（紫禁城）", "layer": "core", "type": "multi", "q": "三希堂收藏的三件东晋书法作品是（ ）。", "options": ["王羲之《快雪时晴帖》", "王献之《中秋帖》", "王珣《伯远帖》", "王羲之《兰亭序》"], "answer": "ABC", "explain": "三希堂藏王羲之《快雪时晴帖》、王献之《中秋帖》、王珣《伯远帖》。乾隆释\"三希\"为稀世珍宝之意，并引周敦颐《通书·志学》\"士希贤，贤希圣，圣希天\"。", "source": "稀世珍宝之意；周敦颐《通书·志学》\"士希贤，贤希圣，圣希天\"；王羲之《快雪时晴帖》、王献之《中秋帖》、王珣《伯远帖》"}, {"section": "故宫（紫禁城）", "layer": "core", "type": "single", "q": "乾隆时期珍藏于御花园摛藻堂内的古籍是（ ）。", "options": ["《四库全书》", "《四库全书荟要》", "武英殿聚珍版丛书", "殿本书籍"], "answer": "B", "explain": "摛藻堂位于御花园东北、堆秀山东侧，乾隆四十四年（1779年）后贮藏《四库全书荟要》；《四库全书》专贮于文渊阁。", "source": "《四库全书荟要》；摛藻堂位于御花园东北、堆秀山东侧；乾隆四十四年（1779年）后贮藏"}, {"section": "故宫（紫禁城）", "layer": "core", "type": "single", "q": "晚清时慈禧太后移来替代绛雪轩前海棠的花木是（ ）。", "options": ["太平花", "牡丹", "芍药", "丁香"], "answer": "A", "explain": "绛雪轩因轩前5株海棠花瓣色白如雪得名，晚清慈禧移太平花替代。", "source": "晚清慈禧移太平花替代"}, {"section": "故宫（紫禁城）", "layer": "core", "type": "multi", "q": "关于历史上垂帘听政起源的说法，正确的有（ ）。", "options": ["通说起于唐初唐高宗显庆年间武则天垂帘", "另有战国秦宣太后之说（前307年）", "通说起于北宋", "通说起于西汉"], "answer": "AB", "explain": "垂帘听政通说起于唐初（唐高宗显庆年间、武则天垂帘）；另有战国秦宣太后之说（前307年）。", "source": "通说起于唐初（唐高宗显庆年间、武则天垂帘）；另有战国秦宣太后之说（前307年）"}, {"section": "故宫（紫禁城）", "layer": "core", "type": "single", "q": "御花园堆秀山上的亭子名为（ ）。", "options": ["御景亭", "绛雪轩", "摛藻堂", "钦安殿"], "answer": "A", "explain": "堆秀山上为御景亭；万历十一年（1583年）拆观花殿叠石为山，重阳节登亭。", "source": "御景亭；万历十一年（1583年）拆观花殿叠石为山；重阳节登亭"}, {"section": "故宫（紫禁城）", "layer": "core", "type": "single", "q": "养心殿始建的时间是（ ）。", "options": ["明嘉靖十六年（1537年）", "明永乐十八年（1420年）", "清康熙八年（1669年）", "清雍正七年（1729年）"], "answer": "A", "explain": "养心殿始建于明嘉靖十六年（1537年）。", "source": "明嘉靖十六年（1537年）始建"}, {"section": "故宫（紫禁城）", "layer": "core", "type": "multi", "q": "咸丰十一年（1861年）辛酉政变后，在养心殿东暖阁垂帘听政的两宫太后是（ ）。", "options": ["慈安", "慈禧", "孝庄", "隆裕"], "answer": "AB", "explain": "辛酉政变后慈安、慈禧两宫在养心殿东暖阁垂帘听政，设八扇黄屏风，共三次垂帘48年。", "source": "咸丰十一年（1861年）辛酉政变后；慈安、慈禧两宫；八扇黄屏风；三次垂帘48年"}, {"section": "故宫（紫禁城）", "layer": "core", "type": "single", "q": "养心殿的建筑结构为（ ）。", "options": ["\"工\"字形", "\"口\"字形", "\"凸\"字形", "\"回\"字形"], "answer": "A", "explain": "养心殿呈\"工\"字形，前殿 r": "ext"}, {"section": "故宫（紫禁城）", "type": "judge", "q": "交泰殿今悬“无为”匾为康熙帝亲笔原题。", "answer": "错", "explain": "“无为”匾为康熙帝原题，但今悬者为乾隆帝恭摹康熙御笔，并非康熙亲笔原件。", "source": "康熙帝原题，今悬者为乾隆帝恭摹康熙御笔。", "layer": "ext"}, {"section": "故宫（紫禁城）", "type": "multi", "q": "下列建筑中，属于前朝东路文华殿组群的有（ ）。", "options": ["A. 文渊阁", "B. 传心殿", "C. 内阁", "D. 断虹桥"], "answer": "ABC", "explain": "东路文华殿组群含文华门、文华殿、文渊阁、传心殿、内阁等；断虹桥属西路武英殿组群（武英殿前内金水河上）。", "source": "东路——文华殿组群：文华门、文华殿、主敬殿、本仁殿、集义殿、文渊阁、传心殿……内阁……箭亭。西路——武英殿组群：……断虹桥……", "layer": "ext"}, {"section": "故宫（紫禁城）", "type": "single", "q": "紫禁城珍宝馆现存最大的玉雕作品是（ ）。", "options": ["A. 《会昌九老图》玉山", "B. 《秋山行旅图》玉山", "C. 《大禹治水图》玉山", "D. 《松鹤延年图》玉山"], "answer": "C", "explain": "最大的一件为《大禹治水图》玉山，系新疆和田青玉，世称'玉器之王'。", "source": "最大的一件：《大禹治水图》玉山——为新疆和田（密勒塔山）青玉，是世界上最大的和田玉雕，世称'玉器之王'。", "layer": "ext"}, {"section": "故宫（紫禁城）", "type": "judge", "q": "清代坤宁宫经改造后，正间及西暖阁成为宫中萨满教祭神的主要场所，东暖阁则为皇帝大婚的洞房。", "answer": "对", "explain": "清顺治十二年（1655年）仿沈阳故宫清宁宫改造后如此；康熙、同治、光绪三帝大婚及溥仪结婚均在东暖阁行合卺礼。", "source": "正间及西暖阁（西四间）连通，成为宫中萨满教祭神的主要场所……东暖阁（东两间）为皇帝大婚的洞房", "layer": "ext"}, {"section": "故宫（紫禁城）", "type": "single", "q": "中和殿'中和'一词的思想依据出自（ ）。", "options": ["A. 《论语》", "B. 《孟子》", "C. 《礼记·中庸》", "D. 《周易》"], "answer": "C", "explain": "'中和'出自《礼记·中庸》：'中也者，天下之大本也；和也者，天下之达道也。'", "source": "出自《礼记·中庸》：'中也者，天下之大本也；和也者，天下之达道也。致中和，天地位焉，万物育焉。'", "layer": "ext"}, {"section": "故宫（紫禁城）", "type": "judge", "q": "钦安殿是紫禁城中位于中轴线上的唯一道观，供奉玄天上帝（真武大帝），为道教北方之水神。", "answer": "对", "explain": "明清皇帝于立春、立夏、立秋、立冬等节令至此拈香行礼，祈求水神保佑皇宫、消弭火灾；其南为天一门，取“天一生水”之意以镇火。", "source": "钦安殿是紫禁城中位于中轴线上的唯一道观（神殿）……供奉玄天上帝（真武大帝、玄武大帝），为道教北方之水神。", "layer": "ext"}, {"section": "故宫（紫禁城）", "type": "multi", "q": "下列关于清代千叟宴的说法，正确的有（ ）。", "options": ["A. 清代共举行4次千叟宴", "B. 康熙五十二年（1713年）在畅春园举行", "C. 乾隆五十年（1785年）在乾清宫举行，与宴者3000余人", "D. 嘉庆元年（1796年）由太上皇乾隆在宁寿宫皇极殿举办"], "answer": "ABCD", "explain": "四项均与原文一致：共4次，1713畅春园、1722乾清宫、1785乾清宫、1796宁寿宫皇极殿。", "source": "共举行 4 次：康熙五十二年（1713 年）三月——畅春园……乾隆五十年（1785 年）正月——乾清宫（与宴者 3000 余人，设席 800 桌）；嘉庆元年（1796 年）正月——宁寿宫皇极殿（太上皇乾隆举办）。", "layer": "ext"}, {"section": "故宫（紫禁城）", "type": "single", "q": "皇帝在举行祭祀先农活动的前一日，阅视祝版的地点是（ ）。", "options": ["A. 太和殿", "B. 中和殿", "C. 保和殿", "D. 文华殿"], "answer": "B", "explain": "皇帝举行祭祀先农活动的前一日，在中和殿阅视祝版。", "source": "皇帝在举行祭祀先农活动的前一日，阅视祝版的地点：中和殿。", "layer": "ext"}, {"section": "故宫（紫禁城）", "type": "judge", "q": "绛雪轩因轩前原有海棠树5株，海棠花瓣飘落时色白如雪，宛若雪花片片缤纷而降，故得此名。", "answer": "对", "explain": "绛雪轩位于御花园东南，座东面西；乾隆有诗“徕春何处归来早，堆秀山前绛雪轩”。", "source": "轩前原有海棠树 5 株，海棠初放时颜色殷红，花瓣飘落时色白如雪，宛若雪花片片缤纷而降，故名“绛雪轩”", "layer": "ext"}, {"section": "故宫（紫禁城）", "type": "single", "q": "乾清宫前东西丹陛下安设的铜鎏金小殿名称是（ ）。", "options": ["A. 江山社稷金殿", "B. 金銮殿", "C. 三希堂", "D. 体元殿"], "answer": "A", "explain": "名称为江山社稷金殿（又称'江山社稷亭'），象征皇帝是江山与土地的唯一占有者和最高统治者。", "source": "江山社稷金殿（又称'江山社稷亭'）。东西丹陛下各有一文石台，台上各安设一座铜质鎏金小殿……", "layer": "ext"}, {"section": "故宫（紫禁城）", "type": "judge", "q": "洪熙元年（1425年）五月十二日，明仁宗朱高炽猝死于乾清宫，在位仅约8个月。", "answer": "错", "explain": "地点错误。明仁宗朱高炽猝死于御花园钦安殿，非乾清宫；葬于十三陵献陵。", "source": "洪熙元年（1425 年）五月十二日猝死于钦安殿（葬于十三陵献陵），在位仅约 8 个月。", "layer": "ext"}, {"section": "故宫（紫禁城）", "type": "multi", "q": "紫禁城珍宝馆现存三件主要大玉雕作品包括（ ）。", "options": ["A. 《大禹治水图》玉山", "B. 《会昌九老图》玉山", "C. 《秋山行旅图》玉山", "D. 《松鹤延年图》玉山"], "answer": "ABC", "explain": "三件大玉雕为《大禹治水图》玉山、《会昌九老图》玉山、《秋山行旅图》玉山，无《松鹤延年图》玉山。", "source": "《大禹治水图》玉山、《会昌九老图》玉山、《秋山行旅图》玉山。", "layer": "ext"}, {"section": "故宫（紫禁城）", "type": "single", "q": "康熙十九年（1680年）设于武英殿、掌管刊印装潢书籍的机构是（ ）。", "options": ["A. 内阁大库", "B. 方略馆", "C. 武英殿修书处", "D. 御书处"], "answer": "C", "explain": "康熙十九年（1680年）设'武英殿修书处'（书局）于左右廊房，掌管刊印、装潢书籍。", "source": "康熙十九年（1680 年）设'武英殿修书处'（书局）于左右廊房，掌管刊印、装潢书籍，由亲王大臣总理。", "layer": "ext"}, {"section": "故宫（紫禁城）", "type": "judge", "q": "养心殿为“工”字形格局，前殿与后殿以穿廊相连。", "answer": "对", "explain": "前殿（正殿）为皇帝理政、小朝会之所，后殿为皇帝寝宫，二者以穿廊相连成“工”字形。", "source": "为“工”字形（前殿与后殿以穿廊相连）格局", "layer": "ext"}, {"section": "故宫（紫禁城）", "type": "single", "q": "清兵入关之初，摄政王多尔衮处理政务的地点是（ ）。", "options": ["A. 乾清宫", "B. 武英殿", "C. 文华殿", "D. 养心殿"], "answer": "B", "explain": "摄政王多尔衮先行抵京，以武英殿作为理事（处理政务）之所。", "source": "武英殿。清兵入关之初，摄政王多尔衮先行抵京，以武英殿作为理事（处理政务）之所……" xplain": "畅音阁位于宁寿宫区东路，共3层，上为“福台”、中为“禄台”、下为“寿台”；楼北为帝后看戏的阅是楼，楼南为后台扮戏楼。", "source": "共 3 层（上为“福台”、中为“禄台”、下为“寿台”），每层之间有楼梯相通；楼北为帝后看戏的阅是楼，楼南为后台扮戏楼。", "layer": "ext"}, {"section": "故宫（紫禁城）", "type": "single", "q": "御花园堆秀山上亭子的名称是（ ）。", "options": ["A. 御景亭", "B. 江山社稷亭", "C. 天一阁", "D. 阅是楼"], "answer": "A", "explain": "堆秀山上建亭名“御景亭”；江山社稷亭为乾清宫前铜鎏金小殿，阅是楼为畅音阁北帝后看戏之处。", "source": "山上建亭，名“御景亭”。", "layer": "ext"}, {"section": "故宫（紫禁城）", "type": "judge", "q": "皇帝举行祭祀先农活动的前一日，在保和殿阅视祝版。", "answer": "错", "explain": "阅视祝版的地点是中和殿，题干'保和殿'错误。", "source": "皇帝在举行祭祀先农活动的前一日，阅视祝版的地点：中和殿。", "layer": "ext"}, {"section": "故宫（紫禁城）", "type": "single", "q": "驾崩于御花园钦安殿的明仁宗朱高炽（年号洪熙），在位时间约为（ ）。", "options": ["A. 8个月", "B. 1年", "C. 10年", "D. 20年"], "answer": "A", "explain": "朱高炽永乐二十二年（1424年）八月即位，洪熙元年（1425年）五月十二日猝死于钦安殿，在位仅约8个月，葬十三陵献陵。", "source": "永乐二十二年（1424 年）八月即位，洪熙元年（1425 年）五月十二日猝死于钦安殿（葬于十三陵献陵），在位仅约 8 个月。", "layer": "ext"}, {"section": "故宫（紫禁城）", "type": "judge", "q": "清兵入关之初，摄政王多尔衮以文华殿作为处理政务之所。", "answer": "错", "explain": "多尔衮处理政务的地点是武英殿，题干'文华殿'错误。", "source": "武英殿。清兵入关之初，摄政王多尔衮先行抵京，以武英殿作为理事（处理政务）之所。", "layer": "ext"}, {"section": "故宫（紫禁城）", "type": "multi", "q": "下列关于宁寿宫区建筑仿建对应关系的说法，正确的有（ ）。", "options": ["A. 皇极殿仿乾清宫", "B. 宁寿宫形制同坤宁宫", "C. 宁寿门仿乾清门", "D. 养性殿仿养心殿", "E. 皇极殿仿太和殿"], "answer": "ABCD", "explain": "E错误：皇极殿仿乾清宫而非太和殿。皇极殿为太上皇临朝受贺之处，嘉庆元年（1796年）太上皇乾隆曾在此举行千叟宴。", "source": "仿照乾清宫的建筑形制……其北的宁寿宫则形制同坤宁宫……宁寿门仿乾清门，养性殿仿养心殿。嘉庆元年（1796 年）太上皇乾隆曾在此举行千叟宴。", "layer": "ext"}, {"section": "故宫（紫禁城）", "type": "single", "q": "养心殿西暖阁内又隔出的小室是（ ）。", "options": ["A. 梅坞", "B. 三希堂", "C. 体顺堂", "D. 燕喜堂"], "answer": "B", "explain": "西暖阁为皇帝批阅奏折、召见大臣之所，其内又隔出三希堂；梅坞在养心殿西侧，体顺堂、燕喜堂在后殿。", "source": "西暖阁：皇帝批阅奏折、召见大臣之所，其内又隔出三希堂", "layer": "ext"}, {"section": "故宫（紫禁城）", "type": "judge", "q": "军机处位于乾清门内东侧，其西侧对称位置为九卿值房。", "answer": "错", "explain": "军机处位于乾清门内西侧、隆宗门内北侧；乾清门东侧对称位置为九卿值房，题干东西颠倒。", "source": "位于乾清门内西侧、隆宗门内北侧……乾清门东侧对称位置为九卿值房。", "layer": "ext"}, {"section": "故宫（紫禁城）", "type": "single", "q": "养心殿后殿中，贵妃居住的场所是（ ）。", "options": ["A. 体顺堂", "B. 燕喜堂", "C. 梅坞", "D. 随安室"], "answer": "B", "explain": "后殿为皇帝寝宫，东为皇后居“体顺堂”，西为贵妃居“燕喜堂”；“梅坞”在养心殿西侧，为乾隆三十九年添建。", "source": "后殿：皇帝寝宫（东为皇后居“体顺堂／体顺房”，西为贵妃居“燕喜堂”）；西侧另有“梅坞”（乾隆三十九年添建）。", "layer": "ext"}, {"section": "故宫（紫禁城）", "type": "judge", "q": "紫禁城文渊阁是仿照浙江宁波范氏天一阁修建的。", "answer": "对", "explain": "与原文一致：文渊阁仿照浙江宁波范氏天一阁修建。", "source": "紫禁城文渊阁是仿照哪座建筑修建的：仿照浙江宁波范氏天一阁修建。", "layer": "ext"}, {"section": "故宫（紫禁城）", "type": "multi", "q": "据《明史》记载，紫禁城初建后，与南京明故宫一致的布局包括（ ）。", "options": ["A. 中轴线上的奉天、华盖、谨身三殿", "B. 文华、武英两殿", "C. 东西六宫", "D. 乾清宫、坤宁宫"], "answer": "ABC", "explain": "原文：中轴线上的奉天、华盖、谨身三殿，文华、武英两殿，东西六宫等布局均与南京明故宫一致；未提及乾清宫、坤宁宫。", "source": "中轴线上的奉天、华盖、谨身三殿，文华、武英两殿，东西六宫等布局均与南京明故宫一致。", "layer": "ext"}, {"section": "故宫（紫禁城）", "type": "single", "q": "养心殿的名称出自（ ）。", "options": ["A. 《论语》", "B. 《孟子》", "C. 《礼记》", "D. 《周易》"], "answer": "B", "explain": "出自《孟子·尽心下》“养心莫善于寡欲”，寄托帝王培养本心、克制欲望的愿望。", "source": "出自《孟子·尽心下》：“养心莫善于寡欲。”", "layer": "ext"}, {"section": "故宫（紫禁城）", "type": "judge", "q": "清代上书房设于乾清宫东庑，皇子皇孙在此读书，由翰林任师傅。", "answer": "对", "explain": "上书房位于乾清门内东侧、乾清宫周围的庑房（乾清宫东庑），是清代皇子皇孙读书之处。", "source": "上书房，位于乾清门内东侧、乾清宫周围的庑房（乾清宫东庑）。皇子皇孙在此读书，由翰林任师傅。", "layer": "ext"}, {"section": "故宫（紫禁城）", "type": "single", "q": "雍正帝移居养心殿守孝的时间是（ ）。", "options": ["A. 康熙六十一年（1722年）", "B. 雍正元年（1723年）", "C. 康熙五十二年（1713年）", "D. 乾隆元年（1736年）"], "answer": "A", "explain": "雍正帝以乾清宫为“皇考六十余年所御”、居之心有不忍，于康熙六十一年（1722年）移居养心殿守孝，此后未再回乾清宫。", "source": "于康熙六十一年（1722 年）移居养心殿守孝，此后未再回乾清宫。", "layer": "ext"}, {"section": "故宫（紫禁城）", "type": "judge", "q": "钦安殿于明嘉靖十四年添建墙垣自成院落，其南为天一门，取“天一生水”之意以镇火。", "answer": "对", "explain": "钦安殿始建于明永乐十八年（1420年），嘉靖十四年（1535年）添建墙垣自成院落，南为天一门。", "source": "始建于明永乐十八年（1420 年），嘉靖十四年（1535 年）添建墙垣自成院落（南为天一门，取“天一生水”之意以镇火）。", "layer": "ext"}, {"section": "故宫（紫禁城）", "type": "multi", "q": "清顺治二年（1645年）改名后，紫禁城前朝的建筑名称包括（ ）。", "options": ["A. 太和殿", "B. 中和殿", "C. 保和殿", "D. 太和门"], "answer": "ABCD", "explain": "清顺治二年改名：皇极殿改太和殿、中极殿改中和殿、建极殿改保和殿、皇极门改太和门。", "source": "太和殿/中和殿/保和殿/太和门：清顺治二年（1645）改名。", "layer": "ext"}, {"section": "故宫（紫禁城）", "type": "single", "q": "养心殿明间（正殿）“中正仁和”匾的题写者是（ ）。", "options": ["A. 康熙帝", "B. 雍正帝", "C. 乾隆帝", "D. 光绪帝"], "answer": "B", "explain": "“中正仁和”匾为雍正帝御笔，“中正”取义《周易》履卦“刚中正，履帝位而不疚，光明也”。", "source": "明间（正殿）：“中正仁和”匾——雍正帝御笔。", "layer": "ext"}, {"section": "故宫（紫禁城）", "type": "judge", "q": "乾隆时期，珍藏于御花园摛藻堂内的古籍是《四库全书》。", "answer": "错", "explain": "应为《四库全书荟要》，而非《四库全书》。", "source": "乾隆时期，珍藏于御花园摛藻堂内的古籍：《四库全书荟要》。", "layer": "ext"}, {"section": "故宫（紫禁城）", "type": "single", "q": "养心殿大修后重新向公众开放的时间是（ ）。", "options": ["A. 2025年10月10日", "B. 2025年12月26日", "C. 2024年12月26日", "D. 1925年10月10日"], "answer": "B", "explain": "养心殿大修后于2025年12月26日重新向公众开放；1925年10月10日为故宫博物院成立日。", "source": "养心殿大修后重新开放的时间：2025 年 12 月 26 日重新向公众开放。", "layer": "ext"}, {"section": "故宫（紫禁城）", "type": "judge", "q": "绛雪轩位于御花园东南，座西面东。", "answer": "错", "explain": "朝向错误。绛雪轩座东面西，并非座西面东。", "source": "绛雪轩位于御花园东南，座东面西。", "layer": "ext"}, {"section": "故宫（紫禁城）", "type": "multi", "q": "太和殿檐角安放的走兽包括（ ）。", "options": ["A. 龙", "B. 凤", "C. 天马", "D. 行什", "E. 麒麟"], "answer": "ABCD", "explain": "太和殿檐角10个走兽为龙、凤、狮子、天马、海马、狻猊、押鱼、獬豸、斗牛、行什，不含麒麟。", "source": "太和殿檐角安放 10 个走兽，龙、凤、狮子、天马、海马、狻猊、押鱼、獬豸、斗牛、行什。", "layer": "ext"}, {"section": "故宫（紫禁城）", "type": "single", "q": "三希堂原为乾隆皇帝的书房，其初名为（ ）。", "options": ["A. 温室", "B. 随安室", "C. 梅坞", "D. 燕喜堂"], "answer": "A", "explain": "三希堂位于养心殿西暖阁内，是西暖阁南侧隔出的一间小室，初名“温室”；“随安室”为东暖阁清末光绪重书之匾。", "source": "位于养心殿西暖阁内，是西暖阁南侧隔出的一间小室，原为乾隆皇帝的书房，初名“温室”。", "layer": "ext"}, {"section": "故宫（紫禁城）", "type": "judge", "q": "御花园堆秀山位于钦安殿东南，山上建有御景亭。", "answer": "错", "explain": "方位错误。堆秀山位于钦安殿东北，明万历十一年拆观花殿后叠石为山，山上亭名“御景亭”。", "source": "堆秀山位于钦安殿东北，明万历十一年（1583 年）拆观花殿后叠石为山，券门石匾曰“堆秀”，山上建亭，名“御景亭”。", "layer": "ext"}, {"section": "故宫（紫禁城）", "type": "single", "q": "乾隆解释“三希堂”名称所含“修身进取”之意，化用了“士希贤，贤希圣，圣希天”一句，此句出自（ ）。", "options": ["A. 宋·周敦颐《通书·志学》", "B. 《孟子·尽心下》", "C. 《礼记·中庸》", "D. 《周易》履卦"], "answer": "A", "explain": "乾隆化用宋周敦颐《通书·志学》“士希贤，贤希圣，圣希天”，以此自期勤勉不息。", "source": "化用宋周敦颐《通书·志学》“士希贤，贤希圣，圣希天”，表示士人希望成为贤人、贤人希望成为圣人、圣人希望成为知天之人", "layer": "ext"}, {"section": "故宫（紫禁城）", "type": "judge", "q": "养心殿之名出自《论语》，意为修养心性的最好办法是减少欲望。", "answer": "错", "explain": "出处错误。养心殿名出自《孟子·尽心下》“养心莫善于寡欲”，非《论语》。", "source": "出自《孟子·尽心下》：“养心莫善于寡欲。”意为修养心性的最好办法是减少欲望。", "layer": "ext"}, {"section": "故宫（紫禁城）", "type": "multi", "q": "下列建筑中，属于前朝西路武英殿组群的有（ ）。", "options": ["A. 断虹桥", "B. 浴德堂", "C. 南薰殿", "D. 传心殿"], "answer": "ABC", "explain": "西路武英殿组群含武英门、武英殿、浴德堂、断虹桥、南薰殿等；传心殿属东路文华殿组群。", "source": "西路——武英殿组群：武英门、武英殿、敬思殿、凝道殿、焕章殿、恒寿斋、浴德堂、断虹桥……南薰殿……", "layer": "ext"}, {"section": "故宫（紫禁城）", "type": "single", "q": "作为“垂帘听政”制度化的称谓，一般通说最早出现于（ ）。", "options": ["A. 战国时期", "B. 唐初", "C. 北宋初年", "D. 明代初年"], "answer": "B", "explain": "《旧唐书·高宗纪》载显庆五年（660年）唐高宗因风疾不能理政，武则天垂帘于御座后，为史书首见“垂帘”二字；虽有学者上溯至战国秦宣太后（前307年摄政），但制度化称谓一般从唐代算起。", "source": "通说起于唐初（唐高宗显庆年间）。《旧唐书·高宗纪》载：唐高宗显庆五年（660 年）起因风疾不能理政……此为史书首见“垂帘”二字。", "layer": "ext"}, {"section": "故宫（紫禁城）", "type": "judge", "q": "三希堂因收藏王羲之《快雪时晴帖》、王献之《中秋帖》、王珣《伯远帖》三件东晋法帖而得名。", "answer": "对", "explain": "三件晋人法帖稀世之宝贮藏于此，故名“三希堂”，乾隆并撰《三希堂记》阐释其意。", "source": "王羲之《快雪时晴帖》、王献之《中秋帖》、王珣《伯远帖》。", "layer": "ext"}, {"section": "故宫（紫禁城）", "type": "single", "q": "慈安、慈禧两宫皇太后携幼帝载淳于养心殿东暖阁正式垂帘听政，始于（ ）。", "options": ["A. 咸丰十年（1860年）", "B. 咸丰十一年（1861年）", "C. 同治元年（1862年）", "D. 光绪元年（1875年）"], "answer": "B", "explain": "咸丰十一年（1861年）辛酉政变后，十一月初一日两宫皇太后携幼帝载淳（同治）于养心殿东暖阁正式垂帘听政，中隔八扇黄屏风，并制定《垂帘章程》。", "source": "咸丰十一年（1861 年）辛酉政变后，咸丰十一年十一月初一日，慈安、慈禧两宫皇太后携幼帝载淳（同治）于养心殿东暖阁正式垂帘听政", "layer": "ext"}, {"section": "故宫（紫禁城）", "type": "judge", "q": "作为“垂帘听政”制度化的称谓，一般从战国时期秦国宣太后算起。", "answer": "错", "explain": "虽有学者上溯至战国秦宣太后（前307年摄政），但作为制度化称谓一般从唐代算起，《旧唐书·高宗纪》首见“垂帘”二字。", "source": "但作为“垂帘听政”制度化的称谓，一般从唐代算起。", "layer": "ext"}, {"section": "故宫（紫禁城）", "type": "multi", "q": "明清两代，皇帝在太和殿接受文武百官朝贺并向王公大臣赐宴的'三大节'包括（ ）。", "options": ["A. 万寿节", "B. 元旦", "C. 冬至", "D. 上元节"], "answer": "ABC", "explain": "三大节为万寿节（皇帝生日）、元旦、冬至；无上元节。", "source": "每年万寿节（皇帝生日）、元旦、冬至三大节皇帝在此接受文武百官朝贺并向王公大臣赐宴。", "layer": "ext"}, {"section": "故宫（紫禁城）", "type": "single", "q": "顺治皇帝因患天花（痘症）病逝于（ ）。", "options": ["A. 乾清宫", "B. 养心殿", "C. 武英殿", "D. 慈宁宫"], "answer": "B", "explain": "顺治十八年（1661年）顺治帝因患天花病逝于养心殿，年仅24岁。", "source": "顺治十八年（1661 年）顺治帝因患天花（痘症）病逝于养心殿，年仅 24 岁。", "layer": "ext"}, {"section": "故宫（紫禁城）", "type": "judge", "q": "紫禁城西六宫包括永寿宫、翊坤宫、储秀宫、咸福宫、长春宫、太极殿。", "answer": "对", "explain": "西六宫位于中轴线西侧，均为后妃居所，建于明永乐十八年（1420年）。", "source": "西六宫（中轴线西侧）：永寿宫、翊坤宫、储秀宫、咸福宫、长春宫、太极殿。", "layer": "ext"}, {"section": "故宫（紫禁城）", "type": "single", "q": "慈禧太后在紫禁城中庆祝五十大寿的地点是（ ）。", "options": ["A. 储秀宫", "B. 长春宫", "C. 翊坤宫", "D. 永寿宫"], "answer": "A", "explain": "光绪十年（1884年）为庆祝慈禧五十寿辰，耗银63万两整修储秀宫，并将翊坤宫后殿改为穿堂殿“体和殿”，使储秀宫与翊坤宫连通为四进院落。", "source": "光绪十年（1884 年）为庆祝慈禧五十寿辰，耗银 63 万两对储秀宫进行大规模整修……慈禧在五十寿辰时移居储秀宫并在此接受祝寿。", "layer": "ext"}, {"section": "故宫（紫禁城）", "type": "judge", "q": "顺治帝因患天花（痘症）病逝于乾清宫，年仅24岁。", "answer": "错", "explain": "地点错误。顺治十八年（1661年）顺治帝病逝于养心殿，非乾清宫。", "source": "顺治十八年（1661 年）顺治帝因患天花（痘症）病逝于养心殿，年仅 24 岁。", "layer": "ext"}, {"section": "故宫（紫禁城）", "type": "multi", "q": "下列关于乾清门的说法，正确的有（ ）。", "options": ["A. 屋顶形制为单檐歇山顶", "B. 面阔5间、进深3间", "C. 坐落在1.5米高的汉白玉须弥座上", "D. 门前有铜鎏金狮一对"], "answer": "ABCD", "explain": "四项均与原文一致：单檐歇山顶，面阔5间、进深3间，坐落在1.5米高汉白玉须弥座上，门前有铜鎏金狮一对、八字形琉璃影壁。", "source": "单檐歇山顶。面阔 5 间、进深 3 间，高约 16 米，坐落在 1.5 米高的汉白玉须弥座上……门前有铜鎏金狮一对、八字形琉璃影壁。", "layer": "ext"}, {"section": "故宫（紫禁城）", "type": "single", "q": "外西路慈宁宫在仁寿宫故址上拆大善殿建成的时间是（ ）。", "options": ["A. 明永乐十八年（1420年）", "B. 明嘉靖十五年（1536年）", "C. 明万历十一年（1583年）", "D. 清顺治十二年（1655年）"], "answer": "B", "explain": "慈宁宫俗称“太后宫”，位于内廷外西路、隆宗门以西，明嘉靖十五年（1536年）建成，清代孝庄文皇后曾居此至去世。", "source": "明嘉靖十五年（1536 年）在仁寿宫故址上拆大善殿建成，为皇太后的正宫", "layer": "ext"}, {"section": "故宫（紫禁城）", "type": "judge", "q": "光绪十年为庆祝慈禧五十寿辰，耗银63万两对储秀宫进行大规模整修。", "answer": "对", "explain": "同时将翊坤宫后殿改为穿堂殿“体和殿”，使储秀宫与翊坤宫连通为四进院落。", "source": "光绪十年（1884 年）为庆祝慈禧五十寿辰，耗银 63 万两对储秀宫进行大规模整修。", "layer": "ext"}, {"section": "故宫（紫禁城）", "type": "single", "q": "紫禁城自1406年下诏营建至1420年建成，前后共计（ ）。", "options": ["A. 10年", "B. 12年", "C. 14年", "D. 16年"], "answer": "C", "explain": "自1406年下诏至1420年建成，前后共计14年。", "source": "建造时长：自 1406 年下诏至 1420 年建成，前后共计 14 年。", "layer": "ext"}, {"section": "故宫（紫禁城）", "type": "judge", "q": "雍正帝于康熙六十一年（1722年）移居养心殿守孝，此后再未回乾清宫居住。", "answer": "对", "explain": "雍正帝以乾清宫为“皇考六十余年所御”、居之心有不忍，遂移居养心殿守孝，此后未再回乾清宫。", "source": "于康熙六十一年（1722 年）移居养心殿守孝，此后未再回乾清宫。", "layer": "ext"}, {"section": "故宫（紫禁城）", "type": "multi", "q": "清代在乾清宫举行的千叟宴有（ ）。", "options": ["A. 康熙五十二年（1713年）", "B. 康熙六十一年（1722年）", "C. 乾隆五十年（1785年）", "D. 嘉庆元年（1796年）"], "answer": "BC", "explain": "康熙六十一年正月、乾隆五十年正月两次在乾清宫举行；康熙五十二年在畅春园，嘉庆元年在宁寿宫皇极殿。", "source": "康熙六十一年（1722 年）正月——乾清宫；乾隆五十年（1785 年）正月——乾清宫（与宴者 3000 余人，设席 800 桌）。", "layer": "ext"}, {"section": "故宫（紫禁城）", "type": "single", "q": "溥仪被驱逐出紫禁城的时间是（ ）。", "options": ["A. 1912年2月12日", "B. 1924年11月5日", "C. 1925年10月10日", "D. 1914年11月5日"], "answer": "B", "explain": "1924年11月5日，冯玉祥发动'北京政变'后，由鹿钟麟执行，将溥仪驱逐出宫。", "source": "1924 年 11 月 5 日。冯玉祥发动'北京政变'后……由鹿钟麟执行，将溥仪驱逐出宫。", "layer": "ext"}, {"section": "故宫（紫禁城）", "type": "single", "q": "故宫博物院成立的时间是（ ）。", "options": ["A. 1924年11月5日", "B. 1925年10月10日", "C. 1914年10月10日", "D. 1925年1月1日"], "answer": "B", "explain": "故宫博物院成立于1925年10月10日。", "source": "故宫博物院成立的时间：1925 年 10 月 10 日", "layer": "ext"}, {"section": "故宫（紫禁城）", "type": "multi", "q": "下列关于紫禁城珍宝馆现存大玉雕的说法，正确的有（ ）。", "options": ["A. 包括《大禹治水图》玉山", "B. 包括《会昌九老图》玉山", "C. 最大的一件为《秋山行旅图》玉山", "D. 最大的一件为新疆和田青玉，世称'玉器之王'"], "answer": "ABD", "explain": "三件大玉雕为《大禹治水图》《会昌九老图》《秋山行旅图》玉山；最大的一件是《大禹治水图》玉山，为新疆和田青玉，世称'玉器之王'，故C错误。", "source": "《大禹治水图》玉山、《会昌九老图》玉山、《秋山行旅图》玉山。最大的一件：《大禹治水图》玉山——为新疆和田（密勒塔山）青玉，是世界上最大的和田玉雕，世称'玉器之王'。", "layer": "ext"}, {"section": "故宫（紫禁城）", "type": "single", "q": "清代颁朔礼的举行地点在（ ）。", "options": ["A. 太和门", "B. 午门", "C. 乾清门", "D. 奉天门"], "answer": "B", "explain": "明清颁朔礼均在每年农历十月初一举行；明在太和门（奉天门／皇极门），清在午门。", "source": "每年农历十月初一（明清同）；明在太和门（奉天门／皇极门），清在午门。", "layer": "ext"}, {"section": "故宫（紫禁城）", "type": "single", "q": "明初的谨身殿，即今天故宫前朝三大殿中的（ ）。", "options": ["A. 太和殿", "B. 中和殿", "C. 保和殿", "D. 文华殿"], "answer": "C", "explain": "保和殿名称演变：明初谨身殿→嘉靖四十一年改建极殿→清顺治二年改保和殿。", "source": "保和殿：明初谨身殿，明嘉靖四十一年（1 福台”、中为“禄台”、下为“寿台”，每层之间有楼梯相通。", "source": "共 3 层（上为“福台”、中为“禄台”、下为“寿台”），每层之间有楼梯相通。", "layer": "ext"}, {"section": "故宫（紫禁城）", "type": "single", "q": "宁寿宫区中，仿养心殿而建的建筑是（ ）。", "options": ["A. 皇极殿", "B. 宁寿宫", "C. 宁寿门", "D. 养性殿"], "answer": "D", "explain": "宁寿门仿乾清门，养性殿仿养心殿；皇极殿仿乾清宫，宁寿宫形制同坤宁宫。", "source": "宁寿门仿乾清门，养性殿仿养心殿。", "layer": "ext"}, {"section": "故宫（紫禁城）", "type": "single", "q": "乾隆时期，《四库全书荟要》珍藏于御花园的（ ）。", "options": ["A. 摛藻堂", "B. 绛雪轩", "C. 钦安殿", "D. 御景亭"], "answer": "A", "explain": "《四库全书荟要》珍藏于御花园摛藻堂内。", "source": "乾隆时期，珍藏于御花园摛藻堂内的古籍：《四库全书荟要》。", "layer": "ext"}, {"section": "故宫（紫禁城）", "type": "single", "q": "紫禁城东西六宫均建于（ ）。", "options": ["A. 明永乐四年（1406年）", "B. 明永乐十八年（1420年）", "C. 明嘉靖十五年（1536年）", "D. 清顺治十二年（1655年）"], "answer": "B", "explain": "东西六宫均为后妃居所，建于明永乐十八年（1420年），各宫规制相近、自成院落。", "source": "均为后妃居所，建于明永乐十八年（1420 年），各宫规制相近、自成院落。", "layer": "ext"}, {"section": "故宫（紫禁城）", "type": "single", "q": "光绪十年整修储秀宫时，将翊坤宫后殿改为穿堂殿（ ），使储秀宫与翊坤宫连通为四进院落。", "options": ["A. 体和殿", "B. 养心殿", "C. 太极殿", "D. 咸福宫"], "answer": "A", "explain": "光绪十年为庆祝慈禧五十寿辰，耗银63万两整修储秀宫，并将翊坤宫后殿改为穿堂殿“体和殿”。", "source": "并将翊坤宫后殿改为穿堂殿“体和殿”，使储秀宫与翊坤宫连通为四进院落。", "layer": "ext"}, {"section": "故宫（紫禁城）", "type": "single", "q": "紫禁城外西路慈宁宫的俗称是（ ）。", "options": ["A. 太后宫", "B. 长寿宫", "C. 老佛爷宫", "D. 慈宁殿"], "answer": "A", "explain": "慈宁宫俗称“太后宫”，为皇太后的正宫，是明清太皇太后、皇太后、太妃嫔的居所。", "source": "俗称“太后宫”。慈宁宫位于内廷外西路、隆宗门以西……为皇太后的正宫。", "layer": "ext"}, {"section": "故宫（紫禁城）", "type": "single", "q": "明代坤宁宫的主要用途是（ ）。", "options": ["A. 皇帝寝宫", "B. 皇后的正宫（寝宫）", "C. 萨满教祭神场所", "D. 皇帝大婚洞房"], "answer": "B", "explain": "明代坤宁宫为皇后的正宫（寝宫）；清代改造后正间及西暖阁为萨满教祭神场所，东暖阁为皇帝大婚洞房。", "source": "明代：皇后的正宫（寝宫），为皇后起居之所。", "layer": "ext"}, {"section": "天坛", "layer": "core", "type": "single", "q": "天坛位于北京（ ）。", "options": ["东城区正阳门外东南", "西城区西直门外", "东城区安定门外", "崇文门内大街"], "answer": "A", "explain": "天坛位于东城区正阳门外东南，是明清皇帝祭天、祈谷之所，明永乐十八年（1420年）建成，初名天地坛。", "source": "东城区正阳门外东南；明永乐十八年（1420年）建成、初名天地坛；明清皇帝祭天、祈谷之所"}, {"section": "天坛", "layer": "core", "type": "judge", "q": "天坛占地面积273公顷，接近紫禁城的2倍。", "answer": "错", "explain": "天坛占地273公顷，接近紫禁城的4倍，不是2倍。", "source": "东城区正阳门外东南；273公顷（近紫禁城4倍）"}, {"section": "天坛", "layer": "core", "type": "multi", "q": "下列关于天坛特点及所获称号的表述，正确的有（ ）。", "options": ["现存规模最大、形制最完备的祭天建筑群", "1961年列为第一批全国重点文物保护单位", "1998年列入《世界遗产名录》", "2007年被评为国家5A级景区", "始建于清代康熙年间"], "answer": "ABCD", "explain": "天坛始建于明永乐十八年（1420年），并非清代；是现存规模最大、形制最完备的祭天建筑群，1961年第一批国保、1998年入《世界遗产名录》、2007年获评5A。", "source": "现存规模最大、形制最完备祭天建筑群；1961年第一批国保、1998年入《世界遗产名录》、2007年5A"}, {"section": "天坛", "layer": "core", "type": "single", "q": "天坛北圆南方的坛墙俗称为（ ）。", "options": ["天地墙", "乾坤墙", "日月墙", "阴阳墙"], "answer": "A", "explain": "天坛平面布局北圆南方（天圆地方），坛墙俗称“天地墙”，整体呈“回”字形。", "source": "北圆南方（天圆地方）；俗称“天地墙”；整体呈“回”字形"}, {"section": "天坛", "layer": "core", "type": "judge", "q": "天坛平面布局北圆南方，象征天圆地方，整体呈“回”字形，分为内坛、外坛两部分。", "answer": "对", "explain": "天坛平面北圆南方（天圆地方），俗称“天地墙”，整体呈“回”字形，由内坛、外坛两部分组成。", "source": "北圆南方（天圆地方）；俗称“天地墙”；整体呈“回”字形；内坛、外坛两部分"}, {"section": "天坛", "layer": "core", "type": "single", "q": "圜丘坛的四座坛门按东、南、西、北方位依次为（ ）。", "options": ["泰元门、昭亨门、广利门、成贞门", "昭亨门、泰元门、成贞门、广利门", "广利门、成贞门、泰元门、昭亨门", "成贞门、广利门、昭亨门、泰元门"], "answer": "A", "explain": "天坛九座坛门：外坛墙2座（祈谷坛门、圜丘坛门），圜丘4座（东泰元、南昭亨、西广利、北成贞），祈谷坛3座（东、西、北天门）。", "source": "九座坛门：外坛墙2座（祈谷坛门、圜丘坛门）、圜丘4座（东泰元、南昭亨、西广利、北成贞）、祈谷坛3座（东、西、北天门）"}, {"section": "天坛", "layer": "core", "type": "judge", "q": "七星石实为8块，其中七块为嘉靖年间所置、代表泰山七峰，乾隆年间增置一块代表长白山。", "answer": "对", "explain": "七星石名“七”实“八”：七块为嘉靖帝所置、代表泰山七峰，乾隆帝增置一块代表长白山。", "source": "七星石实为8块（七块嘉靖置代表泰山七峰；乾隆增一块代表长白山）"}, {"section": "天坛", "layer": "core", "type": "multi", "q": "天坛的三道坛墙包括（ ）。", "options": ["外坛墙", "内坛墙", "圜丘与祈谷坛之间的东西隔墙", "斋宫宫墙"], "answer": "ABC", "explain": "三道坛墙为外坛墙、内坛墙、圜丘与祈谷坛间东西隔墙；斋宫宫墙两重是斋宫的防卫设施，不属三道坛墙。", "source": "三道坛墙：外坛墙、内坛墙、圜丘与祈谷坛间东西隔墙"}, {"section": "天坛", "layer": "core", "type": "single", "q": "明代改天地分祀、建圜丘，并撤大祀殿建大享殿的皇帝是（ ）。", "options": ["永乐帝朱棣", "嘉靖帝朱厚熜", "洪熙帝朱高炽", "万历帝朱翊钧"], "answer": "B", "explain": "嘉靖帝（朱厚熜）改分祀、建圜丘、撤大祀殿建大享殿（1545年）；初建天地坛（天地合祀）的是永乐帝朱棣。", "source": "永乐帝（朱棣）初建天地坛（天地合祀）；嘉靖帝（朱厚熜）改分祀、建圜丘、撤大祀殿建大享殿（1545年）"}, {"section": "天坛", "layer": "core", "type": "judge", "q": "乾隆帝对天坛的贡献包括扩建圜丘、改大享殿为祈年殿，并将殿瓦统一为蓝瓦。", "answer": "对", "explain": "乾隆帝（弘历）扩建圜丘、改大享殿为祈年殿、统一蓝瓦；永乐帝初建天地坛（天地合祀），嘉靖帝改分祀、建圜丘、撤大祀殿建大享殿。", "source": "乾隆帝（弘历）扩建圜丘、改大享殿为祈年殿、统一蓝瓦"}, {"section": "天坛", "layer": "core", "type": "single", "q": "明清两代在天坛祭祀次数最多的皇帝是乾隆帝，共祭祀（ ）。", "options": ["155次", "654次", "110次", "72次"], "answer": "A", "explain": "明清22位皇帝共祭祀654次，乾隆帝最多达155次；1907年为最后一次祭天。", "source": "22位皇帝；654次；乾隆最多155次；1907年为最后一次祭天"}, {"section": "天坛", "layer": "core", "type": "judge", "q": "明清两代共有24位皇帝在天坛举行过祭祀大典。", "answer": "错", "explain": "明清两代共有22位皇帝在天坛举行祭祀大典，共654次，其中乾隆帝最多达155次。", "source": "22位皇帝；654次；乾隆最多155次"}, {"section": "天坛", "layer": "core", "type": "multi", "q": "明嘉靖九年（1530年）改天地分祀后，兴建的四坛包括（ ）。", "options": ["圜丘", "方泽", "朝日", "夕月", "祈谷"], "answer": "ABCD", "explain": "嘉靖九年分祀后建圜丘、方泽、朝日、夕月四坛；祈谷坛不在此列。", "source": "明嘉靖九年（1530年）；夏言建议；建圜丘、方泽、朝日、夕月四坛"}, {"section": "天坛", "layer": "core", "type": "single", "q": "历史上在天坛举行第一次祭祀盛典的时间是（ ）。", "options": ["明永乐十八年（1420年）", "明永乐十九年（1421年）正月", "明嘉靖九年（1530年）", "明嘉靖十年（1531年）"], "answer": "B", "explain": "明永乐十九年（1421年）正月，朱棣率百官于大祀殿“大祀天地于南郊”，标志迁都北京。", "source": "明永乐十九年（1421年）正月；朱棣率百官大祀殿“大祀天地于南郊”；标志迁都北京"}, {"section": "天坛", "layer": "core", "type": "judge", "q": "永乐十九年（1421年）正月朱棣在大祀殿“大祀天地于南郊”后，至嘉靖九年的110年间共有10位明帝行天地合祀。", "answer": "错", "explain": "至嘉靖九年的110年间共有9位明帝行天地合祀，不是10位。", "source": "至嘉靖九年110年间9位明帝合祀"}, {"section": "天坛", "layer": "core", "type": "single", "q": "建议将天地合祀改为天地分祀的明代大臣是（ ）。", "options": ["夏言", "严嵩", "张居正", "徐阶"], "answer": "A", "explain": "明嘉靖九年（1530年），夏言建议将天地合祀改为天地分祀，遂建圜丘、方泽、朝日、夕月四坛。", "source": "明嘉靖九年（1530年）；夏言建议；建圜丘、方泽、朝日、夕月四坛"}, {"section": "天坛", "layer": "core", "type": "judge", "q": "天坛初名天地坛，因兼具祭天、祭地之功（天地合祀）而得名，嘉靖九年（1530年）分祀后改称天坛。", "answer": "对", "explain": "初名天地坛，取兼具祭天祭地、合祀之意；嘉靖九年（1530年）分祀后改称天坛。", "source": "初名天地坛（兼具祭天祭地、合祀）；嘉靖九年（1530年）分祀后改称天坛"}, {"section": "天坛", "layer": "core", "type": "multi", "q": "下列建筑中，属于祈谷坛建筑群的有（ ）。", "options": ["祈年殿", "皇乾殿", "七十二长廊", "皇穹宇", "具服台"], "answer": "ABCE", "explain": "祈谷坛建筑：祈年殿、皇乾殿、宰牲亭、七十二长廊、具服台、七星石；皇穹宇属圜丘坛。", "source": "祈谷坛：祈年殿、皇乾殿、宰牲亭、七十二长廊、具服台、七星石；圜丘坛：圜丘、皇穹宇……"}, {"section": "天坛", "layer": "core", "type": "single", "q": "天地坛改称“天坛”的时间是（ ）。", "options": ["明永乐十八年（1420年）", "明永乐十九年（1421年）", "明嘉靖九年（1530年）", "清乾隆十四年（1749年）"], "answer": "C", "explain": "嘉靖九年（1530年）天地分祀后，天地坛改称天坛。", "source": "嘉靖九年（1530年）分祀后改称天坛"}, {"section": "天坛", "layer": "core", "type": "judge", "q": "民国七年（1918年）1月1日，天坛辟为天坛公园正式对外开放。", "answer": "对", "explain": "民国七年（1918年）1月1日，天坛辟为天坛公园，正式对外开放。", "source": "民国七年（1918年）1月1日；辟为天坛公园正式开放"}, {"section": "天坛", "layer": "core", "type": "single", "q": "连接天坛南、北二坛的是（ ）。", "options": ["丹陛桥", "神路", "金水桥", "七十二长廊"], "answer": "A", "explain": "丹陛桥连接南北二坛；圜丘坛有圜丘、皇穹宇（回音壁、三音石、对话石）、燔柴炉、瘗坎、望灯杆；斋宫有无梁殿、寝殿、钟楼；神乐署有凝禧殿、显佑殿。", "source": "丹陛桥连接南北二坛；皇穹宇（回音壁、三音石、对话石）；斋宫：无梁殿、寝殿、钟楼；神乐署：凝禧殿、显佑殿"}, {"section": "天坛", "layer": "core", "type": "judge", "q": "天坛内百年以上古树有3562株，多为油松、白皮松。", "answer": "错", "explain": "百年以上古树3562株不错，但树种多为侧柏、桧柏，不是油松、白皮松。", "source": "百年以上古树3562株；多为侧柏、桧柏"}, {"section": "天坛", "layer": "core", "type": "multi", "q": "下列关于祈年殿的表述，正确的有（ ）。", "options": ["总高约38米", "直径32.72米", "建于三层汉白玉圆台（祈谷坛）之上", "为孟春（正月）祈谷大典专用", "殿顶为绿色琉璃瓦"], "answer": "ABCD", "explain": "祈年殿总高约38米、直径32.72米，建于三层汉白玉圆台（祈谷坛）之上，是孟春（正月）祈谷大典专用殿宇；其瓦为蓝琉璃瓦而非绿色。", "source": "总高约38米、直径32.72米；三层汉白玉圆台（祈谷坛）之上；孟春（正月）祈谷大典专用"}, {"section": "天坛", "layer": "core", "type": "single", "q": "天坛作为公园正式对外开放的时间是（ ）。", "options": ["1912年1月1日", "1918年1月1日", "1925年10月10日", "1949年10月1日"], "answer": "B", "explain": "民国七年（1918年）1月1日，天坛辟为天坛公园正式开放。", "source": "民国七年（1918年）1月1日；辟为天坛公园正式开放"}, {"section": "天坛", "layer": "core", "type": "judge", "q": "祈年殿为圆形大殿，覆三重檐黄琉璃瓦以象征苍天。", "answer": "错", "explain": "祈年殿覆三重檐蓝琉璃瓦象征苍天，不是黄琉璃瓦。", "source": "圆形殿、三重檐蓝琉璃瓦象征苍天、鎏金宝顶"}, {"section": "天坛", "layer": "core", "type": "single", "q": "天坛内300年以上的一级古树有（ ）。", "options": ["1147株", "3562株", "6万余株", "273株"], "answer": "A", "explain": "天坛有树木6万多株，百年以上古树3562株，300年以上一级古树114 wer": "B", "explain": "上层九丈、中层十五丈、下层二十一丈，直径和45丈，合“九五之尊”。", "source": "上层九丈、中层十五丈、下层二十一丈；直径和45丈（九五之尊）"}, {"section": "天坛", "layer": "core", "type": "single", "q": "圜丘坛上层台面正中的天心石，又称（ ）。", "options": ["三音石", "太极石", "对话石", "望灯石"], "answer": "B", "explain": "天心石又称太极石、亿兆景从石；三音石、对话石为甬道石板。", "source": "又称太极石、亿兆景从石"}, {"section": "天坛", "layer": "core", "type": "multi", "q": "皇穹宇正殿东配殿供奉的神位包括（ ）。", "options": ["大明之神（日）", "北斗", "五星", "二十八宿", "夜明之神（月）"], "answer": "ABCD", "explain": "东配殿供大明之神（日）、北斗、五星、二十八宿；夜明之神（月）在西配殿。", "source": "东配殿大明之神（日）、北斗、五星、二十八宿；西配殿夜明之神（月）、云师、雨师、风伯、雷师"}, {"section": "天坛", "layer": "core", "type": "single", "q": "圜丘坛的燔柴炉位于坛的（ ），用于焚牛犊迎帝神。", "options": ["东南", "西南", "东北", "西北"], "answer": "A", "explain": "燔柴炉在东南，焚牛犊迎帝神；望灯杆在西南。", "source": "燔柴炉（东南、焚牛犊迎帝神）"}, {"section": "天坛", "layer": "core", "type": "single", "q": "圜丘坛望灯杆上所挂灯笼的尺寸及所点蜡烛为（ ）。", "options": ["直径1.3米、高2.15米，5只蟠龙通宵宝蜡", "直径2.15米、高1.3米，3只蟠龙通宵宝蜡", "直径1.3米、高2.15米，1只蟠龙通宵宝蜡", "直径1.5米、高2米，5只龙凤宝蜡"], "answer": "A", "explain": "望灯杆高约9丈（约30米，现仅存其一）；灯笼直径1.3米、高2.15米；点5只蟠龙通宵宝蜡。", "source": "灯笼直径1.3米、高2.15米；5只蟠龙通宵宝蜡"}, {"section": "天坛", "layer": "core", "type": "multi", "q": "下列关于斋宫正殿建筑结构特点的说法，正确的有（ ）。", "options": ["砖券拱顶、不用梁枋大木", "故名无梁殿", "面阔五间", "绿琉璃瓦庑殿顶", "宫墙三重、御沟一道"], "answer": "ABCD", "explain": "斋宫正殿砖券拱顶、不用梁枋大木（故名无梁殿），面阔五间，绿琉璃瓦庑殿顶，永乐十八年建；外围宫墙两重、御沟两道，E项错误。", "source": "砖券拱顶、不用梁枋大木（故名无梁殿）；面阔五间；绿琉璃瓦庑殿顶；永乐十八年建；宫墙两重、御沟两道"}, {"section": "天坛", "layer": "core", "type": "single", "q": "清朝皇穹宇大殿的殿顶形制为（ ）。", "options": ["圆形重檐攒尖顶", "圆形单檐攒尖顶", "方形单檐庑殿顶", "圆形单檐歇山顶"], "answer": "B", "explain": "皇穹宇大殿为圆形单檐攒尖顶，覆蓝色（青色）琉璃瓦、鎏金宝顶，殿内8根金柱、8根檐柱。", "source": "蓝色（青色）琉璃瓦、鎏金宝顶；圆形单檐攒尖顶、8根金柱8根檐柱"}, {"section": "天坛", "layer": "core", "type": "single", "q": "清朝皇穹宇大殿内神版的文字形式为（ ）。", "options": ["汉文、墨地金书", "满文与汉文两种、青地金书", "满文一种、青地金书", "满汉藏三种、墨地金书"], "answer": "B", "explain": "神版用满文与汉文两种文字，满汉合璧、青地金书。", "source": "满文与汉文两种（满汉合璧、青地金书）"}, {"section": "天坛", "layer": "core", "type": "multi", "q": "下列关于斋宫匾额的说法，正确的有（ ）。", "options": ["正殿内悬“钦若昊天”匾", "为
