 "金牌为纯银镀金不少于6克，银牌纯银，铜牌纯铜", "金牌镶白玉、银牌镶青白玉、铜牌镶青玉，玉材为青海昆仑玉", "是奥运史上首次在奖牌中加入金属以外的材质", "绶带经过纳米技术处理"], "answer": "ABCDE", "explain": "各选项均与背诵版“金镶玉”奖牌的材质与特色表述一致。", "source": "“金镶玉”；直径 70 毫米厚 6 毫米；金牌纯银镀金不少于 6 克、银牌纯银、铜牌纯铜；金牌镶白玉、银牌青白玉、铜牌青玉；青海昆仑玉；奥运史上首次在奖牌加入金属以外材质；绶带纳米处理"}, {"section": "奥林匹克公园", "layer": "core", "type": "single", "q": "奥运会历史上首个登上金牌榜首的亚洲国家是（ ）。", "options": ["日本", "韩国", "中国", "俄罗斯"], "answer": "C", "explain": "2008年北京奥运会上，中国以51枚金牌、100枚奖牌成为奥运史上首个登上金牌榜首的亚洲国家。", "source": "首个登上金牌榜首的亚洲国家：中国（51 枚金牌、100 枚奖牌）"}, {"section": "奥林匹克公园", "layer": "core", "type": "single", "q": "2022年北京冬奥会的三大理念是（ ）。", "options": ["绿色奥运、科技奥运、人文奥运", "以运动员为中心、可持续发展、节俭办赛", "绿色、共享、开放、廉洁", "同一个世界，同一个梦想"], "answer": "B", "explain": "北京申办冬奥三大理念为以运动员为中心、可持续发展、节俭办赛；A是2008年夏奥理念。", "source": "三大理念：以运动员为中心、可持续发展、节俭办赛"}, {"section": "奥林匹克公园", "layer": "core", "type": "multi", "q": "关于2022年北京冬奥会和冬残奥会的会徽与吉祥物，下列说法正确的有（ ）。", "options": ["冬奥会会徽名为“冬梦”", "冬残奥会会徽名为“飞跃”", "冬奥会吉祥物是熊猫“冰墩墩”", "冬残奥会吉祥物是灯笼“雪容融”", "冬奥会口号是“同一个世界 同一个梦想”"], "answer": "ABCD", "explain": "2022年北京冬奥会口号为“一起向未来”；“同一个世界 同一个梦想”是2008年奥运会主题口号，E错误。", "source": "冬奥会会徽“冬梦”、冬残奥会会徽“飞跃”；吉祥物冰墩墩（熊猫）、雪容融（灯笼）；口号“一起向未来”"}, {"section": "奥林匹克公园", "layer": "core", "type": "single", "q": "中国在2022年北京冬奥会上获得的金牌数和金牌榜排名分别是（ ）。", "options": ["9枚金牌，金牌榜第3位", "9枚金牌，金牌榜第1位", "16枚金牌，金牌榜第3位", "51枚金牌，金牌榜第1位"], "answer": "A", "explain": "中国获9金4银2铜共15枚奖牌，位列金牌榜第3位，创历史最好成绩；16金是挪威，51金是2008年夏奥中国成绩。", "source": "9 金 4 银 2 铜共 15 枚奖牌；金牌榜第 3 位；历史最好成绩"}, {"section": "奥林匹克公园", "layer": "core", "type": "single", "q": "2022年北京冬奥会金牌榜前三位的国家是（ ）。", "options": ["挪威、德国、中国", "挪威、中国、德国", "德国、挪威、中国", "挪威、德国、美国"], "answer": "A", "explain": "金牌榜前三：挪威16金、德国12金、中国9金；中国实现全项目参赛，共176名运动员。", "source": "前三：挪威 16 金、德国 12 金、中国 9 金；全项目参赛（176 名运动员）"}, {"section": "奥林匹克公园", "layer": "core", "type": "single", "q": "世界上第一位“双奥”开幕式总导演是（ ）。", "options": ["陈维亚", "张艺谋", "张继钢", "蔡国强"], "answer": "B", "explain": "张艺谋担任2008年夏奥会和2022年冬奥会开闭幕式总导演，另执导2004雅典、2018平昌“北京8分钟”。北京是世界唯一“双奥之城”，奥林匹克公园为双奥园区。", "source": "双奥之城：北京；双奥导演：张艺谋（2008 夏奥＋2022 冬奥开闭幕式总导演）"}, {"section": "奥林匹克公园", "layer": "core", "type": "single", "q": "世界上唯一的'双奥之城'是（ ）。", "options": ["A. 北京", "B. 巴黎", "C. 阿拉木图", "D. 莫斯科"], "answer": "A", "explain": "北京先后举办2008年第29届夏奥会和2022年第24届冬奥会，是世界上唯一的'双奥之城'。巴黎为2008年奥运会申办竞争城市，阿拉木图为2022年冬奥会申办对手（44票对40票落败），莫斯科为北京获得2008年奥运会主办权的宣布地，均非'双奥之城'。", "source": "世界上唯一的'双奥之城'是北京（中国北京）。2008年北京成功举办第29届夏季奥林匹克运动会，2022年又成功举办第24届冬季奥林匹克运动会。", "patch": true}, {"section": "奥林匹克公园", "type": "single", "q": "北京奥林匹克公园的总占地面积是（　）。", "options": ["A. 6.8平方公里", "B. 3.15平方公里", "C. 11.59平方公里", "D. 1.64平方公里"], "answer": "C", "explain": "北京奥林匹克公园总占地面积11.59平方公里（约合1159公顷）。6.8、3.15、1.64平方公里分别为北部、中部、南部面积。", "source": "总占地面积11.59平方公里（约合1159公顷）", "layer": "ext"}, {"section": "奥林匹克公园", "type": "judge", "q": "北京奥林匹克公园位于北京市海淀区，地处北京城中轴线的最北端。", "answer": "错", "explain": "北京奥林匹克公园位于北京市朝阳区，而非海淀区。", "source": "北京奥林匹克公园位于北京市朝阳区，地处北京城中轴线的最北端，总占地面积11.59平方公里", "layer": "ext"}, {"section": "奥林匹克公园", "type": "multi", "q": "下列关于北京奥林匹克公园空间构成的说法，正确的有（　）。", "options": ["A. 北部为奥林匹克森林公园", "B. 中部为中心区，是奥运会场馆和设施的集聚区", "C. 南部为已建成和预留区（奥体中心区）", "D. 北部奥林匹克森林公园面积为3.15平方公里"], "answer": "ABC", "explain": "全园分三部分：北部奥林匹克森林公园（6.8平方公里）、中部中心区（3.15平方公里）、南部奥体中心区（1.64平方公里）。D项面积错误。", "source": "全园在空间上分为三大部分：北部为奥林匹克森林公园，面积6.8平方公里……中部为中心区，面积3.15平方公里……南部为已建成和预留区（奥体中心区），面积1.64平方公里", "layer": "ext"}, {"section": "奥林匹克公园", "type": "single", "q": "北顶娘娘庙坐落在奥林匹克公园中心区的（　）。", "options": ["A. 东北部", "B. 东南部", "C. 西北部", "D. 西南部"], "answer": "D", "explain": "北顶娘娘庙坐落在奥林匹克公园中心区的西南部，国家游泳中心\"水立方\"南侧不远处。", "source": "北顶娘娘庙坐落在奥林匹克公园中心区的西南部（国家游泳中心\"水立方\"南侧不远处）", "layer": "ext"}, {"section": "奥林匹克公园", "type": "judge", "q": "奥林匹克森林公园面积6.8平方公里，是集生态、休闲、健身于一体的超大型城市公园。", "answer": "对", "explain": "原文表述：北部为奥林匹克森林公园，面积6.8平方公里，是集生态、休闲、健身于一体的超大型城市公园。", "source": "北部为奥林匹克森林公园，面积6.8平方公里，是集生态、休闲、健身于一体的超大型城市公园", "layer": "ext"}, {"section": "奥林匹克公园", "type": "single", "q": "北顶娘娘庙始建于（　）。", "options": ["A. 元代至元年间", "B. 明宣德年间", "C. 明嘉靖年间", "D. 清乾隆年间"], "answer": "B", "explain": "北顶娘娘庙始建于明宣德年间（1426—1435年），初为土地庙，清乾隆年间奉敕重修。", "source": "该庙始建于明宣德年间（1426—1435年），初为土地庙，清乾隆年间奉敕重修", "layer": "ext"}, {"section": "奥林匹克公园", "type": "judge", "q": "北顶娘娘庙于2003年被公布为北京市第七批市级文物保护单位，同年列入\"人文奥运\"文物修缮计划。", "answer": "对", "explain": "与原文一致：2003年被公布为北京市第七批市级文物保护单位，同年列入\"人文奥运\"文物修缮计划。", "source": "2003年被公布为北京市第七批市级文物保护单位，同年列入\"人文奥运\"文物修缮计划", "layer": "ext"}, {"section": "奥林匹克公园", "type": "multi", "q": "2008年奥运会期间，国家体育馆主要承担的比赛项目有（　）。", "options": ["A. 竞技体操", "B. 蹦床", "C. 手球", "D. 游泳"], "answer": "ABC", "explain": "2008年奥运会期间，国家体育馆主要承担竞技体操、蹦床和手球（决赛阶段）三个项目的比赛；游泳在水立方进行。", "source": "2008年奥运会期间，国家体育馆主要承担竞技体操、蹦床和手球（决赛阶段）三个项目的比赛", "layer": "ext"}, {"section": "奥林匹克公园", "type": "single", "q": "宣布北京获得2008年奥运会主办权的是国际奥委会第（　）次全会。", "options": ["A. 第111次", "B. 第112次", "C. 第113次", "D. 第128次"], "answer": "B", "explain": "2001年7月13日在莫斯科举行的国际奥委会第112次全会上，萨马兰奇宣布北京获得2008年奥运会主办权；第128次全会是2022年冬奥会申办。", "source": "在俄罗斯莫斯科举行的国际奥委会第112次全会上，国际奥委会主席萨马兰奇宣布北京获得2008年第29届夏季奥林匹克运动会主办权", "layer": "ext"}, {"section": "奥林匹克公园", "type": "judge", "q": "北京2008年奥运会火炬接力传递历时130天，其中境外传递97天、境内传递33天。", "answer": "错", "explain": "传递历时130天，其中境外33天、境内97天，题干将境外、境内天数颠倒。", "source": "传递历时130天（境外33天、境内97天），总里程约13.7万公里", "layer": "ext"}, {"section": "奥林匹克公园", "type": "single", "q": "2008年北京奥运会的主题口号是（　）。", "options": ["A. 新北京，新奥运", "B. 同一个世界 同一个梦想", "C. 和谐之旅", "D. 一起向未来"], "answer": "B", "explain": "主题口号是\"同一个世界 同一个梦想\"。\"新北京，新奥运\"是申办口号，\"和谐之旅\"是火炬接力主题，\"一起向未来\"是2022年冬奥会口号。", "source": "主题口号是\"同一个世界 同一个梦想\"（One World, One Dream），于2005年6月26日在北京工人体育馆正式发布", "layer": "ext"}, {"section": "奥林匹克公园", "type": "judge", "q": "2008年北京奥运会开幕式总导演为张艺谋，文艺表演名为《美丽的奥林匹克》。", "answer": "对", "explain": "与原文一致：开幕式在国家体育场（鸟巢）举行，总导演为张艺谋，文艺表演名为《美丽的奥林匹克》。", "source": "开幕式在国家体育场（鸟巢）举行，总导演为张艺谋，文艺表演名为《美丽的奥林匹克》", "layer": "ext"}, {"section": "奥林匹克公园", "type": "multi", "q": "承担2022年北京冬奥会赛事活动的赛区有（　）。", "options": ["A. 北京赛区", "B. 延庆赛区", "C. 张家口赛区", "D. 顺义赛区"], "answer": "ABC", "explain": "承担赛事活动的赛区共三个：北京赛区、延庆赛区、张家口赛区（北京、张家口两座城市）。", "source": "承担赛事活动的赛区共三个：北京赛区、延庆赛区、张家口赛区（北京、张家口两座城市）", "layer": "ext"}, {"section": "奥林匹克公园", "type": "single", "q": "2008年奥运会期间承担竞技体操、蹦床、手球比赛的国家体育馆，其固定座席为（　）。", "options": ["A. 约2000个", "B. 18000个", "C. 约81000个", "D. 20000个"], "answer": "B", "explain": "国家体育馆固定座席18000个，另加临时座席约2000个，最多可容纳观众约2万人，总建筑面积约8.1万平方米。", "source": "国家体育馆总建筑面积约8.1万平方米，固定座席18000个（另加临时座席约2000个），最多可容纳观众约2万人", "layer": "ext"}, {"section": "奥林匹克公园", "type": "judge", "q": "北京2022年冬奥会会徽名为\"飞跃\"，冬残奥会会徽名为\"冬梦\"。", "answer": "错", "explain": "冬奥会会徽名为\"冬梦\"，冬残奥会会徽名为\"飞跃\"，题干将二者颠倒。", "source": "北京2022年冬奥会会徽名为\"冬梦\"……北京2022年冬残奥会会徽名为\"飞跃\"", "layer": "ext"}, {"section": "奥林匹克公园", "type": "single", "q": "2008年北京奥运会开幕式上，中国代表团入场式的旗手是（　）。", "options": ["A. 李宁", "B. 许海峰", "C. 姚明", "D. 刘欢"], "answer": "C", "explain": "中国代表队入场式的旗手是篮球运动员姚明；李宁是点燃主火炬的运动员。", "source": "中国代表队入场式的旗手是篮球运动员姚明", "layer": "ext"}, {"section": "奥林匹克公园", "type": "judge", "q": "北京奥林匹克公园南部为已建成和预留区（奥体中心区），面积1.64平方公里，是1990年亚运会场馆集聚区及奥体文化商务园区。", "answer": "对", "explain": "与原文一致：南部为已建成和预留区（奥体中心区），面积1.64平方公里，是1990年亚运会场馆集聚区及奥体文化商务园区。", "source": "南部为已建成和预留区（奥体中心区），面积1.64平方公里，是1990年亚运会场馆集聚区及奥体文化商务园区", "layer": "ext"}, {"section": "奥林匹克公园", "type": "multi", "q": "下列关于北京\"双奥\"的说法，正确的有（　）。", "options": ["A. 张艺谋是世界上第一位\"双奥\"开幕式总导演", "B. 鸟巢是世界上唯一一座同时举办过夏奥会和冬奥会开闭幕式的体育场馆", "C. 2008年北京奥运会中国代表团首次位列奥运会金牌榜第一", "D. 北京2022年冬奥会吉祥物\"冰墩墩\"以熊猫为原型", "E. 2022年北京冬奥会中国代表团获得9枚金牌，位列金牌榜第1位"], "answer": "ABCD", "explain": "2022年冬奥会中国获9金4银2铜，位列金牌榜第3位（挪威16金居首），故E错误；其余各项均与原文一致。", "source": "中国体育代表团共获得9枚金牌、4枚银牌、2枚铜牌……位列金牌榜第3位", "layer": "ext"}, {"section": "奥林匹克公园", "type": "single", "q": "为捐资兴建\"水立方\"，捐款中最大的一笔是香港企业家霍英东先生捐赠的（　）。", "options": ["A. 1澳元", "B. 1亿美元", "C. 2亿港元", "D. 8.3亿元人民币"], "answer": "C", "explain": "最大一笔为霍英东先生捐赠的2亿港元；最小一笔仅1澳元；捐款总额超过8.3亿元人民币。", "source": "其中最大一笔为香港企业家霍英东先生捐赠的2亿港元，最小的一笔仅1澳元", "layer": "ext"}, {"section": "奥林匹克公园", "type": "judge", "q": "为原地完整保护北顶娘娘庙及其遗址，原规划位于庙北侧的国家游泳中心（水立方）专门修改设计，向南迁移约100米。", "answer": "错", "explain": "水立方是向北迁移约100米，而非向南迁移。", "source": "原规划位于庙北侧的国家游泳中心（水立方）专门修改设计，向北迁移约100米", "layer": "ext"}, {"section": "奥林匹克公园", "type": "single", "q": "2008年北京奥运会的特设项目是（　）。", "options": ["A. 武术", "B. 跆拳道", "C. 龙舟", "D. 围棋"], "answer": "A", "explain": "经国际奥委会批准，2008年奥运会期间举办\"北京2008奥运会武术比赛\"，武术是奥运百年历史上首个特设项目。", "source": "2008年北京奥运会的特设项目是武术", "layer": "ext"}, {"section": "奥林匹克公园", "type": "judge", "q": "北京2008年奥运会火炬接力以\"点燃激情 传递梦想\"为主题，以\"和谐之旅\"为口号。", "answer": "错", "explain": "火炬接力以\"和谐之旅\"为主题，以\"点燃激情 传递梦想\"为口号，题干将主题与口号颠倒。", "source": "北京2008年奥运会火炬接力以\"和谐之旅\"为主题，以\"点燃激情 传递梦想\"为口号", "layer": "ext"}, {"section": "奥林匹克公园", "type": "multi", "q": "下列关于2008年北京奥运会场馆及其赛时功能的说法，正确的有（　）。", "options": ["A. 国家体育场（鸟巢）承担开闭幕式、田径比赛和男子足球决赛", "B. 国家游泳中心（水立方）承担游泳、跳水、花样游泳比赛", "C. 国家会议中心赛时为主新闻中心（MPC）和国际广播中心（IBC）", "D. 国家网球中心的主球场被称为\"钻石球场\"", "E. 国家体育馆赛时承担游泳比赛"], "answer": "ABCD", "explain": "A、B、C、D均与原文一致；游泳比赛在水立方进行，国家体育馆承担竞技体操、蹦床、手球，故E错误。", "source": "国家体育场（鸟巢）——承担开闭幕式、田径比赛和男子足球决赛；国家游泳中心（水立方）——承担游泳、跳水、花样游泳比赛；国家会议中心——赛时为主新闻中心（MPC）和国际广播中心（IBC）", "layer": "ext"}, {"section": "奥林匹克公园", "type": "single", "q": "2008年北京奥运会奖牌采用\"金镶玉\"设计，其中金牌镶嵌的是（　）。", "options": ["A. 青白玉", "B. 青玉", "C. 白玉", "D. 碧玉"], "answer": "C", "explain": "金牌镶嵌白玉，银牌镶嵌青白玉，铜牌镶嵌青玉，玉料均采用青海昆仑玉。", "source": "金牌镶嵌白玉，银牌镶嵌青白玉，铜牌镶嵌青玉，玉料均采用青海昆仑玉", "layer": "ext"}, {"section": "奥林匹克公园", "type": "judge", "q": "2008年北京奥运会武术比赛作为特设项目，其产生的奖牌计入北京奥运会奖牌榜。", "answer": "错", "explain": "武术是奥运史上首个特设项目，参赛运动员入住奥运村、享受同等待遇，但产生的奖牌不计入北京奥运会奖牌榜。", "source": "参赛运动员与其他项目选手同样入住奥运村、享受同等待遇，但产生的奖牌不计入北京奥运会奖牌榜", "layer": "ext"}, {"section": "奥林匹克公园", "type": "single", "q": "北京获得2022年第24届冬奥会举办权的投票结果是，北京以（　）战胜阿拉木图。", "options": ["A. 45票对40票", "B. 44票对41票", "C. 44票对40票", "D. 43票对40票"], "answer": "C", "explain": "2015年7月31日在吉隆坡举行的国际奥委会第128次全会上，北京以44票对40票战胜哈萨克斯坦的阿拉木图。", "source": "投票中北京以44票对40票战胜另一申办城市哈萨克斯坦的阿拉木图", "layer": "ext"}, {"section": "奥林匹克公园", "type": "judge", "q": "2022年北京冬奥会的全部冰上项目由北京赛区承办。", "answer": "对", "explain": "与原文一致：北京赛区承办全部冰上项目（冰壶、冰球、滑冰3个大项5个分项32个小项），以及单板和自由式滑雪大跳台。", "source": "北京赛区承办全部冰上项目（冰壶、冰球、滑冰3个大项5个分项32个小项）", "layer": "ext"}, {"section": "奥林匹克公园", "type": "multi", "q": "下列关于北京2008年奥运会火炬接力的说法，正确的有（　）。", "options": ["A. 火炬名为\"祥云\"", "B. 境外传递途经五大洲的21个城市", "C. 境内传递覆盖31个省、自治区、直辖市的113个城市和地区", "D. 奥运史上圣火首次登上珠穆朗玛峰", "E. 传递历时120天"], "answer": "ABCD", "explain": "火炬名\"祥云\"，境外21个城市、境内113个城市和地区，2008年5月8日圣火首登珠峰；传递历时130天而非120天，故E错误。", "source": "火炬名为\"祥云\"……境外传递途经五大洲的21个城市……境内传递覆盖31个省、自治区、直辖市的113个城市和地区……传递历时130天", "layer": "ext"}, {"section": "奥林匹克公园", "type": "single", "q": "北京奥林匹克公园中部中心区的面积是（　）。", "options": ["A. 6.8平方公里", "B. 3.15平方公里", "C. 1.64平方公里", "D. 11.59平方公里"], "answer": "B", "explain": "中部为中心区，面积3.15平方公里，是奥运会场馆和设施的集聚区；6.8、1.64、11.59平方公里分别为北部、南部及全园总面积。", "source": "中部为中心区，面积3.15平方公里，是奥运会场馆和设施的集聚区", "layer": "ext"}, {"section": "奥林匹克公园", "type": "judge", "q": "2015年7月31日，在马来西亚吉隆坡举行的国际奥委会第128次全会上，国际奥委会主席巴赫宣布北京获得2022年第24届冬奥会举办权。", "answer": "对", "explain": "与原文一致：2015年7月31日在吉隆坡举行的国际奥委会第128次全会上，巴赫宣布北京获得2022年第24届冬奥会举办权。", "source": "2015年7月31日……在马来西亚吉隆坡举行的国际奥委会第128次全会上，国际奥委会主席巴赫宣布：北京获得2022年第24届冬季奥林匹克运动会举办权", "layer": "ext"}, {"section": "奥林匹克公园", "type": "single", "q": "我国最大的室内综合体育馆、被称为\"折扇\"的是（　）。", "options": ["A. 国家体育场", "B. 国家游泳中心", "C. 国家体育馆", "D. 国家速滑馆"], "answer": "C", "explain": "国家体育馆被称为\"折扇\"，是我国最大的室内综合体育馆，与鸟巢、水立方并称北京奥运会三大主场馆。", "source": "是我国最大的室内综合体育馆，被称为\"折扇\"，与鸟巢、水立方并称为北京奥运会三大主场馆", "layer": "ext"}, {"section": "奥林匹克公园", "type": "multi", "q": "北顶娘娘庙沿中轴线由南向北依次为（　）。", "options": ["A. 山门殿", "B. 天王殿", "C. 娘娘殿", "D. 东岳殿", "E. 崇圣殿"], "answer": "ABCD", "explain": "庙宇沿中轴线由南向北依次为山门殿、天王殿、娘娘殿、东岳殿、玉皇殿，共四进院落；无崇圣殿。", "source": "沿中轴线由南向北依次为山门殿、天王殿、娘娘殿、东岳殿、玉皇殿，共四进院落", "layer": "ext"}, {"section": "奥林匹克公园", "type": "single", "q": "2008年北京奥运会开幕式主题曲《我和你》由刘欢与英国歌手（　）共同演唱。", "options": ["A. 莎拉·布莱曼", "B. 席琳·迪翁", "C.  Adele（阿黛尔）", "D. 谭晶"], "answer": "A", "explain": "开幕式主题曲《我和你》（You and Me）由中国歌手刘欢与英国歌手莎拉·布莱曼共同演唱。", "source": "开幕式主题曲为《我和你》（You and Me），由中国歌手刘欢与英国歌手莎拉·布莱曼在开幕式上共同演唱", "layer": "ext"}, {"section": "奥林匹克公园", "type": "single", "q": "2008年北京奥运会开幕式运动员入场式上，首先入场的代表队是（　）。", "options": ["A. 中国", "B. 几内亚", "C. 希腊", "D. 美国"], "answer": "C", "explain": "入场式按代表团名称的简体中文笔画顺序排列，希腊作为古代奥运发源地按惯例首先入场，第二个是几内亚，东道主中国最后入场。", "source": "首先入场的代表队是希腊（古代奥运发源地，按惯例领先），第二个入场的是几内亚，东道主中国代表团最后入场", "layer": "ext"}, {"section": "奥林匹克公园", "type": "multi", "q": "下列关于北京2022年冬奥会、冬残奥会会徽与吉祥物的说法，正确的有（　）。", "options": ["A. 冬奥会会徽\"冬梦\"的设计灵感来自汉字\"冬\"", "B. 冬残奥会会徽\"飞跃\"的设计灵感来自汉字\"飞\"", "C. 冬奥会吉祥物\"冰墩墩\"头部外壳造型取自冰雪运动头盔", "D. 冬残奥会吉祥物\"雪容融\"以和平鸽和天坛构成连续图案", "E. 主题口号为\"同一个世界 同一个梦想\""], "answer": "ABCD", "explain": "A、B、C、D均与原文一致；2022年冬奥会主题口号是\"一起向未来\"，\"同一个世界 同一个梦想\"是2008年奥运会口号，故E错误。", "source": "主题口号为\"一起向未来\"（Together for a Shared Future），2021年9月17日发布", "layer": "ext"}, {"section": "奥林匹克公园", "type": "single", "q": "2008年北京奥运会开幕式上，点燃\"祥云\"造型主火炬的中国运动员是（　）。", "options": ["A. 许海峰", "B. 李宁", "C. 姚明", "D. 孙晋芳"], "answer": "B", "explain": "\"体操王子\"李宁以钢丝吊至高空，沿场馆顶端\"空中漫步\"绕场一周后点燃主火炬；孙晋芳是场内最后一棒交棒者。", "source": "点燃\"祥云\"造型主火炬的中国运动员是\"体操王子\"李宁", "layer": "ext"}, {"section": "奥林匹克公园", "type": "single", "q": "2008年北京奥林匹克水上公园（顺义奥林匹克水上公园）位于北京市（　）。", "options": ["A. 朝阳区", "B. 海淀区", "C. 顺义区", "D. 昌平区"], "answer": "C", "explain": "北京奥林匹克水上公园位于北京市顺义区北小营镇潮白河畔，是赛艇、皮划艇和马拉松游泳等项目的比赛场馆。", "source": "2008年北京奥林匹克水上公园（顺义奥林匹克水上公园）位于北京市顺义区（北小营镇潮白河畔，白马路19号）", "layer": "ext"}, {"section": "奥林匹克公园", "type": "single", "q": "2008年奥运会期间，国家游泳中心（水立方）承担的比赛项目是（　）。", "options": ["A. 竞技体操、蹦床、手球", "B. 游泳、跳水、花样游泳", "C. 赛艇、皮划艇、马拉松游泳", "D. 田径、足球决赛"], "answer": "B", "explain": "水立方承担游泳、跳水、花样游泳比赛；竞技体操等在国家体育馆，赛艇等在顺义水上公园。", "source": "国家游泳中心（水立方）——承担游泳、跳水、花样游泳比赛", "layer": "ext"}, {"section": "奥林匹克公园", "type": "single", "q": "2008年北京奥运会\"金镶玉\"奖牌中，银牌镶嵌的是（　）。", "options": ["A. 白玉", "B. 青白玉", "C. 青玉", "D. 碧玉"], "answer": "B", "explain": "金牌镶嵌白玉，银牌镶嵌青白玉，铜牌镶嵌青玉，玉料均采用青海昆仑玉。", "source": "金牌镶嵌白玉，银牌镶嵌青白玉，铜牌镶嵌青玉，玉料均采用青海昆仑玉", "layer": "ext"}, {"section": "奥林匹克公园", "type": "single", "q": "北京2022年冬奥会吉祥物\"冰墩墩\"的设计原型是（　）。", "options": ["A. 中国灯笼", "B. 熊猫", "C. 燕子", "D. 航天员"], "answer": "B", "explain": "冰墩墩以中国国宝熊猫为原型，将熊猫形象与冰晶外壳相结合；冬残奥会吉祥物雪容融以中国灯笼为原型。", "source": "北京2022年冬奥会吉祥物为\"冰墩墩\"——以中国国宝熊猫为原型进行设计创作", "layer": "ext"}, {"section": "奥林匹克公园", "type": "single", "q": "2022年北京冬奥会延庆赛区主要承办的比赛项目是（　）。", "options": ["A. 冰壶、冰球、滑冰", "B. 高山滑雪、雪车、雪橇", "C. 越野滑雪、跳台滑雪", "D. 单板滑雪、自由式滑雪大跳台"], "answer": "B", "explain": "延庆赛区主要承办高山滑雪、雪车、雪橇（3个大项4个分项）的比赛，共产生21枚金牌；冰壶、冰球、滑冰在北京赛区。", "source": "延庆赛区主要承办高山滑雪、雪车、雪橇（3个大项，含高山滑雪、雪车、钢架雪车、雪橇4个分项）的比赛", "layer": "ext"}, {"section": "奥林匹克公园", "type": "single", "q": "2022年北京冬奥会上，中国体育代表团获得的奖牌总数及金牌榜排名是（　）。", "options": ["A. 9枚奖牌，金牌榜第1位", "B. 15枚奖牌，金牌榜第3位", "C. 15枚奖牌，金牌榜第2位", "D. 61枚奖牌，金牌榜第1位"], "answer": "B", "explain": "中国获9金4银2铜共15枚奖牌，位列金牌榜第3位；61枚奖牌是北京冬残奥会的成绩。", "source": "中国体育代表团共获得9枚金牌、4枚银牌、2枚铜牌，共计15枚奖牌，位列金牌榜第3位", "layer": "ext"}, {"section": "孔庙、国子监", "layer": "core", "type": "single", "q": "孔子封号\"大成至圣文宣王\"是何时由谁加封的？", "options": ["A.元大德十一年（1307年）元武宗海山", "B.唐开元二十七年（739年）唐玄宗", "C.清顺治十四年（1657年）清世祖", "D.明嘉靖九年（1530年）明世宗"], "answer": "A", "explain": "\"大成至圣文宣王\"为元大德十一年（1307年）元武宗海山加封的最高封号。\"大成\"＝集古圣先贤之大成（《孟子》）；\"至圣\"＝至高无上的圣人；\"文宣\"沿唐开元二十七年（739年）\"文宣王\"谥号，故B项为干扰。", "source": "\"大成至圣文宣王\"为元大德十一年（1307年）元武宗海山加封的最高封号；\"文宣\"沿唐开元二十七年（739年）\"文宣王\"谥号"}, {"section": "孔庙、国子监", "layer": "core", "type": "judge", "q": "祭祀孔子的礼仪在古代\"五礼\"中属吉礼，吉礼为五礼之首。", "answer": "对", "explain": "古代五礼为吉、凶、军、宾、嘉，祭孔属吉礼，且吉礼居五礼之首。", "source": "属吉礼（五礼之首：吉、凶、军、宾、嘉）"}, {"section": "孔庙、国子监", "layer": "core", "type": "multi", "q": "明清时期北京孔庙祭孔的\"三献礼\"及相关环节包括下列哪些？", "options": ["A.献帛", "B.献爵", "C.读祝文", "D.望燎", "E.拜四方"], "answer": "ABCD", "explain": "三献礼为献帛、献爵、读祝文，另有饮福受胙、望燎环节。1906年升大祀后用八佾舞（64人），此前用六佾舞（36人）。", "source": "三献礼（献帛献爵读祝文）＋饮福受胙＋望燎；1906年升大祀后用八佾舞（64人），此前六佾舞（36人）"}, {"section": "孔庙、国子监", "layer": "core", "type": "single", "q": "向汉武帝建议建立太学的官员是？", "options": ["A.董仲舒", "B.蒋衡", "C.许衡", "D.刘墉"], "answer": "A", "explain": "董仲舒建议汉武帝建立太学，元朔五年（公元前124年）设太学。蒋衡为十三经抄写者，许衡为元代首任祭酒（辨奸柏种植者），刘墉为辟雍设计者。", "source": "董仲舒（元朔五年公元前124年设太学）"}, {"section": "孔庙、国子监", "layer": "core", "type": "judge", "q": "清代每年于仲春、仲秋（农历二月、八月）上丁日举行祭孔典礼，史称\"丁祭\"；民国年间在北京孔庙最后一次祭孔是在1948年。", "answer": "对", "explain": "丁祭时间与民国最后一次祭孔年份均正确。注意1914年袁世凯祭孔为民国首次，勿与最后一次相混。另：清代钦定北京孔庙为\"先师庙\"的是清世祖顺治（顺治十四年1657年改称\"至圣先师\"）。", "source": "祭孔时间：仲春、仲秋（农历二月、八月）上丁日，史称\"丁祭\"；民国最后一次祭孔：1948年（勿混：1914年袁世凯祭孔为民国首次）"}, {"section": "孔庙、国子监", "layer": "core", "type": "single", "q": "元明清时期，国子监最高长官的称谓是？", "options": ["A.祭酒", "B.司业", "C.山长", "D.博士"], "answer": "A", "explain": "国子监最高长官为祭酒，其副职为司业，切勿主次颠倒。", "source": "国子监最高长官：祭酒（副职司业）"}, {"section": "孔庙、国子监", "layer": "core", "type": "judge", "q": "明清时期北京孔庙祭孔时，鸣钟360响、击鼓108通。", "answer": "错", "explain": "应为鸣钟108响、击鼓360通，题干将两者数字对调。", "source": "鸣钟108响、击鼓360通"}, {"section": "孔庙、国子监", "layer": "core", "type": "multi", "q": "著名古建学家梁思成所称的北京\"六大宫殿\"包括下列哪些？", "options": ["A.故宫太和殿", "B.天坛祈年殿", "C.颐和园仁寿殿", "D.国子监辟雍殿", "E.故宫乾清宫"], "answer": "ABCD", "explain": "六大宫殿为：故宫太和殿、中和殿、保和殿＋天坛祈年殿＋颐和园仁寿殿＋国子监辟雍殿。乾清宫不在其列。", "source": "六大宫殿：故宫太和殿、中和殿、保和殿＋天坛祈年殿＋颐和园仁寿殿＋国子监辟雍殿"}, {"section": "孔庙、国子监", "layer": "core", "type": "single", "q": "明清时期北京孔庙祭孔六大仪程的正确顺序是？", "options": ["A.迎神→初献→亚献→终献→撤馔→送神", "B.迎神→亚献→初献→终献→撤馔→送神", "C.迎神→初献→终献→亚献→送神→撤馔", "D.送神→迎神→初献→亚献→终献→撤馔"], "answer": "A", "explain": "六大仪程为迎神→初献→亚献→终献→撤馔→送神。祭前宰牲备太牢、斋戒习仪；凌晨三时主祭、陪祀官、分献官、司礼人员入场；行三献礼（献帛献爵读祝文）＋饮福受胙＋望燎，礼成分胙。", "source": "六大仪程：迎神→初献→亚献→终献→撤馔→送神；祭前宰牲备太牢、斋戒习仪；凌晨三时入场"}, {"section": "孔庙、国子监", "layer": "core", "type": "judge", "q": "中国古代科举制度始于隋炀帝大业元年（605年）设进士科，止于清光绪三十一年（1905年），历时约1300年。", "answer": "对", "explain": "起止年份与时长均正确：605年设进士科为始，1905年废止，历时约1300年。", "source": "始于隋炀帝大业元年（605年）设进士科，止于清光绪三十一年（1905年），历时约1300年"}, {"section": "孔庙、国子监", "layer": "core", "type": "single", "q": "清廷废除科举制度后，管理国子监各项职能的机构是？", "options": ["A.学部", "B.礼部", "C.国子监", "D.翰林院"], "answer": "A", "explain": "1905年废除科举后，国子监各项职能归\"学部\"管理。", "source": "废除后职能归\"学部\""}, {"section": "孔庙、国子监", "layer": "core", "type": "judge", "q": "北京孔庙和国子监于1988年同批被国务院列入全国重点文物保护单位。", "answer": "错", "explain": "两处分批列入：国子监为1961年3月4日第一批国保，北京孔庙为1988年1月13日第三批国保，切勿均记为1988年。", "source": "国子监1961年3月4日第一批国保、北京孔庙1988年1月13日第三批国保（勿混：两处分批，勿均记1988年）"}, {"section": "孔庙、国子监", "layer": "core", "type": "multi", "q": "国子监街下马碑上刻有下列哪些文字？", "options": ["A.满文", "B.汉文", "C.蒙古文", "D.藏文", "E.英文"], "answer": "ABCD", "explain": "下马碑以六种文字镌刻：满、汉、蒙、回（察合台文）、藏、托忒（托忒蒙古文），无英文。", "source": "六种文字：满、汉、蒙、回（察合台文）、藏、托忒（托忒蒙古文）"}, {"section": "孔庙、国子监", "layer": "core", "type": "single", "q": "清代最后一届科举考试的状元是？", "options": ["A.刘春霖", "B.林则徐", "C.于谦", "D.蒋衡"], "answer": "A", "explain": "末科状元为刘春霖，系光绪三十年甲辰科（1904年）状元，被称为\"第一人中最后人\"。林则徐、于谦是进士题名碑所载名人，蒋衡是十三经抄写者。", "source": "末科状元：刘春霖（光绪三十年甲辰科1904年，\"第一人中最后人\"）"}, {"section": "孔庙、国子监", "layer": "core", "type": "judge", "q": "国子监街（成贤街）全长约669米，共有4座过街牌楼，是北京市至今唯一保留过街牌楼的街道。", "answer": "对", "explain": "4座牌楼中东西口题\"成贤街\"、国子监左右题\"国子监\"。国子监街于2009年6月10日揭晓的首届（第一届）\"中国历史文化名街\"评选中荣获殊荣。", "source": "国子监街（成贤街，全长约669米，4座过街牌楼：东西口题\"成贤街\"、国子监左右题\"国子监\"）；首届\"中国历史文化名街\"，2009年6月10日揭晓"}, {"section": "孔庙、国子监", "layer": "core", "type": "single", "q": "\"左庙右学\"规制在国子监街上的体现是？", "options": ["A.孔庙在东（左）、国子监在西（右），中有持敬门相通", "B.孔庙在西（右）、国子监在东（左），中有持敬门相通", "C.孔庙在南、国子监在北，中有集贤门相通", "D.孔庙与国子监东西相对，中有退省门相通"], "answer": "A", "explain": "左庙右学：孔庙在东（左）、国子监在西（右），持敬门相通。另：北京三大皇家庙宇为太庙、孔庙、历代帝王庙。", "source": "三大皇家庙宇：太庙、孔庙、历代帝王庙；左庙右学：孔庙在东（左）、国子监在西（右），持敬门相通"}, {"section": "孔庙、国子监", "layer": "core", "type": "judge", "q": "明嘉靖九年（1530年），清政府将北京孔庙大成殿、大成门改铺黄琉璃瓦。", "answer": "错", "explain": "改铺黄琉璃瓦是在清乾隆二年（1737年）。明嘉靖九年（1530年）发生的是增建崇圣祠（原名启圣祠）和将大成殿孔子神像改为神牌。", "source": "改铺黄琉璃瓦：清乾隆二年（1737年）（大成殿、大成门改黄瓦）"}, {"section": "孔庙、国子监", "layer": "core", "type": "multi", "q": "关于北京孔庙御碑亭，下列说法正确的有？", "options": ["A.第一进院落有3座", "B.第二进院落有11座", "C.两进院落合计14座", "D.全部为清代黄琉璃瓦"], "answer": "ABC", "explain": "第一进院落（先师门与大成门间）3座，东一西二；第二进院落（大成门与大成殿间）11座，东六西五；合计14座，其中13座为清代黄瓦、1座为明代绿瓦，故D错误。", "source": "第一进院落3座（东一西二）；第二进院落11座（东六西五）；合计14座（13座清代黄瓦＋1座明代绿瓦）"}, {"section": "孔庙、国子监", "layer": "core", "type": "single", "q": "国子监街下马碑的位置在？", "options": ["A.国子监街中段、孔庙大门（先师门）外东西两侧路北", "B.国子监集贤门外东西两侧", "C.孔庙大成门外东西两侧", "D.国子监街东西两端路口"], "answer": "A", "explain": "下马碑位于国子监街中段、孔庙大门（先师门）外东西两侧路北，共两座，清代立；碑文为\"官员人等至此下马\"。", "source": "位置：国子监街中段、孔庙大门（先师门）外东西两侧路北，共两座（清代立）；碑文\"官员人等至此下马\""}, {"section": "孔庙、国子监", "layer": "core", "type": "judge", "q": "北京孔庙大成殿的屋顶为重檐庑殿顶，覆黄琉璃瓦，九五开间。", "answer": "对", "explain": "大成殿屋顶式样为重檐庑殿顶，黄琉璃瓦，九五开间，规格极高。", "source": "大成殿屋顶：重檐庑殿顶（黄琉璃瓦，九五开间）"}, {"section": "孔庙、国子监", "layer": "core", "type": "single", "q": "北京孔庙始建的时间是？", "options": ["A.元成宗大德六年（1302年）", "B.元至元二十四年（1287年）", "C.元皇庆二年（1313年）", "D.明嘉靖九年（1530年）"], "answer": "A", "explain": "北京孔庙始建于元成宗大德六年（1302年），大德十年（1306年）建成；1906年扩建至1916年（民国五年）竣工；为全国第二大孔庙。1287年是国子监始建年，1313年是崇文阁（今彝伦堂）建年。", "source": "始建于元成宗大德六年（1302年），大德十年（1306年）建成；1906年扩建至1916年（民国五年）竣工；全国第二大孔庙"}, {"section": "孔庙、国子监", "layer": "core", "type": "judge", "q": "孔庙十三经刻石为乾隆五十六年（1791年）谕旨以蒋衡手书为底本，乾隆五十九年（1794年）刻成，称\"乾隆石经\"。", "answer": "对", "explain": "按口径裁定：乾隆五十六年（1791年）谕旨以蒋衡手书为底本刊刻，乾隆五十九年（1794年）刻成，世称\"乾隆石经\"。", "source": "乾隆五十六年（1791年）刻石，称\"乾隆石经\""}, {"section": "孔庙、国子监", "layer": "core", "type": "multi", "q": "儒家经典《四书》包括下列哪些？", "options": ["A.《大学》", "B.《中庸》", "C.《论语》", "D.《孟子》", "E.《诗经》"], "answer": "ABCD", "explain": "《四书》为《大学》《中庸》《论语》《孟子》，《诗经》属\"五经\"系统，不在《四书》之列。", "source": "《四书》：《大学》《中庸》《论语》《孟子》"}, {"section": "孔庙、国子监", "layer": "core", "type": "single", "q": "北京孔庙中轴线上的主要建筑（自南向北）依次是？", "options": ["A.先师门→大成门→大成殿→崇圣门→崇圣祠", "B.大成门→先师门→大成殿→崇圣门→崇圣祠", "C.先师门→大成殿→大成门→崇圣祠→崇圣门", "D.先师门→大成门→崇圣门→大成殿→崇圣祠"], "answer": "A", "explain": "中轴线五座主要建筑自南向北依次为：先师门→大成门→大成殿→崇圣门→崇圣祠。", "source": "中轴线主要建筑（南→北）：先师门→大成门→大成殿→崇圣门→崇圣祠（五座）"}, {"section": "孔庙、国子监", "layer": "core", "type": "judge", "q": "孔庙\"辨奸柏\"相传为元代权臣魏忠贤所植。", "answer": "错", "explain": "辨奸柏为元代首任祭酒许衡所植，树龄近700年。其得名相传因严嵩代帝祭孔时被柏枝掀落乌纱帽（另有魏忠贤说），魏忠贤只是辨奸传说中的对象，并非种植者。", "source": "由来：相传严嵩代帝祭孔被柏枝掀落乌纱帽（另有魏忠贤说）；种植者：元代首任祭酒许衡（树龄近700年）"}, {"section": "孔庙、国子监", "layer": "core", "type": "single", "q": "明朝嘉靖年间，在北京孔庙中增建的建筑是？", "options": ["A.崇圣祠", "B.辟雍", "C.彝伦堂", "D.琉璃牌楼"], "answer": "A", "explain": "嘉靖九年（1530年）增建崇圣祠（原名启圣祠，清雍正元年1723年改名），同年将大成殿中孔子神像改为神牌。辟雍与琉璃牌楼均为清乾隆年间建筑。", "source": "增建：崇圣祠（原名启圣祠，嘉靖九年1530年建，清雍正元年1723年改名）；神像改神牌：明嘉靖九年（1530年）"}, {"section": "孔庙、国子监", "layer": "core", "type": "judge", "q": "大成殿院中的砚水湖由清康熙帝赐名。", "answer": "错", "explain": "赐名者为清乾隆帝，取\"以井为砚、以水为墨\"之意。该湖为明代开凿，原名\"满井\"，寓意饮之文思泉涌、研墨落笔如神，沾圣人文气科场得意。", "source": "明代开凿（原名\"满井\"）；寓意：饮之文思泉涌、研墨落笔如神；赐名：清乾隆帝（\"以井为砚、以水为墨\"）"}, {"section": "孔庙、国子监", "layer": "core", "type": "multi", "q": "下列匾额中，悬挂于北京孔庙大成殿内的有？", "options": ["A.雍正帝\"生民未有\"", "B.乾隆帝\"与天地参\"", "C.光绪帝\"斯文在兹\"", "D.康熙帝\"万世师表\""], "answer": "ABC", "explain": "殿内悬九帝匾（雍正\"生民未有\"、乾隆\"与天地参\"、嘉庆\"圣集大成\"、道光\"圣协时中\"、咸丰\"德齐帱载\"、同治\"圣神天纵\"、光绪\"斯文在兹\"、宣统\"中和位育\"等），正中为黎元洪\"道洽大同\"。康熙帝\"万世师表\"（1684年）悬挂于大成殿外，故D不选。", "source": "\"万世师表\"：清康熙帝（1684年）；殿内九帝匾＋黎元洪\"道洽大同\"（雍正\"生民未有\"、乾隆\"与天地参\"……光绪\"斯文在兹\"、宣统\"中和位育\"）；正中\"道洽大同\"：黎元洪"}, {"section": "孔庙、国子监", "layer": "core", "type": "single", "q": "孔庙中保留有元代建筑风格的建筑是？", "options": ["A.先师门", "B.大成殿", "C.崇圣祠", "D.琉璃牌楼"], "answer": "A", "explain": "先师门斗拱硕大稀疏，保留元代建筑风格，大成门亦存元代特征；大成门下放置元明清三代进士题名碑。", "source": "元代风格建筑：先师门（斗拱硕大稀疏；大成门亦存元代特征）；大成门下碑刻：元明清三代进士题名碑"}, {"section": "孔庙、国子监", "layer": "core", "type": "judge", "q": "国子监始建于元至元二十四年（1287年），大德十年（1306年）建成。", "answer": "对", "explain": "始建与建成年份均正确。注意与北京孔庙始建年（元成宗大德六年1302年）区分。", "source": "始建于元至元二十四年（1287年），大德十年（1306年）建成"}, {"section": "孔庙、国子监", "layer": "core", "type": "single", "q": "原藏于孔庙的战国石鼓，现在的收藏地点是？", "options": ["A.故宫博物院", "B.北京孔庙", "C.国子监", "D.太庙"], "answer": "A", "explain": "战国石鼓现藏故宫博物院，孔庙现存者为乾隆仿制品，切勿混淆。", "source": "战国石鼓现藏：故宫博物院（孔庙现存为乾隆仿制品）"}, {"section": "孔庙、国子监", "layer": "core", "type": "judge", "q": "国子监辟雍于清乾隆四十八年（1783年）兴工，当年即竣工。", "answer": "错", "explain": "辟雍乾隆四十八年（1783年）兴工，乾隆四十九年（1784年）竣工，并非当年建成。设计者为刘墉、和珅。", "source": "辟雍：清乾隆四十八年（1783年）兴工、四十九年（1784年）竣工；设计者：刘墉、和珅"}, {"section": "孔庙、国子监", "layer": "core", "type": "multi", "q": "北京孔庙大成殿内两侧供奉的\"四配\"是？", "options": ["A.复圣颜回", "B.宗圣曾参", "C.述圣孔伋", "D.亚圣孟轲", "E.至圣孔子"], "answer": "ABCD", "explain": "四配为复圣颜回、宗圣曾参、述圣孔伋、亚圣孟轲，另有十二哲。孔子为大成殿主祀，不在\"四配\"之列。", "source": "四配：复圣颜回、宗圣曾参、述圣孔伋、亚圣孟轲（另有十二哲）"}, {"section": "孔庙、国子监", "layer": "core", "type": "single", "q": "孔庙现存元明清进士题名碑的数量及构成是？", "options": ["A.198通（元3、明77、清118）", "B.190通（元3、明77、清110）", "C.201通（元13、明70、清118）", "D.189通（元3、明68、清118）"], "answer": "A", "explain": "现存198通（元3、明77、清118），记载姓名、籍贯与名次，共201科、51624名进士（含于谦、林则徐等名人）。\"进士题名\"始于唐代\"雁塔题名\"，元代起刻碑定制。", "source": "始于唐代\"雁塔题名\"；元代起刻碑定制；现存198通（元3、明77、清118）；共201科、51624名进士（含于谦、林则徐等名人）"}, {"section": "孔庙、国子监", "layer": "core", "type": "judge", "q": "明嘉靖二年（1523年），朝廷诏令撤去北京孔庙大成殿内的孔子塑像，改用木主神牌，天下文庙一体遵行。", "answer": "错", "explain": "时间错误。撤塑像、改木主神牌是在明嘉靖九年（1530年），由明世宗采纳大学士张璁之议更定祀典后推行，并非嘉靖二年。", "source": "神像改为神牌的时间：明嘉靖九年（1530年）。明世宗采纳大学士张璁议更定祀典，以“夫子生不得位，没而以南面之礼尊之”不妥，诏令撤去大成殿内孔子塑像，改用木主神牌。", "patch": true}, {"section": "孔庙、国子监", "layer": "core", "type": "single", "q": "孔庙十三经刻石的抄写者是？", "options": ["A.蒋衡", "B.许衡", "C.董仲舒", "D.刘春霖"], "answer": "A", "explain": "抄写者为江苏金坛贡生蒋衡，以楷书抄写，自雍正四年（1726年）至乾隆二年（1737年）历时12年，全文约63万字。十三经为儒家学派经典，刻石189座（加谕旨碑共190通）。", "source": "儒家学派经典；刻石189座（加谕旨碑共190通）；抄写者：江苏金坛贡生蒋衡（楷书，雍正四年1726年至乾隆二年1737年，历时12年）；全文约63万字"}, {"section": "孔庙、国子监", "layer": "core", "type": "judge", "q": "北京孔庙大成门下放置的元、明、清三代进士题名碑共198通，分列于大成门前第一进院落御路两侧。", "answer": "对", "explain": "大成门下放置元、明、清三代进士题名碑共198通，分列于大成门前第一进院落御路两侧，此说法与资料一致。", "source": "大成门下放置的碑刻：元、明、清三代进士题名碑（共198通，分列于大成门前第一进院落御路两侧）。", "patch": true}, {"section": "孔庙、国子监", "layer": "core", "type": "multi", "q": "关于国子监辟雍，下列说法正确的有？", "options": ["A.乾隆四十八年兴工、四十九年竣工", "B.设计者为刘墉、和珅", "C.外圆内方，象征天圆地方", "D.专供皇帝\"临雍讲学\"", "E.是明代嘉靖年间增建的建筑"], "answer": "ABCD", "explain": "辟雍为清乾隆四十八年（1783年）兴工、四十九年（1784年）竣工，刘墉、和珅设计（和珅撤四柱改抹角架梁），非明代建筑。名称源于周代\"天子曰辟雍\"，\"辟\"通璧（环水如璧）、\"雍\"为水中陆地；专供皇帝\"临雍讲学\"，1785年首次讲学，圜桥观听3088人；为中国现存唯一辟雍实例。", "source": "辟雍：清乾隆四十八年（1783年）兴工、四十九年（1784年）竣工；设计者：刘墉、和珅；外圆内方、象征天圆地方；专供皇帝\"临雍讲学\"；中国现存唯一辟雍实例"}, {"section": "孔庙、国子监", "layer": "core", "type": "single", "q": "北京孔庙崇圣祠的用途是？", "options": ["A.祭祀孔子父母及五代先祖的家庙", "B.祭祀孔子本人的正殿", "C.存放进士题名碑的碑廊", "D.皇帝祭孔前斋戒之所"], "answer": "A", "explain": "崇圣祠是祭祀孔子父母及五代先祖的家庙，今为《大成礼乐》展演场所。大成殿内的礼器、祭器、乐器主要为清代（乾隆、光绪年间）制作。", "source": "礼乐器主要为清代制作（乾隆、光绪年间）；崇圣祠用途：祭祀孔子父母及五代先祖的家庙（今《大成礼乐》展演）"}, {"section": "孔庙、国子监", "layer": "core", "type": "judge", "q": "孔庙“十三经”是儒家学派的经典著作，是儒家学说的基础，也是历代科举取士的标准文本。", "answer": "对", "explain": "十三经是儒家学派的经典著作，是儒家学说的基础，自汉代以降逐步确立为官学核心典籍，也是历代科举取士的标准文本。", "source": "学派：十三经是儒家学派的经典著作，是儒家学说的基础，自汉代以降逐步确立为官学核心典籍，也是历代科举取士的标准文本。", "patch": true}, {"section": "孔庙、国子监", "layer": "core", "type": "single", "q": "国子监在明代的别称是？", "options": ["A.北监", "B.南雍", "C.成均", "D.东序"], "answer": "A", "explain": "国子监在古代别称太学、国学、国庠，明代又称\"北监\"。", "source": "别称：太学、国学、国庠，明代又称\"北监\""}, {"section": "孔庙、国子监", "layer": "core", "type": "judge", "q": "孔庙十三经刻石由江苏金坛贡生蒋衡以隶书手书，全文约63万字，是我国现存规模最大、保存最完整的官刻儒家石经。", "answer": "错", "explain": "书体错误。蒋衡是以楷书手书十三经（自雍正四年至乾隆二年，历时12年），碑文亦为楷书、两面刻字，并非隶书；其余表述正确。", "source": "抄写者与总字数：由江苏金坛贡生蒋衡（号湘帆）以楷书手书，自雍正四年（1726年）至乾隆二年（1737年），历时12年完成；全文约63万字……是我国现存规模最大、保存最完整的官刻儒家石经。", "patch": true}, {"section": "孔庙、国子监", "layer": "core", "type": "multi", "q": "关于清朝时国子监生员的分类及待遇，下列说法正确的有？", "options": ["A.贡生分岁、恩、拔、副、优、例六类", "B.监生分恩、荫、优、例四类", "C.生员供膳食住宿、发膏火银", "D.免徭役，积满年限授官", "E.所有生员均须在六堂连续学习满六年方可授官"], "answer": "ABCD", "explain": "生员分贡生（岁、恩、拔、副、优、例）与监生（恩、荫、优、例），再分内班、外班；待遇为供膳食住宿、发膏火银、免徭役、积满年限授官。另：元朝国子监内蒙、汉子弟互学语言文字与骑射，原因是打破语言隔阂、培养兼通蒙汉人才以巩固统治。", "source": "生员分类：贡生（岁、恩、拔、副、优、例）＋监生（恩、荫、优、例），再分内班、外班；待遇：供膳食住宿、发膏火银、免徭役、积满年限授官"}, {"section": "孔庙、国子监", "layer": "core", "type": "single", "q": "国子监正门的名称是？", "options": ["A.集贤门", "B.持敬门", "C.退省门", "D.先师门"], "answer": "A", "explain": "国子监正门为集贤门；先师门是北京孔庙大门；持敬门、退省门为院内东西便门。另：清雍正年间国子监增设南学，地点在国子监以南（今方家胡同）142间官房。", "source": "正门：集贤门；南学：国子监以南（今方家胡同）142间官房"}, {"section": "孔庙、国子监", "layer": "core", "type": "judge", "q": "北京孔庙现存的198通进士题名碑中，以明代碑数量最多，清代次之。", "answer": "错", "explain": "各朝数量错误。198通中元代3通、明代77通、清代118通，清代碑数量最多，明代次之；元代碑最少，因明代曾磨去元代碑文改刻本朝进士姓名。", "source": "数量：北京孔庙现存进士题名碑198通，其中元代3通、明代77通、清代118通……元代碑少，因明代曾磨去元代碑文改刻本朝进士姓名。", "patch": true}, {"section": "孔庙、国子监", "layer": "core", "type": "single", "q": "国子监琉璃牌楼南面额题的文字是？", "options": ["A.圜桥教泽", "B.学海节观", "C.万世师表", "D.道洽大同"], "answer": "A", "explain": "南面额题\"圜桥教泽\"、北面额题\"学海节观\"，均为乾隆帝御笔，注意南北勿混。国子监琉璃牌楼是北京唯一一座专为教育设立的牌楼，建于乾隆四十八年（1783年），三间四柱七楼、黄琉璃瓦。", "source": "国子监琉璃牌楼（乾隆四十八年1783年建，三间四柱七楼、黄琉璃瓦）；南面额题\"圜桥教泽\"、北面额题\"学海节观\"，均乾隆帝御笔"}, {"section": "孔庙、国子监", "layer": "core", "type": "judge", "q": "相传进京科考的举子饮用大成殿院中砚水湖的井水，便能强身健体、祛病延年，故该井被视为孔庙“崇文尚学”意象的代表。", "answer": "错", "explain": "寓意错误。相传举子拜谒孔子后饮井中“圣水”能文思泉涌、笔下生花，以井水研墨则浓墨喷香、落笔如神，寓意沾染圣人文气、科场得意，并非强身健体、祛病延年。", "source": "寓意：相传进京科考的举子在孔庙拜谒孔子后，饮井中“圣水”便能文思泉涌、笔下生花；以井水研墨则浓墨喷香、落笔如神，寓意沾染圣人文气、科场得意。", "patch": true}, {"section": "孔庙、国子监", "layer": "core", "type": "multi", "q": "北京孔庙大成门附近放置（立有）的碑刻包括（ ）。", "options": ["A. 元、明、清三代进士题名碑", "B. 元大德十一年孔子加号“大成至圣文宣王”碑", "C. 四配加号碑", "D. 清乾隆御制《集石鼓所有文成十章制鼓重刻序》碑", "E. 《明英宗建太学碑》"], "answer": "ABCD", "explain": "大成门下放置元、明、清三代进士题名碑（共198通，分列于第一进院落御路两侧）；大成门前东侧立孔子加号“大成至圣文宣王”碑，西侧立四配加号碑；大成门内石鼓旁东侧立乾隆御制重刻石鼓序碑，西侧立张照草书韩愈《石鼓歌》碑。《明英宗建太学碑》为第一进院落御碑亭中的明代碑，不在大成门下。", "source": "大成门下放置的碑刻：元、明、清三代进士题名碑；另大成门前东侧立孔子加号“大成至圣文宣王”碑，西侧立四配加号碑；大成门内石鼓旁东侧立乾隆御制《集石鼓所有文成十章制鼓重刻序》碑。", "patch": true}, {"section": "孔庙、国子监", "layer": "core", "type": "single", "q": "国子监彝伦堂在元代的作用是？", "options": ["A.藏书楼（崇文阁）", "B.皇帝临雍讲学之所", "C.监生宿舍", "D.祭孔家庙"], "answer": "A", "explain": "彝伦堂在元代为\"崇文阁\"（元皇庆二年1313年建），是藏书楼；辟雍建成前曾为皇帝讲学设座之所；\"彝伦堂\"匾为清康熙帝御笔。", "source": "元代为\"崇文阁\"（元皇庆二年1313年建），是藏书楼；辟雍建成前为皇帝讲学设座之所；\"彝伦堂\"匾：清康熙帝御笔"}, {"section": "孔庙、国子监", "layer": "core", "type": "judge", "q": "大成殿内陈设的礼器、祭器、乐器主要为清代制作（以清乾隆年间制品为主），是研究清代祭孔礼乐制度的重要实物。", "answer": "对", "explain": "殿内礼器、祭器、乐器主要为清代制作，以清乾隆年间制品为主，系乾隆、光绪年间按祭孔礼制配置，是研究清代祭孔礼乐制度的重要实物。", "source": "礼器、祭器、乐器的制作年代：主要为清代制作（以清乾隆年间制品为主）……系清乾隆、光绪年间按祭孔礼制配置，是研究清代祭孔礼乐制度的重要实物。", "patch": true}, {"section": "孔庙、国子监", "layer": "core", "type": "single", "q": "国子监学生第一年在六堂上课学习的地点不包括下列哪一堂？", "options": ["A.率性堂", "B.正义堂", "C.崇志堂", "D.广业堂"], "answer": "A", "explain": "第一年在正义堂、崇志堂、广业堂学习（一年半）。六堂为东：崇志、诚心、率性；西：广业、正义、修道，率性堂不在第一年学习地点之列。", "source": "第一年在正义堂、崇志堂、广业堂学习（一年半）；六堂（东：崇志、诚心、率性；西：广业、正义、修道）"}, {"section": "孔庙、国子监", "layer": "core", "type": "judge", "q": "清雍正年间，朝廷将国子监以北（今方家胡同）的142间官房拨予国子监作学舍，称“南学”。", "answer": "错", "explain": "方位错误。南学位于国子监以南（今方家胡同）的142间官房，因在南面故称“南学”，并非国子监以北。", "source": "清雍正年间增设南学的地点：国子监以南（今方家胡同）的142间官房。雍正帝将国子监南面142间官房拨予国子监作学舍，称“南学”，供监生肄业居住。", "patch": true}, {"section": "孔庙、国子监", "layer": "core", "type": "multi", "q": "北京孔庙元、明、清进士题名碑按甲第（名次）先后镌刻的内容包括（ ）。", "options": ["A. 各科进士的姓名", "B. 各科进士的籍贯", "C. 各科进士的名次", "D. 各科进士的生辰八字"], "answer": "ABC", "explain": "进士题名碑按甲第（名次）先后，镌刻各科进士的姓名、籍贯（次第）与名次，共记载三代201科、51624名进士（含状元、榜眼、探花），不载生辰八字。", "source": "记载内容：按甲第（名次）先后，镌刻各科进士的姓名、籍贯（次第）与名次，共记载元、明、清三代201科、51624名进士（含状元、榜眼、探花）。", "patch": true}, {"section": "孔庙、国子监", "layer": "core", "type": "single", "q": "国子监第一进院落西侧便门的名称是？", "options": ["A.退省门", "B.持敬门", "C.集贤门", "D.崇圣门"], "answer": "A", "explain": "西侧便门为\"退省门\"，供监生入堂学习及监内人员出入；东侧为\"持敬门\"，通孔庙，供监生拜谒孔子。勿混：西退省、东持敬。", "source": "西侧便门：\"退省门\"（监生入堂学习及监内人员出入）；东侧为\"持敬门\"（通孔庙，供监生拜谒孔子）（勿混：西退省、东持敬）"}, {"section": "孔庙、国子监", "layer": "core", "type": "judge", "q": "国子监琉璃牌楼是北京唯一一座专为教育而设立的琉璃牌坊，也是北京现存唯一一座不属于寺庙的琉璃牌坊。", "answer": "对", "explain": "国子监琉璃牌楼位于太学门内、辟雍以南，建于清乾隆四十八年（1783年），是北京唯一一座专为教育而设立的琉璃牌坊，也是北京现存唯一一座不属于寺庙的琉璃牌坊。", "source": "北京唯一一座专为教育设立的牌楼：国子监琉璃牌楼……是北京唯一一座专为教育而设立的琉璃牌坊，也是北京现存唯一一座不属于寺庙的琉璃牌坊。", "patch": true}, {"section": "孔庙、国子监", "layer": "core", "type": "single", "q": "明朝将北京孔庙大成殿中的孔子神像撤去、改用木主神牌的时间是（ ）。", "options": ["A. 明永乐九年（1411年）", "B. 明嘉靖九年（1530年）", "C. 清雍正元年（1723年）", "D. 清乾隆二年（1737年）"], "answer": "B", "explain": "明嘉靖九年（1530年），明世宗采纳大学士张璁之议更定祀典，诏令撤去大成殿内孔子塑像，改用木主神牌（上书“至圣先师孔子神位”），天下文庙一体遵行。A项为孔庙重建之年，C项为启圣祠改名崇圣祠之年，D项为改铺黄琉璃瓦之年。", "source": "神像改为神牌的时间：明嘉靖九年（1530年）。明世宗采纳大学士张璁议更定祀典……诏令撤去大成殿内孔子塑像，改用木主神牌（上书“至圣先师孔子神位”），天下文庙一体遵行。", "patch": true}, {"section": "孔庙、国子监", "layer": "core", "type": "judge", "q": "国子监彝伦堂大堂中门上方悬挂的“彝伦堂”横匾为清康熙皇帝御笔亲题，系康熙年间重修国子监时所书。", "answer": "对", "explain": "“彝伦堂”横匾为清康熙皇帝御笔亲题（康熙年间重修国子监时所书），此说法与资料一致。注意乾隆帝御笔题写的是琉璃牌楼“圜桥教泽”“学海节观”，不要混淆。", "source": "匾额书写者：大堂中门上方悬挂的“彝伦堂”横匾为清康熙皇帝御笔亲题（康熙年间重修国子监时所书）。", "patch": true}, {"section": "孔庙、国子监", "layer": "core", "type": "multi", "q": "元朝国子监内，蒙古、色目子弟与汉人子弟互学语言，其原因（目的）包括（ ）。", "options": ["A. 打破蒙汉之间的语言隔阂", "B. 培养兼通蒙汉（多语）的人才", "C. 巩固元朝的统治", "D. 令汉人子弟学习蒙古语言文字与骑射，以便充当通事、译史入仕为官", "E. 方便蒙古子弟直接参加科举考试并优先录取"], "answer": "ABCD", "explain": "元朝推行双语（多语）教学：令蒙古、色目子弟学习汉语言文字以便治理汉地，令汉人子弟学习蒙古语言文字与骑射以便充当通事、译史入仕；目的是打破蒙汉语言隔阂，培养兼通蒙汉的人才，巩固元朝统治。E项内容资料未提及，为干扰项。", "source": "元朝蒙、汉子弟互学语言的原因：令蒙古、色目子弟学习汉语言文字，令汉人子弟学习蒙古语言文字与骑射（以便充当通事、译史，入仕为官）。目的是打破语言隔阂，培养兼通蒙汉的人才，巩固元朝统治。", "patch": true}, {"section": "孔庙、国子监", "layer": "core", "type": "single", "q": "北京孔庙所藏“十三经”刻石，其经文属于下列哪个学派的经典著作？", "options": ["A. 道家", "B. 墨家", "C. 法家", "D. 儒家"], "answer": "D", "explain": "十三经是儒家学派的经典著作，包括《周易》《尚书》《诗经》《周礼》《仪礼》《礼记》《春秋左传》《春秋公羊传》《春秋穀梁传》《论语》《孝经》《尔雅》《孟子》十三部，是历代科举取士的标准文本。", "source": "学派：十三经是儒家学派的经典著作……十三经则为《周易》《尚书》《诗经》《周礼》《仪礼》《礼记》《春秋左传》《春秋公羊传》《春秋穀梁传》《论语》《孝经》《尔雅》《孟子》十三部。", "patch": true}, {"section": "孔庙、国子监", "layer": "core", "type": "judge", "q": "元朝国子监推行双语教学，令蒙古、色目子弟专习蒙古语言文字，汉人子弟专习汉语言文字，各族子弟各学其母语、互不干扰。", "answer": "错", "explain": "内容错误，恰好相反。元朝令蒙古、色目子弟学习汉语言文字（以便治理汉地），令汉人子弟学习蒙古语言文字与骑射（以便充当通事、译史入仕为官），即蒙汉子弟互学对方语言，以打破语言隔阂、巩固统治。", "source": "元朝是以蒙古族统治者为首的多民族大一统王朝，朝廷推行“双语（多语）教学”。一方面令蒙古、色目子弟学习汉语言文字……另一方面令汉人子弟学习蒙古语言文字与骑射……培养兼通蒙汉（多语）的人才，巩固元朝统治。", "patch": true}, {"section": "孔庙、国子监", "layer": "core", "type": "single", "q": "蒋衡手书、乾隆年间刻石的孔庙十三经刻石，全文总字数约为（ ）。", "options": ["A. 约63万字", "B. 约189万字", "C. 约36万字", "D. 约16万字"], "answer": "A", "explain": "十三经刻石全文约63万字（一说628000余字）。189是经文碑的数量（座），与总字数无关；C、D两项为干扰数字。", "source": "抄写者与总字数：由江苏金坛贡生蒋衡（号湘帆）以楷书手书……历时12年完成；全文约63万字（一说628000余字）。", "patch": true}, {"section": "孔庙、国子监", "layer": "core", "type": "single", "q": "大成殿院中的砚水湖（古井，原名“满井”）开凿于（ ），后由清乾隆皇帝赐名“砚水湖”。", "options": ["A. 唐代", "B. 元代", "C. 明代", "D. 清代"], "answer": "C", "explain": "砚水湖开凿于明代（一说元代，导游考试通行答案为明代），原名“满井”；清乾隆皇帝特赐名“砚水湖”，取“以井为砚、以水为墨”之意。", "source": "开凿年代：砚水湖实为大成殿院……西侧的一眼古井，开凿于明代（一说元代）……故原名“满井”。赐名皇帝：清乾隆皇帝特赐名“砚水湖”。（口径提示：导游考试通行答案为“明代”）", "patch": true}, {"section": "孔庙、国子监", "layer": "core", "type": "single", "q": "北京孔庙大成殿内神位前陈设的笾、豆、登、爵、簠、簋等祭器与编钟、编磬、琴、瑟等乐器，其制作年代主要为（ ）。", "options": ["A. 元代", "B. 明代", "C. 清代", "D. 民国年间"], "answer": "C", "explain": "大成殿内的礼器、祭器、乐器主要为清代制作（以清乾隆年间制品为主），系清乾隆、光绪年间按祭孔礼制配置，是研究清代祭孔礼乐制度的重要实物。", "source": "礼器、祭器、乐器的制作年代：主要为清代制作（以清乾隆年间制品为主）……系清乾隆、光绪年间按祭孔礼制配置，是研究清代祭孔礼乐制度的重要实物。", "patch": true}, {"section": "孔庙、国子监", "layer": "core", "type": "single", "q": "清雍正年间，国子监增设“南学”供监生肄业居住，其地点是（ ）。", "options": ["A. 国子监以北的142间官房", "B. 国子监以南（今方家胡同）的142间官房", "C. 国子监以东的66间六堂", "D. 国子监以西的临街铺面"], "answer": "B", "explain": "雍正帝将国子监南面（今方家胡同）的142间官房拨予国子监作学舍，称“南学”，供监生肄业居住。C项66间为六堂之数，与南学无关。", "source": "清雍正年间增设南学的地点：国子监以南（今方家胡同）的142间官房。雍正帝将国子监南面142间官房拨予国子监作学舍，称“南学”，供监生肄业居住。", "patch": true}, {"section": "孔庙、国子监", "layer": "core", "type": "single", "q": "北京唯一一座专为教育设立的牌楼是（ ）。", "options": ["A. 国子监街东口“成贤街”过街牌楼", "B. 国子监琉璃牌楼", "C. 国子监大门旁“国子监”过街牌楼", "D. 孔庙先师门前牌楼"], "answer": "B", "explain": "国子监琉璃牌楼（位于太学门内、辟雍以南）建于清乾隆四十八年（1783年），三间四柱七楼、上覆黄琉璃瓦，是北京唯一一座专为教育而设立的琉璃牌坊。A、C两项为国子监街上的过街牌楼，D项为干扰项。", "source": "北京唯一一座专为教育设立的牌楼：国子监琉璃牌楼（位于太学门内、辟雍以南）。建于清乾隆四十八年（1783年），形制为三间四柱七楼，上覆黄琉璃瓦。", "patch": true}, {"section": "孔庙、国子监", "layer": "core", "type": "single", "q": "国子监彝伦堂大堂中门上方悬挂的“彝伦堂”横匾，其书写者是（ ）。", "options": ["A. 清乾隆皇帝", "B. 清雍正皇帝", "C. 清康熙皇帝", "D. 民国大总统黎元洪"], "answer": "C", "explain": "“彝伦堂”横匾为清康熙皇帝御笔亲题（康熙年间重修国子监时所书）。乾隆御笔的是琉璃牌楼“圜桥教泽”“学海节观”额题；“道洽大同”匾为黎元洪手书，均非本题答案。", "source": "匾额书写者：大堂中门上方悬挂的“彝伦堂”横匾为清康熙皇帝御笔亲题（康熙年间重修国子监时所书）。", "patch": true}, {"section": "孔庙、国子监", "type": "single", "q": "孔子封号\"大成至圣文宣王\"中\"大成\"二字，语出（　）。", "options": ["A. 《论语》", "B. 《孟子》", "C. 《史记》", "D. 《礼记》"], "answer": "B", "explain": "\"大成\"语出《孟子·万章下》\"孔子之谓集大成\"；\"至圣\"语出《史记·孔子世家》。", "source": "\"大成\"：语出《孟子·万章下》\"孔子之谓集大成。集大成也者，金声而玉振之也\"", "layer": "ext"}, {"section": "孔庙、国子监", "type": "judge", "q": "祭祀孔子的礼仪属于古代\"五礼\"中的嘉礼。", "answer": "错", "explain": "祭孔（释奠礼）属于\"五礼\"中的吉礼，吉礼是祭祀天地、宗庙、社稷、先圣先师之礼，列五礼之首。", "source": "祭祀孔子的礼仪属于古代\"五礼\"中的吉礼……吉礼是祭祀天地、宗庙、社稷、先圣先师之礼，列五礼之首", "layer": "ext"}, {"section": "孔庙、国子监", "type": "multi", "q": "国子监街下马碑上镌刻\"官员人等至此下马\"，使用的文字有（　）。", "options": ["A. 满文", "B. 汉文", "C. 藏文", "D. 托忒蒙古文", "E. 西夏文"], "answer": "ABCD", "explain": "下马碑用满、汉、蒙、回（察合台文）、藏、托忒（托忒蒙古文）六种文字书写，不含西夏文。", "source": "碑身正背两面分别镌刻\"官员人等至此下马\"八字，用满、汉、蒙、回（察合台文／维吾尔文）、藏、托忒（托忒蒙古文）六种文字书写", "layer": "ext"}, {"section": "孔庙、国子监", "type": "single", "q": "追谥孔子为\"文宣王\"的是（　）。", "options": ["A. 唐开元二十七年唐玄宗", "B. 宋大中祥符五年宋真宗", "C. 元大德十一年元武宗", "D. 清顺治二年顺治帝"], "answer": "A", "explain": "唐开元二十七年（739年）唐玄宗追谥孔子为\"文宣王\"；宋真宗改谥\"至圣文宣王\"；元武宗加封\"大成至圣文宣王\"。", "source": "\"文宣\"：唐开元二十七年（739年）唐玄宗追谥孔子为\"文宣王\"所沿用的谥号", "layer": "ext"}, {"section": "孔庙、国子监", "type": "judge", "q": "\"大成至圣文宣王\"是元大德十一年（1307年）元武宗海山即位后加封给孔子的最高封号。", "answer": "对", "explain": "与原文一致：这是元大德十一年（1307年）元武宗海山即位后加封给孔子的最高封号。", "source": "这是元大德十一年（1307年）元武宗海山即位后加封给孔子的最高封号，也是大一统王朝给予孔子的最高谥封", "layer": "ext"}, {"section": "孔庙、国子监", "type": "single", "q": "元明清时期，国子监最高长官的称谓是（　）。", "options": ["A. 司业", "B. 祭酒", "C. 博士", "D. 管理监事大臣"], "answer": "B", "explain": "国子监最高长官为祭酒（全称\"国子监祭酒\"），副职为司业；清代另设\"管理监事大臣\"总理，但日常事务仍由祭酒主持。", "source": "元明清国子监最高长官的称谓：祭酒（全称\"国子监祭酒\"……）。副职为司业", "layer": "ext"}, {"section": "孔庙、国子监", "type": "judge", "q": "汉武帝采纳董仲舒的主张，于元朔五年（公元前124年）设太学、立五经博士。", "answer": "对", "explain": "与原文一致：汉武帝采纳董仲舒\"罢黜百家、独尊儒术\"\"兴太学以养士\"的主张，于元朔五年（公元前124年）设太学。", "source": "汉武帝采纳董仲舒\"罢黜百家、独尊儒术\"\"兴太学以养士\"的主张，于元朔五年（公元前124年）设太学", "layer": "ext"}, {"section": "孔庙、国子监", "type": "multi", "q": "被建筑学家梁思成誉为北京\"六大宫殿\"的有（　）。", "options": ["A. 故宫太和殿", "B. 天坛祈年殿", "C. 颐和园仁寿殿", "D. 国子监辟雍殿", "E. 太庙享殿"], "answer": "ABCD", "explain": "梁思成所称\"六大宫殿\"指故宫太和殿、中和殿、保和殿，天坛祈年殿，颐和园仁寿殿，国子监辟雍殿，太庙享殿不在其列。", "source": "指故宫太和殿、中和殿、保和殿，天坛祈年殿，颐和园仁寿殿，国子监辟雍殿", "layer": "ext"}, {"section": "孔庙、国子监", "type": "single", "q": "民国年间在北京孔庙最后一次祭孔的时间是（　）。", "options": ["A. 1914年", "B. 1916年", "C. 1948年", "D. 1949年"], "answer": "C", "explain": "民国年间最后一次祭孔为1948年（孔子诞辰日）；1914年9月28日袁世凯主持的是民国首次大规模祭孔。", "source": "民国年间在北京孔庙最后一次祭孔的时间：1948年……此后祭孔改由教育部主办，至1948年为最后一次", "layer": "ext"}, {"section": "孔庙、国子监", "type": "judge", "q": "清代钦定北京孔庙为\"先师庙\"的皇帝是康熙皇帝。", "answer": "错", "explain": "钦定北京孔庙为\"先师庙\"的是清世祖顺治皇帝：顺治二年尊孔子为\"大成至圣文宣先师\"，顺治十四年改称\"至圣先师\"。", "source": "清代钦定北京孔庙为\"先师庙\"的皇帝：清世祖顺治皇帝", "layer": "ext"}, {"section": "孔庙、国子监", "type": "single", "q": "清廷废除科举制度后，管理国子监各项职能的机构是（　）。", "options": ["A. 礼部", "B. 学部", "C. 教育部", "D. 京师大学堂"], "answer": "B", "explain": "光绪三十一年（1905年）清廷设立学部，国子监的教育行政与教学管理职能归并学部，国子监遂裁撤。", "source": "废除科举后管理国子监各项职能的机构：学部。光绪三十一年（1905年）清廷设立学部", "layer": "ext"}, {"section": "孔庙、国子监", "type": "judge", "q": "中国古代科举制度始于隋炀帝大业元年（605年），止于清光绪三十一年（1905年），历时约1300年。", "answer": "对", "explain": "与原文一致：始于605年设进士科，止于1905年清廷下诏停止乡会试，历时约1300年。", "source": "始于隋炀帝大业元年（公元605年）设进士科，止于清光绪三十一年（1905年）……历时约1300年", "layer": "ext"}, {"section": "孔庙、国子监", "type": "multi", "q": "北京孔庙大成殿内孔子神位两侧配享的\"四配\"包括（　）。", "options": ["A. 复圣颜回", "B. 宗圣曾参", "C. 述圣孔伋", "D. 亚圣孟轲", "E. 朱熹"], "answer": "ABCD", "explain": "\"四配\"为复圣颜回、宗圣曾参、述圣孔伋、亚圣孟轲；朱熹列于\"十二哲\"，不属于四配。", "source": "\"四配\"：大成殿内孔子神位两侧配享的四位儒家圣人——复圣颜回（颜子）、宗圣曾参（曾子）、述圣孔伋（子思）、亚圣孟轲（孟子）", "layer": "ext"}, {"section": "孔庙、国子监", "type": "single", "q": "清代最后一届科举考试的状元是（　）。", "options": ["A. 刘墉", "B. 纪昀", "C. 刘春霖", "D. 张謇"], "answer": "C", "explain": "刘春霖为光绪三十年甲辰科（1904年）一甲第一名状元，因次年即废科举，被称为\"第一人中最后人\"。", "source": "清代最后一届科举考试状元：刘春霖……为光绪三十年甲辰科（1904年）一甲第一名状元", "layer": "ext"}, {"section": "孔庙、国子监", "type": "judge", "q": "北京孔庙始建于元成宗大德六年（1302年），是全国第一大孔庙。", "answer": "错", "explain": "北京孔庙始建于1302年无误，但它是仅次于山东曲阜孔庙的全国第二大孔庙。", "source": "北京孔庙始建于元成宗大德六年（1302年）……是仅次于山东曲阜孔庙的全国第二大孔庙", "layer": "ext"}, {"section": "孔庙、国子监", "type": "single", "q": "下列建筑中，不属于北京三大皇家庙宇的是（　）。", "options": ["A. 太庙", "B. 孔庙", "C. 历代帝王庙", "D. 天坛"], "answer": "D", "explain": "北京三大皇家庙宇为太庙、孔庙（文庙、先师庙）、历代帝王庙，天坛不在其列。", "source": "北京三大皇家庙宇：太庙……孔庙（又称文庙、先师庙）……历代帝王庙", "layer": "ext"}, {"section": "孔庙、国子监", "type": "judge", "q": "孔庙\"辨奸柏\"相传为元代国子监第一任祭酒许衡手植，树龄已近700年。", "answer": "对", "explain": "与原文一致：辨奸柏相传为元代国子监第一任祭酒许衡手植，树龄已近700年。", "source": "相传为元代国子监第一任祭酒许衡手植，树龄已近700年", "layer": "ext"}, {"section": "孔庙、国子监", "type": "multi", "q": "清朝国子监生员分\"贡生\"与\"监生\"两大类，下列属于贡生类别的有（　）。", "options": ["A. 岁贡", "B. 恩贡", "C. 拔贡", "D. 荫监", "E. 例贡"], "answer": "ABCE", "explain": "贡生包括岁贡、恩贡、拔贡、副贡、优贡、例贡；荫监属于监生（恩监、荫监、优监、例监）。", "source": "贡生：岁贡、恩贡、拔贡、副贡、优贡、例贡……监生：恩监、荫监、优监、例监", "layer": "ext"}, {"section": "孔庙、国子监", "type": "single", "q": "国子监被国务院公布为第一批全国重点文物保护单位的时间是（　）。", "options": ["A. 1961年", "B. 1984年", "C. 1988年", "D. 2009年"], "answer": "A", "explain": "国子监于1961年3月4日被公布为第一批全国重点文物保护单位；北京孔庙为1988年第三批；国子监街1984年列为北京市级文保单位。", "source": "国子监于1961年3月4日被国务院公布为第一批全国重点文物保护单位；北京孔庙于1988年1月13日被公布为第三批", "layer": "ext"}, {"section": "孔庙、国子监", "type": "judge", "q": "大成殿院中的古井\"砚水湖\"是由清康熙皇帝特赐名的。", "answer": "错", "explain": "赐名\"砚水湖\"的是清乾隆皇帝，取\"以井为砚、以水为墨\"之意，并非康熙帝。", "source": "清乾隆皇帝特赐名\"砚水湖\"（井小而以\"湖\"名之，取\"以井为砚、以水为墨\"之意）", "layer": "ext"}, {"section": "孔庙、国子监", "type": "single", "q": "北京孔庙中轴线上的主要建筑由南向北依次是（　）。", "options": ["A. 先师门、大成殿、大成门、崇圣门、崇圣祠", "B. 先师门、大成门、大成殿、崇圣门、崇圣祠", "C. 大成门、先师门、大成殿、崇圣祠、崇圣门", "D. 先师门、大成门、崇圣门、大成殿、崇圣祠"], "answer": "B", "explain": "中轴线上由南向北依次为：先师门、大成门、大成殿、崇圣门、崇圣祠五座，共三进院落。", "source": "中轴线上的主要建筑（由南向北，三进院落）：先师门、大成门、大成殿、崇圣门、崇圣祠五座", "layer": "ext"}, {"section": "孔庙、国子监", "type": "judge", "q": "孔子封号中\"至圣\"意为道德学问至高无上的圣人，语出《史记·孔子世家》\"可谓至圣矣\"，宋真宗大中祥符五年（1012年）改谥\"至圣文宣王\"。", "answer": "对", "explain": "与原文一致：\"至圣\"语出《史记·孔子世家》，宋真宗大中祥符五年改谥\"至圣文宣王\"。", "source": "\"至圣\"：意为道德学问至高无上的圣人，语出《史记·孔子世家》\"可谓至圣矣\"；宋真宗大中祥符五年（1012年）改谥\"至圣文宣王\"", "layer": "ext"}, {"section": "孔庙、国子监", "type": "multi", "q": "国子监学生入学后第一年（初级班）上课学习的堂有（　）。", "options": ["A. 正义堂", "B. 崇志堂", "C. 广业堂", "D. 率性堂"], "answer": "ABC", "explain": "第一年初级班在正义堂、崇志堂、广业堂三堂学习；率性堂是最高年级（经史兼通、文理俱优者升入）。", "source": "第一年（初级班）在正义堂、崇志堂、广业堂三堂学习……经史兼通、文理俱优者升入率性堂", "layer": "ext"}, {"section": "孔庙、国子监", "type": "single", "q": "明嘉靖九年（1530年）在北京孔庙增建的崇圣祠，原名是（　）。", "options": ["A. 启圣祠", "B. 崇文阁", "C. 彝伦堂", "D. 棂星门"], "answer": "A", "explain": "崇圣祠原名启圣祠，建于明嘉靖九年（1530年），清雍正元年（1723年）改名崇圣祠。", "source": "崇圣祠（原名启圣祠），建于明嘉靖九年（1530年）……清雍正元年（1723年）改名崇圣祠", "layer": "ext"}, {"section": "孔庙、国子监", "type": "judge", "q": "清代国子监祭酒为正六品，副职司业为正四品。", "answer": "错", "explain": "清代祭酒为正四品，司业为正六品，题干将二者品级颠倒。", "source": "祭酒品级：清代正四品，司业正六品", "layer": "ext"}, {"section": "孔庙、国子监", "type": "single", "q": "清朝将北京孔庙大成殿、大成门改铺黄琉璃瓦的时间是（　）。", "options": ["A. 清雍正元年（1723年）", "B. 清乾隆二年（1737年）", "C. 清乾隆五十五年（1790年）", "D. 清光绪三十二年（1906年）"], "answer": "B", "explain": "清乾隆二年（1737年）乾隆帝命大成殿、大成门改用黄琉璃瓦，崇圣祠改用绿琉璃瓦，乾隆三年竣工。", "source": "清乾隆二年（1737年）。乾隆帝命北京孔庙大成殿、大成门改用黄琉璃瓦，崇圣祠改用绿琉璃瓦", "layer": "ext"}, {"section": "孔庙、国子监", "type": "judge", "q": "光绪三十二年（1906年）祭孔升为\"大祀\"后改用六佾舞（三十六人），此前用八佾舞。", "answer": "错", "explain": "1906年升\"大祀\"后用八佾舞（八八六十四人），此前用六佾舞（三十六人），题干将前后规格颠倒。", "source": "光绪三十二年（1906年）祭孔升为\"大祀\"后用八佾舞（八八六十四人）；此前用六佾舞（三十六人）", "layer": "ext"}, {"section": "孔庙、国子监", "type": "multi", "q": "明清时期北京孔庙祭孔的六大仪程包括（　）。", "options": ["A. 迎神", "B. 初献", "C. 终献", "D. 送神", "E. 开光"], "answer": "ABCD", "explain": "六大仪程为：迎神→初献→亚献→终献→撤馔（彻馔）→送神，不含\"开光\"。", "source": "六大仪程：迎神 → 初献 → 亚献 → 终献 → 撤馔（彻馔）→ 送神", "layer": "ext"}, {"section": "孔庙、国子监", "type": "single", "q": "原藏于北京孔庙的战国石鼓，现在收藏于（　）。", "options": ["A. 中国国家博物馆", "B. 首都博物馆", "C. 北京故宫博物院", "D. 孔庙和国子监博物馆"], "answer": "C", "explain": "战国石鼓抗战前夕随故宫文物南迁，胜利后运回北京，现藏故宫博物院；孔庙现存者为清乾隆年间仿制的复制品。", "source": "战国石鼓的现藏地点：北京故宫博物院……孔庙现存者为清乾隆年间仿制的复制品", "layer": "ext"}, {"section": "孔庙、国子监", "type": "judge", "q": "清代每年于仲春（农历二月）上丁日与仲秋（农历八月）上丁日两次举行祭孔典礼，史称\"丁祭\"。", "answer": "对", "explain": "与原文一致：每年仲春、仲秋上丁日两次祭孔，即每季第二个月的第一个\"丁日\"，史称\"丁祭\"。", "source": "每年仲春（农历二月）上丁日与仲秋（农历八月）上丁日两次，即每季第二个月的第一个\"丁日\"，史称\"丁祭\"", "layer": "ext"}, {"section": "孔庙、国子监", "type": "single", "q": "北京孔庙大成殿的屋顶式样是（　）。", "options": ["A. 重檐歇山顶", "B. 重檐庑殿顶", "C. 单檐庑殿顶", "D. 重檐攒尖顶"], "answer": "B", "explain": "大成殿为重檐庑殿顶，覆黄琉璃瓦，面阔九间、进深五间，与故宫太和殿同属最高等级。", "source": "大成殿屋顶式样：重檐庑殿顶，覆黄琉璃瓦，面阔九间、进深五间（\"九五\"开间）……与故宫太和殿同属最高等级", "layer": "ext"}, {"section": "孔庙、国子监", "type": "judge", "q": "北京孔庙现存的战国石鼓为清乾隆年间仿制的复制品，原鼓现藏北京故宫博物院。", "answer": "对", "explain": "与原文一致：战国石鼓抗战前夕随故宫文物南迁，胜利后运回北京，现藏故宫博物院，孔庙现存者为清乾隆年间仿制的复制品。", "source": "现藏故宫博物院。孔庙现存者为清乾隆年间仿制的复制品", "layer": "ext"}, {"section": "孔庙、国子监", "type": "multi", "q": "下列属于北京三大皇家庙宇的有（　）。", "options": ["A. 太庙", "B. 孔庙", "C. 历代帝王庙", "D. 天坛", "E. 雍和宫"], "answer": "ABC", "explain": "北京三大皇家庙宇为太庙、孔庙（文庙、先师庙）、历代帝王庙；天坛、雍和宫不在其列。", "source": "北京三大皇家庙宇：太庙……孔庙（又称文庙、先师庙，元明清三代国家祭孔之所）、历代帝王庙", "layer": "ext"}, {"section": "孔庙、国子监", "type": "single", "q": "孔庙\"十三经\"刻石（乾隆石经）的抄写者是（　）。", "options": ["A. 张照", "B. 刘墉", "C. 蒋衡", "D. 吴苑"], "answer": "C", "explain": "十三经由江苏金坛贡生蒋衡（号湘帆）以楷书手书，自雍正四年至乾隆二年历时12年完成，全文约63万字。", "source": "由江苏金坛贡生蒋衡（号湘帆）以楷书手书，自雍正四年（1726年）至乾隆二年（1737年），历时12年完成", "layer": "ext"}, {"section": "孔庙、国子监", "type": "judge", "q": "北京孔庙第一进院落（先师门与大成门之间）有御碑亭11座，第二进院落（大成门与大成殿之间）有御碑亭3座。", "answer": "错", "explain": "第一进院落有御碑亭3座（东一西二），第二进院落有御碑亭11座（东六西五），题干将两进院落数量颠倒。", "source": "第一进院落（先师门与大成门之间）有御碑亭3座（东一西二），第二进院落（大成门与大成殿之间）有御碑亭11座", "layer": "ext"}, {"section": "孔庙、国子监", "type": "single", "q": "北京孔庙大成殿外悬挂的\"万世师表\"匾的题写者是（　）。", "options": ["A. 康熙皇帝", "B. 雍正皇帝", "C. 乾隆皇帝", "D. 黎元洪"], "answer": "A", "explain": "\"万世师表\"匾为清康熙皇帝康熙二十三年（1684年）御笔亲书，并颁行直省学宫。", "source": "大成殿外\"万世师表\"匾的题写者：清康熙皇帝（康熙二十三年，1684年御笔亲书，并颁行直省学宫）", "layer": "ext"}, {"section": "孔庙、国子监", "type": "judge", "q": "国子监琉璃牌楼是北京现存唯一一座属于寺庙的琉璃牌坊。", "answer": "错", "explain": "国子监琉璃牌楼是北京唯一一座专为教育而设立的琉璃牌坊，也是北京现存唯一一座不属于寺庙的琉璃牌坊。", "source": "是北京唯一一座专为教育而设立的琉璃牌坊，也是北京现存唯一一座不属于寺庙的琉璃牌坊", "layer": "ext"}, {"section": "孔庙、国子监", "type": "multi", "q": "下列关于\"左庙右学\"规制在国子监街上体现的说法，正确的有（　）。", "options": ["A. 孔庙在东（左），为\"庙\"", "B. 国子监在西（右），为\"学\"", "C. 两组建筑各沿中轴线南北延伸、左右对称", "D. 孔庙与国子监之间有持敬门相通", "E. 国子监在东，孔庙在西"], "answer": "ABCD", "explain": "孔庙在东为\"庙\"，国子监在西为\"学\"，各沿中轴线南北延伸，之间有持敬门相通，是中国现存最完整的\"左庙右学\"建筑实例；E与原文相反。", "source": "孔庙在东（左，为\"庙\"），国子监在西（右，为\"学\"）……之间有持敬门相通", "layer": "ext"}, {"section": "孔庙、国子监", "type": "single", "q": "国子监辟雍奉旨兴工的时间是（　）。", "options": ["A. 清乾隆二年（1737年）", "B. 清乾隆四十八年（1783年）", "C. 清乾隆五十年（1785年）", "D. 清康熙二十三年（1684年）"], "answer": "B", "explain": "辟雍于清乾隆四十八年（1783年）二月奉旨兴工，乾隆四十九年（1784年）冬竣工，配套工程于乾隆五十年完工。", "source": "辟雍于清乾隆四十八年（1783年）二月奉旨兴工，乾隆四十九年（1784年）冬竣工", "layer": "ext"}, {"section": "孔庙、国子监", "type": "judge", "q": "国子监彝伦堂原址在元代为\"崇文阁\"，是国子监藏书的地方，明代永乐年间重建并改名\"彝伦堂\"。", "answer": "对", "explain": "与原文一致：彝伦堂原址在元代为\"崇文阁\"，建于元皇庆二年（1313年），是国子监藏书楼；明永乐年间重建并改名\"彝伦堂\"。", "source": "彝伦堂原址在元代为\"崇文阁\"，建于元皇庆二年（1313年），是国子监藏书的地方……明代永乐年间予以重建并改名\"彝伦堂\"", "layer": "ext"}, {"section": "孔庙、国子监", "type": "single", "q": "国子监琉璃牌楼北面（背面）额题的文字是（　）。", "options": ["A. 圜桥教泽", "B. 学海节观", "C. 万世师表", "D. 道洽大同"], "answer": "B", "explain": "琉璃牌楼南面额题\"圜桥教泽\"，北面额题\"学海节观\"，均为清乾隆皇帝御笔。", "source": "南面（正面）额题\"圜桥教泽\"，北面（背面）额题\"学海节观\"，均为清乾隆皇帝御笔", "layer": "ext"}, {"section": "孔庙、国子监", "type": "multi", "q": "下列关于国子监街下马碑的说法，正确的有（　）。", "options": ["A. 位于北京孔庙大门（先师门）外东西两侧路北，共两座", "B. 为清代所立", "C. 碑身镌刻\"官员人等至此下马\"八字", "D. 即便皇帝亲临祭孔亦须降舆步行", "E. 据《大清律例》，过碑不下马者笞一百"], "answer": "ABCD", "explain": "下马碑为清代所立，共两座，刻\"官员人等至此下马\"，皇帝亲临亦须降舆步行；据《大清律例》过碑不下马者笞五十而非笞一百，故E错误。", "source": "据《大清律例》，过碑不下马者笞五十，看守差役失职者笞四十", "layer": "ext"}, {"section": "孔庙、国子监", "type": "single", "q": "古代\"五礼\"中列于首位、为祭祀天地、宗庙、社稷、先圣先师之礼的是（　）。", "options": ["A. 吉礼", "B. 凶礼", "C. 宾礼", "D. 嘉礼"], "answer": "A", "explain": "吉礼列五礼之首，是祭祀天地、宗庙、社稷、先圣先师之礼，祭孔（释奠礼）即属吉礼。", "source": "吉礼是祭祀天地、宗庙、社稷、先圣先师之礼，列五礼之首", "layer": "ext"}, {"section": "孔庙、国子监", "type": "single", "q": "据《孟子》\"孔子之谓集大成\"取\"大成\"二字，诏改孔庙正殿为\"大成殿\"的皇帝是（　）。", "options": ["A. 宋真宗", "B. 宋徽宗", "C. 唐玄宗", "D. 元武宗"], "answer": "B", "explain": "宋徽宗据《孟子·万章下》此语取\"大成\"二字，诏改孔庙正殿为\"大成殿\"。", "source": "宋徽宗据《孟子》此语取\"大成\"二字，诏改孔庙正殿为\"大成殿\"", "layer": "ext"}, {"section": "孔庙、国子监", "type": "multi", "q": "下列关于国子监辟雍设计督造的说法，正确的有（　）。", "options": ["A. 由工部尚书刘墉奉旨主办、主持设计督造", "B. 户部尚书和珅奉旨审定工程做法", "C. 和珅提出撤去殿内四根\"钻金柱\"、改用抹角架梁，节省白银4400余两", "D. 户部左侍郎金简建议添建琉璃牌楼、碑亭、钟鼓亭\"一牌楼四亭\"", "E. 辟雍于乾隆四十八年（1783年）当年竣工"], "answer": "ABCD", "explain": "辟雍乾隆四十八年（1783年）二月兴工，乾隆四十九年（1784年）冬竣工，并非当年竣工，故E错误；其余各项均与原文一致。", "source": "由工部尚书刘墉（石庵）奉旨主办……户部尚书和珅奉旨审定工程做法……户部左侍郎金简建议添建琉璃牌楼、碑亭、钟鼓亭", "layer": "ext"}, {"section": "孔庙、国子监", "type": "single", "q": "向汉武帝建议\"兴太学以养士\"、建立太学的官员是（　）。", "options": ["A. 公孙弘", "B. 主父偃", "C. 董仲舒", "D. 桑弘羊"], "answer": "C", "explain": "汉武帝采纳董仲舒\"罢黜百家、独尊儒术\"\"兴太学以养士\"的主张，于元朔五年（公元前124年）设太学，这是中国官立中央大学的开端。", "source": "建议汉武帝建立太学的官员：董仲舒。汉武帝采纳董仲舒\"罢黜百家、独尊儒术\"\"兴太学以养士\"的主张", "layer": "ext"}, {"section": "孔庙、国子监", "type": "single", "q": "民国三年（1914年）9月28日，以\"大祀\"规格在北京孔庙亲自主持民国首次大规模祭孔的是（　）。", "options": ["A. 黎元洪", "B. 袁世凯", "C. 段祺瑞", "D. 范源濂"], "answer": "B", "explain": "1914年9月28日袁世凯曾在北京孔庙以\"大祀\"规格亲自主持民国首次大规模祭孔；此后祭孔改由教育部主办。", "source": "民国三年（1914年）9月28日袁世凯曾在北京孔庙以\"大祀\"规格亲自主持民国首次大规模祭孔", "layer": "ext"}, {"section": "孔庙、国子监", "type": "multi", "q": "清朝国子监监生享受的待遇包括（　）。", "options": ["A. 由国家供给膳食、住宿", "B. 发给\"膏火银\"（生活津贴）", "C. 免其徭役", "D. 坐监积满年限、成绩合格即给予出身，优秀者可直接授官", "E. 一律不得应科举"], "answer": "ABCD", "explain": "监生由国家供给膳食住宿、发给膏火银、免徭役，积分合格给予出身，优秀者可直接授官；清代监生并可应科举、考职录用，故E错误。", "source": "由国家供给膳食、住宿……发给\"膏火银\"……免其徭役……优秀者可直接授官……清代监生并可应科举", "layer": "ext"}, {"section": "孔庙、国子监", "type": "single", "q": "清代最后一届科举考试（光绪三十年甲辰科）的末次会试举行地点是（　）。", "options": ["A. 北京顺天贡院", "B. 南京江南贡院", "C. 河南开封贡院", "D. 西安关中贡院"], "answer": "C", "explain": "该科末次会试在河南开封贡院举行，因顺天贡院毁于庚子之乱。", "source": "该科末次会试在河南开封贡院举行（顺天贡院毁于庚子之乱）", "layer": "ext"}, {"section": "孔庙、国子监", "type": "single", "q": "北京孔庙被国务院公布为全国重点文物保护单位的时间和批次是（　）。", "options": ["A. 1961年第一批", "B. 1988年第三批", "C. 1984年第三批市级", "D. 2009年首届"], "answer": "B", "explain": "北京孔庙于1988年1月13日被公布为第三批全国重点文物保护单位；1961年第一批是国子监。", "source": "北京孔庙于1988年1月13日被公布为第三批全国重点文物保护单位", "layer": "ext"}, {"section": "孔庙、国子监", "type": "multi", "q": "北京孔庙大成殿内悬挂的清代皇帝御匾与皇帝对应正确的有（　）。", "options": ["A. 康熙\"万世师表\"", "B. 雍正\"生民未有\"", "C. 乾隆\"与天地参\"", "D. 光绪\"斯文在兹\"", "E. 宣统\"道洽大同\""], "answer": "ABCD", "explain": "A、B、C、D均与原文一致；\"道洽大同\"为民国大总统黎元洪所题，宣统帝匾为\"中和位育\"，故E错误。", "source": "康熙\"万世师表\"、雍正\"生民未有\"、乾隆\"与天地参\"……光绪\"斯文在兹\"、宣统\"中和位育\"，以及黎元洪\"道洽大同\"", "layer": "ext"}, {"section": "孔庙、国子监", "type": "single", "q": "国子监街上完整保留的过街牌楼共有（　）。", "options": ["A. 2座", "B. 3座", "C. 4座", "D. 6座"], "answer": "C", "explain": "国子监街完整保留着4座过街牌楼：街东西两口两座额题\"成贤街\"，国子监大门左右两座额题\"国子监\"。", "source": "街上完整地保留着4座过街牌楼：街东西两口的两座额题\"成贤街\"，国子监大门左右的两座额题\"国子监\"", "layer": "ext"}, {"section": "孔庙、国子监", "type": "single", "q": "国子监街荣获\"中国历史文化名街\"称号的届次是（　）。", "options": ["A. 首届（第一届）", "B. 第二届", "C. 第三届", "D. 第四届"], "answer": "A", "explain": "国子监街荣获首届\"中国历史文化名街\"称号，2009年6月10日在北京揭晓，首批共评出10条名街，国子监街名列其中（居首）。", "source": "国子监街荣获首届（第一届）\"中国历史文化名街\"称号，于2009年6月10日在北京揭晓", "layer": "ext"}, {"section": "孔庙、国子监", "type": "single", "q": "北京孔庙中虽经明清多次修葺仍保留元代建筑遗风、为北京地区罕见元代木构遗存的建筑是（　）。", "options": ["A. 大成殿", "B. 崇圣祠", "C. 先师门", "D. 碑亭"], "answer": "C", "explain": "先师门（孔庙正门，又称棂星门）保留元代建筑遗风——斗拱硕大稀疏、朴拙简洁，是北京地区罕见的元代木构遗存。", "source": "保留元代建筑风格的建筑：先师门（孔庙正门，又称棂星门）……是北京地区罕见的元代木构遗存", "layer": "ext"}, {"section": "孔庙、国子监", "type": "single", "q": "\"进士题名\"之风始于唐代，时称（　）。", "options": ["A. 雁塔题名", "B. 杏园宴集", "C. 曲江题诗", "D. 金榜题名"], "answer": "A", "explain": "进士题名之风始于唐代，称\"雁塔题名\"——新科进士在长安慈恩寺大雁塔壁题写姓名。", "source": "进士题名之风始于唐代，称\"雁塔题名\"——新科进士在长安慈恩寺大雁塔壁题写姓名", "layer": "ext"}, {"section": "孔庙、国子监", "type": "single", "q": "北京孔庙\"十三经\"刻石（乾隆石经）的经文碑数量为（　）。", "options": ["A. 189座", "B. 190座", "C. 198座", "D. 206座"], "answer": "A", "explain": "十三经刻石为189座石碑，加一通谕旨碑共190通；问\"十三经刻石数量\"标准答案为189座。", "source": "刻石数量：189座（通）石碑，加上一通\"摹刻石经告成恭进表文碑（谕旨碑）\"，共190通", "layer": "ext"}, {"section": "孔庙、国子监", "type": "single", "q": "相传明嘉靖年间代皇帝祭孔、行至孔庙古柏下被柏枝掀落乌纱帽，使此柏得名\"辨奸柏\"的奸相是（　）。", "options": ["A. 魏忠贤", "B. 严嵩", "C. 和珅", "D. 张居正"], "answer": "B", "explain": "相传明嘉靖年间奸相严嵩代嘉靖皇帝祭孔，行至树下被柏枝掀落乌纱帽；另有魏忠贤轿顶被掀翻的另说。", "source": "相传明嘉靖年间奸相严嵩代嘉靖皇帝祭孔，行至树下，被柏枝掀（触）落乌纱帽", "layer": "ext"}, {"section": "孔庙、国子监", "type": "single", "q": "北京孔庙大成殿内正中匾额\"道洽大同\"的题写者是（　）。", "options": ["A. 康熙皇帝", "B. 乾隆皇帝", "C. 宣统皇帝", "D. 黎元洪"], "answer": "D", "explain": "殿内正中\"道洽大同\"匾为民国大总统黎元洪题写；1916年教育总长范源濂将清代各帝御匾取下，改挂黎元洪手书匾。", "source": "正中\"道洽大同\"匾的题写者：黎元洪（民国大总统）", "layer": "ext"}, {"section": "孔庙、国子监", "type": "single", "q": "北京孔庙大成殿院中的古井\"砚水湖\"，因井水常溢至井口，原名是（　）。", "options": ["A. 满井", "B. 圣井", "C. 墨井", "D. 文井"], "answer": "A", "explain": "砚水湖实为大成殿院西侧的一眼古井，井水常溢至井口，水清浅而甘洌，故原名\"满井\"，清乾隆皇帝特赐名\"砚水湖\"。", "source": "井水常溢至井口，水清浅而甘洌，故原名\"满井\"", "layer": "ext"}, {"section": "孔庙、国子监", "type": "single", "q": "北京国子监始建于（　）。", "options": ["A. 元至元二十四年（1287年）", "B. 元大德六年（1302年）", "C. 明永乐九年（1411年）", "D. 清乾隆四十八年（1783年）"], "answer": "A", "explain": "北京国子监始建于元代至元二十四年（1287年），元大德十年（1306年）建成，是中国唯一保存完整的古代最高学府校址。", "source": "北京国子监始建于元代至元二十四年（1287年），元大德十年（1306年）建成", "layer": "ext"}, {"section": "孔庙、国子监", "type": "single", "q": "国子监正门（位于中轴线最南端、皇帝等专用通道）的名称是（　）。", "options": ["A. 集贤门", "B. 太学门", "C. 持敬门", "D. 退省门"], "answer": "A", "explain": "国子监正门名为集贤门，位于中轴线最南端，面阔三间，是皇帝等专用通道，平时很少开启。", "source": "国子监正门的名称：集贤门（位于中轴线最南端，面阔三间，是皇帝等专用通道）", "layer": "ext"}, {"section": "孔庙、国子监", "type": "single", "q": "乾隆五十年（1785年）春，乾隆帝首次在辟雍举行\"临雍讲学\"典礼，\"圜桥观听\"的学生达（　）。", "options": ["A. 1988人", "B. 3088人", "C. 4400人", "D. 5000人"], "answer": "B", "explain": "乾隆五十年（1785年）春，乾隆帝为庆贺登基五十年首次在辟雍举行\"临雍讲学\"典礼，\"圜桥观听\"的学生达3088人。", "source": "乾隆五十年（1785年）春……首次在辟雍举行盛大\"临雍讲学\"典礼，\"圜桥观听\"的学生达3088人", "layer": "ext"}, {"section": "北京的城市概况", "layer": "core", "type": "single", "q": "\"北京人\"在考古学上所处的时代及发现地点是（ ）。", "options": ["A.旧石器时代早期，房山周口店龙骨山", "B.旧石器时代晚期，王府井东方广场", "C.新石器时代早期，门头沟区斋堂镇东胡林村", "D.旧石器时代早期，房山琉璃河董家林"], "answer": "A", "explain": "\"北京人\"属旧石器时代早期，距今约70万—20万年，发现于房山周口店龙骨山。B为王府井东方广场遗迹（距今约2.5万年），C为东胡林人（距今约1万年），D董家林为西周燕城所在地。", "source": "\"北京人\"：旧石器时代早期（距今约70万—20万年，房山周口店龙骨山）"}, {"section": "北京的城市概况", "layer": "core", "type": "judge", "q": "20世纪90年代，在王府井东方广场工地上发现的古人类遗迹距今约2.5万年，属旧石器时代晚期；东胡林人发现于门头沟区斋堂镇东胡林村西，在考古学上属旧石器时代早期。", "answer": "错", "explain": "前半句正确（王府井东方广场遗迹距今约2.5万年、旧石器时代晚期、地下约12米）；但东胡林人属新石器时代早期，距今约1万年，而非旧石器时代早期。", "source": "王府井东方广场遗迹：距今约2.5万年（旧石器时代晚期，地下约12米）；东胡林人：新石器时代早期（距今约1万年），发现于门头沟区斋堂镇东胡林村西"}, {"section": "北京的城市概况", "layer": "core", "type": "multi", "q": "关于北京的城市起源与历史名称，下列说法正确的有（ ）。", "options": ["A.北京作为城市出现距今已有3000余年", "B.西周时期位于今天广安门一带的城市为蓟城", "C.西周时期位于今天房山区董家林的城市为燕城（琉璃河西周燕都）", "D.唐代北京称南京", "E.元代北京称大都"], "answer": "ABCE", "explain": "D错误：唐代称幽州，辽代才称南京（燕京），金代称中都。其余各项均正确。", "source": "3000余年建城史；广安门一带：蓟城；房山董家林：燕城（琉璃河西周燕都）；唐称幽州、辽称南京（燕京）、金称中都、元称大都"}, {"section": "北京的城市概况", "layer": "core", "type": "single", "q": "战国时期燕国所建的陪都是（ ）。", "options": ["A.蓟城", "B.燕城", "C.燕下都（武阳城）", "D.幽州"], "answer": "C", "explain": "战国燕陪都为燕下都（武阳城）。蓟城（今广安门一带）、燕城（今房山董家林）均为西周时期城市；幽州为唐代名称。注意：金代称中都，并非战国\"燕中都\"。", "source": "战国燕陪都：燕下都（武阳城）"}, {"section": "北京的城市概况", "layer": "core", "type": "judge", "q": "隋朝隋炀帝杨广与唐朝唐太宗李世民先后多次出兵远征高句丽；公元645年，为悼念阵亡将士在蓟城东建悯忠寺，该寺历时15年落成。", "answer": "错", "explain": "远征高句丽的皇帝、建寺年代及缘由均正确，但悯忠寺于武则天万岁通天元年（696年）落成，历时51年，而非15年；清雍正十一年（1733年）改称法源寺。", "source": "隋炀帝杨广与唐太宗李世民；645年建悯忠寺（武则天万岁通天元年696年落成，历时51年；清雍正十一年1733年改称法源寺）"}, {"section": "北京的城市概况", "layer": "core", "type": "single", "q": "始建于公元645年的悯忠寺于武则天万岁通天元年（696年）落成，清雍正十一年（1733年）改称（ ）。", "options": ["A.天宁寺", "B.法源寺", "C.大觉寺", "D.潭柘寺"], "answer": "B", "explain": "清雍正十一年（1733年）悯忠寺改称法源寺。", "source": "清雍正十一年1733年改称法源寺"}, {"section": "北京的城市概况", "layer": "core", "type": "judge", "q": "辽代\"五京\"中规模最大、人口最多的城市是辽南京析津府（燕京），人口约30万，下设26坊。", "answer": "对", "explain": "辽南京析津府（燕京）为辽代\"五京\"中规模最大、人口最多的城市，人口约30万、设26坊。", "source": "辽南京析津府（燕京，人口约30万、26坊）"}, {"section": "北京的城市概况", "layer": "core", "type": "multi", "q": "关于北京城址与相关遗产，下列说法正确的有（ ）。", "options": ["A.北京城中轴线自永定门至钟鼓楼约7.8公里，2024年列入《世界遗产名录》", "B.金中都故址大致位于今西城区西南部至丰台区东北部、以广安门为中心", "C.金中都水关遗址1990年发现于右安门外，是迄今为止我国发现的最大的城垣水关遗址", "D.\"北京建都纪念阙\"2003年落成于右安门外"], "answer": "ABC", "explain": "D错误：纪念阙立于广安门外滨河公园内、金中都大安殿遗址上。另：明清北京外城7门为永定门、左安门、右安门、广渠门、广安门、东便门、西便门。", "source": "中轴线永定门→钟鼓楼约7.8公里（2024年列入世遗）；金中都故址：今西城区西南部至丰台区东北部、以广安门为中心；最大水关遗址：金中都水关遗址（1990年发现于右安门外）"}, {"section": "北京的城市概况", "layer": "core", "type": "single", "q": "天宁寺塔是北京城区现存最古老的辽塔，建于辽天庆九年至十年（1119—1120年），其形制为（ ）。", "options": ["A.八角十三层密檐式实心砖塔", "B.八角七层楼阁式空心砖塔", "C.四角十三层密檐式实心砖塔", "D.八角十三层楼阁式空心砖塔"], "answer": "A", "explain": "天宁寺塔为八角十三层密檐式实心砖塔，是北京城区遗存的辽代密檐式砖塔、现存最古老的辽塔。", "source": "天宁寺塔（八角十三层密檐式实心砖塔，建于辽天庆九年至十年1119—1120年，北京城区现存最古老辽塔）"}, {"section": "北京的城市概况", "layer": "core", "type": "judge", "q": "海陵王完颜亮将都城从上京会宁府迁至燕京，金中都修建时模仿的是南宋临安城；金代于1179年在中都城东北郊外的琼华岛营建离宫大宁宫，取\"一池三山\"之意。", "answer": "错", "explain": "迁都皇帝、离宫名称、始建年代均正确，但金中都模仿的是北宋东京汴梁，而非南宋临安。", "source": "迁都皇帝：海陵王完颜亮；模仿：北宋东京汴梁；离宫：大宁宫（琼华岛，1179年建，一池三山）"}, {"section": "北京的城市概况", "layer": "core", "type": "single", "q": "北京历史上第一次成为王朝的正式首都是在（ ）。", "options": ["A.辽代", "B.金代", "C.元代", "D.明代"], "answer": "B", "explain": "1153年海陵王完颜亮迁都金中都，北京历史上第一次成为王朝的正式首都；元代则首次成为统一王朝的全国政治中心。", "source": "金代（1153年金中都，海陵王完颜亮迁都）"}, {"section": "北京的城市概况", "layer": "core", "type": "judge", "q": "元明清时期北京城以中轴线为核心、左右对称，形成宫城—皇城—内城—外城四重环套（\"里九外七皇城四\"），街道呈棋盘式；民国时期，先农坛开放初期的名称为\"城南公园\"。", "answer": "对", "explain": "表述与背诵版完全一致：四重环套\"里九外七皇城四\"、棋盘式街道；先农坛开放初期称城南公园。", "source": "特色：中轴线为核心、左右对称，宫城—皇城—内城—外城四重环套（里九外七皇城四），棋盘式街道；先农坛开放初期：城南公园"}, {"section": "北京的城市概况", "layer": "core", "type": "multi", "q": "关于北京市的地理概况，下列说法正确的有（ ）。", "options": ["A.位于华北平原西北端，东南邻天津、其余环河北，距渤海约150公里", "B.山地约占62%、平原约占38%，总面积16410.54平方公里", "C.最高峰为东灵山，海拔2303米", "D.年平均降水量约800—1000毫米", "E.属暖温带半干旱半湿润大陆性季风气候，夏季高温多雨、冬季寒冷干燥"], "answer": "ABCE", "explain": "D错误：年平均降水量约500—600毫米，约75%集中于6—9月。其余各项均正确。", "source": "华北平原西北端，东南邻天津、余环河北，距渤海约150公里；山地约62%＋平原约38%（总面积16410.54平方公里，最高东灵山2303米）；暖温带半干旱半湿润大陆性季风气候；年平均降水量约500—600毫米（约75%集中于6—9月）"}, {"section": "北京的城市概况", "layer": "core", "type": "single", "q": "关于元大都的营建，下列说法正确的是（ ）。", "options": ["A.遵循《周礼·考工记》\"左祖右社、面朝后市\"的原则，皇城城墙别称\"萧墙\"", "B.遵循\"右祖左社、前朝后市\"的原则", "C.由郭守敬主持规划设计", "D.元代在今北海西岸所建宫殿为隆福宫"], "answer": "A", "explain": "元大都由刘秉忠主持（郭守敬负责治水），遵循《周礼·考工记》\"左祖右社、面朝后市\"；皇城城墙别称\"萧墙\"，俗称\"红门阑马墙\"；今北海西岸宫殿为兴圣宫，其南为隆福宫（勿混：北兴圣、南隆福）。", "source": "营建原则：《周礼·考工记》\"左祖右社、面朝后市\"（刘秉忠主持）；皇城城墙别称\"萧墙\"（俗称\"红门阑马墙\"）；今北海西岸宫殿：兴圣宫（南为隆福宫）"}, {"section": "北京的城市概况", "layer": "core", "type": "judge", "q": "北京市地势东南高、西北低，西山与军都山在南口关沟相交，形成\"北京湾\"。", "answer": "错", "explain": "应为西北高、东南低；西山与军都山在南口关沟相交形成\"北京湾\"的表述正确。", "source": "地势：西北高、东南低（西山＋军都山在南口关沟相交，\"北京湾\"）"}, {"section": "北京的城市概况", "layer": "core", "type": "single", "q": "明清时期北京内城城门中的\"粮门\"是（ ）。", "options": ["A.崇文门", "B.朝阳门", "C.西直门", "D.阜成门"], "answer": "B", "explain": "朝阳门为\"粮门\"，崇文门为\"税门\"。", "source": "粮门：朝阳门、税门：崇文门"}, {"section": "北京的城市概况", "layer": "core", "type": "judge", "q": "元大都于1267年动工营建，1272年改称大都，1285年主要工程竣工，由刘秉忠总负责、郭守敬治水；1271年定国号大元、1272年定都大都，北京首次成为统一王朝的全国政治中心。", "answer": "对", "explain": "各时间节点及人物、地位表述均与背诵版一致。", "source": "1267年动工、1272年改称大都、1285年主要工程竣工（刘秉忠总负责、郭守敬治水）；全国政治中心：元代（1271年定国号大元、1272年定都大都，首次成为统一王朝的全国政治中心）"}, {"section": "北京的城市概况", "layer": "core", "type": "multi", "q": "关于北京市的水系与河湖，下列说法正确的有（ ）。", "options": ["A.五大水系为大清河、永定河、北运河、潮白河、蓟运河", "B.永定河被誉为北京的\"母亲河\"", "C.密云水库、官厅水库、怀柔水库、十三陵水库为大型水库", "D.昆明湖、北海、什刹海、玉渊潭为主要湖泊", "E.拒马河、泃河属于五大水系"], "answer": "ABCD", "explain": "E错误：拒马河、泃河是北京的主要河流，不属五大水系（五大水系为大清河、永定河、北运河、潮白河、蓟运河）。", "source": "五大水系：大清河、永定河、北运河、潮白河、蓟运河；主要河流：永定河（母亲河）、潮白河、北运河、拒马河、泃河等；湖泊：昆明湖、北海、什刹海、玉渊潭等；大型水库：密云水库、官厅水库、怀柔水库、十三陵水库等"}, {"section": "北京的城市概况", "layer": "core", "type": "single", "q": "清朝八旗在北京内城的分布中，驻防安定门的是（ ）。", "options": ["A.正黄旗", "B.镶黄旗", "C.正白旗", "D.镶白旗"], "answer": "B", "explain": "镶黄旗驻安定门、正黄旗驻德胜门、正白旗驻东直门、镶白旗驻朝阳门、正红旗驻西直门、镶红旗驻阜成门、正蓝旗驻崇文门、镶蓝旗驻宣武门。", "source": "八旗分布：镶黄安定门、正黄德胜门、正白东直门、镶白朝阳门、正红西直门、镶红阜成门、正蓝崇文门、镶蓝宣武门"}, {"section": "北京的城市概况", "layer": "core", "type": "single", "q": "关于\"北京建都纪念阙\"，下列说法正确的是（ ）。", "options": ["A.2003年9月20日落成于西城区广安门外滨河公园内、金中都大安殿遗址上，纪念北京建都850周年", "B.2003年落成于右安门外金中都水关遗址上，纪念建都800周年", "C.2004年9月20日落成于广安门外，纪念建都850周年", "D.阙身高20米，以青铜斗拱配六条青铜座龙"], "answer": "A", "explain": "纪念阙2003年9月20日落成，纪念北京建都850周年；通体青铜斗拱加四条青铜座龙，阙身高12米。", "source": "西城区广安门外滨河公园内、金中都大安殿遗址上；2003年9月20日落成；纪念北京建都850周年；青铜斗拱＋四条青铜座龙，阙身高12米"}, {"section": "北京的城市概况", "layer": "core", "type": "multi", "q": "关于北京城市功能定位与四合院保护，下列说法正确的有（ ）。", "options": ["A.功能定位为全国政治中心、文化中心、国际交往中心、科技创新中心", "B.发展目标是建设国际一流的和谐宜居之都", "C.空间结构为\"一核一主一副、两轴多点一区\"", "D.老城采取大规模拆除重建、成片开发的更新方式", "E.四合院保护采取申请式退租＋保护性修缮＋恢复性修建，\"一院一策\"、修旧如旧"], "answer": "ABCE", "explain": "D错误：北京坚持\"老城不能再拆\"，扩大历史文化街区保护范围、保护胡同四合院，实行小规模渐进式微更新。", "source": "\"四个中心\"：全国政治中心、文化中心、国际交往中心、科技创新中心；目标：国际一流的和谐宜居之都；空间结构\"一核一主一副、两轴多点一区\"；四合院保护：\"老城不能再拆\"、申请式退租＋保护性修缮＋恢复性修建、\"一院一策\"、修旧如旧"}, {"section": "北京的城市概况", "layer": "core", "type": "single", "q": "关于北京市的主要山脉，下列说法正确的是（ ）。", "options": ["A.西部为西山，属太行山；北部为军都山，属燕山", "B.西部为军都山，属燕山", "C.海坨山为北京最高峰", "D.雾灵山、云蒙山位于西部西山"], "answer": "A", "explain": "西部西山属太行山，北部军都山属燕山；重点山峰有东灵山、海坨山、百花山、雾灵山、云蒙山、妙峰山；最高峰为东灵山（2303米）。", "source": "山脉：西部西山（太行山）、北部军都山（燕山）；重点山峰：东灵山、海坨山、百花山、雾灵山、云蒙山、妙峰山"}, {"section": "北京的城市概况", "layer": "core", "type": "single", "q": "关于北京市行政区划与道路设计，下列说法正确的是（ ）。", "options": ["A.北京现辖15个市辖区", "B.2015年密云、延庆撤县设区后，北京现辖16个市辖区；老城区道路呈棋盘式，以中轴线为纵轴、长安街为横轴", "C.外围道路为纯放射式，不设环路", "D.老城区以长安街为纵轴、中轴线为横轴"], "answer": "B", "explain": "北京现辖16个市辖区；外围道路为环形加放射式（二环至六环）；老城区以中轴线为纵轴、长安街为横轴。", "source": "16个市辖区（2015年密云、延庆撤县设区）；道路：老城区棋盘式（以中轴线为纵轴、长安街为横轴），外围环形加放射式（二环至六环）"}, {"section": "北京的城市概况", "layer": "core", "type": "single", "q": "关于北京城市副中心，下列说法错误的是（ ）。", "options": ["A.设在通州，与雄安新区共同构成\"新两翼\"", "B.承接中心城区功能与人口疏解，规划承接40万—50万常住人口", "C.主导功能为行政办公、商务服务、文化旅游", "D.主导功能为重化工业与物流仓储"], "answer": "D", "explain": "副中心主导功能为行政办公＋商务服务＋文化旅游，D项错误。注意口径：承接40万—50万常住人口疏解 与 2035年常住人口130万人以内 是两个独立指标，不可混淆。", "source": "副中心（通州，\"新两翼\"之一，另一翼为雄安新区）：承接中心城区功能与人口疏解（2035年承接40万—50万人）、主导功能行政办公＋商务服务＋文化旅游、三个示范区"}, {"section": "北京的城市概况", "type": "single", "q": "20世纪90年代在王府井东方广场工地地下约12米处发现的古人类遗迹，距今约（ ）。", "options": ["A. 70万—20万年", "B. 2.4万—2.5万年", "C. 1万年", "D. 3000余年"], "answer": "B", "explain": "王府井东方广场遗址距今约2.4万—2.5万年，属旧石器时代晚期，是世界上首次在国际大都市中心区发现的旧石器时代晚期露天遗址。", "source": "20世纪90年代（1996年，北京大学岳升阳发现）在王府井东方广场工地地下约12米处发现的古人类遗迹，距今约2.4万—2.5万年（通称“约2.5万年”），属旧石器时代晚期", "layer": "ext"}, {"section": "北京的城市概况", "type": "judge", "q": "“北京人”（周口店直立人）生活在距今约70万—20万年前，属考古学上的旧石器时代晚期。", "answer": "错", "explain": "“北京人”属旧石器时代早期（直立人阶段），不是晚期；旧石器时代晚期对应的是王府井东方广场遗址（距今约2.5万年）。", "source": "“北京人”（周口店直立人）生活在距今约70万—20万年前，属考古学上的旧石器时代早期（直立人阶段），遗址在今房山区周口店龙骨山。", "layer": "ext"}, {"section": "北京的城市概况", "type": "multi", "q": "下列关于明清北京城的说法，正确的有（ ）。", "options": ["A. 明嘉靖三十二年（1553年）增筑外城后形成“凸”字形平面", "B. 城池呈宫城—皇城—内城—外城四重环套", "C. 中轴线南起永定门、北至钟鼓楼，全长约7.8公里", "D. 北京中轴线于2024年7月27日列入《世界遗产名录》", "E. 元大都中轴线大街宽58米"], "answer": "ABCD", "explain": "元大都中轴线大街宽28米，E项错误；其余四项均与原文相符。", "source": "城池呈宫城—皇城—内城—外城四重环套……明嘉靖三十二年（1553年）增筑外城后形成“凸”字形平面……元大都中轴线大街宽28米。明清北京城中轴线南起永定门、北至钟鼓楼，全长约7.8公里……（2024年7月27日列入《世界遗产名录》）", "layer": "ext"}, {"section": "北京的城市概况", "type": "single", "q": "西周时期，位于今天房山区琉璃河镇董家林的城市名为（ ）。", "options": ["A. 蓟", "B. 燕", "C. 幽州", "D. 武阳"], "answer": "B", "explain": "西周时位于今天广安门一带的城市名为蓟；位于房山区琉璃河镇董家林的城市名为燕（北燕），即琉璃河西周燕都遗址，是北京现存最早的城址。", "source": "位于今天房山区琉璃河镇董家林的城市名为燕（北燕，召公奭封国的都城，即琉璃河西周燕都遗址，北京现存最早的城址）", "layer": "ext"}, {"section": "北京的城市概况", "type": "judge", "q": "东胡林人遗址发现于北京市门头沟区斋堂镇东胡林村西，属新石器时代早期。", "answer": "对", "explain": "原文：东胡林人生活在距今约1万年，属新石器时代早期（新旧石器时代过渡阶段），发现地点为门头沟区斋堂镇东胡林村西。", "source": "东胡林人生活在距今约1万年（约11500—9000年前），属新石器时代早期（新旧石器时代过渡阶段），发现地点为北京市门头沟区斋堂镇东胡林村西", "layer": "ext"}, {"section": "北京的城市概况", "type": "single", "q": "北京地区在辽代的名称是（ ）。", "options": ["A. 幽州", "B. 南京", "C. 中都", "D. 大都"], "answer": "B", "explain": "唐代称幽州；辽代称南京（南京幽都府，1012年改称析津府，又称燕京）；金代称中都；元代称大都。", "source": "北京地区的历代名称：唐代称幽州（范阳节度使驻地，蓟城）；辽代称南京（南京幽都府，开泰元年即1012年改称析津府，又称燕京，为辽之陪都）；金代称中都", "layer": "ext"}, {"section": "北京的城市概况", "type": "judge", "q": "战国时期燕国所建的陪都是燕下都——武阳城，营建于易水之旁，在今河北易县。", "answer": "对", "explain": "原文明确：战国时期燕国所建的陪都是燕下都——武阳城（燕昭王时营建于易水之旁，在今河北易县），与上都蓟城相对。", "source": "战国时期燕国所建的陪都是燕下都——武阳城（燕昭王时营建于易水之旁，在今河北易县），与上都蓟城相对。", "layer": "ext"}, {"section": "北京的城市概况", "type": "multi", "q": "下列属于明清时期北京外城城门的有（ ）。", "options": ["A. 永定门", "B. 左安门", "C. 朝阳门", "D. 广渠门", "E. 东便门"], "answer": "ABDE", "explain": "明清北京外城城门共7座：永定门、左安门、右安门、广渠门、广安门、东便门、西便门；朝阳门是内城城门（“粮门”）。", "source": "明清时期北京外城城门共7座：永定门、左安门、右安门、广渠门、广安门（原广宁门）、东便门、西便门", "layer": "ext"}, {"section": "北京的城市概况", "type": "single", "q": "隋朝、唐朝先后多次出兵远征高句丽的皇帝是（ ）。", "options": ["A. 隋文帝与唐高祖", "B. 隋炀帝与唐太宗", "C. 隋炀帝与武则天", "D. 隋文帝与唐玄宗"], "answer": "B", "explain": "隋炀帝杨广三征高句丽，以涿郡即蓟城为前进基地；唐太宗李世民贞观十九年（645年）亲征。", "source": "隋朝、唐朝先后多次出兵远征高句丽的皇帝是隋炀帝杨广与唐太宗李世民（隋炀帝三征高句丽，以涿郡即蓟城为前进基地；唐太宗贞观十九年亲征）", "layer": "ext"}, {"section": "北京的城市概况", "type": "judge", "q": "公元645年，唐太宗为悼念东征高句丽阵亡将士，下诏在蓟城西建悯忠寺，即今北京法源寺。", "answer": "错", "explain": "悯忠寺建在蓟城（幽州城）东，不是城西；清代雍正十一年（1733年）敕修后改称法源寺。", "source": "公元645年，唐太宗东征高句丽还师幽州，为悼念阵亡将士、安抚忠烈亲属而下诏在蓟城（幽州城）东所建的寺庙名为悯忠寺", "layer": "ext"}, {"section": "北京的城市概况", "type": "single", "q": "悯忠寺前后历时51年，于武则天万岁通天元年落成并赐额，该年为（ ）。", "options": ["A. 645年", "B. 696年", "C. 1153年", "D. 1733年"], "answer": "B", "explain": "悯忠寺645年下诏始建，至武则天万岁通天元年（696年）落成并赐“悯忠”为额，前后历时51年；1733年（清雍正十一年）改称法源寺。", "source": "寺历经高宗、武后两朝续建，至武则天万岁通天元年（696年）落成并赐“悯忠”为额，前后历时51年，清代雍正十一年（1733年）敕修后改称法源寺", "layer": "ext"}, {"section": "北京的城市概况", "type": "judge", "q": "北京历史上第一次成为王朝的正式首都是在元代，1272年忽必烈定都大都。", "answer": "错", "explain": "北京第一次成为王朝正式首都是在金代——1153年海陵王完颜亮迁都燕京、改称中都；元代（1272年）是首次成为统一王朝的全国政治中心。", "source": "北京历史上第一次成为王朝的正式首都是在金代——金贞元元年（1153年）海陵王完颜亮迁都燕京、改称中都，是北京建都之始", "layer": "ext"}, {"section": "北京的城市概况", "type": "multi", "q": "下列关于北京地理概况的说法，正确的有（ ）。", "options": ["A. 北京位于华北平原西北端，距渤海约150公里", "B. 地势西北高、东南低，呈阶梯状下降", "C. 西部为燕山山脉，北部为太行山余脉", "D. 全市总面积16410.54平方公里", "E. 最高点东灵山海拔2303米"], "answer": "ABDE", "explain": "北京西部为太行山余脉西山，北部、东北部为燕山山脉军都山，C项方位颠倒；其余各项均与原文相符。", "source": "北京位于华北平原西北端……距渤海约150公里。地势特点：西北高、东南低……西部为太行山余脉西山，北部、东北部为燕山山脉军都山……全市总面积16410.54平方公里；最高点东灵山海拔2303米", "layer": "ext"}, {"section": "北京的城市概况", "type": "single", "q": "辽代“五京”中规模最大、人口最多的城市是（ ）。", "options": ["A. 上京临潢府", "B. 中京大定府", "C. 南京析津府", "D. 西京大同府"], "answer": "C", "explain": "辽代五京中，南京析津府（又称燕京，即今北京）规模最大、人口最多，城市人口约30万，城内划分为26坊。", "source": "其中规模最大、人口最多的城市是南京析津府（又称燕京，即今北京）……城市人口约30万，城内划分为26坊", "layer": "ext"}, {"section": "北京的城市概况", "type": "judge", "q": "在王府井东方广场工地发现的古人类遗迹属新石器时代早期，出土石制品、骨器、烧骨、炭灰坑等2000余件。", "answer": "错", "explain": "王府井东方广场遗址属旧石器时代晚期（距今约2.4万—2.5万年），不是新石器时代；新石器时代早期对应的是东胡林人遗址。", "source": "在王府井东方广场工地地下约12米处发现的古人类遗迹，距今约2.4万—2.5万年……属旧石器时代晚期，出土石制品、骨器、烧骨、炭灰坑等2000余件", "layer": "ext"}, {"section": "北京的城市概况", "type": "single", "q": "北京城区中遗存的辽代密檐式砖塔是（ ）。", "options": ["A. 天宁寺塔", "B. 妙应寺白塔", "C. 北海白塔", "D. 玉泉山塔"], "answer": "A", "explain": "天宁寺塔（原名天王寺舍利塔）位于今西城区广安门外天宁寺内，为八角十三层密檐式实心砖塔，建于辽天庆九年至十年（1119—1120年），是北京城区现存最古老的辽代密檐砖塔。", "source": "北京城区中遗存的辽代密檐式砖塔是天宁寺塔（原名天王寺舍利塔），位于今西城区广安门外天宁寺内，为八角十三层密檐式实心砖塔", "layer": "ext"}, {"section": "北京的城市概况", "type": "judge", "q": "元大都皇城城墙的别称是萧墙，俗称“红门阑马墙”，正门为棂星门，门前有千步廊。", "answer": "对", "explain": "原文明确：元大都皇城城墙的别称是萧墙，俗称“红门阑马墙”（周长约8.8公里，正门为棂星门，门前有千步廊）。", "source": "元大都皇城城墙的别称是萧墙，俗称“红门阑马墙”（周长约8.8公里，正门为棂星门，门前有千步廊）。", "layer": "ext"}, {"section": "北京的城市概况", "type": "multi", "q": "下列关于北京城市功能定位及城市规划的说法，正确的有（ ）。", "options": ["A. “四个中心”指全国政治中心、文化中心、国际交往中心、科技创新中心", "B. 发展目标是建设国际一流的和谐宜居之都", "C. 北京市下辖16个市辖区", "D. 老城区道路呈环形加放射式格局，外围为棋盘式格局", "E. 北京城市副中心位于通州，规划范围约155平方公里"], "answer": "ABCE", "explain": "老城区（二环以内）道路呈棋盘式格局，外围地区为环形加放射式格局，D项恰好说反。", "source": "城市战略定位为“四个中心”……发展目标是建设国际一流的和谐宜居之都……北京市下辖16个市辖区……老城区（二环以内）道路呈棋盘式（方格网）格局……外围地区为环形加放射式格局……规划范围约155平方公里", "layer": "ext"}, {"section": "北京的城市概况", "type": "single", "q": "营建元大都时所遵循的原则出自（ ）。", "options": ["A. 《营造法式》", "B. 《周礼·考工记》", "C. 《梦溪笔谈》", "D. 《天工开物》"], "answer": "B", "explain": "元大都营建遵循《周礼·考工记》记载的王城营国制度，由太保刘秉忠主持规划，并结合太液池水系灵活布局。", "source": "营建元大都所遵循的原则是《周礼·考工记》记载的王城营国制度……由太保刘秉忠主持规划", "layer": "ext"}, {"section": "北京的城市概况", "type": "judge", "q": "金中都修建时模仿的城市是南宋都城临安，宫殿规制仿临安皇宫，部分构件由临安掠运而来。", "answer": "错", "explain": "金中都模仿的是北宋都城东京汴梁（今河南开封），宫殿规制仿汴京皇宫，部分构件、陈设由汴京掠运而来，不是南宋临安。", "source": "金中都修建时模仿的城市是北宋都城东京汴梁（今河南开封），宫殿规制仿汴京皇宫，部分构件、陈设由汴京掠运而来。", "layer": "ext"}, {"section": "北京的城市概况", "type": "single", "q": "元代在太液池西岸营建的宫殿中，位于今北海西岸一带的是（ ）。", "options": ["A. 隆福宫", "B. 兴圣宫", "C. 大安殿", "D. 广寒殿"], "answer": "B", "explain": "太液池西岸南部为隆福宫（太子居所），北部为兴圣宫（皇太后居所）；位于今北海西岸一带的是兴圣宫。", "source": "南部为隆福宫（太子居所），北部为兴圣宫（皇太后居所）……其中位于今北海西岸一带的是兴圣宫", "layer": "ext"}, {"section": "北京的城市概况", "type": "judge", "q": "清朝八旗在北京内城的分布为：正黄旗驻安定门内，镶黄旗驻德胜门内。", "answer": "错", "explain": "应为镶黄旗驻安定门内、正黄旗驻德胜门内，题干将两旗门位对调了。", "source": "清朝八旗在北京内城的分布：镶黄旗驻安定门内，正黄旗驻德胜门内……（正阳门由八旗轮值）。", "layer": "ext"}, {"section": "北京的城市概况", "type": "multi", "q": "下列关于元大都营建的说法，正确的有（ ）。", "options": ["A. 遵循《周礼·考工记》记载的王城营国制度", "B. 由太保刘秉忠主持规划", "C. 太液池东岸为大内宫城，太庙在东、社稷坛在西", "D. 积水潭一带为商市", "E. 皇城城墙俗称“黄门阑马墙”"], "answer": "ABCD", "explain": "元大都皇城城墙俗称“红门阑马墙”而非“黄门阑马墙”，E项错误；其余各项均与原文相符。", "source": "由太保刘秉忠主持规划，并结合太液池水系灵活布局（东岸为大内宫城，太庙在东、社稷坛在西，积水潭一带为商市）。元大都皇城城墙的别称是萧墙，俗称“红门阑马墙”", "layer": "ext"}, {"section": "北京的城市概况", "type": "single", "q": "将都城从上京会宁府迁至燕京的金代皇帝是（ ）。", "options": ["A. 金太祖阿骨打", "B. 金世宗", "C. 海陵王完颜亮", "D. 金章宗"], "answer": "C", "explain": "海陵王完颜亮1151年下令扩建、1153年正式迁都燕京，改称中都，并毁上京宫殿宅第以绝退路。", "source": "将都城从上京会宁府（今黑龙江阿城）迁至燕京的金代皇帝是海陵王完颜亮（1151年下令扩建、1153年正式迁都，并毁上京宫殿宅第以绝退路）", "layer": "ext"}, {"section": "北京的城市概况", "type": "judge", "q": "“北京建都纪念阙”于2003年9月20日落成揭幕，阙身高12米，基座镌刻侯仁之先生撰写的《北京建都记》。", "answer": "对", "explain": "原文：纪念阙为纪念北京建都850周年（1153年金中都建立）而建，2003年9月20日落成揭幕，阙身高12米，基座镌刻侯仁之《北京建都记》。", "source": "于2003年9月20日正式落成揭幕……阙身高12米……基座镌刻侯仁之先生撰写的《北京建都记》，正前方地面上雕刻金中都大安殿遗址布局图。", "layer": "ext"}, {"section": "北京的城市概况", "type": "single", "q": "东胡林人生活在距今约（ ）。", "options": ["A. 70万—20万年前", "B. 2.4万—2.5万年前", "C. 1万年前", "D. 3000余年前"], "answer": "C", "explain": "东胡林人生活在距今约1万年（约11500—9000年前），属新石器时代早期；70万—20万年为“北京人”，2.4万—2.5万年为王府井遗址。", "source": "东胡林人生活在距今约1万年（约11500—9000年前），属新石器时代早期（新旧石器时代过渡阶段）", "layer": "ext"}, {"section": "北京的城市概况", "type": "multi", "q": "下列清朝八旗在北京内城的分布，正确的有（ ）。", "options": ["A. 镶黄旗驻安定门内", "B. 正黄旗驻德胜门内", "C. 正白旗驻东直门内", "D. 正蓝旗驻崇文门内", "E. 正红旗驻朝阳门内"], "answer": "ABCD", "explain": "正红旗驻西直门内而非朝阳门内（朝阳门内为镶白旗），E项错误；其余各组均与原文相符。", "source": "镶黄旗驻安定门内，正黄旗驻德胜门内，正白旗驻东直门内，镶白旗驻朝阳门内，正红旗驻西直门内……正蓝旗驻崇文门内，镶蓝旗驻宣武门内", "layer": "ext"}, {"section": "北京的城市概况", "type": "single", "q": "“北京人”（周口店直立人）在考古学上所处的时代是（ ）。", "options": ["A. 旧石器时代早期", "B. 旧石器时代晚期", "C. 新石器时代早期", "D. 新石器时代晚期"], "answer": "A", "explain": "“北京人”生活在距今约70万—20万年前，属旧石器时代早期（直立人阶段），遗址在今房山区周口店龙骨山。", "source": "“北京人”（周口店直立人）生活在距今约70万—20万年前，属考古学上的旧石器时代早期（直立人阶段），遗址在今房山区周口店龙骨山。", "layer": "ext"}, {"section": "北京的城市概况", "type": "single", "q": "北京作为城市出现，距今已有（ ）。", "options": ["A. 800余年", "B. 2000余年", "C. 3000余年", "D. 5000余年"], "answer": "C", "explain": "北京作为城市出现距今已有3000余年，以公元前1045年周武王灭商分封蓟、燕为建城之始计；“800多年”是建都史。", "source": "北京作为城市出现，距今已有3000余年（以公元前1045年周武王灭商分封蓟、燕为建城之始计）", "layer": "ext"}, {"section": "北京的城市概况", "type": "multi", "q": "下列属于北京五大水系的有（ ）。", "options": ["A. 大清河水系", "B. 永定河水系", "C. 北运河水系", "D. 潮白河水系", "E. 黄河水系"], "answer": "ABCD", "explain": "北京自西向东分布五大水系：大清河、永定河、北运河、潮白河、蓟运河水系，均属海河流域；黄河水系与北京无关。", "source": "北京属海河流域，自西向东分布五大水系——大清河水系（拒马河等）、永定河水系、北运河水系……潮白河水系……蓟运河水系（泃河等）。", "layer": "ext"}, {"section": "北京的城市概况", "type": "single", "q": "西周时期，位于今天广安门一带的城市名为（ ）。", "options": ["A. 燕", "B. 蓟", "C. 武阳", "D. 析津"], "answer": "B", "explain": "西周时位于今天广安门一带的城市名为蓟（蓟城，为北京城区之始）；位于房山区琉璃河镇董家林的城市名为燕。", "source": "西周时期，位于今天广安门一带的城市名为蓟（蓟城，武王封黄帝或尧之后裔于蓟，为北京城区之始）", "layer": "ext"}, {"section": "北京的城市概况", "type": "single", "q": "战国时期燕国所建陪都燕下都——武阳城，位于今（ ）。", "options": ["A. 北京市房山区", "B. 河北易县", "C. 河南开封", "D. 黑龙江阿城"], "answer": "B", "explain": "燕下都武阳城为燕昭王时营建于易水之旁，在今河北易县，与上都蓟城相对；注意其不在北京市域内。", "source": "战国时期燕国所建的陪都是燕下都——武阳城（燕昭王时营建于易水之旁，在今河北易县），与上都蓟城相对。", "layer": "ext"}, {"section": "北京的城市概况", "type": "multi", "q": "下列关于北京城市副中心的说法，正确的有（ ）。", "options": ["A. 位于通州，规划范围约155平方公里", "B. 与河北雄安新区并称北京“新两翼”", "C. 以行政办公、商务服务、文化旅游为主导功能", "D. 空间结构为“一带、一轴、多组团”", "E. 建设目的是扩大中心城区人口规模、强化首都核心功能"], "answer": "ABCD", "explain": "建设副中心是为了有序承接中心城区功能和人口疏解、示范带动非首都功能疏解，而非扩大中心城区人口，E项错误。", "source": "规划范围约155平方公里；建设目的是有序承接中心城区功能和人口疏解、示范带动非首都功能疏解……以行政办公、商务服务、文化旅游为主导功能……空间结构为“一带、一轴、多组团”", "layer": "ext"}, {"section": "北京的城市概况", "type": "single", "q": "北京地区在元代的名称是（ ）。", "options": ["A. 幽州", "B. 南京", "C. 中都", "D. 大都"], "answer": "D", "explain": "北京地区唐代称幽州、辽代称南京（析津府）、金代称中都、元代称大都（突厥语称“汗八里”）。", "source": "金代称中都（中都大兴府）；元代称大都（突厥语称“汗八里”）。", "layer": "ext"}, {"section": "北京的城市概况", "type": "single", "q": "北京城区遗存的辽代天宁寺塔，由（ ）奉旨主持建造。", "options": ["A. 秦晋国王耶律淳", "B. 海陵王完颜亮", "C. 太保刘秉忠", "D. 也黑迭儿"], "answer": "A", "explain": "天宁寺塔建于辽天祚帝天庆九年至十年（1119—1120年），由秦晋国王耶律淳奉旨主持建造；刘秉忠、也黑迭儿是元大都营建人物。", "source": "建于辽天祚帝天庆九年至十年（1119—1120年），由秦晋国王耶律淳奉旨主持建造，是北京城区现存最古老、最精美的辽代密檐砖塔", "layer": "ext"}, {"section": "北京的城市概况", "type": "single", "q": "元大都于元世祖至元四年正式动工兴建，该年为（ ）。", "options": ["A. 1264年", "B. 1267年", "C. 1271年", "D. 1272年"], "answer": "B", "explain": "元世祖至元四年（1267年）正月正式动工兴建新都城；1264年改燕京为中都，1271年定国号“大元”，1272年改中都为大都。", "source": "元世祖至元四年（1267年）正月正式动工兴建新都城（此前至元元年即1264年已改燕京为中都）……至元九年（1272年）改中都为大都。", "layer": "ext"}, {"section": "北京的城市概况", "type": "single", "q": "明清北京内城城门中的“粮门”是（ ）。", "options": ["A. 崇文门", "B. 朝阳门", "C. 西直门", "D. 阜成门"], "answer": "B", "explain": "“粮门”是朝阳门（原齐化门，漕粮经此入城）；“税门”是崇文门（原文明门，设税关）。", "source": "北京内城城门中的“粮门”是朝阳门（原齐化门，漕粮经此入城）；“税门”是崇文门（原文明门，设税关，为京城商贩主要通道）。", "layer": "ext"}, {"section": "北京的城市概况", "type": "single", "q": "华北地区最大的水库是（ ）。", "options": ["A. 官厅水库", "B. 密云水库", "C. 怀柔水库", "D. 十三陵水库"], "answer": "B", "explain": "密云水库是华北地区最大水库，最大库容43.75亿立方米，相当于67个十三陵水库或150个昆明湖。", "source": "密云水库（华北地区最大水库，最大库容43.75亿立方米，相当于67个十三陵水库或150个昆明湖）", "layer": "ext"}, {"section": "北京地区的世界文化遗产及人类非物质文化遗产代表作", "layer": "core", "type": "single", "q": "下列北京地区世界文化遗产与列入时间对应正确的是（ ）。", "options": ["A.颐和园——1998年（第22届世界遗产大会，京都）", "B.天坛——2003年", "C.明十三陵——2014年", "D.大运河——1998年"], "answer": "A", "explain": "天坛同为1998年（第22届，京都）；明十三陵2003年（\"明清皇家陵寝\"扩展项目，第27届）；大运河2014年（第38届，多哈）。", "source": "颐和园1998；天坛1998（第22届，京都）；明十三陵2003（\"明清皇家陵寝\"扩展项目，第27届）；大运河2014（第38届，多哈）"}, {"section": "北京地区的世界文化遗产及人类非物质文化遗产代表作", "layer": "core", "type": "judge", "q": "2024年7月27日，\"北京中轴线\"在第46届世界遗产大会（新德里）上列入《世界遗产名录》，全长7.8公里、含15处构成要素，北起永定门、南至钟鼓楼。", "answer": "错", "explain": "起止方向说反：应为北起钟鼓楼、南至永定门。中轴线始建于13世纪、形成于16世纪；其列入前北京拥有7处世界文化遗产。", "source": "北京中轴线2024年7月27日（第46届，新德里，全长7.8公里、15处构成要素，北起钟鼓楼南至永定门；始建于13世纪，形成于16世纪）（勿混：中轴线列入前为7处）"}, {"section": "北京地区的世界文化遗产及人类非物质文化遗产代表作", "layer": "core", "type": "multi", "q": "截至2026年6月，北京拥有8处世界文化遗产，是世界上拥有世界文化遗产最多的城市；其中1987年首批列入《世界遗产名录》的有（ ）。", "options": ["A.长城", "B.北京故宫", "C.周口店北京人遗址", "D.颐和园"], "answer": "ABC", "explain": "1987年首批三项（第11届世界遗产大会）：长城、北京故宫、周口店北京人遗址；颐和园、天坛为1998年（第22届，京都）；明十三陵2003年（\"明清皇家陵寝\"扩展项目，第27届）；大运河2014年（第38届，多哈）；北京中轴线2024年。", "source": "8处（世界拥有世界文化遗产最多的城市）；长城1987；北京故宫1987；周口店北京人遗址1987（首批三项，第11届世界遗产大会）"}, {"section": "北京地区的世界文化遗产及人类非物质文化遗产代表作", "layer": "core", "type": "single", "q": "光绪年间号称\"伶界大王\"的京剧演员是（ ）。", "options": ["A.程长庚", "B.余三胜", "C.谭鑫培", "D.张二奎"], "answer": "C", "explain": "谭鑫培创立谭派，1905年主演中国第一部电影《定军山》；程长庚、余三胜、张二奎为京剧\"前三杰\"；\"前四大须生\"为余叔岩、言菊朋、高庆奎、马连良，\"后四大须生\"为马连良、谭富英、杨宝森、奚啸伯。", "source": "光绪\"伶界大王\"：谭鑫培（谭派，1905年主演中国第一部电影《定军山》）；前三杰：程长庚、余三胜、张二奎"}, {"section": "北京地区的世界文化遗产及人类非物质文化遗产代表作", "layer": "core", "type": "judge", "q": "早期京剧由安徽徽剧（二黄）与湖北汉剧（西皮）融合而成，1840年前后正式形成，早期称\"皮黄戏\"；\"四大徽班\"中最早进京的是四喜班（1790年）。", "answer": "错", "explain": "最早进京的是三庆班：乾隆五十五年（1790年）高朗亭率班进京；四大徽班为三庆、四喜、春台、和春。另：西皮腔源于西北秦腔（梆子腔），经湖北襄阳成\"襄阳调\"、至汉水下游称\"西皮\"，高亢明亮；二黄腔源于湖北黄陂、黄冈一带（徽调），深沉凝重；道光年间\"徽汉合流\"形成核心声腔\"皮黄\"。", "source": "融合：安徽徽剧（二黄）＋湖北汉剧（西皮），1840年前后正式形成，早期称\"皮黄戏\"；四大徽班：三庆、四喜、春台、和春，最早进京三庆班（乾隆五十五年1790年，高朗亭率班进京）"}, {"section": "北京地区的世界文化遗产及人类非物质文化遗产代表作", "layer": "core", "type": "single", "q": "京剧\"四大名旦\"中，唱腔\"幽咽婉转、若断若续\"、长于悲剧的是（ ）。", "options": ["A.梅兰芳", "B.程砚秋", "C.尚小云", "D.荀慧生"], "answer": "B", "explain": "梅兰芳雍容华贵、典雅大方；程砚秋幽咽婉转、若断若续，长于悲剧；尚小云刚劲挺拔、高亢激越，\"文戏武唱\"；荀慧生俏丽轻盈、柔媚婉转，长于花旦。", "source": "四大名旦：梅兰芳（雍容华贵、典雅大方）、程砚秋（幽咽婉转、若断若续，长于悲剧）、尚小云（刚劲挺拔、高亢激越，\"文戏武唱\"）、荀慧生（俏丽轻盈、柔媚婉转，长于花旦）"}, {"section": "北京地区的世界文化遗产及人类非物质文化遗产代表作", "layer": "core", "type": "judge", "q": "北京皮影戏分东派（滦州影）与西派（涿州影），现存为西派；2008年列入第二批国家级非物质文化遗产名录（扩展项目）。", "answer": "对", "explain": "表述与背诵版一致：东派滦州影、西派涿州影，现存为西派；2008年列入第二批国家级非遗名录（扩展项目）。", "source": "分东派（滦州影）与西派（涿州影，现存为西派）……2008年列入第二批国家级非遗名录（扩展项目）"}, {"section": "北京地区的世界文化遗产及人类非物质文化遗产代表作", "layer": "core", "type": "multi", "q": "关于京剧的行当与脸谱，下列说法正确的有（ ）。", "options": ["A.京剧四大行当为生、旦、净、丑", "B.生行为男性角色，含老生（真声重唱功）、小生（真假声结合）、武生、红生、娃娃生", "C.旦行中的花衫由王瑶卿首创、梅兰芳发展", "D.脸谱中红色代表奸诈阴险，白色代表忠贞英勇"], "answer": "ABC", "explain": "D说反了：红＝忠贞英勇（关羽），白＝奸诈阴险（曹操）；此外黑＝刚正铁面（包拯、张飞）、紫＝刚正稳重、蓝＝刚强骁勇（窦尔敦）、绿＝勇猛莽撞（程咬金）、黄＝勇猛暴躁（典韦）、粉红＝年老忠勇（黄盖）、金银＝神佛仙怪。净行（花脸）分正净（重唱）、副净（重做功）、武净（重武打）；丑行鼻梁画\"豆腐块\"，分文丑、武丑（开口跳）。", "source": "四大行当：生、旦、净、丑；生行（男性）：老生（真声重唱功）、小生（真假声结合）……花衫（王瑶卿首创、梅兰芳发展）；红＝忠贞英勇（关羽）、白＝奸诈阴险（曹操）"}, {"section": "北京地区的世界文化遗产及人类非物质文化遗产代表作", "layer": "core", "type": "single", "q": "北京皮影戏的声腔主要吸收了（ ）的曲调。", "options": ["A.北方昆曲、京剧（皮黄）与北京地方曲艺（京韵大鼓、单弦、西河大鼓等鼓曲）", "B.江南丝竹与苏州评弹", "C.越剧与黄梅戏", "D.广东粤剧与闽南歌仔戏"], "answer": "A", "explain": "北京皮影戏声腔主要吸收北方昆曲、京剧（皮黄）及北京地方曲艺（京韵大鼓、单弦、西河大鼓等鼓曲）；早期另受陕西\"碗碗腔\"、河北\"老虎调\"（涿州影）影响；伴奏用京剧全堂锣鼓；影人造型吸收京剧脸谱与服饰。", "source": "主要吸收：北方昆曲、京剧（皮黄）、北京地方曲艺（京韵大鼓、单弦、西河大鼓等鼓曲）；早期另受陕西\"碗碗腔\"、河北\"老虎调\"（涿州影）影响；伴奏用京剧全堂锣鼓"}, {"section": "北京地区的世界文化遗产及人类非物质文化遗产代表作", "layer": "core", "type": "single", "q": "下列中国非遗项目与列入《世界非物质文化遗产名录》时间对应正确的是（ ）。", "options": ["A.昆曲——2001年（首批\"人类口头和非物质遗产代表作\"）", "B.古琴艺术——2001年（第二批）", "C.京剧——2009年", "D.端午节——2010年"], "answer": "A", "explain": "古琴艺术为2003年11月7日（第二批；昆曲、古琴以首次宣布年份2001／2003为准，非2008年转隶年份）；中国篆刻、中国书法、端午节均为2009年9月（第四届常会，阿布扎比）；京剧、中医针灸为2010年11月（第五届常会，内罗毕）。", "source": "昆曲2001年5月18日（首批\"人类口头和非物质遗产代表作\"）；古琴艺术2003年11月7日（第二批）；中国篆刻2009年9月（第四届常会，阿布扎比）；中国书法2009年9月；端午节2009年9月；京剧2010年11月（第五届常会，内罗毕）；中医针灸2010年11月"}, {"section": "北京地区的世界文化遗产及人类非物质文化遗产代表作", "layer": "core", "type": "multi", "q": "二十四节气所体现的中国古代哲学思想包括（ ）。", "options": ["A.\"天人合一\"的宇宙观", "B.顺天应时、顺应自然规律（\"不违农时\"）的实践观", "C.阴阳消长、阴阳平衡的辩证思想（冬至一阳生、夏至一阴生，物极必反）", "D.\"人定胜天\"、征服改造自然的斗争观"], "answer": "ABC", "explain": "此外还包括：五行相生相克、四时配属的系统观；\"致中和\"、中庸和谐的价值取向；人与自然和谐相处、尊重生命的可持续发展智慧。二十四节气2016年11月30日列入人类非遗代表作名录（第十一届常会，亚的斯亚贝巴），誉称\"中国的第五大发明\"。", "source": "①\"天人合一\"宇宙观（核心）；②顺天应时、顺应自然规律的实践观（\"不违农时\"）；③阴阳消长、阴阳平衡的辩证思想；④五行相生相克；⑤\"致中和\"；⑥人与自然和谐相处"}, {"section": "北京地区的世界文化遗产及人类非物质文化遗产代表作", "layer": "core", "type": "single", "q": "下列中国非遗项目与列入时间对应正确的是（ ）。", "options": ["A.中国皮影戏——2011年11月（第六届常会，巴厘岛）", "B.中国珠算——2011年12月", "C.太极拳——2016年12月", "D.春节——2022年12月"], "answer": "A", "explain": "中国珠算为2013年12月（第八届常会，巴库）；二十四节气为2016年11月30日（第十一届常会）；太极拳为2020年12月17日（第十五届常会，线上）；中国传统制茶技艺及其相关习俗为2022年11月29日（第十七届常会，拉巴特）；春节为2024年12月4日（第十九届常会，亚松森）。中国2004年8月加入《公约》，2009年首次参评一次入选22项；截至2024年12月共44项、2025年达45项，居世界第一。", "source": "中国皮影戏2011年11月（第六届常会，巴厘岛）；中国珠算2013年12月（第八届常会，巴库）；太极拳2020年12月17日（第十五届常会，线上）；春节2024年12月4日（第十九届常会，亚松森）"}, {"section": "北京地区的世界文化遗产及人类非物质文化遗产代表作", "type": "single", "q": "北京地区的世界文化遗产中，列入时间最晚的是（ ）。", "options": ["A. 明十三陵", "B. 大运河（北京段）", "C. 北京中轴线", "D. 天坛"], "answer": "C", "explain": "北京中轴线于2024年7月27日列入；大运河（北京段）2014年列入；明十三陵2003年列入；天坛1998年列入。", "source": "（8）北京中轴线——中国理想都城秩序的杰作：2024年7月27日列入。", "layer": "ext"}, {"section": "北京地区的世界文化遗产及人类非物质文化遗产代表作", "type": "judge", "q": "截至2026年6月，北京地区共有8处世界文化遗产，是世界上拥有世界文化遗产数量最多的城市。", "answer": "对", "explain": "原文明确：截至2026年6月，北京地区共有8处世界文化遗产，是世界上拥有世界文化遗产数量最多的城市。", "source": "截至2026年6月，北京地区共有8处世界文化遗产，是世界上拥有世界文化遗产数量最多的城市。", "layer": "ext"}, {"section": "北京地区的世界文化遗产及人类非物质文化遗产代表作", "type": "multi", "q": "下列北京地区的世界文化遗产中，于1987年12月列入《世界遗产名录》的有（ ）。", "options": ["A. 长城（北京段）", "B. 北京故宫（明清皇宫）", "C. 周口店北京人遗址", "D. 颐和园", "E. 天坛"], "answer": "ABC", "explain": "1987年12月列入的为长城（北京段）、北京故宫、周口店北京人遗址三项；颐和园和天坛均为1998年列入。", "source": "（1）长城（北京段）：1987年12月列入。（2）北京故宫（明清皇宫）：1987年12月列入。（3）周口店北京人遗址：1987年12月列入。", "layer": "ext"}, {"section": "北京地区的世界文化遗产及人类非物质文化遗产代表作", "type": "single", "q": "早期京剧主要由安徽的徽剧与（ ）的汉剧两个地方的戏剧品种在北京融合而成。", "options": ["A. 湖南", "B. 湖北", "C. 河南", "D. 江苏"], "answer": "B", "explain": "京剧主要由安徽的徽剧（徽调、二黄腔）与湖北的汉剧（汉调／楚调、西皮腔）融合而成，故早期又称“皮黄戏”。", "source": "京剧主要由安徽的徽剧（徽调、二黄腔）与湖北的汉剧（汉调／楚调、西皮腔）两个地方的戏剧品种在北京融合而成", "layer": "ext"}, {"section": "北京地区的世界文化遗产及人类非物质文化遗产代表作", "type": "judge", "q": "颐和园与天坛均于1998年列入《世界遗产名录》。", "answer": "对", "explain": "颐和园1998年列入，天坛1998年列入；长城、北京故宫、周口店北京人遗址均为1987年12月列入。", "source": "（4）颐和园：1998年列入。（5）天坛：1998年列入。", "layer": "ext"}, {"section": "北京地区的世界文化遗产及人类非物质文化遗产代表作", "type": "single", "q": "光绪年间号称“伶界大王”、1905年主演中国第一部电影《定军山》的京剧演员是（ ）。", "options": ["A. 程长庚", "B. 谭鑫培", "C. 余叔岩", "D. 梅兰芳"], "answer": "B", "explain": "谭鑫培（1847—1917），老生行当，创立“谭派”，光绪年间号称“伶界大王”，1905年主演中国第一部电影《定军山》。", "source": "光绪年间号称“伶界大王”的演员：谭鑫培（1847—1917），老生行当，创立“谭派”……1905年主演中国第一部电影《定军山》", "layer": "ext"}, {"section": "北京地区的世界文化遗产及人类非物质文化遗产代表作", "type": "judge", "q": "“四大徽班”中最早进京的是四喜班，清乾隆五十五年（1790年）由高朗亭率班自扬州进京献艺。", "answer": "错", "explain": "最早进京的是三庆班，不是四喜班；1790年安徽安庆籍名伶高朗亭率三庆班自扬州进京，史称“徽班进京”。", "source": "其中最早进京的是三庆班——清乾隆五十五年（1790年），为祝贺乾隆皇帝八旬寿辰，由安徽安庆籍名伶高朗亭（时年16岁）率三庆班自扬州进京献艺",
