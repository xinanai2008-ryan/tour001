plain": "2024年第五批新增10家，北京一级博物馆由18家增至28家。", "source": "2024年第五批新增10家（18家增至28家）"}, {"section": "北京地区的主要博物馆", "layer": "core", "type": "judge", "q": "国际博物馆日为每年5月18日，由国际博物馆协会于1978年确定，自1977年起每年举办活动。", "answer": "错", "explain": "年份被故意颠倒。正确表述为：1977年国际博物馆协会确定每年5月18日为国际博物馆日，自1978年起每年举办活动。", "source": "每年5月18日（1977年国际博物馆协会确定，1978年起每年举办活动）"}, {"section": "北京地区的主要博物馆", "layer": "core", "type": "multi", "q": "下列关于中国国家博物馆的说法，正确的有（ ）。", "options": ["前身为1912年成立的国立历史博物馆筹备处", "2003年由中国革命博物馆与中国历史博物馆合并组建", "是世界上单体建筑面积最大的现代化综合性博物馆", "现有藏品143万余件"], "answer": "ABCD", "explain": "四项均与原文一致。其建筑面积近20万平方米（亦有19.2万平方米表述）。", "source": "前身1912年国立历史博物馆筹备处；2003年合并组建；世界上单体建筑面积最大的现代化综合性博物馆；藏品143万余件"}, {"section": "北京地区的主要博物馆", "layer": "core", "type": "single", "q": "下列哪一项不属于中国铁道博物馆的组成部分？（ ）", "options": ["正阳门展馆", "东郊展馆", "詹天佑纪念馆", "新文化运动纪念馆馆区"], "answer": "D", "explain": "中国铁道博物馆由三个展馆组成：正阳门展馆、东郊展馆、詹天佑纪念馆。新文化运动纪念馆馆区属于北京鲁迅博物馆。", "source": "三个展馆（正阳门展馆、东郊展馆、詹天佑纪念馆）"}, {"section": "北京地区的主要博物馆", "layer": "core", "type": "judge", "q": "截至2025年底，北京地区一级博物馆共28家，居全国各城市首位；全国一级博物馆共237家。", "answer": "错", "explain": "前半句正确，但全国一级博物馆数量被改错，应为327家，而非237家。", "source": "28家，居全国各城市首位；全国一级博物馆共327家"}, {"section": "北京地区的主要博物馆", "layer": "core", "type": "single", "q": "创建于1916年的中国地质博物馆，收藏各类标本约（ ）。", "options": ["55万余件", "143万余件", "近5万件（套）", "32000余件"], "answer": "A", "explain": "中国地质博物馆收藏各类标本55万余件。143万余件是中国国家博物馆藏品数，近5万件（套）是民族文化宫藏品数，32000余件是中国海关博物馆藏品数。", "source": "中国地质博物馆创建的时间：1916年；中国地质博物馆收藏各类标本的数量：55万余件"}, {"section": "北京地区的主要博物馆", "layer": "core", "type": "judge", "q": "中国国家博物馆于2003年由中国革命博物馆与中国历史博物馆合并组建，建筑面积约30万平方米。", "answer": "错", "explain": "合并组建表述正确，但建筑面积被改错，应为近20万平方米（亦有19.2万平方米表述），而非30万平方米。", "source": "2003年中国革命博物馆与中国历史博物馆合并组建；建筑面积近20万平方米（亦有19.2万平方米表述）"}, {"section": "北京地区的主要博物馆", "layer": "core", "type": "multi", "q": "下列关于首都博物馆的说法，正确的有（ ）。", "options": ["建筑设计理念为以人为本，以文物为本，为社会服务", "追求过去与未来、历史与现代、艺术与自然的和谐统一", "\"北京通史陈列\"展出文物1100余件（套）", "建筑设计以追求经济效益为首要目标"], "answer": "ABC", "explain": "A、B为首博建筑设计理念，C为\"北京通史陈列\"展出文物数量，均正确；D原文无据，错误。", "source": "以人为本，以文物为本，为社会服务；过去与未来、历史与现代、艺术与自然的和谐统一；1100余件（套）"}, {"section": "北京地区的主要博物馆", "layer": "core", "type": "single", "q": "中国第一个综合类军事博物馆是（ ）。", "options": ["中国人民革命军事博物馆", "中国人民抗日战争纪念馆", "中国国家博物馆", "首都博物馆"], "answer": "A", "explain": "中国人民革命军事博物馆是中国第一个综合类军事博物馆。", "source": "中国第一个综合类军事博物馆：中国人民革命军事博物馆"}, {"section": "北京地区的主要博物馆", "layer": "core", "type": "judge", "q": "首都博物馆青铜展馆斜出墙面，寓意古代文物破土而出；屋盖继承了中国传统建筑的深远挑檐。", "answer": "对", "explain": "表述与原文一致：青铜展馆斜出墙面寓意古代文物破土而出，屋盖继承中国传统建筑深远挑檐。", "source": "青铜展馆斜出墙面寓意古代文物破土而出；屋盖继承中国传统建筑深远挑檐"}, {"section": "北京地区的主要博物馆", "layer": "core", "type": "single", "q": "全国唯一一座全面反映中国人民抗日战争历史的大型综合性纪念馆是（ ）。", "options": ["中国人民革命军事博物馆", "中国人民抗日战争纪念馆", "北京鲁迅博物馆（北京新文化运动纪念馆）", "中国国家博物馆"], "answer": "B", "explain": "中国人民抗日战争纪念馆是全国唯一一座全面反映中国人民抗日战争历史的大型综合性纪念馆。", "source": "全国唯一一座全面反映中国人民抗日战争历史的大型综合性纪念馆：中国人民抗日战争纪念馆"}, {"section": "北京地区的主要博物馆", "layer": "core", "type": "judge", "q": "北京鲁迅博物馆（北京新文化运动纪念馆）于2014年7月合并，现有鲁迅博物馆馆区和新文化运动纪念馆馆区两个馆区。", "answer": "对", "explain": "表述与原文一致：2014年7月合并，设两个馆区（鲁迅博物馆馆区、新文化运动纪念馆馆区）。", "source": "北京鲁迅博物馆（北京新文化运动纪念馆），2014年7月合并，两个馆区（鲁迅博物馆馆区、新文化运动纪念馆馆区）"}, {"section": "北京地区的主要博物馆", "layer": "core", "type": "multi", "q": "下列关于北京考古遗址博物馆及其相关遗址的说法，正确的有（ ）。", "options": ["由琉璃河遗址、大葆台西汉墓遗址、金中都水关遗址三址组成，2021年6月整合组建", "琉璃河遗址属西周时期", "金中都水关遗址是现存考古发掘出土的体量最大的中国古代都城水关遗址", "大葆台汉墓墓主人为西汉广阳顷王刘建及其王后"], "answer": "ABCD", "explain": "四项均与原文一致：北京考古遗址博物馆为一馆三址，2021年6月整合组建；琉璃河遗址属西周时期；金中都水关遗址体量最大；大葆台汉墓墓主为西汉广阳顷王刘建及其王后。", "source": "一馆三址（琉璃河遗址、大葆台西汉墓遗址、金中都水关遗址，2021年6月整合组建）；西汉广阳顷王刘建及其王后；西周时期；金中都水关遗址"}, {"section": "北京地区的主要博物馆", "layer": "core", "type": "single", "q": "新中国成立后，我国首次发现的\"黄肠题凑\"墓是（ ）。", "options": ["北京大葆台西汉墓一号墓", "北京大葆台西汉墓二号墓", "琉璃河遗址西周墓", "金中都水关遗址"], "answer": "A", "explain": "新中国成立后我国首次发现的\"黄肠题凑\"墓是北京大葆台西汉墓一号墓。", "source": "新中国成立后，我国首次发现的\"黄肠题凑\"墓：北京大葆台西汉墓一号墓"}, {"section": "北京地区的主要博物馆", "layer": "core", "type": "single", "q": "1957年开放的、我国和亚洲大陆第一座大型天文馆是（ ）。", "options": ["北京天文馆", "中国地质博物馆", "北京汽车博物馆", "中国电影博物馆"], "answer": "A", "explain": "北京天文馆1957年开放，是我国和亚洲大陆的第一座大型天文馆。", "source": "我国和亚洲大陆的第一座大型天文馆：北京天文馆（1957年开放）"}, {"section": "北京地区的主要博物馆", "layer": "core", "type": "multi", "q": "下列关于北京地区专题博物馆的说法，正确的有（ ）。", "options": ["中国妇女儿童博物馆建筑顶部呈波浪曲线型轮廓，象征妇女的柔媚多姿", "中国电影博物馆为纪念中国电影诞生100周年而建", "中国海关博物馆现有藏品32000余件，其中珍贵文物1500件（套）", "民族文化宫收藏各民族各时代藏品近5万件（套），涵盖现有56个民族"], "answer": "ABCD", "explain": "四项均与原文一致。", "source": "波浪曲线型轮廓，象征妇女的柔媚多姿；32000余件（珍贵文物1500件（套））；各民族各时代藏品近5万件（套）、涵盖现有56个民族；纪念中国电影诞生100周年"}, {"section": "北京地区的主要博物馆", "layer": "core", "type": "single", "q": "2026年北京南中轴地区首个完成筹备工作正式面向公众开放、同时也是北京市丰台区利用疏解腾退空间引入的首个民营博物馆是（ ）。", "options": ["北京市自然昆虫博物馆", "北京汽车博物馆", "北京鲁迅博物馆", "首都博物馆"], "answer": "A", "explain": "两问指的是同一座馆——北京市自然昆虫博物馆。", "source": "北京市自然昆虫博物馆（两问为同一座馆）"}, {"section": "北京地区的主要博物馆", "layer": "core", "type": "single", "q": "北京汽车博物馆的建筑造型寓意是（ ）。", "options": ["像一只明亮的\"眼睛\"，寓意\"放眼世界、面向未来\"", "斜出墙面，寓意古代文物破土而出", "继承中国传统建筑的深远挑檐", "呈波浪曲线型轮廓，象征柔媚多姿"], "answer": "A", "explain": "北京汽车博物馆建筑造型像一只明亮的\"眼睛\"，寓意\"放眼世界、面向未来\"；其职能为博物馆、展览馆、科技馆\"三位一体\"。B、C为首都博物馆特点，D为中国妇女儿童博物馆特点。", "source": "博物馆、展览馆、科技馆\"三位一体\"；一只明亮的\"眼睛\"，寓意\"放眼世界、面向未来\""}, {"section": "北京地区的主要博物馆", "layer": "core", "type": "multi", "q": "北京汽车博物馆作为国有公益性汽车专题博物馆，履行的职责包括（ ）。", "options": ["A. 收藏展示与藏品管理", "B. 公共教育与科普传播", "C. 学术研究与文化推广", "D. 国际交流与开放服务", "E. 机动车驾驶技能培训"], "answer": "ABCD", "explain": "北京汽车博物馆履行收藏展示与藏品管理、公共教育与科普传播、学术研究与文化推广、国际交流与开放服务等职责。机动车驾驶技能培训不属于其职能范畴。", "source": "北京汽车博物馆……履行收藏展示与藏品管理、公共教育与科普传播、学术研究与文化推广、国际交流与开放服务等职责。位于丰台区南四环西路126号，2011年建成开放。", "patch": true}, {"section": "北京地区的主要博物馆", "layer": "core", "type": "single", "q": "北京汽车博物馆集（ ）'三位一体'的职能，是中国国家公益性汽车专题博物馆。", "options": ["A. 博物馆、展览馆、科技馆", "B. 博物馆、图书馆、文化馆", "C. 博物馆、美术馆、档案馆", "D. 博物馆、规划馆、科技馆"], "answer": "A", "explain": "北京汽车博物馆集博物馆、展览馆、科技馆'三位一体'的职能，位于丰台区南四环西路126号，2011年建成开放。", "source": "北京汽车博物馆的职能：集博物馆、展览馆、科技馆'三位一体'的职能，是中国国家公益性（国有公益性）汽车专题（主题）博物馆。", "patch": true}, {"section": "北京地区的主要博物馆", "type": "single", "q": "中国国家博物馆现有藏品数量为（ ）。", "options": ["A. 81.5万件", "B. 100万余件", "C. 143万余件", "D. 180万余件"], "answer": "C", "explain": "国博官网现行口径为藏品143万余件，涵盖古代文物、近现当代文物、艺术品等多种门类；建筑面积近20万平方米，拥有48个标准展厅。", "source": "现有藏品数量：143万余件，涵盖古代文物、近现当代文物、艺术品等多种门类。", "layer": "ext"}, {"section": "北京地区的主要博物馆", "type": "judge", "q": "国际博物馆日为每年的5月18日，由国际博物馆协会（ICOM）于1977年正式确定并宣布。", "answer": "对", "explain": "原文明确：国际博物馆日为每年5月18日，由国际博物馆协会（ICOM）于1977年正式确定并宣布，自1978年起每年组织庆祝活动。", "source": "时间：每年的5月18日。设立：由国际博物馆协会（ICOM）于1977年正式确定并宣布……自1978年起，国际博物馆协会每年组织庆祝活动", "layer": "ext"}, {"section": "北京地区的主要博物馆", "type": "multi", "q": "下列属于2024年第五批全国博物馆定级评估中北京新增国家一级博物馆的有（ ）。", "options": ["A. 中国华侨历史博物馆", "B. 中国海关博物馆", "C. 中国铁道博物馆", "D. 香山革命纪念馆", "E. 首都博物馆"], "answer": "ABCD", "explain": "第五批新增10家包括中国华侨历史博物馆、中国妇女儿童博物馆、中国海关博物馆、宋庆龄故居、民族文化宫、民航博物馆、中国现代文学馆、中国铁道博物馆、中国园林博物馆、香山革命纪念馆；首都博物馆为原有18家之一。", "source": "第五批新增的10家：中国华侨历史博物馆、中国妇女儿童博物馆、中国海关博物馆、中华人民共和国名誉主席宋庆龄同志故居、民族文化宫、民航博物馆、中国现代文学馆、中国铁道博物馆、中国园林博物馆、香山革命纪念馆", "layer": "ext"}, {"section": "北京地区的主要博物馆", "type": "single", "q": "首都博物馆“北京通史陈列”展出文物数量为（ ）。", "options": ["A. 759件", "B. 1100余件（套）", "C. 1500件（套）", "D. 1793件（套）"], "answer": "B", "explain": "《中华文明的有力见证——北京通史陈列》于2024年2月10日对外开放，展出文物1100余件（套），面积4900平方米。", "source": "“北京通史陈列”展出文物数量：1100余件（套）。基本陈列……于2024年2月10日（农历大年初一）对外开放，位于方形展厅二、三、四层，面积4900平方米", "layer": "ext"}, {"section": "北京地区的主要博物馆", "type": "judge", "q": "截至2025年底，北京地区共有18家国家一级博物馆，居全国各城市首位。", "answer": "错", "explain": "截至2025年底北京有28家一级博物馆（原有18家，2024年第五批新增10家），居全国各城市首位；18家为旧口径，须以28家为准。", "source": "数量：28家，居全国各城市首位……北京原有18家国家一级博物馆；2024年第五批全国博物馆定级评估中，北京新增10家……总数由18家增至28家", "layer": "ext"}, {"section": "北京地区的主要博物馆", "type": "single", "q": "中国海关博物馆现有藏品数量为（ ）。", "options": ["A. 近5万件（套）", "B. 32000余件", "C. 18万余件（套）", "D. 3万件（套）"], "answer": "B", "explain": "中国海关博物馆现有藏品32000余件，其中珍贵文物1500件（套），涵盖从战国时期至当代的海关重要文物；近5万件（套）为民族文化宫藏品数。", "source": "中国海关博物馆现有的藏品数量：32000余件，其中珍贵文物1500件（套），涵盖从战国时期至当代各个历史时期的海关重要文物", "layer": "ext"}, {"section": "北京地区的主要博物馆", "type": "judge", "q": "中国国家博物馆由中国革命博物馆和中国历史博物馆于2003年2月合并组建而成。", "answer": "对", "explain": "原文：新中国成立后，在天安门广场东侧新建中国革命博物馆和中国历史博物馆；2003年2月，两馆合并组建中国国家博物馆。", "source": "新中国成立后，在天安门广场东侧新建中国革命博物馆和中国历史博物馆；2003年2月，两馆合并组建中国国家博物馆。", "layer": "ext"}, {"section": "北京地区的主要博物馆", "type": "multi", "q": "中国铁道博物馆下设的展馆包括（ ）。", "options": ["A. 正阳门展馆", "B. 东郊展馆", "C. 詹天佑纪念馆", "D. 卢沟桥展馆", "E. 八达岭展馆"], "answer": "ABC", "explain": "中国铁道博物馆下设三个展馆：正阳门展馆、东郊展馆（中国最大的铁路机车车辆陈列馆）、詹天佑纪念馆（延庆区八达岭特区）。", "source": "中国铁道博物馆的组成：下设三个展馆——正阳门展馆……东郊展馆……詹天佑纪念馆（延庆区八达岭特区，为纪念爱国工程师詹天佑而建的专题人物纪念馆）", "layer": "ext"}, {"section": "北京地区的主要博物馆", "type": "single", "q": "中国电影博物馆建造的原因是（ ）。", "options": ["A. 纪念中国电影诞生100周年", "B. 纪念新中国成立50周年", "C. 纪念五四运动100周年", "D. 纪念北京建都850周年"], "answer": "A", "explain": "中国电影博物馆为纪念中国电影诞生100周年而建，是目前世界上最大的国家级电影专业博物馆。", "source": "中国电影博物馆建造的原因：为纪念中国电影诞生100周年而建……也是目前世界上最大的国家级电影专业博物馆", "layer": "ext"}, {"section": "北京地区的主要博物馆", "type": "judge", "q": "北京大葆台汉墓的墓主人是西汉广阳顷王刘建，他是汉武帝之子、燕剌王刘旦之孙。", "answer": "错", "explain": "刘建是汉武帝之孙、燕剌王刘旦之子，题干把辈分颠倒了；一号墓为刘建之墓，二号墓为其王后之墓。", "source": "刘建是汉武帝之孙、燕剌王刘旦之子，第一代广阳王，在位29年，死后谥号“顷王”。", "layer": "ext"}, {"section": "北京地区的主要博物馆", "type": "single", "q": "中国成立最早的国家级地学博物馆、中国人自己创办的第一个公立自然科学博物馆是创建于1916年的（ ）。", "options": ["A. 北京自然博物馆", "B. 中国地质博物馆", "C. 中国科技馆", "D. 北京天文馆"], "answer": "B", "explain": "中国地质博物馆创建于1916年（1916年7月），是中国成立最早的国家级地学博物馆，也是中国人自己创办的第一个公立自然科学博物馆。", "source": "中国地质博物馆创建的时间：创建于1916年（1916年7月），是中国成立最早的国家级地学博物馆，也是中国人自己创办的第一个公立自然科学博物馆", "layer": "ext"}, {"section": "北京地区的主要博物馆", "type": "judge", "q": "北京天文馆是我国和亚洲大陆的第一座大型天文馆，于1957年正式对外开放。", "answer": "对", "explain": "原文：我国和亚洲大陆的第一座大型天文馆是北京天文馆，位于西城区西直门外大街138号，于1957年（1957年9月29日）正式对外开放。", "source": "我国和亚洲大陆的第一座大型天文馆：北京天文馆。位于西城区西直门外大街138号，于1957年（1957年9月29日）正式对外开放。", "layer": "ext"}, {"section": "北京地区的主要博物馆", "type": "multi", "q": "下列关于北京考古遗址博物馆的说法，正确的有（ ）。", "options": ["A. 为“一馆三址”，于2021年6月整合组建", "B. 三址包括琉璃河遗址、大葆台西汉墓遗址、金中都水关遗址", "C. 琉璃河遗址位于房山区，见证北京建城3000年", "D. 金中都水关遗址是现存考古发掘出土的体量最大的中国古代都城水关遗址", "E. 周口店遗址博物馆是其三址之一"], "answer": "ABCD", "explain": "周口店遗址博物馆为独立建制，不属北京考古遗址博物馆，E项错误；其余四项均与原文相符。", "source": "为“一馆三址”……三址为：琉璃河遗址（房山区琉璃河镇董家林村），见证北京建城3000年；大葆台西汉墓遗址……金中都水关遗址……现存考古发掘出土的体量最大的中国古代都城水关遗址：金中都水关遗址", "layer": "ext"}, {"section": "北京地区的主要博物馆", "type": "single", "q": "中国第一个综合类军事博物馆是（ ）。", "options": ["A. 中国人民抗日战争纪念馆", "B. 中国人民革命军事博物馆", "C. 中国航空博物馆", "D. 香山革命纪念馆"], "answer": "B", "explain": "中国人民革命军事博物馆（军博）位于海淀区复兴路9号，1960年8月1日正式开放，是向国庆10周年献礼的首都十大建筑之一。", "source": "中国第一个综合类军事博物馆：中国人民革命军事博物馆（简称“军博”）。位于北京市海淀区复兴路9号……1960年8月1日（建军节）正式开放", "layer": "ext"}, {"section": "北京地区的主要博物馆", "type": "judge", "q": "2024年国际博物馆日的主题是“快速变化社会中的博物馆未来”。", "answer": "错", "explain": "“快速变化社会中的博物馆未来”是2025年的主题；2024年主题为“博物馆致力于教育和研究”。", "source": "近年主题示例：2024年主题为“博物馆致力于教育和研究”；2025年主题为“快速变化社会中的博物馆未来”。", "layer": "ext"}, {"section": "北京地区的主要博物馆", "type": "single", "q": "新中国成立后，我国首次发现的“黄肠题凑”墓是（ ）。", "options": ["A. 琉璃河燕国墓", "B. 北京大葆台西汉墓", "C. 明定陵", "D. 金中都水关遗址"], "answer": "B", "explain": "北京大葆台西汉墓（一号墓）是国内首座得到确认的“黄肠题凑”墓葬，一号墓共用柏木条约15880根。", "source": "新中国成立后，我国首次发现的“黄肠题凑”墓：北京大葆台西汉墓（一号墓），是国内首座得到确认的“黄肠题凑”墓葬……一号墓共用柏木条（枋）约15880根", "layer": "ext"}, {"section": "北京地区的主要博物馆", "type": "judge", "q": "中国国家博物馆的前身可追溯至1912年成立的国立历史博物馆筹备处，设于北京国子监。", "answer": "对", "explain": "原文：国博前身可追溯至1912年7月9日设于北京国子监的国立历史博物馆筹备处，由蔡元培、鲁迅等有识之士推动成立。", "source": "前身：可追溯至1912年成立的国立历史博物馆筹备处（1912年7月9日设于北京国子监，由蔡元培、鲁迅等有识之士推动成立）。", "layer": "ext"}, {"section": "北京地区的主要博物馆", "type": "multi", "q": "民族文化宫典藏体系中，堪称翘楚的有（ ）。", "options": ["A. 1959年故宫博物院拨交的少数民族文物", "B. 历代达赖和班禅敬献党和国家领导人的见证物", "C. 全国各民族敬献党和国家领导人的见证物", "D. 北京人、元谋人、山顶洞人古人类化石"], "answer": "ABC", "explain": "原文所列三大翘楚为A、B、C三项；北京人、元谋人、山顶洞人等古人类化石是中国地质博物馆的收藏，D项错误。", "source": "其中尤以1959年故宫博物院拨交的少数民族文物、历代达赖和班禅敬献党和国家领导人的见证物、全国各民族敬献党和国家领导人的见证物为翘楚", "layer": "ext"}, {"section": "北京地区的主要博物馆", "type": "single", "q": "北京汽车博物馆建筑造型的创意寓意是（ ）。", "options": ["A. 古代文物破土而出", "B. 一只明亮的“眼睛”", "C. 中国传统建筑的飞檐", "D. 妇女的柔媚多姿"], "answer": "B", "explain": "北京汽车博物馆建筑造型创意为一只明亮的“眼睛”，寓意“放眼世界、面向未来”；“文物破土而出”是首都博物馆青铜展馆的寓意。", "source": "北京汽车博物馆建筑造型的寓意：建筑造型创意为一只明亮的“眼睛”……寓意“放眼世界、面向未来”。", "layer": "ext"}, {"section": "北京地区的主要博物馆", "type": "judge", "q": "首都博物馆椭圆形青铜展馆斜出墙面，寓意古代文物破土而出。", "answer": "对", "explain": "原文：“酷似青铜器的椭圆展馆穿透外墙直指蓝天，象征古代文物破土而出”。", "source": "椭圆形的青铜展馆斜出墙面，寓意古代文物破土而出（“酷似青铜器的椭圆展馆穿透外墙直指蓝天，象征古代文物破土而出”）。", "layer": "ext"}, {"section": "北京地区的主要博物馆", "type": "single", "q": "2026年北京南中轴地区首个完成筹备工作正式面向公众开放的博物馆是（ ）。", "options": ["A. 北京自然博物馆", "B. 北京市自然昆虫博物馆", "C. 中国园林博物馆", "D. 北京汽车博物馆"], "answer": "B", "explain": "北京市自然昆虫博物馆于2026年4月9日正式面向公众开放，是南中轴地区首个博物馆，也是丰台区利用疏解腾退空间引入的首个民营博物馆。", "source": "北京市自然昆虫博物馆。于2026年4月9日完成筹备工作、正式面向公众开放，是北京南中轴地区首个博物馆。", "layer": "ext"}, {"section": "北京地区的主要博物馆", "type": "judge", "q": "民族文化宫收藏中国各民族各时代藏品近5万件（套），涵盖现有55个民族。", "answer": "错", "explain": "民族文化宫藏品涵盖现有56个民族，不是55个；其藏品数量多、种类丰富，从物质文化到精神文化包罗万象。", "source": "民族文化宫的藏品特点：收藏中国各民族各时代藏品近5万件（套），涵盖现有56个民族，在中国民族类博物馆中藏品数量多、种类丰富", "layer": "ext"}, {"section": "北京地区的主要博物馆", "type": "multi", "q": "北京考古遗址博物馆“一馆三址”中，原馆与现址对应正确的有（ ）。", "options": ["A. 原北京市西周燕都遗址博物馆——琉璃河遗址", "B. 原北京市大葆台西汉墓博物馆——大葆台西汉墓遗址", "C. 原北京辽金城垣博物馆——金中都水关遗址", "D. 原周口店遗址博物馆——周口店遗址"], "answer": "ABC", "explain": "三址由西周燕都遗址博物馆、大葆台西汉墓博物馆、辽金城垣博物馆于2021年6月整合组建；周口店遗址博物馆为独立建制，不属本馆，D项错误。", "source": "为“一馆三址”，由原北京市西周燕都遗址博物馆、原北京市大葆台西汉墓博物馆和原北京辽金城垣博物馆于2021年6月整合组建而成", "layer": "ext"}, {"section": "北京地区的主要博物馆", "type": "single", "q": "国际博物馆日中国主会场活动自（ ）起已连续举办多届。", "options": ["A. 1977年", "B. 1978年", "C. 2009年", "D. 2012年"], "answer": "C", "explain": "自2009年起，国际博物馆日中国主会场活动已连续举办多届；1977年为ICOM确定国际博物馆日之年，1978年起ICOM每年组织庆祝活动。", "source": "中国主会场：自2009年起，国际博物馆日中国主会场活动已连续举办多届，成为全民共享的文化节日。", "layer": "ext"}, {"section": "北京地区的主要博物馆", "type": "judge", "q": "中国人民抗日战争纪念馆坐落于丰台区卢沟桥畔宛平城内，于1987年全民族抗战爆发50周年之际建成开馆。", "answer": "对", "explain": "原文：抗战馆位于宛平城内街101号，坐落在卢沟桥事变原址，1987年全民族抗战爆发50周年之际建成开馆，现有馆藏文物3万件（套）。", "source": "坐落于北京市丰台区卢沟桥畔宛平城内……于1987年全民族抗战爆发50周年之际建成开馆，是国家一级博物馆", "layer": "ext"}, {"section": "北京地区的主要博物馆", "type": "single", "q": "中国国家博物馆改扩建完成并正式对外开放、建筑面积增加到近20万平方米的年份是（ ）。", "options": ["A. 2003年", "B. 2012年", "C. 1959年", "D. 1912年"], "answer": "B", "explain": "2012年改扩建完成并正式对外开放，建筑面积近20万平方米，拥有48个标准展厅；2003年为中国革命博物馆与中国历史博物馆合并组建国博之年。", "source": "2012年改扩建完成并正式对外开放后，建筑面积增加到近20万平方米……拥有48个标准展厅，是世界上单体建筑面积最大的现代化综合性博物馆。", "layer": "ext"}, {"section": "北京地区的主要博物馆", "type": "multi", "q": "下列关于首都博物馆建筑的说法，正确的有（ ）。", "options": ["A. 椭圆形青铜展馆寓意古代文物破土而出", "B. 巨大屋盖继承了中国传统建筑深远挑檐", "C. 通长石质幕墙象征中国古代城墙", "D. 大厅北门外地面镶嵌清代丹陛", "E. 大厅内有清代牌楼"], "answer": "ABCD", "explain": "大厅内为明代牌楼而非清代牌楼，E项错误；其余四项均与原文相符。", "source": "巨大的屋盖继承了中国传统建筑深远挑檐……通长石质幕墙象征着中国古代城墙……大厅北门外地面镶嵌清代丹陛、大厅内有明代牌楼", "layer": "ext"}, {"section": "北京地区的主要博物馆", "type": "single", "q": "首都博物馆的建筑设计理念是（ ）。", "options": ["A. “以人为本，以文物为本，为社会服务”", "B. “收藏历史，传承文明”", "C. “博古通今，面向未来”", "D. “保护为主，抢救第一”"], "answer": "A", "explain": "首博建筑设计理念为“以人为本，以文物为本，为社会服务”，强调“过去与未来、历史与现代、艺术与自然的和谐统一”。", "source": "建筑设计理念：“以人为本，以文物为本，为社会服务”，强调“过去与未来、历史与现代、艺术与自然的和谐统一”。", "layer": "ext"}, {"section": "北京地区的主要博物馆", "type": "single", "q": "中国妇女儿童博物馆建筑顶部的造型特点是（ ）。", "options": ["A. 波浪曲线型轮廓，象征妇女的柔媚多姿", "B. 一只明亮的“眼睛”，寓意放眼世界", "C. 椭圆形青铜展馆，象征文物破土而出", "D. 深远的挑檐，继承传统建筑风格"], "answer": "A", "explain": "妇女儿童博物馆建筑顶部为波浪曲线型轮廓，象征妇女的柔媚多姿，以白色金属板为基调配浅灰色玻璃；B为汽车博物馆，C、D为首都博物馆。", "source": "建筑顶部的波浪曲线型轮廓，象征妇女的柔媚多姿；建筑色彩以白色金属板为基调，配以浅灰色玻璃，显示出高雅、纯洁的气质。", "layer": "ext"}, {"section": "北京地区的主要博物馆", "type": "single", "q": "中国人民革命军事博物馆主楼建筑高（ ）。", "options": ["A. 94.7米", "B. 49.195米", "C. 55.38米", "D. 43.4米"], "answer": "A", "explain": "军博主楼建筑高94.7米，中央7层、南北两侧各4层，楼顶装有直径6米的镀金“八一”军徽；49.195米为北京汽车博物馆总高度。", "source": "主楼建筑高94.7米，中央7层、南北两侧各4层，楼顶装有直径6米的镀金中国人民解放军“八一”军徽。", "layer": "ext"}, {"section": "北京地区的主要博物馆", "type": "single", "q": "中国人民抗日战争纪念馆现有馆藏文物（ ）。", "options": ["A. 3万件（套）", "B. 近5万件（套）", "C. 18万余件（套）", "D. 32000余件"], "answer": "A", "explain": "抗战馆现有馆藏文物3万件（套），以1931年至1945年抗战时期的历史文献和实物为主；18万余件为军博，32000余件为海关博物馆，近5万件为民族文化宫。", "source": "现有馆藏文物3万件（套），文物藏品以1931年至1945年抗战时期的各种历史文献和实物为主。", "layer": "ext"}, {"section": "北京地区的主要博物馆", "type": "single", "q": "北京大葆台西汉墓一号墓的“黄肠题凑”共用柏木条（枋）约（ ）。", "options": ["A. 2500根", "B. 15880根", "C. 1800根", "D. 530根"], "answer": "B", "explain": "大葆 民主精神", "D. 科学精神"], "answer": "A", "explain": "五四精神内容为爱国、进步、民主、科学，核心是爱国主义精神。", "source": "爱国、进步、民主、科学（核心是爱国主义精神）"}, {"section": "北京地区的红色教育基地", "layer": "core", "type": "judge", "q": "陈独秀将《新青年》编辑部迁到北京的时间是1917年1月。", "answer": "对", "explain": "背诵版明确：1917年1月陈独秀将《新青年》编辑部迁到北京。", "source": "陈独秀将《新青年》编辑部迁到北京的时间：1917年1月"}, {"section": "北京地区的红色教育基地", "layer": "core", "type": "multi", "q": "全市31处中国共产党早期北京革命活动旧址中，西城区占8处，其中包括（ ）。", "options": ["A. 李大钊故居", "B. 京报馆旧址", "C. 陶然亭慈悲庵", "D. 国立蒙藏学校旧址", "E. 香山双清别墅"], "answer": "ABCD", "explain": "西城区8处旧址含李大钊故居、京报馆旧址、陶然亭慈悲庵、国立蒙藏学校旧址等；双清别墅位于香山，不在其中。", "source": "西城区占8处（李大钊故居、京报馆旧址、陶然亭慈悲庵、国立蒙藏学校旧址等）"}, {"section": "北京地区的红色教育基地", "layer": "core", "type": "single", "q": "北大“红楼”的历史地位是（ ）。", "options": ["A. 新文化运动的营垒、五四爱国运动的策源地和中国共产党的发祥地之一", "B. 中国共产党第一个少数民族党支部诞生地", "C. 北京党组织创办的第一所工人学校所在地", "D. 二七大罢工指挥部所在地"], "answer": "A", "explain": "红楼是新文化运动的营垒、五四爱国运动的策源地和中国共产党的发祥地之一。", "source": "红楼：新文化运动的营垒、五四爱国运动的策源地和中国共产党的发祥地之一"}, {"section": "北京地区的红色教育基地", "layer": "core", "type": "judge", "q": "《共产党宣言》首个中译本的翻译者是陈望道。", "answer": "对", "explain": "背诵版明确：《共产党宣言》首个中译本由陈望道翻译。", "source": "《共产党宣言》的首个中译本的翻译者：陈望道"}, {"section": "北京地区的红色教育基地", "layer": "core", "type": "single", "q": "1918年11月15日，李大钊发表《庶民的胜利》演讲的地点是（ ）。", "options": ["A. 天安门前", "B. 北大红楼", "C. 陶然亭", "D. 长辛店"], "answer": "A", "explain": "李大钊于1918年11月15日在天安门前发表《庶民的胜利》演讲。", "source": "李大钊发表《庶民的胜利》演讲地点：天安门前（1918年11月15日）"}, {"section": "北京地区的红色教育基地", "layer": "core", "type": "judge", "q": "北大“红楼”因楼体主要用青砖砌成而得名。", "answer": "错", "explain": "应为“红砖”：红楼因楼体主要用红砖砌成而得名。", "source": "北大“红楼”的名称由来：因楼体主要用红砖砌成"}, {"section": "北京地区的红色教育基地", "layer": "core", "type": "multi", "q": "抗战时期，“平西”主要包括的范围是（ ）。", "options": ["A. 北平以西", "B. 平绥铁路以南", "C. 平汉铁路西北", "D. 主要包括宛平、房山、涞水三县大部，约12个县", "E. 平津铁路以北"], "answer": "ABCD", "explain": "平西指北平以西、平绥铁路以南、平汉铁路西北，主要包括宛平、房山、涞水三县大部，约12个县。", "source": "平西：北平以西、平绥铁路以南、平汉铁路西北，主要包括宛平、房山、涞水三县大部，约12个县"}, {"section": "北京地区的红色教育基地", "layer": "core", "type": "single", "q": "李大钊在京居住时间最长的住所位于（ ）。", " ": "core", "type": "multi", "q": "“圆明三园”指的是（ ）。", "options": ["A. 圆明园", "B. 长春园", "C. 绮春园", "D. 万春园"], "answer": "ABC", "explain": "圆明三园为圆明园、长春园、绮春园；万春园是绮春园后来改的名称，不是并列的第三园。", "source": "圆明三园：圆明园、长春园、绮春园（后改万春园）"}, {"section": "北京地区的红色教育基地", "layer": "core", "type": "single", "q": "《京报》的创始人是（ ）。", "options": ["A. 邵飘萍", "B. 陈望道", "C. 缪伯英", "D. 高君宇"], "answer": "A", "explain": "《京报》由邵飘萍创办。", "source": "《京报》的创始人：邵飘萍"}, {"section": "北京地区的红色教育基地", "layer": "core", "type": "judge", "q": "1923年京汉铁路北段二七大罢工指挥部设于长辛店工人俱乐部旧址（刘铁铺，长辛店大街174号）。", "answer": "对", "explain": "背诵版明确：二七大罢工指挥部地点为长辛店工人俱乐部旧址（刘铁铺，长辛店大街174号）。", "source": "二七大罢工指挥部：长辛店工人俱乐部旧址（刘铁铺，长辛店大街174号）"}, {"section": "北京地区的红色教育基地", "layer": "core", "type": "single", "q": "由北京党组织创办的第一所工人学校是（ ）。", "options": ["A. 长辛店劳动补习学校", "B. 中法大学", "C. 北京蒙藏学校", "D. 北京大学"], "answer": "A", "explain": "北京党组织创办的第一所工人学校是长辛店劳动补习学校。", "source": "由北京党组织创办的第一所工人学校：长辛店劳动补习学校"}, {"section": "北京地区的红色教育基地", "layer": "core", "type": "judge", "q": "佟麟阁是抗日战争全面爆发后牺牲的第一位师长。", "answer": "错", "explain": "佟麟阁是第一位军级将领；第一位师长是赵登禹，注意区分。", "source": "佟麟阁为第一位军级将领（勿混：赵登禹为第一位师长）"}, {"section": "北京地区的红色教育基地", "layer": "core", "type": "multi", "q": "关于圆明园“西洋楼景区”的特点，下列说法正确的有（ ）。", "options": ["A. 位于长春园北部", "B. 是中国大规模仿建欧式园林和建筑的代表性成果", "C. 有“东方凡尔赛宫”之誉", "D. 中西合璧，以建筑与喷泉（“水法”）为主要内容", "E. 位于绮春园南部"], "answer": "ABCD", "explain": "西洋楼景区位于长春园北部，是大规模仿建欧式园林建筑的代表性成果，有“东方凡尔赛宫”之誉，中西合璧、以水法为主要内容。", "source": "位于长春园北部；大规模仿建欧式园林代表；“东方凡尔赛宫”；中西合璧；以水法为主要内容"}, {"section": "北京地区的红色教育基地", "layer": "core", "type": "single", "q": "中国共产党第一位女党员是（ ）。", "options": ["A. 缪伯英", "B. 宋庆龄", "C. 何香凝", "D. 向警予"], "answer": "A", "explain": "背诵版明确：中国共产党第一位女党员是缪伯英。", "source": "中国共产党第一位女党员：缪伯英"}, {"section": "北京地区的红色教育基地", "layer": "core", "type": "judge", "q": "中国人民抗日战争纪念馆于1987年7月7日开馆，馆名由邓小平题写。", "answer": "对", "explain": "背诵版明确：1987年7月7日开馆，邓小平题写馆名。", "source": "中国人民抗日战争纪念馆：1987年7月7日开馆；邓小平题写馆名"}, {"section": "北京地区的红色教育基地", "layer": "core", "type": "single", "q": "高君宇烈士墓位于（ ）。", "options": ["A. 陶然亭公园湖心岛锦秋墩北麓", "B. 海淀区香山东麓万安公墓内", "C. 香山双清别墅", "D. 西城区文华胡同24号"], "answer": "A", "explain": "高君宇烈士墓位于陶然亭公园湖心岛锦秋墩北麓；万安公墓为李大钊烈士陵园所在地。", "source": "高君宇烈士墓的位置：陶然亭公园湖心岛锦秋墩北麓"}, {"section": "北京地区的红色教育基地", "layer": "core", "type": "judge", "q": "香山“双清别墅”的建造者是熊希龄。", "answer": "对", "explain": "背诵版明确：双清别墅的建造者是熊希龄。", "source": "“双清别墅”的建造者：熊希龄"}, {"section": "北京地区的红色教育基地", "layer": "core", "type": "multi", "q": "中国国家博物馆“古代中国”基本陈列中展出的商周青铜器包括（ ）。", "options": ["A. “后母戊”青铜方鼎", "B. 四羊青铜方尊", "C. “利”青铜簋", "D. 大盂鼎", "E. “后母戊”青铜方尊"], "answer": "ABCD", "explain": "展品包括“后母戊”青铜方鼎、四羊青铜方尊、“利”青铜簋、大盂鼎、“虢季子白”青铜盘；E项“后母戊方尊”为拼凑干扰项。", "source": "“后母戊”青铜方鼎；四羊青铜方尊；“利”青铜簋；大盂鼎；“虢季子白”青铜盘"}, {"section": "北京地区的红色教育基地", "layer": "core", "type": "single", "q": "抗日战争全面爆发后牺牲的第一位军级将领是（ ）。", "options": ["A. 佟麟阁", "B. 赵登禹", "C. 张自忠", "D. 萧克"], "answer": "A", "explain": "佟麟阁为第一位军级将领；赵登禹为第一位师长，张自忠为牺牲的最高将领。", "source": "佟麟阁（勿混：赵登禹为第一位师长，张自忠为牺牲的最高将领）"}, {"section": "北京地区的红色教育基地", "layer": "core", "type": "judge", "q": "中国人民革命军事博物馆楼顶巨大的中国人民解放军军徽直径为8米。", "answer": "错", "explain": "直径应为6米，而非8米。", "source": "军博楼顶中国人民解放军军徽直径：6米"}, {"section": "北京地区的红色教育基地", "layer": "core", "type": "single", "q": "被誉为“人民第一堡垒”的红色景观是（ ）。", "options": ["A. 北京焦庄户地道战遗址（纪念馆）", "B. 古北口长城抗战纪念馆", "C. 中国人民抗日战争纪念馆", "D. 长辛店二七纪念馆"], "answer": "A", "explain": "北京焦庄户地道战遗址（纪念馆）被誉为“人民第一堡垒”。", "source": "被誉为“人民第一堡垒”的红色景观：北京焦庄户地道战遗址（纪念馆）"}, {"section": "北京地区的红色教育基地", "layer": "core", "type": "multi", "q": "北京奥林匹克公园作为北京城市传统中轴线延伸的寓意包括（ ）。", "options": ["A. 历史与未来、传统与现代的时空衔接", "B. “龙”文化传承（双龙拱卫中轴）", "C. “天圆地方”传统哲学", "D. 绿色奥运、科技奥运、人文奥运三大理念"], "answer": "ABCD", "explain": "四项均为奥林匹克公园作为中轴线延伸（向北延伸至26公里）的寓意。", "source": "时空衔接；“龙”文化传承；“天圆地方”；绿色奥运、科技奥运、人文奥运三大理念"}, {"section": "北京地区的红色教育基地", "layer": "core", "type": "single", "q": "古北口长城抗战纪念馆位于（ ）。", "options": ["A. 密云区古北口镇古北口村南关", "B. 房山区霞云岭乡堂上村", "C. 海淀区香山东麓", "D. 丰台区长辛店大街"], "answer": "A", "explain": "古北口长城抗战纪念馆位于密云区古北口镇古北口村南关。", "source": "古北口长城抗战纪念馆的位置：密云区古北口镇古北口村南关"}, {"section": "北京地区的红色教育基地", "layer": "core", "type": "single", "q": "歌曲《没有共产党就没有新中国》的诞生地是（ ）。", "options": ["A. 房山区霞云岭乡堂上村", "B. 密云区古北口镇古北口村", "C. 顺义区焦庄户村", "D. 香山双清别墅"], "answer": "A", "explain": "1943年曹火星在房山区霞云岭乡堂上村创作了《没有共产党就没有新中国》。", "source": "诞生地：房山区霞云岭乡堂上村（1943年曹火星创作）"}, {"section": "北京地区的红色教育基地", "layer": "core", "type": "multi", "q": "北京市规划展览馆的展陈内容包括（ ）。", "options": ["A. 北京古城变迁展区", "B. 历史文化名城保护展区", "C. 《北京旧城》青铜浮雕", "D. 1:750北京城市规划模型", "E. 1:7500北京旧城沙盘"], "answer": "ABCD", "explain": "展陈含北京古城变迁、历史文化名城保护、历次总体规划介绍、各类功能区规划展区、《北京旧城》青铜浮雕及1:750北京城市规划模型；E项比例错误。", "source": "北京古城变迁展区；历史文化名城保护展区；《北京旧城》青铜浮雕；1:750北京城市规划模型"}, {"section": "北京地区的红色教育基地", "layer": "core", "type": "single", "q": "抗日战争期间，冀热察挺进军的司令是（ ）。", "options": ["A. 萧克", "B. 佟麟阁", "C. 赵登禹", "D. 张自忠"], "answer": "A", "explain": "冀热察挺进军司令为萧克。", "source": "冀热察挺进军的司令：萧克"}, {"section": "北京地区的红色教育基地", "layer": "core", "type": "single", "q": "打响北京地区抗日战争第一枪的战役是（ ）。", "options": ["A. 古北口战役", "B. 古北口保卫战", "C. 卢沟桥战役", "D. 南口战役"], "answer": "A", "explain": "1933年3月古北口战役（长城抗战）打响北京地区抗日战争第一枪；古北口保卫战打响的是解放战争第一枪。", "source": "打响北京地区抗日战争第一枪：古北口战役（1933年3月，长城抗战）"}, {"section": "北京地区的红色教育基地", "layer": "core", "type": "multi", "q": "关于古北口战役与古北口保卫战，下列说法正确的有（ ）。", "options": ["A. 古北口战役发生于1933年3月", "B. 古北口战役属于长城抗战", "C. 古北口战役打响了北京地区抗日战争第一枪", "D. 古北口保卫战打响了北京地区解放战争第一枪", "E. 古北口保卫战发生于1945年1月"], "answer": "ABCD", "explain": "古北口战役（1933年3月，长城抗战）打响抗战第一枪；古北口保卫战（1946年1月）打响解放战争第一枪，E项年份错误。", "source": "古北口战役（1933年3月，长城抗战）；古北口保卫战（1946年1月）"}, {"section": "北京地区的红色教育基地", "layer": "core", "type": "single", "q": "中国共产党“进京赶考”的第一站是（ ）。", "options": ["A. 香山（双清别墅）", "B. 中南海", "C. 北大红楼", "D. 天安门"], "answer": "A", "explain": "香山（双清别墅）是中国共产党“进京赶考”的第一站。", "source": "中国共产党“进京赶考”的第一站：香山（双清别墅）"}, {"section": "北京地区的红色教育基地", "layer": "core", "type": "single", "q": "北京二七纪念馆馆名的题写者是（ ）。", "options": ["A. 彭真", "B. 邓小平", "C. 毛泽东", "D. 陈毅"], "answer": "A", "explain": "北京二七纪念馆馆名由彭真题写；邓小平题写的是中国人民抗日战争纪念馆馆名。", "source": "北京二七纪念馆馆名的题写者：彭真"}, {"section": "北京地区的红色教育基地", "layer": "core", "type": "single", "q": "中国国家博物馆“古代中国”基本陈列中展出的“后母戊”青铜方鼎，其重量为（ ）。", "options": ["A. 832.84千克", "B. 628.48千克", "C. 750千克", "D. 1000千克"], "answer": "A", "explain": "“后母戊”青铜方鼎是最重的青铜器，重832.84千克。", "source": "“后母戊”青铜方鼎（最重，832.84千克）"}, {"section": "北京地区的红色教育基地", "layer": "core", "type": "single", "q": "1986年，天安门广场被评为“北京十六景”之一，其景观名称是（ ）。", "options": ["A. 天安丽日", "B. 卢沟晓月", "C. 居庸叠翠", "D. 金台夕照"], "answer": "A", "explain": "1986年天安门广场以“天安丽日”之名被评为“北京十六景”之一。", "source": "1986年天安门广场被评为“北京十六景”之一：天安丽日"}, {"section": "北京地区的红色教育基地", "layer": "core", "type": "single", "q": "宋庆龄故居位于（ ）。", "options": ["A. 西城区后海北沿46号", "B. 西城区文华胡同24号", "C. 长辛店大街174号", "D. 东交民巷"], "answer": "A", "explain": "宋庆龄故居位于西城区后海北沿46号；文华胡同24号为李大钊故居。", "source": "宋庆龄故居的位置：西城区后海北沿46号"}, {"section": "北京地区的红色教育基地", "type": "single", "q": "卢沟桥建成于（　）。", "options": ["A. 金大定二十九年（1189年）", "B. 金明昌三年（1192年）", "C. 金明昌五年（1194年）", "D. 金承安元年（1196年）"], "answer": "B", "explain": "卢沟桥始建于金大定二十九年（1189年），建成于金明昌三年（1192年）。1189年是始建年份，注意区分。", "source": "始建于金大定二十九年（1189年），建成于金明昌三年（1192年），至今已有800多年历史", "layer": "ext"}, {"section": "北京地区的红色教育基地", "type": "judge", "q": "卢沟桥始建于金大定二十九年（1189年），建成于金明昌三年（1192年）。", "answer": "对", "explain": "原文明确记载卢沟桥始建于金大定二十九年（1189年），建成于金明昌三年（1192年），至今已有800多年历史。", "source": "始建于金大定二十九年（1189年），建成于金明昌三年（1192年），至今已有800多年历史", "layer": "ext"}, {"section": "北京地区的红色教育基地", "type": "multi", "q": "下列位于西城区的中国共产党早期北京革命活动旧址有（　）。", "options": ["A. 李大钊故居", "B. 京报馆旧址（邵飘萍故居）", "C. 陶然亭慈悲庵", "D. 国立蒙藏学校旧址", "E. 古北口长城抗战纪念馆"], "answer": "ABCD", "explain": "西城区的8处旧址包括李大钊故居、京报馆旧址、陶然亭慈悲庵、国立蒙藏学校旧址等；古北口长城抗战纪念馆位于密云区。", "source": "西城区占8处，主要有——①李大钊故居……②京报馆旧址……③陶然亭慈悲庵……④国立蒙藏学校旧址", "layer": "ext"}, {"section": "北京地区的红色教育基地", "type": "single", "q": "卢沟桥的原名是（　）。", "options": ["A. 永定桥", "B. 广利桥", "C. 拱北桥", "D. 马可·波罗桥"], "answer": "B", "explain": "卢沟桥初名“广利”，因永定河旧称卢沟河，元代改称卢沟桥；“马可·波罗桥”是西方称呼；“拱北城”是宛平城原名。", "source": "卢沟桥的原名为“广利桥”（初名“广利”，因永定河旧称卢沟河，元代改称卢沟桥）；西方又称“马可·波罗桥”", "layer": "ext"}, {"section": "北京地区的红色教育基地", "type": "judge", "q": "卢沟桥为11孔联拱石桥，全长266.5米、宽9.3米，共有11个桥墩。", "answer": "错", "explain": "卢沟桥为11孔联拱石桥，全长266.5米、宽9.3米，但桥墩是10个，不是11个。", "source": "为11孔联拱石桥，全长266.5米、宽9.3米，10个桥墩，桥上望柱281根、石狮501只", "layer": "ext"}, {"section": "北京地区的红色教育基地", "type": "single", "q": "1915年9月陈独秀在上海创刊的杂志，原名是（　）。", "options": ["A. 《新青年》", "B. 《青年杂志》", "C. 《向导》", "D. 《京报》"], "answer": "B", "explain": "1915年9月陈独秀在上海创刊《青年杂志》，1916年9月更名《新青年》；《向导》是中共中央机关报，《京报》为邵飘萍创办。", "source": "1915年9月陈独秀在上海创刊《青年杂志》，1916年9月更名《新青年》", "layer": "ext"}, {"section": "北京地区的红色教育基地", "type": "judge", "q": "宛平城位于卢沟桥西侧，是中国华北地区唯一保存完整的两开门卫城。", "answer": "错", "explain": "宛平城位于卢沟桥东侧，不是西侧；它是中国华北地区唯一保存完整的两开门卫城。", "source": "中国华北地区唯一保存完整的两开门卫城是宛平城，位于卢沟桥东侧", "layer": "ext"}, {"section": "北京地区的红色教育基地", "type": "multi", "q": "下列关于佟麟阁的说法正确的有（　）。", "options": ["A. 时任国民革命军第二十九军副军长", "B. 1937年7月28日在南苑殉国", "C. 殉国时年仅29岁", "D. 是全民族抗战爆发后牺牲的第一位军级将领", "E. 抗战胜利后南沟沿被命名为佟麟阁路"], "answer": "ABDE", "explain": "佟麟阁殉国时年45岁，年仅29岁病逝的是高君宇；佟麟阁是抗战爆发后牺牲的第一位军级将领，第一位师长是赵登禹。", "source": "佟麟阁（1892—1937）……时任国民革命军第二十九军副军长……1937年7月28日……壮烈殉国，时年45岁", "layer": "ext"}, {"section": "北京地区的红色教育基地", "type": "single", "q": "《共产党宣言》首个中文全译本的翻译者是（　）。", "options": ["A. 陈独秀", "B. 李大钊", "C. 陈望道", "D. 蔡和森"], "answer": "C", "explain": "《共产党宣言》首个中文全译本由陈望道（浙江义乌人）翻译，1920年8月在上海出版。", "source": "《共产党宣言》首个中文全译本的翻译者是陈望道（浙江义乌分水塘村人），依据日文译本并参照英文译本翻译", "layer": "ext"}, {"section": "北京地区的红色教育基地", "type": "judge", "q": "1917年1月，陈独秀将《新青年》编辑部由上海迁到北京。", "answer": "对", "explain": "1917年1月蔡元培出任北大校长，聘陈独秀为文科学长，《新青年》编辑部随陈独秀由上海迁至北京。", "source": "1917年1月蔡元培出任北京大学校长，聘陈独秀为文科学长，《新青年》编辑部随陈独秀由上海迁至北京", "layer": "ext"}, {"section": "北京地区的红色教育基地", "type": "single", "q": "北大“红楼”落成的时间是（　）。", "options": ["A. 1916年", "B. 1918年8月", "C. 1919年5月", "D. 1920年10月"], "answer": "B", "explain": "红楼1916年动工、1918年8月落成，导游讲解以1918年8月建成为准；1916年为动工时间。", "source": "红楼建于1916年动工、1918年8月落成（初为北大预科学生宿舍楼，后改作校部、图书馆和文科教室）", "layer": "ext"}, {"section": "北京地区的红色教育基地", "type": "judge", "q": "《共产党宣言》首个中文全译本1920年8月在上海出版，首版印行10000册。", "answer": "错", "explain": "首版印行1000册，不是10000册；封面书名曾误印为《共党产宣言》，同年9月再版改正。", "source": "1920年8月 者是熊希龄……双清别墅即他在创办香山慈幼院期间为自己建造的住所", "layer": "ext"}, {"section": "北京地区的红色教育基地", "type": "multi", "q": "下列属于圆明园西洋楼景区“西洋十景”的有（　）。", "options": ["A. 谐奇趣", "B. 海晏堂", "C. 大水法", "D. 听鹂轩"], "answer": "ABC", "explain": "西洋十景包括谐奇趣、万花阵、养雀笼、方外观、海晏堂、远瀛观、大水法、观水法、线法山、线法墙等；听鹂轩是宋庆龄故居内的古建筑。", "source": "建成“西洋十景”：谐奇趣、万花阵（迷宫）、养雀笼、方外观、海晏堂、远瀛观、大水法、观水法、线法山、线法墙（画）等", "layer": "ext"}, {"section": "北京地区的红色教育基地", "type": "single", "q": "由北京党组织创办的第一所工人学校是（　）。", "options": ["A. 长辛店劳动补习学校", "B. 中法大学", "C. 国立蒙藏学校", "D. 留法勤工俭学法文预备学校"], "answer": "A", "explain": "长辛店劳动补习学校1921年1月正式开学，是北京党组织创办的第一所工人学校，毛泽东评价“中国工人运动还是从长辛店铁路工厂开始的”。", "source": "由北京党组织创办的第一所工人学校是长辛店劳动补习学校……1921年1月正式开学", "layer": "ext"}, {"section": "北京地区的红色教育基地", "type": "judge", "q": "卢沟桥原名“广利桥”，因永定河旧称卢沟河，元代改称卢沟桥，西方又称“马可·波罗桥”。", "answer": "对", "explain": "卢沟桥初名“广利”，因永定河旧称卢沟河，元代改称卢沟桥；西方又称“马可·波罗桥”，“卢沟晓月”为燕京八景之一。", "source": "卢沟桥的原名为“广利桥”（初名“广利”，因永定河旧称卢沟河，元代改称卢沟桥）；西方又称“马可·波罗桥”", "layer": "ext"}, {"section": "北京地区的红色教育基地", "type": "single", "q": "被誉为“人民第一堡垒”的红色景观是（　）。", "options": ["A. 古北口长城抗战纪念馆", "B. 北京焦庄户地道战遗址", "C. 房山区堂上村", "D. 长辛店工人俱乐部"], "answer": "B", "explain": "1947年11月顺义县人民政府授予焦庄户村“人民第一堡垒”光荣称号，即北京焦庄户地道战遗址。", "source": "1947年11月，顺义县人民政府授予焦庄户村“人民第一堡垒”光荣称号", "layer": "ext"}, {"section": "北京地区的红色教育基地", "type": "judge", "q": "《共产党宣言》首个中文全译本由陈望道依据英文译本并参照日文译本翻译完成。", "answer": "错", "explain": "陈望道是依据日文译本并参照英文译本翻译的，题干将二者颠倒了。", "source": "翻译者是陈望道（浙江义乌分水塘村人），依据日文译本并参照英文译本翻译，1920年4月下旬完成译稿", "layer": "ext"}, {"section": "北京地区的红色教育基地", "type": "multi", "q": "中国国家博物馆“古代中国”基本陈列中展出的商周青铜器有（　）。", "options": ["A. “后母戊”青铜方鼎", "B. 四羊青铜方尊", "C. “利”青铜簋", "D. “盂”青铜鼎"], "answer": "ABCD", "explain": "四者均为“古代中国”基本陈列夏商西周部分展出的著名青铜器：后母戊鼎为已知最重的青铜器，四羊方尊是现存商代最大青铜方尊，利簋称“西周第一青铜器”，大盂鼎为西周册命物证。", "source": "展出的著名商周青铜器主要有：“后母戊”青铜方鼎……四羊青铜方尊……“利”青铜簋……“盂”青铜鼎", "layer": "ext"}, {"section": "北京地区的红色教育基地", "type": "single", "q": "歌曲《没有共产党就没有新中国》的创作者是（　）。", "options": ["A. 曹火星", "B. 马福", "C. 张爱萍", "D. 萧克"], "answer": "A", "explain": "1943年晋察冀边区群众剧社19岁的共产党员曹火星在房山区堂上村创作此歌；马福是焦庄户 米，顶端托举着直径6米的镀金中国人民解放军“八一”军徽。", "source": "展览大楼中央7层、两侧4层，高94.7米，顶端托举着金碧辉煌、直径6米的镀金中国人民解放军“八一”军徽", "layer": "ext"}, {"section": "北京地区的红色教育基地", "type": "judge", "q": "1924—1925年期间，中法大学党支部书记由陈毅担任。", "answer": "对", "explain": "陈毅1923年入中法大学学习并由团员转为党员，1924—1925年任中法大学党支部书记；1923年书记为肖明。", "source": "1924—1925年，中法大学党支部书记由陈毅担任；陈毅1923年进入中法大学学习并由团员转为党员", "layer": "ext"}, {"section": "北京地区的红色教育基地", "type": "multi", "q": "下列关于卢沟桥与宛平城的说法正确的有（　）。", "options": ["A. 卢沟桥为11孔联拱石桥，全长266.5米、宽9.3米", "B. 卢沟桥1961年列为第一批全国重点文物保护单位", "C. 宛平城位于卢沟桥东侧，明代原名“拱北城”", "D. 宛平城东西长640米、南北宽320米", "E. 宛平城设有东、南两座城门"], "answer": "ABCD", "explain": "宛平城只有东“顺治门”、西“永昌门”两座城门，是东西向设门而非东、南两座；其余各项均与原文相符。", "source": "为11孔联拱石桥，全长266.5米、宽9.3米……1961年列为第一批全国重点文物保护单位……城东西长640米、南北宽320米，只有东“顺治门”、西“永昌门”两座城门", "layer": "ext"}, {"section": "北京地区的红色教育基地", "type": "single", "q": "圆明园“西洋楼景区”的设计者是（　）。", "options": ["A. 意大利传教士郎世宁", "B. 法国神甫蒋友仁", "C. 王致诚", "D. 熊希龄"], "answer": "A", "explain": "西洋楼由意大利传教士郎世宁设计，法国神甫蒋友仁协助，王致诚等参与，中国工匠施工。", "source": "由意大利传教士郎世宁设计，法国神甫蒋友仁协助（另有王致诚、艾启蒙、杨自新、利博明、戴卡维等参与），中国工匠施工", "layer": "ext"}, {"section": "北京地区的红色教育基地", "type": "judge", "q": "中国共产党第一位女党员缪伯英是湖南长沙人，中国共产党成立后曾任西城支部第一任书记。", "answer": "对", "explain": "缪伯英（1899—1929，湖南长沙人）是党史上第一名女团员、第一名女党员，党成立后任西城支部第一任书记。", "source": "中国共产党第一位女党员是缪伯英（1899—1929，湖南长沙人）……中国共产党成立后任西城支部第一任书记", "layer": "ext"}, {"section": "北京地区的红色教育基地", "type": "single", "q": "1986年天安门广场被评为“北京十六景”之一的景观名称是（　）。", "options": ["A. 紫禁余晖", "B. 天安丽日", "C. 卢沟狮醒", "D. 红楼大观"], "answer": "B", "explain": "1986年评选的“北京十六景”中，天安门广场以“天安丽日”之名当选；“紫禁余晖”指故宫，“卢沟狮醒”指卢沟桥。", "source": "天安门广场即以“天安丽日”之名当选", "layer": "ext"}, {"section": "北京地区的红色教育基地", "type": "judge", "q": "长辛店二七纪念馆馆名由时任国家副主席王震亲笔题写。", "answer": "错", "explain": "馆名由彭真（时任全国人大常委会委员长）题写；王震是1983年奠基时的时任国家副主席，二人角色不可混淆。", "source": "长辛店二七纪念馆馆名由彭真（时任全国人大常委会委员长）亲笔题写……时任国家副主席王震奠基", "layer": "ext"}, {"section": "北京地区的红色教育基地", "type": "multi", "q": "下列关于北大“红楼”的说法正确的有（　）。", "options": ["A. 1916年动工、1918年8月落成", "B. 因楼体主要用红砖砌成而得名", "C. 位于今东城区五四大街29号，平面呈“工”字形", "D. 是新文化运动的营垒、五四爱国运动的策源地", "E. 毛泽东曾在此任北大图书馆馆长"], "answer": "ABCD", "explain": "毛泽东在北大图书馆任的是助理员而非馆长；1920年10月李大钊在红楼创建北京共产主义小组，其余各项均与原文相符。", "source": "红楼建于1916年动工、1918年8月落成……因楼体主要用红砖砌成……位于今东城区五四大街29号，平面呈“工”字形……毛泽东曾在此任图书馆助理员", "layer": "ext"}, {"section": "北京地区的红色教育基地", "type": "single", "q": "北京市规划展览馆的前身是（　）。", "options": ["A. 前门商业大厦", "B. 老北京火车站", "C. 首都博物馆", "D. 北京展览馆"], "answer": "A", "explain": "北京市规划展览馆位于东城区前门东大街20号（老北京火车站东侧），由原前门商业大厦改扩建而成，2004年9月24日开放。", "source": "是由原前门商业大厦（曾火爆京城的一座商场）改扩建而成，2004年9月24日正式对公众开放", "layer": "ext"}, {"section": "北京地区的红色教育基地", "type": "judge", "q": "中国人民革命军事博物馆展览大楼高94.7米，顶端托举的镀金“八一”军徽直径为6米。", "answer": "对", "explain": "军博展览大楼中央7层、两侧4层，高94.7米，顶端托举直径6米的镀金“八一”军徽。", "source": "展览大楼中央7层、两侧4层，高94.7米，顶端托举着金碧辉煌、直径6米的镀金中国人民解放军“八一”军徽", "layer": "ext"}, {"section": "北京地区的红色教育基地", "type": "single", "q": "宋庆龄故居原是清末（　）的花园。", "options": ["A. 明珠府第", "B. 醇亲王府", "C. 成亲王府", "D. 和珅别院"], "answer": "B", "explain": "宋庆龄故居原是清末醇亲王府（“北府”）的花园，即摄政王府花园；明珠府第、和珅别院、成亲王府均为其沿革中的早期阶段。", "source": "故居原是清末醇亲王府（“北府”）的花园，即摄政王府花园", "layer": "ext"}, {"section": "北京地区的红色教育基地", "type": "judge", "q": "北京市规划展览馆位于前门东大街20号，是由老北京火车站改扩建而成的。", "answer": "错", "explain": "规划馆是由原前门商业大厦改扩建而成，只是位置在老北京火车站东侧，并非由火车站改建。", "source": "位于东城区前门东大街20号（老北京火车站东侧），是由原前门商业大厦（曾火爆京城的一座商场）改扩建而成", "layer": "ext"}, {"section": "北京地区的红色教育基地", "type": "multi", "q": "下列中国共产党早期北京革命活动旧址中，位于西城区的有（　）。", "options": ["A. 中山公园来今雨轩", "B. 绍兴会馆", "C. 平民通讯社旧址（福佑寺）", "D. 北京女子高等师范学校旧址", "E. 长辛店工人俱乐部旧址"], "answer": "ABCD", "explain": "全市31处旧址中西城区占8处，含来今雨轩、绍兴会馆、平民通讯社、女高师旧址等；长辛店工人俱乐部旧址位于丰台区。", "source": "西城区占8处，主要有……⑤北京女子高等师范学校旧址……⑥中山公园来今雨轩……⑦绍兴会馆……⑧平民通讯社旧址（福佑寺）", "layer": "ext"}, {"section": "北京地区的红色教育基地", "type": "single", "q": "《新青年》编辑部随陈独秀由上海迁至北京的时间是（　）。", "options": ["A. 1915年9月", "B. 1916年9月", "C. 1917年1月", "D. 1920年初"], "answer": "C", "explain": "1917年1月蔡元培聘陈独秀为北大文科学长，编辑部随迁北京；1915年9月为《青年杂志》创刊、1916年9月更名《新青年》、1920年初迁回上海。", "source": "1917年1月蔡元培出任北京大学校长，聘陈独秀为文科学长，《新青年》编辑部随陈独秀由上海迁至北京", "layer": "ext"}, {"section": "北京地区的红色教育基地", "type": "judge", "q": "曹火星在房山区堂上村创作的歌曲初稿名为《没有共产党就没有中国》，1950年经毛泽东建议加上一个“新”字后才定为今名。", "answer": "对", "explain": "1943年曹火星创作初稿《没有共产党就没有中国》；1950年毛泽东指出“没有共产党的时候，中国早就有了”，建议加“新”字。", "source": "连夜创作了歌曲《没有共产党就没有中国》（初稿）……1950年毛泽东……建议加一个“新”字，遂定名为《没有共产党就没有新中国》", "layer": "ext"}, {"section": "北京地区的红色教育基地", "type": "single", "q": "卢沟桥桥上石狮的数量，导游讲解的通用口径为（　）。", "options": ["A. 281只", "B. 501只", "C. 627只", "D. 485只"], "answer": "B", "explain": "桥上望柱281根、石狮501只；“627只”出自《从海记》的另一种记载，导游讲解通用501只。", "source": "桥上望柱281根、石狮501只……石狮数量有“501只”与“627只”两种记载，导游讲解通用501只", "layer": "ext"}, {"section": "北京地区的红色教育基地", "type": "multi", "q": "下列关于1933年古北口战役的说法正确的有（　）。", "options": ["A. 发生于1933年3月，属长城抗战", "B. 打响了北京地区抗日战争第一枪", "C. 是长城抗战中规模最大、最惨烈的战役之一", "D. 阵亡将士360余名安葬于“肉丘坟”", "E. 由萧克指挥并取得胜利"], "answer": "ABCD", "explain": "萧克指挥的是1939年成立的冀热察挺进军；古北口战役由中国军队（第二十五师等）进行，与萧克无关。", "source": "1933年3月的古北口战役是长城抗战中规模最大、最惨烈的战役之一，被称为打响北京地区抗日战争第一枪之战……安葬古北口战役阵亡将士360余名", "layer": "ext"}, {"section": "北京地区的红色教育基地", "type": "single", "q": "1918年11月15日，李大钊发表著名演说《庶民的胜利》的地点是（　）。", "options": ["A. 天安门前", "B. 中央公园", "C. 北大红楼", "D. 陶然亭"], "answer": "A", "explain": "1918年11月15日北京大学在天安门前举行演讲大会，李大钊发表《庶民的胜利》，权威党史资料以“天安门前”为准。", "source": "1918年11月15日，北京大学在天安门前（天安门旁）举行演讲大会，李大钊在会上发表著名演说《庶民的胜利》", "layer": "ext"}, {"section": "北京地区的红色教育基地", "type": "single", "q": "1927年4月6日，李大钊被捕的地点是（　）。", "options": ["A. 西交民巷京师看守所", "B. 东交民巷苏联驻华使馆", "C. 西城区文华胡同24号", "D. 北大红楼"], "answer": "B", "explain": "奉系军阀京师警察厅闯入东交民巷苏联使馆区逮捕李大钊；西交民巷京师看守所是其就义地，文华胡同24号是其居住时间最长的住所。", "source": "1927年4月6日……闯入东交民巷苏联使馆区逮捕李大钊及留京的国共两党工作人员60余人", "layer": "ext"}, {"section": "北京地区的红色教育基地", "type": "multi", "q": "下列关于香山双清别墅与“进京赶考”的说法正确的有（　）。", "options": ["A. 双清别墅位于香山公园南麓半山腰", "B. 因院内石壁下有两眼清泉而得名", "C. “双清”二字为乾隆题写于石壁", "D. 1949年3月25日毛泽东率中共中央进驻香山", "E. 党中央在香山驻留了365天"], "answer": "ABCD", "explain": "党中央在香山驻留181天（1949年3月25日至9月21日），不是365天；其余各项与原文相符。", "source": "双清别墅位于海淀区香山公园南麓半山腰……因院内石壁下有两眼清泉……乾隆题“双清”二字于石壁……至9月21日的181天里", "layer": "ext"}, {"section": "北京地区的红色教育基地", "type": "single", "q": "李大钊烈士陵园位于（　）。", "options": ["A. 海淀区香山东麓万安公墓内", "B. 西城区陶然亭公园锦秋墩", "C. 东城区五四大街", "D. 丰台区卢沟桥畔"], "answer": "A", "explain": "李大钊烈士陵园位于海淀区香山东麓万安公墓内，1983年建成；陶然亭公园锦秋墩是高君宇烈士墓所在地。", "source": "李大钊烈士陵园位于北京海淀区香山东麓万安公墓内（香山东万安里1号），1983年建成，占地2200平方米", "layer": "ext"}, {"section": "北京地区的红色教育基地", "type": "single", "q": "五四运动前后，毛泽东第二次来到北京是（　）。", "options": ["A. 1918年8月，组织湖南青年赴法勤工俭学", "B. 1919年12月，率湖南驱张代表团进京", "C. 1919年3月，在北大二院听李大钊演讲", "D. 1918年10月，开始任北大图书馆助理员"], "answer": "B", "explain": "第二次为1919年12月率驱张（张敬尧）代表团进京；1918年8月到京是第一次，听课与任图书馆助理员均在第一次期间。", "source": "第二次在1919年12月（率湖南驱张代表团进京，为驱逐湖南军阀张敬尧寻求各方支持）", "layer": "ext"}, {"section": "北京地区的红色教育基地", "type": "multi", "q": "下列关于国家博物馆“古代中国”陈列中商周青铜器的说法正确的有（　）。", "options": ["A. “后母戊”青铜方鼎重832.84千克，是目前已知中国古代最重的青铜器", "B. 四羊青铜方尊1938年出土于湖南宁乡", "C. “利”青铜簋铭文印证“武王伐纣”的史实", "D. “盂”青铜鼎铭文记载周康王对盂的“册命”", "E. “后母戊”青铜方鼎出土于陕西临潼"], "answer": "ABCD", "explain": "后母戊鼎1939年出土于河南安阳武官村；陕西临潼是利簋的出土地，二者不可混淆。", "source": "“后母戊”青铜方鼎……重832.84千克，是目前已知中国古代最重的青铜器，1939年出土于河南安阳武官村……“利”青铜簋……1976年出土于陕西临潼", "layer": "ext"}, {"section": "北京地区的红色教育基地", "type": "single", "q": "中国共产党第一个少数民族党支部的诞生地是（　）。", "options": ["A. 中法大学", "B. 北京蒙藏学校", "C. 北京女子高等师范学校", "D. 长辛店劳动补习学校"], "answer": "B", "explain": "北京蒙藏学校（旧址在今西城区小石虎胡同33号）诞生了党在少数民族中建立的第一个党支部（第一个蒙古族党支部）。", "source": "中国共产党第一个少数民族党支部诞生地是北京蒙藏学校（国立蒙藏专门学校，旧址在今西城区小石虎胡同33号）", "layer": "ext"}, {"section": "北京地区的红色教育基地", "type": "single", "q": "中共蒙藏学校支部（党在少数民族中建立的第一个党支部）的书记是（　）。", "options": ["A. 乌兰夫", "B. 肖明", "C. 多松年", "D. 陈毅"], "answer": "C", "explain": "多松年任中共蒙藏学校支部书记；陈毅是1924—1925年中法大学党支部书记，肖明是1923年中法大学支部书记。", "source": "多松年、乌兰夫、奎璧、吉雅泰……陆续入党并成立中共蒙藏学校支部，多松年任书记", "layer": "ext"}, {"section": "北京地区的红色教育基地", "type": "multi", "q": "下列关于圆明园及西洋楼景区的说法正确的有（　）。", "options": ["A. 圆明三园指圆明园、长春园、绮春园", "B. 西洋楼景区位于长春园北部，有“东方凡尔赛宫”之誉", "C. 谐奇趣、海晏堂、大水法是三大欧式喷泉景观", "D. 海晏堂前十二生肖兽首按十二时辰依次喷水", "E. 西洋楼面积约占圆明园的二分之一"], "answer": "ABCD", "explain": "西洋楼面积仅占圆明园的五十分之一，而非二分之一；其余各项均与原文相符。", "source": "西洋楼面积仅占圆明园的五十分之一，偏居长春园北隅……谐奇趣、海晏堂、大水法是三大欧式喷泉景观", "layer": "ext"}, {"section": "北京地区的红色教育基地", "type": "single", "q": "中共中央第一份机关报《向导》周报的首任主编是（　）。", "options": ["A. 陈独秀", "B. 瞿秋白", "C. 蔡和森", "D. 彭述之"], "answer": "C", "explain": "《向导》1922年9月13日在上海创刊，蔡和森任主编，其后彭述之、瞿秋白继任；陈独秀题写刊名并撰写发刊词。", "source": "1922年9月13日在上海创刊，16开本，由蔡和森任主编（其后彭述之、瞿秋白继任），陈独秀题写刊名、撰写发刊词", "layer": "ext"}, {"section": "北京地区的红色教育基地", "type": "single", "q": "2008年奥运会后，北京城市中轴线延伸至（　）。", "options": ["A. 7.8公里", "B. 13公里", "C. 21公里", "D. 26公里"], "answer": "D", "explain": "传统中轴线长约7.8公里，1990年亚运会北延至13公里，2008年奥运会再次北延后延伸至26公里。", "source": "北京传统中轴线南起永定门、北至钟鼓楼（明清形成，长约7.8公里）……2008年奥运会再次北延……延伸至26公里", "layer": "ext"}, {"section": "北京地区的红色教育基地", "type": "multi", "q": "下列关于全民族抗战初期殉国将领的说法正确的有（　）。", "options": ["A. 佟麟阁时任国民革命军第二十九军副军长", "B. 佟麟阁是全民族抗战爆发后牺牲的第一位军级将领", "C. 赵登禹是抗战殉国的第一位师长", "D. 佟麟阁、赵登禹均于1937年7月28日在南苑殉国", "E. 张自忠于1937年7月在南苑殉国"], "answer": "ABCD", "explain": "张自忠是1940年枣宜会战牺牲的抗战殉国最高将领（集团军总司令），并非1937年牺牲于南苑。", "source": "佟麟阁……1937年7月28日……壮烈殉国，时年45岁……同日在南苑牺牲的还有第一三二师师长赵登禹……“集团军总司令”则是1940年枣宜会战牺牲的张自忠", "layer": "ext"}, {"section": "北京地区的红色教育基地", "type": "single", "q": "长辛店劳动补习学校正式开学的时间是（　）。", "options": ["A. 1920年10月", "B. 1921年1月", "C. 1921年5月", "D. 1922年4月"], "answer": "B", "explain": "1920年10月开始筹办，1921年1月正式开学；1921年5月1日在此成立长辛店铁路工人会。", "source": "李大钊派邓中夏、张国焘、罗章龙等到长辛店筹办，1921年1月正式开学，校址在丰台区长辛店大街祠堂口1号", "layer": "ext"}, {"section": "北京地区的红色教育基地", "type": "single", "q": "高君宇烈士墓位于（　）。", "options": ["A. 陶然亭公园", "B. 万安公墓", "C. 香山公园", "D. 中山公园"], "answer": "A", "explain": "高君宇1925年病逝后依遗愿葬于西城区陶然亭公园湖心岛锦秋墩北麓，与石评梅墓合称“高石之墓”；万安公墓是李大钊烈士陵园所在。", "source": "高君宇烈士墓位于西城区陶然亭公园湖心岛锦秋墩北麓……依其遗愿葬于陶然亭湖畔", "layer": "ext"}, {"section": "北京地区的红色教育基地", "type": "single", "q": "“中国人民抗日战争纪念馆”馆名的题写者是（　）。", "options": ["A. 邓小平", "B. 江泽民", "C. 彭真", "D. 张爱萍"], "answer": "A", "explain": "馆名由邓小平题写；江泽民1997年为二期工程竣工题词；彭真题写二七纪念馆馆名；张爱萍题写焦庄户地道战遗址纪念馆馆名。", "source": "馆名由邓小平同志亲自题写：“中国人民抗日战争纪念馆”11个鎏金大字……镶嵌于纪念馆正面宽大的花岗岩石门额上", "layer": "ext"}, {"section": "北京地区的红色教育基地", "type": "single", "q": "抗战时期焦庄户村挖建的地道网全长为（　）。", "options": ["A. 830米", "B. 15华里", "C. 23公里", "D. 23华里（约11.5公里）"], "answer": "D", "explain": "焦庄户地道全长23华里（约11.5公里）；830米是现供参观的地道长度。", "source": "历时三年挖建以焦庄户村为中心、向四周各村辐射的地道网，地道全长23华里（11.5公里）……现供参观的地道长830米", "layer": "ext"}, {"section": "北京地区的红色教育基地", "type": "single", "q": "古北口长城抗战纪念馆位于北京市（　）。", "options": ["A. 顺义区", "B. 密云区", "C. 房山区", "D. 延庆区"], "answer": "B", "explain": "纪念馆位于密云区古北口镇古北口村南关，居“古北口战役阵亡将士公墓”（肉丘坟）西侧。", "source": "古北口长城抗战纪念馆位于北京市密云区古北口镇古北口村南关……居于……“古北口战役阵亡将士公墓”西侧", "layer": "ext"}, {"section": "北京地区的红色教育基地", "type": "single", "q": "打响北京地区解放战争第一枪的是（　）。", "options": ["A. 古北口战役", "B. 古北口保卫战", "C. 南苑保卫战", "D. 七七事变"], "answer": "B", "explain": "1946年1月的古北口保卫战打响北京地区解放战争第一枪；1933年古北口战役是北京地区抗战第一枪，注意区分。", "source": "打响北京地区解放战争第一枪的保卫战是古北口保卫战（1946年1月）", "layer": "ext"}, {"section": "北京地区的红色教育基地", "type": "single", "q": "长辛店二七纪念馆正式开馆的时间是（　）。", "options": ["A. 1983年2月6日", "B. 1986年2月7日", "C. 1987年2月7日", "D. 1987年7月7日"], "answer": "C", "explain": "该馆1983年2月6日奠基，1987年2月7日正式开馆，讲解以“1983年奠基、1987年2月7日开馆”为准。", "source": "于1983年2月6日由中华全国总工会、铁道部、北京市共同投资兴建，时任国家副主席王震奠基，1987年2月7日正式开馆", "layer": "ext"}, {"section": "北京地区的红色教育基地", "type": "single", "q": "八路军冀热察挺进军的司令员是（　）。", "options": ["A. 萧克", "B. 陈毅", "C. 赵尔陆", "D. 郭天民"], "answer": "A", "explain": "1939年2月7日冀热察挺进军在平西三坡成立，萧克任司令员兼政治委员，统一指挥平西、平北、冀东抗日武装；赵尔陆、郭天民是古北口保卫战中纵队司令员。", "source": "1939年2月7日，八路军冀热察挺进军在平西三坡（今野三坡）正式成立，萧克任司令员兼政治委员", "layer": "ext"}, {"section": "北京地区的红色教育基地", "type": "single", "q": "中华人民共和国名誉主席宋庆龄同志故居位于北京市（　）。", "options": ["A. 西城区文华胡同24号", "B. 西城区魏染胡同30号", "C. 西城区后海北沿46号", "D. 西城区小石虎胡同33号"], "answer": "C", "explain": "宋庆龄故居位于后海北沿46号，原为清末醇亲王府花园；文华胡同24号是李大钊故居，魏染胡同30、32号是京报馆旧址，小石虎胡同33号是蒙藏学校旧址。", "source": "中华人民共和国名誉主席宋庆龄同志故居位于北京市西城区后海北沿46号（什刹海后海北岸）", "layer": "ext"}, {"section": "北京地区的红色教育基地", "type": "single", "q": "“新北京十六景”评选结果正式公布的时间是（　）。", "options": ["A. 1986年3月", "B. 1986年7月7日", "C. 1986年9月24日", "D. 1986年10月9日"], "answer": "D", "explain": "1986年3月发起评选，从40个候选景点中评出16景，结果于1986年10月9日公布，天安门广场以“天安丽日”之名当选。", "source": "1986年3月……共同发起“新北京十六景”评选，从40个候选景点中评选出16景，结果于1986年10月9日公布", "layer": "ext"}, {"section": "北京地区的红色教育基地", "type": "single", "q": "铭文印证“武王伐纣”在甲子日的史实、被称为“西周第一青铜器”的是（　）。", "options": ["A. “后母戊”青铜方鼎", "B. 四羊青铜方尊", "C. “利”青铜簋", "D. “盂”青铜鼎"], "answer": "C", "explain": "利簋1976年出土于陕西临潼，器内底铸铭文4行33字，印证武王伐纣在甲子日的史实，被称为“西周第一青铜器”。", "source": "“利”青铜簋（利簋）：西周早期，1976年出土于陕西临潼，器内底铸铭文4行33字，印证“武王伐纣”在甲子日的史实", "layer": "ext"}, {"section": "北京胡同及四合院", "layer": "core", "type": "single", "q": "下列胡同中，属于金代胡同（前身檀州街）的是（ ）。", "options": ["砖塔胡同", "南锣鼓巷", "三庙街", "灵境胡同"], "answer": "C", "explain": "三庙街（前身檀州街）属于金代胡同；砖塔胡同、南锣鼓巷属于元代胡同。", "source": "金代：三庙街（前身檀州街）等；元代：砖塔胡同、南锣鼓巷等"}, {"section": "北京胡同及四合院", "layer": "core", "type": "judge", "q": "北京最长的胡同是东交民巷，长约1552米。", "answer": "对", "explain": "正确。东交民巷是北京最长的胡同，长约1552米。", "source": "最长东交民巷（约1552米）"}, {"section": "北京胡同及四合院", "layer": "core", "type": "multi", "q": "元大都时期北京共有11座城门，其中位于南面的城门有（ ）。", "options": ["丽正门", "文明门", "顺承门", "崇仁门"], "answer": "ABC", "explain": "南面三门为丽正门、文明门、顺承门；崇仁门位于东面（东面：崇仁门、齐化门、光熙门；西面：和义门、平则门、肃清门；北面：安贞门、健德门）。", "source": "11座城门（南：丽正门、文明门、顺承门；东：崇仁门、齐化门、光熙门；西：和义门、平则门、肃清门；北：安贞门、健德门）"}, {"section": "北京胡同及四合院", "layer": "core", "type": "single", "q": "北京最窄的胡同是（ ），最窄处仅0.4米。", "options": ["灵境胡同", "钱市胡同", "东交民巷", "一尺大街"], "answer": "B", "explain": "最窄钱市胡同（最窄处0.4米）；最宽灵境胡同（32.18米）；最长东交民巷；最短一尺大街。", "source": "最窄钱市胡同（最窄处0.4米）"}, {"section": "北京胡同及四合院", "layer": "core", "type": "judge", "q": "北京最窄的胡同是灵境胡同，最窄处仅0.4米。", "answer": "错", "explain": "错误。北京最窄的胡同是钱市胡同，最窄处0.4米；灵境胡同是北京最宽的胡同，宽32.18米。", "source": "最宽灵境胡同（32.18米）；最窄钱市胡同（最窄处0.4米）"}, {"section": "北京胡同及四合院", "layer": "core", "type": "single", "q": "北京最短的胡同是（ ），仅30余米。", "options": ["一尺大街", "钱市胡同", "五道营胡同", "砖塔胡同"], "answer": "A", "explain": "最短一尺大街（30余米）；最长东交民巷约1552米。", "source": "最短一尺大街（30余米）"}, {"section": "北京胡同及四合院", "layer": "core", "type": "judge", "q": "东交民巷被列强划为\"使馆界\"，依据的是1901年9月7日签订的《辛丑条约》第七款，清政府与11国签订该条约。", "answer": "对", "explain": "正确。1901年9月7日《辛丑条约》第七款将东交民巷划为\"使馆界\"，清政府与11国签订。", "source": "1901年9月7日（《辛丑条约》第七款，与11国签订）"}, {"section": "北京胡同及四合院", "layer": "core", "type": "multi", "q": "下列属于北京四合院大门等级式样的有（ ）。", "options": ["广亮大门", "金柱大门", "蛮子门", "如意门", "垂花门"], "answer": "ABCD", "explain": "四合院大门等级由高到低为：王府大门→广亮大门→金柱大门→蛮子门→如意门→墙垣式门（随墙门）。垂花门是内宅外宅分界，不属于大门等级式样。", "source": "王府大门→广亮大门→金柱大门→蛮子门→如意门→墙垣式门（随墙门）"}, {"section": "北京胡同及四合院", "layer": "core", "type": "single", "q": "南锣鼓巷北起（ ），南止地安门东大街。", "options": ["地安门东大街", "鼓楼东大街", "雍和宫大街", "安定门内大街"], "answer": "B", "explain": "南锣鼓巷北起鼓楼东大街、南止地安门东大街，全长786米、宽8米。", "source": "北起鼓楼东大街、南止地安门东大街；全长786米、宽8米"}, {"section": "北京胡同及四合院", "layer": "core", "type": "judge", "q": "南锣鼓巷的水准点碑为汉白玉所制，标示老北京内城最高点，海拔49米。", "answer": "对", "explain": "正确。水准点碑为汉白玉，刻\"测北京水平\"与\"都市政公所\"，标示老北京内城最高点（海拔49米）。", "source": "水准点碑为汉白玉，刻\"测北京水平\"与\"都市政公所\"，标示老北京内城最高点（海拔49米）"}, {"section": "北京胡同及四合院", "layer": "core", "type": "single", "q": "南锣鼓巷的水准点碑标示老北京内城最高点，其海拔为（ ）。", "options": ["32.18米", "49米", "8米", "0.4米"], "answer": "B", "explain": "水准点碑标示老北京内城最高点，海拔49米。32.18米是灵境胡同宽度，8米是南锣鼓巷宽度，0.4米是钱市胡同最窄处。", "source": "水准点碑为汉白玉……标示老北京内城最高点（海拔49米）"}, {"section": "北京胡同及四合院", "layer": "core", "type": "judge", "q": "五道营胡同东起安定门内大街、西止雍和宫大街，全长632米、宽6米。", "answer": "错", "explain": "错误。起止点颠倒了：五道营胡同东起雍和宫大街、西止安定门内大街，全长632米、宽6米。", "source": "东起雍和宫大街、西止安定门内大街；全长632米、宽6米"}, {"section": "北京胡同及四合院", "layer": "core", "type": "multi", "q": "北京四合院影壁的式样包括（ ）。", "options": ["一字影壁", "座山影壁", "雁翅影壁", "撇山影壁", "九龙壁"], "answer": "ABCD", "explain": "大门内侧有一字影壁（独立影壁、座山影壁）；大门外有一字影壁、雁翅影壁；撇山影壁又称反八字影壁，与大门成120°或135°夹角。九龙壁不在其列。", "source": "大门内侧：一字影壁（独立影壁、座山影壁）；大门外：一字影壁、雁翅影壁；撇山影壁（反八字影壁，与大门成120°或135°夹角）"}, {"section": "北京胡同及四合院", "layer": "core", "type": "single", "q": "五道营胡同东起雍和宫大街，西止（ ），全长632米、宽6米。", "options": ["安定门内大街", "鼓楼东大街", "地安门东大街", "前门大街"], "answer": "A", "explain": "五道营胡同东起雍和宫大街、西止安定门内大街，全长632米、宽6米。", "source": "东起雍和宫大街、西止安定门内大街；全长632米、宽6米"}, {"section": "北京胡同及四合院", "layer": "core", "type": "judge", "q": "婉容旧居位于西城区帽儿胡同37号院，是溥仪皇后婉容的婚前住所。", "answer": "错", "explain": "错误。婉容旧居位于东城区交道口街道帽儿胡同37号院，不是西城区。", "source": "东城区交道口街道帽儿胡同37号院（溥仪皇后婉容婚前住所）"}, {"section": "北京胡同及四合院", "layer": "core", "type": "single", "q": "北京四合院的基本形式是一进院落（小型四合院），其平面呈（ ）字形。", "options": ["口", "日", "目", "田"], "answer": "A", "explain": "一进\"口\"字形、二进\"日\"字形、三进\"目\"字形。", "source": "基本形式一进院落（小型四合院）……一进\"口\"字形、二进\"日\"字形、三进\"目\"字形"}, {"section": "北京胡同及四合院", "layer": "core", "type": "multi", "q": "北京俗语\"东四西单鼓楼前\"所形容的内城最繁华三大商业区包括（ ）。", "options": ["东四", "西单", "鼓楼前（地安门外大街）", "天桥"], "answer": "ABC", "explain": "三大商业区为东四、西单、鼓楼前（即地安门外大街），天桥不在其列。", "source": "内城最繁华的三大商业区（东四、西单、鼓楼前即地安门外大街）"}, {"section": "北京胡同及四合院", "layer": "core", "type": "single", "q": "北京四合院的标准形式是（ ），即正房后加后罩房。", "options": ["一进院落", "二进院落", "三进院落", "四进院落"], "answer": "C", "explain": "标准形式为三进院落（正房后加后罩房）；基本形式为一进院落（小型四合院）。", "source": "基本形式一进院落（小型四合院）；标准形式三进院落（正房后加后罩房）"}, {"section": "北京胡同及四合院", "layer": "core", "type": "single", "q": "北京传统四合院中，作为内宅与外宅分界的是（ ）。", "options": ["影壁", "倒座房", "屏门", "垂花门"], "answer": "D", "explain": "垂花门是内宅外宅的分界。布局顺序为：大门（东南角\"巽\"位）→影壁→倒座房→屏门→垂花门→正房、耳房、东西厢房、抄手游廊→后罩房。", "source": "大门（东南角\"巽\"位）→影壁→倒座房→屏门→垂花门（内宅外宅分界）→正房、耳房、东西厢房、抄手游廊→后罩房"}, {"section": "北京胡同及四合院", "layer": "core", "type": "multi", "q": "下列关于北京城内\"四大天主堂\"的说法，正确的有（ ）。", "options": ["东堂王府井天主堂1655年建，罗马式", "南堂宣武门天主堂1605年利玛窦创建，是北京现存最古老的天主堂", "西堂西直门天主堂历史最长、规模最大", "北堂西什库天主堂规模最大，哥特式"], "answer": "ABD", "explain": "西堂西直门天主堂（圣母圣衣堂，1723年建）历史最短、规模最小，是唯一非耶稣会士建立的，哥特式；北堂西什库天主堂（1703年初建、1865年移建）最大，哥特式。南堂为巴洛克式。", "source": "东堂王府井天主堂（1655年建，罗马式）；南堂宣武门天主堂（1605年利玛窦创建，北京现存最古老，巴洛克式）；西堂西直门天主堂（圣母圣衣堂，1723年建，历史最短、规模最小，唯一非耶稣会士建立，哥特式）；北堂西什库天主堂（1703年初建、1865年移建，最大，哥特式）"}, {"section": "北京胡同及四合院", "layer": "core", "type": "single", "q": "北京俗语\"东四西单鼓楼前\"中，\"鼓楼前\"指的是（ ）。", "options": ["鼓楼东大街", "地安门外大街", "安定门内大街", "前门大街"], "answer": "B", "explain": "\"东四西单鼓楼前\"形容内城最繁华的三大商业区，鼓楼前即地安门外大街。", "source": "内城最繁华的三大商业区（东四、西单、鼓楼前即地安门外大街）"}, {"section": "北京胡同及四合院", "layer": "core", "type": "single", "q": "有\"全真第一丛林\"之称、为全真道龙门派祖庭的是（ ）。", "options": ["白云观", "王府井天主堂", "宣武门天主堂", "西什库天主堂"], "answer": "A", "explain": "北京白云观为全真道龙门派祖庭，有\"全真第一丛林\"之称。", "source": "全真道龙门派祖庭，\"全真第一丛林\""}, {"section": "北京胡同及四合院", "type": "single", "q": "元大都唯一见诸文献且700多年名称沿用未改的胡同是（　）。", "options": ["A. 三庙街", "B. 砖塔胡同", "C. 灵境胡同", "D. 钱市胡同"], "answer": "B", "explain": "砖塔胡同因东口元代\"万松老人塔\"得名，元人李好古杂剧《张生煮海》中已有记载，被罗哲文称为\"北京胡同之根\"。", "source": "以砖塔胡同为最典型……是元大都唯一见诸文献且700多年名称沿用未改的胡同。", "layer": "ext"}, {"section": "北京胡同及四合院", "type": "judge", "q": "三庙街的前身是辽金时期金中都最繁华的商业街\"檀州街\"，距今已有900余年，是北京现存年代最久远的街巷之一。", "answer": "对", "explain": "原文明确记载三庙街前身即金中都\"檀州街\"，距今已有900余年。", "source": "其前身即辽金时期金中都最繁华的商业街\"檀州街\"……距今已有900余年，是北京现存年代最久远的街巷之一。", "layer": "ext"}, {"section": "北京胡同及四合院", "type": "multi", "q": "下列元大都城门与今址对应正确的有（　）。", "options": ["A. 丽正门——今正阳门一带", "B. 崇仁门——今东直门", "C. 齐化门——今朝阳门", "D. 和义门——今阜成门", "E. 平则门——今西直门"], "answer": "ABC", "explain": "和义门为今西直门、平则门为今阜成门，D、E两项张冠李戴；丽正门今正阳门一带、崇仁门今东直门、齐化门今朝阳门均正确。", "source": "正中为丽正门（今正阳门一带）……正中为崇仁门（今东直门）、南为齐化门（今朝阳门）……正中为和义门（今西直门）、南为平则门（今阜成门）。", "layer": "ext"}, {"section": "北京胡同及四合院", "type": "single", "q": "北京最宽的胡同是（　），最宽处达32.18米。", "options": ["A. 灵境胡同", "B. 东交民巷", "C. 南锣鼓巷", "D. 砖塔胡同"], "answer": "A", "explain": "最宽的胡同为灵境胡同（西城区，东起府右街，西至西单北大街），最宽处达32.18米。", "source": "最宽的胡同——灵境胡同（西城区，东起府右街，西至西单北大街，与辟才胡同相通），最宽处达32.18米。", "layer": "ext"}, {"section": "北京胡同及四合院", "type": "judge", "q": "北京最窄的胡同钱市胡同全长55米，平均宽仅0.7米，最窄处仅0.4米。", "answer": "对", "explain": "钱市胡同全长55米，平均宽0.7米，最窄处0.4米，两人对面需侧身而过。", "source": "最窄的胡同——钱市胡同……胡同全长55米，平均宽仅0.7米，最窄处仅0.4米，两人对面需侧身而过。", "layer": "ext"}, {"section": "北京胡同及四合院", "type": "single", "q": "北京最长的胡同东交民巷，全长约（　）。", "options": ["A. 786米", "B. 1472米", "C. 1552米", "D. 1818米"], "answer": "C", "explain": "东交民巷东起崇文门内大街，西至天安门广场东侧路，全长约1552米（约1.6公里）。", "source": "最长的胡同——东交民巷（东起崇文门内大街，西至天安门广场东侧路），全长约1552米（约1.6公里）。", "layer": "ext"}, {"section": "北京胡同及四合院", "type": "judge", "q": "东交民巷被列强正式划为外国\"使馆界\"的时间是1900年八国联军攻入北京之日。", "answer": "错", "explain": "正式划为使馆界的时间是1901年9月7日《辛丑条约》签订；1900年义和团\"庚子之围\"是导火索而非设界时间。", "source": "东交民巷被正式划为外国\"使馆界\"的时间是1901年（清光绪二十七年）9月7日。", "layer": "ext"}, {"section": "北京胡同及四合院", "type": "multi", "q": "下列属于北京四合院临街宅门等级序列的有（　）。", "options": ["A. 王府大门", "B. 广亮大门", "C. 金柱大门", "D. 如意门", "E. 垂花门"], "answer": "ABCD", "explain": "宅门等级序列为：王府大门＞广亮大门＞金柱大门＞蛮子门＞如意门＞墙垣式门；垂花门属四合院内门（二门），不在临街宅门等级序列之内。", "source": "\"大门等级\"通行序列为：王府大门＞广亮大门＞金柱大门＞蛮子门＞如意门＞墙垣式门……垂花门属四合院内门（二门），不在临街宅门的等级序列之内。", "layer": "ext"}, {"section": "北京胡同及四合院", "type": "single", "q": "北京最短的胡同是（　），长约30余米，现已并入杨梅竹斜街。", "options": ["A. 一尺大街", "B. 钱市胡同", "C. 辟才胡同", "D. 果子巷"], "answer": "A", "explain": "最短的胡同为一尺大街，位于大栅栏历史文化街区内、今杨梅竹斜街西段，长约30余米。", "source": "最短的胡同——一尺大街，位于大栅栏历史文化街区内、今杨梅竹斜街西段，长约30余米。", "layer": "ext"}, {"section": "北京胡同及四合院", "type": "judge", "q": "五道营胡同明代属崇教坊，因守城兵营驻扎称\"武德卫营\"，清代属正黄旗，依\"武德\"谐音改称\"五道营\"。", "answer": "错", "explain": "五道营胡同清代属镶黄旗而非正黄旗，其余表述正确。", "source": "明代属崇教坊，因有守城兵营驻扎，称\"武德卫营\"；清代属镶黄旗，依\"武德\"谐音改称\"五道营\"。", "layer": "ext"}, {"section": "北京胡同及四合院", "type": "single", "q": "南锣鼓巷的全长为（　）。", "options": ["A. 632米", "B. 786米", "C. 1472米", "D. 1552米"], "answer": "B", "explain": "南锣鼓巷北起鼓楼东大街，南止地安门东大街，全长786米，宽8米。", "source": "南锣鼓巷位于北京市东城区，南北走向，北起鼓楼东大街，南止地安门东大街（平安大街）……全长786米，宽8米。", "layer": "ext"}, {"section": "北京胡同及四合院", "type": "judge", "q": "北京最短的胡同一尺大街原有6座店铺，路北3家为酒馆、铁匠铺、理发店，路南3家为刻字店。", "answer": "错", "explain": "一尺大街原有6座店铺，应为路北3家刻字店，路南3家为酒馆、铁匠铺、理发店，题干南北颠倒。", "source": "原有6座店铺（路北3家刻字店，路南3家为酒馆、铁匠铺、理发店），现已并入杨梅竹斜街。", "layer": "ext"}, {"section": "北京胡同及四合院", "type": "multi", "q": "下列属于北京城内\"四大天主堂\"的有（　）。", "options": ["A. 王府井天主堂（东堂）", "B. 宣武门天主堂（南堂）", "C. 西直门天主堂（西堂）", "D. 西什库天主堂（北堂）", "E. 圣米厄尔教堂"], "answer": "ABCD", "explain": "四大天主堂为东堂王府井天主堂、南堂宣武门天主堂、西堂西直门天主堂、北堂西什库天主堂；东交民巷的圣米厄尔教堂不在\"四大堂\"之列。", "source": "东堂——王府井天主堂……南堂——宣武门天主堂……西堂——西直门天主堂……北堂——西什库天主堂。东交民巷的圣米厄尔教堂……不在\"四大堂\"之列。", "layer": "ext"}, {"section": "北京胡同及四合院", "type": "single", "q": "南锣鼓巷的\"水准点碑\"标示的是老北京内城的最高点，其海拔为（　）。", "options": ["A. 39米", "B. 45米", "C. 49米", "D. 53米"], "answer": "C", "explain": "水准点碑为民国时期所立，标示老北京内城最高点，海拔49米。", "source": "该碑为民国时期所立……标示的是老北京内城的最高点，海拔49米。", "layer": "ext"}, {"section": "北京胡同及四合院", "type": "judge", "q": "东交民巷原名\"东江米巷\"，元朝时与西交民巷本为一条胡同，明清两代为\"五部六府\"所在地。", "answer": "对", "explain": "原文记载东交民巷原名\"东江米巷\"，因地处南粮北运要地得名，明清两代为\"五部六府\"所在地。", "source": "东交民巷原名\"东江米巷\"，元朝时与西交民巷本为一条胡同……明清两代为\"五部六府\"所在地。", "layer": "ext"}, {"section": "北京胡同及四合院", "type": "single", "q": "北京四合院的标准（典型）形式是（　）。", "options": ["A. 一进院落", "B. 二进院落", "C. 三进院落", "D. 四进院落"], "answer": "C", "explain": "标准形式为三进院落，在二进院落基础上于正房之后加一排后罩房，形成\"前院—正院—后院\"三段式布局。", "source": "标准形式——三进院落（典型／标准四合院，属中型四合院）：在二进院落基础上沿纵深方向发展，于正房之后加一排后罩房。", "layer": "ext"}, {"section": "北京胡同及四合院", "type": "judge", "q": "南锣鼓巷水准点碑通体由汉白玉制成，碑高1米、宽0.2米，此类石碑目前在全市存留不超过5块。", "answer": "错", "explain": "碑高1米、宽0.2米、汉白玉制成均正确，但此类石碑目前全市存留不超过3块，而非5块。", "source": "碑高1米、宽0.2米，通体由汉白玉制成……此类石碑目前在全市存留不超过3块，现以玻璃罩保护。", "layer": "ext"}, {"section": "北京胡同及四合院", "type": "multi", "q": "经考古钻探与文献印证，金中都东部遗留至今的\"开放型胡同\"有（　）。", "options": ["A. 北柳巷", "B. 南柳巷", "C. 魏染胡同", "D. 四川营", "E. 灵境胡同"], "answer": "ABCD", "explain": "金中都遗留至今的\"开放型胡同\"有北柳巷、南柳巷、魏染胡同、四川营、果子巷、米市胡同、椿树胡同等；灵境胡同为明代得名，不在其列。", "source": "金中都东部遗留至今的\"开放型胡同\"还有北柳巷、南柳巷、魏染胡同、四川营、果子巷、米市胡同、椿树胡同等。", "layer": "ext"}, {"section": "北京胡同及四合院", "type": "single", "q": "婉容旧居位于北京市东城区（　）。", "options": ["A. 南锣鼓巷37号", "B. 帽儿胡同37号", "C. 五道营胡同37号", "D. 东四三条37号"], "answer": "B", "explain": "婉容旧居位于东城区交道口街道帽儿胡同37号院，是溥仪皇后郭布罗·婉容的婚前住所。", "source": "婉容旧居位于北京市东城区交道口街道帽儿胡同37号院（旧宅园）……是清朝末代皇帝溥仪的皇后郭布罗·婉容的婚前住所。", "layer": "ext"}, {"section": "北京胡同及四合院", "type": "judge", "q": "北堂西什库天主堂主体建筑为哥特式，被认为是巴黎圣母院的翻版，讲经大堂内有明柱36根。", "answer": "对", "explain": "原文明确记载西什库天主堂主体为哥特式，被认为是巴黎圣母院的翻版，讲经大堂内有明柱36根。", "source": "主体建筑为哥特式，被认为是巴黎圣母院的翻版，讲经大堂内有明柱36根。", "layer": "ext"}, {"section": "北京胡同及四合院", "type": "single", "q": "北京白云观所属的道教流派是（　）。", "options": ["A. 正一道龙虎宗", "B. 全真道龙门派", "C. 全真道华山派", "D. 正一道茅山宗"], "answer": "B", "explain": "北京白云观是道教全真道龙门派的祖庭，享有\"全真第一丛林\"之誉，是北方道教的中心。", "source": "北京白云观位于西城区白云观街（西便门外），是道教全真道龙门派的祖庭，享有\"全真第一丛林\"之誉。", "layer": "ext"}, {"section": "北京胡同及四合院", "type": "multi", "q": "下列关于婉容旧居的说法正确的有（　）。", "options": ["A. 位于东城区交道口街道帽儿胡同", "B. 西路为居住区，由四进院落组成", "C. 东路为小型私家园林，设有三进院落", "D. 1984年被公布为北京市第三批文物保护单位", "E. 是末代皇后婉容的出生地"], "answer": "ABCD", "explain": "婉容旧居分东西两路，西路居住区四进、东路园林三进，1984年列入北京市第三批文保单位；E错，准确表述应为\"婚前住所\"而非出生地。", "source": "该宅是……婉容的婚前住所……西路为居住区，由四进院落组成；东路为小型私家园林，设有三进院落。1984年，该宅邸被公布为北京市第三批文物保护单位。", "layer": "ext"}, {"section": "北京胡同及四合院", "type": "single", "q": "北京金代胡同中最具代表性、清代因第三座关帝庙坐落此街而定名的是（　）。", "options": ["A. 砖塔胡同", "B. 三庙街", "C. 魏染胡同", "D. 果子巷"], "answer": "B", "explain": "三庙街前身为金中都\"檀州街\"，清代因第三座关帝庙（头庙、二庙、三庙）坐落此街而定名，距今900余年。", "source": "清代因第三座关帝庙（头庙、二庙、三庙）坐落此街而定名\"三庙街\"，距今已有900余年。", "layer": "ext"}, {"section": "北京胡同及四合院", "type": "single", "q": "据《析津志》记载，元大都全城划分为（　）坊，有\"三百八十四火巷、二十九胡同\"。", "options": ["A. 30", "B. 40", "C. 50", "D. 60"], "answer": "C", "explain": "《析津志》记载元大都全城划分为50坊，全城街巷胡同合计400余条。", "source": "据《析津志》记载，元大都全城划分为50坊，有\"三百八十四火巷、二十九胡同\"，全城街巷胡同合计400余条。", "layer": "ext"}, {"section": "北京胡同及四合院", "type": "multi", "q": "北京四合院影壁按位置与平面形式，常见式样有（　）。", "options": ["A. 独立影壁", "B. 座山影壁", "C. 雁翅影壁", "D. 撇山影壁", "E. 九龙壁"], "answer": "ABCD", "explain": "常见式样三大类：大门内侧一字影壁（独立影壁、座山影壁）、大门外一字影壁与雁翅影壁、大门两侧的撇山影壁（反八字影壁）；九龙壁不在其列。", "source": "常见式样有三大类：①大门内侧的一字影壁……称\"独立影壁\"……称\"座山影壁\"……③撇山影壁（反八字影壁）。", "layer": "ext"}, {"section": "北京胡同及四合院", "type": "single", "q": "北京最宽的胡同灵境胡同，最宽处达（　）。", "options": ["A. 28.18米", "B. 30.18米", "C. 32.18米", "D. 36.18米"], "answer": "C", "explain": "灵境胡同位于西城区，东起府右街，西至西单北大街，最宽处达32.18米。", "source": "最宽的胡同——灵境胡同（西城区，东起府右街，西至西单北大街，与辟才胡同相通），最宽处达32.18米。", "layer": "ext"}, {"section": "北京胡同及四合院", "type": "single", "q": "钱市胡同是清代官办（　）交易\"钱市\"的遗存，为早期金融市场的雏形，胡同即因此得名。", "options": ["A. 银钱", "B. 粮食", "C. 丝绸", "D. 茶叶"], "answer": "A", "explain": "钱市胡同是清代官办银钱交易\"钱市\"的遗存，为早期金融市场的雏形，胡同即因此得名。", "source": "是清代官办银钱交易\"钱市\"的遗存，为早期金融市场的雏形，胡同即因此得名。", "layer": "ext"}, {"section": "北京胡同及四合院", "type": "single", "q": "南锣鼓巷以南北主街为轴线，东西两侧各对称分布8条平行胡同，共（　）条，呈\"鱼骨状\"。", "options": ["A. 8条", "B. 10条", "C. 12条", "D. 16条"], "answer": "D", "explain": "南锣鼓巷东西两侧各对称分布8条平行胡同，共16条，呈\"鱼骨状\"（俗称\"蜈蚣巷\"）。", "source": "以南北主街为轴线，东西两侧各对称分布8条平行胡同，共16条，呈\"鱼骨状\"（俗称\"蜈蚣巷\"）。", "layer": "ext"}, {"section": "北京胡同及四合院", "type": "single", "q": "五道营胡同东起雍和宫大街、西止安定门内大街，全长（　）。", "options": ["A. 55米", "B. 300米", "C. 632米", "D. 786米"], "answer": "C", "explain": "五道营胡同呈东西走向，全长632米，宽6米，共有院落69个。", "source": "东起雍和宫大街，西止安定门内大街……全长632米，宽6米（最窄处约3米），共有院落69个。", "layer": "ext"}, {"section": "北京胡同及四合院", "type": "single", "q": "北京四合院的宅门一般辟于院落（　），体现\"坎宅巽门\"的原则。", "options": ["A. 东北角", "B. 东南角", "C. 西南角", "D. 西北角"], "answer": "B", "explain": "宅门辟于院落东南角\"巽\"位，体现\"坎宅巽门\"原则，取紫气东来、引东南风而挡西北风之意。", "source": "宅门辟于院落东南角\"巽\"位，体现\"坎宅巽门\"的原则（取紫气东来、引东南风而挡西北风之意）。", "layer": "ext"}, {"section": "北京胡同及四合院", "type": "single", "q": "旧时所谓\"大门不出，二门不迈\"中的\"二门\"，指的是四合院中的（　）。", "options": ["A. 屏门", "B. 垂花门", "C. 广亮大门", "D. 如意门"], "answer": "B", "explain": "垂花门位于中轴线上、正房与倒座之间，是内宅与外宅的分界线，\"大门不出，二门不迈\"即指此门。", "source": "垂花门（二门、内门）……是内宅与外宅的分界线和唯一通道……旧时\"大门不出，二门不迈\"即指此门。", "layer": "ext"}, {"section": "北京胡同及四合院", "type": "single", "q": "老北京俗语\"东四西单鼓楼前\"中，\"鼓楼前\"指的是（　）。", "options": ["A. 鼓楼东大街", "B. 地安门外大街", "C. 前门大街", "D. 东四北大街"], "answer": "B", "explain": "\"鼓楼前\"即钟鼓楼以南、地安门以北的地安门外大街，是元大都\"前朝后市\"规制中\"后市\"所在地。", "source": "鼓楼前——即钟鼓楼以南、地安门以北的地安门外大街（长约800米），是元大都\"前朝后市\"规制中\"后市\"的所在地。", "layer": "ext"}, {"section": "北京商业街及老字号", "layer": "core", "type": "single", "q": "号称\"中国布鞋第一家\"的老字号是（ ）。", "options": ["瑞蚨祥", "内联升", "鹤年堂", "盛锡福"], "answer": "B", "explain": "内联升号称\"中国布鞋第一家\"；瑞蚨祥以丝绸为特色；盛锡福以帽子为特色。", "source": "号称\"中国布鞋第一家\"的老字号——内联升"}, {"section": "北京商业街及老字号", "layer": "core", "type": "judge", "q": "鹤年堂被北京老字号协会授予\"京城养生老字号，历史悠久第一家\"称号。", "answer": "对", "explain": "正确。获此称号的是鹤年堂，勿误作同仁堂。", "source": "鹤年堂……（勿混：\"京城养生老字号第一家\"是鹤年堂，勿误作同仁堂）"}, {"section": "北京商业街及老字号", "layer": "core", "type": "multi", "q": "下列属于清真餐馆的老字号有（ ）。", "options": ["东来顺", "鸿宾楼", "烤肉宛", "烤肉季", "丰泽园"], "answer": "ABCD", "explain": "清真餐馆老字号有东来顺、鸿宾楼、烤肉宛、烤肉季等；丰泽园主要经营鲁菜，不是清真餐馆。", "source": "东来顺、鸿宾楼、烤肉宛、烤肉季等"}, {"section": "北京商业街及老字号", "layer": "core", "type": "single", "q": "以经营\"烧卖\"为主要特色的老字号是（ ）。", "options": ["天福号", "丰泽园", "都一处", "东来顺"], "answer": "C", "explain": "都一处以经营\"烧卖\"为主要特色；天福号经营酱肘子；丰泽园经营鲁菜；东来顺为清真餐馆。", "source": "以经营\"烧卖\"为主要特色的老字号——都一处"}, {"section": "北京商业街及老字号", "layer": "core", "type": "judge", "q": "为开国大典上升起的第一面五星红旗提供面料的老字号是内联升。", "answer": "错", "explain": "错误。提供面料的是瑞蚨祥；内联升号称\"中国布鞋第一家\"。", "source": "内联升；瑞蚨祥……为开国大典上升起的第一面五星红旗提供面料的老字号"}, {"section": "北京商业街及老字号", "layer": "core", "type": "single", "q": "在经营北京酱菜的老字号中，被称为\"南酱园\"（铁门酱园）的是（ ）。", "options": ["六必居", "天源酱园", "桂馨斋", "大顺斋"], "answer": "C", "explain": "南酱园为桂馨斋（铁门酱园）；老酱园六必居（1530年）；京酱园天源酱园（1869年）。", "source": "南酱园桂馨斋（铁门酱园）"}, {"section": "北京商业街及老字号", "layer": "core", "type": "judge", "q": "六必居创办于1530年，在经营北京酱菜的老字号中被称为\"老酱园\"。", "answer": "对", "explain": "正确。老酱园六必居（1530年）；京酱园天源酱园（1869年）；南酱园桂馨斋（铁门酱园）。", "source": "老酱园六必居（1530年）；京酱园天源酱园（1869年）；南酱园桂馨斋（铁门酱园）"}, {"section": "北京商业街及老字号", "layer": "core", "type": "multi", "q": "下列属于琉璃厂商业街区老字号的有（ ）。", "options": ["荣宝斋", "一得阁", "戴月轩", "中国书店", "内联升"], "answer": "ABCD", "explain": "琉璃厂商街老字号有荣宝斋、一得阁、戴月轩、中国书店等；内联升总店位于前门外大栅栏街。", "source": "荣宝斋、一得阁、戴月轩、中国书店等"}, {"section": "北京商业街及老字号", "layer": "core", "type": "single", "q": "被称为\"京酱园\"、创办于1869年的酱菜老字号是（ ）。", "options": ["六必居", "天源酱园", "桂馨斋", "稻香村"], "answer": "B", "explain": "京酱园天源酱园（1869年）；老酱园六必居（1530年）；南酱园桂馨斋。", "source": "京酱园天源酱园（1869年）"}, {"section": "北京商业街及老字号", "layer": "core", "type": "judge", "q": "大顺斋是北京主要经营南味苏式糕点的老字号。", "answer": "错", "explain": "错误。大顺斋是主要经营清真糕点的老字号（糖火烧）；经营南味苏式糕点的是稻香村。", "source": "大顺斋（糖火烧）（勿混：大顺斋为清真糕点，勿误作稻香村，稻香村为南味苏式糕点）"}, {"section": "北京商业街及老字号", "layer": "core", "type": "single", "q": "北京主要经营清真糕点、以糖火烧著称的老字号是（ ）。", "options": ["稻香村", "大顺斋", "桂馨斋", "天源酱园"], "answer": "B", "explain": "大顺斋为清真糕点（糖火烧）；稻香村为南味苏式糕点，勿混淆。", "source": "大顺斋（糖火烧）（勿混：大顺斋为清真糕点，勿误作稻香村，稻香村为南味苏式糕点）"}, {"section": "北京商业街及老字号", "layer": "core", "type": "judge", "q": "北京最早出现的电影院大观楼位于王府井大街，1905年拍摄并首映了中国第一部电影《定军山》。", "answer": "错", "explain": "错误。大观楼位于前门外大栅栏，不是王府井大街。", "source": "大观楼（前门外大栅栏，1905年拍摄并首映中国第一部电影《定军山》）"}, {"section": "北京商业街及老字号", "layer": "core", "type": "multi", "q": "下列属于同仁堂店训与立身信条的有（ ）。", "options": ["炮制虽繁，必不敢省人工", "品味虽贵，必不敢减物力", "修合无人见，存心有天知", "货真价实，童叟无欺"], "answer": "ABC", "explain": "同仁堂店训为\"炮制虽繁，必不敢省人工；品味虽贵，必不敢减物力\"，以\"修合无人见，存心有天知\"作为立身信条。", "source": "以\"炮制虽繁，必不敢省人工；品味虽贵，必不敢减物力\"为店训，以\"修合无人见，存心有天知\"作为立身信条的老字号——同仁堂"}, {"section": "北京商业街及老字号", "layer": "core", "type": "single", "q": "荣获\"中国丝绸第一品牌\"称号的老字号瑞蚨祥位于（ ）。", "options": ["西城区前门外大栅栏街5号", "前门外大栅栏街34号", "东城区王府井大街", "东直门内大街"], "answer": "A", "explain": "瑞蚨祥位于西城区前门外大栅栏街5号；前门外大栅栏街34号是内联升总店。", "source": "瑞蚨祥（西城区前门外大栅栏街5号）"}, {"section": "北京商业街及老字号", "layer": "core", "type": "judge", "q": "荣膺\"中华第一街\"称号的商业街区是王府井大街。", "answer": "对", "explain": "正确。商业街区语境下\"中华第一街\"指王府井大街（长安街亦有\"中华第一街\"之称，注意区分语境）。", "source": "王府井大街（勿混：长安街亦有\"中华第一街\"之称，商业街区语境指王府井大街）"}, {"section": "北京商业街及老字号", "layer": "core", "type": "single", "q": "2008年列入国家级非物质文化遗产的内联升技艺是（ ）。", "options": ["酱肘子制作技艺", "千层底布鞋制作技艺", "挂炉烤鸭技艺", "酿酱技艺"], "answer": "B", "explain": "内联升以生产国家级非遗产品\"千层底布鞋\"著称，其制作技艺2008年列入国家级非遗。", "source": "内联升（千层底布鞋制作技艺2008年列入国家级非遗）"}, {"section": "北京商业街及老字号", "layer": "core", "type": "judge", "q": "北京烤鸭已有约600多年历史；全聚德创建于1864年，是挂炉烤鸭的代表。", "answer": "对", "explain": "正确。北京烤鸭约600多年历史；挂炉烤鸭以全聚德（1864年创建）为代表，焖炉烤鸭以便宜坊（1416年创建）为代表。", "source": "全聚德（1864年创建）；全聚德与便宜坊（1416年创建）；约600多年；挂炉烤鸭（全聚德代表）与焖炉烤鸭（便宜坊代表）"}, {"section": "北京商业街及老字号", "layer": "core", "type": "multi", "q": "下列关于鹤年堂、同仁堂药品特色的说法，正确的有（ ）。", "options": ["丸散膏丹以同仁堂著称", "汤剂饮片以鹤年堂著称", "丸散膏丹以鹤年堂著称", "汤剂饮片以同仁堂著称"], "answer": "AB", "explain": "药品特色为\"丸散膏丹同仁堂，汤剂饮片鹤年堂\"，C、D搭配颠倒。", "source": "丸散膏丹同仁堂；汤剂饮片鹤年堂"}, {"section": "北京商业街及老字号", "layer": "core", "type": "single", "q": "以多民族文化交融为特色的传统商业街区是（ ）。", "options": ["琉璃厂", "牛街", "天桥", "簋街"], "answer": "B", "explain": "牛街以多民族文化交融为特色；琉璃厂以传统士人文化为突出特色。", "source": "以多民族文化交融为特色的传统商业街区——牛街"}, {"section": "北京商业街及老字号", "layer": "core", "type": "judge", "q": "同仁堂创建于1669年，创始人是乐显扬。", "answer": "对", "explain": "正确。同仁堂1669年创建，创始人乐显扬。", "source": "同仁堂（1669年创建，创始人乐显扬）"}, {"section": "北京商业街及老字号", "layer": "core", "type": "single", "q": "以传统士人文化为突出特色的商业街区是（ ）。", "options": ["牛街", "琉璃厂", "什刹海", "大栅栏"], "answer": "B", "explain": "琉璃厂以传统士人文化为突出特色；牛街以多民族文化交融为特色。", "source": "以传统士人文化为突出特色的商业街区——琉璃厂"}, {"section": "北京商业街及老字号", "layer": "core", "type": "judge", "q": "北京最早出现的综合性市场是东安市场，创办于1913年，位于王府井大街。", "answer": "错", "explain": "错误。东安市场创办于1903年，不是1913年。", "source": "东安市场（1903年，王府井大街）"}, {"section": "北京商业街及老字号", "layer": "core", "type": "multi", "q": "下列关于北京商业市场沿革的说法，正确的有（ ）。", "options": ["前门大栅栏商业街区萌生于明代", "明代北京内城最早的庙市是都城隍庙庙市（成方街）", "东安市场是北京最早出现的综合性市场", "牛街是北京城内回族聚族而居最大的街区"], "answer": "ABCD", "explain": "四项均正确：大栅栏萌生明代；明代内城最早庙市为都城隍庙庙市（成方街）；东安市场（1903年，王府井大街）为最早综合性市场；牛街为回族聚族而居最大街区。", "source": "东安市场（1903年，王府井大街）；明代；都城隍庙庙市（成方街）；牛街"}, {"section": "北京商业街及老字号", "layer": "core", "type": "single", "q": "被称为\"京城最大的平民娱乐场所\"的商业街区是（ ）。", "options": ["王府井大街", "什刹海", "天桥", "大栅栏"], "answer": "C", "explain": "天桥（天桥市场）被称为\"京城最大的平民娱乐场所\"。", "source": "天桥（天桥市场）"}, {"section": "北京商业街及老字号", "layer": "core", "type": "single", "q": "被誉为\"夜食者的天堂\"的著名美食商业街是（ ）。", "options": ["簋街（东直门内大街）", "牛街", "王府井大街", "鲜鱼口"], "answer": "A", "explain": "簋街（东直门内大街）被誉为\"夜食者的天堂\"。", "source": "簋街（东直门内大街）"}, {"section": "北京商业街及老字号", "layer": "core", "type": "multi", "q": "下列老字号与其经营特色对应正确的有（ ）。", "options": ["盛锡福——帽子", "天福号——酱肘子", "内联升——总店位于前门外大栅栏街34号", "都一处——酱菜"], "answer": "ABC", "explain": "以帽子为特色的是盛锡福（另有马聚源一说）；天福号主要菜品为酱肘子；内联升是国内规模最大的手工布鞋制作与销售老字号，总店在前门外大栅栏街34号；都一处以烧卖为特色而非酱菜。", "source": "瑞蚨祥；盛锡福（另有马聚源一说）……酱肘子……内联升（总店前门外大栅栏街34号）"}, {"section": "北京商业街及老字号", "layer": "core", "type": "single", "q": "被命名为\"北京市特色市场\"的市场是（ ）。", "options": ["东安市场", "天桥市场", "红桥市场", "荷花市场"], "answer": "C", "explain": "红桥市场被命名为\"北京市特色市场\"。", "source": "红桥市场"}, {"section": "北京商业街及老字号", "layer": "core", "type": "single", "q": "什刹海的荷花市场形成于清朝末年，其正式开办的时间是（ ）。", "options": ["1903年", "1905年", "1916年", "1930年"], "answer": "C", "explain": "荷花市场形成于清朝末年（清代晚期），1916年正式开办。什刹海（前海、后海、西海）是以\"湖光山色\"为特点的传统商业街区。", "source": "清朝末年（清代晚期，1916年正式开办）；什刹海（前海、后海、西海）"}, {"section": "北京商业街及老字号", "layer": "core", "type": "single", "q": "被誉为\"中国第一餐饮品牌\"、创建于1864年的老字号是（ ）。", "options": ["便宜坊", "全聚德", "丰泽园", "东来顺"], "answer": "B", "explain": "全聚德1864年创建，为\"中国第一餐饮品牌\"，是挂炉烤鸭代表；便宜坊1416年创建，是焖炉烤鸭代表。", "source": "全聚德（1864年创建）；全聚德与便宜坊（1416年创建）"}, {"section": "北京商业街及老字号", "layer": "core", "type": "single", "q": "主要经营鲁菜、以葱烧海参闻名、创建于1930年的老字号是（ ）。", "options": ["丰泽园", "鸿宾楼", "烤肉季", "天福号"], "answer": "A", "explain": "丰泽园1930年创建，主要经营鲁菜，代表菜葱烧海参。", "source": "丰泽园（1930年创建，葱烧海参）"}, {"section": "北京商业街及老字号", "type": "single", "q": "2005年被北京老字号协会授予\"京城养生老字号，历史悠久第一家\"称号的是（　）。", "options": ["A. 同仁堂", "B. 鹤年堂", "C. 六必居", "D. 天源酱园"], "answer": "B", "explain": "鹤年堂2005年获此称号，注意勿与同仁堂混淆；鹤年堂是北京医药行业现存历史最悠久的老字号。", "source": "鹤年堂——被北京老字号协会于2005年授予\"京城养生老字号，历史悠久第一家\"称号。", "layer": "ext"}, {"section": "北京商业街及老字号", "type": "judge", "q": "鹤年堂创建于明永乐三年（1405年），相传由元末明初回回诗人、浙江药商丁鹤年创建于牛街一带。", "answer": "对", "explain": "原文记载鹤年堂创建于明永乐三年（1405年），相传由丁鹤年创建于牛街一带。", "source": "鹤年堂创建于明永乐三年（1405年），相传由元末明初回回诗人、浙江药商丁鹤年创建于牛街一带。", "layer": "ext"}, {"section": "北京商业街及老字号", "type": "multi", "q": "下列属于清真餐馆老字号的有（　）。", "options": ["A. 东来顺", "B. 鸿宾楼", "C. 烤肉宛", "D. 丰泽园", "E. 全聚德"], "answer": "ABC", "explain": "东来顺（涮羊肉）、鸿宾楼、烤肉宛（烤牛肉）均为清真餐馆老字号；丰泽园为鲁菜老字号，全聚德为烤鸭老字号。", "source": "清真餐馆：东来顺（以涮羊肉闻名）、鸿宾楼（创建于清咸丰三年1853年……）、又一顺、烤肉宛（创建于清康熙二十五年1686年，以烤牛肉闻名）……", "layer": "ext"}, {"section": "北京商业街及老字号", "type": "single", "q": "号称\"中国布鞋第一家\"的老字号是（　）。", "options": ["A. 内联升", "B. 瑞蚨祥", "C. 盛锡福", "D. 马聚源"], "answer": "A", "explain": "内联升2006年获商务部首批\"中华老字号\"认定，同年被中国商业联合会授予\"中国布鞋第一家\"荣誉称号。", "source": "内联升——号称\"中国布鞋第一家\"……2006年获商务部首批\"中华老字号\"认定，同年被中国商业联合会授予\"中国布鞋第一家\"荣誉称号。", "layer": "ext"}, {"section": "北京商业街及老字号", "type": "judge", "q": "瑞蚨祥为开国大典第一面五星红旗提供面料，该国旗长460厘米、高338厘米，现藏中国国家博物馆。", "answer": "对", "explain": "1949年9月宋树信在瑞蚨祥寻得红绸黄缎，制成国旗长460厘米、高338厘米。", "source": "在前门外大栅栏的瑞蚨祥寻得做旗面的红绸与做五角星的黄缎，连夜赶制成长460厘米、高338厘米的 plain": "什刹海位于北京市西城区而非东城区，故E错；其余四项均为原文表述。", "source": "什刹海……位于北京市西城区，由前海、后海、西海组成，沿岸有烟袋斜街、荷花市场、酒吧茶艺一条街等……向有\"北方水乡\"之誉。", "layer": "ext"}, {"section": "北京商业街及老字号", "type": "single", "q": "瑞蚨祥前门总店位于北京市西城区前门外大栅栏街（　）。", "options": ["A. 5号", "B. 18号", "C. 34号", "D. 36号"], "answer": "A", "explain": "瑞蚨祥前门总店位于大栅栏街5号（导游考试以此为准）；34号为内联升总店，36号为大观楼。", "source": "所在位置：北京市西城区前门外大栅栏街5号（瑞蚨祥前门总店……）。", "layer": "ext"}, {"section": "北京商业街及老字号", "type": "single", "q": "北京酱菜老字号中，被称为\"南酱园\"、有\"冬菜老店\"之称的是（　）。", "options": ["A. 六必居", "B. 天源酱园", "C. 桂馨斋", "D. 大顺斋"], "answer": "C", "explain": "桂馨斋始建于清乾隆元年（1736年），又称\"铁门酱园\"，仿南方风味制作，擅长冬菜、梅干菜，有\"冬菜老店\"之称。", "source": "\"南酱园\"——桂馨斋……仿南方风味制作，口感偏甜、甜咸适口，擅长冬菜、梅干菜、佛手疙瘩，有\"冬菜老店\"之称。", "layer": "ext"}, {"section": "北京商业街及老字号", "type": "multi", "q": "下列关于东安市场的说法正确的有（　）。", "options": ["A. 始建于清光绪二十九年（1903年）", "B. 因邻近皇城东安门而得名", "C. 前身为废弃的八旗神机营操场", "D. 东来顺涮羊肉即发迹于此", "E. 是北京地区创办最早的电影院"], "answer": "ABCD", "explain": "北京地区创办最早的电影院是大观楼，而非东安市场，故E错；东安市场是北京最早出现的综合性市场，其余四项正确。", "source": "东安市场——北京……最早出现的综合性市场。始建于清光绪二十九年（1903年）……因邻近皇城东安门而得名。其前身为废弃的八旗神机营操场……东来顺涮羊肉即发迹于此。", "layer": "ext"}, {"section": "北京商业街及老字号", "type": "single", "q": "1902年收购\"马思远茶楼\"并定名\"大观楼\"、被誉为\"中国电影之父\"的是（　）。", "options": ["A. 任庆泰", "B. 杨全仁", "C. 刘锡三", "D. 赵廷"], "answer": "A", "explain": "1902年由\"中国电影之父\"任庆泰（任景丰）收购并定名\"大观楼\"，1905年在此首映《定军山》。", "source": "1902年由\"中国电影之父\"任庆泰（任景丰）收购并定名\"大观楼\"。", "layer": "ext"}, {"section": "北京商业街及老字号", "type": "single", "q": "北京城内回族聚族而居最大的街区是（　）。", "options": ["A. 牛街", "B. 天桥", "C. 簋街", "D. 烟袋斜街"], "answer": "A", "explain": "牛街位于西城区，是北京城内回族聚族而居最大的街区，以牛街礼拜寺为中心，相传已有千年历史。", "source": "牛街——以多民族文化交融……为特色的传统商业街区。位于北京市西城区，是北京城内回族聚族而居最大的街区。", "layer": "ext"}, {"section": "北京商业街及老字号", "type": "single", "q": "曾被称为\"京城最大的平民娱乐场所\"、侯宝林与新凤霞等均在此成名的是（　）。", "options": ["A. 天桥市场", "B. 东安市场", "C. 红桥市场", "D. 荷花市场"], "answer": "A", "explain": "天桥位于北京中轴线南部、正阳门以南，清末民国形成大型平民市场，\"天桥八大怪\"、侯宝林、新凤霞等均在此成名。", "source": "天桥（天桥市场）——曾被称为\"京城最大的平民娱乐场所\"……\"天桥八大怪\"、侯宝林、新凤霞、关学曾等均在此成名。", "layer": "ext"}, {"section": "北京商业街及老字号", "type": "single", "q": "被誉为\"夜食者的天堂\"的簋街，即北京市东城区（　）。", "options": ["A. 东直门内大街", "B. 东四北大街", "C. 地安门外大街", "D. 西直门内大街"], "answer": "A", "explain": "簋街即东城区东直门内大街，东起东直门立交桥、西至交道口东大街，全长约1472米。", "source": "簋街——被誉为\"夜食者的天堂\"。即北京市东城区东直门内大街，东起东直门立交桥、西至交道口东大街，全长约1472米。", "layer": "ext"}, {"section": "北京商业街及老字号", "type": "single", "q": "被誉为\"中国第一餐饮品牌\"的全聚德创建于（　）。", "options": ["A. 清咸丰三年（1853年）", "B. 清同治三年（1864年）", "C. 清同治元年（1862年）", "D. 清光绪二十九年（1903年）"], "answer": "B", "explain": "全聚德创建于清同治三年（1864年），创始人杨全仁（杨寿山）；1853年为内联升、鸿宾楼创建年，1862年为瑞蚨祥创建年。", "source": "全聚德——被誉为\"中国第一餐饮品牌\"……创建于清同治三年（1864年），创始人杨全仁（杨寿山）。", "layer": "ext"}, {"section": "北京商业街及老字号", "type": "single", "q": "以1416年\"金陵老便宜坊\"在北京开业为始，北京烤鸭约有多少年的历史（　）。", "options": ["A. 300多年", "B. 400多年", "C. 600多年", "D. 800多年"], "answer": "C", "explain": "一般以明永乐十四年（1416年）\"金陵老便宜坊\"开业为北京烤鸭之始，至今已逾600年，导游考试以\"600多年\"最通行。", "source": "北京烤鸭的历史：约600多年。一般以明永乐十四年（1416年）\"金陵老便宜坊\"在北京开业为北京烤鸭之始。", "layer": "ext"}, {"section": "北京商业街及老字号", "type": "single", "q": "创建于1930年、借中南海园林\"丰泽园\"为字号、以葱烧海参闻名的鲁菜老字号是（　）。", "options": ["A. 丰泽园", "B. 同和居", "C. 东兴楼", "D. 萃华楼"], "answer": "A", "explain": "丰泽园创建于1930年，寓\"菜肴丰饶、味道润泽\"，为京城\"八大楼\"之一，是北京经营正宗鲁菜的代表。", "source": "丰泽园（创建于1930年，借中南海园林\"丰泽园\"为字号，寓\"菜肴丰饶、味道润泽\"……以葱烧海参、九转大肠、香酥鸡、银丝卷闻名）。", "layer": "ext"}, {"section": "北京市旅游条例及时事政治", "layer": "core", "type": "single", "q": "《北京市旅游条例》由下列哪次会议表决通过？", "options": ["A. 北京市第十三届人大常委会第三十次会议", "B. 北京市第十四届人大常委会第三十八次会议", "C. 北京市第十五届人大常委会第三次会议", "D. 北京市第十四届人大常委会第四十次会议"], "answer": "B", "explain": "《北京市旅游条例》于2017年5月26日经北京市第十四届人大常委会第三十八次会议表决通过。", "source": "2017年5月26日；北京市第十四届人大常委会第三十八次会议表决通过"}, {"section": "北京市旅游条例及时事政治", "layer": "core", "type": "judge", "q": "《北京市旅游条例》于2017年5月26日经北京市第十四届人大常委会第三十八次会议表决通过。", "answer": "对", "explain": "《北京市旅游条例》于2017年5月26日由北京市第十四届人大常委会第三十八次会议表决通过。", "source": "《北京市旅游条例》的通过时间及会议：2017年5月26日；北京市第十四届人大常委会第三十八次会议表决通过"}, {"section": "北京市旅游条例及时事政治", "layer": "core", "type": "multi", "q": "下列属于《北京市旅游条例》章节名称的有？", "options": ["A. 总则", "B. 旅游规划和促进", "C. 旅游公共服务", "D. 旅游监督管理", "E. 旅游信用管理"], "answer": "ABCD", "explain": "七章为：总则、旅游规划和促进、旅游公共服务、旅游经营、旅游监督管理、法律责任、附则。“旅游信用管理”不是章节名称。", "source": "共7章84条；总则、旅游规划和促进、旅游公共服务、旅游经营、旅游监督管理、法律责任、附则"}, {"section": "北京市旅游条例及时事政治", "layer": "core", "type": "single", "q": "《北京市旅游条例》施行的同时，被废止的法规是？", "options": ["A. 《北京市旅游管理条例》", "B. 《北京市旅游促进办法》", "C. 《北京市导游人员管理办法》", "D. 《北京市风景名胜区条例》"], "answer": "A", "explain": "《北京市旅游条例》2017年8月1日起施行，原《北京市旅游管理条例》同时废止。", "source": "2017年8月1日起施行；原《北京市旅游管理条例》同时废止"}, {"section": "北京市旅游条例及时事政治", "layer": "core", "type": "judge", "q": "《北京市旅游条例》自2017年9月1日起施行，原《北京市旅游管理条例》同时废止。", "answer": "错", "explain": "施行时间为2017年8月1日，而非9月1日；原《北京市旅游管理条例》同时废止的表述正确。", "source": "2017年8月1日起施行；原《北京市旅游管理条例》同时废止"}, {"section": "北京市旅游条例及时事政治", "layer": "core", "type": "single", "q": "《北京市旅游条例》的立法背景是贯彻我国旅游业第一部法律，该法律是？", "options": ["A. 《中华人民共和国消费者权益保护法》", "B. 《中华人民共和国民法典》", "C. 《中华人民共和国旅游法》", "D. 《中华人民共和国风景名胜区法》"], "answer": "C", "explain": "立法背景为贯彻2013年10月施行的《中华人民共和国旅游法》，该法是我国旅游业第一部法律。", "source": "为贯彻2013年10月施行的《中华人民共和国旅游法》（我国旅游业第一部法律）"}, {"section": "北京市旅游条例及时事政治", "layer": "core", "type": "judge", "q": "《北京市旅游条例》共7章84条。", "answer": "对", "explain": "《北京市旅游条例》的结构为共7章84条。", "source": "《北京市旅游条例》的结构：共7章84条"}, {"section": "北京市旅游条例及时事政治", "layer": "core", "type": "multi", "q": "《北京市旅游条例》重点解决的三大问题包括？", "options": ["A. 强化首都核心功能、提升旅游文化内涵", "B. 整顿旅游市场秩序、治理非法一日游", "C. 按旅游法要求完善民宿经营管理", "D. 建立旅游景区门票政府定价制度", "E. 规范出境旅游领队管理"], "answer": "ABC", "explain": "三大问题为A、B、C三项，D、E不在其中。", "source": "强化首都核心功能、提升旅游文化内涵；整顿旅游市场秩序、治理非法一日游；按旅游法要求完善民宿经营管理"}, {"section": "北京市旅游条例及时事政治", "layer": "core", "type": "single", "q": "下列名称中，不属于《北京市旅游条例》七章名称的是？", "options": ["A. 旅游规划和促进", "B. 旅游公共服务", "C. 旅游市场监管", "D. 旅游监督管理"], "answer": "C", "explain": "七章为：总则、旅游规划和促进、旅游公共服务、旅游经营、旅游监督管理、法律责任、附则。“旅游市场监管”不在其中。", "source": "共7章84条；总则、旅游规划和促进、旅游公共服务、旅游经营、旅游监督管理、法律责任、附则"}, {"section": "北京市旅游条例及时事政治", "layer": "core", "type": "judge", "q": "《北京市旅游条例》的立法背景是为贯彻2012年10月施行的《中华人民共和国旅游法》。", "answer": "错", "explain": "《中华人民共和国旅游法》于2013年10月施行，是我国旅游业第一部法律，题干年份错误。", "source": "为贯彻2013年10月施行的《中华人民共和国旅游法》（我国旅游业第一部法律）"}, {"section": "北京市旅游条例及时事政治", "layer": "core", "type": "single", "q": "下列哪项不属于《北京市旅游条例》重点解决的三大问题？", "options": ["A. 强化首都核心功能、提升旅游文化内涵", "B. 整顿旅游市场秩序、治理非法一日游", "C. 按旅游法要求完善民宿经营管理", "D. 规范旅行社出境游保证金制度"], "answer": "D", "explain": "三大问题为：强化首都核心功能提升旅游文化内涵；整顿旅游市场秩序治理非法一日游；按旅游法要求完善民宿经营管理。D项不在其中。", "source": "强化首都核心功能、提升旅游文化内涵；整顿旅游市场秩序、治理非法一日游；按旅游法要求完善民宿经营管理"}, {"section": "北京市旅游条例及时事政治", "layer": "core", "type": "judge", "q": "依据《北京市旅游条例》，非法“一日游”最高可罚款5万元。", "answer": "错", "explain": "非法一日游最高罚10万元，题干罚款数额错误。", "source": "非法一日游最高罚10万元"}, {"section": "北京市旅游条例及时事政治", "layer": "core", "type": "multi", "q": "《北京市旅游条例》对非法“一日游”的制度设计包括？", "options": ["A. 设“一日游”专节", "B. 六类经营行为集中列举", "C. 全链条制度设计", "D. “疏”设旅游公交、“堵”建电子行程单制度", "E. 全面禁止北京市域内一日游经营"], "answer": "ABCD", "explain": "制度设计包括设专节、六类行为集中列举、全链条制度设计、疏堵结合（旅游公交＋电子行程单），非法一日游最高罚10万元；并非全面禁止一日游。", "source": "设“一日游”专节；六类经营行为集中列举；全链条制度设计；“疏”设旅游公交、“堵”建电子行程单制度；非法一日游最高罚10万元"}, {"section": "北京市旅游条例及时事政治", "layer": "core", "type": "single", "q": "《北京市旅游条例》治理非法“一日游”采取“疏堵结合”，其中“疏”的措施是？", "options": ["A. 建立电子行程单制度", "B. 设旅游公交", "C. 取缔全部一日游产品", "D. 对非法一日游最高罚款10万元"], "answer": "B", "explain": "“疏”设旅游公交、“堵”建电子行程单制度。A项属“堵”，D项是罚则。", "source": "“疏”设旅游公交、“堵”建电子行程单制度"}, {"section": "北京市旅游条例及时事政治", "layer": "core", "type": "judge", "q": "《北京市旅游条例》规定，经营民宿需进行工商登记。", "answer": "对", "explain": "条例对民宿经营的规定为：经营民宿需工商登记。", "source": "《北京市旅游条例》对民宿经营的规定：经营民宿需工商登记"}, {"section": "北京市旅游条例及时事政治", "layer": "core", "type": "single", "q": "《北京市旅游条例》治理非法“一日游”的制度设计中，“堵”的措施是建立？", "options": ["A. 旅游公交制度", "B. 旅游黑名单制度", "C. 电子行程单制度", "D. 旅游购物退税制度"], "answer": "C", "explain": "“疏”设旅游公交、“堵”建电子行程单制度。", "source": "“疏”设旅游公交、“堵”建电子行程单制度"}, {"section": "北京市旅游条例及时事政治", "layer": "core", "type": "judge", "q": "《北京市旅游条例》规定，世界文化遗产景区内，凡取得导游证者即可为旅游团队提供讲解服务，无需景区另行培训。", "answer": "错", "explain": "世遗景区实行讲解员管理制度，未经景区培训并取得讲解员证者不得为旅游团队提供讲解服务。", "source": "世遗景区实行讲解员管理制度；未经景区培训并取得讲解员证者不
