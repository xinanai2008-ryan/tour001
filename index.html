雍正即位前的正寝殿，后改名\"神御殿\"），不是法轮殿。", "source": "雍正十三年（1735 年）雍正帝驾崩后，梓宫（棺椁）曾停灵于雍和宫的永佑殿（雍正即位前的正寝殿，后改名\"神御殿\"，供奉雍正影像）。"}, {"section": "雍和宫", "type": "single", "q": "雍和门（天王殿）殿内正中金漆雕龙宝座上供奉的是哪尊造像？", "options": ["A. 弥勒菩萨（布袋和尚）像", "B. 韦驮像", "C. 四大天王像", "D. 宗喀巴大师像"], "answer": "A", "explain": "正中金漆雕龙宝座上供奉笑口常开、袒胸露腹的弥勒菩萨（布袋和尚）像。", "source": "正中金漆雕龙宝座上供奉笑口常开、袒胸露腹的弥勒菩萨（布袋和尚）像；东西两侧相对而立的是泥金彩塑四大天王。"}, {"section": "雍和宫", "type": "judge", "q": "万福阁内迈达拉佛地上部分高18米，地下埋入8米，总高26米。", "answer": "对", "explain": "原文：迈达拉佛地上部分高18米、地下埋入8米（总高26米），1990年载入《吉尼斯世界纪录》。", "source": "万福阁内迈达拉佛（弥勒站像）由整株白檀木（白檀香木）雕成：地上部分高 18 米、地下埋入 8 米（总高 26 米）。"}, {"section": "雍和宫", "type": "multi", "q": "下列关于雍和宫\"木雕三绝\"及其放置位置的说法，正确的有（ ）。", "options": ["A. 白檀木迈达拉佛——置于万福阁", "B. 金丝楠木雕佛龛——置于昭佛楼", "C. 紫檀木五百罗汉山——置于法轮殿", "D. 白檀木迈达拉佛——置于法轮殿", "E. 紫檀木五百罗汉山——置于昭佛楼"], "answer": "ABC", "explain": "木雕三绝：白檀木迈达拉佛在万福阁，金丝楠木雕佛龛在昭佛楼（佛龛里外三层、共雕九十九条金龙），紫檀木五百罗汉山在法轮殿。D、E位置张冠李戴。", "source": "木雕三绝及位置：①白檀木迈达拉佛（弥勒大佛）——置于万福阁；②金丝楠木雕佛龛——置于昭佛楼（乾隆生母礼佛之所）；③紫檀木五百罗汉山——置于法轮殿。"}, {"section": "雍和宫", "type": "single", "q": "雍和门（天王殿）内弥勒像背后供奉的是哪尊造像？", "options": ["A. 四大天王像", "B. 韦驮像", "C. 燃灯佛像", "D. 药师佛像"], "answer": "B", "explain": "弥勒像背后供奉戴盔披甲、手持降魔金刚杵的韦驮像，面对后方的大雄宝殿。殿外东钟西鼓，门前有铜狮一对。", "source": "弥勒像背后供奉戴盔披甲、手持降魔金刚杵的韦驮像（面对后方的大雄宝殿/雍和宫大殿）。殿外东钟西鼓，门前有铜狮一对。"}, {"section": "雍和宫", "type": "judge", "q": "御碑亭内《喇嘛说》方碑南面刻汉文、北面刻满文、东面刻蒙文、西面刻藏文。", "answer": "错", "explain": "方碑南面满文、北面汉文、东面蒙文、西面藏文，题干南北两面文字颠倒了。", "source": "方碑四面文字：御碑亭内方碑四面分别镌刻满、汉、蒙、藏四种文字的《喇嘛说》（南面满文、北面汉文、东面蒙文、西面藏文）。"}, {"section": "雍和宫", "type": "single", "q": "雍和宫大殿（雍和宫殿）在雍亲王府时期称为什么？", "options": ["A. 银安殿", "B. 神御殿", "C. 天王殿", "D. 大佛楼"], "answer": "A", "explain": "雍和宫大殿在雍亲王府时期为银安殿，是雍亲王处理政务、举行礼仪、升殿受贺的场所。", "source": "雍和宫大殿（雍和宫殿，相当于一般寺庙的大雄宝殿）在雍亲王府时期为银安殿，是雍亲王处理政务、举行礼仪、升殿受贺的场所。"}, {"section": "雍和宫", "type": "judge", "q": "雍和宫的前身雍亲王府始建于雍正三年（1725年），是胤禛的府邸。", "answer": "错", "explain": "雍亲王府于康熙三十三年（1694年）始建；雍正三年（1725年）是升格为行宫、始称\"雍和宫\"。", "source": "三个时期：①雍亲王府时期（康熙三十三年/1694 年始建，胤禛的府邸）。"}, {"section": "雍和宫", "type": "multi", "q": "下列关于法轮殿的说法，正确的有（ ）。", "options": ["A. 平面呈十字形，四面各出抱厦", "B. 黄琉璃瓦顶上矗立五座镏金宝塔", "C. 是僧众集中诵经、举办重大佛事活动的核心场所，俗称\"大经堂\"", "D. 西墙经架陈列《丹珠尔》207部", "E. 为汉藏结合式建筑"], "answer": "ABCE", "explain": "法轮殿西墙陈列藏文《甘珠尔》（佛语部）108部，东墙陈列《丹珠尔》（论疏部）207部，D项方位错误。殿内还陈放大威德金刚坛城及乾隆\"洗三盆\"（鱼龙变化盆）。", "source": "法轮殿为汉藏结合式建筑，平面呈十字形，黄琉璃瓦顶上建五座天窗式暗楼，其上矗立五座镏金宝塔；西墙经架陈列藏文《甘珠尔》108 部，东墙经架陈列《丹珠尔》207 部。"}, {"section": "雍和宫", "type": "single", "q": "雍和宫大殿前的青铜须弥山，原为明代万历年间何人所供奉？", "options": ["A. 司礼监掌印太监冯保", "B. 太监魏忠贤", "C. 太监刘瑾", "D. 航海家郑和"], "answer": "A", "explain": "须弥山原为明代万历年间司礼监掌印太监冯保所供奉，后移置此处。山体高约1.5米、通高2.76米。", "source": "原为明代万历年间司礼监掌印太监冯保所供奉，后移置此处。"}, {"section": "雍和宫", "type": "judge", "q": "\"金瓶掣签\"制度由乾隆五十七年（1792年）颁布的《钦定藏内善后章程》确立。", "answer": "对", "explain": "原文明确此制由乾隆五十七年（1792年）《钦定藏内善后章程》确立。", "source": "此制由乾隆五十七年（1792 年）《钦定藏内善后章程》确立。"}, {"section": "雍和宫", "type": "single", "q": "雍和宫大殿内供奉的横三世佛中，位于西侧的是哪尊佛？", "options": ["A. 释迦牟尼佛", "B. 燃灯佛", "C. 弥勒佛", "D. 无量寿佛"], "answer": "B", "explain": "横三世佛：中间释迦牟尼佛（现在佛），西侧燃灯佛（过去佛），东侧弥勒佛（未来佛），两侧列十八罗汉像。", "source": "正中供奉横三世佛（竖三世佛）——中间释迦牟尼佛（现在佛），西侧燃灯佛（过去佛），东侧弥勒佛（未来佛），三尊均为青铜泥金佛像；两侧列十八罗汉像。"}, {"section": "雍和宫", "type": "judge", "q": "\"金瓶掣签\"中掣定西藏地区转世活佛的金瓶安供于北京雍和宫。", "answer": "错", "explain": "掣定西藏地区转世活佛的金瓶供奉于拉萨大昭寺；安供于北京雍和宫的一只掣定蒙古、青海等地转世活佛。", "source": "一只供奉于西藏拉萨大昭寺（掣定西藏地区转世活佛）；一只安供于北京雍和宫（掣定蒙古、青海等地转世活佛）。"}, {"section": "雍和宫", "type": "multi", "q": "下列关于法轮殿内五百罗汉山的说法，正确的有（ ）。", "options": ["A. 整座山体由紫檀木精雕而成", "B. 山高约2.5米、宽约3米", "C. 五百罗汉分别用金、银、铜、铁、锡五种金属铸造", "D. 每尊罗汉高约10厘米", "E. 五百罗汉为泥塑彩绘而成"], "answer": "ABCD", "explain": "五百罗汉山由紫檀木雕成，高约2.5米、宽约3米；罗汉用金、银、铜、铁、锡（五金）铸造，每尊高约10厘米，并非泥塑彩绘。", "source": "五百罗汉山材质：整座山体由紫檀木精雕而成（高约 2.5 米、宽约 3 米）。五百罗汉雕像材质：山上的五百罗汉分别用金、银、铜、铁、锡（五金）五种金属铸造，每尊高约 10 厘米。"}, {"section": "雍和宫", "type": "single", "q": "雍和宫大殿内释迦牟尼像左侧的弟子立像是哪位？", "options": ["A. 阿难", "B. 迦叶", "C. 目犍连", "D. 舍利弗"], "answer": "B", "explain": "释迦牟尼像左右弟子：左为迦叶、右为阿难两尊弟子立像。", "source": "释迦牟尼像左右弟子：左为迦叶、右为阿难两尊弟子立像。"}, {"section": "雍和宫", "type": "judge", "q": "雍和宫大殿在雍亲王府时期称为银安殿，是雍亲王处理政务、举行礼仪、升殿受贺的场所。", "answer": "对", "explain": "原文：雍和宫大殿在雍亲王府时期为银安殿，是接待文武官员的正殿；乾隆九年改庙后成为寺院正殿。", "source": "雍和宫大殿在雍亲王府时期为银安殿，是雍亲王处理政务、举行礼仪、升殿受贺的场所（接待文武官员的正殿）。"}, {"section": "雍和宫", "type": "single", "q": "乾隆皇帝撰写《喇嘛说》时的年龄是多少？", "options": ["A. 71周岁", "B. 81周岁", "C. 82周岁", "D. 91周岁"], "answer": "B", "explain": "《喇嘛说》碑立于乾隆五十七年（1792年），乾隆帝生于1711年，撰写时为81周岁（虚岁82岁）。", "source": "《喇嘛说》碑立于乾隆五十七年（1792 年），乾隆帝生于 1711 年，撰写时为其 81 周岁（虚岁 82 岁）。"}, {"section": "雍和宫", "type": "judge", "q": "雍和宫大殿前的青铜须弥山，原为明代万历年间司礼监掌印太监冯保所供奉，后移置此处。", "answer": "对", "explain": "原文明确须弥山原为明代万历年间司礼监掌印太监冯保所供奉，后移置于此。", "source": "原为明代万历年间司礼监掌印太监冯保所供奉，后移置此处。"}, {"section": "雍和宫", "type": "multi", "q": "雍和宫建筑群在清代历史上经历的三个时期包括（ ）。", "options": ["A. 雍亲王府时期", "B. 皇帝行宫时期", "C. 藏传佛教寺院时期", "D. 皇家园林时期"], "answer": "ABC", "explain": "三个时期为：雍亲王府时期（1694年始建）、行宫时期（1725年升格）、藏传佛教寺院时期（1744年改庙）。无皇家园林时期。", "source": "三个时期：①雍亲王府时期（康熙三十三年/1694 年始建）；②行宫时期（雍正三年/1725 年升格为皇帝行宫）；③藏传佛教寺院时期（乾隆九年/1744 年）。"}, {"section": "雍和宫", "type": "single", "q": "雍和宫永佑殿内正中供奉的是哪尊佛？", "options": ["A. 药师佛", "B. 狮吼佛", "C. 无量寿佛（长寿佛）", "D. 燃灯佛"], "answer": "C", "explain": "永佑殿正中及两侧供三尊白檀木雕佛像，各高2.35米：中间无量寿佛（长寿佛），东侧狮吼佛，西侧药师佛。", "source": "殿内供奉：正中及两侧供三尊白檀木雕佛像，各高 2.35 米——中间为无量寿佛（长寿佛），东侧为狮吼佛，西侧为药师佛。"}, {"section": "雍和宫", "type": "judge", "q": "雍和宫大殿内供奉的横三世佛中，东侧为燃灯佛（过去佛），西侧为弥勒佛（未来佛）。", "answer": "错", "explain": "东西两侧颠倒了：西侧为燃灯佛（过去佛），东侧为弥勒佛（未来佛），中间为释迦牟尼佛。", "source": "中间释迦牟尼佛（现在佛），西侧燃灯佛（过去佛），东侧弥勒佛（未来佛），三尊均为青铜泥金佛像。"}, {"section": "雍和宫", "type": "single", "q": "永佑殿内《绿度母》堆绫补绣像由谁主持制作？", "options": ["A. 乾隆皇帝生母孝圣宪皇后钮祜禄氏", "B. 孝庄文皇后", "C. 慈禧太后", "D. 乾隆皇后富察氏"], "answer": "A", "explain": "《绿度母》由乾隆生母孝圣宪皇后钮祜禄氏（\"甄嬛\"原型）主持，带领宫中绣女以数千块绸子制成。", "source": "《绿度母》制作者：殿内西壁供奉的《绿度母》堆绫补绣像，由乾隆皇帝生母孝圣宪皇后钮祜禄氏（\"甄嬛\"原型）主持。"}, {"section": "雍和宫", "type": "judge", "q": "雍和宫大殿内释迦牟尼像左侧弟子为阿难，右侧弟子为迦叶。", "answer": "错", "explain": "左右颠倒了：释迦牟尼像左为迦叶、右为阿难两尊弟子立像。", "source": "释迦牟尼像左右弟子：左为迦叶、右为阿难两尊弟子立像。"}, {"section": "雍和宫", "type": "multi", "q": "下列关于雍和宫改为藏传佛教寺院的原因及意义，正确的有（ ）。", "options": ["A. 孝敬父皇雍正，以佛力常年为先帝祈福", "B. 借宗教纽带团结蒙藏民族、安定边疆", "C. 按礼制先帝潜邸不可作常人居所，只能改为宗庙", "D. 成为清政府管理全国藏传佛教事务的中心", "E. 为乾隆皇帝本人出家修行之所"], "answer": "ABCD", "explain": "原因：孝敬父皇祈福、政治考量（\"兴黄教即所以安众蒙古\"）、礼制所限；意义：成为全国藏传佛教事务中心与连接中央同蒙藏地方的纽带。E项无据。", "source": "原因一是孝敬父皇雍正……二是深层政治考量——借宗教纽带团结蒙藏民族、安定边疆，且按礼制先帝潜邸不可作常人居所……成为清政府管理全国藏传佛教事务的中心。"}, {"section": "雍和宫", "type": "single", "q": "法轮殿内正中宗喀巴大师铜坐像高多少？", "options": ["A. 2.35米", "B. 6.1米", "C. 6.2米", "D. 18米"], "answer": "B", "explain": "法轮殿内正中宗喀巴大师铜坐像高6.1米，东西两侧各设一座讲经说法台。", "source": "法轮殿内正中宗喀巴大师铜坐像（高 6.1 米）东西两侧各设一座木质雕花高台经座（讲经说法台）。"}, {"section": "雍和宫", "type": "judge", "q": "雍和宫永佑殿内正中供奉的是药师佛。", "answer": "错", "explain": "永佑殿正中供奉无量寿佛（长寿佛），东侧为狮吼佛，西侧为药师佛。", "source": "正中及两侧供三尊白檀木雕佛像，各高 2.35 米——中间为无量寿佛（长寿佛），东侧为狮吼佛，西侧为药师佛。"}, {"section": "雍和宫", "type": "single", "q": "法轮殿内宗喀巴大师像两侧的讲经说法台，西经座为谁所用？", "options": ["A. 班禅大师", "B. 达赖喇嘛", "C. 章嘉活佛", "D. 哲布尊丹巴"], "answer": "B", "explain": "东西两座经座专为达赖、班禅来雍和宫讲法而设：东经座为班禅大师所用，西经座为达赖喇嘛所用。", "source": "专为达赖、班禅来雍和宫讲法而设：东经座为班禅大师所用，西经座为达赖喇嘛所用。"}, {"section": "雍和宫", "type": "judge", "q": "法轮殿内宗喀巴大师像两侧的讲经说法台，西经座为班禅大师所用，东经座为达赖喇嘛所用。", "answer": "错", "explain": "东西颠倒了：东经座为班禅大师所用，西经座为达赖喇嘛所用。", "source": "东经座为班禅大师所用，西经座为达赖喇嘛所用。"}, {"section": "雍和宫", "type": "multi", "q": "下列关于雍和宫宝坊院现存牌楼的说法，正确的有（ ）。", "options": ["A. 现存东、西、南三座牌楼", "B. 均建于清乾隆九年（1744年）", "C. 额题均为乾隆皇帝御笔", "D. 黄琉璃瓦顶，北牌楼等级最高", "E. 均为六柱五间式石牌楼"], "answer": "ABCD", "explain": "三座牌楼建于乾隆九年，额题均为乾隆御笔，规制为四柱三间七楼/九楼式木牌楼、黄琉璃瓦顶，北牌楼为ثلاث间四柱九楼庑殿顶等级最高。E项柱式材质均错。", "source": "现存三座牌楼（东、西、南各一），均建于清乾隆九年（1744 年），额题均为乾隆皇帝御笔。规制为四柱三间七楼/九楼式木牌楼，黄琉璃瓦顶（北牌楼等级最高）。"}, {"section": "雍和宫", "type": "single", "q": "雍和宫占地面积约6.6公顷，合多少平方米？", "options": ["A. 45,800平方米", "B. 60,400平方米", "C. 66,400平方米", "D. 76,400平方米"], "answer": "C", "explain": "原文：占地面积约6.6公顷（66,400平方米），官方与多数资料采用此数据。", "source": "占地面积：约 6.6 公顷（66,400 平方米）。"}, {"section": "雍和宫", "type": "judge", "q": "永佑殿内《绿度母》堆绫补绣像由乾隆皇帝生母孝圣宪皇后钮祜禄氏主持制成。", "answer": "对", "explain": "《绿度母》由孝圣宪皇后钮祜禄氏（\"甄嬛\"原型）主持，带领宫中绣女以数千块绸子、采用堆绣与补绣工艺制成。", "source": "《绿度母》堆绫补绣像，由乾隆皇帝生母孝圣宪皇后钮祜禄氏（\"甄嬛\"原型）主持，带领宫中绣女以数千块绸子制成。"}, {"section": "雍和宫", "type": "single", "q": "雍和宫属于藏传佛教的哪一派系？", "options": ["A. 宁玛派", "B. 萨迦派", "C. 噶举派", "D. 格鲁派"], "answer": "D", "explain": "雍和宫属于藏传佛教格鲁派，乾隆九年（1744年）改为格鲁派寺院。", "source": "派系：雍和宫属于藏传佛教格鲁派（俗称\"黄教\"，因僧人着黄衣黄帽得名）。"}, {"section": "雍和宫", "type": "multi", "q": "清代咸丰朝以前，雍和宫腊八粥的分配对象包括（ ）。", "options": ["A. 供佛、供僧", "B. 宫廷", "C. 王公大臣", "D. 京城百姓", "E. 外国使节"], "answer": "ABCD", "explain": "腊八粥除供佛、供僧外，还分赐宫廷、王公大臣、寺院僧人及京城百姓等，规模盛大。无分赐外国使节之说。", "source": "雍和宫每年腊八节熬制腊八粥，除供佛、供僧外，还分赐宫廷、王公大臣、寺院僧人及京城百姓等，规模盛大。"}, {"section": "雍和宫", "type": "single", "q": "藏传佛教格鲁派俗称\"黄教\"，其得名原因是什么？", "options": ["A. 僧人着黄衣黄帽", "B. 寺院均覆黄琉璃瓦", "C. 以黄色哈达为最高礼遇", "D. 宗喀巴出生于黄土高原"], "answer": "A", "explain": "原文：格鲁派俗称\"黄教\"，因僧人着黄衣黄帽得名。", "source": "派系：雍和宫属于藏传佛教格鲁派（俗称\"黄教\"，因僧人着黄衣黄帽得名）。"}, {"section": "雍和宫", "type": "single", "q": "出生于雍亲王府（今雍和宫）如意室的皇帝是哪一位？", "options": ["A. 康熙帝", "B. 雍正帝", "C. 乾隆帝", "D. 嘉庆帝"], "answer": "C", "explain": "乾隆帝（弘历）生于雍亲王府如意室；雍正帝本人出生于紫禁城，并非生于雍王府。", "source": "出生于雍王府的皇帝：乾隆帝（弘历），生于雍亲王府（今雍和宫）如意室。"}, {"section": "雍和宫", "type": "multi", "q": "下列关于雍和宫中轴线上主要建筑匾额的说法，正确的有（ ）。", "options": ["A. 多为乾隆皇帝亲笔题写", "B. 文字采用满、汉、蒙、藏四种文字", "C. 包括\"雍和宫\"\"万福阁\"\"昭泰门\"等匾额", "D. 均为雍正皇帝御笔题写"], "answer": "ABC", "explain": "中轴线上主要建筑（昭泰门、雍和门、雍和宫殿、万福阁等）匾额多为乾隆亲笔，用满、汉、蒙、藏四种文字。D项雍正御笔错误。", "source": "中轴线上主要建筑（昭泰门、雍和门、雍和宫殿、万福阁等）的匾额多为乾隆皇帝亲笔题写，匾额文字采用满、汉、蒙、藏四种文字。"}, {"section": "雍和宫", "type": "single", "q": "雍正帝驾崩后，其梓宫（棺椁）曾停灵于雍和宫的哪座殿宇？", "options": ["A. 法轮殿", "B. 雍和宫大殿", "C. 永佑殿", "D. 万福阁"], "answer": "C", "explain": "雍正十三年（1735年）雍正帝驾崩后，梓宫停灵于永佑殿（雍正即位前的正寝殿，后改名\"神御殿\"）。", "source": "雍正十三年（1735 年）雍正帝驾崩后，梓宫（棺椁）曾停灵于雍和宫的永佑殿。"}, {"section": "雍和宫", "type": "single", "q": "为迎雍正帝梓宫，雍和宫主要殿宇在多少日内改覆黄琉璃瓦？", "options": ["A. 七日", "B. 十五日", "C. 三十日", "D. 四十九日"], "answer": "B", "explain": "原文：为迎棺椁，雍和宫主要殿宇在十五日内改覆黄琉璃瓦。", "source": "为迎棺椁，雍和宫主要殿宇在十五日内改覆黄琉璃瓦。"}, {"section": "雍和宫", "type": "multi", "q": "下列关于雍和宫永佑殿内供奉造像的说法，正确的有（ ）。", "options": ["A. 供三尊白檀木雕佛像", "B. 各高2.35米", "C. 东侧为狮吼佛", "D. 西侧为药师佛", "E. 正中为燃灯佛"], "answer": "ABCD", "explain": "永佑殿正中及两侧供三尊白檀木雕佛像，各高2.35米：中间无量寿佛（长寿佛）、东狮吼佛、西药师佛。E项正中为燃灯佛错误。", "source": "正中及两侧供三尊白檀木雕佛像，各高 2.35 米——中间为无量寿佛（长寿佛），东侧为狮吼佛，西侧为药师佛。"}, {"section": "雍和宫", "type": "single", "q": "雍和宫每年跳金刚驱魔神舞的具体日期是哪两天？", "options": ["A. 正月初一、正月十五日", "B. 正月二十九日、二月初一日", "C. 二月初八日、二月十五日", "D. 腊月初八日、腊月二十三日"], "answer": "B", "explain": "正月二十九日、二月初一日（大建为三十日）两天跳金刚驱魔神舞（俗称\"打鬼\"\"跳布扎\"）。", "source": "其中正月二十九日、二月初一日（大建为三十日）两天跳金刚驱魔神舞（俗称\"打鬼\"\"跳布扎\"，藏语\"羌姆\"）。"}, {"section": "雍和宫", "type": "single", "q": "雍和宫每年举办\"大愿祈祷法会\"（善愿日/传昭大会）的时间是？", "options": ["A. 农历正月初一日至正月十五日", "B. 农历正月二十三日至二月初一日", "C. 农历二月初一日至二月初八日", "D. 农历腊月初一日至腊月初八日"], "answer": "B", "explain": "雍和宫每年农历正月二十三日至二月初一日举办\"大愿祈祷法会\"。", "source": "雍和宫每年农历正月二十三日至二月初一日举办\"大愿祈祷法会\"（善愿日/传昭大会）。"}, {"section": "雍和宫", "type": "multi", "q": "下列属于法轮殿内陈设的有（ ）。", "options": ["A. 藏文《甘珠尔》（佛语部）108部", "B. 《丹珠尔》（论疏部）207部", "C. 五彩金刚砂制成的大威德金刚坛城", "D. 相传为乾隆出生第三天洗浴所用的鱼龙变化盆（洗三盆）", "E. 青铜铸造的大威德金刚坛城"], "answer": "ABCD", "explain": "法轮殿西墙陈列《甘珠尔》108部、东墙《丹珠尔》207部；坛城以五彩金刚砂制成而非青铜铸造；鱼龙变化盆相传为乾隆\"洗三盆\"。E项材质错误。", "source": "西墙经架陈列藏文《甘珠尔》108 部，东墙经架陈列《丹珠尔》207 部；陈放用五彩金刚砂制成的大威德金刚坛城；鱼龙变化盆相传为乾隆皇帝出生第三天洗浴所用的\"洗三盆\"。"}, {"section": "雍和宫", "type": "single", "q": "雍和宫熬腊八粥所用的大铜锅重约多少？", "options": ["A. 3吨", "B. 5吨", "C. 8吨", "D. 12吨"], "answer": "C", "explain": "大铜锅高1.5米、直径2.5米、重约8吨，为雍和宫\"四宝\"之一。", "source": "大铜锅尺寸：雍和门前鼓楼脚下的大铜锅，高 1.5 米、直径 2.5 米、重约 8 吨。"}, {"section": "雍和宫", "type": "single", "q": "雍和宫熬腊八粥所用的大铜锅由何机构制造？", "options": ["A. 清宫造办处", "B. 景德镇御窑厂", "C. 西藏雪堆白作坊", "D. 京城民间铜匠铺"], "answer": "A", "explain": "大铜锅由清宫造办处制造，为雍和宫\"四宝\"之一，原置于东阿斯门外铜锅院。", "source": "重约 8 吨，由清宫廷造办处制造，为雍和宫\"四宝\"之一（原置于东阿斯门外铜锅院，腊八节用以熬粥）。"}, {"section": "雍和宫", "type": "single", "q": "万福阁内迈达拉佛（弥勒大佛）于哪一年载入《吉尼斯世界纪录》？", "options": ["A. 1980年", "B. 1986年", "C. 1990年", "D. 1996年"], "answer": "C", "explain": "迈达拉佛1990年载入《吉尼斯世界纪录》，为中国最大的独木雕佛。", "source": "1990 年载入《吉尼斯世界纪录》，为中国最大的独木雕佛。"}, {"section": "雍和宫", "type": "single", "q": "万福阁内迈达拉佛（弥勒站像）的材质是什么？", "options": ["A. 整株白檀木", "B. 金丝楠木", "C. 紫檀木", "D. 青铜泥金"], "answer": "A", "explain": "迈达拉佛由整株白檀木（白檀香木）雕成，为雍和宫\"木雕三绝\"之一。", "source": "万福阁内迈达拉佛（弥勒站像）由整株白檀木（白檀香木）雕成。"}, {"section": "雍和宫", "type": "single", "q": "御碑亭内《喇嘛说》方碑的高度是多少？", "options": ["A. 2.76米", "B. 6.1米", "C. 6.2米", "D. 6.6米"], "answer": "C", "explain": "御碑亭内方碑高6.2米、每面宽1.45米，四面镌刻满、汉、蒙、藏四种文字的《喇嘛说》。", "source": "御碑亭内方碑（高 6.2 米、每面宽 1.45 米）四面分别镌刻满、汉、蒙、藏四种文字的《喇嘛说》。"}, {"section": "雍和宫", "type": "single", "q": "御碑亭内《喇嘛说》方碑的西面镌刻的是哪种文字？", "options": ["A. 满文", "B. 汉文", "C. 蒙文", "D. 藏文"], "answer": "D", "explain": "方碑南面满文、北面汉文、东面蒙文、西面藏文。", "source": "（南面满文、北面汉文、东面蒙文、西面藏文），上覆石雕宝盖，下雕莲花宝座。"}, {"section": "雍和宫", "type": "single", "q": "\"万福阁\"名称的由来是什么？", "options": ["A. 建庙初期阁内各层供奉小佛像近万尊，\"佛\"与\"福\"读音相近", "B. 乾隆皇帝御赐阁名，祈愿万福", "C. 阁内收藏佛经近万卷，\"卷\"谐音\"福\"", "D. 为雍正帝祈福万寿无疆而建"], "answer": "A", "explain": "建庙初期阁内各层供奉小佛像近万尊，因\"佛\"与\"福\"读音相近，故得名\"万福阁\"（亦作\"万佛阁\"）。", "source": "建庙初期阁内各层供奉小佛像近万尊，因\"佛\"与\"福\"读音相近，故得名\"万福阁\"（亦作\"万佛阁\"）。"}, {"section": "雍和宫", "type": "single", "q": "万福阁院落东侧昭佛楼内供奉的主尊造像是哪一尊？", "options": ["A. 旃檀佛（旃檀释迦牟尼立像）", "B. 迈达拉佛", "C. 绿度母像", "D. 无量寿佛"], "answer": "A", "explain": "昭佛楼内供奉主尊旃檀佛（旃檀释迦牟尼立像），铜质镀金立像；昭佛楼原为乾隆生母孝圣宪皇后私用佛堂。", "source": "昭佛楼（原为乾隆生母孝圣宪皇后私用佛堂）内供奉的主尊为旃檀佛（旃檀释迦牟尼立像）——铜质镀金立像。"}, {"section": "雍和宫", "type": "single", "q": "昭佛楼内旃檀佛立像属于哪种典型造像风格？", "options": ["A. 吴带当风", "B. 曹衣出水", "C. 秀骨清像", "D. 健陀罗式"], "answer": "B", "explain": "旃檀佛为典型唐式\"曹衣出水\"风格，右手举与胸齐作无畏印，左手下垂作与愿印。", "source": "为典型唐式\"曹衣出水\"风格（右手举与胸齐作无畏印，左手下垂作与愿印）。"}, {"section": "雍和宫", "type": "single", "q": "戒台楼建于何时、因何而建？", "options": ["A. 乾隆九年，改宫建庙时", "B. 乾隆四十五年，为迎六世班禅进京、乾隆受戒而建", "C. 乾隆五十七年，为立《喇嘛说》碑而建", "D. 雍正三年，王府升格行宫时"], "answer": "B", "explain": "戒台楼位于法轮殿西侧，建于乾隆四十五年（1780年），为迎六世班禅进京、乾隆受戒而建；楼内戒台以汉白玉石雕砌而成。", "source": "戒台楼位于法轮殿西侧，建于乾隆四十五年（1780 年），为迎六世班禅进京、乾隆受戒而建。"}, {"section": "雍和宫", "type": "single", "q": "万福阁内迈达拉佛左右后方\"凤眼香\"的材质是什么？", "options": ["A. 沉香木", "B. 檀香木", "C. 古代植物化石（硅化木）", "D. 金丝楠木"], "answer": "C", "explain": "\"凤眼香\"材质为古代植物化石（硅化木/树木化石），由蒙古沙漠采来，为珍贵天然奇木。", "source": "万福阁内迈达拉佛左右后方的\"凤眼香\"，材质为古代植物化石（硅化木/树木化石），由蒙古沙漠采来。"}, {"section": "奥林匹克公园", "type": "single", "q": "北京奥林匹克公园的总占地面积是（　）。", "options": ["A. 6.8平方公里", "B. 3.15平方公里", "C. 11.59平方公里", "D. 1.64平方公里"], "answer": "C", "explain": "北京奥林匹克公园总占地面积11.59平方公里（约合1159公顷）。6.8、3.15、1.64平方公里分别为北部、中部、南部面积。", "source": "总占地面积11.59平方公里（约合1159公顷）"}, {"section": "奥林匹克公园", "type": "judge", "q": "北京奥林匹克公园位于北京市海淀区，地处北京城中轴线的最北端。", "answer": "错", "explain": "北京奥林匹克公园位于北京市朝阳区，而非海淀区。", "source": "北京奥林匹克公园位于北京市朝阳区，地处北京城中轴线的最北端，总占地面积11.59平方公里"}, {"section": "奥林匹克公园", "type": "multi", "q": "下列关于北京奥林匹克公园空间构成的说法，正确的有（　）。", "options": ["A. 北部为奥林匹克森林公园", "B. 中部为中心区，是奥运会场馆和设施的集聚区", "C. 南部为已建成和预留区（奥体中心区）", "D. 北部奥林匹克森林公园面积为3.15平方公里"], "answer": "ABC", "explain": "全园分三部分：北部奥林匹克森林公园（6.8平方公里）、中部中心区（3.15平方公里）、南部奥体中心区（1.64平方公里）。D项面积错误。", "source": "全园在空间上分为三大部分：北部为奥林匹克森林公园，面积6.8平方公里……中部为中心区，面积3.15平方公里……南部为已建成和预留区（奥体中心区），面积1.64平方公里"}, {"section": "奥林匹克公园", "type": "single", "q": "北顶娘娘庙坐落在奥林匹克公园中心区的（　）。", "options": ["A. 东北部", "B. 东南部", "C. 西北部", "D. 西南部"], "answer": "D", "explain": "北顶娘娘庙坐落在奥林匹克公园中心区的西南部，国家游泳中心\"水立方\"南侧不远处。", "source": "北顶娘娘庙坐落在奥林匹克公园中心区的西南部（国家游泳中心\"水立方\"南侧不远处）"}, {"section": "奥林匹克公园", "type": "judge", "q": "奥林匹克森林公园面积6.8平方公里，是集生态、休闲、健身于一体的超大型城市公园。", "answer": "对", "explain": "原文表述：北部为奥林匹克森林公园，面积6.8平方公里，是集生态、休闲、健身于一体的超大型城市公园。", "source": "北部为奥林匹克森林公园，面积6.8平方公里，是集生态、休闲、健身于一体的超大型城市公园"}, {"section": "奥林匹克公园", "type": "single", "q": "北顶娘娘庙始建于（　）。", "options": ["A. 元代至元年间", "B. 明宣德年间", "C. 明嘉靖年间", "D. 清乾隆年间"], "answer": "B", "explain": "北顶娘娘庙始建于明宣德年间（1426—1435年），初为土地庙，清乾隆年间奉敕重修。", "source": "该庙始建于明宣德年间（1426—1435年），初为土地庙，清乾隆年间奉敕重修"}, {"section": "奥林匹克公园", "type": "judge", "q": "北顶娘娘庙于2003年被公布为北京市第七批市级文物保护单位，同年列入\"人文奥运\"文物修缮计划。", "answer": "对", "explain": "与原文一致：2003年被公布为北京市第七批市级文物保护单位，同年列入\"人文奥运\"文物修缮计划。", "source": "2003年被公布为北京市第七批市级文物保护单位，同年列入\"人文奥运\"文物修缮计划"}, {"section": "奥林匹克公园", "type": "multi", "q": "2008年奥运会期间，国家体育馆主要承担的比赛项目有（　）。", "options": ["A. 竞技体操", "B. 蹦床", "C. 手球", "D. 游泳"], "answer": "ABC", "explain": "2008年奥运会期间，国家体育馆主要承担竞技体操、蹦床和手球（决赛阶段）三个项目的比赛；游泳在水立方进行。", "source": "2008年奥运会期间，国家体育馆主要承担竞技体操、蹦床和手球（决赛阶段）三个项目的比赛"}, {"section": "奥林匹克公园", "type": "single", "q": "宣布北京获得2008年奥运会主办权的是国际奥委会第（　）次全会。", "options": ["A. 第111次", "B. 第112次", "C. 第113次", "D. 第128次"], "answer": "B", "explain": "2001年7月13日在莫斯科举行的国际奥委会第112次全会上，萨马兰奇宣布北京获得2008年奥运会主办权；第128次全会是2022年冬奥会申办。", "source": "在俄罗斯莫斯科举行的国际奥委会第112次全会上，国际奥委会主席萨马兰奇宣布北京获得2008年第29届夏季奥林匹克运动会主办权"}, {"section": "奥林匹克公园", "type": "judge", "q": "北京2008年奥运会火炬接力传递历时130天，其中境外传递97天、境内传递33天。", "answer": "错", "explain": "传递历时130天，其中境外33天、境内97天，题干将境外、境内天数颠倒。", "source": "传递历时130天（境外33天、境内97天），总里程约13.7万公里"}, {"section": "奥林匹克公园", "type": "single", "q": "2008年北京奥运会的主题口号是（　）。", "options": ["A. 新北京，新奥运", "B. 同一个世界 同一个梦想", "C. 和谐之旅", "D. 一起向未来"], "answer": "B", "explain": "主题口号是\"同一个世界 同一个梦想\"。\"新北京，新奥运\"是申办口号，\"和谐之旅\"是火炬接力主题，\"一起向未来\"是2022年冬奥会口号。", "source": "主题口号是\"同一个世界 同一个梦想\"（One World, One Dream），于2005年6月26日在北京工人体育馆正式发布"}, {"section": "奥林匹克公园", "type": "judge", "q": "2008年北京奥运会开幕式总导演为张艺谋，文艺表演名为《美丽的奥林匹克》。", "answer": "对", "explain": "与原文一致：开幕式在国家体育场（鸟巢）举行，总导演为张艺谋，文艺表演名为《美丽的奥林匹克》。", "source": "开幕式在国家体育场（鸟巢）举行，总导演为张艺谋，文艺表演名为《美丽的奥林匹克》"}, {"section": "奥林匹克公园", "type": "multi", "q": "承担2022年北京冬奥会赛事活动的赛区有（　）。", "options": ["A. 北京赛区", "B. 延庆赛区", "C. 张家口赛区", "D. 顺义赛区"], "answer": "ABC", "explain": "承担赛事活动的赛区共三个：北京赛区、延庆赛区、张家口赛区（北京、张家口两座城市）。", "source": "承担赛事活动的赛区共三个：北京赛区、延庆赛区、张家口赛区（北京、张家口两座城市）"}, {"section": "奥林匹克公园", "type": "single", "q": "2008年奥运会期间承担竞技体操、蹦床、手球比赛的国家体育馆，其固定座席为（　）。", "options": ["A. 约2000个", "B. 18000个", "C. 约81000个", "D. 20000个"], "answer": "B", "explain": "国家体育馆固定座席18000个，另加临时座席约2000个，最多可容纳观众约2万人，总建筑面积约8.1万平方米。", "source": "国家体育馆总建筑面积约8.1万平方米，固定座席18000个（另加临时座席约2000个），最多可容纳观众约2万人"}, {"section": "奥林匹克公园", "type": "judge", "q": "北京2022年冬奥会会徽名为\"飞跃\"，冬残奥会会徽名为\"冬梦\"。", "answer": "错", "explain": "冬奥会会徽名为\"冬梦\"，冬残奥会会徽名为\"飞跃\"，题干将二者颠倒。", "source": "北京2022年冬奥会会徽名为\"冬梦\"……北京2022年冬残奥会会徽名为\"飞跃\""}, {"section": "奥林匹克公园", "type": "single", "q": "2008年北京奥运会开幕式上，中国代表团入场式的旗手是（　）。", "options": ["A. 李宁", "B. 许海峰", "C. 姚明", "D. 刘欢"], "answer": "C", "explain": "中国代表队入场式的旗手是篮球运动员姚明；李宁是点燃主火炬的运动员。", "source": "中国代表队入场式的旗手是篮球运动员姚明"}, {"section": "奥林匹克公园", "type": "judge", "q": "北京奥林匹克公园南部为已建成和预留区（奥体中心区），面积1.64平方公里，是1990年亚运会场馆集聚区及奥体文化商务园区。", "answer": "对", "explain": "与原文一致：南部为已建成和预留区（奥体中心区），面积1.64平方公里，是1990年亚运会场馆集聚区及奥体文化商务园区。", "source": "南部为已建成和预留区（奥体中心区），面积1.64平方公里，是1990年亚运会场馆集聚区及奥体文化商务园区"}, {"section": "奥林匹克公园", "type": "multi", "q": "下列关于北京\"双奥\"的说法，正确的有（　）。", "options": ["A. 张艺谋是世界上第一位\"双奥\"开幕式总导演", "B. 鸟巢是世界上唯一一座同时举办过夏奥会和冬奥会开闭幕式的体育场馆", "C. 2008年北京奥运会中国代表团首次位列奥运会金牌榜第一", "D. 北京2022年冬奥会吉祥物\"冰墩墩\"以熊猫为原型", "E. 2022年北京冬奥会中国代表团获得9枚金牌，位列金牌榜第1位"], "answer": "ABCD", "explain": "2022年冬奥会中国获9金4银2铜，位列金牌榜第3位（挪威16金居首），故E错误；其余各项均与原文一致。", "source": "中国体育代表团共获得9枚金牌、4枚银牌、2枚铜牌……位列金牌榜第3位"}, {"section": "奥林匹克公园", "type": "single", "q": "为捐资兴建\"水立方\"，捐款中最大的一笔是香港企业家霍英东先生捐赠的（　）。", "options": ["A. 1澳元", "B. 1亿美元", "C. 2亿港元", "D. 8.3亿元人民币"], "answer": "C", "explain": "最大一笔为霍英东先生捐赠的2亿港元；最小一笔仅1澳元；捐款总额超过8.3亿元人民币。", "source": "其中最大一笔为香港企业家霍英东先生捐赠的2亿港元，最小的一笔仅1澳元"}, {"section": "奥林匹克公园", "type": "judge", "q": "为原地完整保护北顶娘娘庙及其遗址，原规划位于庙北侧的国家游泳中心（水立方）专门修改设计，向南迁移约100米。", "answer": "错", "explain": "水立方是向北迁移约100米，而非向南迁移。", "source": "原规划位于庙北侧的国家游泳中心（水立方）专门修改设计，向北迁移约100米"}, {"section": "奥林匹克公园", "type": "single", "q": "2008年北京奥运会的特设项目是（　）。", "options": ["A. 武术", "B. 跆拳道", "C. 龙舟", "D. 围棋"], "answer": "A", "explain": "经国际奥委会批准，2008年奥运会期间举办\"北京2008奥运会武术比赛\"，武术是奥运百年历史上首个特设项目。", "source": "2008年北京奥运会的特设项目是武术"}, {"section": "奥林匹克公园", "type": "judge", "q": "北京2008年奥运会火炬接力以\"点燃激情 传递梦想\"为主题，以\"和谐之旅\"为口号。", "answer": "错", "explain": "火炬接力以\"和谐之旅\"为主题，以\"点燃激情 传递梦想\"为口号，题干将主题与口号颠倒。", "source": "北京2008年奥运会火炬接力以\"和谐之旅\"为主题，以\"点燃激情 传递梦想\"为口号"}, {"section": "奥林匹克公园", "type": "multi", "q": "下列关于2008年北京奥运会场馆及其赛时功能的说法，正确的有（　）。", "options": ["A. 国家体育场（鸟巢）承担开闭幕式、田径比赛和男子足球决赛", "B. 国家游泳中心（水立方）承担游泳、跳水、花样游泳比赛", "C. 国家会议中心赛时为主新闻中心（MPC）和国际广播中心（IBC）", "D. 国家网球中心的主球场被称为\"钻石球场\"", "E. 国家体育馆赛时承担游泳比赛"], "answer": "ABCD", "explain": "A、B、C、D均与原文一致；游泳比赛在水立方进行，国家体育馆承担竞技体操、蹦床、手球，故E错误。", "source": "国家体育场（鸟巢）——承担开闭幕式、田径比赛和男子足球决赛；国家游泳中心（水立方）——承担游泳、跳水、花样游泳比赛；国家会议中心——赛时为主新闻中心（MPC）和国际广播中心（IBC）"}, {"section": "奥林匹克公园", "type": "single", "q": "2008年北京奥运会奖牌采用\"金镶玉\"设计，其中金牌镶嵌的是（　）。", "options": ["A. 青白玉", "B. 青玉", "C. 白玉", "D. 碧玉"], "answer": "C", "explain": "金牌镶嵌白玉，银牌镶嵌青白玉，铜牌镶嵌青玉，玉料均采用青海昆仑玉。", "source": "金牌镶嵌白玉，银牌镶嵌青白玉，铜牌镶嵌青玉，玉料均采用青海昆仑玉"}, {"section": "奥林匹克公园", "type": "judge", "q": "2008年北京奥运会武术比赛作为特设项目，其产生的奖牌计入北京奥运会奖牌榜。", "answer": "错", "explain": "武术是奥运史上首个特设项目，参赛运动员入住奥运村、享受同等待遇，但产生的奖牌不计入北京奥运会奖牌榜。", "source": "参赛运动员与其他项目选手同样入住奥运村、享受同等待遇，但产生的奖牌不计入北京奥运会奖牌榜"}, {"section": "奥林匹克公园", "type": "single", "q": "北京获得2022年第24届冬奥会举办权的投票结果是，北京以（　）战胜阿拉木图。", "options": ["A. 45票对40票", "B. 44票对41票", "C. 44票对40票", "D. 43票对40票"], "answer": "C", "explain": "2015年7月31日在吉隆坡举行的国际奥委会第128次全会上，北京以44票对40票战胜哈萨克斯坦的阿拉木图。", "source": "投票中北京以44票对40票战胜另一申办城市哈萨克斯坦的阿拉木图"}, {"section": "奥林匹克公园", "type": "judge", "q": "2022年北京冬奥会的全部冰上项目由北京赛区承办。", "answer": "对", "explain": "与原文一致：北京赛区承办全部冰上项目（冰壶、冰球、滑冰3个大项5个分项32个小项），以及单板和自由式滑雪大跳台。", "source": "北京赛区承办全部冰上项目（冰壶、冰球、滑冰3个大项5个分项32个小项）"}, {"section": "奥林匹克公园", "type": "multi", "q": "下列关于北京2008年奥运会火炬接力的说法，正确的有（　）。", "options": ["A. 火炬名为\"祥云\"", "B. 境外传递途经五大洲的21个城市", "C. 境内传递覆盖31个省、自治区、直辖市的113个城市和地区", "D. 奥运史上圣火首次登上珠穆朗玛峰", "E. 传递历时120天"], "answer": "ABCD", "explain": "火炬名\"祥云\"，境外21个城市、境内113个城市和地区，2008年5月8日圣火首登珠峰；传递历时130天而非120天，故E错误。", "source": "火炬名为\"祥云\"……境外传递途经五大洲的21个城市……境内传递覆盖31个省、自治区、直辖市的113个城市和地区……传递历时130天"}, {"section": "奥林匹克公园", "type": "single", "q": "北京奥林匹克公园中部中心区的面积是（　）。", "options": ["A. 6.8平方公里", "B. 3.15平方公里", "C. 1.64平方公里", "D. 11.59平方公里"], "answer": "B", "explain": "中部为中心区，面积3.15平方公里，是奥运会场馆和设施的集聚区；6.8、1.64、11.59平方公里分别为北部、南部及全园总面积。", "source": "中部为中心区，面积3.15平方公里，是奥运会场馆和设施的集聚区"}, {"section": "奥林匹克公园", "type": "judge", "q": "2015年7月31日，在马来西亚吉隆坡举行的国际奥委会第128次全会上，国际奥委会主席巴赫宣布北京获得2022年第24届冬奥会举办权。", "answer": "对", "explain": "与原文一致：2015年7月31日在吉隆坡举行的国际奥委会第128次全会上，巴赫宣布北京获得2022年第24届冬奥会举办权。", "source": "2015年7月31日……在马来西亚吉隆坡举行的国际奥委会第128次全会上，国际奥委会主席巴赫宣布：北京获得2022年第24届冬季奥林匹克运动会举办权"}, {"section": "奥林匹克公园", "type": "single", "q": "我国最大的室内综合体育馆、被称为\"折扇\"的是（　）。", "options": ["A. 国家体育场", "B. 国家游泳中心", "C. 国家体育馆", "D. 国家速滑馆"], "answer": "C", "explain": "国家体育馆被称为\"折扇\"，是我国最大的室内综合体育馆，与鸟巢、水立方并称北京奥运会三大主场馆。", "source": "是我国最大的室内综合体育馆，被称为\"折扇\"，与鸟巢、水立方并称为北京奥运会三大主场馆"}, {"section": "奥林匹克公园", "type": "multi", "q": "北顶娘娘庙沿中轴线由南向北依次为（　）。", "options": ["A. 山门殿", "B. 天王殿", "C. 娘娘殿", "D. 东岳殿", "E. 崇圣殿"], "answer": "ABCD", "explain": "庙宇沿中轴线由南向北依次为山门殿、天王殿、娘娘殿、东岳殿、玉皇殿，共四进院落；无崇圣殿。", "source": "沿中轴线由南向北依次为山门殿、天王殿、娘娘殿、东岳殿、玉皇殿，共四进院落"}, {"section": "奥林匹克公园", "type": "single", "q": "2008年北京奥运会开幕式主题曲《我和你》由刘欢与英国歌手（　）共同演唱。", "options": ["A. 莎拉·布莱曼", "B. 席琳·迪翁", "C.  Adele（阿黛尔）", "D. 谭晶"], "answer": "A", "explain": "开幕式主题曲《我和你》（You and Me）由中国歌手刘欢与英国歌手莎拉·布莱曼共同演唱。", "source": "开幕式主题曲为《我和你》（You and Me），由中国歌手刘欢与英国歌手莎拉·布莱曼在开幕式上共同演唱"}, {"section": "奥林匹克公园", "type": "single", "q": "2008年北京奥运会开幕式运动员入场式上，首先入场的代表队是（　）。", "options": ["A. 中国", "B. 几内亚", "C. 希腊", "D. 美国"], "answer": "C", "explain": "入场式按代表团名称的简体中文笔画顺序排列，希腊作为古代奥运发源地按惯例首先入场，第二个是几内亚，东道主中国最后入场。", "source": "首先入场的代表队是希腊（古代奥运发源地，按惯例领先），第二个入场的是几内亚，东道主中国代表团最后入场"}, {"section": "奥林匹克公园", "type": "multi", "q": "下列关于北京2022年冬奥会、冬残奥会会徽与吉祥物的说法，正确的有（　）。", "options": ["A. 冬奥会会徽\"冬梦\"的设计灵感来自汉字\"冬\"", "B. 冬残奥会会徽\"飞跃\"的设计灵感来自汉字\"飞\"", "C. 冬奥会吉祥物\"冰墩墩\"头部外壳造型取自冰雪运动头盔", "D. 冬残奥会吉祥物\"雪容融\"以和平鸽和天坛构成连续图案", "E. 主题口号为\"同一个世界 同一个梦想\""], "answer": "ABCD", "explain": "A、B、C、D均与原文一致；2022年冬奥会主题口号是\"一起向未来\"，\"同一个世界 同一个梦想\"是2008年奥运会口号，故E错误。", "source": "主题口号为\"一起向未来\"（Together for a Shared Future），2021年9月17日发布"}, {"section": "奥林匹克公园", "type": "single", "q": "2008年北京奥运会开幕式上，点燃\"祥云\"造型主火炬的中国运动员是（　）。", "options": ["A. 许海峰", "B. 李宁", "C. 姚明", "D. 孙晋芳"], "answer": "B", "explain": "\"体操王子\"李宁以钢丝吊至高空，沿场馆顶端\"空中漫步\"绕场一周后点燃主火炬；孙晋芳是场内最后一棒交棒者。", "source": "点燃\"祥云\"造型主火炬的中国运动员是\"体操王子\"李宁"}, {"section": "奥林匹克公园", "type": "single", "q": "2008年北京奥林匹克水上公园（顺义奥林匹克水上公园）位于北京市（　）。", "options": ["A. 朝阳区", "B. 海淀区", "C. 顺义区", "D. 昌平区"], "answer": "C", "explain": "北京奥林匹克水上公园位于北京市顺义区北小营镇潮白河畔，是赛艇、皮划艇和马拉松游泳等项目的比赛场馆。", "source": "2008年北京奥林匹克水上公园（顺义奥林匹克水上公园）位于北京市顺义区（北小营镇潮白河畔，白马路19号）"}, {"section": "奥林匹克公园", "type": "single", "q": "2008年奥运会期间，国家游泳中心（水立方）承担的比赛项目是（　）。", "options": ["A. 竞技体操、蹦床、手球", "B. 游泳、跳水、花样游泳", "C. 赛艇、皮划艇、马拉松游泳", "D. 田径、足球决赛"], "answer": "B", "explain": "水立方承担游泳、跳水、花样游泳比赛；竞技体操等在国家体育馆，赛艇等在顺义水上公园。", "source": "国家游泳中心（水立方）——承担游泳、跳水、花样游泳比赛"}, {"section": "奥林匹克公园", "type": "single", "q": "2008年北京奥运会\"金镶玉\"奖牌中，银牌镶嵌的是（　）。", "options": ["A. 白玉", "B. 青白玉", "C. 青玉", "D. 碧玉"], "answer": "B", "explain": "金牌镶嵌白玉，银牌镶嵌青白玉，铜牌镶嵌青玉，玉料均采用青海昆仑玉。", "source": "金牌镶嵌白玉，银牌镶嵌青白玉，铜牌镶嵌青玉，玉料均采用青海昆仑玉"}, {"section": "奥林匹克公园", "type": "single", "q": "北京2022年冬奥会吉祥物\"冰墩墩\"的设计原型是（　）。", "options": ["A. 中国灯笼", "B. 熊猫", "C. 燕子", "D. 航天员"], "answer": "B", "explain": "冰墩墩以中国国宝熊猫为原型，将熊猫形象与冰晶外壳相结合；冬残奥会吉祥物雪容融以中国灯笼为原型。", "source": "北京2022年冬奥会吉祥物为\"冰墩墩\"——以中国国宝熊猫为原型进行设计创作"}, {"section": "奥林匹克公园", "type": "single", "q": "2022年北京冬奥会延庆赛区主要承办的比赛项目是（　）。", "options": ["A. 冰壶、冰球、滑冰", "B. 高山滑雪、雪车、雪橇", "C. 越野滑雪、跳台滑雪", "D. 单板滑雪、自由式滑雪大跳台"], "answer": "B", "explain": "延庆赛区主要承办高山滑雪、雪车、雪橇（3个大项4个分项）的比赛，共产生21枚金牌；冰壶、冰球、滑冰在北京赛区。", "source": "延庆赛区主要承办高山滑雪、雪车、雪橇（3个大项，含高山滑雪、雪车、钢架雪车、雪橇4个分项）的比赛"}, {"section": "奥林匹克公园", "type": "single", "q": "2022年北京冬奥会上，中国体育代表团获得的奖牌总数及金牌榜排名是（　）。", "options": ["A. 9枚奖牌，金牌榜第1位", "B. 15枚奖牌，金牌榜第3位", "C. 15枚奖牌，金牌榜第2位", "D. 61枚奖牌，金牌榜第1位"], "answer": "B", "explain": "中国获9金4银2铜共15枚奖牌，位列金牌榜第3位；61枚奖牌是北京冬残奥会的成绩。", "source": "中国体育代表团共获得9枚金牌、4枚银牌、2枚铜牌，共计15枚奖牌，位列金牌榜第3位"}, {"section": "孔庙、国子监", "type": "single", "q": "孔子封号\"大成至圣文宣王\"中\"大成\"二字，语出（　）。", "options": ["A. 《论语》", "B. 《孟子》", "C. 《史记》", "D. 《礼记》"], "answer": "B", "explain": "\"大成\"语出《孟子·万章下》\"孔子之谓集大成\"；\"至圣\"语出《史记·孔子世家》。", "source": "\"大成\"：语出《孟子·万章下》\"孔子之谓集大成。集大成也者，金声而玉振之也\""}, {"section": "孔庙、国子监", "type": "judge", "q": "祭祀孔子的礼仪属于古代\"五礼\"中的嘉礼。", "answer": "错", "explain": "祭孔（释奠礼）属于\"五礼\"中的吉礼，吉礼是祭祀天地、宗庙、社稷、先圣先师之礼，列五礼之首。", "source": "祭祀孔子的礼仪属于古代\"五礼\"中的吉礼……吉礼是祭祀天地、宗庙、社稷、先圣先师之礼，列五礼之首"}, {"section": "孔庙、国子监", "type": "multi", "q": "国子监街下马碑上镌刻\"官员人等至此下马\"，使用的文字有（　）。", "options": ["A. 满文", "B. 汉文", "C. 藏文", "D. 托忒蒙古文", "E. 西夏文"], "answer": "ABCD", "explain": "下马碑用满、汉、蒙、回（察合台文）、藏、托忒（托忒蒙古文）六种文字书写，不含西夏文。", "source": "碑身正背两面分别镌刻\"官员人等至此下马\"八字，用满、汉、蒙、回（察合台文／维吾尔文）、藏、托忒（托忒蒙古文）六种文字书写"}, {"section": "孔庙、国子监", "type": "single", "q": "追谥孔子为\"文宣王\"的是（　）。", "options": ["A. 唐开元二十七年唐玄宗", "B. 宋大中祥符五年宋真宗", "C. 元大德十一年元武宗", "D. 清顺治二年顺治帝"], "answer": "A", "explain": "唐开元二十七年（739年）唐玄宗追谥孔子为\"文宣王\"；宋真宗改谥\"至圣文宣王\"；元武宗加封\"大成至圣文宣王\"。", "source": "\"文宣\"：唐开元二十七年（739年）唐玄宗追谥孔子为\"文宣王\"所沿用的谥号"}, {"section": "孔庙、国子监", "type": "judge", "q": "\"大成至圣文宣王\"是元大德十一年（1307年）元武宗海山即位后加封给孔子的最高封号。", "answer": "对", "explain": "与原文一致：这是元大德十一年（1307年）元武宗海山即位后加封给孔子的最高封号。", "source": "这是元大德十一年（1307年）元武宗海山即位后加封给孔子的最高封号，也是大一统王朝给予孔子的最高谥封"}, {"section": "孔庙、国子监", "type": "single", "q": "元明清时期，国子监最高长官的称谓是（　）。", "options": ["A. 司业", "B. 祭酒", "C. 博士", "D. 管理监事大臣"], "answer": "B", "explain": "国子监最高长官为祭酒（全称\"国子监祭酒\"），副职为司业；清代另设\"管理监事大臣\"总理，但日常事务仍由祭酒主持。", "source": "元明清国子监最高长官的称谓：祭酒（全称\"国子监祭酒\"……）。副职为司业"}, {"section": "孔庙、国子监", "type": "judge", "q": "汉武帝采纳董仲舒的主张，于元朔五年（公元前124年）设太学、立五经博士。", "answer": "对", "explain": "与原文一致：汉武帝采纳董仲舒\"罢黜百家、独尊儒术\"\"兴太学以养士\"的主张，于元朔五年（公元前124年）设太学。", "source": "汉武帝采纳董仲舒\"罢黜百家、独尊儒术\"\"兴太学以养士\"的主张，于元朔五年（公元前124年）设太学"}, {"section": "孔庙、国子监", "type": "multi", "q": "被建筑学家梁思成誉为北京\"六大宫殿\"的有（　）。", "options": ["A. 故宫太和殿", "B. 天坛祈年殿", "C. 颐和园仁寿殿", "D. 国子监辟雍殿", "E. 太庙享殿"], "answer": "ABCD", "explain": "梁思成所称\"六大宫殿\"指故宫太和殿、中和殿、保和殿，天坛祈年殿，颐和园仁寿殿，国子监辟雍殿，太庙享殿不在其列。", "source": "指故宫太和殿、中和殿、保和殿，天坛祈年殿，颐和园仁寿殿，国子监辟雍殿"}, {"section": "孔庙、国子监", "type": "single", "q": "民国年间在北京孔庙最后一次祭孔的时间是（　）。", "options": ["A. 1914年", "B. 1916年", "C. 1948年", "D. 1949年"], "answer": "C", "explain": "民国年间最后一次祭孔为1948年（孔子诞辰日）；1914年9月28日袁世凯主持的是民国首次大规模祭孔。", "source": "民国年间在北京孔庙最后一次祭孔的时间：1948年……此后祭孔改由教育部主办，至1948年为最后一次"}, {"section": "孔庙、国子监", "type": "judge", "q": "清代钦定北京孔庙为\"先师庙\"的皇帝是康熙皇帝。", "answer": "错", "explain": "钦定北京孔庙为\"先师庙\"的是清世祖顺治皇帝：顺治二年尊孔子为\"大成至圣文宣先师\"，顺治十四年改称\"至圣先师\"。", "source": "清代钦定北京孔庙为\"先师庙\"的皇帝：清世祖顺治皇帝"}, {"section": "孔庙、国子监", "type": "single", "q": "清廷废除科举制度后，管理国子监各项职能的机构是（　）。", "options": ["A. 礼部", "B. 学部", "C. 教育部", "D. 京师大学堂"], "answer": "B", "explain": "光绪三十一年（1905年）清廷设立学部，国子监的教育行政与教学管理职能归并学部，国子监遂裁撤。", "source": "废除科举后管理国子监各项职能的机构：学部。光绪三十一年（1905年）清廷设立学部"}, {"section": "孔庙、国子监", "type": "judge", "q": "中国古代科举制度始于隋炀帝大业元年（605年），止于清光绪三十一年（1905年），历时约1300年。", "answer": "对", "explain": "与原文一致：始于605年设进士科，止于1905年清廷下诏停止乡会试，历时约1300年。", "source": "始于隋炀帝大业元年（公元605年）设进士科，止于清光绪三十一年（1905年）……历时约1300年"}, {"section": "孔庙、国子监", "type": "multi", "q": "北京孔庙大成殿内孔子神位两侧配享的\"四配\"包括（　）。", "options": ["A. 复圣颜回", "B. 宗圣曾参", "C. 述圣孔伋", "D. 亚圣孟轲", "E. 朱熹"], "answer": "ABCD", "explain": "\"四配\"为复圣颜回、宗圣曾参、述圣孔伋、亚圣孟轲；朱熹列于\"十二哲\"，不属于四配。", "source": "\"四配\"：大成殿内孔子神位两侧配享的四位儒家圣人——复圣颜回（颜子）、宗圣曾参（曾子）、述圣孔伋（子思）、亚圣孟轲（孟子）"}, {"section": "孔庙、国子监", "type": "single", "q": "清代最后一届科举考试的状元是（　）。", "options": ["A. 刘墉", "B. 纪昀", "C. 刘春霖", "D. 张謇"], "answer": "C", "explain": "刘春霖为光绪三十年甲辰科（1904年）一甲第一名状元，因次年即废科举，被称为\"第一人中最后人\"。", "source": "清代最后一届科举考试状元：刘春霖……为光绪三十年甲辰科（1904年）一甲第一名状元"}, {"section": "孔庙、国子监", "type": "judge", "q": "北京孔庙始建于元成宗大德六年（1302年），是全国第一大孔庙。", "answer": "错", "explain": "北京孔庙始建于1302年无误，但它是仅次于山东曲阜孔庙的全国第二大孔庙。", "source": "北京孔庙始建于元成宗大德六年（1302年）……是仅次于山东曲阜孔庙的全国第二大孔庙"}, {"section": "孔庙、国子监", "type": "single", "q": "下列建筑中，不属于北京三大皇家庙宇的是（　）。", "options": ["A. 太庙", "B. 孔庙", "C. 历代帝王庙", "D. 天坛"], "answer": "D", "explain": "北京三大皇家庙宇为太庙、孔庙（文庙、先师庙）、历代帝王庙，天坛不在其列。", "source": "北京三大皇家庙宇：太庙……孔庙（又称文庙、先师庙）……历代帝王庙"}, {"section": "孔庙、国子监", "type": "judge", "q": "孔庙\"辨奸柏\"相传为元代国子监第一任祭酒许衡手植，树龄已近700年。", "answer": "对", "explain": "与原文一致：辨奸柏相传为元代国子监第一任祭酒许衡手植，树龄已近700年。", "source": "相传为元代国子监第一任祭酒许衡手植，树龄已近700年"}, {"section": "孔庙、国子监", "type": "multi", "q": "清朝国子监生员分\"贡生\"与\"监生\"两大类，下列属于贡生类别的有（　）。", "options": ["A. 岁贡", "B. 恩贡", "C. 拔贡", "D. 荫监", "E. 例贡"], "answer": "ABCE", "explain": "贡生包括岁贡、恩贡、拔贡、副贡、优贡、例贡；荫监属于监生（恩监、荫监、优监、例监）。", "source": "贡生：岁贡、恩贡、拔贡、副贡、优贡、例贡……监生：恩监、荫监、优监、例监"}, {"section": "孔庙、国子监", "type": "single", "q": "国子监被国务院公布为第一批全国重点文物保护单位的时间是（　）。", "options": ["A. 1961年", "B. 1984年", "C. 1988年", "D. 2009年"], "answer": "A", "explain": "国子监于1961年3月4日被公布为第一批全国重点文物保护单位；北京孔庙为1988年第三批；国子监街1984年列为北京市级文保单位。", "source": "国子监于1961年3月4日被国务院公布为第一批全国重点文物保护单位；北京孔庙于1988年1月13日被公布为第三批"}, {"section": "孔庙、国子监", "type": "judge", "q": "大成殿院中的古井\"砚水湖\"是由清康熙皇帝特赐名的。", "answer": "错", "explain": "赐名\"砚水湖\"的是清乾隆皇帝，取\"以井为砚、以水为墨\"之意，并非康熙帝。", "source": "清乾隆皇帝特赐名\"砚水湖\"（井小而以\"湖\"名之，取\"以井为砚、以水为墨\"之意）"}, {"section": "孔庙、国子监", "type": "single", "q": "北京孔庙中轴线上的主要建筑由南向北依次是（　）。", "options": ["A. 先师门、大成殿、大成门、崇圣门、崇圣祠", "B. 先师门、大成门、大成殿、崇圣门、崇圣祠", "C. 大成门、先师门、大成殿、崇圣祠、崇圣门", "D. 先师门、大成门、崇圣门、大成殿、崇圣祠"], "answer": "B", "explain": "中轴线上由南向北依次为：先师门、大成门、大成殿、崇圣门、崇圣祠五座，共三进院落。", "source": "中轴线上的主要建筑（由南向北，三进院落）：先师门、大成门、大成殿、崇圣门、崇圣祠五座"}, {"section": "孔庙、国子监", "type": "judge", "q": "孔子封号中\"至圣\"意为道德学问至高无上的圣人，语出《史记·孔子世家》\"可谓至圣矣\"，宋真宗大中祥符五年（1012年）改谥\"至圣文宣王\"。", "answer": "对", "explain": "与原文一致：\"至圣\"语出《史记·孔子世家》，宋真宗大中祥符五年改谥\"至圣文宣王\"。", "source": "\"至圣\"：意为道德学问至高无上的圣人，语出《史记·孔子世家》\"可谓至圣矣\"；宋真宗大中祥符五年（1012年）改谥\"至圣文宣王\""}, {"section": "孔庙、国子监", "type": "multi", "q": "国子监学生入学后第一年（初级班）上课学习的堂有（　）。", "options": ["A. 正义堂", "B. 崇志堂", "C. 广业堂", "D. 率性堂"], "answer": "ABC", "explain": "第一年初级班在正义堂、崇志堂、广业堂三堂学习；率性堂是最高年级（经史兼通、文理俱优者升入）。", "source": "第一年（初级班）在正义堂、崇志堂、广业堂三堂学习……经史兼通、文理俱优者升入率性堂"}, {"section": "孔庙、国子监", "type": "single", "q": "明嘉靖九年（1530年）在北京孔庙增建的崇圣祠，原名是（　）。", "options": ["A. 启圣祠", "B. 崇文阁", "C. 彝伦堂", "D. 棂星门"], "answer": "A", "explain": "崇圣祠原名启圣祠，建于明嘉靖九年（1530年），清雍正元年（1723年）改名崇圣祠。", "source": "崇圣祠（原名启圣祠），建于明嘉靖九年（1530年）……清雍正元年（1723年）改名崇圣祠"}, {"section": "孔庙、国子监", "type": "judge", "q": "清代国子监祭酒为正六品，副职司业为正四品。", "answer": "错", "explain": "清代祭酒为正四品，司业为正六品，题干将二者品级颠倒。", "source": "祭酒品级：清代正四品，司业正六品"}, {"section": "孔庙、国子监", "type": "single", "q": "清朝将北京孔庙大成殿、大成门改铺黄琉璃瓦的时间是（　）。", "options": ["A. 清雍正元年（1723年）", "B. 清乾隆二年（1737年）", "C. 清乾隆五十五年（1790年）", "D. 清光绪三十二年（1906年）"], "answer": "B", "explain": "清乾隆二年（1737年）乾隆帝命大成殿、大成门改用黄琉璃瓦，崇圣祠改用绿琉璃瓦，乾隆三年竣工。", "source": "清乾隆二年（1737年）。乾隆帝命北京孔庙大成殿、大成门改用黄琉璃瓦，崇圣祠改用绿琉璃瓦"}, {"section": "孔庙、国子监", "type": "judge", "q": "光绪三十二年（1906年）祭孔升为\"大祀\"后改用六佾舞（三十六人），此前用八佾舞。", "answer": "错", "explain": "1906年升\"大祀\"后用八佾舞（八八六十四人），此前用六佾舞（三十六人），题干将前后规格颠倒。", "source": "光绪三十二年（1906年）祭孔升为\"大祀\"后用八佾舞（八八六十四人）；此前用六佾舞（三十六人）"}, {"section": "孔庙、国子监", "type": "multi", "q": "明清时期北京孔庙祭孔的六大仪程包括（　）。", "options": ["A. 迎神", "B. 初献", "C. 终献", "D. 送神", "E. 开光"], "answer": "ABCD", "explain": "六大仪程为：迎神→初献→亚献→终献→撤馔（彻馔）→送神，不含\"开光\"。", "source": "六大仪程：迎神 → 初献 → 亚献 → 终献 → 撤馔（彻馔）→ 送神"}, {"section": "孔庙、国子监", "type": "single", "q": "原藏于北京孔庙的战国石鼓，现在收藏于（　）。", "options": ["A. 中国国家博物馆", "B. 首都博物馆", "C. 北京故宫博物院", "D. 孔庙和国子监博物馆"], "answer": "C", "explain": "战国石鼓抗战前夕随故宫文物南迁，胜利后运回北京，现藏故宫博物院；孔庙现存者为清乾隆年间仿制的复制品。", "source": "战国石鼓的现藏地点：北京故宫博物院……孔庙现存者为清乾隆年间仿制的复制品"}, {"section": "孔庙、国子监", "type": "judge", "q": "清代每年于仲春（农历二月）上丁日与仲秋（农历八月）上丁日两次举行祭孔典礼，史称\"丁祭\"。", "answer": "对", "explain": "与原文一致：每年仲春、仲秋上丁日两次祭孔，即每季第二个月的第一个\"丁日\"，史称\"丁祭\"。", "source": "每年仲春（农历二月）上丁日与仲秋（农历八月）上丁日两次，即每季第二个月的第一个\"丁日\"，史称\"丁祭\""}, {"section": "孔庙、国子监", "type": "single", "q": "北京孔庙大成殿的屋顶式样是（　）。", "options": ["A. 重檐歇山顶", "B. 重檐庑殿顶", "C. 单檐庑殿顶", "D. 重檐攒尖顶"], "answer": "B", "explain": "大成殿为重檐庑殿顶，覆黄琉璃瓦，面阔九间、进深五间，与故宫太和殿同属最高等级。", "source": "大成殿屋顶式样：重檐庑殿顶，覆黄琉璃瓦，面阔九间、进深五间（\"九五\"开间）……与故宫太和殿同属最高等级"}, {"section": "孔庙、国子监", "type": "judge", "q": "北京孔庙现存的战国石鼓为清乾隆年间仿制的复制品，原鼓现藏北京故宫博物院。", "answer": "对", "explain": "与原文一致：战国石鼓抗战前夕随故宫文物南迁，胜利后运回北京，现藏故宫博物院，孔庙现存者为清乾隆年间仿制的复制品。", "source": "现藏故宫博物院。孔庙现存者为清乾隆年间仿制的复制品"}, {"section": "孔庙、国子监", "type": "multi", "q": "下列属于北京三大皇家庙宇的有（　）。", "options": ["A. 太庙", "B. 孔庙", "C. 历代帝王庙", "D. 天坛", "E. 雍和宫"], "answer": "ABC", "explain": "北京三大皇家庙宇为太庙、孔庙（文庙、先师庙）、历代帝王庙；天坛、雍和宫不在其列。", "source": "北京三大皇家庙宇：太庙……孔庙（又称文庙、先师庙，元明清三代国家祭孔之所）、历代帝王庙"}, {"section": "孔庙、国子监", "type": "single", "q": "孔庙\"十三经\"刻石（乾隆石经）的抄写者是（　）。", "options": ["A. 张照", "B. 刘墉", "C. 蒋衡", "D. 吴苑"], "answer": "C", "explain": "十三经由江苏金坛贡生蒋衡（号湘帆）以楷书手书，自雍正四年至乾隆二年历时12年完成，全文约63万字。", "source": "由江苏金坛贡生蒋衡（号湘帆）以楷书手书，自雍正四年（1726年）至乾隆二年（1737年），历时12年完成"}, {"section": "孔庙、国子监", "type": "judge", "q": "北京孔庙第一进院落（先师门与大成门之间）有御碑亭11座，第二进院落（大成门与大成殿之间）有御碑亭3座。", "answer": "错", "explain": "第一进院落有御碑亭3座（东一西二），第二进院落有御碑亭11座（东六西五），题干将两进院落数量颠倒。", "source": "第一进院落（先师门与大成门之间）有御碑亭3座（东一西二），第二进院落（大成门与大成殿之间）有御碑亭11座"}, {"section": "孔庙、国子监", "type": "single", "q": "北京孔庙大成殿外悬挂的\"万世师表\"匾的题写者是（　）。", "options": ["A. 康熙皇帝", "B. 雍正皇帝", "C. 乾隆皇帝", "D. 黎元洪"], "answer": "A", "explain": "\"万世师表\"匾为清康熙皇帝康熙二十三年（1684年）御笔亲书，并颁行直省学宫。", "source": "大成殿外\"万世师表\"匾的题写者：清康熙皇帝（康熙二十三年，1684年御笔亲书，并颁行直省学宫）"}, {"section": "孔庙、国子监", "type": "judge", "q": "国子监琉璃牌楼是北京现存唯一一座属于寺庙的琉璃牌坊。", "answer": "错", "explain": "国子监琉璃牌楼是北京唯一一座专为教育而设立的琉璃牌坊，也是北京现存唯一一座不属于寺庙的琉璃牌坊。", "source": "是北京唯一一座专为教育而设立的琉璃牌坊，也是北京现存唯一一座不属于寺庙的琉璃牌坊"}, {"section": "孔庙、国子监", "type": "multi", "q": "下列关于\"左庙右学\"规制在国子监街上体现的说法，正确的有（　）。", "options": ["A. 孔庙在东（左），为\"庙\"", "B. 国子监在西（右），为\"学\"", "C. 两组建筑各沿中轴线南北延伸、左右对称", "D. 孔庙与国子监之间有持敬门相通", "E. 国子监在东，孔庙在西"], "answer": "ABCD", "explain": "孔庙在东为\"庙\"，国子监在西为\"学\"，各沿中轴线南北延伸，之间有持敬门相通，是中国现存最完整的\"左庙右学\"建筑实例；E与原文相反。", "source": "孔庙在东（左，为\"庙\"），国子监在西（右，为\"学\"）……之间有持敬门相通"}, {"section": "孔庙、国子监", "type": "single", "q": "国子监辟雍奉旨兴工的时间是（　）。", "options": ["A. 清乾隆二年（1737年）", "B. 清乾隆四十八年（1783年）", "C. 清乾隆五十年（1785年）", "D. 清康熙二十三年（1684年）"], "answer": "B", "explain": "辟雍于清乾隆四十八年（1783年）二月奉旨兴工，乾隆四十九年（1784年）冬竣工，配套工程于乾隆五十年完工。", "source": "辟雍于清乾隆四十八年（1783年）二月奉旨兴工，乾隆四十九年（1784年）冬竣工"}, {"section": "孔庙、国子监", "type": "judge", "q": "国子监彝伦堂原址在元代为\"崇文阁\"，是国子监藏书的地方，明代永乐年间重建并改名\"彝伦堂\"。", "answer": "对", "explain": "与原文一致：彝伦堂原址在元代为\"崇文阁\"，建于元皇庆二年（1313年），是国子监藏书楼；明永乐年间重建并改名\"彝伦堂\"。", "source": "彝伦堂原址在元代为\"崇文阁\"，建于元皇庆二年（1313年），是国子监藏书的地方……明代永乐年间予以重建并改名\"彝伦堂\""}, {"section": "孔庙、国子监", "type": "single", "q": "国子监琉璃牌楼北面（背面）额题的文字是（　）。", "options": ["A. 圜桥教泽", "B. 学海节观", "C. 万世师表", "D. 道洽大同"], "answer": "B", "explain": "琉璃牌楼南面额题\"圜桥教泽\"，北面额题\"学海节观\"，均为清乾隆皇帝御笔。", "source": "南面（正面）额题\"圜桥教泽\"，北面（背面）额题\"学海节观\"，均为清乾隆皇帝御笔"}, {"section": "孔庙、国子监", "type": "multi", "q": "下列关于国子监街下马碑的说法，正确的有（　）。", "options": ["A. 位于北京孔庙大门（先师门）外东西两侧路北，共两座", "B. 为清代所立", "C. 碑身镌刻\"官员人等至此下马\"八字", "D. 即便皇帝亲临祭孔亦须降舆步行", "E. 据《大清律例》，过碑不下马者笞一百"], "answer": "ABCD", "explain": "下马碑为清代所立，共两座，刻\"官员人等至此下马\"，皇帝亲临亦须降舆步行；据《大清律例》过碑不下马者笞五十而非笞一百，故E错误。", "source": "据《大清律例》，过碑不下马者笞五十，看守差役失职者笞四十"}, {"section": "孔庙、国子监", "type": "single", "q": "古代\"五礼\"中列于首位、为祭祀天地、宗庙、社稷、先圣先师之礼的是（　）。", "options": ["A. 吉礼", "B. 凶礼", "C. 宾礼", "D. 嘉礼"], "answer": "A", "explain": "吉礼列五礼之首，是祭祀天地、宗庙、社稷、先圣先师之礼，祭孔（释奠礼）即属吉礼。", "source": "吉礼是祭祀天地、宗庙、社稷、先圣先师之礼，列五礼之首"}, {"section": "孔庙、国子监", "type": "single", "q": "据《孟子》\"孔子之谓集大成\"取\"大成\"二字，诏改孔庙正殿为\"大成殿\"的皇帝是（　）。", "options": ["A. 宋真宗", "B. 宋徽宗", "C. 唐玄宗", "D. 元武宗"], "answer": "B", "explain": "宋徽宗据《孟子·万章下》此语取\"大成\"二字，诏改孔庙正殿为\"大成殿\"。", "source": "宋徽宗据《孟子》此语取\"大成\"二字，诏改孔庙正殿为\"大成殿\""}, {"section": "孔庙、国子监", "type": "multi", "q": "下列关于国子监辟雍设计督造的说法，正确的有（　）。", "options": ["A. 由工部尚书刘墉奉旨主办、主持设计督造", "B. 户部尚书和珅奉旨审定工程做法", "C. 和珅提出撤去殿内四根\"钻金柱\"、改用抹角架梁，节省白银4400余两", "D. 户部左侍郎金简建议添建琉璃牌楼、碑亭、钟鼓亭\"一牌楼四亭\"", "E. 辟雍于乾隆四十八年（1783年）当年竣工"], "answer": "ABCD", "explain": "辟雍乾隆四十八年（1783年）二月兴工，乾隆四十九年（1784年）冬竣工，并非当年竣工，故E错误；其余各项均与原文一致。", "source": "由工部尚书刘墉（石庵）奉旨主办……户部尚书和珅奉旨审定工程做法……户部左侍郎金简建议添建琉璃牌楼、碑亭、钟鼓亭"}, {"section": "孔庙、国子监", "type": "single", "q": "向汉武帝建议\"兴太学以养士\"、建立太学的官员是（　）。", "options": ["A. 公孙弘", "B. 主父偃", "C. 董仲舒", "D. 桑弘羊"], "answer": "C", "explain": "汉武帝采纳董仲舒\"罢黜百家、独尊儒术\"\"兴太学以养士\"的主张，于元朔五年（公元前124年）设太学，这是中国官立中央大学的开端。", "source": "建议汉武帝建立太学的官员：董仲舒。汉武帝采纳董仲舒\"罢黜百家、独尊儒术\"\"兴太学以养士\"的主张"}, {"section": "孔庙、国子监", "type": "single", "q": "民国三年（1914年）9月28日，以\"大祀\"规格在北京孔庙亲自主持民国首次大规模祭孔的是（　）。", "options": ["A. 黎元洪", "B. 袁世凯", "C. 段祺瑞", "D. 范源濂"], "answer": "B", "explain": "1914年9月28日袁世凯曾在北京孔庙以\"大祀\"规格亲自主持民国首次大规模祭孔；此后祭孔改由教育部主办。", "source": "民国三年（1914年）9月28日袁世凯曾在北京孔庙以\"大祀\"规格亲自主持民国首次大规模祭孔"}, {"section": "孔庙、国子监", "type": "multi", "q": "清朝国子监监生享受的待遇包括（　）。", "options": ["A. 由国家供给膳食、住宿", "B. 发给\"膏火银\"（生活津贴）", "C. 免其徭役", "D. 坐监积满年限、成绩合格即给予出身，优秀者可直接授官", "E. 一律不得应科举"], "answer": "ABCD", "explain": "监生由国家供给膳食住宿、发给膏火银、免徭役，积分合格给予出身，优秀者可直接授官；清代监生并可应科举、考职录用，故E错误。", "source": "由国家供给膳食、住宿……发给\"膏火银\"……免其徭役……优秀者可直接授官……清代监生并可应科举"}, {"section": "孔庙、国子监", "type": "single", "q": "清代最后一届科举考试（光绪三十年甲辰科）的末次会试举行地点是（　）。", "options": ["A. 北京顺天贡院", "B. 南京江南贡院", "C. 河南开封贡院", "D. 西安关中贡院"], "answer": "C", "explain": "该科末次会试在河南开封贡院举行，因顺天贡院毁于庚子之乱。", "source": "该科末次会试在河南开封贡院举行（顺天贡院毁于庚子之乱）"}, {"section": "孔庙、国子监", "type": "single", "q": "北京孔庙被国务院公布为全国重点文物保护单位的时间和批次是（　）。", "options": ["A. 1961年第一批", "B. 1988年第三批", "C. 1984年第三批市级", "D. 2009年首届"], "answer": "B", "explain": "北京孔庙于1988年1月13日被公布为第三批全国重点文物保护单位；1961年第一批是国子监。", "source": "北京孔庙于1988年1月13日被公布为第三批全国重点文物保护单位"}, {"section": "孔庙、国子监", "type": "multi", "q": "北京孔庙大成殿内悬挂的清代皇帝御匾与皇帝对应正确的有（　）。", "options": ["A. 康熙\"万世师表\"", "B. 雍正\"生民未有\"", "C. 乾隆\"与天地参\"", "D. 光绪\"斯文在兹\"", "E. 宣统\"道洽大同\""], "answer": "ABCD", "explain": "A、B、C、D均与原文一致；\"道洽大同\"为民国大总统黎元洪所题，宣统帝匾为\"中和位育\"，故E错误。", "source": "康熙\"万世师表\"、雍正\"生民未有\"、乾隆\"与天地参\"……光绪\"斯文在兹\"、宣统\"中和位育\"，以及黎元洪\"道洽大同\""}, {"section": "孔庙、国子监", "type": "single", "q": "国子监街上完整保留的过街牌楼共有（　）。", "options": ["A. 2座", "B. 3座", "C. 4座", "D. 6座"], "answer": "C", "explain": "国子监街完整保留着4座过街牌楼：街东西两口两座额题\"成贤街\"，国子监大门左右两座额题\"国子监\"。", "source": "街上完整地保留着4座过街牌楼：街东西两口的两座额题\"成贤街\"，国子监大门左右的两座额题\"国子监\""}, {"section": "孔庙、国子监", "type": "single", "q": "国子监街荣获\"中国历史文化名街\"称号的届次是（　）。", "options": ["A. 首届（第一届）", "B. 第二届", "C. 第三届", "D. 第四届"], "answer": "A", "explain": "国子监街荣获首届\"中国历史文化名街\"称号，2009年6月10日在北京揭晓，首批共评出10条名街，国子监街名列其中（居首）。", "source": "国子监街荣获首届（第一届）\"中国历史文化名街\"称号，于2009年6月10日在北京揭晓"}, {"section": "孔庙、国子监", "type": "single", "q": "北京孔庙中虽经明清多次修葺仍保留元代建筑遗风、为北京地区罕见元代木构遗存的建筑是（　）。", "options": ["A. 大成殿", "B. 崇圣祠", "C. 先师门", "D. 碑亭"], "answer": "C", "explain": "先师门（孔庙正门，又称棂星门）保留元代建筑遗风——斗拱硕大稀疏、朴拙简洁，是北京地区罕见的元代木构遗存。", "source": "保留元代建筑风格的建筑：先师门（孔庙正门，又称棂星门）……是北京地区罕见的元代木构遗存"}, {"section": "孔庙、国子监", "type": "single", "q": "\"进士题名\"之风始于唐代，时称（　）。", "options": ["A. 雁塔题名", "B. 杏园宴集", "C. 曲江题诗", "D. 金榜题名"], "answer": "A", "explain": "进士题名之风始于唐代，称\"雁塔题名\"——新科进士在长安慈恩寺大雁塔壁题写姓名。", "source": "进士题名之风始于唐代，称\"雁塔题名\"——新科进士在长安慈恩寺大雁塔壁题写姓名"}, {"section": "孔庙、国子监", "type": "single", "q": "北京孔庙\"十三经\"刻石（乾隆石经）的经文碑数量为（　）。", "options": ["A. 189座", "B. 190座", "C. 198座", "D. 206座"], "answer": "A", "explain": "十三经刻石为189座石碑，加一通谕旨碑共190通；问\"十三经刻石数量\"标准答案为189座。", "source": "刻石数量：189座（通）石碑，加上一通\"摹刻石经告成恭进表文碑（谕旨碑）\"，共190通"}, {"section": "孔庙、国子监", "type": "single", "q": "相传明嘉靖年间代皇帝祭孔、行至孔庙古柏下被柏枝掀落乌纱帽，使此柏得名\"辨奸柏\"的奸相是（　）。", "options": ["A. 魏忠贤", "B. 严嵩", "C. 和珅", "D. 张居正"], "answer": "B", "explain": "相传明嘉靖年间奸相严嵩代嘉靖皇帝祭孔，行至树下被柏枝掀落乌纱帽；另有魏忠贤轿顶被掀翻的另说。", "source": "相传明嘉靖年间奸相严嵩代嘉靖皇帝祭孔，行至树下，被柏枝掀（触）落乌纱帽"}, {"section": "孔庙、国子监", "type": "single", "q": "北京孔庙大成殿内正中匾额\"道洽大同\"的题写者是（　）。", "options": ["A. 康熙皇帝", "B. 乾隆皇帝", "C. 宣统皇帝", "D. 黎元洪"], "answer": "D", "explain": "殿内正中\"道洽大同\"匾为民国大总统黎元洪题写；1916年教育总长范源濂将清代各帝御匾取下，改挂黎元洪手书匾。", "source": "正中\"道洽大同\"匾的题写者：黎元洪（民国大总统）"}, {"section": "孔庙、国子监", "type": "single", "q": "北京孔庙大成殿院中的古井\"砚水湖\"，因井水常溢至井口，原名是（　）。", "options": ["A. 满井", "B. 圣井", "C. 墨井", "D. 文井"], "answer": "A", "explain": "砚水湖实为大成殿院西侧的一眼古井，井水常溢至井口，水清浅而甘洌，故原名\"满井\"，清乾隆皇帝特赐名\"砚水湖\"。", "source": "井水常溢至井口，水清浅而甘洌，故原名\"满井\""}, {"section": "孔庙、国子监", "type": "single", "q": "北京国子监始建于（　）。", "options": ["A. 元至元二十四年（1287年）", "B. 元大德六年（1302年）", "C. 明永乐九年（1411年）", "D. 清乾隆四十八年（1783年）"], "answer": "A", "explain": "北京国子监始建于元代至元二十四年（1287年），元大德十年（1306年）建成，是中国唯一保存完整的古代最高学府校址。", "source": "北京国子监始建于元代至元二十四年（1287年），元大德十年（1306年）建成"}, {"section": "孔庙、国子监", "type": "single", "q": "国子监正门（位于中轴线最南端、皇帝等专用通道）的名称是（　）。", "options": ["A. 集贤门", "B. 太学门", "C. 持敬门", "D. 退省门"], "answer": "A", "explain": "国子监正门名为集贤门，位于中轴线最南端，面阔三间，是皇帝等专用通道，平时很少开启。", "source": "国子监正门的名称：集贤门（位于中轴线最南端，面阔三间，是皇帝等专用通道）"}, {"section": "孔庙、国子监", "type": "single", "q": "乾隆五十年（1785年）春，乾隆帝首次在辟雍举行\"临雍讲学\"典礼，\"圜桥观听\"的学生达（　）。", "options": ["A. 1988人", "B. 3088人", "C. 4400人", "D. 5000人"], "answer": "B", "explain": "乾隆五十年（1785年）春，乾隆帝为庆贺登基五十年首次在辟雍举行\"临雍讲学\"典礼，\"圜桥观听\"的学生达3088人。", "source": "乾隆五十年（1785年）春……首次在辟雍举行盛大\"临雍讲学\"典礼，\"圜桥观听\"的学生达3088人"}, {"section": "北京的城市概况", "type": "single", "q": "20世纪90年代在王府井东方广场工地地下约12米处发现的古人类遗迹，距今约（ ）。", "options": ["A. 70万—20万年", "B. 2.4万—2.5万年", "C. 1万年", "D. 3000余年"], "answer": "B", "explain": "王府井东方广场遗址距今约2.4万—2.5万年，属旧石器时代晚期，是世界上首次在国际大都市中心区发现的旧石器时代晚期露天遗址。", "source": "20世纪90年代（1996年，北京大学岳升阳发现）在王府井东方广场工地地下约12米处发现的古人类遗迹，距今约2.4万—2.5万年（通称“约2.5万年”），属旧石器时代晚期"}, {"section": "北京的城市概况", "type": "judge", "q": "“北京人”（周口店直立人）生活在距今约70万—20万年前，属考古学上的旧石器时代晚期。", "answer": "错", "explain": "“北京人”属旧石器时代早期（直立人阶段），不是晚期；旧石器时代晚期对应的是王府井东方广场遗址（距今约2.5万年）。", "source": "“北京人”（周口店直立人）生活在距今约70万—20万年前，属考古学上的旧石器时代早期（直立人阶段），遗址在今房山区周口店龙骨山。"}, {"section": "北京的城市概况", "type": "multi", "q": "下列关于明清北京城的说法，正确的有（ ）。", "options": ["A. 明嘉靖三十二年（1553年）增筑外城后形成“凸”字形平面", "B. 城池呈宫城—皇城—内城—外城四重环套", "C. 中轴线南起永定门、北至钟鼓楼，全长约7.8公里", "D. 北京中轴线于2024年7月27日列入《世界遗产名录》", "E. 元大都中轴线大街宽58米"], "answer": "ABCD", "explain": "元大都中轴线大街宽28米，E项错误；其余四项均与原文相符。", "source": "城池呈宫城—皇城—内城—外城四重环套……明嘉靖三十二年（1553年）增筑外城后形成“凸”字形平面……元大都中轴线大街宽28米。明清北京城中轴线南起永定门、北至钟鼓楼，全长约7.8公里……（2024年7月27日列入《世界遗产名录》）"}, {"section": "北京的城市概况", "type": "single", "q": "西周时期，位于今天房山区琉璃河镇董家林的城市名为（ ）。", "options": ["A. 蓟", "B. 燕", "C. 幽州", "D. 武阳"], "answer": "B", "explain": "西周时位于今天广安门一带的城市名为蓟；位于房山区琉璃河镇董家林的城市名为燕（北燕），即琉璃河西周燕都遗址，是北京现存最早的城址。", "source": "位于今天房山区琉璃河镇董家林的城市名为燕（北燕，召公奭封国的都城，即琉璃河西周燕都遗址，北京现存最早的城址）"}, {"section": "北京的城市概况", "type": "judge", "q": "东胡林人遗址发现于北京市门头沟区斋堂镇东胡林村西，属新石器时代早期。", "answer": "对", "explain": "原文：东胡林人生活在距今约1万年，属新石器时代早期（新旧石器时代过渡阶段），发现地点为门头沟区斋堂镇东胡林村西。", "source": "东胡林人生活在距今约1万年（约11500—9000年前），属新石器时代早期（新旧石器时代过渡阶段），发现地点为北京市门头沟区斋堂镇东胡林村西"}, {"section": "北京的城市概况", "type": "single", "q": "北京地区在辽代的名称是（ ）。", "options": ["A. 幽州", "B. 南京", "C. 中都", "D. 大都"], "answer": "B", "explain": "唐代称幽州；辽代称南京（南京幽都府，1012年改称析津府，又称燕京）；金代称中都；元代称大都。", "source": "北京地区的历代名称：唐代称幽州（范阳节度使驻地，蓟城）；辽代称南京（南京幽都府，开泰元年即1012年改称析津府，又称燕京，为辽之陪都）；金代称中都"}, {"section": "北京的城市概况", "type": "judge", "q": "战国时期燕国所建的陪都是燕下都——武阳城，营建于易水之旁，在今河北易县。", "answer": "对", "explain": "原文明确：战国时期燕国所建的陪都是燕下都——武阳城（燕昭王时营建于易水之旁，在今河北易县），与上都蓟城相对。", "source": "战国时期燕国所建的陪都是燕下都——武阳城（燕昭王时营建于易水之旁，在今河北易县），与上都蓟城相对。"}, {"section": "北京的城市概况", "type": "multi", "q": "下列属于明清时期北京外城城门的有（ ）。", "options": ["A. 永定门", "B. 左安门", "C. 朝阳门", "D. 广渠门", "E. 东便门"], "answer": "ABDE", "explain": "明清北京外城城门共7座：永定门、左安门、右安门、广渠门、广安门、东便门、西便门；朝阳门是内城城门（“粮门”）。", "source": "明清时期北京外城城门共7座：永定门、左安门、右安门、广渠门、广安门（原广宁门）、东便门、西便门"}, {"section": "北京的城市概况", "type": "single", "q": "隋朝、唐朝先后多次出兵远征高句丽的皇帝是（ ）。", "options": ["A. 隋文帝与唐高祖", "B. 隋炀帝与唐太宗", "C. 隋炀帝与武则天", "D. 隋文帝与唐玄宗"], "answer": "B", "explain": "隋炀帝杨广三征高句丽，以涿郡即蓟城为前进基地；唐太宗李世民贞观十九年（645年）亲征。", "source": "隋朝、唐朝先后多次出兵远征高句丽的皇帝是隋炀帝杨广与唐太宗李世民（隋炀帝三征高句丽，以涿郡即蓟城为前进基地；唐太宗贞观十九年亲征）"}, {"section": "北京的城市概况", "type": "judge", "q": "公元645年，唐太宗为悼念东征高句丽阵亡将士，下诏在蓟城西建悯忠寺，即今北京法源寺。", "answer": "错", "explain": "悯忠寺建在蓟城（幽州城）东，不是城西；清代雍正十一年（1733年）敕修后改称法源寺。", "source": "公元645年，唐太宗东征高句丽还师幽州，为悼念阵亡将士、安抚忠烈亲属而下诏在蓟城（幽州城）东所建的寺庙名为悯忠寺"}, {"section": "北京的城市概况", "type": "single", "q": "悯忠寺前后历时51年，于武则天万岁通天元年落成并赐额，该年为（ ）。", "options": ["A. 645年", "B. 696年", "C. 1153年", "D. 1733年"], "answer": "B", "explain": "悯忠寺645年下诏始建，至武则天万岁通天元年（696年）落成并赐“悯忠”为额，前后历时51年；1733年（清雍正十一年）改称法源寺。", "source": "寺历经高宗、武后两朝续建，至武则天万岁通天元年（696年）落成并赐“悯忠”为额，前后历时51年，清代雍正十一年（1733年）敕修后改称法源寺"}, {"section": "北京的城市概况", "type": "judge", "q": "北京历史上第一次成为王朝的正式首都是在元代，1272年忽必烈定都大都。", "answer": "错", "explain": "北京第一次成为王朝正式首都是在金代——1153年海陵王完颜亮迁都燕京、改称中都；元代（1272年）是首次成为统一王朝的全国政治中心。", "source": "北京历史上第一次成为王朝的正式首都是在金代——金贞元元年（1153年）海陵王完颜亮迁都燕京、改称中都，是北京建都之始"}, {"section": "北京的城市概况", "type": "multi", "q": "下列关于北京地理概况的说法，正确的有（ ）。", "options": ["A. 北京位于华北平原西北端，距渤海约150公里", "B. 地势西北高、东南低，呈阶梯状下降", "C. 西部为燕山山脉，北部为太行山余脉", "D. 全市总面积16410.54平方公里", "E. 最高点东灵山海拔2303米"], "answer": "ABDE", "explain": "北京西部为太行山余脉西山，北部、东北部为燕山山脉军都山，C项方位颠倒；其余各项均与原文相符。", "source": "北京位于华北平原西北端……距渤海约150公里。地势特点：西北高、东南低……西部为太行山余脉西山，北部、东北部为燕山山脉军都山……全市总面积16410.54平方公里；最高点东灵山海拔2303米"}, {"section": "北京的城市概况", "type": "single", "q": "辽代“五京”中规模最大、人口最多的城市是（ ）。", "options": ["A. 上京临潢府", "B. 中京大定府", "C. 南京析津府", "D. 西京大同府"], "answer": "C", "explain": "辽代五京中，南京析津府（又称燕京，即今北京）规模最大、人口最多，城市人口约30万，城内划分为26坊。", "source": "其中规模最大、人口最多的城市是南京析津府（又称燕京，即今北京）……城市人口约30万，城内划分为26坊"}, {"section": "北京的城市概况", "type": "judge", "q": "在王府井东方广场工地发现的古人类遗迹属新石器时代早期，出土石制品、骨器、烧骨、炭灰坑等2000余件。", "answer": "错", "explain": "王府井东方广场遗址属旧石器时代晚期（距今约2.4万—2.5万年），不是新石器时代；新石器时代早期对应的是东胡林人遗址。", "source": "在王府井东方广场工地地下约12米处发现的古人类遗迹，距今约2.4万—2.5万年……属旧石器时代晚期，出土石制品、骨器、烧骨、炭灰坑等2000余件"}, {"section": "北京的城市概况", "type": "single", "q": "北京城区中遗存的辽代密檐式砖塔是（ ）。", "options": ["A. 天宁寺塔", "B. 妙应寺白塔", "C. 北海白塔", "D. 玉泉山塔"], "answer": "A", "explain": "天宁寺塔（原名天王寺舍利塔）位于今西城区广安门外天宁寺内，为八角十三层密檐式实心砖塔，建于辽天庆九年至十年（1119—1120年），是北京城区现存最古老的辽代密檐砖塔。", "source": "北京城区中遗存的辽代密檐式砖塔是天宁寺塔（原名天王寺舍利塔），位于今西城区广安门外天宁寺内，为八角十三层密檐式实心砖塔"}, {"section": "北京的城市概况", "type": "judge", "q": "元大都皇城城墙的别称是萧墙，俗称“红门阑马墙”，正门为棂星门，门前有千步廊。", "answer": "对", "explain": "原文明确：元大都皇城城墙的别称是萧墙，俗称“红门阑马墙”（周长约8.8公里，正门为棂星门，门前有千步廊）。", "source": "元大都皇城城墙的别称是萧墙，俗称“红门阑马墙”（周长约8.8公里，正门为棂星门，门前有千步廊）。"}, {"section": "北京的城市概况", "type": "multi", "q": "下列关于北京城市功能定位及城市规划的说法，正确的有（ ）。", "options": ["A. “四个中心”指全国政治中心、文化中心、国际交往中心、科技创新中心", "B. 发展目标是建设国际一流的和谐宜居之都", "C. 北京市下辖16个市辖区", "D. 老城区道路呈环形加放射式格局，外围为棋盘式格局", "E. 北京城市副中心位于通州，规划范围约155平方公里"], "answer": "ABCE", "explain": "老城区（二环以内）道路呈棋盘式格局，外围地区为环形加放射式格局，D项恰好说反。", "source": "城市战略定位为“四个中心”……发展目标是建设国际一流的和谐宜居之都……北京市下辖16个市辖区……老城区（二环以内）道路呈棋盘式（方格网）格局……外围地区为环形加放射式格局……规划范围约155平方公里"}, {"section": "北京的城市概况", "type": "single", "q": "营建元大都时所遵循的原则出自（ ）。", "options": ["A. 《营造法式》", "B. 《周礼·考工记》", "C. 《梦溪笔谈》", "D. 《天工开物》"], "answer": "B", "explain": "元大都营建遵循《周礼·考工记》记载的王城营国制度，由太保刘秉忠主持规划，并结合太液池水系灵活布局。", "source": "营建元大都所遵循的原则是《周礼·考工记》记载的王城营国制度……由太保刘秉忠主持规划"}, {"section": "北京的城市概况", "type": "judge", "q": "金中都修建时模仿的城市是南宋都城临安，宫殿规制仿临安皇宫，部分构件由临安掠运而来。", "answer": "错", "explain": "金中都模仿的是北宋都城东京汴梁（今河南开封），宫殿规制仿汴京皇宫，部分构件、陈设由汴京掠运而来，不是南宋临安。", "source": "金中都修建时模仿的城市是北宋都城东京汴梁（今河南开封），宫殿规制仿汴京皇宫，部分构件、陈设由汴京掠运而来。"}, {"section": "北京的城市概况", "type": "single", "q": "元代在太液池西岸营建的宫殿中，位于今北海西岸一带的是（ ）。", "options": ["A. 隆福宫", "B. 兴圣宫", "C. 大安殿", "D. 广寒殿"], "answer": "B", "explain": "太液池西岸南部为隆福宫（太子居所），北部为兴圣宫（皇太后居所）；位于今北海西岸一带的是兴圣宫。", "source": "南部为隆福宫（太子居所），北部为兴圣宫（皇太后居所）……其中位于今北海西岸一带的是兴圣宫"}, {"section": "北京的城市概况", "type": "judge", "q": "清朝八旗在北京内城的分布为：正黄旗驻安定门内，镶黄旗驻德胜门内。", "answer": "错", "explain": "应为镶黄旗驻安定门内、正黄旗驻德胜门内，题干将两旗门位对调了。", "source": "清朝八旗在北京内城的分布：镶黄旗驻安定门内，正黄旗驻德胜门内……（正阳门由八旗轮值）。"}, {"section": "北京的城市概况", "type": "multi", "q": "下列关于元大都营建的说法，正确的有（ ）。", "options": ["A. 遵循《周礼·考工记》记载的王城营国制度", "B. 由太保刘秉忠主持规划", "C. 太液池东岸为大内宫城，太庙在东、社稷坛在西", "D. 积水潭一带为商市", "E. 皇城城墙俗称“黄门阑马墙”"], "answer": "ABCD", "explain": "元大都皇城城墙俗称“红门阑马墙”而非“黄门阑马墙”，E项错误；其余各项均与原文相符。", "source": "由太保刘秉忠主持规划，并结合太液池水系灵活布局（东岸为大内宫城，太庙在东、社稷坛在西，积水潭一带为商市）。元大都皇城城墙的别称是萧墙，俗称“红门阑马墙”"}, {"section": "北京的城市概况", "type": "single", "q": "将都城从上京会宁府迁至燕京的金代皇帝是（ ）。", "options": ["A. 金太祖阿骨打", "B. 金世宗", "C. 海陵王完颜亮", "D. 金章宗"], "answer": "C", "explain": "海陵王完颜亮1151年下令扩建、1153年正式迁都燕京，改称中都，并毁上京宫殿宅第以绝退路。", "source": "将都城从上京会宁府（今黑龙江阿城）迁至燕京的金代皇帝是海陵王完颜亮（1151年下令扩建、1153年正式迁都，并毁上京宫殿宅第以绝退路）"}, {"section": "北京的城市概况", "type": "judge", "q": "“北京建都纪念阙”于2003年9月20日落成揭幕，阙身高12米，基座镌刻侯仁之先生撰写的《北京建都记》。", "answer": "对", "explain": "原文：纪念阙为纪念北京建都850周年（1153年金中都建立）而建，2003年9月20日落成揭幕，阙身高12米，基座镌刻侯仁之《北京建都记》。", "source": "于2003年9月20日正式落成揭幕……阙身高12米……基座镌刻侯仁之先生撰写的《北京建都记》，正前方地面上雕刻金中都大安殿遗址布局图。"}, {"section": "北京的城市概况", "type": "single", "q": "东胡林人生活在距今约（ ）。", "options": ["A. 70万—20万年前", "B. 2.4万—2.5万年前", "C. 1万年前", "D. 3000余年前"], "answer": "C", "explain": "东胡林人生活在距今约1万年（约11500—9000年前），属新石器时代早期；70万—20万年为“北京人”，2.4万—2.5万年为王府井遗址。", "source": "东胡林人生活在距今约1万年（约11500—9000年前），属新石器时代早期（新旧石器时代过渡阶段）"}, {"section": "北京的城市概况", "type": "multi", "q": "下列清朝八旗在北京内城的分布，正确的有（ ）。", "options": ["A. 镶黄旗驻安定门内", "B. 正黄旗驻德胜门内", "C. 正白旗驻东直门内", "D. 正蓝旗驻崇文门内", "E. 正红旗驻朝阳门内"], "answer": "ABCD", "explain": "正红旗驻西直门内而非朝阳门内（朝阳门内为镶白旗），E项错误；其余各组均与原文相符。", "source": "镶黄旗驻安定门内，正黄旗驻德胜门内，正白旗驻东直门内，镶白旗驻朝阳门内，正红旗驻西直门内……正蓝旗驻崇文门内，镶蓝旗驻宣武门内"}, {"section": "北京的城市概况", "type": "single", "q": "“北京人”（周口店直立人）在考古学上所处的时代是（ ）。", "options": ["A. 旧石器时代早期", "B. 旧石器时代晚期", "C. 新石器时代早期", "D. 新石器时代晚期"], "answer": "A", "explain": "“北京人”生活在距今约70万—20万年前，属旧石器时代早期（直立人阶段），遗址在今房山区周口店龙骨山。", "source": "“北京人”（周口店直立人）生活在距今约70万—20万年前，属考古学上的旧石器时代早期（直立人阶段），遗址在今房山区周口店龙骨山。"}, {"section": "北京的城市概况", "type": "single", "q": "北京作为城市出现，距今已有（ ）。", "options": ["A. 800余年", "B. 2000余年", "C. 3000余年", "D. 5000余年"], "answer": "C", "explain": "北京作为城市出现距今已有3000余年，以公元前1045年周武王灭商分封蓟、燕为建城之始计；“800多年”是建都史。", "source": "北京作为城市出现，距今已有3000余年（以公元前1045年周武王灭商分封蓟、燕为建城之始计）"}, {"section": "北京的城市概况", "type": "multi", "q": "下列属于北京五大水系的有（ ）。", "options": ["A. 大清河水系", "B. 永定河水系", "C. 北运河水系", "D. 潮白河水系", "E. 黄河水系"], "answer": "ABCD", "explain": "北京自西向东分布五大水系：大清河、永定河、北运河、潮白河、蓟运河水系，均属海河流域；黄河水系与北京无关。", "source": "北京属海河流域，自西向东分布五大水系——大清河水系（拒马河等）、永定河水系、北运河水系……潮白河水系……蓟运河水系（泃河等）。"}, {"section": "北京的城市概况", "type": "single", "q": "西周时期，位于今天广安门一带的城市名为（ ）。", "options": ["A. 燕", "B. 蓟", "C. 武阳", "D. 析津"], "answer": "B", "explain": "西周时位于今天广安门一带的城市名为蓟（蓟城，为北京城区之始）；位于房山区琉璃河镇董家林的城市名为燕。", "source": "西周时期，位于今天广安门一带的城市名为蓟（蓟城，武王封黄帝或尧之后裔于蓟，为北京城区之始）"}, {"section": "北京的城市概况", "type": "single", "q": "战国时期燕国所建陪都燕下都——武阳城，位于今（ ）。", "options": ["A. 北京市房山区", "B. 河北易县", "C. 河南开封", "D. 黑龙江阿城"], "answer": "B", "explain": "燕下都武阳城为燕昭王时营建于易水之旁，在今河北易县，与上都蓟城相对；注意其不在北京市域内。", "source": "战国时期燕国所建的陪都是燕下都——武阳城（燕昭王时营建于易水之旁，在今河北易县），与上都蓟城相对。"}, {"section": "北京的城市概况", "type": "multi", "q": "下列关于北京城市副中心的说法，正确的有（ ）。", "options": ["A. 位于通州，规划范围约155平方公里", "B. 与河北雄安新区并称北京“新两翼”", "C. 以行政办公、商务服务、文化旅游为主导功能", "D. 空间结构为“一带、一轴、多组团”", "E. 建设目的是扩大中心城区人口规模、强化首都核心功能"], "answer": "ABCD", "explain": "建设副中心是为了有序承接中心城区功能和人口疏解、示范带动非首都功能疏解，而非扩大中心城区人口，E项错误。", "source": "规划范围约155平方公里；建设目的是有序承接中心城区功能和人口疏解、示范带动非首都功能疏解……以行政办公、商务服务、文化旅游为主导功能……空间结构为“一带、一轴、多组团”"}, {"section": "北京的城市概况", "type": "single", "q": "北京地区在元代的名称是（ ）。", "options": ["A. 幽州", "B. 南京", "C. 中都", "D. 大都"], "answer": "D", "explain": "北京地区唐代称幽州、辽代称南京（析津府）、金代称中都、元代称大都（突厥语称“汗八里”）。", "source": "金代称中都（中都大兴府）；元代称大都（突厥语称“汗八里”）。"}, {"section": "北京的城市概况", "type": "single", "q": "北京城区遗存的辽代天宁寺塔，由（ ）奉旨主持建造。", "options": ["A. 秦晋国王耶律淳", "B. 海陵王完颜亮", "C. 太保刘秉忠", "D. 也黑迭儿"], "answer": "A", "explain": "天宁寺塔建于辽天祚帝天庆九年至十年（1119—1120年），由秦晋国王耶律淳奉旨主持建造；刘秉忠、也黑迭儿是元大都营建人物。", "source": "建于辽天祚帝天庆九年至十年（1119—1120年），由秦晋国王耶律淳奉旨主持建造，是北京城区现存最古老、最精美的辽代密檐砖塔"}, {"section": "北京的城市概况", "type": "single", "q": "元大都于元世祖至元四年正式动工兴建，该年为（ ）。", "options": ["A. 1264年", "B. 1267年", "C. 1271年", "D. 1272年"], "answer": "B", "explain": "元世祖至元四年（1267年）正月正式动工兴建新都城；1264年改燕京为中都，1271年定国号“大元”，1272年改中都为大都。", "source": "元世祖至元四年（1267年）正月正式动工兴建新都城（此前至元元年即1264年已改燕京为中都）……至元九年（1272年）改中都为大都。"}, {"section": "北京的城市概况", "type": "single", "q": "明清北京内城城门中的“粮门”是（ ）。", "options": ["A. 崇文门", "B. 朝阳门", "C. 西直门", "D. 阜成门"], "answer": "B", "explain": "“粮门”是朝阳门（原齐化门，漕粮经此入城）；“税门”是崇文门（原文明门，设税关）。", "source": "北京内城城门中的“粮门”是朝阳门（原齐化门，漕粮经此入城）；“税门”是崇文门（原文明门，设税关，为京城商贩主要通道）。"}, {"section": "北京的城市概况", "type": "single", "q": "华北地区最大的水库是（ ）。", "options": ["A. 官厅水库", "B. 密云水库", "C. 怀柔水库", "D. 十三陵水库"], "answer": "B", "explain": "密云水库是华北地区最大水库，最大库容43.75亿立方米，相当于67个十三陵水库或150个昆明湖。", "source": "密云水库（华北地区最大水库，最大库容43.75亿立方米，相当于67个十三陵水库或150个昆明湖）"}, {"section": "北京地区的世界文化遗产及人类非物质文化遗产代表作", "type": "single", "q": "北京地区的世界文化遗产中，列入时间最晚的是（ ）。", "options": ["A. 明十三陵", "B. 大运河（北京段）", "C. 北京中轴线", "D. 天坛"], "answer": "C", "explain": "北京中轴线于2024年7月27日列入；大运河（北京段）2014年列入；明十三陵2003年列入；天坛1998年列入。", "source": "（8）北京中轴线——中国理想都城秩序的杰作：2024年7月27日列入。"}, {"section": "北京地区的世界文化遗产及人类非物质文化遗产代表作", "type": "judge", "q": "截至2026年6月，北京地区共有8处世界文化遗产，是世界上拥有世界文化遗产数量最多的城市。", "answer": "对", "explain": "原文明确：截至2026年6月，北京地区共有8处世界文化遗产，是世界上拥有世界文化遗产数量最多的城市。", "source": "截至2026年6月，北京地区共有8处世界文化遗产，是世界上拥有世界文化遗产数量最多的城市。"}, {"section": "北京地区的世界文化遗产及人类非物质文化遗产代表作", "type": "multi", "q": "下列北京地区的世界文化遗产中，于1987年12月列入《世界遗产名录》的有（ ）。", "options": ["A. 长城（北京段）", "B. 北京故宫（明清皇宫）", "C. 周口店北京人遗址", "D. 颐和园", "E. 天坛"], "answer": "ABC", "explain": "1987年12月列入的为长城（北京段）、北京故宫、周口店北京人遗址三项；颐和园和天坛均为1998年列入。", "source": "（1）长城（北京段）：1987年12月列入。（2）北京故宫（明清皇宫）：1987年12月列入。（3）周口店北京人遗址：1987年12月列入。"}, {"section": "北京地区的世界文化遗产及人类非物质文化遗产代表作", "type": "single", "q": "早期京剧主要由安徽的徽剧与（ ）的汉剧两个地方的戏剧品种在北京融合而成。", "options": ["A. 湖南", "B. 湖北", "C. 河南", "D. 江苏"], "answer": "B", "explain": "京剧主要由安徽的徽剧（徽调、二黄腔）与湖北的汉剧（汉调／楚调、西皮腔）融合而成，故早期又称“皮黄戏”。", "source": "京剧主要由安徽的徽剧（徽调、二黄腔）与湖北的汉剧（汉调／楚调、西皮腔）两个地方的戏剧品种在北京融合而成"}, {"section": "北京地区的世界文化遗产及人类非物质文化遗产代表作", "type": "judge", "q": "颐和园与天坛均于1998年列入《世界遗产名录》。", "answer": "对", "explain": "颐和园1998年列入，天坛1998年列入；长城、北京故宫、周口店北京人遗址均为1987年12月列入。", "source": "（4）颐和园：1998年列入。（5）天坛：1998年列入。"}, {"section": "北京地区的世界文化遗产及人类非物质文化遗产代表作", "type": "single", "q": "光绪年间号称“伶界大王”、1905年主演中国第一部电影《定军山》的京剧演员是（ ）。", "options": ["A. 程长庚", "B. 谭鑫培", "C. 余叔岩", "D. 梅兰芳"], "answer": "B", "explain": "谭鑫培（1847—1917），老生行当，创立“谭派”，光绪年间号称“伶界大王”，1905年主演中国第一部电影《定军山》。", "source": "光绪年间号称“伶界大王”的演员：谭鑫培（1847—1917），老生行当，创立“谭派”……1905年主演中国第一部电影《定军山》"}, {"section": "北京地区的世界文化遗产及人类非物质文化遗产代表作", "type": "judge", "q": "“四大徽班”中最早进京的是四喜班，清乾隆五十五年（1790年）由高朗亭率班自扬州进京献艺。", "answer": "错", "explain": "最早进京的是三庆班，不是四喜班；1790年安徽安庆籍名伶高朗亭率三庆班自扬州进京，史称“徽班进京”。", "source": "其中最早进京的是三庆班——清乾隆五十五年（1790年），为祝贺乾隆皇帝八旬寿辰，由安徽安庆籍名伶高朗亭（时年16岁）率三庆班自扬州进京献艺"}, {"section": "北京地区的世界文化遗产及人类非物质文化遗产代表作", "type": "multi", "q": "下列属于京剧“后四大须生”的有（ ）。", "options": ["A. 马连良", "B. 谭富英", "C. 杨宝森", "D. 奚啸伯", "E. 言菊朋"], "answer": "ABCD", "explain": "“后四大须生”为马连良、谭富英、杨宝森、奚啸伯；言菊朋属“前四大须生”（余叔岩、言菊朋、高庆奎、马连良）。", "source": "“后四大须生”：马连良、谭富英、杨宝森、奚啸伯……“前四大须生”：余叔岩、言菊朋、高庆奎、马连良"}, {"section": "北京地区的世界文化遗产及人类非物质文化遗产代表作", "type": "single", "q": "被誉为“京剧鼻祖”“徽班领袖”的“前三杰”演员是（ ）。", "options": ["A. 程长庚", "B. 余三胜", "C. 张二奎", "D. 汪桂芬"], "answer": "A", "explain": "“前三杰”为程长庚（徽派，被誉为“京剧鼻祖”“徽班领袖”）、余三胜（汉派）、张二奎（京派）；汪桂芬属“后三杰”。", "source": "“前三杰”（前三鼎甲／老生三杰）：程长庚（徽派，被誉为“京剧鼻祖”“徽班领袖”）、余三胜（汉派）、张二奎（京派）"}, {"section": "北京地区的世界文化遗产及人类非物质文化遗产代表作", "type": "judge", "q": "京剧脸谱中，白脸象征忠贞英勇，红脸象征奸诈阴险。", "answer": "错", "explain": "应为红脸象征忠贞、英勇、赤胆忠心；白脸象征奸诈阴险、多疑狠毒，题干把红白两色的寓意颠倒了。", "source": "红脸：象征忠贞、英勇、赤胆忠心，为正面人物……白脸（水白脸／粉白脸）：象征奸诈阴险、多疑狠毒、居心叵测，多用于权奸"}, {"section": "北京地区的世界文化遗产及人类非物质文化遗产代表作", "type": "single", "q": "京剧“四大名旦”中，唱腔幽咽婉转、善用“脑后音”、长于悲剧的是（ ）。", "options": ["A. 梅兰芳", "B. 程砚秋", "C. 尚小云", "D. 荀慧生"], "answer": "B", "explain": "程砚秋（程派）唱腔幽咽婉转、若断若续、绵里藏针，善用“脑后音”，长于悲剧；可用“梅贵、程悲、尚刚、荀俏”记忆。", "source": "程砚秋（程派）唱腔幽咽婉转、若断若续、低回曲折、绵里藏针，善用“脑后音”，讲究声断气不断、以腔就字，长于悲剧。"}, {"section": "北京地区的世界文化遗产及人类非物质文化遗产代表作", "type": "judge", "q": "大运河（北京段）于2014年6月22日列入《世界遗产名录》。", "answer": "对", "explain": "原文明确：大运河（北京段）于2014年6月22日列入《世界遗产名录》，是北京第7处世界文化遗产。", "source": "（7）大运河（北京段）：2014年6月22日列入。"}, {"section": "北京地区的世界文化遗产及人类非物质文化遗产代表作", "type": "multi", "q": "二十四节气所体现的中国古代哲学思想包括（ ）。", "options": ["A. “天人合一”的宇宙观", "B. 顺天应时、顺应自然规律的实践观", "C. 阴阳消长、阴阳平衡的辩证思想", "D. 五行相生相克、四时配属的系统观", "E. “致中和”、中庸和谐的价值取向"], "answer": "ABCDE", "explain": "原文列举六个方面，除五项外还有“人与自然和谐相处、尊重生命的可持续发展智慧”，本题五个选项均为原文所列思想。", "source": "二十四节气体现：1.“天人合一”的宇宙观（核心）……2.顺天应时、顺应自然规律的实践观……3.阴阳消长、阴阳平衡的辩证思想……4.五行相生相克、四时配属的系统观……5.“致中和”、中庸和谐的价值取向"}, {"section": "北京地区的世界文化遗产及人类非物质文化遗产代表作", "type": "single", "q": "京剧中“西皮”腔最初源于（ ）。", "options": ["A. 西北地区的秦腔", "B. 湖北的黄陂、黄冈", "C. 安徽的徽调", "D. 北京的京腔"], "answer": "A", "explain": "西皮腔最初源于西北地区（陕西、甘肃一带）的秦腔（梆子腔）；二黄腔最通行的说法为发源于湖北的黄陂、黄冈二县。", "source": "西皮腔：最初源于西北地区（陕西、甘肃一带）的秦腔（梆子腔）……二黄腔：最通行的说法为发源于湖北的黄陂、黄冈二县"}, {"section": "北京地区的世界文化遗产及人类非物质文化遗产代表作", "type": "judge", "q": "京剧于2010年11月16日列入《世界非物质文化遗产名录》，与中医针灸同属一届常会。", "answer": "对", "explain": "京剧与中医针灸均于2010年11月16日在第五届常会（肯尼亚内罗毕）列入。", "source": "（6）京剧——2010年11月16日。第五届常会（肯尼亚内罗毕）。（7）中医针灸——2010年11月16日。第五届常会（内罗毕）。"}, {"section": "北京地区的世界文化遗产及人类非物质文化遗产代表作", "type": "single", "q": "北京皮影戏在老北京的俗称是（ ）。", "options": ["A. 羊皮影", "B. 驴皮影", "C. 牛皮影", "D. 纸影"], "answer": "B", "explain": "北京皮影戏老北京俗称“驴皮影”，声腔主要吸收北方昆曲、京剧（皮黄）以及北京地方曲艺的声腔、曲调。", "source": "北京皮影戏（老北京俗称“驴皮影”）的声腔，主要吸收了北方昆曲、京剧（皮黄）以及北京地方曲艺……的声腔、曲调"}, {"section": "北京地区的世界文化遗产及人类非物质文化遗产代表作", "type": "judge", "q": "京剧脸谱中，红脸象征忠贞英勇，典型人物为曹操、姜维。", "answer": "错", "explain": "红脸典型人物为关羽、姜维、关胜；曹操是白脸（奸诈阴险）的典型，题干把曹操错配为红脸。", "source": "红脸：象征忠贞、英勇、赤胆忠心，为正面人物。典型：关羽、姜维、关胜。白脸……象征奸诈阴险……多用于权奸。"}, {"section": "北京地区的世界文化遗产及人类非物质文化遗产代表作", "type": "multi", "q": "“四大徽班”包括（ ）。", "options": ["A. 三庆班", "B. 四喜班", "C. 春台班", "D. 和春班", "E. 长春班"], "answer": "ABCD", "explain": "四大徽班为三庆、四喜、春台、和春，其中最早进京的是三庆班；“长春班”不在其列。", "source": "四大徽班为三庆、四喜、春台、和春。其中最早进京的是三庆班"}, {"section": "北京地区的世界文化遗产及人类非物质文化遗产代表作", "type": "single", "q": "中国篆刻、中国书法、端午节被列入《世界非物质文化遗产名录》的时间是（ ）。", "options": ["A. 2001年", "B. 2003年", "C. 2009年", "D. 2010年"], "answer": "C", "explain": "中国篆刻、中国书法、端午节均于2009年9月第四届常会（阿联酋阿布扎比）列入；2001年为昆曲，2003年为古琴艺术，2010年为京剧、中医针灸。", "source": "（3）中国篆刻——2009年9月。（4）中国书法——2009年9月。（5）端午节——2009年9月。第四届常会（阿布扎比）"}, {"section": "北京地区的世界文化遗产及人类非物质文化遗产代表作", "type": "judge", "q": "梅兰芳（梅派）唱腔幽咽婉转、善用“脑后音”，长于悲剧。", "answer": "错", "explain": "“幽咽婉转、善用脑后音、长于悲剧”是程砚秋（程派）的特点；梅派唱腔雍容华贵、典雅大方，讲究“中和之美”。", "source": "梅兰芳（梅派）嗓音圆润明亮，唱腔雍容华贵、典雅大方、中正平和，讲究“中和之美”；程砚秋（程派）唱腔幽咽婉转……善用“脑后音”……长于悲剧。"}, {"section": "北京地区的世界文化遗产及人类非物质文化遗产代表作", "type": "single", "q": "太极拳被列入《世界非物质文化遗产名录》的时间是（ ）。", "options": ["A. 2010年11月", "B. 2013年12月", "C. 2020年12月", "D. 2024年12月"], "answer": "C", "explain": "太极拳于2020年12月17日第十五届常会（因疫情线上召开）列入；2013年为中国珠算，2024年为春节。", "source": "（10）太极拳——2020年12月17日。第十五届常会（因疫情线上召开）。"}, {"section": "北京地区的世界文化遗产及人类非物质文化遗产代表作", "type": "multi", "q": "北京皮影戏的声腔主要吸收了（ ）的声腔、曲调。", "options": ["A. 北方昆曲", "B. 京剧（皮黄）", "C. 北京地方曲艺（京韵大鼓、单弦等）", "D. 越剧", "E. 黄梅戏"], "answer": "ABC", "explain": "北京皮影戏声腔主要吸收北方昆曲、京剧（皮黄）及北京地方曲艺（京韵大鼓、单弦、西河大鼓等鼓曲），早期还受陕西“碗碗腔”、河北“老虎调”影响；与越剧、黄梅戏无关。", "source": "主要吸收了北方昆曲、京剧（皮黄）以及北京地方曲艺（如京韵大鼓、单弦、西河大鼓等鼓曲）的声腔、曲调……形成“影调”多种腔调与板式的变化运用"}, {"section": "北京地区的世界文化遗产及人类非物质文化遗产代表作", "type": "single", "q": "下列北京地区的世界文化遗产中，于2003年7月列入的是（ ）。", "options": ["A. 颐和园", "B. 天坛", "C. 明十三陵", "D. 大运河（北京段）"], "answer": "C", "explain": "明十三陵2003年7月列入；颐和园、天坛为1998年，大运河（北京段）为2014年6月22日。", "source": "（6）明十三陵：2003年7月列入。"}, {"section": "北京地区的世界文化遗产及人类非物质文化遗产代表作", "type": "single", "q": "清乾隆五十五年（1790年），率三庆班自扬州进京献艺、开启“徽班进京”历史的名伶是（ ）。", "options": ["A. 程长庚", "B. 高朗亭", "C. 谭鑫培", "D. 余三胜"], "answer": "B", "explain": "1790年为祝贺乾隆皇帝八旬寿辰，安徽安庆籍名伶高朗亭（时年16岁）率三庆班自扬州进京献艺。", "source": "清乾隆五十五年（1790年），为祝贺乾隆皇帝八旬寿辰，由安徽安庆籍名伶高朗亭（时年16岁）率三庆班自扬州进京献艺，史称“徽班进京”。"}, {"section": "北京地区的世界文化遗产及人类非物质文化遗产代表作", "type": "multi", "q": "下列属于京剧旦行的有（ ）。", "options": ["A. 青衣", "B. 花旦", "C. 花衫", "D. 老旦", "E. 红生"], "answer": "ABCD", "explain": "旦行扮演女性角色，包括青衣（正旦）、花旦、花衫、武旦/刀马旦、老旦、彩旦等；红生属生行（勾红脸的老生，专演关羽、赵匡胤等）。", "source": "旦行：扮演女性角色。①青衣（正旦）……②花旦……③花衫……④武旦／刀马旦……⑤老旦……⑥彩旦（丑旦）"}, {"section": "北京地区的世界文化遗产及人类非物质文化遗产代表作", "type": "single", "q": "下列京剧演员中，不属于“后三杰”（老生新三杰）的是（ ）。", "options": ["A. 谭鑫培", "B. 汪桂芬", "C. 孙菊仙", "D. 程长庚"], "answer": "D", "explain": "“后三杰”为谭鑫培、汪桂芬、孙菊仙；程长庚属“前三杰”（程长庚、余三胜、张二奎）。", "source": "与之对应的是“后三杰”（后三鼎甲／老生新三杰）：谭鑫培、汪桂芬、孙菊仙。"}, {"section": "北京地区的世界文化遗产及人类非物质文化遗产代表作", "type": "single", "q": "京剧“四大名旦”中，唱腔刚劲挺拔、高亢激越，有“文戏武唱”之称的是（ ）。", "options": ["A. 梅兰芳", "B. 程砚秋", "C. 尚小云", "D. 荀慧生"], "answer": "C", "explain": "尚小云（尚派）唱腔刚劲挺拔、高亢激越、峭拔有力，有“文戏武唱”之称，兼擅刀马旦；可用“梅贵、程悲、尚刚、荀俏”记忆。", "source": "尚小云（尚派）唱腔刚劲挺拔、高亢激越、峭拔有力，有“文戏武唱”之称，兼擅刀马旦。"}, {"section": "北京地区的世界文化遗产及人类非物质文化遗产代表作", "type": "single", "q": "京剧“四大名旦”中，唱腔俏丽轻盈、委婉流利，善用方言小腔，长于花旦、闺门旦的是（ ）。", "options": ["A. 梅兰芳", "B. 程砚秋", "C. 尚小云", "D. 荀慧生"], "answer": "D", "explain": "荀慧生（荀派）唱腔俏丽轻盈、柔媚婉转、委婉流利，生活化、善用方言小腔，长于花旦、闺门旦，表演细腻活泼。", "source": "荀慧生（荀派）唱腔俏丽轻盈、柔媚婉转、委婉流利，生活化、善用方言小腔，长于花旦、闺门旦，表演细腻活泼。"}, {"section": "北京地区的世界文化遗产及人类非物质文化遗产代表作", "type": "single", "q": "京剧脸谱中，象征神佛仙怪、妖魔鬼怪，用于虚幻、非人间形象的是（ ）。", "options": ["A. 红脸", "B. 黑脸", "C. 白脸", "D. 金脸、银脸"], "answer": "D", "explain": "金脸、银脸象征神佛仙怪、妖魔鬼怪，用于虚幻、非人间的形象，即口诀“金神”之意。", "source": "金脸、银脸：象征神佛仙怪、妖魔鬼怪，用于虚幻、非人间的形象。"}, {"section": "北京地区的世界文化遗产及人类非物质文化遗产代表作", "type": "single", "q": "京剧行当中，又称“花脸”、扮演性格品质或相貌特异的男性、面部勾画脸谱的是（ ）。", "options": ["A. 生行", "B. 旦行", "C. 净行", "D. 丑行"], "answer": "C", "explain": "净行又称“花脸”，扮演性格、品质或相貌特异的男性，面部勾画脸谱，嗓音洪亮宽阔，如包拯、曹操、张飞等。", "source": "净行：又称“花脸”，扮演性格、品质或相貌特异的男性，面部勾画脸谱，嗓音洪亮宽阔。"}, {"section": "北京地区的世界文化遗产及人类非物质文化遗产代表作", "type": "single", "q": "古琴艺术被列入“人类口头和非物质遗产代表作”的时间是（ ）。", "options": ["A. 2001年5月", "B. 2003年11月", "C. 2009年9月", "D. 2010年11月"], "answer": "B", "explain": "古琴艺术于2003年11月7日列入第二批“人类口头和非物质遗产代表作”；2001年为昆曲，2009年为篆刻、书法、端午节，2010年为京剧、中医针灸。", "source": "（2）古琴艺术——2003年11月7日。教科文组织宣布第二批“人类口头和非物质遗产代表作”（共28项）。"}, {"section": "北京地区的世界文化遗产及人类非物质文化遗产代表作", "type": "single", "q": "“春节——中国人庆祝传统新年的社会实践”被列入《世界非物质文化遗产名录》的时间是（ ）。", "options": ["A. 2020年12月", "B. 2022年11月", "C. 2023年12月", "D. 2024年12月"], "answer": "D", "explain": "春节于2024年12月4日第十九届常会（巴拉圭亚松森）列入；2020年为太极拳，2022年为中国传统制茶技艺及其相关习俗。", "source": "（12）春节——中国人庆祝传统新年的社会实践——2024年12月4日。第十九届常会（巴拉圭亚松森）。"}, {"section": "北京地区的主要博物馆", "type": "single", "q": "中国国家博物馆现有藏品数量为（ ）。", "options": ["A. 81.5万件", "B. 100万余件", "C. 143万余件", "D. 180万余件"], "answer": "C", "explain": "国博官网现行口径为藏品143万余件，涵盖古代文物、近现当代文物、艺术品等多种门类；建筑面积近20万平方米，拥有48个标准展厅。", "source": "现有藏品数量：143万余件，涵盖古代文物、近现当代文物、艺术品等多种门类。"}, {"section": "北京地区的主要博物馆", "type": "judge", "q": "国际博物馆日为每年的5月18日，由国际博物馆协会（ICOM）于1977年正式确定并宣布。", "answer": "对", "explain": "原文明确：国际博物馆日为每年5月18日，由国际博物馆协会（ICOM）于1977年正式确定并宣布，自1978年起每年组织庆祝活动。", "source": "时间：每年的5月18日。设立：由国际博物馆协会（ICOM）于1977年正式确定并宣布……自1978年起，国际博物馆协会每年组织庆祝活动"}, {"section": "北京地区的主要博物馆", "type": "multi", "q": "下列属于2024年第五批全国博物馆定级评估中北京新增国家一级博物馆的有（ ）。", "options": ["A. 中国华侨历史博物馆", "B. 中国海关博物馆", "C. 中国铁道博物馆", "D. 香山革命纪念馆", "E. 首都博物馆"], "answer": "ABCD", "explain": "第五批新增10家包括中国华侨历史博物馆、中国妇女儿童博物馆、中国海关博物馆、宋庆龄故居、民族文化宫、民航博物馆、中国现代文学馆、中国铁道博物馆、中国园林博物馆、香山革命纪念馆；首都博物馆为原有18家之一。", "source": "第五批新增的10家：中国华侨历史博物馆、中国妇女儿童博物馆、中国海关博物馆、中华人民共和国名誉主席宋庆龄同志故居、民族文化宫、民航博物馆、中国现代文学馆、中国铁道博物馆、中国园林博物馆、香山革命纪念馆"}, {"section": "北京地区的主要博物馆", "type": "single", "q": "首都博物馆“北京通史陈列”展出文物数量为（ ）。", "options": ["A. 759件", "B. 1100余件（套）", "C. 1500件（套）", "D. 1793件（套）"], "answer": "B", "explain": "《中华文明的有力见证——北京通史陈列》于2024年2月10日对外开放，展出文物1100余件（套），面积4900平方米。", "source": "“北京通史陈列”展出文物数量：1100余件（套）。基本陈列……于2024年2月10日（农历大年初一）对外开放，位于方形展厅二、三、四层，面积4900平方米"}, {"section": "北京地区的主要博物馆", "type": "judge", "q": "截至2025年底，北京地区共有18家国家一级博物馆，居全国各城市首位。", "answer": "错", "explain": "截至2025年底北京有28家一级博物馆（原有18家，2024年第五批新增10家），居全国各城市首位；18家为旧口径，须以28家为准。", "source": "数量：28家，居全国各城市首位……北京原有18家国家一级博物馆；2024年第五批全国博物馆定级评估中，北京新增10家……总数由18家增至28家"}, {"section": "北京地区的主要博物馆", "type": "single", "q": "中国海关博物馆现有藏品数量为（ ）。", "options": ["A. 近5万件（套）", "B. 32000余件", "C. 18万余件（套）", "D. 3万件（套）"], "answer": "B", "explain": "中国海关博物馆现有藏品32000余件，其中珍贵文物1500件（套），涵盖从战国时期至当代的海关重要文物；近5万件（套）为民族文化宫藏品数。", "source": "中国海关博物馆现有的藏品数量：32000余件，其中珍贵文物1500件（套），涵盖从战国时期至当代各个历史时期的海关重要文物"}, {"section": "北京地区的主要博物馆", "type": "judge", "q": "中国国家博物馆由中国革命博物馆和中国历史博物馆于2003年2月合并组建而成。", "answer": "对", "explain": "原文：新中国成立后，在天安门广场东侧新建中国革命博物馆和中国历史博物馆；2003年2月，两馆合并组建中国国家博物馆。", "source": "新中国成立后，在天安门广场东侧新建中国革命博物馆和中国历史博物馆；2003年2月，两馆合并组建中国国家博物馆。"}, {"section": "北京地区的主要博物馆", "type": "multi", "q": "中国铁道博物馆下设的展馆包括（ ）。", "options": ["A. 正阳门展馆", "B. 东郊展馆", "C. 詹天佑纪念馆", "D. 卢沟桥展馆", "E. 八达岭展馆"], "answer": "ABC", "explain": "中国铁道博物馆下设三个展馆：正阳门展馆、东郊展馆（中国最大的铁路机车车辆陈列馆）、詹天佑纪念馆（延庆区八达岭特区）。", "source": "中国铁道博物馆的组成：下设三个展馆——正阳门展馆……东郊展馆……詹天佑纪念馆（延庆区八达岭特区，为纪念爱国工程师詹天佑而建的专题人物纪念馆）"}, {"section": "北京地区的主要博物馆", "type": "single", "q": "中国电影博物馆建造的原因是（ ）。", "options": ["A. 纪念中国电影诞生100周年", "B. 纪念新中国成立50周年", "C. 纪念五四运动100周年", "D. 纪念北京建都850周年"], "answer": "A", "explain": "中国电影博物馆为纪念中国电影诞生100周年而建，是目前世界上最大的国家级电影专业博物馆。", "source": "中国电影博物馆建造的原因：为纪念中国电影诞生100周年而建……也是目前世界上最大的国家级电影专业博物馆"}, {"section": "北京地区的主要博物馆", "type": "judge", "q": "北京大葆台汉墓的墓主人是西汉广阳顷王刘建，他是汉武帝之子、燕剌王刘旦之孙。", "answer": "错", "explain": "刘建是汉武帝之孙、燕剌王刘旦之子，题干把辈分颠倒了；一号墓为刘建之墓，二号墓为其王后之墓。", "source": "刘建是汉武帝之孙、燕剌王刘旦之子，第一代广阳王，在位29年，死后谥号“顷王”。"}, {"section": "北京地区的主要博物馆", "type": "single", "q": "中国成立最早的国家级地学博物馆、中国人自己创办的第一个公立自然科学博物馆是创建于1916年的（ ）。", "options": ["A. 北京自然博物馆", "B. 中国地质博物馆", "C. 中国科技馆", "D. 北京天文馆"], "answer": "B", "explain": "中国地质博物馆创建于1916年（1916年7月），是中国成立最早的国家级地学博物馆，也是中国人自己创办的第一个公立自然科学博物馆。", "source": "中国地质博物馆创建的时间：创建于1916年（1916年7月），是中国成立最早的国家级地学博物馆，也是中国人自己创办的第一个公立自然科学博物馆"}, {"section": "北京地区的主要博物馆", "type": "judge", "q": "北京天文馆是我国和亚洲大陆的第一座大型天文馆，于1957年正式对外开放。", "answer": "对", "explain": "原文：我国和亚洲大陆的第一座大型天文馆是北京天文馆，位于西城区西直门外大街138号，于1957年（1957年9月29日）正式对外开放。", "source": "我国和亚洲大陆的第一座大型天文馆：北京天文馆。位于西城区西直门外大街138号，于1957年（1957年9月29日）正式对外开放。"}, {"section": "北京地区的主要博物馆", "type": "multi", "q": "下列关于北京考古遗址博物馆的说法，正确的有（ ）。", "options": ["A. 为“一馆三址”，于2021年6月整合组建", "B. 三址包括琉璃河遗址、大葆台西汉墓遗址、金中都水关遗址", "C. 琉璃河遗址位于房山区，见证北京建城3000年", "D. 金中都水关遗址是现存考古发掘出土的体量最大的中国古代都城水关遗址", "E. 周口店遗址博物馆是其三址之一"], "answer": "ABCD", "explain": "周口店遗址博物馆为独立建制，不属北京考古遗址博物馆，E项错误；其余四项均与原文相符。", "source": "为“一馆三址”……三址为：琉璃河遗址（房山区琉璃河镇董家林村），见证北京建城3000年；大葆台西汉墓遗址……金中都水关遗址……现存考古发掘出土的体量最大的中国古代都城水关遗址：金中都水关遗址"}, {"section": "北京地区的主要博物馆", "type": "single", "q": "中国第一个综合类军事博物馆是（ ）。", "options": ["A. 中国人民抗日战争纪念馆", "B. 中国人民革命军事博物馆", "C. 中国航空博物馆", "D. 香山革命纪念馆"], "answer": "B", "explain": "中国人民革命军事博物馆（军博）位于海淀区复兴路9号，1960年8月1日正式开放，是向国庆10周年献礼的首都十大建筑之一。", "source": "中国第一个综合类军事博物馆：中国人民革命军事博物馆（简称“军博”）。位于北京市海淀区复兴路9号……1960年8月1日（建军节）正式开放"}, {"section": "北京地区的主要博物馆", "type": "judge", "q": "2024年国际博物馆日的主题是“快速变化社会中的博物馆未来”。", "answer": "错", "explain": "“快速变化社会中的博物馆未来”是2025年的主题；2024年主题为“博物馆致力于教育和研究”。", "source": "近年主题示例：2024年主题为“博物馆致力于教育和研究”；2025年主题为“快速变化社会中的博物馆未来”。"}, {"section": "北京地区的主要博物馆", "type": "single", "q": "新中国成立后，我国首次发现的“黄肠题凑”墓是（ ）。", "options": ["A. 琉璃河燕国墓", "B. 北京大葆台西汉墓", "C. 明定陵", "D. 金中都水关遗址"], "answer": "B", "explain": "北京大葆台西汉墓（一号墓）是国内首座得到确认的“黄肠题凑”墓葬，一号墓共用柏木条约15880根。", "source": "新中国成立后，我国首次发现的“黄肠题凑”墓：北京大葆台西汉墓（一号墓），是国内首座得到确认的“黄肠题凑”墓葬……一号墓共用柏木条（枋）约15880根"}, {"section": "北京地区的主要博物馆", "type": "judge", "q": "中国国家博物馆的前身可追溯至1912年成立的国立历史博物馆筹备处，设于北京国子监。", "answer": "对", "explain": "原文：国博前身可追溯至1912年7月9日设于北京国子监的国立历史博物馆筹备处，由蔡元培、鲁迅等有识之士推动成立。", "source": "前身：可追溯至1912年成立的国立历史博物馆筹备处（1912年7月9日设于北京国子监，由蔡元培、鲁迅等有识之士推动成立）。"}, {"section": "北京地区的主要博物馆", "type": "multi", "q": "民族文化宫典藏体系中，堪称翘楚的有（ ）。", "options": ["A. 1959年故宫博物院拨交的少数民族文物", "B. 历代达赖和班禅敬献党和国家领导人的见证物", "C. 全国各民族敬献党和国家领导人的见证物", "D. 北京人、元谋人、山顶洞人古人类化石"], "answer": "ABC", "explain": "原文所列三大翘楚为A、B、C三项；北京人、元谋人、山顶洞人等古人类化石是中国地质博物馆的收藏，D项错误。", "source": "其中尤以1959年故宫博物院拨交的少数民族文物、历代达赖和班禅敬献党和国家领导人的见证物、全国各民族敬献党和国家领导人的见证物为翘楚"}, {"section": "北京地区的主要博物馆", "type": "single", "q": "北京汽车博物馆建筑造型的创意寓意是（ ）。", "options": ["A. 古代文物破土而出", "B. 一只明亮的“眼睛”", "C. 中国传统建筑的飞檐", "D. 妇女的柔媚多姿"], "answer": "B", "explain": "北京汽车博物馆建筑造型创意为一只明亮的“眼睛”，寓意“放眼世界、面向未来”；“文物破土而出”是首都博物馆青铜展馆的寓意。", "source": "北京汽车博物馆建筑造型的寓意：建筑造型创意为一只明亮的“眼睛”……寓意“放眼世界、面向未来”。"}, {"section": "北京地区的主要博物馆", "type": "judge", "q": "首都博物馆椭圆形青铜展馆斜出墙面，寓意古代文物破土而出。", "answer": "对", "explain": "原文：“酷似青铜器的椭圆展馆穿透外墙直指蓝天，象征古代文物破土而出”。", "source": "椭圆形的青铜展馆斜出墙面，寓意古代文物破土而出（“酷似青铜器的椭圆展馆穿透外墙直指蓝天，象征古代文物破土而出”）。"}, {"section": "北京地区的主要博物馆", "type": "single", "q": "2026年北京南中轴地区首个完成筹备工作正式面向公众开放的博物馆是（ ）。", "options": ["A. 北京自然博物馆", "B. 北京市自然昆虫博物馆", "C. 中国园林博物馆", "D. 北京汽车博物馆"], "answer": "B", "explain": "北京市自然昆虫博物馆于2026年4月9日正式面向公众开放，是南中轴地区首个博物馆，也是丰台区利用疏解腾退空间引入的首个民营博物馆。", "source": "北京市自然昆虫博物馆。于2026年4月9日完成筹备工作、正式面向公众开放，是北京南中轴地区首个博物馆。"}, {"section": "北京地区的主要博物馆", "type": "judge", "q": "民族文化宫收藏中国各民族各时代藏品近5万件（套），涵盖现有55个民族。", "answer": "错", "explain": "民族文化宫藏品涵盖现有56个民族，不是55个；其藏品数量多、种类丰富，从物质文化到精神文化包罗万象。", "source": "民族文化宫的藏品特点：收藏中国各民族各时代藏品近5万件（套），涵盖现有56个民族，在中国民族类博物馆中藏品数量多、种类丰富"}, {"section": "北京地区的主要博物馆", "type": "multi", "q": "北京考古遗址博物馆“一馆三址”中，原馆与现址对应正确的有（ ）。", "options": ["A. 原北京市西周燕都遗址博物馆——琉璃河遗址", "B. 原北京市大葆台西汉墓博物馆——大葆台西汉墓遗址", "C. 原北京辽金城垣博物馆——金中都水关遗址", "D. 原周口店遗址博物馆——周口店遗址"], "answer": "ABC", "explain": "三址由西周燕都遗址博物馆、大葆台西汉墓博物馆、辽金城垣博物馆于2021年6月整合组建；周口店遗址博物馆为独立建制，不属本馆，D项错误。", "source": "为“一馆三址”，由原北京市西周燕都遗址博物馆、原北京市大葆台西汉墓博物馆和原北京辽金城垣博物馆于2021年6月整合组建而成"}, {"section": "北京地区的主要博物馆", "type": "single", "q": "国际博物馆日中国主会场活动自（ ）起已连续举办多届。", "options": ["A. 1977年", "B. 1978年", "C. 2009年", "D. 2012年"], "answer": "C", "explain": "自2009年起，国际博物馆日中国主会场活动已连续举办多届；1977年为ICOM确定国际博物馆日之年，1978年起ICOM每年组织庆祝活动。", "source": "中国主会场：自2009年起，国际博物馆日中国主会场活动已连续举办多届，成为全民共享的文化节日。"}, {"section": "北京地区的主要博物馆", "type": "judge", "q": "中国人民抗日战争纪念馆坐落于丰台区卢沟桥畔宛平城内，于1987年全民族抗战爆发50周年之际建成开馆。", "answer": "对", "explain": "原文：抗战馆位于宛平城内街101号，坐落在卢沟桥事变原址，1987年全民族抗战爆发50周年之际建成开馆，现有馆藏文物3万件（套）。", "source": "坐落于北京市丰台区卢沟桥畔宛平城内……于1987年全民族抗战爆发50周年之际建成开馆，是国家一级博物馆"}, {"section": "北京地区的主要博物馆", "type": "single", "q": "中国国家博物馆改扩建完成并正式对外开放、建筑面积增加到近20万平方米的年份是（ ）。", "options": ["A. 2003年", "B. 2012年", "C. 1959年", "D. 1912年"], "answer": "B", "explain": "2012年改扩建完成并正式对外开放，建筑面积近20万平方米，拥有48个标准展厅；2003年为中国革命博物馆与中国历史博物馆合并组建国博之年。", "source": "2012年改扩建完成并正式对外开放后，建筑面积增加到近20万平方米……拥有48个标准展厅，是世界上单体建筑面积最大的现代化综合性博物馆。"}, {"section": "北京地区的主要博物馆", "type": "multi", "q": "下列关于首都博物馆建筑的说法，正确的有（ ）。", "options": ["A. 椭圆形青铜展馆寓意古代文物破土而出", "B. 巨大屋盖继承了中国传统建筑深远挑檐", "C. 通长石质幕墙象征中国古代城墙", "D. 大厅北门外地面镶嵌清代丹陛", "E. 大厅内有清代牌楼"], "answer": "ABCD", "explain": "大厅内为明代牌楼而非清代牌楼，E项错误；其余四项均与原文相符。", "source": "巨大的屋盖继承了中国传统建筑深远挑檐……通长石质幕墙象征着中国古代城墙……大厅北门外地面镶嵌清代丹陛、大厅内有明代牌楼"}, {"section": "北京地区的主要博物馆", "type": "single", "q": "首都博物馆的建筑设计理念是（ ）。", "options": ["A. “以人为本，以文物为本，为社会服务”", "B. “收藏历史，传承文明”", "C. “博古通今，面向未来”", "D. “保护为主，抢救第一”"], "answer": "A", "explain": "首博建筑设计理念为“以人为本，以文物为本，为社会服务”，强调“过去与未来、历史与现代、艺术与自然的和谐统一”。", "source": "建筑设计理念：“以人为本，以文物为本，为社会服务”，强调“过去与未来、历史与现代、艺术与自然的和谐统一”。"}, {"section": "北京地区的主要博物馆", "type": "single", "q": "中国妇女儿童博物馆建筑顶部的造型特点是（ ）。", "options": ["A. 波浪曲线型轮廓，象征妇女的柔媚多姿", "B. 一只明亮的“眼睛”，寓意放眼世界", "C. 椭圆形青铜展馆，象征文物破土而出", "D. 深远的挑檐，继承传统建筑风格"], "answer": "A", "explain": "妇女儿童博物馆建筑顶部为波浪曲线型轮廓，象征妇女的柔媚多姿，以白色金属板为基调配浅灰色玻璃；B为汽车博物馆，C、D为首都博物馆。", "source": "建筑顶部的波浪曲线型轮廓，象征妇女的柔媚多姿；建筑色彩以白色金属板为基调，配以浅灰色玻璃，显示出高雅、纯洁的气质。"}, {"section": "北京地区的主要博物馆", "type": "single", "q": "中国人民革命军事博物馆主楼建筑高（ ）。", "options": ["A. 94.7米", "B. 49.195米", "C. 55.38米", "D. 43.4米"], "answer": "A", "explain": "军博主楼建筑高94.7米，中央7层、南北两侧各4层，楼顶装有直径6米的镀金“八一”军徽；49.195米为北京汽车博物馆总高度。", "source": "主楼建筑高94.7米，中央7层、南北两侧各4层，楼顶装有直径6米的镀金中国人民解放军“八一”军徽。"}, {"section": "北京地区的主要博物馆", "type": "single", "q": "中国人民抗日战争纪念馆现有馆藏文物（ ）。", "options": ["A. 3万件（套）", "B. 近5万件（套）", "C. 18万余件（套）", "D. 32000余件"], "answer": "A", "explain": "抗战馆现有馆藏文物3万件（套），以1931年至1945年抗战时期的历史文献和实物为主；18万余件为军博，32000余件为海关博物馆，近5万件为民族文化宫。", "source": "现有馆藏文物3万件（套），文物藏品以1931年至1945年抗战时期的各种历史文献和实物为主。"}, {"section": "北京地区的主要博物馆", "type": "single", "q": "北京大葆台西汉墓一号墓的“黄肠题凑”共用柏木条（枋）约（ ）。", "options": ["A. 2500根", "B. 15880根", "C. 1800根", "D. 530根"], "answer": "B", "explain": "大葆台一号墓“黄肠题凑”共用柏木条约15880根；2500个铁银锭榫、约1800根柏木桩、约530立方米青石板均为金中都水关遗址数据。", "source": "“黄肠题凑”为汉代帝王葬制……一号墓共用柏木条（枋）约15880根。"}, {"section": "北京地区的主要博物馆", "type": "single", "q": "现在的北京鲁迅博物馆（北京新文化运动纪念馆）由两馆于（ ）合并组建而成。", "options": ["A. 1956年", "B. 2002年", "C. 2014年", "D. 2021年"], "answer": "C", "explain": "两馆于2014年7月合并组建；1956年为鲁迅博物馆建馆开放之年，2002年为新文化运动纪念馆对外开放之年，2021年为北京考古遗址博物馆整合组建之年。", "source": "现馆为北京鲁迅博物馆（北京新文化运动纪念馆），由原北京鲁迅博物馆和北京新文化运动纪念馆于2014年7月合并组建而成"}, {"section": "北京地区的主要博物馆", "type": "single", "q": "北京市自然昆虫博物馆坐落于（ ）。", "options": ["A. 丰台区南苑路15号南中轴国际文化科技园", "B. 西城区西直门外大街138号", "C. 海淀区复兴路9号", "D. 东城区前门大街甲2号"], "answer": "A", "explain": "自然昆虫博物馆坐落于丰台区南苑路15号南中轴国际文化科技园3号楼3层；B为北京天文馆，C为军事博物馆，D为铁道博物馆正阳门展馆。", "source": "该馆坐落于丰台区南苑路15号南中轴国际文化科技园3号楼3层，建筑面积约4000平方米"}, {"section": "北京地区的红色教育基地", "type": "single", "q": "卢沟桥建成于（　）。", "options": ["A. 金大定二十九年（1189年）", "B. 金明昌三年（1192年）", "C. 金明昌五年（1194年）", "D. 金承安元年（1196年）"], "answer": "B", "explain": "卢沟桥始建于金大定二十九年（1189年），建成于金明昌三年（1192年）。1189年是始建年份，注意区分。", "source": "始建于金大定二十九年（1189年），建成于金明昌三年（1192年），至今已有800多年历史"}, {"section": "北京地区的红色教育基地", "type": "judge", "q": "卢沟桥始建于金大定二十九年（1189年），建成于金明昌三年（1192年）。", "answer": "对", "explain": "原文明确记载卢沟桥始建于金大定二十九年（1189年），建成于金明昌三年（1192年），至今已有800多年历史。", "source": "始建于金大定二十九年（1189年），建成于金明昌三年（1192年），至今已有800多年历史"}, {"section": "北京地区的红色教育基地", "type": "multi", "q": "下列位于西城区的中国共产党早期北京革命活动旧址有（　）。", "options": ["A. 李大钊故居", "B. 京报馆旧址（邵飘萍故居）", "C. 陶然亭慈悲庵", "D. 国立蒙藏学校旧址", "E. 古北口长城抗战纪念馆"], "answer": "ABCD", "explain": "西城区的8处旧址包括李大钊故居、京报馆旧址、陶然亭慈悲庵、国立蒙藏学校旧址等；古北口长城抗战纪念馆位于密云区。", "source": "西城区占8处，主要有——①李大钊故居……②京报馆旧址……③陶然亭慈悲庵……④国立蒙藏学校旧址"}, {"section": "北京地区的红色教育基地", "type": "single", "q": "卢沟桥的原名是（　）。", "options": ["A. 永定桥", "B. 广利桥", "C. 拱北桥", "D. 马可·波罗桥"], "answer": "B", "explain": "卢沟桥初名“广利”，因永定河旧称卢沟河，元代改称卢沟桥；“马可·波罗桥”是西方称呼；“拱北城”是宛平城原名。", "source": "卢沟桥的原名为“广利桥”（初名“广利”，因永定河旧称卢沟河，元代改称卢沟桥）；西方又称“马可·波罗桥”"}, {"section": "北京地区的红色教育基地", "type": "judge", "q": "卢沟桥为11孔联拱石桥，全长266.5米、宽9.3米，共有11个桥墩。", "answer": "错", "explain": "卢沟桥为11孔联拱石桥，全长266.5米、宽9.3米，但桥墩是10个，不是11个。", "source": "为11孔联拱石桥，全长266.5米、宽9.3米，10个桥墩，桥上望柱281根、石狮501只"}, {"section": "北京地区的红色教育基地", "type": "single", "q": "1915年9月陈独秀在上海创刊的杂志，原名是（　）。", "options": ["A. 《新青年》", "B. 《青年杂志》", "C. 《向导》", "D. 《京报》"], "answer": "B", "explain": "1915年9月陈独秀在上海创刊《青年杂志》，1916年9月更名《新青年》；《向导》是中共中央机关报，《京报》为邵飘萍创办。", "source": "1915年9月陈独秀在上海创刊《青年杂志》，1916年9月更名《新青年》"}, {"section": "北京地区的红色教育基地", "type": "judge", "q": "宛平城位于卢沟桥西侧，是中国华北地区唯一保存完整的两开门卫城。", "answer": "错", "explain": "宛平城位于卢沟桥东侧，不是西侧；它是中国华北地区唯一保存完整的两开门卫城。", "source": "中国华北地区唯一保存完整的两开门卫城是宛平城，位于卢沟桥东侧"}, {"section": "北京地区的红色教育基地", "type": "multi", "q": "下列关于佟麟阁的说法正确的有（　）。", "options": ["A. 时任国民革命军第二十九军副军长", "B. 1937年7月28日在南苑殉国", "C. 殉国时年仅29岁", "D. 是全民族抗战爆发后牺牲的第一位军级将领", "E. 抗战胜利后南沟沿被命名为佟麟阁路"], "answer": "ABDE", "explain": "佟麟阁殉国时年45岁，年仅29岁病逝的是高君宇；佟麟阁是抗战爆发后牺牲的第一位军级将领，第一位师长是赵登禹。", "source": "佟麟阁（1892—1937）……时任国民革命军第二十九军副军长……1937年7月28日……壮烈殉国，时年45岁"}, {"section": "北京地区的红色教育基地", "type": "single", "q": "《共产党宣言》首个中文全译本的翻译者是（　）。", "options": ["A. 陈独秀", "B. 李大钊", "C. 陈望道", "D. 蔡和森"], "answer": "C", "explain": "《共产党宣言》首个中文全译本由陈望道（浙江义乌人）翻译，1920年8月在上海出版。", "source": "《共产党宣言》首个中文全译本的翻译者是陈望道（浙江义乌分水塘村人），依据日文译本并参照英文译本翻译"}, {"section": "北京地区的红色教育基地", "type": "judge", "q": "1917年1月，陈独秀将《新青年》编辑部由上海迁到北京。", "answer": "对", "explain": "1917年1月蔡元培出任北大校长，聘陈独秀为文科学长，《新青年》编辑部随陈独秀由上海迁至北京。", "source": "1917年1月蔡元培出任北京大学校长，聘陈独秀为文科学长，《新青年》编辑部随陈独秀由上海迁至北京"}, {"section": "北京地区的红色教育基地", "type": "single", "q": "北大“红楼”落成的时间是（　）。", "options": ["A. 1916年", "B. 1918年8月", "C. 1919年5月", "D. 1920年10月"], "answer": "B", "explain": "红楼1916年动工、1918年8月落成，导游讲解以1918年8月建成为准；1916年为动工时间。", "source": "红楼建于1916年动工、1918年8月落成（初为北大预科学生宿舍楼，后改作校部、图书馆和文科教室）"}, {"section": "北京地区的红色教育基地", "type": "judge", "q": "《共产党宣言》首个中文全译本1920年8月在上海出版，首版印行10000册。", "answer": "错", "explain": "首版印行1000册，不是10000册；封面书名曾误印为《共党产宣言》，同年9月再版改正。", "source": "1920年8月在上海以“社会主义研究小丛书第一种”出版，首版印行1000册"}, {"section": "北京地区的红色教育基地", "type": "multi", "q": "下列关于中国人民抗日战争纪念馆的说法正确的有（　）。", "options": ["A. 坐落于丰台区卢沟桥畔宛平城内", "B. 于1987年7月7日建成并对公众开放", "C. 馆名由江泽民题写", "D. 馆前抗战广场面积8600平方米"], "answer": "ABD", "explain": "馆名由邓小平同志题写，江泽民是1997年二期工程竣工时题词；A、B、D三项均与原文相符。", "source": "坐落于丰台区卢沟桥畔宛平城内……于1987年7月7日建成并对公众开放。馆名由邓小平同志亲自题写……抗战广场面积8600平方米"}, {"section": "北京地区的红色教育基地", "type": "single", "q": "“五四精神”的核心是（　）。", "options": ["A. 民主精神", "B. 科学精神", "C. 进步精神", "D. 爱国主义精神"], "answer": "D", "explain": "五四运动孕育了以爱国、进步、民主、科学为主要内容的伟大五四精神，其核心是爱国主义精神。", "source": "五四运动孕育了以爱国、进步、民主、科学为主要内容的伟大五四精神，其核心是爱国主义精神"}, {"section": "北京地区的红色教育基地", "type": "judge", "q": "李大钊在京居住时间最长的住所是西城区文华胡同24号。", "answer": "对", "explain": "西城区文华胡同24号（当时称石驸马大街后宅35号）是李大钊在北京5处故居中居住时间最长、最著名的一处。", "source": "李大钊在京居住时间最长的住所是西城区文华胡同24号（当时称石驸马大街后宅35号），1920年春至1924年1月在此居住近4年"}, {"section": "北京地区的红色教育基地", "type": "single", "q": "1927年4月28日，李大钊英勇就义的地点是（　）。", "options": ["A. 东交民巷苏联使馆", "B. 西交民巷京师看守所", "C. 天安门前", "D. 陶然亭"], "answer": "B", "explain": "李大钊在东交民巷苏联使馆区被捕，1927年4月28日在北京西交民巷京师看守所英勇就义，时年38岁。", "source": "同年4月28日李大钊在北京西交民巷京师看守所英勇就义，时年38岁"}, {"section": "北京地区的红色教育基地", "type": "judge", "q": "中国共产党第一位女党员是向警予。", "answer": "错", "explain": "中国共产党第一位女党员是缪伯英；向警予是第一位女中央委员，二者不可混淆。", "source": "中国共产党第一位女党员是缪伯英（1899—1929，湖南长沙人）"}, {"section": "北京地区的红色教育基地", "type": "multi", "q": "抗战时期“平西”主要包括的范围有（　）。", "options": ["A. 宛平", "B. 房山", "C. 涞水", "D. 密云"], "answer": "ABC", "explain": "平西主要包括宛平、房山、涞水三县大部及昌平、延庆、良乡等县一部，约12个县；密云属冀东方向，不在平西范围内。", "source": "主要包括宛平（今门头沟、丰台西部一带）、房山、涞水三县大部，以及昌平、延庆、良乡、涿鹿、涿县、蔚县、宣化、怀来等县一部"}, {"section": "北京地区的红色教育基地", "type": "single", "q": "1919年3月，毛泽东在北大二院第16教室听课时的授课老师是（　）。", "options": ["A. 陈独秀", "B. 蔡元培", "C. 李大钊", "D. 邵飘萍"], "answer": "C", "explain": "1919年3月10日李大钊在北大二院第16教室发表《新旧思潮之激战》演讲，毛泽东在此聆听；该活动由邵飘萍主持组织。", "source": "1919年3月10日，李大钊在北大二院（理科楼／数学系楼）第16教室发表题为《新旧思潮之激战》的演讲，青年毛泽东在此聆听"}, {"section": "北京地区的红色教育基地", "type": "judge", "q": "中国人民抗日战争纪念馆于1987年7月7日建成并对公众开放。", "answer": "对", "explain": "该馆于1987年7月7日（卢沟桥事变爆发50周年之日）建成并对公众开放。", "source": "于1987年7月7日（卢沟桥事变爆发50周年之日）建成并对公众开放"}, {"section": "北京地区的红色教育基地", "type": "single", "q": "1924—1925年期间，中法大学党支部书记由（　）担任。", "options": ["A. 肖明", "B. 陈毅", "C. 多松年", "D. 邓中夏"], "answer": "B", "explain": "1924—1925年中法大学党支部书记由陈毅担任；1923年书记为肖明；多松年是蒙藏学校党支部书记。", "source": "1924—1925年，中法大学党支部书记由陈毅担任；陈毅1923年进入中法大学学习并由团员转为党员"}, {"section": "北京地区的红色教育基地", "type": "judge", "q": "打响北京地区抗日战争第一枪的战役是1937年七七事变。", "answer": "错", "explain": "打响北京地区抗日战争第一枪的是1933年3月的古北口战役（长城抗战）；七七事变是全民族抗战爆发的标志，二者不可混淆。", "source": "打响北京地区抗日战争第一枪的战役是古北口战役（1933年3月，属长城抗战）"}, {"section": "北京地区的红色教育基地", "type": "multi", "q": "“圆明三园”是指（　）。", "options": ["A. 圆明园", "B. 长春园", "C. 绮春园", "D. 颐和园"], "answer": "ABC", "explain": "圆明三园指圆明园、长春园、绮春园（后改称万春园）三园的总称，被誉为“万园之园”；颐和园不在其列。", "source": "圆明三园指圆明园、长春园、绮春园（绮春园后改称万春园）三园的总称"}, {"section": "北京地区的红色教育基地", "type": "single", "q": "中共中央第一份机关报是（　）。", "options": ["A. 《新青年》", "B. 《向导》周报", "C. 《京报》", "D. 《蒙古农民》"], "answer": "B", "explain": "《向导》周报是中共中央第一份机关报，1922年9月13日在上海创刊，蔡和森任主编；《蒙古农民》是内蒙古第一个革命刊物。", "source": "中共中央第一份机关报是《向导》周报：中国共产党第二次全国代表大会决定创办，1922年9月13日在上海创刊"}, {"section": "北京地区的红色教育基地", "type": "judge", "q": "八路军冀热察挺进军的司令员是陈毅。", "answer": "错", "explain": "冀热察挺进军司令员是萧克（兼政治委员）；陈毅是1924—1925年中法大学党支部书记。", "source": "冀热察挺进军的司令（司令员）是萧克：1939年2月7日，八路军冀热察挺进军在平西三坡（今野三坡）正式成立"}, {"section": "北京地区的红色教育基地", "type": "single", "q": "《京报》的创始人是（　）。", "options": ["A. 邵飘萍", "B. 蔡和森", "C. 彭述之", "D. 瞿秋白"], "answer": "A", "explain": "1918年10月邵飘萍在北京独资创办《京报》，创刊时手书“铁肩辣手”悬于编辑室；蔡和森、彭述之、瞿秋白均曾任《向导》主编。", "source": "《京报》的创始人是邵飘萍……1918年10月邵飘萍在北京独资创办《京报》"}, {"section": "北京地区的红色教育基地", "type": "judge", "q": "香山双清别墅的建造者是乾隆帝。", "answer": "错", "explain": "双清别墅的建造者是熊希龄，是他在创办香山慈幼院期间为自己建造的住所；乾隆仅题写“双清”二字于石壁。", "source": "“双清别墅”的建造者是熊希龄……双清别墅即他在创办香山慈幼院期间为自己建造的住所"}, {"section":
