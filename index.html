ce": "北魏太平真君七年（446年）始有关城之筑；北齐天保六年（555年）长城经此。", "layer": "ext"}, {"section": "长城", "type": "single", "q": "八达岭关城西门额“北门锁钥”刻于（　），喻八达岭为京师与居庸关之锁钥。", "options": ["A. 弘治十八年（1505年）", "B. 嘉靖十八年（1539年）", "C. 万历十年（1582年）", "D. 隆庆二年（1568年）"], "answer": "C", "explain": "西门额“北门锁钥”刻于万历十年（1582年）；嘉靖十八年（1539年）刻的是东门额“居庸外镇”。", "source": "西门额“北门锁钥”：刻于万历十年（1582年），喻八达岭为京师与居庸关之锁钥。", "layer": "ext"}, {"section": "长城", "type": "single", "q": "八达岭海拔最高的敌楼北八楼（俗称“好汉坡”“观日台”），其海拔为（　）。", "options": ["A. 888米", "B. 986米", "C. 1020米", "D. 446米"], "answer": "A", "explain": "北八楼海拔888米，迎敌面有6个箭窗（居各楼之首）；986米为司马台望京楼海拔，1020米为北京结所在小火焰山海拔。", "source": "最高敌楼：北八楼（俗称“好汉坡”“观日台”），为八达岭海拔最高的敌楼，海拔888米。", "layer": "ext"}, {"section": "明十三陵", "layer": "core", "type": "single", "q": "崇祯帝朱由检葬于明十三陵中的（ ）。", "options": ["A. 思陵", "B. 德陵", "C. 庆陵", "D. 康陵"], "answer": "A", "explain": "思陵朱由检崇祯；德陵朱由校天启，庆陵朱常洛泰昌，康陵朱厚照正德。", "source": "德陵朱由校天启→思陵朱由检崇祯"}, {"section": "明十三陵", "layer": "core", "type": "judge", "q": "明十三陵的封土形制为\"宝城宝顶\"，取\"天圆地方\"之意，宝城宝顶用于护地宫。", "answer": "对", "explain": "原文：宝城宝顶（护地宫、天圆地方），表述正确。", "source": "宝城宝顶（护地宫、天圆地方）"}, {"section": "明十三陵", "layer": "core", "type": "multi", "q": "下列明代皇帝中，未葬入明十三陵的有（ ）。", "options": ["A. 朱元璋（葬南京明孝陵）", "B. 建文帝（无陵）", "C. 朱祁钰（葬景泰陵，海淀金山）", "D. 朱祁镇（葬裕陵）"], "answer": "ABC", "explain": "朱元璋葬南京明孝陵；建文帝无陵；朱祁钰葬景泰陵（海淀金山）。朱祁镇葬十三陵之裕陵。", "source": "朱元璋葬南京明孝陵；建文帝无陵；朱祁钰葬景泰陵（海淀金山）"}, {"section": "明十三陵", "layer": "core", "type": "single", "q": "明十三陵中献陵位于（ ）。", "options": ["A. 黄山寺一岭（西峰）下、长陵西北", "B. 天寿山主峰南麓、居北面正中", "C. 大峪山东麓", "D. 景泰洼"], "answer": "A", "explain": "献陵在黄山寺一岭（西峰）下、长陵西北；B为长陵，C为定陵，D为庆陵。", "source": "献陵在黄山寺一岭（西峰）下、长陵西北"}, {"section": "明十三陵", "layer": "core", "type": "judge", "q": "明代宗朱祁钰葬于明十三陵之中。", "answer": "错", "explain": "朱祁钰未葬入十三陵，葬于景泰陵（海淀金山）。", "source": "朱祁钰葬景泰陵（海淀金山）"}, {"section": "明十三陵", "layer": "core", "type": "single", "q": "为永乐帝卜选陵址（黄土山，后改名天寿山）的术士是（ ）。", "options": ["A. 廖均卿", "B. 单士元", "C. 程南云", "D. 吴晗"], "answer": "A", "explain": "廖均卿卜选黄土山，后改名天寿山；单士元为铜像建议者，程南云为碑阳书丹者。", "source": "廖均卿卜选；黄土山改名天寿山"}, {"section": "明十三陵", "layer": "core", "type": "judge", "q": "嘉靖帝在位48年，是明代在位时间最长的皇帝。", "answer": "错", "explain": "万历帝在位48年为最长，嘉靖在位45年，题干将两者对调。", "source": "万历帝在位 48 年；嘉靖在位 45 年"}, {"section": "明十三陵", "layer": "core", "type": "multi", "q": "明十三陵中宝城直径位居前三的陵墓有（ ）。", "options": ["A. 长陵（约340米）", "B. 永陵（约259米）", "C. 定陵", "D. 昭陵"], "answer": "ABC", "explain": "宝城直径前三：长陵（约340米）→永陵（约259米）→定陵。", "source": "宝城直径前三：长陵（约 340 米）→永陵（约 259 米）→定陵"}, {"section": "明十三陵", "layer": "core", "type": "single", "q": "明十三陵中规模最小的陵是（ ）。", "options": ["A. 思陵（约6500平方米）", "B. 献陵", "C. 康陵", "D. 德陵"], "answer": "A", "explain": "规模最小为思陵，约6500平方米。", "source": "最小思陵（约6500 平方米）"}, {"section": "明十三陵", "layer": "core", "type": "judge", "q": "明十三陵中唯一建有外罗城的是永陵。", "answer": "对", "explain": "原文明确\"外罗城唯永陵\"。", "source": "外罗城唯永陵"}, {"section": "明十三陵", "layer": "core", "type": "single", "q": "\"哑巴院\"正式名\"月牙城\"，明十三陵中第一座形制完备的哑巴院位于（ ）。", "options": ["A. 昭陵", "B. 长陵", "C. 定陵", "D. 永陵"], "answer": "A", "explain": "哑巴院正式名\"月牙城\"，昭陵为第一座形制完备者。", "source": "哑巴院正式名\"月牙城\"、昭陵为第一座形制完备者"}, {"section": "明十三陵", "layer": "core", "type": "judge", "q": "\"前方后圆\"的陵寝形制由明长陵首创。", "answer": "错", "explain": "\"前方后圆\"由明孝陵首创，非长陵。", "source": "前方后圆由明孝陵首创"}, {"section": "明十三陵", "layer": "core", "type": "multi", "q": "明代沿用宫人殉葬的皇帝有（ ）。", "options": ["A. 朱棣", "B. 朱高炽", "C. 朱瞻基", "D. 朱祁钰", "E. 朱祁镇"], "answer": "ABCD", "explain": "朱元璋首开殉葬，朱棣、朱高炽、朱瞻基、朱祁钰沿用；朱祁镇则是废除殉葬者。", "source": "使用：朱元璋首开→朱棣、朱高炽、朱瞻基、朱祁钰沿用；废除：明英宗朱祁镇"}, {"section": "明十三陵", "layer": "core", "type": "single", "q": "下列关于明十三陵开放情况的说法，正确的是（ ）。", "options": ["A. 长陵、定陵、昭陵、神路常年开放，计划2030年前全部开放", "B. 康陵、永陵、思陵、景陵常年开放", "C. 长陵仅预约开放", "D. 计划2025年前全部开放"], "answer": "A", "explain": "长陵、定陵、昭陵、神路常年开放；康陵、永陵、思陵、景陵预约开放；2030年前全部开放。", "source": "长陵、定陵、昭陵、神路（常年）；康陵、永陵、思陵、景陵（预约）；2030 年前全部开放"}, {"section": "明十三陵", "layer": "core", "type": "judge", "q": "明英宗朱祁镇于1464年颁遗诏废除宫人殉葬。", "answer": "对", "explain": "废除宫人殉葬者为明英宗朱祁镇（1464年遗诏）。", "source": "废除：明英宗朱祁镇（1464 年遗诏）"}, {"section": "明十三陵", "layer": "core", "type": "single", "q": "明代首开宫人殉葬之例的皇帝是（ ）。", "options": ["A. 朱元璋", "B. 朱棣", "C. 朱高炽", "D. 朱瞻基"], "answer": "A", "explain": "朱元璋首开，朱棣、朱高炽、朱瞻基、朱祁钰沿用。", "source": "使用：朱元璋首开→朱棣、朱高炽、朱瞻基、朱祁钰沿用"}, {"section": "明十三陵", "layer": "core", "type": "judge", "q": "明十三陵中的太监墓是王振墓。", "answer": "错", "explain": "太监墓为王承恩墓，非王振。", "source": "太监墓王承恩"}, {"section": "明十三陵", "layer": "core", "type": "multi", "q": "下列关于长陵墓主朱棣及徐皇后的说法，正确的有（ ）。", "options": ["A. 朱棣为朱元璋第四子", "B. 徐皇后为徐达长女", "C. 朱棣初上庙号\"太宗\"", "D. 嘉靖十七年（1538年）改庙号\"成祖\"", "E. 徐皇后为常遇春长女"], "answer": "ABCD", "explain": "朱棣为朱元璋第四子，与徐皇后（徐达长女）合葬长陵；初上\"太宗\"，嘉靖十七年（1538年）改\"成祖\"。", "source": "朱棣与徐皇后（徐达长女）；朱元璋第四子；初上\"太宗\"、嘉靖十七年（1538 年）改\"成祖\""}, {"section": "明十三陵", "layer": "core", "type": "single", "q": "嘉靖帝生前所建\"显陵\"未启用，后来葬入该陵（即昭陵）的皇帝是（ ）。", "options": ["A. 隆庆帝朱载坖", "B. 万历帝朱翊钧", "C. 泰昌帝朱常洛", "D. 天启帝朱由校"], "answer": "A", "explain": "嘉靖建\"显陵\"未启用，后葬隆庆帝，即昭陵。", "source": "嘉靖建\"显陵\"未启用→后葬隆庆帝即昭陵"}, {"section": "明十三陵", "layer": "core", "type": "judge", "q": "长陵是明十三陵中营建时间最长、规模最大、保存最好的陵墓。", "answer": "对", "explain": "原文：营建时间最长、规模最大、保存最好的陵墓为长陵。", "source": "营建时间最长、规模最大、保存最好的陵墓——长陵"}, {"section": "明十三陵", "layer": "core", "type": "single", "q": "葬于景泰洼的庆陵，其墓主是（ ）。", "options": ["A. 朱常洛", "B. 朱由校", "C. 朱由检", "D. 朱载坖"], "answer": "A", "explain": "朱常洛葬景泰洼（庆陵）；朱由校葬德陵，朱由检葬思陵。", "source": "朱常洛葬景泰洼（庆陵）"}, {"section": "明十三陵", "layer": "core", "type": "judge", "q": "石像生始于唐宋、兴于秦汉、盛于明清。", "answer": "错", "explain": "应为始于秦汉、兴于唐宋、盛于明清，题干将\"秦汉\"与\"唐宋\"对调。", "source": "始于秦汉、兴于唐宋、盛于明清"}, {"section": "明十三陵", "layer": "core", "type": "multi", "q": "下列关于明十三陵神路石像生的说法，正确的有（ ）。", "options": ["A. 共18对36尊", "B. 石兽6种，每种二卧二立", "C. 石兽包括狮、獬豸、骆驼、象、麒麟、马", "D. 石人3类各4尊：武臣、文臣、勋臣", "E. 石人中包括宦官4尊"], "answer": "ABCD", "explain": "石像生18对36尊；石兽6种二卧二立：狮、獬豸、骆驼、象、麒麟、马；石人3类各4尊：武臣、文臣、勋臣，无宦官。", "source": "18 对 36 尊；石兽 6 种二卧二立：狮、獬豸、骆驼、象、麒麟、马；石人 3 类各 4 尊：武臣、文臣、勋臣"}, {"section": "明十三陵", "layer": "core", "type": "single", "q": "现存最早的石像生实物是（ ）。", "options": ["A. 西汉霍去病墓石雕", "B. 东汉高颐墓石兽", "C. 唐乾陵石狮", "D. 北宋永熙陵石人"], "answer": "A", "explain": "原文：最早实物为西汉霍去病墓石雕。", "source": "最早实物为西汉霍去病墓石雕"}, {"section": "明十三陵", "layer": "core", "type": "judge", "q": "长陵于永乐七年（1409年）始建，工期近8年。", "answer": "错", "explain": "工期近18年，非8年。", "source": "永乐七年（1409 年）始建、工期近 18 年"}, {"section": "明十三陵", "layer": "core", "type": "single", "q": "明十三陵神路南起石牌坊，北抵（ ），全长约7.3公里。", "options": ["A. 长陵", "B. 定陵", "C. 昭陵", "D. 龙凤门"], "answer": "A", "explain": "神路南起石牌坊、北抵长陵、约7.3公里。", "source": "南起石牌坊、北抵长陵、约 7.3 公里"}, {"section": "明十三陵", "layer": "core", "type": "judge", "q": "定陵地宫深27米，共设五室，总面积约1195平方米，全为石拱券结构，有7座石门，主门为汉白玉。", "answer": "对", "explain": "与原文定陵墓室结构、石门数量材质表述一致。", "source": "地宫深 27 米、五室、总面积约 1195 平方米、全石拱券；7 座石门、主门汉白玉"}, {"section": "明十三陵", "layer": "core", "type": "multi", "q": "下列关于长陵神功圣德碑四面碑文的说法，正确的有（ ）。", "options": ["A. 碑阳为仁宗朱高炽御撰、程南云书丹", "B. 碑阴为乾隆《哀明陵三十韵》", "C. 碑左为乾隆御制诗", "D. 碑右为嘉庆九年御制文", "E. 碑右为康熙御制文"], "answer": "ABCD", "explain": "碑阳：仁宗朱高炽御撰、程南云书丹；碑阴：乾隆《哀明陵三十韵》；碑左：乾隆御制诗；碑右：嘉庆九年御制文。", "source": "碑阳：仁宗朱高炽御撰、程南云书丹；碑阴：乾隆《哀明陵三十韵》；碑左：乾隆御制诗；碑右：嘉庆九年御制文"}, {"section": "明十三陵", "layer": "core", "type": "single", "q": "下列神路建筑设施的排列顺序，正确的是（ ）。", "options": ["A. 石牌坊→三孔石桥→大红门→下马碑→碑亭→石望柱→石像生→龙凤门", "B. 石牌坊→大红门→三孔石桥→碑亭→下马碑→石像生→石望柱→龙凤门", "C. 大红门→石牌坊→三孔石桥→下马碑→碑亭→石望柱→石像生→龙凤门", "D. 石牌坊→三孔石桥→大红门→碑亭→下马碑→石像生→石望柱→龙凤门"], "answer": "A", "explain": "正确顺序为：石牌坊→三孔石桥→大红门→下马碑→碑亭→石望柱→石像生→龙凤门。", "source": "石牌坊→三孔石桥→大红门→下马碑→碑亭→石望柱→石像生→龙凤门"}, {"section": "明十三陵", "layer": "core", "type": "judge", "q": "昭陵是建国后第一座复原修葺的陵寝，20世纪80年代按\"修旧如旧\"原则修复。", "answer": "对", "explain": "原文：建国后第一座复原修葺的陵寝为昭陵，1980年代\"修旧如旧\"。", "source": "建国后第一座复原修葺的陵寝——昭陵；1980 年代\"修旧如旧\""}, {"section": "明十三陵", "layer": "core", "type": "single", "q": "长陵神功圣德碑碑阳碑文的书丹者是（ ）。", "options": ["A. 程南云", "B. 朱高炽", "C. 乾隆帝", "D. 嘉庆帝"], "answer": "A", "explain": "碑阳为仁宗朱高炽御撰、程南云书丹。", "source": "碑阳：仁宗朱高炽御撰、程南云书丹"}, {"section": "明十三陵", "layer": "core", "type": "multi", "q": "下列关于长陵祾恩殿的说法，正确的有（ ）。", "options": ["A. 仿金銮殿（奉天殿）而建", "B. 殿内为金丝楠木60根整根巨柱", "C. 最粗柱底径1.124米", "D. 楠木采自四川、湖广、云南", "E. \"祾恩\"之名为清乾隆年间所改"], "answer": "ABCD", "explain": "祾恩殿仿金銮殿（奉天殿）；金丝楠木60根整根巨柱、最粗底径1.124米，采自四川、湖广、云南；\"祾恩\"（祾=祭而受福、恩=罔极之恩）为1538年改名，非乾隆年间。", "source": "仿金銮殿（奉天殿）；祾=祭而受福、恩=罔极之恩（1538 年改名）；金丝楠木、60 根整根巨柱、最粗底径 1.124 米；采自四川、湖广、云南"}, {"section": "明十三陵", "layer": "core", "type": "single", "q": "长陵神功圣德碑碑阳碑文的御撰者是（ ）。", "options": ["A. 仁宗朱高炽", "B. 宣宗朱瞻基", "C. 乾隆帝", "D. 嘉庆帝"], "answer": "A", "explain": "碑阳由仁宗朱高炽御撰；碑阴为乾隆《哀明陵三十韵》。", "source": "碑阳：仁宗朱高炽御撰、程南云书丹"}, {"section": "明十三陵", "layer": "core", "type": "single", "q": "下列关于长陵地下玄宫的说法，正确的是（ ）。", "options": ["A. 永乐十一年（1413年）正月建成，1416年由赵王朱高燧奉安徐皇后神位", "B. 永乐七年（1409年）建成", "C. 1424年建成，由太子朱高炽奉安神位", "D. 1413年建成，由汉王朱高煦奉安神位"], "answer": "A", "explain": "地下玄宫永乐十一年（1413年）正月建成；奉安徐皇后神位者为赵王朱高燧（1416年）。", "source": "永乐十一年（1413 年）正月建成；赵王朱高燧（1416 年）"}, {"section": "明十三陵", "layer": "core", "type": "multi", "q": "下列关于长陵明楼前石五供的说法，正确的有（ ）。", "options": ["A. 香炉居中", "B. 烛台二", "C. 花瓶二", "D. 石五供为长陵首创", "E. 石狮一对列于两侧"], "answer": "ABCD", "explain": "石五供为香炉居中、烛台二、花瓶二，系长陵首创；无石狮一对之说。", "source": "香炉居中、烛台二、花瓶二；长陵首创"}, {"section": "明十三陵", "layer": "core", "type": "single", "q": "永乐帝朱棣葬入长陵的时间是（ ）。", "options": ["A. 1424年十二月十九日", "B. 永乐七年（1409年）", "C. 永乐十一年（1413年）正月", "D. 1416年"], "answer": "A", "explain": "1424年十二月十九日葬入；1409年为始建，1413年为玄宫建成，1416年为奉安徐皇后神位。", "source": "1424 年十二月十九日葬入"}, {"section": "明十三陵", "layer": "core", "type": "single", "q": "下列陵墓中，不属于皇帝生前所建的是（ ）。", "options": ["A. 长陵", "B. 永陵", "C. 定陵", "D. 献陵"], "answer": "D", "explain": "生前建陵为长陵、永陵、定陵；献陵不在其列。", "source": "生前建：长陵、永陵、定陵"}, {"section": "明十三陵", "layer": "core", "type": "multi", "q": "下列关于定陵营建与发掘的说法，正确的有（ ）。", "options": ["A. 1584年动工、1590年完工，耗银约800万两", "B. 1956年5月开始试掘", "C. 共开3条探沟，指路石碑在第三条探沟", "D. 出土文物3000余件，十二龙九凤冠藏明十三陵（定陵）博物馆", "E. 十二龙九凤冠现藏故宫博物院"], "answer": "ABCD", "explain": "定陵1584年动工、1590年完工、耗银约800万两；1956年5月试掘，3条探沟、指路石碑在第三条；出土3000余件；十二龙九凤冠藏明十三陵（定陵）博物馆，非故宫。", "source": "1584 年动工→1590 年完工、耗银约 800 万两；1956 年 5 月试掘；3 条探沟、指路石碑在第三条；出土 3000 余件；十二龙九凤冠藏明十三陵（定陵）博物馆（勿混：非故宫）"}, {"section": "明十三陵", "layer": "core", "type": "single", "q": "万历帝朱翊钧与两位皇后下葬定陵的时间是（ ）。", "options": ["A. 1620年十月三日", "B. 1584年", "C. 1590年", "D. 1621年"], "answer": "A", "explain": "1620年十月三日下葬；1584年动工、1590年完工。", "source": "1620 年十月三日下葬；1584 年动工→1590 年完工"}, {"section": "明十三陵", "layer": "core", "type": "single", "q": "下列关于长陵永乐帝铜像的说法，正确的是（ ）。", "options": ["A. 按单士元专家建议设置，高4.08米、重约5.6吨、1998年铸", "B. 按吴晗专家建议设置", "C. 高5.6米、重约4.08吨", "D. 1989年铸"], "answer": "A", "explain": "铜像按单士元建议设置（勿混：非吴晗），高4.08米、重约5.6吨、1998年铸。", "source": "单士元建议；高 4.08 米、重约 5.6 吨、1998 年铸（勿混：非吴晗）"}, {"section": "明十三陵", "layer": "core", "type": "single", "q": "昭陵的墓主是（ ）。", "options": ["A. 明穆宗朱载坖及三位皇后", "B. 明神宗朱翊钧及两位皇后", "C. 明成祖朱棣及徐皇后", "D. 明光宗朱常洛"], "answer": "A", "explain": "昭陵墓主为明穆宗朱载坖及三位皇后。", "source": "昭陵的墓主人：明穆宗朱载坖及三位皇后"}, {"section": "明十三陵", "layer": "core", "type": "single", "q": "明十三陵中目前需预约开放的陵寝是（ ）。", "options": ["A. 康陵、永陵、思陵、景陵", "B. 长陵、定陵、昭陵、神路", "C. 康陵、长陵、定陵、昭陵", "D. 永陵、定陵、思陵、神路"], "answer": "A", "explain": "康陵、永陵、思陵、景陵为预约开放；长陵、定陵、昭陵、神路常年开放。", "source": "康陵、永陵、思陵、景陵（预约）"}, {"section": "明十三陵", "type": "single", "q": "明成祖朱棣葬入长陵的时间是（ ）。", "options": ["A. 永乐七年（1409年）", "B. 永乐十一年（1413年）", "C. 永乐二十二年（1424年）", "D. 宣德二年（1427年）"], "answer": "C", "explain": "永乐二十二年（1424年）七月十八日朱棣北征途中崩于榆木川，同年十二月十九日葬入长陵。", "source": "永乐二十二年（1424年）七月十八日朱棣北征途中崩于榆木川，同年十二月十九日葬入长陵，与徐皇后合葬。", "layer": "ext"}, {"section": "明十三陵", "type": "judge", "q": "明十三陵位于北京市昌平区天寿山麓，是明朝十三位皇帝陵墓的总称。", "answer": "对", "explain": "原文表述正确。明十三陵位于北京市昌平区天寿山麓，为明朝十三位皇帝陵墓的总称。", "source": "明十三陵位于北京市昌平区天寿山麓，是明朝十三位皇帝陵墓的总称。", "layer": "ext"}, {"section": "明十三陵", "type": "multi", "q": "下列明代皇帝中，未葬入十三陵的有（ ）。", "options": ["A. 明太祖朱元璋", "B. 建文帝朱允炆", "C. 明代宗朱祁钰", "D. 明英宗朱祁镇"], "answer": "ABC", "explain": "朱元璋葬南京明孝陵；建文帝靖难之变后下落不明无陵墓；代宗朱祁钰以\"王\"礼葬于北京西郊金山（景泰陵）。英宗朱祁镇葬裕陵，在十三陵内。", "source": "明太祖朱元璋：葬于南京明孝陵。建文帝朱允炆：靖难之变后下落不明，无陵墓。明代宗朱祁钰（景泰帝）：以\"王\"礼葬于北京西郊金山，即景泰陵。", "layer": "ext"}, {"section": "明十三陵", "type": "single", "q": "永乐皇帝朱棣将昌平黄土山改名为（ ）。", "options": ["A. 万寿山", "B. 天寿山", "C. 大峪山", "D. 金山"], "answer": "B", "explain": "朱棣将黄土山改名为\"天寿山\"，寓意皇位国运与天同寿。", "source": "永乐皇帝朱棣将黄土山改名为\"天寿山\"（寓意皇位国运与天同寿）。", "layer": "ext"}, {"section": "明十三陵", "type": "judge", "q": "明朝在位时间最长的皇帝是明世宗朱厚熜（嘉靖帝），在位48年。", "answer": "错", "explain": "明朝在位时间最长的是明神宗朱翊钧（万历帝），在位48年；嘉靖帝在位45年，为第二长。", "source": "明朝在位时间最长的皇帝是明神宗朱翊钧（万历帝），在位48年。明世宗朱厚熜（嘉靖帝）在位45年，为明朝在位第二长的皇帝。", "layer": "ext"}, {"section": "明十三陵", "type": "single", "q": "十三陵中建筑规模仅次于长陵、排名第二的陵寝是（ ）。", "options": ["A. 定陵", "B. 昭陵", "C. 永陵", "D. 献陵"], "answer": "C", "explain": "建筑规模第二大的陵寝是永陵（世宗嘉靖帝陵），仅次于长陵。", "source": "建筑规模第二大的陵寝：永陵（世宗嘉靖帝陵），仅次于长陵。", "layer": "ext"}, {"section": "明十三陵", "type": "judge", "q": "卜选昌平黄土山为皇家吉壤的风水术士主要是明初江西籍术士廖均卿。", "answer": "对", "explain": "永乐六年（1408年）礼部尚书赵羾奉旨带领廖均卿等人踏勘，最终在昌平黄土山找到\"万年吉壤\"。", "source": "卜选昌平黄土山（后称天寿山）为皇家吉壤的风水术士，主要是明初江西籍风水术士廖均卿。明永乐六年（1408年），礼部尚书赵羾奉旨带领廖均卿等人在北京附近踏勘。", "layer": "ext"}, {"section": "明十三陵", "type": "multi", "q": "明朝沿用宫人殉葬制度的皇帝有（ ）。", "options": ["A. 明太祖朱元璋", "B. 明成祖朱棣", "C. 明英宗朱祁镇", "D. 明宣宗朱瞻基"], "answer": "ABD", "explain": "朱元璋首开明朝人殉恶例，成祖朱棣、仁宗朱高炽、宣宗朱瞻基乃至代宗朱祁钰均沿用；明英宗朱祁镇遗诏废止宫人殉葬。", "source": "明太祖朱元璋首开明朝人殉恶例，其后成祖朱棣、仁宗朱高炽、宣宗朱瞻基，乃至代宗朱祁钰（景泰帝）等均沿用宫人殉葬。废除宫人殉葬制度的皇帝：明英宗朱祁镇。", "layer": "ext"}, {"section": "明十三陵", "type": "single", "q": "十三陵中建筑规模最小的陵寝是（ ）。", "options": ["A. 思陵", "B. 庆陵", "C. 德陵", "D. 康陵"], "answer": "A", "explain": "思陵（崇祯帝陵）原为其宠妃田氏墓改建，占地仅约6500平方米，约为长陵二百分之一。", "source": "建筑规模最小的陵寝：思陵（思宗崇祯帝陵，原为其宠妃田氏墓改建，占地仅约6500平方米，约为长陵二百分之一）。", "layer": "ext"}, {"section": "明十三陵", "type": "judge", "q": "明朝废除宫人殉葬制度的皇帝是明代宗朱祁钰。", "answer": "错", "explain": "废除宫人殉葬制度的是明英宗朱祁镇。天顺八年（1464年）正月临终遗诏明令废止。", "source": "废除宫人殉葬制度的皇帝：明英宗朱祁镇。天顺八年（1464年）正月临终遗诏明令废止：\"用人殉葬，吾不忍也，此事宜自我止，后世勿复为。\"", "layer": "ext"}, {"section": "明十三陵", "type": "single", "q": "中华人民共和国成立后，十三陵中第一座有计划进行大规模复原修葺的陵寝是（ ）。", "options": ["A. 长陵", "B. 定陵", "C. 昭陵", "D. 永陵"], "answer": "C", "explain": "昭陵于1980年代按\"修旧如旧\"原则复原，是十三陵中地面建筑最完整、典制最完备的开放陵园之一。", "source": "中华人民共和国成立后，明十三陵中第一座有计划进行大规模复原修葺的陵寝是昭陵。昭陵于1980年代按\"修旧如旧\"原则复原。", "layer": "ext"}, {"section": "明十三陵", "type": "judge", "q": "明成祖朱棣是明太祖朱元璋的第三子。", "answer": "错", "explain": "朱棣为明太祖朱元璋第四子，洪武三年封燕王。", "source": "明太祖朱元璋第四子（洪武三年封燕王）。", "layer": "ext"}, {"section": "明十三陵", "type": "multi", "q": "明十三陵中为皇帝本人生前所建\"寿宫\"的陵寝有（ ）。", "options": ["A. 长陵", "B. 永陵", "C. 定陵", "D. 昭陵"], "answer": "ABC", "explain": "主要有三座为皇帝本人生前所建\"寿宫\"：长陵（成祖朱棣）、永陵（世宗朱厚熜）、定陵（神宗朱翊钧）。", "source": "墓主生前修建的陵寝：明十三陵中主要有三座为皇帝本人生前所建\"寿宫\"——长陵（成祖朱棣）、永陵（世宗朱厚熜）、定陵（神宗朱翊钧）。", "layer": "ext"}, {"section": "明十三陵", "type": "single", "q": "十三陵中拥有外罗城建筑结构的陵寝是（ ）。", "options": ["A. 长陵", "B. 永陵", "C. 定陵", "D. 景陵"], "answer": "B", "explain": "永陵在方院和宝城之外有一道前七陵都没有的\"外罗城\"，为嘉靖帝拟将皇妃从葬于陵园内而设计。", "source": "拥有外罗城建筑结构的陵寝：永陵（方院和宝城之外有一道前七陵都没有的\"外罗城\"，为嘉靖帝按世宗旨意拟将皇妃从葬于陵园内而设计）。", "layer": "ext"}, {"section": "明十三陵", "type": "judge", "q": "1956年5月，经国务院批准对定陵地下宫殿进行试掘，这是新中国成立后经批准第一座有计划发掘的帝王陵。", "answer": "对", "explain": "1956年5月试掘，1958年7月试掘成功，是新中国成立后经批准第一座有计划发掘的帝王陵。", "source": "1956年5月，经国务院批准对定陵地下宫殿进行试掘，1958年7月试掘成功，是新中国成立后经批准第一座有计划发掘的帝王陵。", "layer": "ext"}, {"section": "明十三陵", "type": "single", "q": "十三陵中俗称\"哑巴院\"的建筑，其正式名称是（ ）。", "options": ["A. 月牙城", "B. 外罗城", "C. 宝城", "D. 方城"], "answer": "A", "explain": "\"哑巴院\"正式名称为\"月牙城\"，指方城之后、宝顶之前那道月牙形挡土墙围合出的封闭院落。", "source": "\"哑巴院\"的正式名称及采用形制者：正式名称为\"月牙城\"（指方城之后、宝顶之前那道月牙形挡土墙围合出的封闭院落）。", "layer": "ext"}, {"section": "明十三陵", "type": "judge", "q": "十三陵神路排列石像生18对共36尊，其中石兽6种各二卧二立，石人3类各4尊。", "answer": "对", "explain": "石兽6种（狮、獬豸、骆驼、象、麒麟、马）各二卧二立共24尊；石人3类（武臣、文臣、勋臣）各4尊共12尊。", "source": "排列石像生18对（共36尊）。石兽6种，各二卧二立（共24尊）：狮、獬豸、骆驼、象、麒麟、马；石人3类，各4尊（共12尊）：武臣（将军）、文臣、勋臣。", "layer": "ext"}, {"section": "明十三陵", "type": "multi", "q": "下列建筑设施中，属于十三陵神路（由南而北）上的有（ ）。", "options": ["A. 石牌坊", "B. 大红门", "C. 神功圣德碑亭", "D. 龙凤门", "E. 祾恩殿"], "answer": "ABCD", "explain": "神路上的建筑设施由南而北为石牌坊、三孔石桥、大红门、下马碑、神功圣德碑亭、石望柱、石像生、龙凤门、五孔桥、七孔桥等。祾恩殿为陵宫建筑，不在神路上。", "source": "神路上的建筑设施（由南而北）：石牌坊、三孔（三空）石桥、大红门（大宫门）、下马碑、神功圣德碑亭（及四隅汉白玉华表）、石望柱、石像生、龙凤门（棂星门）、五孔桥、七孔桥等。", "layer": "ext"}, {"section": "明十三陵", "type": "single", "q": "十三陵区内唯一的太监墓，墓主人是（ ）。", "options": ["A. 王承恩", "B. 田义", "C. 魏忠贤", "D. 王安"], "answer": "A", "explain": "十三陵区内唯一的太监墓，墓主为王承恩。", "source": "唯一的太监墓：墓主为王承恩。", "layer": "ext"}, {"section": "明十三陵", "type": "judge", "q": "定陵地宫共7座石门，全部以汉白玉制成。", "answer": "错", "explain": "前、中、后三室主石门为汉白玉制成，左右配殿及甬道四座为青石小门。", "source": "地宫共7座石门（前、中、后三殿及左右配殿甬道）。其中前、中、后三室主石门为汉白玉制成；左右配殿及甬道四座为青石小门。", "layer": "ext"}, {"section": "明十三陵", "type": "single", "q": "嘉靖皇帝在十三陵区域内修建但未启用的\"显陵\"，后来用以安葬隆庆帝，即（ ）。", "options": ["A. 庆陵", "B. 昭陵", "C. 德陵", "D. 裕陵"], "answer": "B", "explain": "嘉靖所建未启用的\"显陵\"被用以安葬穆宗朱载坖（隆庆帝），即昭陵。", "source": "嘉靖所建未启用的\"显陵\"：被用以安葬穆宗朱载坖（隆庆帝），即昭陵。", "layer": "ext"}, {"section": "明十三陵", "type": "judge", "q": "献陵位于天寿山黄山寺一岭（西峰）之下，在长陵的东北侧。", "answer": "错", "explain": "献陵位于天寿山黄山寺一岭（西峰）之下，在长陵的西北侧，而非东北侧。", "source": "献陵的位置：位于天寿山黄山寺一岭（西峰）之下，在长陵的西北侧。", "layer": "ext"}, {"section": "明十三陵", "type": "multi", "q": "十三陵中宝城直径排名前三的陵寝有（ ）。", "options": ["A. 长陵", "B. 永陵", "C. 定陵", "D. 思陵"], "answer": "ABC", "explain": "第一名长陵（直径101丈8尺，约340米）；第二名永陵（直径81丈，约259米）；第三名定陵（仿永陵而建，规制略小）。", "source": "宝城直径排名前三：第一名长陵（宝城直径101丈8尺，约340米）；第二名永陵（直径81丈，约259米）；第三名定陵（仿永陵而建，规制略小）。", "layer": "ext"}, {"section": "明十三陵", "type": "single", "q": "葬在\"景泰洼\"的皇帝是（ ）。", "options": ["A. 明代宗朱祁钰", "B. 明光宗朱常洛", "C. 明熹宗朱由校", "D. 明英宗朱祁镇"], "answer": "B", "explain": "景泰洼原为景泰帝被废后捣毁的陵址，后光宗朱常洛仓促下葬于此，是为庆陵。", "source": "葬在\"景泰洼\"的皇帝：明光宗朱常洛（庆陵）。景泰洼原为景泰帝朱祁钰被废后捣毁的陵址，后光宗朱常洛仓促下葬于此，是为庆陵。", "layer": "ext"}, {"section": "明十三陵", "type": "judge", "q": "十三陵各陵封土均采用\"宝城宝顶\"式，其作用是保护地下玄宫、封固坟冢，并象征\"天圆地方\"的宇宙观与皇权永固。", "answer": "对", "explain": "各陵封土均为宝城宝顶式：地宫之上砌圆形砖城（宝城），城内填土堆成圆顶（宝顶），作用与题干所述一致。", "source": "十三陵各陵封土均采用\"宝城宝顶\"式……作用：保护地下玄宫（墓室）、封固坟冢，并象征\"天圆地方\"的宇宙观与皇权永固。", "layer": "ext"}, {"section": "明十三陵", "type": "single", "q": "长陵神功圣德碑碑阳（正面）碑文的御撰者是（ ）。", "options": ["A. 明成祖朱棣", "B. 明仁宗朱高炽", "C. 明宣宗朱瞻基", "D. 明世宗朱厚熜"], "answer": "B", "explain": "碑阳为明仁宗朱高炽御撰（约3000余字），由明初书法家程南云书丹，落款\"洪熙元年（1425年）四月十七日\"。", "source": "碑阳（正面）：明仁宗朱高炽御撰（约3000余字），由明初书法家程南云书丹……落款\"洪熙元年（1425年）四月十七日\"。", "layer": "ext"}, {"section": "明十三陵", "type": "judge", "q": "长陵祾恩殿内60根巨柱皆为整根楠木，其中最粗者底径达1.124米。", "answer": "对", "explain": "殿内木构件均用金丝楠木加工而成，60根巨柱皆为整根楠木，最粗底径达1.124米。", "source": "均用名贵金丝楠木加工而成（60根巨柱皆为整根楠木，最粗底径达1.124米）。", "layer": "ext"}, {"section": "明十三陵", "type": "multi", "q": "下列关于长陵神功圣德碑四面碑文的说法，正确的有（ ）。", "options": ["A. 碑阳为明仁宗朱高炽御撰", "B. 碑阴为清乾隆帝御制《哀明陵三十韵》", "C. 碑右为清嘉庆九年嘉庆帝御制文", "D. 碑左为明宣宗朱瞻基御制诗"], "answer": "ABC", "explain": "碑左（东侧）为清乾隆《修明陵成遂因临视用乙巳诗韵》（1787年）等御制诗及修陵记，并非明宣宗御制诗。", "source": "碑阴：清乾隆五十年（1785年）乾隆帝御制《哀明陵三十韵》。碑左（东侧）：清乾隆《修明陵成遂因临视用乙巳诗韵》（1787年）等御制诗及修陵记。碑右（西侧）：清嘉庆九年（1804年）嘉庆帝御制文。", "layer": "ext"}, {"section": "明十三陵", "type": "single", "q": "长陵祾恩殿是仿照（ ）修建的。", "options": ["A. 南京明孝陵享殿", "B. 明代皇宫金銮殿（奉天殿）", "C. 天坛祈年殿", "D. 太庙前殿"], "answer": "B", "explain": "长陵祾恩殿仿照明代皇宫金銮殿（奉天殿/皇极殿，即北京紫禁城太和殿前身）修建。", "source": "仿照建筑：长陵祾恩殿仿照明代皇宫金銮殿（奉天殿/皇极殿，即北京紫禁城太和殿前身）。", "layer": "ext"}, {"section": "明十三陵", "type": "judge", "q": "明神宗朱翊钧于万历四十八年（泰昌元年，1620年）十月三日葬入定陵。", "answer": "对", "explain": "定陵墓主为明神宗朱翊钧与孝端显皇后、孝靖皇后，1620年十月三日葬入定陵。", "source": "下葬时间：万历四十八年（泰昌元年，1620年）十月三日葬入定陵。", "layer": "ext"}, {"section": "明十三陵", "type": "single", "q": "祾恩殿建成后，奉命将仁孝徐皇后神位奉安于长陵祾恩殿内的皇子是（ ）。", "options": ["A. 赵王朱高燧", "B. 汉王朱高煦", "C. 太子朱高炽", "D. 周王朱橚"], "answer": "A", "explain": "永乐十四年（1416年）三月祾恩殿建成后，赵王朱高燧（朱棣第三子）奉命将仁孝徐皇后神位安置于祾恩殿内。", "source": "永乐十四年（1416年）三月祾恩殿建成后，赵王朱高燧（朱棣第三子）奉命将仁孝徐皇后神位安置于祾恩殿内。", "layer": "ext"}, {"section": "明十三陵", "type": "judge", "q": "十三陵中第一座形制完备的\"哑巴院\"（月牙城）是献陵。", "answer": "错", "explain": "十三陵中第一座形制完备的\"哑巴院\"（月牙城）是昭陵，其宝城内封土填满、前置弧形砖墙拦挡。", "source": "其中昭陵是十三陵中第一座形制完备的\"哑巴院\"（月牙城），其宝城内封土填满、前置弧形砖墙拦挡。", "layer": "ext"}, {"section": "明十三陵", "type": "multi", "q": "截至目前，明十三陵景区中常年开放的核心\"三陵一路\"包括（ ）。", "options": ["A. 长陵", "B. 定陵", "C. 昭陵", "D. 长陵神路（神道）", "E. 裕陵"], "answer": "ABCD", "explain": "长陵、定陵、昭陵和神路为常年开放的核心\"三陵一路\"；康陵、永陵、思陵、景陵为预约开放，裕陵尚未开放。", "source": "其中长陵、定陵、昭陵和神路为常年开放的核心\"三陵一路\"；永陵、思陵于2024年12月首次向公众开放（预约），景陵于2025年12月开放。", "layer": "ext"}, {"section": "明十三陵", "type": "single", "q": "长陵祾恩殿内摆放的永乐皇帝铜像，是按照文物专家（ ）的建议设置的。", "options": ["A. 吴晗", "B. 郑振铎", "C. 单士元", "D. 夏鼐"], "answer": "C", "explain": "依照著名文物专家单士元（故宫博物院研究员）的建议设置，意在观其姿容、缅其功业。", "source": "依照著名文物专家单士元（故宫博物院研究员）的建议设置的，意在观其姿容、缅其功业。", "layer": "ext"}, {"section": "明十三陵", "type": "judge", "q": "长陵神功圣德碑亭内立螭首龟趺石碑，碑高7.91米。", "answer": "对", "explain": "碑亭为重檐歇山顶方亭，四面辟券门，内立螭首龟趺石碑，高7.91米。", "source": "长陵神功圣德碑亭为重檐歇山顶方亭，四面辟券门，内立螭首龟趺石碑，高7.91米。", "layer": "ext"}, {"section": "明十三陵", "type": "single", "q": "定陵工程历时约6年，耗银约（ ）。", "options": ["A. 300万两", "B. 500万两", "C. 800万两", "D. 1000万两"], "answer": "C", "explain": "定陵于万历十二年（1584年）十一月动工，万历十八年（1590年）六月地面建筑完工，历时约6年，耗银约800万两。", "source": "定陵于万历十二年（1584年）十一月动工，万历十八年（1590年）六月地面建筑完工，历时约6年；工程耗银约800万两。", "layer": "ext"}, {"section": "明十三陵", "type": "judge", "q": "\"祾恩\"二字中，\"祾\"取\"罔极之恩\"之意，\"恩\"取\"祭而受福\"之意。", "answer": "错", "explain": "含义恰相反：\"祾\"取\"祭而受福\"之意，\"恩\"取\"罔极之恩\"之意。", "source": "\"祾\"取\"祭而受福\"之意，\"恩\"取\"罔极之恩\"之意（谓至此祭祀可得先帝护佑）。", "layer": "ext"}, {"section": "明十三陵", "type": "multi", "q": "下列关于\"前方后圆\"建筑形制的说法，正确的有（ ）。", "options": ["A. 由明太祖朱元璋的明孝陵首创", "B. 前为方形陵宫院落（祾恩门、祾恩殿等）", "C. 后为圆形宝城宝顶", "D. 十三陵诸陵以长陵为首继承并完善了这一制度", "E. 由明成祖朱棣的长陵首创"], "answer": "ABCD", "explain": "\"前方后圆\"由明孝陵首创而非长陵；长陵为首的十三陵诸陵只是继承并完善了这一制度。", "source": "\"前方后圆\"建筑形制：由明太祖朱元璋的明孝陵首创……十三陵诸陵（以长陵为首）继承并完善了这一制度。", "layer": "ext"}, {"section": "明十三陵", "type": "single", "q": "定陵发掘中，关键的\"指路小石碑\"是在第（ ）条探沟中发现的。", "options": ["A. 一", "B. 二", "C. 三", "D. 四"], "answer": "C", "explain": "发掘中开挖3条探沟，刻\"此石至金刚墙前皮十六丈深三丈五尺\"的指路小石碑在第三条探沟中发现，引导找到地宫入口金刚墙。", "source": "发掘中开挖3条探沟；关键的\"指路小石碑\"（刻\"此石至金刚墙前皮十六丈深三丈五尺\"）是在第三条探沟中发现，引导找到了地宫入口金刚墙。", "layer": "ext"}, {"section": "明十三陵", "type": "judge", "q": "裕陵是明英宗朱祁镇的陵寝，其年号为正统、天顺。", "answer": "对", "explain": "裕陵葬朱祁镇，年号正统、天顺（英宗，夺门之变复辟后改元天顺）。", "source": "裕陵——朱祁镇，年号正统、天顺（英宗，夺门之变复辟后改元天顺）。", "layer": "ext"}, {"section": "明十三陵", "type": "single", "q": "明世宗朱厚熜（嘉靖帝）在位（ ），为明朝在位第二长的皇帝。", "options": ["A. 42年", "B. 45年", "C. 48年", "D. 50年"], "answer": "B", "explain": "嘉靖帝在位45年，为明朝在位第二长的皇帝；最长的是万历帝，在位48年。", "source": "明世宗朱厚熜（嘉靖帝）在位45年，为明朝在位第二长的皇帝。", "layer": "ext"}, {"section": "明十三陵", "type": "multi", "q": "下列关于长陵营建历程的说法，正确的有（ ）。", "options": ["A. 始建于永乐七年（1409年）五月", "B. 永乐十一年（1413年）正月地下玄宫建成", "C. 永乐十四年（1416年）三月祾恩殿建成", "D. 宣德二年（1427年）三月陵园殿宇工程大体告竣", "E. 前后工期近28年"], "answer": "ABCD", "explain": "长陵前后工期近18年，而非28年；其余各节点时间均与原文一致。", "source": "始建于明永乐七年（1409年）五月；永乐十一年（1413年）正月地下玄宫建成；永乐十四年（1416年）三月祾恩殿建成；宣德二年（1427年）三月……大体告竣，前后工期近18年。", "layer": "ext"}, {"section": "明十三陵", "type": "single", "q": "与明成祖朱棣合葬于长陵的仁孝文皇后徐氏，是（ ）的长女。", "options": ["A. 徐达", "B. 赵羾", "C. 廖均卿", "D. 程南云"], "answer": "A", "explain": "长陵墓主为明成祖朱棣与仁孝文皇后徐氏（徐达长女）。赵羾为礼部尚书，廖均卿为风水术士，程南云为书法家。", "source": "墓主人：明成祖朱棣（永乐帝）与仁孝文皇后徐氏（徐达长女）。", "layer": "ext"}, {"section": "明十三陵", "type": "single", "q": "明仁宗朱高炽为其皇考永乐皇帝朱棣初上的庙号是（ ）。", "options": ["A. 太祖", "B. 太宗", "C. 成祖", "D. 世宗"], "answer": "B", "explain": "朱高炽初上朱棣庙号为\"太宗\"（谥\"文皇帝\"），嘉靖十七年（1538年）世宗改庙号为\"成祖\"。", "source": "朱高炽初上朱棣庙号为\"太宗\"（谥\"文皇帝\"）。嘉靖十七年（1538年）世宗朱厚熜改庙号为\"成祖\"。", "layer": "ext"}, {"section": "明十三陵", "type": "multi", "q": "下列关于定陵地宫（地下玄宫）结构的说法，正确的有（ ）。", "options": ["A. 由前、中、后、左、右五座高大殿室组成", "B. 总面积约1195平方米", "C. 全石结构拱券顶、无梁柱", "D. 后室设棺床，停放万历帝及两皇后棺椁", "E. 左右配殿陈列帝后神座与长明灯"], "answer": "ABCD", "explain": "左右配殿为横向长方形，无陈设；帝后汉白玉石神座及黄琉璃五供、青花大瓷缸（长明灯）设于中室。", "source": "中室设帝后汉白玉石神座及黄琉璃五供、青花大瓷缸（长明灯）；后室（最大）设棺床……左右配殿为横向长方形，无陈设。", "layer": "ext"}, {"section": "明十三陵", "type": "single", "q": "长陵始建于（ ）。", "options": ["A. 永乐五年（1407年）", "B. 永乐七年（1409年）", "C. 永乐十一年（1413年）", "D. 永乐十四年（1416年）"], "answer": "B", "explain": "长陵始建于明永乐七年（1409年）五月；1413年玄宫建成，1416年祾恩殿建成。", "source": "修建时间：始建于明永乐七年（1409年）五月。", "layer": "ext"}, {"section": "明十三陵", "type": "single", "q": "长陵地下玄宫建成于（ ）。", "options": ["A. 永乐七年（1409年）", "B. 永乐十一年（1413年）", "C. 永乐十四年（1416年）", "D. 宣德二年（1427年）"], "answer": "B", "explain": "明永乐十一年（1413年）正月长陵玄宫落成；1416年祾恩殿建成，1427年陵园殿宇大体告竣。", "source": "地下玄宫建成时间：明永乐十一年（1413年）正月长陵玄宫落成。", "layer": "ext"}, {"section": "明十三陵", "type": "multi", "q": "长陵祾恩殿所用金丝楠木采自（ ）一带的深山密林。", "options": ["A. 四川", "B. 湖广（湖南、湖北）", "C. 云南", "D. 浙江"], "answer": "ABC", "explain": "楠木采自四川、湖广、云南一带深山密林，采伐转运极为艰难，\"一木至京，费银竟达万两\"。", "source": "楠木采自四川、湖广（湖南、湖北）、云南一带深山密林，采伐转运极为艰难。", "layer": "ext"}, {"section": "明十三陵", "type": "single", "q": "明世宗朱厚熜将长陵陵殿易名为\"祾恩殿\"是在（ ）。", "options": ["A. 洪熙元年（1425年）", "B. 天顺八年（1464年）", "C. 嘉靖十七年（1538年）", "D. 万历十八年（1590年）"], "answer": "C", "explain": "明世宗朱厚熜于嘉靖十七年（1538年）将陵殿易名\"祾恩\"，同年亦改朱棣庙号为\"成祖\"。", "source": "\"祾恩\"含义：明世宗朱厚熜于嘉靖十七年（1538年）将陵殿易名。", "layer": "ext"}, {"section": "明十三陵", "type": "single", "q": "明楼前设石五供的制度首创于（ ）。", "options": ["A. 明孝陵", "B. 长陵", "C. 定陵", "D. 显陵"], "answer": "B", "explain": "石五供系长陵首创（孝陵不设），此后各陵沿以为制，仅供象征性祭祀，不真点香烛。", "source": "五供系长陵首创（孝陵不设），此后各陵沿以为制，仅供象征性祭祀，不真点香烛。", "layer": "ext"}, {"section": "明十三陵", "type": "multi", "q": "安葬于昭陵的皇后有（ ）。", "options": ["A. 孝懿皇后李氏", "B. 孝安皇后陈氏", "C. 孝定皇后李氏", "D. 孝端显皇后王氏"], "answer": "ABC", "explain": "昭陵葬明穆宗朱载坖及孝懿皇后李氏、孝安皇后陈氏、孝定皇后李氏（神宗生母）；孝端显皇后王氏葬定陵。", "source": "昭陵的墓主人是明穆宗朱载坖（隆庆帝）及其三位皇后——孝懿皇后李氏、孝安皇后陈氏、孝定皇后李氏（神宗生母）。", "layer": "ext"}, {"section": "明十三陵", "type": "single", "q": "陵前设立石像生（石翁仲）的传统始于（ ）。", "options": ["A. 秦汉", "B. 唐宋", "C. 元代", "D. 明清"], "answer": "A", "explain": "石像生传统始于秦汉，兴于唐宋，盛于明清；明清（尤其明孝陵）集其大成并制度化。", "source": "石像生（又称石翁仲……）的传统始于秦汉，兴于唐宋，盛于明清。", "layer": "ext"}, {"section": "明十三陵", "type": "single", "q": "现存最早的石像生实物是（ ）。", "options": ["A. 秦始皇铸翁仲铜像", "B. 西汉霍去病墓石雕", "C. 东汉墓前石兽", "D. 明孝陵神道石像生"], "answer": "B", "explain": "现存最早的石像生实物为西汉霍去病墓石雕（马踏匈奴等）；秦始皇翁仲铜像仅为传说。", "source": "现存最早的石像生实物为西汉霍去病墓石雕（马踏匈奴等）。", "layer": "ext"}, {"section": "明十三陵", "type": "single", "q": "十三陵神路（长陵神道）南起（ ），北抵长陵。", "options": ["A. 石牌坊", "B. 大红门", "C. 神功圣德碑亭", "D. 龙凤门"], "answer": "A", "explain": "神路南起石牌坊，北抵长陵；大红门、碑亭、龙凤门均为神路上的建筑设施。", "source": "起止点与长度：神路（长陵神道，又称总神道）南起石牌坊，北抵长陵。", "layer": "ext"}, {"section": "明十三陵", "type": "single", "q": "定陵位于天寿山陵域（ ）。", "options": ["A. 天寿山主峰南麓", "B. 大峪山东麓", "C. 黄山寺一岭之下", "D. 金山西郊"], "answer": "B", "explain": "定陵位于天寿山陵域大峪山东麓；天寿山主峰南麓是长陵，黄山寺一岭之下是献陵。", "source": "位置与朝向：定陵位于天寿山陵域大峪山东麓。", "layer": "ext"}, {"section": "明十三陵", "type": "single", "q": "定陵整体建筑的朝向为（ ）。", "options": ["A. 坐北朝南", "B. 坐西北朝东南", "C. 坐东朝西", "D. 坐南朝北"], "answer": "B", "explain": "定陵依大峪山山势，整体朝向坐西北朝东南，与十三陵多数帝陵坐北朝南略有偏转。", "source": "整体建筑朝向为坐西北朝东南（依大峪山山势，与十三陵多数帝陵坐北朝南略有偏转）。", "layer": "ext"}, {"section": "明十三陵", "type": "single", "q": "定陵地宫（地下玄宫）距地面深约（ ）。", "options": ["A. 17米", "B. 22米", "C. 27米", "D. 37米"], "answer": "C", "explain": "定陵地宫距地面深约27米，由前、中、后、左、右五座高大殿室组成。", "source": "地宫（地下玄宫）距地面深约27米，由前、中、后、左、右五座高大殿室组成。", "layer": "ext"}, {"section": "明十三陵", "type": "single", "q": "定陵地宫出土的十二龙九凤冠，现收藏于（ ）。", "options": ["A. 故宫博物院", "B. 中国国家博物馆", "C. 明十三陵（定陵）博物馆", "D. 首都博物馆"], "answer": "C", "explain": "定陵出土的十二龙九凤冠收藏于明十三陵（定陵）博物馆。", "source": "十二龙九凤冠收藏地点：明十三陵（定陵）博物馆。", "layer": "ext"}, {"section": "明十三陵", "type": "single", "q": "昭陵的墓主人是（ ）。", "options": ["A. 明穆宗朱载坖", "B. 明神宗朱翊钧", "C. 明光宗朱常洛", "D. 明熹宗朱由校"], "answer": "A", "explain": "昭陵墓主为明穆宗朱载坖（隆庆帝）及其三位皇后；朱翊钧葬定陵，朱常洛葬庆陵，朱由校葬德陵。", "source": "昭陵的墓主人是明穆宗朱载坖（隆庆帝）及其三位皇后。", "layer": "ext"}, {"section": "明十三陵", "type": "single", "q": "定陵发掘中，\"指路小石碑\"引导考古人员找到了地宫入口的（ ）。", "options": ["A. 金刚墙", "B. 宝城", "C. 月牙城", "D. 明楼"], "answer": "A", "explain": "小石碑刻\"此石至金刚墙前皮十六丈深三丈五尺\"，在第三条探沟中发现，引导找到地宫入口金刚墙。", "source": "关键的\"指路小石碑\"……引导找到了地宫入口金刚墙。", "layer": "ext"}, {"section": "周口店北京人遗址", "layer": "core", "type": "single", "q": "世界遗产委员会评价周口店遗址为'远古时期亚洲大陆人类社会罕见的历史证据、阐明人类进化进程'，该遗址列入《世界遗产名录》的时间是？", "options": ["A.1987年", "B.1985年", "C.1994年", "D.2014年"], "answer": "A", "explain": "周口店北京人遗址1987年列入《世界遗产名录》。", "source": "1987年列入世界遗产；'远古时期亚洲大陆人类社会罕见历史证据、阐明人类进化进程'"}, {"section": "周口店北京人遗址", "layer": "core", "type": "judge", "q": "周口店北京人遗址于1987年被联合国教科文组织世界遗产委员会列入《世界遗产名录》。", "answer": "对", "explain": "周口店北京人遗址1987年列入世界遗产，世界遗产委员会评价其为'远古时期亚洲大陆人类社会罕见的历史证据、阐明人类进化进程'。", "source": "1987年列入世界遗产；'远古时期亚洲大陆人类社会罕见历史证据、阐明人类进化进程'"}, {"section": "周口店北京人遗址", "layer": "core", "type": "multi", "q": "周口店遗址呈现出清晰的人类演化序列，包括下列哪些阶段？", "options": ["A.直立人", "B.早期智人", ": "等级：国家一级博物馆。建筑形式源于……石器。藏品数量：馆藏文物7000多件。涵盖直立人、早期智人和晚期智人三个阶段。新馆建筑面积8093平方米……为老馆8倍。", "layer": "ext"}, {"section": "周口店北京人遗址", "type": "single", "q": "周口店猿人洞（第1地点）巨厚洞穴堆积的形成原因是（ ）。", "options": ["A. 河流长期冲积而成", "B. \"北京人\"长期居住的遗骨遗物与洞顶塌落石块、洞外流入泥沙层层堆积而成", "C. 火山喷发物堆积而成", "D. 冰川搬运沉积而成"], "answer": "B", "explain": "\"北京人\"在此断断续续生活近50万年，其遗骨、遗物、遗迹与洞顶塌落石块、洞外流入泥沙层层堆积而成。", "source": "\"北京人\"在此断断续续生活近50万年，其遗骨、遗物、遗迹与洞顶塌落的石块、洞外流入的泥沙在洞内一层层填充、堆积而成。", "layer": "ext"}, {"section": "周口店北京人遗址", "type": "single", "q": "因早年常有野鸽子栖息而得名的\"鸽子堂\"，1930年起的发掘主要证明了\"北京人\"（ ）。", "options": ["A. 已会建造房屋", "B. 已会制造石器并使用火", "C. 已会驯养家畜", "D. 已会种植谷物"], "answer": "B", "explain": "鸽子堂出土大量石制品（刮削器、尖状器、砍砸器等）和丰富的用火遗迹，证明\"北京人\"已会制造石器并使用火。", "source": "鸽子堂（第1地点）出土大量石制品……和丰富的用火遗迹……证明\"北京人\"已会制造石器并使用火。", "layer": "ext"}, {"section": "周口店北京人遗址", "type": "single", "q": "1941年太平洋战争爆发前后，在转运过程中遗失的原存于北京的\"北京人\"与\"山顶洞人\"人类化石和动物化石共有（ ）。", "options": ["A. 50多件", "B. 100多件", "C. 200多件", "D. 300多件"], "answer": "B", "explain": "1941年前后，100余件人类化石及动物化石在转运过程中遗失，至今下落不明。", "source": "原存于北京的\"北京人\"与\"山顶洞人\"化石（100余件人类化石及动物化石）在转运过程中遗失，至今下落不明。", "layer": "ext"}, {"section": "周口店北京人遗址", "type": "single", "q": "田园洞（第27地点）出土的\"田园洞人\"（早期现代人）化石，距今约（ ）。", "options": ["A. 70万—20万年", "B. 14万年", "C. 4.2万—3.85万年", "D. 1.8万年"], "answer": "C", "explain": "田园洞2001年发现、2003—2004年发掘，出土距今约4.2万—3.85万年的\"田园洞人\"化石34件。", "source": "出土距今约4.2万—3.85万年的\"田园洞人\"（早期现代人）化石34件及大量哺乳动物化石。", "layer": "ext"}, {"section": "周口店北京人遗址", "type": "single", "q": "周口店遗址第14地点（俗称\"鱼岭\"）出土的鱼化石，形成于（ ）。", "options": ["A. 更新世", "B. 中新世", "C. 上新世", "D. 全新世"], "answer": "B", "explain": "第14地点出土鱼化石约2000尾，形成于中新世（约距今1400万年前）。", "source": "第14地点（俗称\"鱼岭\"）出土鱼化石约2000尾，形成于中新世（约距今1400万年前）。", "layer": "ext"}, {"section": "周口店北京人遗址", "type": "single", "q": "周口店遗址发现不同时期各类化石和文化遗物的地点共有（ ）。", "options": ["A. 14处", "B. 21处", "C. 27处", "D. 33处"], "answer": "C", "explain": "周口店遗址发现不同时期各类化石和文化遗物地点的数量为27处。", "source": "周口店遗址发现不同时期各类化石和文化遗物地点的数量：27处。", "layer": "ext"}, {"section": "周口店北京人遗址", "type": "single", "q": "2015年，周口店遗址博物馆新馆基本陈列荣获的奖项是（ ）。", "options": ["A. 联合国教科文组织亚太地区文化遗产保护奖·创新奖", "B. 亚洲建筑师协会建筑奖保护项目类金奖", "C. 第十二届（2014年度）全国博物馆十大陈列展览精品奖", "D. 中国钢结构工程奖金奖"], "answer": "C", "explain": "2015年新馆基本陈列获第十二届（2014年度）全国博物馆十大陈列展览精品奖；其余三项为猿人洞保护棚所获奖项。", "source": "2015年，周口店遗址博物馆新馆基本陈列荣获第十二届（2014年度）全国博物馆十大陈列展览精品奖。", "layer": "ext"}, {"section": "大运河", "layer": "core", "type": "single", "q": "北京现存规模最大、现状保存最完好的皇家仓廒是？", "options": ["A.南新仓", "B.北新仓", "C.禄米仓", "D.富新仓"], "answer": "A", "explain": "南新仓是北京现存规模最大、现状保存最完好的皇家仓廒，明永乐年间始建，位于东城区东四十条。", "source": "南新仓、明永乐年间始建、东城区东四十条"}, {"section": "大运河", "layer": "core", "type": "judge", "q": "2014年6月22日，在卡塔尔多哈召开的第38届世界遗产大会上，中国大运河被列入《世界遗产名录》。", "answer": "对", "explain": "2014年6月22日，第38届世界遗产大会在卡塔尔多哈召开，中国大运河列入《世界遗产名录》，含27段河道、31处遗产点，总长约1011公里。", "source": "2014年6月22日、卡塔尔多哈、第38届世界遗产大会"}, {"section": "大运河", "layer": "core", "type": "multi", "q": "中国大运河由下列哪几部分组成？", "options": ["A.隋唐大运河", "B.京杭大运河", "C.浙东运河", "D.灵渠"], "answer": "ABC", "explain": "中国大运河由隋唐大运河、京杭大运河、浙东运河三部分组成，含27段河道、31处遗产点，总长约1011公里。", "source": "隋唐大运河、京杭大运河、浙东运河"}, {"section": "大运河", "layer": "core", "type": "single", "q": "列入《世界遗产名录》的中国大运河包含的河道数量和遗产点数量分别是？", "options": ["A.27段河道、31处遗产点", "B.31段河道、27处遗产点", "C.27段河道、35处遗产点", "D.24段河道、31处遗产点"], "answer": "A", "explain": "中国大运河含27段河道、31处遗产点，总长约1011公里；35为沿线城市数量级干扰（35座地级市），24为通惠河水闸数。", "source": "27段河道、31处遗产点、总长约1011公里"}, {"section": "大运河", "layer": "core", "type": "judge", "q": "银锭桥旁以烤肉闻名的餐饮老字号'烤肉季'创立于清道光二十八年（1848年），素有'南宛北季'之称。", "answer": "对", "explain": "烤肉季创立于清道光二十八年（1848年），与'南宛'并称'南宛北季'。", "source": "烤肉季、清道光二十八年（1848年）、'南宛北季'"}, {"section": "大运河", "layer": "core", "type": "single", "q": "下列水系中，不属于中国大运河贯通的五大水系的是？", "options": ["A.海河", "B.淮河", "C.珠江", "D.钱塘江"], "answer": "C", "explain": "大运河贯通海河、黄河、淮河、长江、钱塘江五大水系，不包括珠江。", "source": "海河、黄河、淮河、长江、钱塘江五大水系"}, {"section": "大运河", "layer": "core", "type": "judge", "q": "中国大运河始凿于春秋时期，公元前486年吴国开凿邗沟。", "answer": "对", "explain": "中国大运河始凿于春秋时期，公元前486年吴国开凿邗沟。", "source": "春秋时期、公元前486年、吴国邗沟"}, {"section": "大运河", "layer": "core", "type": "multi", "q": "中国大运河在世界运河史上的地位体现为？", "options": ["A.建造时间最早", "B.规模最大", "C.里程最长", "D.水闸数量最多"], "answer": "ABC", "explain": "中国大运河是世界上建造时间最早、规模最大、里程最长的运河。", "source": "建造时间最早、规模最大、里程最长"}, {"section": "大运河", "layer": "core", "type": "single", "q": "中国大运河沿线共涉及几个省级行政区？", "options": ["A.8个", "B.6个", "C.10个", "D.35个"], "answer": "A", "explain": "大运河沿线涉及8个省级行政区（2个直辖市、6个省）、35座地级市。", "source": "8个省级行政区（2直辖市6省）、35座地级市"}, {"section": "大运河", "layer": "core", "type": "judge", "q": "京杭大运河全长约1797公里，约为苏伊士运河长度的3倍。", "answer": "错", "explain": "京杭大运河全长约1797公里，苏伊士运河约190公里，前者约为后者的9～10倍，而非3倍。", "source": "全长约1797公里、苏伊士约190公里、约9～10倍"}, {"section": "大运河", "layer": "core", "type": "single", "q": "万宁桥俗称'后门桥'，其得名的原因是？", "options": ["A.位于地安门（后门）之南、紧邻后门", "B.位于正阳门以北", "C.因桥身设有前后两个桥门", "D.为元代皇城后门所在"], "answer": "A", "explain": "万宁桥位于地安门外、地安门（后门）之南，紧邻后门，故俗称'后门桥'。大运河北京段遗产点澄清闸（上闸、中闸）2处即在万宁桥下、什刹海—地安门外一带。", "source": "地安门外、地安门（后门）之南、紧邻后门"}, {"section": "大运河", "layer": "core", "type": "judge", "q": "通惠河由郭守敬主持开挖，1291年开工，1294年通航。", "answer": "错", "explain": "通惠河由郭守敬主持开挖，1291年开工、1293年通航。", "source": "郭守敬（1291年开工、1293年通航）"}, {"section": "大运河", "layer": "core", "type": "multi", "q": "隋唐大运河的组成部分包括？", "options": ["A.广通渠（通济渠）", "B.永济渠", "C.邗沟", "D.江南河", "E.通惠河"], "answer": "ABCD", "explain": "隋唐大运河由广通渠（通济渠）、永济渠、邗沟、江南河组成；通惠河属京杭大运河河段，为元代郭守敬主持开挖。", "source": "广通渠（通济渠）、永济渠、邗沟、江南河"}, {"section": "大运河", "layer": "core", "type": "single", "q": "2024年2月，北京大运河文化旅游景区获评国家5A级旅游景区，它是北京市第几家、通州区第几家5A景区？", "options": ["A.第9家、首家", "B.第8家、首家", "C.第9家、第2家", "D.第10家、首家"], "answer": "A", "explain": "2024年2月，北京大运河文化旅游景区成为北京市第9家、通州区首家国家5A级旅游景区，注意不是2022年。", "source": "2024年2月、北京市第9家、通州区首家（勿混：非2022年）"}, {"section": "大运河", "layer": "core", "type": "judge", "q": "明代通惠河的起点是积水潭。", "answer": "错", "explain": "明代通惠河起点为玉泉山；积水潭是元代通惠河的起点（大都积水潭→通州张家湾入白河）。", "source": "大都积水潭→通州张家湾入白河、全长164里；玉泉山"}, {"section": "大运河", "layer": "core", "type": "single", "q": "隋朝大运河连通的政治中心是？", "options": ["A.洛阳", "B.涿郡", "C.余杭", "D.中都"], "answer": "A", "explain": "隋朝大运河以洛阳为中心，北抵涿郡（今北京）、南至余杭（今杭州）；中都为金代漕运中心。", "source": "洛阳、北抵涿郡（北京）、南至余杭（杭州）"}, {"section": "大运河", "layer": "core", "type": "judge", "q": "八里桥的正式名称为永通桥，其中孔净高约8.5米。", "answer": "对", "explain": "八里桥正式名称为永通桥，中孔净高约8.5米；注意8.5米是孔高，并非桥面高（13米之说不取）。", "source": "永通桥；中孔净高约8.5米（勿混：孔高8.5米、非桥面高13米）"}, {"section": "大运河", "layer": "core", "type": "multi", "q": "京杭大运河是元明清漕运大动脉、承担'南粮北运'，其分段包括？", "options": ["A.通惠河", "B.会通河", "C.淮扬运河（里运河）", "D.江南运河", "E.灵渠"], "answer": "ABCD", "explain": "京杭大运河共分七段：通惠河、北运河、南运河、会通河、中河、淮扬运河（里运河）、江南运河；灵渠不在其列。", "source": "元明清漕运大动脉、南粮北运；通惠河、北运河、南运河、会通河、中河、淮扬运河（里运河）、江南运河七段"}, {"section": "大运河", "layer": "core", "type": "single", "q": "金代的漕运中心是？", "options": ["A.洛阳", "B.开封", "C.中都", "D.余杭"], "answer": "C", "explain": "金代漕运中心为中都（燕京/今北京）。", "source": "中都（燕京/北京）"}, {"section": "大运河", "layer": "core", "type": "judge", "q": "通惠河沿线共有24座水闸，其中澄清闸在元代至元年间定名之前称'平津闸'。", "answer": "错", "explain": "澄清闸在元代至元年间定名之前称'海子闸'；平津闸（高碑店闸）是保存最完整的运河古闸。", "source": "24座；平津闸（高碑店闸）；海子闸；澄清闸元代（至元定名）之前的名称"}, {"section": "大运河", "layer": "core", "type": "single", "q": "京杭大运河七段中位置最北的一段是？", "options": ["A.通惠河", "B.北运河", "C.南运河", "D.会通河"], "answer": "A", "explain": "京杭大运河最北段为通惠河；通惠河（及北运河）也是北京地区漕运最发达的水道。", "source": "通惠河、北运河、南运河、会通河、中河、淮扬运河（里运河）、江南运河七段；通惠河"}, {"section": "大运河", "layer": "core", "type": "multi", "q": "'运河四大名塔'包括？", "options": ["A.通州燃灯塔（北京）", "B.临清舍利宝塔（山东）", "C.扬州文峰塔（江苏）", "D.杭州六和塔（浙江）", "E.西安大雁塔"], "answer": "ABCD", "explain": "运河四大名塔为通州燃灯塔、临清舍利宝塔、扬州文峰塔、杭州六和塔；燃灯塔重建于清康熙三十五年（1696年），博雅塔即仿通州燃灯塔而建。", "source": "通州燃灯塔（北京）、临清舍利宝塔（山东）、扬州文峰塔（江苏）、杭州六和塔（浙江）；清康熙三十五年（1696年）；仿通州燃灯塔"}, {"section": "大运河", "layer": "core", "type": "single", "q": "明代北京城城砖的主要产地是？", "options": ["A.山东临清", "B.江苏扬州", "C.浙江杭州", "D.河北通州"], "answer": "A", "explain": "明代北京城城砖为'临清砖'，产自山东临清。", "source": "临清砖、山东临清"}, {"section": "大运河", "layer": "core", "type": "single", "q": "'通惠河'之名由谁赐名？", "options": ["A.元世祖忽必烈", "B.郭守敬", "C.元太宗窝阔台", "D.明成祖朱棣"], "answer": "A", "explain": "通惠河由郭守敬主持开挖，元世祖忽必烈赐名'通惠河'；注意区分主持开挖者与命名者。", "source": "元世祖忽必烈赐名"}, {"section": "大运河", "layer": "core", "type": "multi", "q": "下列位于什刹海—积水潭沿岸的名人故居、纪念馆有？", "options": ["A.宋庆龄故居", "B.郭沫若纪念馆", "C.老舍故居（丹柿小院）", "D.郭守敬纪念馆", "E.鲁迅故居"], "answer": "ABCD", "explain": "郭守敬纪念馆位于积水潭北岸；什刹海沿岸还有梅兰芳纪念馆、恭王府、醇亲王府等；鲁迅故居不在其列。", "source": "郭守敬纪念馆；宋庆龄故居、郭沫若纪念馆、梅兰芳纪念馆、老舍故居（丹柿小院）、恭王府、醇亲王府"}, {"section": "大运河", "layer": "core", "type": "single", "q": "元代通惠河自大都积水潭至通州张家湾入白河，全长多少里？", "options": ["A.164里", "B.1797里", "C.190里", "D.1011里"], "answer": "A", "explain": "元代通惠河自大都积水潭至通州张家湾入白河，全长164里。", "source": "大都积水潭→通州张家湾入白河、全长164里"}, {"section": "大运河", "layer": "core", "type": "single", "q": "北京地区水利工程技术水平达到历史最高点的时期是？", "options": ["A.元代", "B.金代", "C.明代", "D.清代"], "answer": "A", "explain": "元代郭守敬主持通惠河与白浮堰引水工程，标志着北京地区水利工程技术水平达到历史最高点。", "source": "元代、郭守敬通惠河与白浮堰引水工程"}, {"section": "大运河", "layer": "core", "type": "single", "q": "北京地区现存最古老孔庙之一的通州文庙始建时间是？", "options": ["A.元大德二年（1298年）", "B.元至元二十八年（1291年）", "C.元至元三十年（1293年）", "D.清康熙三十五年（1696年）"], "answer": "A", "explain": "通州文庙始建于元大德二年（1298年），是北京地区现存最古老的孔庙之一。", "source": "元大德二年（1298年）、北京地区现存最古老孔庙之一"}, {"section": "大运河", "type": "single", "q": "中国大运河被列入《世界遗产名录》的时间是（　）。", "options": ["A. 2012年6月", "B. 2014年6月", "C. 2016年6月", "D. 2018年6月"], "answer": "B", "explain": "2014年6月22日，第38届世界遗产大会（多哈）列入《世界遗产名录》。", "source": "中国大运河于2014年6月22日在卡塔尔首都多哈召开的第38届世界遗产大会上，被联合国教科文组织列入《世界遗产名录》。", "layer": "ext"}, {"section": "大运河", "type": "judge", "q": "中国大运河于2014年6月22日在卡塔尔首都多哈召开的第38届世界遗产大会上，被联合国教科文组织列入《世界遗产名录》。", "answer": "对", "explain": "与原文一致：2014年6月22日，多哈，第38届世界遗产大会。", "source": "中国大运河于2014年6月22日在卡塔尔首都多哈召开的第38届世界遗产大会上，被联合国教科文组织列入《世界遗产名录》。", "layer": "ext"}, {"section": "大运河", "type": "multi", "q": "下列属于“中国大运河”组成部分的有（　）。", "options": ["A. 隋唐大运河", "B. 京杭大运河", "C. 浙东运河", "D. 灵渠", "E. 郑国渠"], "answer": "ABC", "explain": "中国大运河由隋唐大运河、京杭大运河、浙东运河三大部分组成；灵渠、郑国渠不在其列。", "source": "中国大运河是世界上建造时间最早、规模最大、里程最长的人工运河，由隋唐大运河、京杭大运河、浙东运河三大部分组成（统称“中国大运河”）。", "layer": "ext"}, {"section": "大运河", "type": "single", "q": "根据申遗资料，中国大运河由27段河道与31处遗产点构成，其河道总长度约为（　）。", "options": ["A. 58公里", "B. 190公里", "C. 1011公里", "D. 1797公里"], "answer": "C", "explain": "申遗口径河道总长度约1011公里；1797公里为京杭大运河全长。", "source": "根据申遗资料，中国大运河由27段河道与31处遗产点构成（合计58处遗产点段），河道总长度约1011公里。", "layer": "ext"}, {"section": "大运河", "type": "judge", "q": "中国大运河由隋唐大运河、京杭大运河、浙东运河三大部分组成，统称“中国大运河”。", "answer": "对", "explain": "与原文一致，三大部分为隋唐大运河、京杭大运河、浙东运河。", "source": "中国大运河是世界上建造时间最早、规模最大、里程最长的人工运河，由隋唐大运河、京杭大运河、浙东运河三大部分组成（统称“中国大运河”）。", "layer": "ext"}, {"section": "大运河", "type": "single", "q": "北京（通州）大运河文化旅游景区被确定为国家5A级旅游景区的时间是（　）。", "options": ["A. 2012年1月", "B. 2014年6月", "C. 2024年2月", "D. 2019年2月"], "answer": "C", "explain": "2024年2月（文旅部2024年批次）确定为5A，为北京市第9家、通州区首家。", "source": "北京（通州）大运河文化旅游景区于2024年2月（文旅部2024年批次）被确定为国家5A级旅游景区，成为北京市第9家、通州区首家国家5A级旅游景区。", "layer": "ext"}, {"section": "大运河", "type": "judge", "q": "大运河贯通海河、黄河、淮河、长江、珠江五大水系。", "answer": "错", "explain": "五大水系为海河、黄河、淮河、长江、钱塘江，不是珠江。", "source": "大运河贯通海河、黄河、淮河、长江、钱塘江五大水系", "layer": "ext"}, {"section": "大运河", "type": "multi", "q": "大运河贯通的五大水系包括（　）。", "options": ["A. 海河", "B. 黄河", "C. 淮河", "D. 长江", "E. 珠江"], "answer": "ABCD", "explain": "五大水系为海河、黄河、淮河、长江、钱塘江，不包括珠江。", "source": "大运河贯通海河、黄河、淮河、长江、钱塘江五大水系", "layer": "ext"}, {"section": "大运河", "type": "single", "q": "中国大运河最早开凿可追溯至春秋时期（公元前486年），吴国在江淮间开凿的最早河段是（　）。", "options": ["A. 邗沟", "B. 永济渠", "C. 江南河", "D. 通济渠"], "answer": "A", "explain": "公元前486年吴国在江淮间开凿邗沟，为大运河最早河段。", "source": "中国大运河最早开凿可追溯至春秋时期（公元前486年，吴国在江淮间开凿邗沟，为大运河最早河段）", "layer": "ext"}, {"section": "大运河", "type": "judge", "q": "元代科学家郭守敬主持规划并主持开挖通惠河，通惠河之名由元世祖忽必烈赐名。", "answer": "对", "explain": "与原文一致：郭守敬主持开挖，忽必烈赐名，取“通达惠济”之意。", "source": "元代科学家、天文学家、水利家郭守敬主持规划并主持开挖通惠河。通惠河之名由元世祖忽必烈赐名（取“通达惠济”之意）。", "layer": "ext"}, {"section": "大运河", "type": "single", "q": "隋唐大运河连通的政治中心是（　），北抵涿郡，南至余杭。", "options": ["A. 长安", "B. 洛阳", "C. 开封", "D. 大都"], "answer": "B", "explain": "隋唐大运河以洛阳为中心，北抵涿郡（今北京），南至余杭（今杭州）。", "source": "隋朝大运河连通的政治中心：以洛阳为中心，北抵涿郡（今北京），南至余杭（今杭州）。", "layer": "ext"}, layer": "ext"}, {"section": "大运河", "type": "multi", "q": "京杭大运河自北向南分为七段，下列属于其分段的有（　）。", "options": ["A. 通惠河", "B. 北运河", "C. 会通河", "D. 淮扬运河（里运河）", "E. 浙东运河"], "answer": "ABCD", "explain": "京杭大运河七段为通惠河、北运河、南运河、会通河、中河、淮扬运河（里运河）、江南运河；浙东运河属中国大运河三大组成部分之一，不在京杭大运河七段之内。", "source": "自北向南分为通惠河、北运河、南运河、会通河、中河、淮扬运河（里运河）、江南运河七段。", "layer": "ext"}, {"section": "大运河", "type": "single", "q": "中国大运河被列入《世界遗产名录》，是在联合国教科文组织第（　）届世界遗产大会上。", "options": ["A. 第35届", "B. 第36届", "C. 第37届", "D. 第38届"], "answer": "D", "explain": "2014年6月22日在卡塔尔多哈召开的第38届世界遗产大会上列入《世界遗产名录》。", "source": "中国大运河于2014年6月22日在卡塔尔首都多哈召开的第38届世界遗产大会上，被联合国教科文组织列入《世界遗产名录》。", "layer": "ext"}, {"section": "大运河", "type": "single", "q": "大运河沿线涉及的省级行政区共有（　）。", "options": ["A. 6个", "B. 7个", "C. 8个", "D. 10个"], "answer": "C", "explain": "沿线涉及北京、天津、河北、山东、河南、安徽、江苏、浙江8个省级行政区（2个直辖市、6个省），流经35座地级市。", "source": "沿线涉及北京、天津、河北、山东、河南、安徽、江苏、浙江8个省级行政区（2个直辖市、6个省），流经35座地级市（含直辖市辖区）级别城市。", "layer": "ext"}, {"section": "大运河", "type": "multi", "q": "下列属于元代郭守敬主持的水利工程及其成就的有（　）。", "options": ["A. 主持规划并开挖通惠河", "B. 白浮堰引水工程", "C. 解决大都漕运“水脊”难题", "D. 使江南漕船直抵积水潭", "E. 主持修建永通桥"], "answer": "ABCD", "explain": "元代郭守敬规划通惠河、白浮堰引水工程，解决大都漕运“水脊”难题，使江南漕船直抵积水潭；永通桥（八里桥）非其所建。", "source": "北京地区水利工程技术水平达到历史最高点的时期是元代（以郭守敬规划通惠河、白浮堰引水工程为代表，解决了大都漕运“水脊”难题，使江南漕船直抵积水潭）。", "layer": "ext"}, {"section": "大运河", "type": "single", "q": "金代迁都后成为漕运中心的城市是（　）。", "options": ["A. 洛阳", "B. 涿郡", "C. 余杭", "D. 中都"], "answer": "D", "explain": "金代迁都中都（今北京），中都（燕京/北京）成为漕运中心。", "source": "金代漕运中心：金代迁都中都（今北京），中都（燕京/北京）成为漕运中心。", "layer": "ext"}, {"section": "大运河", "type": "single", "q": "通州八里桥（永通桥）为三孔石拱桥，正中中间孔净高约（　），以便漕运船只通过。", "options": ["A. 约6.5米", "B. 约8.5米", "C. 约13米", "D. 约19.5米"], "answer": "B", "explain": "中孔净高约8.5米；19.5米为中孔净跨，13米为“桥面距水面”另一说。", "source": "永通桥为三孔石拱桥，正中中间孔（中孔）净高约8.5米（中孔净跨约19.5米），以便漕运船只通过。", "layer": "ext"}, {"section": "大运河", "type": "multi", "q": "下列关于通惠河的说法正确的有（　）。", "options": ["A. 河名由元世祖忽必烈赐名", "B. 取“通达惠济”之意", "C. 元代开通时沿河修筑水闸24座", "D. 澄清闸在元代原名海子闸", "E. 明代重修后以积水潭为水源起点"], "answer": "ABCD", "explain": "明代重修后通惠河改以玉泉山为水源起点，而非积水潭；其余四项均与原文一致。", "source": "通惠河之名由元世祖忽必烈赐名（取“通达惠济”之意）……沿河修筑水闸24座……澄清闸，在元代原名海子闸……明代重修后，通惠河改以玉泉山为水源起点。", "layer": "ext"}, {"section": "大运河", "type": "single", "q": "下列不属于“中国大运河”三大组成部分的是（　）。", "options": ["A. 隋唐大运河", "B. 京杭大运河", "C. 浙东运河", "D. 灵渠"], "answer": "D", "explain": "中国大运河由隋唐大运河、京杭大运河、浙东运河三大部分组成，灵渠不在其列。", "source": "中国大运河……由隋唐大运河、京杭大运河、浙东运河三大部分组成（统称“中国大运河”）。", "layer": "ext"}, {"section": "大运河", "type": "single", "q": "北京大学未名湖畔的博雅塔，是仿（　）形制而建的八角密檐式塔。", "options": ["A. 临清舍利宝塔", "B. 扬州文峰塔", "C. 通州燃灯塔", "D. 杭州六和塔"], "answer": "C", "explain": "博雅塔仿通州燃灯塔形制而建，1924年建，原为校园水塔。", "source": "北京大学未名湖畔的博雅塔，是仿通州燃灯塔形制而建的八角密檐式塔（1924年建，原为校园水塔）。", "layer": "ext"}, {"section": "大运河", "type": "single", "q": "万宁桥俗称“后门桥”，其中“后门”指的是明清皇城北门（　）。", "options": ["A. 天安门", "B. 地安门", "C. 德胜门", "D. 正阳门"], "answer": "B", "explain": "地安门为明清皇城北门，俗称“后门”，万宁桥紧邻其南，故俗称“后门桥”。", "source": "万宁桥……位于地安门外、地安门（明清皇城北门，俗称“后门”）之南，因紧邻“后门”且为桥，故民间俗称“后门桥”。", "layer": "ext"}, {"section": "大运河", "type": "single", "q": "位于西城区积水潭（西海）北岸、展示元代科学家水利与天文成就的名人纪念馆是（　）。", "options": ["A. 郭沫若纪念馆", "B. 梅兰芳纪念馆", "C. 郭守敬纪念馆", "D. 宋庆龄故居"], "answer": "C", "explain": "郭守敬纪念馆位于西城区德胜门西大街甲60号（西海北岸），纪念元代科学家郭守敬。", "source": "积水潭（西海）北岸的名人纪念馆：郭守敬纪念馆，位于西城区德胜门西大街甲60号（西海北岸），纪念元代科学家郭守敬。", "layer": "ext"}, {"section": "大运河", "type": "single", "q": "目前保存最完整的运河古闸是（　）。", "options": ["A. 澄清闸", "B. 海子闸", "C. 平津闸（高碑店闸）", "D. 万宁闸"], "answer": "C", "explain": "今平津闸（高碑店闸）是目前保存最完整的运河古闸。", "source": "保存最完整的运河古闸：今平津闸（高碑店闸）。", "layer": "ext"}, {"section": "大运河", "type": "single", "q": "北京现存规模最大、现状保存最完好的皇家仓廒是（　）。", "options": ["A. 南新仓", "B. 北新仓", "C. 富新仓", "D. 海运仓"], "answer": "A", "explain": "南新仓是北京现存规模最大、保存最完好的皇家仓廒，为明清两代储藏漕粮的“京仓”之一。", "source": "南新仓是北京现存规模最大、保存最完好的皇家仓廒（明清两代储藏漕粮的“京仓”之一）。", "layer": "ext"}, {"section": "大运河", "type": "single", "q": "银锭桥旁以烤肉闻名京华的餐饮老字号是（　）。", "options": ["A. 烤肉季", "B. 全聚德", "C. 便宜坊", "D. 砂锅居"], "answer": "A", "explain": "银锭桥旁以烤肉闻名京华的餐饮老字号为烤肉季（全称“烤肉季饭庄”）。", "source": "银锭桥旁以烤肉闻名京华的餐饮老字号：烤肉季（全称“烤肉季饭庄”）。", "layer": "ext"}, {"section": "中轴线", "layer": "core", "type": "single", "q": "北京最早出现城市是在西周初年（约前1045年），当时召公封燕，所建之城为（ ）。", "options": ["A.蓟城", "B.南京", "C.大兴城", "D.元大都"], "answer": "A", "explain": "西周初年（约前1045年）召公封燕，建蓟城，这是北京最早出现的城市。", "source": "西周初年（约前1045年）、召公封燕、蓟城"}, {"section": "中轴线", "layer": "core", "type": "judge", "q": "天安门广场自建成后先后进行过四次改扩建。", "answer": "对", "explain": "天安门是中轴线上规模最大、等级最高的城门，天安门广场历经四次改扩建。", "source": "中轴线上规模最大、等级最高的城门；天安门广场改扩建次数——天安门；四次"}, {"section": "中轴线", "layer": "core", "type": "multi", "q": "下列属于北京中轴线所表达哲学理念的有（ ）。", "options": ["A.中正、中和、中庸", "B.天人合一", "C.以中为尊、居中而治", "D.家国同构", "E.存放卤簿仪仗"], "answer": "ABCD", "explain": "北京中轴线表达中正、中和、中庸，天人合一、礼乐交融、尊卑有序、家国同构，以中为尊、居中而治的哲学理念。\"存放卤簿仪仗\"是端门的功能，非哲学理念。", "source": "中正、中和、中庸；天人合一、礼乐交融、尊卑有序、家国同构；以中为尊、居中而治"}, {"section": "中轴线", "layer": "core", "type": "single", "q": "辽代\"五京\"之中，北京被称为（ ）。", "options": ["A.南京（燕京、析津府）", "B.蓟城", "C.大兴城", "D.元大都"], "answer": "A", "explain": "辽代\"五京\"中北京为南京，又称燕京、析津府。", "source": "辽代\"五京\"中北京的名称——南京（燕京、析津府）"}, {"section": "中轴线", "layer": "core", "type": "judge", "q": "北京城的营造遵循《周礼·考工记》\"右祖左社、面朝后市\"的原则，并呈中轴线对称格局。", "answer": "错", "explain": "应为\"左祖右社、面朝后市\"，而非\"右祖左社\"。", "source": "《周礼·考工记》\"左祖右社、面朝后市\"、中轴线对称"}, {"section": "中轴线", "layer": "core", "type": "single", "q": "北京城的营造遵循\"左祖右社、面朝后市\"及中轴线对称的原则，该原则出自（ ）。", "options": ["A.《周礼·考工记》", "B.《龙须沟》", "C.《皇都篇》", "D.《帝都篇》"], "answer": "A", "explain": "北京城的营造遵循《周礼·考工记》\"左祖右社、面朝后市\"、中轴线对称的原则。", "source": "《周礼·考工记》\"左祖右社、面朝后市\"、中轴线对称"}, {"section": "中轴线", "layer": "core", "type": "judge", "q": "中国最早出现中轴线规划格局的都城是汉代长安城，由宇文恺主持规划。", "answer": "错", "explain": "最早出现中轴线规划格局的是隋代大兴城（唐长安城），而非汉代长安城；宇文恺主持规划属实。", "source": "中国最早出现中轴线规划格局的时期和地点——隋代大兴城（唐长安城）、宇文恺"}, {"section": "中轴线", "layer": "core", "type": "multi", "q": "下列建筑位于北京中轴线沿线的有（ ）。", "options": ["A.万宁桥", "B.景山", "C.端门", "D.正阳门", "E.太庙"], "answer": "ABCD", "explain": "中轴线沿线主要建筑为万宁桥→景山→故宫→端门→天安门→外金水桥→天安门广场建筑群→正阳门→南段道路遗存。太庙为中轴线两侧坛庙，不在此序列中。", "source": "万宁桥→景山→故宫→端门→天安门→外金水桥→天安门广场建筑群→正阳门→南段道路遗存"}, {"section": "中轴线", "layer": "core", "type": "single", "q": "中国最早出现中轴线规划格局的都城是（ ）。", "options": ["A.隋代大兴城（唐长安城）", "B.元大都", "C.明清北京城", "D.蓟城"], "answer": "A", "explain": "中国最早出现中轴线规划格局的是隋代大兴城（唐长安城）。", "source": "隋代大兴城（唐长安城）、宇文恺"}, {"section": "中轴线", "layer": "core", "type": "judge", "q": "太庙是中国保存最完整、规模最大的皇家祭祖建筑群，今为劳动人民文化宫。", "answer": "对", "explain": "太庙（劳动人民文化宫）是中国保存最完整、规模最大的皇家祭祖建筑群。", "source": "中国保存最完整、规模最大的皇家祭祖建筑群——太庙（劳动人民文化宫）"}, {"section": "中轴线", "layer": "core", "type": "single", "q": "主持规划隋代大兴城（唐长安城）的是（ ）。", "options": ["A.宇文恺", "B.召公", "C.郭沫若", "D.乾隆皇帝"], "answer": "A", "explain": "隋代大兴城（唐长安城）由宇文恺主持规划，是中国最早出现中轴线规划格局的都城。", "source": "隋代大兴城（唐长安城）、宇文恺"}, {"section": "中轴线", "layer": "core", "type": "judge", "q": "北京中轴线北起永定门，南至钟鼓楼。", "answer": "错", "explain": "方向颠倒，应为北起钟鼓楼、南至永定门。", "source": "北起钟鼓楼、南至永定门"}, {"section": "中轴线", "layer": "core", "type": "multi", "q": "北京中轴线遗产构成要素包含的古代建筑类型有（ ）。", "options": ["A.城门", "B.宫殿", "C.坛庙", "D.城市广场", "E.立交桥"], "answer": "ABCD", "explain": "遗产构成要素15处，古代建筑类型包括城门、桥梁、宫殿、皇家园林、坛庙、城市广场、历史道路遗存。", "source": "古代建筑类型——城门、桥梁、宫殿、皇家园林、坛庙、城市广场、历史道路遗存"}, {"section": "中轴线", "layer": "core", "type": "single", "q": "北京中轴线始建于元至元四年（1267年）始建大都，其总长度约为（ ）。", "options": ["A.7.8公里", "B.3.75公里", "C.47.9米", "D.63米"], "answer": "A", "explain": "元至元四年（1267年）始建大都，中轴线总长约7.8公里；明代中轴线长度仍约7.8公里。3.75公里是元大都中轴线的长度。", "source": "元至元四年（1267年）始建大都、总长约7.8公里；明代长度约7.8公里"}, {"section": "中轴线", "layer": "core", "type": "judge", "q": "北京中轴线于2024年7月列入《世界遗产名录》，遗产构成要素共15处。", "answer": "对", "explain": "北京中轴线2024年7月列入《世界遗产名录》，是中国现存最完整的传统都城中轴线建筑群，遗产构成要素15处。", "source": "北京中轴线（2024年7月列入《世界遗产名录》）；15处"}, {"section": "中轴线", "layer": "core", "type": "single", "q": "下列文学作品中，与北京中轴线有直接关系的是（ ）。", "options": ["A.老舍《龙须沟》", "B.乾隆《皇都篇》", "C.乾隆《帝都篇》", "D.《周礼·考工记》"], "answer": "A", "explain": "与中轴线直接关系的文学作品是老舍《龙须沟》。《皇都篇》《帝都篇》为燕墩方碑乾隆御书内容，《周礼·考工记》是营造原则出处。", "source": "直接关系的文学作品——老舍《龙须沟》"}, {"section": "中轴线", "layer": "core", "type": "judge", "q": "中山公园内的山石\"青云片\"是从圆明园移来的。", "answer": "对", "explain": "社稷坛1914年辟为中央公园、1928年更名中山公园，园内有自圆明园移来的山石\"青云片\"。", "source": "社稷坛（1914年辟为中央公园、1928年更名中山公园）；郭沫若；青云片（圆明园移来的山石）"}, {"section": "中轴线", "layer": "core", "type": "multi", "q": "关于明清北京中轴线贯穿的四重城及其功能，下列对应正确的有（ ）。", "options": ["A.宫城（紫禁城）——皇帝起居朝政", "B.皇城——皇家园林衙署庙宇", "C.内城——居民衙署市肆", "D.外城——平民居住商业"], "answer": "ABCD", "explain": "四重城由内向外为宫城（紫禁城）→皇城→内城→外城，功能依次为皇帝起居朝政、皇家园林衙署庙宇、居民衙署市肆、平民居住商业（天桥、大栅栏，含天坛先农坛）。", "source": "宫城（紫禁城）→皇城→内城→外城；皇帝起居朝政、皇家园林衙署庙宇、居民衙署市肆、平民居住商业"}, {"section": "中轴线", "layer": "core", "type": "single", "q": "元大都中轴线南起丽正门、北至钟鼓楼，其长度约为（ ）。", "options": ["A.3.75公里", "B.7.8公里", "C.47.9米", "D.63米"], "answer": "A", "explain": "元大都中轴线南起丽正门、北至钟鼓楼，长约3.75公里；7.8公里是今北京中轴线的总长。", "source": "南起丽正门、北至钟鼓楼、约3.75公里"}, {"section": "中轴线", "layer": "core", "type": "judge", "q": "当代北京中轴线的第二次北延是为2008年第二十九届奥运会，北延至奥林匹克公园。", "answer": "对", "explain": "第一次北延为1990年第十一届亚运会（至亚运村/奥体中心），第二次为2008年第二十九届奥运会（至奥林匹克公园）。", "source": "第二次为2008年第二十九届奥运会、北延至奥林匹克公园"}, {"section": "中轴线", "layer": "core", "type": "single", "q": "北京中轴线上的制高点是（ ）。", "options": ["A.景山（万春亭）", "B.钟楼", "C.天安门", "D.正阳门"], "answer": "A", "explain": "中轴线上的制高点是景山（万春亭）。", "source": "中轴线上制高点——景山（万春亭）"}, {"section": "中轴线", "layer": "core", "type": "judge", "q": "中轴线上最古老的桥梁万宁桥建于明代。", "answer": "错", "explain": "万宁桥建于元代（约1285年前后），是中轴线上最古老的桥梁。", "source": "中轴线上最古老的桥梁——万宁桥（元代、约1285年前后建）"}, {"section": "中轴线", "layer": "core", "type": "multi", "q": "关于中轴线分布的四处坛庙及其祭祀对象，下列对应正确的有（ ）。", "options": ["A.天坛——祭天", "B.先农坛——祭农神（先农）、亲耕耤田", "C.太庙——祭祖先", "D.社稷坛——祭土神、谷神"], "answer": "ABCD", "explain": "四处坛庙：天坛祭天；先农坛祭农神（先农）、亲耕耤田；太庙祭祖先；社稷坛祭土神、谷神。", "source": "天坛祭天；先农坛祭农神（先农）、亲耕耤田；太庙祭祖先；社稷坛祭土神、谷神"}, {"section": "中轴线", "layer": "core", "type": "single", "q": "北京中轴线列入《世界遗产名录》时，其遗产构成要素共（ ）。", "options": ["A.15处", "B.7处", "C.11处", "D.24处"], "answer": "A", "explain": "北京中轴线2024年7月列入《世界遗产名录》，遗产构成要素共15处。", "source": "遗产构成要素数量——15处"}, {"section": "中轴线", "layer": "core", "type": "judge", "q": "景山于1928年辟为公园对外开放。", "answer": "对", "explain": "景山1928年辟为公园。", "source": "景山对外开放的时间——1928年辟为公园"}, {"section": "中轴线", "layer": "core", "type": "single", "q": "北京最早转为城市公园的皇家坛庙是（ ）。", "options": ["A.社稷坛", "B.天坛", "C.先农坛", "D.太庙"], "answer": "A", "explain": "社稷坛1914年辟为中央公园，是北京最早转为城市公园的皇家坛庙，1928年更名中山公园。", "source": "社稷坛（1914年辟为中央公园、1928年更名中山公园）"}, {"section": "中轴线", "layer": "core", "type": "judge", "q": "外金水桥于明成化元年（1465年）由木桥改建为汉白玉石桥。", "answer": "对", "explain": "外金水桥明永乐年间（约1420年）始建，明成化元年（1465年）由木桥改建为汉白玉石桥，注意区分始建与改建时间。", "source": "明成化元年（1465年）木桥改汉白玉石桥（勿混：永乐约1420年始建、1465年改建）"}, {"section": "中轴线", "layer": "core", "type": "multi", "q": "关于北京钟鼓楼，下列说法正确的有（ ）。", "options": ["A.钟楼通高约47.9米", "B.铜钟重约63吨，为明永乐年间铸造", "C.鼓楼置大鼓1面、更鼓24面", "D.更鼓象征二十四节气"], "answer": "ABCD", "explain": "钟楼通高约47.9米，铜钟约63吨（明永乐铸造）；钟鼓楼元至元九年（1272年）始建、明永乐十八年（1420年）重建；鼓楼大鼓1面、更鼓24面，象征二十四节气。", "source": "通高约47.9米；约63吨（明永乐铸造）；大鼓1面、更鼓24面、象征二十四节气"}, {"section": "中轴线", "layer": "core", "type": "single", "q": "明清北京中轴线贯穿四重城，其中供皇帝起居朝政的是（ ）。", "options": ["A.宫城（紫禁城）", "B.皇城", "C.内城", "D.外城"], "answer": "A", "explain": "四重城为宫城（紫禁城）→皇城→内城→外城，宫城（紫禁城）是皇帝起居朝政之所。", "source": "宫城（紫禁城）→皇城→内城→外城；皇帝起居朝政"}, {"section": "中轴线", "layer": "core", "type": "judge", "q": "永定门城楼于1957年、箭楼于1958年被拆除。", "answer": "错", "explain": "年代颠倒，应为城楼1958年、箭楼1957年拆除，2004—2005年复建。", "source": "拆除永定门城楼、箭楼的年代——城楼1958年、箭楼1957年（2004—2005年复建）"}, {"section": "中轴线", "layer": "core", "type": "single", "q": "明清北京四重城中，为平民居住商业区（有天桥、大栅栏，含天坛、先农坛）的是（ ）。", "options": ["A.外城", "B.内城", "C.皇城", "D.宫城"], "answer": "A", "explain": "外城为平民居住商业区，有天桥、大栅栏，含天坛、先农坛；内城为居民衙署市肆。", "source": "平民居住商业（天桥、大栅栏，含天坛先农坛）"}, {"section": "中轴线", "layer": "core", "type": "judge", "q": "正阳门于明永乐十七年（1419年）增筑城楼、瓮城、箭楼及东西闸楼。", "answer": "错", "explain": "增筑城楼、瓮城、箭楼及东西闸楼是在明正统四年（1439年）；永乐十七年（1419年）是改名正阳门的时间。", "source": "明正统四年（1439年）（永乐十七年1419年改名正阳门）"}, {"section": "中轴线", "layer": "core", "type": "multi", "q": "关于端门，下列说法正确的有（ ）。", "options": ["A.用于存放卤簿仪仗", "B.是大典时官员集合禁卫之所", "C.城楼为重檐歇山顶", "D.城楼面阔九间"], "answer": "ABCD", "explain": "端门用于存放卤簿仪仗，是大典时官员集合禁卫之所；城楼为重檐歇山顶、面阔九间。", "source": "存放卤簿仪仗、大典时官员集合禁卫之所；重檐歇山顶、面阔九间"}, {"section": "中轴线", "layer": "core", "type": "single", "q": "天桥成为平民游艺场所和商品市场聚集区，其形成时间是（ ）。", "options": ["A.清末同治、光绪年间", "B.明永乐年间", "C.元至元年间", "D.清乾隆年间"], "answer": "A", "explain": "天桥于清末同治、光绪年间形成平民游艺场所和商品市场聚集区，民国初年（1910年代）达到鼎盛。", "source": "清末同治、光绪年间形成、民国初年（1910年代）鼎盛"}, {"section": "中轴线", "layer": "core", "type": "judge", "q": "北京中轴线是中国现存最为完整的传统都城中轴线建筑群。", "answer": "对", "explain": "北京中轴线2024年7月列入《世界遗产名录》，是中国乃至世界现存最完整的传统都城中轴线，题干表述与资料一致。", "source": "中国现存最完整的传统都城中轴线建筑群：北京中轴线（2024年7月列入《世界遗产名录》，是中国乃至世界现存最完整的传统都城中轴线）。", "patch": true}, {"section": "中轴线", "layer": "core", "type": "single", "q": "先农坛宰牲亭的屋顶规制是（ ）。", "options": ["A.重檐悬山顶，为国内现存唯一明代孤例", "B.重檐歇山顶，面阔九间", "C.重檐庑殿顶，面阔十一间", "D.单檐歇山顶"], "answer": "A", "explain": "先农坛宰牲亭为重檐悬山顶，系国内现存唯一明代孤例。光绪三十三年（1907年）皇帝在先农坛最后一次亲耕。", "source": "宰牲亭屋顶规制——重檐悬山顶、国内现存唯一明代孤例；光绪三十三年（1907年）皇帝最后一次亲耕"}, {"section": "中轴线", "layer": "core", "type": "multi", "q": "关于燕墩方碑，下列说法正确的有（ ）。", "options": ["A.题写《皇都篇》", "B.题写《帝都篇》", "C.为乾隆皇帝御书", "D.乾隆十八年（1753年）立碑", "E.由郭沫若题写"], "answer": "ABCD", "explain": "燕墩方碑题写《皇都篇》《帝都篇》，为乾隆皇帝御书，乾隆十八年（1753年）立碑。郭沫若是中山公园保卫和平坊题额书写者。", "source": "《皇都篇》《帝都篇》、乾隆皇帝御书、乾隆十八年（1753年）立碑"}, {"section": "中轴线", "layer": "core", "type": "single", "q": "当代北京中轴线的第一次北延是（ ）。", "options": ["A.1990年第十一届亚运会，北延至亚运村/奥体中心", "B.2008年第二十九届奥运会，北延至奥林匹克公园", "C.1928年，辟景山公园", "D.2024年，列入《世界遗产名录》"], "answer": "A", "explain": "第一次北延为1990年第十一届亚运会，北延至亚运村/奥体中心；第二次为2008年第二十九届奥运会，北延至奥林匹克公园。", "source": "第一次为1990年第十一届亚运会、北延至亚运村/奥体中心"}, {"section": "中轴线", "layer": "core", "type": "single", "q": "永定门内中轴历史道路遗存的叠压数量为（ ）。", "options": ["A.7条（L1—L7）", "B.15条", "C.24条", "D.4条"], "answer": "A", "explain": "永定门内中轴历史道路遗存叠压7条（L1—L7）；永定门城楼1958年、箭楼1957年拆除，2004—2005年复建。", "source": "永定门内中轴历史道路遗存叠压数量——7条（L1—L7）"}, {"section": "中轴线", "layer": "core", "type": "multi", "q": "下列建筑属于先农坛建筑群组成的有（ ）。", "options": ["A.庆成宫", "B.太岁殿", "C.观耕台", "D.宰牲亭", "E.祧庙"], "answer": "ABCD", "explain": "先农坛建筑群由庆成宫、太岁殿、神厨、神库、宰牲亭、具服殿、观耕台、先农神坛、天神坛、地祇坛、斋宫组成。祧庙是太庙内围墙里的主体建筑之一。", "source": "庆成宫、太岁殿、神厨、神库、宰牲亭、具服殿、观耕台、先农神坛、天神坛、地祇坛、斋宫"}, {"section": "中轴线", "layer": "core", "type": "single", "q": "北京钟鼓楼的始建年代是（ ）。", "options": ["A.元至元九年（1272年）", "B.元至元四年（1267年）", "C.明永乐十八年（1420年）", "D.明正统四年（1439年）"], "answer": "A", "explain": "钟鼓楼始建于元至元九年（1272年），明永乐十八年（1420年）重建，注意区分始建与重建。", "source": "元至元九年（1272年）始建、明永乐十八年（1420年）重建"}, {"section": "中轴线", "layer": "core", "type": "single", "q": "大运河与北京中轴线的交汇点位于（ ）。", "options": ["A.万宁桥", "B.外金水桥", "C.天桥", "D.正阳门"], "answer": "A", "explain": "大运河与中轴线的交汇点在万宁桥，即通惠河入积水潭处；万宁桥也是中轴线上最古老的桥梁。", "source": "大运河与中轴线的交汇点——万宁桥（通惠河入积水潭处）"}, {"section": "中轴线", "layer": "core", "type": "single", "q": "中山公园保卫和平坊题额的书写者是（ ）。", "options": ["A.郭沫若", "B.老舍", "C.乾隆皇帝", "D.宇文恺"], "answer": "A", "explain": "保卫和平坊题额由郭沫若书写；园内山石\"青云片\"移自圆明园。", "source": "保卫和平坊题额书写者——郭沫若"}, {"section": "中轴线", "layer": "core", "type": "single", "q": "太庙内围墙里的主体建筑，自前向后依次为（ ）。", "options": ["A.戟门→享殿→寝殿→祧庙", "B.享殿→戟门→寝殿→祧庙", "C.戟门→寝殿→享殿→祧庙", "D.戟门→享殿→祧庙→寝殿"], "answer": "A", "explain": "太庙内围墙里主体建筑依次为戟门→享殿（面阔十一间）→寝殿→祧庙。", "source": "太庙内围墙里的主体建筑——戟门→享殿（面阔十一间）→寝殿→祧庙"}, {"section": "中轴线", "layer": "core", "type": "single", "q": "北京中轴线上规模最大、等级最高的城门是（ ）。", "options": ["A.天安门", "B.正阳门", "C.永定门", "D.端门"], "answer": "A", "explain": "天安门是中轴线上规模最大、等级最高的城门，天安门广场历经四次改扩建。", "source": "中轴线上规模最大、等级最高的城门——天安门"}, {"section": "中轴线", "layer": "core", "type": "single", "q": "中国现存最为完整的传统都城中轴线建筑群是（ ）。", "options": ["A. 北京中轴线", "B. 隋代大兴城（唐长安城）中轴线", "C. 元大都丽正门至钟鼓楼轴线", "D. 辽南京（燕京）城中轴线"], "answer": "A", "explain": "北京中轴线是中国乃至世界现存最完整的传统都城中轴线，2024年7月列入《世界遗产名录》。隋大兴城（唐长安城）是中国历史上最早出现明确中轴线规划格局的都城，元大都中轴线南起丽正门北至钟鼓楼，但二者均非'现存最完整'的定性所指。", "source": "中国现存最完整的传统都城中轴线建筑群：北京中轴线（2024年7月列入《世界遗产名录》）；最早出现明确中轴线规划格局的是隋代大兴城（唐长安城）。", "patch": true}, {"section": "中轴线", "type": "single", "q": "周武王封召公于燕所建、作为北京建城之始的城邑是（ ）。", "options": ["A. 蓟城", "B. 幽州城", "C. 南京城", "D. 金中都"], "answer": "A", "explain": "西周初年周武王封召公于燕，建蓟城，为北京建城之始。", "source": "北京地区最早的城市出现于西周初年（约公元前 11 世纪/公元前1045 年），周武王封召公于燕，建蓟城，为北京建城之始。", "layer": "ext"}, {"section": "中轴线", "type": "judge", "q": "北京地区最早的城市出现于西周初年，周武王封召公于燕，建蓟城，为北京建城之始。", "answer": "对", "explain": "原文：北京地区最早的城市出现于西周初年（约公元前11世纪/公元前1045年），周武王封召公于燕，建蓟城，为北京建城之始。", "source": "最早出现城市的时间：北京地区最早的城市出现于西周初年（约公元前 11 世纪/公元前1045 年），周武王封召公于燕，建蓟城，为北京建城之始。", "layer": "ext"}, {"section": "中轴线", "type": "multi", "q": "下列属于辽代\"五京\"的有（ ）。", "options": ["A. 上京", "B. 中京", "C. 东京", "D. 南京", "E. 北京"], "answer": "ABCD", "explain": "辽\"五京\"为上京、中京、东京、南京、西京，其中以北京地区为南京（又称燕京、析津府）；并无\"北京\"。", "source": "辽代以北京地区为南京（又称燕京、析津府），是辽\"五京\"（上京、中京、东京、南京、西京）之一。", "layer": "ext"}, {"section": "中轴线", "type": "single", "q": "北京城（尤其元大都、明清北京）的营造遵循（ ）\"左祖右社，面朝后市\"及中轴线对称的礼制原则。", "options": ["A. 《营造法式》", "B. 《周礼·考工记》", "C. 《梦溪笔谈》", "D. 《天工开物》"], "answer": "B", "explain": "北京城的营造遵循《周礼·考工记》\"左祖右社，面朝后市\"及中轴线对称的礼制原则。", "source": "北京城（尤其元大都、明清北京）的营造遵循《周礼·考工记》\"左祖右社，面朝后市\"及中轴线对称的礼制原则。", "layer": "ext"}, {"section": "中轴线", "type": "judge", "q": "辽代以北京地区为西京，是辽\"五京\"之一。", "answer": "错", "explain": "辽代以北京地区为南京（又称燕京、析津府），而非西京。", "source": "辽代以北京地区为南京（又称燕京、析津府），是辽\"五京\"（上京、中京、东京、南京、西京）之一。", "layer": "ext"}, {"section": "中轴线", "type": "single", "q": "北京中轴线始建于（ ）。", "options": ["A. 元至元四年（1267年）", "B. 元至元九年（1272年）", "C. 元至元二十二年（1285年）", "D. 明永乐十八年（1420年）"], "answer": "A", "explain": "北京中轴线始建于元代至元四年（1267年），始建大都，确立南北中轴线。1272年为钟鼓楼始建，1285年约为万宁桥始建，1420年为钟鼓楼重建。", "source": "北京中轴线始建于元代（至元四年，1267 年，始建大都），确立南北中轴线。", "layer": "ext"}, {"section": "中轴线", "type": "judge", "q": "中国历史上最早出现明确中轴线规划格局的是汉代长安城。", "answer": "错", "explain": "最早出现明确中轴线规划格局的是隋代大兴城（唐长安城），不是汉代长安城。", "source": "中国历史上最早出现明确中轴线规划格局的是隋代大兴城（唐长安城）；北京中轴线则承袭并发展了这一传统。", "layer": "ext"}, {"section": "中轴线", "type": "multi", "q": "北京中轴线集中表达的中华文明理念包括（ ）。", "options": ["A. 中正", "B. 中和", "C. 中庸", "D. 以中为尊、居中而治", "E. 重商抑农"], "answer": "ABCD", "explain": "北京中轴线集中表达了中华文明\"中正、中和、中庸\"的核心理念，以及\"天人合一、礼乐交融、尊卑有序、家国同构\"的宇宙观，体现\"以中为尊、居中而治\"的精神。", "source": "北京中轴线集中表达了中华文明\"中正、中和、中庸\"的核心理念，以及\"天人合一、礼乐交融、尊卑有序、家国同构\"的宇宙观与礼制秩序，体现\"以中为尊、居中而治\"的中华文明精神。", "layer": "ext"}, {"section": "中轴线", "type": "single", "q": "明清定型后的北京中轴线总长度约为（ ）。", "options": ["A. 3.75公里", "B. 5.8公里", "C. 7.8公里", "D. 10.2公里"], "answer": "C", "explain": "北京中轴线总长度（明清定型）约7.8公里（一说7.86公里）；3.75公里为元大都时期中轴线长度。", "source": "其总长度（明清定型）约 7.8 公里（一说 7.86 公里）。", "layer": "ext"}, {"section": "中轴线", "type": "judge", "q": "北京钟鼓楼于明永乐十八年（1420年）重建，清乾隆年间重修。", "answer": "对", "explain": "钟鼓楼始建于元至元九年（1272年），后毁；明永乐十八年（1420年）重建，清乾隆年间重修。", "source": "北京钟鼓楼始建于元至元九年（1272 年），后毁；明永乐十八年（1420 年）重建，清乾隆年间重修。", "layer": "ext"}, {"section": "中轴线", "type": "single", "q": "北京中轴线北起钟楼、鼓楼，南至（ ）。", "options": ["A. 正阳门", "B. 永定门", "C. 丽正门", "D. 天桥"], "answer": "B", "explain": "北京中轴线北起钟楼、鼓楼，向南经万宁桥、景山、故宫、端门、天安门、正阳门等，南至永定门。", "source": "北起钟楼、鼓楼，向南经万宁桥、景山、故宫（紫禁城）、端门、天安门……南至永定门。", "layer": "ext"}, {"section": "中轴线", "type": "judge", "q": "元大都时期的中轴线南起丽正门、北至钟鼓楼，长度约7.8公里。", "answer": "错", "explain": "元大都中轴线长度约3.75公里（一说3.9公里）；约7.8公里是明清定型后的中轴线总长度。", "source": "元大都中轴线南起丽正门、北至钟鼓楼，长度约3.75 公里（一说 3.9 公里），沿线有万宁桥、中心阁、鼓楼、钟楼及皇城宫殿。", "layer": "ext"}, {"section": "中轴线", "type": "multi", "q": "构成北京中轴线的古代建筑类型包括（ ）。", "options": ["A. 城门", "B. 桥梁", "C. 宫殿", "D. 坛庙", "E. 石窟"], "answer": "ABCD", "explain": "北京中轴线的古代建筑类型有城门、桥梁、宫殿、皇家园林、坛庙、城市广场、历史道路遗存等；无石窟。", "source": "城门（永定门、正阳门、天安门）、桥梁（万宁桥、外金水桥）、宫殿（故宫）、皇家园林（景山）、坛庙（太庙、社稷坛、天坛、先农坛）、城市广场（天安门广场建筑群）、历史道路遗存等多种类型。", "layer": "ext"}, {"section": "中轴线", "type": "single", "q": "天桥一带逐渐聚集民间艺人、杂耍、曲艺与商贩，形成平民游艺与商品市场，始于（ ）。", "options": ["A. 明永乐年间", "B. 清乾隆年间", "C. 清末同治、光绪年间", "D. 20世纪30年代"], "answer": "C", "explain": "天桥一带自清末同治、光绪年间（19世纪后半叶）逐渐形成平民游艺与商品市场，至民国初年达到鼎盛。", "source": "天桥一带自清末同治、光绪年间（19 世纪后半叶）逐渐聚集民间艺人、杂耍、曲艺与商贩，形成平民游艺与商品市场；至民国初年（1910 年代前后）达到鼎盛。", "layer": "ext"}, {"section": "中轴线", "type": "judge", "q": "北京鼓楼原设有大鼓24面、更鼓1面，用于报时。", "answer": "错", "explain": "鼓楼原设大鼓1面、更鼓24面，24面更鼓象征一年二十四节气。", "source": "鼓楼原设有大鼓 1 面、更鼓 24 面（用于报时），24 面象征一年二十四节气。", "layer": "ext"}, {"section": "中轴线", "type": "single", "q": "下列文学作品中，以天桥一带平民生活为背景、与北京中轴线存在直接关系的是（ ）。", "options": ["A. 老舍《龙须沟》", "B. 曹雪芹《红楼梦》", "C. 鲁迅《呐喊》", "D. 巴金《家》"], "answer": "A", "explain": "老舍的《龙须沟》以天桥一带平民生活为背景，天桥正位于中轴线南段平民区。", "source": "常指老舍的《龙须沟》（以天桥一带平民生活为背景，天桥正位于中轴线南段平民区），以及《茶馆》《四世同堂》等北京题材作品。", "layer": "ext"}, {"section": "中轴线", "type": "judge", "q": "景山于1928年辟为公园（景山公园）并向公众开放。", "answer": "对", "explain": "原文：景山于1928年辟为公园（景山公园）并向公众开放。", "source": "景山于 1928 年辟为公园（景山公园）并向公众开放。", "layer": "ext"}, {"section": "中轴线", "type": "multi", "q": "下列关于明清时期北京四重城功能的说法，正确的有（ ）。", "options": ["A. 宫城（紫禁城）为皇帝起居与朝政之所", "B. 皇城环绕宫城，设皇家园林、衙署、庙宇", "C. 内城为居民、衙署、市肆，普通官员与百姓主要聚居区", "D. 外城位于内城南面，以平民居住、商业为主，含天坛、先农坛", "E. 外城为皇帝祭天祈谷的专用区域"], "answer": "ABCD", "explain": "外城位于内城南面，以平民居住、商业（天桥、前门外大栅栏）为主，含天坛、先农坛，并非皇帝祭天专用区域。", "source": "1. 宫城（紫禁城）——皇帝起居与朝政之所……2. 皇城——环绕宫城，设皇家园林、衙署、庙宇……3. 内城——居民、衙署、市肆……4. 外城——位于内城南面，以平民居住、商业为主，含天坛、先农坛。", "layer": "ext"}, {"section": "中轴线", "type": "single", "q": "明代加筑外城、使北京中轴线由钟鼓楼至永定门全长约7.8公里定型的时间是（ ）。", "options": ["A. 明永乐十八年（1420年）", "B. 明正统四年（1439年）", "C. 明嘉靖三十二年（1553年）", "D. 明成化元年（1465年）"], "answer": "C", "explain": "明永乐年间营建北京、嘉靖三十二年（1553年）加筑外城后，中轴线定型，全长约7.8公里。", "source": "明永乐年间营建北京、嘉靖三十二年（1553 年）加筑外城后，中轴线定型，由钟鼓楼至永定门全长约 7.8 公里。", "layer": "ext"}, {"section": "中轴线", "type": "judge", "q": "社稷坛于1914年辟为中央公园，是北京最早由皇家坛庙转变为城市公园的园林。", "answer": "对", "explain": "社稷坛1914年辟为中央公园，1928年更名为中山公园，是中国最早开放的皇家坛庙园林。", "source": "社稷坛（明清皇家祭土谷之神之所）于 1914 年辟为中央公园，是北京最早由皇家坛庙转变为城市公园的园林；1928 年更名为中山公园。", "layer": "ext"}, {"section": "中轴线", "type": "single", "q": "北京中轴线上的几何与景观制高点是（ ）。", "options": ["A. 正阳门城楼", "B. 景山万春亭一带", "C. 钟鼓楼", "D. 天安门城楼"], "answer": "B", "explain": "景山（特别是景山万春亭一带）是北京中轴线上的几何与景观制高点，也是宫城北面的借景与风水屏障。", "source": "景山（特别是景山万春亭一带）是北京中轴线上的几何与景观制高点，也是宫城北面的借景与风水屏障。", "layer": "ext"}, {"section": "中轴线", "type": "judge", "q": "永定门箭楼于1958年拆除，城楼于1957年拆除。", "answer": "错", "explain": "永定门城楼于1958年拆除，箭楼于1957年拆除，题干将二者年代颠倒。", "source": "永定门城楼于 1958 年拆除，永定门箭楼于 1957 年拆除（2004—2005 年城楼依据旧貌复建）。", "layer": "ext"}, {"section": "中轴线", "type": "multi", "q": "下列北京中轴线坛庙与祭祀对象对应正确的有（ ）。", "options": ["A. 天坛——祭天", "B. 先农坛——祭农神（先农）", "C. 太庙——祭祖先", "D. 社稷坛——祭土神、谷神", "E. 太庙——祭天祈谷"], "answer": "ABCD", "explain": "天坛祭天、先农坛祭农神、太庙祭祖先（皇家宗庙）、社稷坛祭土神谷神；祭天祈谷属于天坛，不是太庙。", "source": "1. 天坛——祭天……2. 先农坛——祭农神（先农）并举行亲耕（耤田）典礼……3. 太庙——祭祖先……4. 社稷坛——祭土神、谷神。", "layer": "ext"}, {"section": "中轴线", "type": "single", "q": "北京中轴线列入《世界遗产名录》的时间是（ ）。", "options": ["A. 1987年12月", "B. 2008年8月", "C. 2014年6月", "D. 2024年7月"], "answer": "D", "explain": "北京中轴线于2024年7月列入《世界遗产名录》，是中国乃至世界现存最完整的传统都城中轴线。", "source": "北京中轴线（2024 年 7 月列入《世界遗产名录》，是中国乃至世界现存最完整的传统都城中轴线）。", "layer": "ext"}, {"section": "中轴线", "type": "judge", "q": "明清时期正阳门瓮城内，西北侧为观音庙，东南侧为关帝庙。", "answer": "错", "explain": "正阳门瓮城内西北侧为关帝庙（祭祀关羽），东南侧为观音庙（祭祀观音菩萨），题干方位颠倒。", "source": "明清时期正阳门（前门）瓮城内建有两座庙宇：西北侧为关帝庙（祭祀关羽），东南侧为观音庙（祭祀观音菩萨）。", "layer": "ext"}, {"section": "中轴线", "type": "single", "q": "北京中轴线遗产由（ ）处遗产构成要素组成。", "options": ["A. 12", "B. 15", "C. 18", "D. 20"], "answer": "B", "explain": "北京中轴线遗产由15处遗产构成要素组成，包括钟鼓楼、万宁桥、景山、故宫、端门、天安门、太庙、社稷坛、天坛、先农坛、永定门等。", "source": "北京中轴线遗产由 15 处遗产构成要素组成（钟鼓楼、万宁桥、景山、故宫、端门、天安门、外金水桥、太庙、社稷坛、天安门广场建筑群、正阳门、天坛、先农坛、永定门、中轴线南段道路遗存）。", "layer": "ext"}, {"section": "中轴线", "type": "judge", "q": "先农坛宰牲亭为重檐歇山顶，是国内现存唯一的明代重檐歇山顶建筑孤例。", "answer": "错", "explain": "先农坛宰牲亭为重檐悬山顶，是国内现存唯一的明代重檐悬山顶建筑孤例，不是歇山顶。", "source": "先农坛宰牲亭为重檐悬山顶，是国内现存唯一的明代重檐悬山顶建筑孤例。", "layer": "ext"}, {"section": "中轴线", "type": "multi", "q": "下列关于当代北京中轴线两次北延的说法，正确的有（ ）。", "options": ["A. 第一次北延为举办1990年第十一届北京亚运会", "B. 第一次北延延伸至亚运村/奥体中心一带", "C. 第二次北延为举办2008年第二十九届北京奥运会", "D. 第二次北延延伸至奥林匹克公园", "E. 第二次北延是为举办2010年上海世博会"], "answer": "ABCD", "explain": "两次北延分别为1990年北京亚运会（延至亚运村/奥体中心）和2008年北京奥运会（延至奥林匹克公园，含鸟巢、水立方及奥林匹克森林公园）；与上海世博会无关。", "source": "1. 第一次北延（1990 年前后）：为举办 1990 年第十一届北京亚运会……2. 第二次北延（2008 年前后）：为举办 2008 年第二十九届北京奥运会，中轴线进一步北延至奥林匹克公园。", "layer": "ext"}, {"section": "中轴线", "type": "single", "q": "北京钟楼的通高约为（ ）。", "options": ["A. 37.9米", "B. 47.9米", "C. 57.9米", "D. 63米"], "answer": "B", "explain": "北京钟楼通高约47.9米，砖石台基上建重檐歇山顶楼阁；63吨为所悬铜钟重量。", "source": "北京钟楼通高约 47.9 米（砖石台基上建重檐歇山顶楼阁）。", "layer": "ext"}, {"section": "中轴线", "type": "judge", "q": "正阳门于明正统四年（1439年）在城楼基础上增筑瓮城、箭楼及东西闸楼，形成完整瓮城防御体系。", "answer": "对", "explain": "正阳门明永乐十七年（1419年）改名并南移至今址；明正统四年（1439年）增筑瓮城、箭楼及东西闸楼。", "source": "明正统四年（1439 年）在城楼基础上增筑瓮城、箭楼及东西闸楼（形成完整瓮城防御体系），此后屡经修缮。", "layer": "ext"}, {"section": "中轴线", "type": "single", "q": "北京钟楼所悬铜钟的重量约为（ ）。", "options": ["A. 23吨", "B. 43吨", "C. 63吨", "D. 83吨"], "answer": "C", "explain": "钟楼所悬铜钟重约63吨，明永乐年间铸造，号称\"燕京古钟\"，为中国现存最重的大铜钟之一。", "source": "钟楼所悬铜钟重约 63 吨（明永乐年间铸造，号称\"燕京古钟\"，为中国现存最重的大铜钟之一）。", "layer": "ext"}, {"section": "中轴线", "type": "judge", "q": "辽代的南京即今北京地区，又称燕京、析津府。", "answer": "对", "explain": "辽代以北京地区为南京（又称燕京、析津府），是辽\"五京\"之一。", "source": "辽代以北京地区为南京（又称燕京、析津府），是辽\"五京\"（上京、中京、东京、南京、西京）之一。", "layer": "ext"}, {"section": "中轴线", "type": "multi", "q": "下列属于先农坛建筑群组成部分的有（ ）。", "options": ["A. 庆成宫", "B. 太岁殿", "C. 宰牲亭", "D. 观耕台", "E. 祈年殿"], "answer": "ABCD", "explain": "先农坛建筑群主要包括庆成宫、太岁殿、神厨、神库、宰牲亭、具服殿、观耕台、先农神坛、天神坛、地祇坛、斋宫等；祈年殿属天坛。", "source": "先农坛（北京古代建筑博物馆所在）建筑群主要包括庆成宫、太岁殿（前殿/拜殿）、神厨、神库、宰牲亭、具服殿、观耕台、先农神坛、天神坛、地祇坛、斋宫等。", "layer": "ext"}, {"section": "中轴线", "type": "single", "q": "北京钟鼓楼始建于（ ）。", "options": ["A. 元至元四年（1267年）", "B. 元至元九年（1272年）", "C. 元至元二十二年（1285年）", "D. 明永乐十七年（1419年）"], "answer": "B", "explain": "北京钟鼓楼始建于元至元九年（1272年），后毁；明永乐十八年（1420年）重建。", "source": "北京钟鼓楼始建于元至元九年（1272 年），后毁；明永乐十八年（1420 年）重建，清乾隆年间重修。", "layer": "ext"}, {"section": "中轴线", "type": "judge", "q": "北京城（尤其元大都、明清北京）的营造遵循《营造法式》\"左祖右社，面朝后市\"的礼制原则。", "answer": "错", "explain": "北京城营造遵循的是《周礼·考工记》\"左祖右社，面朝后市\"及中轴线对称的礼制原则，不是《营造法式》。", "source": "北京城（尤其元大都、明清北京）的营造遵循《周礼·考工记》\"左祖右社，面朝后市\"及中轴线对称的礼制原则。", "layer": "ext"}, {"section": "中轴线", "type": "single", "q": "北京中轴线上现存最古老的桥梁是（ ）。", "options": ["A. 外金水桥", "B. 内金水桥", "C. 万宁桥", "D. 卢沟桥"], "answer": "C", "explain": "万宁桥（又称海子桥、后门桥）建于元代，是北京中轴线上现存最古老的桥梁，也是大运河与中轴线的交汇点。", "source": "万宁桥（又称海子桥、后门桥），建于元代（约至元二十二年，1285 年前后），是北京中轴线上现存最古老的桥梁。", "layer": "ext"}, {"section": "中轴线", "type": "judge", "q": "明清北京的内城为居民、衙署、市肆所在，是普通官员与百姓的主要聚居区。", "answer": "对", "explain": "明清北京四重城中，内城为居民、衙署、市肆，普通官员与百姓主要聚居区。", "source": "3. 内城——居民、衙署、市肆，普通官员与百姓主要聚居区。", "layer": "ext"}, {"section": "中轴线", "type": "multi", "q": "新中国成立后，天安门广场经历的重大改扩建包括（ ）。", "options": ["A. 1950年代清理广场、建观礼台", "B. 1958—1959年建国十周年改扩建", "C. 1976—1977年毛主席纪念堂建设", "D. 1999年广场铺装与布局调整", "E. 2008年为迎奥运重建人民大会堂"], "answer": "ABCD", "explain": "天安门广场通常概括为四次重大改扩建：1950年代、1958—1959年、1976—1977年、1999年；无2008年重建人民大会堂之事。", "source": "新中国成立后，天安门广场经历了多次（通常概括为四次重大）改扩建：1950 年代（清理广场、建观礼台）、1958—1959 年（建国十周年改扩建……）、1976—1977 年（毛主席纪念堂建设）、1999 年（广场铺装与布局调整）等。", "layer": "ext"}, {"section": "中轴线", "type": "single", "q": "主持通惠河工程、与万宁桥兴建相关的水利专家是（ ）。", "options": ["A. 郭守敬", "B. 李春", "C. 蒯祥", "D. 样式雷"], "answer": "A", "explain": "万宁桥建于约至元二十二年（1285年前后），郭守敬主持通惠河工程时建。", "source": "万宁桥（又称海子桥、后门桥），建于元代（约至元二十二年，1285 年前后，郭守敬主持通惠河工程时建）。", "layer": "ext"}, {"section": "中轴线", "type": "judge", "q": "北京钟楼所悬铜钟重约47.9吨，号称\"燕京古钟\"。", "answer": "错", "explain": "钟楼所悬铜钟重约63吨；47.9米是钟楼的通高，题干将高度数值错置为重量。", "source": "钟楼所悬铜钟重约 63 吨（明永乐年间铸造，号称\"燕京古钟\"，为中国现存最重的大铜钟之一）。", "layer": "ext"}, {"section": "中轴线", "type": "single", "q": "中山公园内由圆明园移来的著名山石是（ ）。", "options": ["A. 青芝岫", "B. 青云片", "C. 冠云峰", "D. 皱云峰"], "answer": "B", "explain": "中山公园内由圆明园移来的著名山石为青云片，原属圆明园\"别有洞天\"景区遗石。", "source": "中山公园内由圆明园移来的著名山石为青云片（原属圆明园\"别有洞天\"景区遗石，后迁至中山公园）。", "layer": "ext"}, {"section": "中轴线", "type": "judge", "q": "万宁桥横跨通惠河入积水潭处，是世界文化遗产大运河与北京中轴线的交汇点。", "answer": "对", "explain": "万宁桥是大运河（通惠河终点）与北京中轴线的交汇点，通惠河东端止于积水潭（今什刹海）。", "source": "万宁桥正是世界文化遗产大运河（通惠河终点）与北京中轴线的交汇点——通惠河东端止于积水潭（今什刹海），万宁桥横跨通惠河入积水潭处。", "layer": "ext"}, {"section": "中轴线", "type": "multi", "q": "永定门内\"中轴历史道路遗存\"考古揭示的依次叠压道路所涉时代包括（ ）。", "options": ["A. 唐幽州", "B. 辽南京", "C. 金中都", "D. 元大都", "E. 秦代蓟城"], "answer": "ABCD", "explain": "考古揭示出自唐幽州、辽南京、金中都、元大都、明、清至近现代7条道路依次叠压（编号L1—L7）；不含秦代。", "source": "永定门内\"中轴历史道路遗存\"经考古发掘，揭示出自唐幽州、辽南京、金中都、元大都、明、清至近现代 7 条道路依次叠压（编号为 L1—L7）。", "layer": "ext"}, {"section": "中轴线", "type": "single", "q": "中山公园内\"保卫和平坊\"坊额\"保卫和平\"四字的题写者是（ ）。", "options": ["A. 毛泽东", "B. 郭沫若", "C. 徐悲鸿", "D. 齐白石"], "answer": "B", "explain": "\"保卫和平\"四字由郭沫若题写；该坊原为\"克林德碑\"，后改\"公理战胜坊\"，1952年改称\"保卫和平坊\"。", "source": "中山公园内\"保卫和平坊\"坊额\"保卫和平\"四字由郭沫若题写（该坊原为\"克林德碑\"，后改\"公理战胜坊\"，1952 年改称\"保卫和平坊\"）。", "layer": "ext"}, {"section": "中轴线", "type": "judge", "q": "四处坛庙中，天坛位于中轴线东侧外城，先农坛位于中轴线西侧外城。", "answer": "对", "explain": "天坛位于中轴线东侧外城，先农坛位于中轴线西侧外城，符合\"左祖右社\"等礼制布局。", "source": "1. 天坛——祭天（皇帝祭天祈谷，位于中轴线东侧外城）。2. 先农坛——祭农神（先农）并举行亲耕（耤田）典礼（位于中轴线西侧外城）。", "layer": "ext"}, {"section": "中轴线", "type": "single", "q": "太庙内围墙（红墙）内自南向北依次为戟门、享殿、寝殿、祧庙，其中面阔十一间、为祭祖主殿的是（ ）。", "options": ["A. 戟门", "B. 享殿", "C. 寝殿", "D. 祧庙"], "answer": "B", "explain": "享殿（前殿）为面阔十一间的最高规制大殿，是祭祖主殿；寝殿供奉历代帝后神主，祧庙供奉远祖。", "source": "太庙内围墙（红墙）内自南向北依次为戟门（庙门）、享殿（前殿/大殿）、寝殿（中殿）、祧庙（后殿）；其中享殿（前殿）为面阔十一间的最高规制大殿，是祭祖主殿。", "layer": "ext"}, {"section": "中轴线", "type": "judge", "q": "为举办2008年第二十九届北京奥运会，北京中轴线首次向北延伸。", "answer": "错", "explain": "首次北延是为1990年第十一届北京亚运会（延至亚运村/奥体中心）；2008年奥运会为第二次北延，延至奥林匹克公园。", "source": "1. 第一次北延（1990 年前后）：为举办 1990 年第十一届北京亚运会……2. 第二次北延（2008 年前后）：为举办 2008 年第二十九届北京奥运会。", "layer": "ext"}, {"section": "中轴线", "type": "multi", "q": "下列关于端门的说法，正确的有（ ）。", "options": ["A. 位于天安门之北、故宫午门之南", "B. 明清时主要用于存放皇帝卤簿（仪仗）", "C. 城楼为重檐歇山顶、面阔九间", "D. 城楼等级仅次于故宫太和殿的重檐庑殿顶", "E. 是明清北京内城的正门"], "answer": "ABCD", "explain": "端门位于天安门之北、故宫午门之南，是皇城的重要门户，明清时用于存放皇帝卤簿、作为朝会大典时官员集合与禁卫之所；城楼重檐歇山顶、面阔九间，等级仅次于太和殿重檐庑殿顶。皇城正门为天安门，端门并非内城正门。", "source": "端门位于天安门之北、故宫午门之南，是皇城的重要门户，明清时主要用于存放皇帝卤簿（仪仗）……端门城楼为重檐歇山顶，面阔九间，等级仅次于故宫太和殿的重檐庑殿顶。", "layer": "ext"}, {"section": "中轴线", "type": "single", "q": "端门城楼的屋顶建筑规制为（ ）。", "options": ["A. 重檐庑殿顶", "B. 重檐歇山顶", "C. 重檐悬山顶", "D. 单檐攒尖顶"], "answer": "B", "explain": "端门城楼为重檐歇山顶，面阔九间，等级仅次于故宫太和殿的重檐庑殿顶，与天安门城楼规制相当；端门明清时主要用于存放皇帝卤簿（仪仗）。", "source": "端门城楼为重檐歇山顶，面阔九间，等级仅次于故宫太和殿的重檐庑殿顶，与天安门城楼规制相当。", "layer": "ext"}, {"section": "中轴线", "type": "judge", "q": "中山公园\"保卫和平坊\"原为\"克林德碑\"，后改\"公理战胜坊\"，1952年改称\"保卫和平坊\"。", "answer": "对", "explain": "该坊原为\"克林德碑\"，后改\"公理战胜坊\"，1952年改称\"保卫和平坊\"，坊额四字由郭沫若题写。", "source": "中山公园内\"保卫和平坊\"坊额\"保卫和平\"四字由郭沫若题写（该坊原为\"克林德碑\"，后改\"公理战胜坊\"，1952 年改称\"保卫和平坊\"）。", "layer": "ext"}, {"section": "中轴线", "type": "single", "q": "天安门外外金水桥由木桥改建为汉白玉石桥的时间是（ ）。", "options": ["A. 明永乐十八年（1420年）", "B. 明正统四年（1439年）", "C. 明成化元年（1465年）", "D. 明嘉靖三十二年（1553年）"], "answer": "C", "explain": "外金水桥于明永乐年间（约1420年）始建为木桥，明成化元年（1465年）改建为汉白玉石桥（七座）。", "source": "天安门外外金水桥于明永乐年间（与天安门同时，约 1420 年）始建为木桥，后于明成化元年（1465 年）改建为汉白玉石桥（七座）。", "layer": "ext"}, {"section": "中轴线", "type": "judge", "q": "外金水桥改建为汉白玉石桥后共七座，对应天安门五门洞及两侧；内金水桥位于故宫午门前。", "answer": "对", "explain": "外金水桥明成化元年（1465年）改建为汉白玉石桥七座，对应天安门五门洞及两侧；内金水桥位于故宫午门前。", "source": "后于明成化元年（1465 年）改建为汉白玉石桥（七座，对应天安门五门洞及两侧）；内金水桥位于故宫午门前。", "layer": "ext"}, {"section": "中轴线", "type": "multi", "q": "下列属于北京中轴线15处遗产构成要素的有（ ）。", "options": ["A. 万宁桥", "B. 太庙", "C. 先农坛", "D. 永定门", "E. 颐和园"], "answer": "ABCD", "explain": "15处遗产构成要素为钟鼓楼、万宁桥、景山、故宫、端门、天安门、外金水桥、太庙、社稷坛、天安门广场建筑群、正阳门、天坛、先农坛、永定门、中轴线南段道路遗存；颐和园不在其中。", "source": "北京中轴线遗产由 15 处遗产构成要素组成（钟鼓楼、万宁桥、景山、故宫、端门、天安门、外金水桥、太庙、社稷坛、天安门广场建筑群、正阳门、天坛、先农坛、永定门、中轴线南段道路遗存）。", "layer": "ext"}, {"section": "中轴线", "type": "single", "q": "北京中轴线上规模最大、形制等级最高的城门建筑是（ ）。", "options": ["A. 永定门", "B. 正阳门", "C. 端门", "D. 天安门"], "answer": "D", "explain": "天安门（明清皇城正门）是北京中轴线上形制等级最高、规模最大的城门建筑，重檐歇山顶、面阔九间、黄琉璃瓦。", "source": "天安门（明清皇城正门）是北京中轴线上形制等级最高、规模最大的城门建筑（重檐歇山顶、面阔九间，黄琉璃瓦，为皇城正门之制）。", "layer": "ext"}, {"section": "中轴线", "type": "judge", "q": "太庙今为劳动人民文化宫，是中国保存最完整、规模最大的皇家祭祖建筑群。", "answer": "对", "explain": "太庙（今劳动人民文化宫）是明清两代皇帝祭祖的宗庙，规制最高、保存最完整。", "source": "太庙（今劳动人民文化宫），是明清两代皇帝祭祖的宗庙，规制最高、保存最完整。", "layer": "ext"}, {"section": "中轴线", "type": "single", "q": "永定门外燕墩四体方碑的立碑时间是（ ）。", "options": ["A. 康熙二十二年（1683年）", "B. 雍正八年（1730年）", "C. 乾隆十八年（1753年）", "D. 嘉庆元年（1796年）"], "answer": "C", "explain": "燕墩方碑四面刻清乾隆皇帝御制《皇都篇》与《帝都篇》，由乾隆亲笔御书，立碑于乾隆十八年（1753年）。", "source": "永定门外燕墩上的方碑，四面刻清乾隆皇帝御制《皇都篇》与《帝都篇》……碑文由清乾隆皇帝亲笔御书（立碑于乾隆十八年，1753 年）。", "layer": "ext"}, {"section": "中轴线", "type": "judge", "q": "永定门城楼拆除后，于2004—2005年依据旧貌复建。", "answer": "对", "explain": "永定门城楼1958年拆除、箭楼1957年拆除，2004—2005年城楼依据旧貌复建。", "source": "永定门城楼于 1958 年拆除，永定门箭楼于 1957 年拆除（2004—2005 年城楼依据旧貌复建）。", "layer": "ext"}, {"section": "中轴线", "type": "multi", "q": "下列关于北京建城之始的说法，正确的有（ ）。", "options": ["A. 最早的城市出现于西周初年", "B. 约为公元前1045年", "C. 周武王封召公于燕", "D. 所建城邑为蓟城", "E. 最早的城市出现于春秋时期"], "answer": "ABCD", "explain": "北京地区最早的城市出现于西周初年（约公元前11世纪/公元前1045年），周武王封召公于燕，建蓟城，为北京建城之始。", "source": "北京地区最早的城市出现于西周初年（约公元前 11 世纪/公元前1045 年），周武王封召公于燕，建蓟城，为北京建城之始。", "layer": "ext"}, {"section": "中轴线", "type": "single", "q": "先农坛历史上最后一次皇帝亲耕（祭祀先农）的时间是（ ）。", "options": ["A. 清乾隆年间", "B. 清道光二十年（1840年）", "C. 清光绪三十三年（1907年）", "D. 清宣统三年（1911年）"], "answer": "C", "explain": "清光绪三十三年（1907年）光绪帝亲行耤田礼，为清朝也是中国历史上最后一次皇帝亲耕。", "source": "清光绪三十三年（1907 年）光绪帝亲行耤田礼，为清朝也是中国历史上最后一次皇帝亲耕（祭祀先农）。", "layer": "ext"}, {"section": "中轴线", "type": "judge", "q": "太庙内围墙里的寝殿供奉远祖，祧庙供奉历代帝后神主。", "answer": "错", "explain": "太庙寝殿供奉历代帝后神主，祧庙供奉远祖，题干将二者供奉对象颠倒。", "source": "其中享殿（前殿）为面阔十一间的最高规制大殿，是祭祖主殿，寝殿供奉历代帝后神主，祧庙供奉远祖。", "layer": "ext"}, {"section": "中轴线", "type": "single", "q": "辽代\"五京\"之中，以北京地区为其一的是（ ）。", "options": ["A. 南京", "B. 东京", "C. 西京", "D. 中京"], "answer": "A", "explain": "辽代以北京地区为南京（又称燕京、析津府），是辽\"五京\"之一。", "source": "辽代以北京地区为南京（又称燕京、析津府），是辽\"五京\"（上京、中京、东京、南京、西京）之一。", "layer": "ext"}, {"section": "中轴线", "type": "multi", "q": "北京中轴线所表达的中华文明宇宙观与礼制秩序包括（ ）。", "options": ["A. 天人合一", "B. 礼乐交融", "C. 尊卑有序", "D. 家国同构", "E. 逐水草而居"], "answer": "ABCD", "explain": "北京中轴线集中表达\"中正、中和、中庸\"核心理念及\"天人合一、礼乐交融、尊卑有序、家国同构\"的宇宙观与礼制秩序。", "source": "以及\"天人合一、礼乐交融、尊卑有序、家国同构\"的宇宙观与礼制秩序。", "layer": "ext"}, {"section": "中轴线", "type": "single", "q": "中国历史上最早出现明确中轴线规划格局的都城是（ ）。", "options": ["A. 隋代大兴城", "B. 汉代长安城", "C. 北宋东京城", "D. 明代南京城"], "answer": "A", "explain": "中国历史上最早出现明确中轴线规划格局的是隋代大兴城（唐长安城）；北京中轴线承袭并发展了这一传统。", "source": "中国历史上最早出现明确中轴线规划格局的是隋代大兴城（唐长安城）；北京中轴线则承袭并发展了这一传统。", "layer": "ext"}, {"section": "中轴线", "type": "single", "q": "北京中轴线集中体现了\"（ ）\"的中华文明精神。", "options": ["A. 以中为尊、居中而治", "B. 依山傍水、因地制宜", "C. 崇文抑武、重文轻商", "D. 海纳百川、兼容并蓄"], "answer": "A", "explain": "北京中轴线集中表达\"中正、中和、中庸\"核心理念，体现\"以中为尊、居中而治\"的中华文明精神。", "source": "体现\"以中为尊、居中而治\"的中华文明精神。", "layer": "ext"}, {"section": "中轴线", "type": "multi", "q": "明清定型的北京中轴线自北向南沿线经过的建筑与遗存包括（ ）。", "options": ["A. 万宁桥", "B. 端门", "C. 外金水桥", "D. 正阳门", "E. 卢沟桥"], "answer": "ABCD", "explain": "中轴线北起钟楼、鼓楼，向南经万宁桥、景山、故宫、端门、天安门、外金水桥、天安门广场建筑群、正阳门、中轴线南段道路遗存，南至永定门；卢沟桥不在中轴线上。", "source": "北起钟楼、鼓楼，向南经万宁桥、景山、故宫（紫禁城）、端门、天安门、外金水桥、天安门广场建筑群、正阳门、中轴线南段道路遗存，南至永定门。", "layer": "ext"}, {"section": "中轴线", "type": "single", "q": "元大都时期中轴线的长度约为（ ）。", "options": ["A. 1.5公里", "B. 3.75公里", "C. 5.5公里", "D. 7.8公里"], "answer": "B", "explain": "元大都中轴线南起丽正门、北至钟鼓楼，长度约3.75公里（一说3.9公里）；7.8公里为明清定型后的总长度。", "source": "元大都中轴线南起丽正门、北至钟鼓楼，长度约3.75 公里（一说 3.9 公里）。", "layer": "ext"}, {"section": "中轴线", "type": "single", "q": "元大都中轴线南起（ ），北至钟鼓楼。", "options": ["A. 永定门", "B. 正阳门", "C. 丽正门", "D. 天安门"], "answer": "C", "explain": "元大都中轴线南起丽正门、北至钟鼓楼；永定门、正阳门为明清城南门，天安门为明清皇城正门。", "source": "元大都中轴线南起丽正门、北至钟鼓楼，长度约3.75 公里（一说 3.9 公里）。", "layer": "ext"}, {"section": "中轴线", "type": "multi", "q": "元大都时期中轴线沿线的建筑包括（ ）。", "options": ["A. 万宁桥", "B. 中心阁", "C. 钟楼", "D. 太庙", "E. 皇城宫殿"], "answer": "ABCE", "explain": "元大都中轴线沿线有万宁桥、中心阁、鼓楼、钟楼及皇城宫殿；太庙为明清皇家宗庙，不在元大都中轴线沿线列举中。", "source": "沿线有万宁桥、中心阁、鼓楼、钟楼及皇城宫殿。", "layer": "ext"}, {"section": "中轴线", "type": "single", "q": "元大都中轴线沿线建筑包括万宁桥、（ ）、鼓楼、钟楼及皇城宫殿。", "options": ["A. 中心阁", "B. 太和殿", "C. 午门", "D. 正阳门"], "answer": "A", "explain": "元大都中轴线沿线有万宁桥、中心阁、鼓楼、钟楼及皇城宫殿；太和殿、午门、正阳门均为明清建筑。", "source": "沿线有万宁桥、中心阁、鼓楼、钟楼及皇城宫殿。", "layer": "ext"}, {"section": "中轴线", "type": "single", "q": "除《龙须沟》外，原文所列与北京中轴线存在直接关系的老舍北京题材作品还有（ ）。", "options": ["A. 《茶馆》", "B. 《围城》", "C. 《边城》", "D. 《子夜》"], "answer": "A", "explain": "与中轴线直接关系的文学作品常指老舍的《龙须沟》以及《茶馆》《四世同堂》等北京题材作品。", "source": "常指老舍的《龙须沟》……以及《茶馆》《四世同堂》等北京题材作品。", "layer": "ext"}, {"section": "中轴线", "type": "multi", "q": "2008年前后北京中轴线第二次北延至奥林匹克公园，沿线新增的国家礼仪空间包括（ ）。", "options": ["A. 国家体育场\"鸟巢\"", "B. 国家游泳中心\"水立方\"", "C. 奥林匹克森林公园", "D. 亚运村", "E. 奥体中心"], "answer": "ABC", "explain": "第二次北延（2008年前后）延至奥林匹克公园，含国家体育场
