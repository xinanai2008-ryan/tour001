是（ ）。", "options": ["A. 1961年", "B. 1998年", "C. 2007年", "D. 1918年"], "answer": "B", "explain": "天坛1998年列入《世界遗产名录》；1961年列为第一批全国重点文物保护单位，2007年评为国家5A级旅游景区，1918年辟为公园开放。", "source": "1961 年列为第一批全国重点文物保护单位，1998 年列入《世界遗产名录》，2007 年评为国家 5A 级旅游景区。", "layer": "ext"}, {"section": "天坛", "type": "judge", "q": "天坛占地面积273公顷，相当于紫禁城的近4倍。", "answer": "对", "explain": "原文载明天坛占地面积273公顷（约273万平方米），相当于紫禁城的近4倍。", "source": "占地面积：273 公顷（约 273 万平方米），相当于紫禁城的近 4 倍。", "layer": "ext"}, {"section": "天坛", "type": "single", "q": "明清两代到天坛祭祀次数最多的皇帝是（ ）。", "options": ["A. 明永乐帝", "B. 明嘉靖帝", "C. 清乾隆帝", "D. 清光绪帝"], "answer": "C", "explain": "清乾隆帝在位60年，到天坛祭祀155次，为明清两代祭祀次数最多的皇帝。", "source": "其中清乾隆帝最多——在位 60 年，到天坛祭祀 155 次。", "layer": "ext"}, {"section": "天坛", "type": "judge", "q": "天坛于1998年被列为第一批全国重点文物保护单位。", "answer": "错", "explain": "天坛1961年列为第一批全国重点文物保护单位，1998年列入的是《世界遗产名录》。", "source": "1961 年列为第一批全国重点文物保护单位，1998 年列入《世界遗产名录》，2007 年评为国家 5A 级旅游景区。", "layer": "ext"}, {"section": "天坛", "type": "multi", "q": "明清两代皇帝在天坛举行的祭祀活动包括（ ）。", "options": ["A. 冬至日于圜丘坛祭天", "B. 孟春（正月）于祈谷坛祈谷", "C. 孟夏遇旱于圜丘坛行常雩礼祈雨", "D. 春分日于祈年殿祭日"], "answer": "ABC", "explain": "天坛是明清皇帝“祭天”“祈谷”的场所：冬至于圜丘坛祭天，孟春于祈谷坛祈谷，孟夏遇旱于圜丘坛行常雩礼。原文无春分祭日于祈年殿之说。", "source": "作用：明清两代皇帝“祭天”“祈谷”的场所——冬至日于圜丘坛祭天，孟春（正月）于祈谷坛祈谷，孟夏遇旱则于圜丘坛行常雩礼（祈雨）。", "layer": "ext"}, {"section": "天坛", "type": "single", "q": "中国古代君王最后一次在天坛举行祭天仪式是在（ ）。", "options": ["A. 1889年", "B. 1896年", "C. 1907年", "D. 1918年"], "answer": "C", "explain": "光绪三十三年（1907年）为中国古代君王最后一次在天坛举行祭天仪式。", "source": "（光绪三十三年／1907 年为中国古代君王最后一次在天坛举行祭天仪式。）", "layer": "ext"}, {"section": "天坛", "type": "judge", "q": "天坛坛域北圆南方，寓意“天圆地方”，整体布局呈“回”字形。", "answer": "对", "explain": "原文明确坛域北圆南方，寓意“天圆地方”；整体布局呈“回”字形，由两道坛墙环护。", "source": "坛域北圆南方，寓意“天圆地方”；整体布局呈“回”字形；建筑设计集明、清两代技艺之大成", "layer": "ext"}, {"section": "天坛", "type": "single", "q": "明朝将天地合祀改为天地分祀的时间是（ ）。", "options": ["A. 明永乐十八年（1420年）", "B. 明永乐十九年（1421年）", "C. 明嘉靖九年（1530年）", "D. 清顺治二年（1645年）"], "answer": "C", "explain": "明嘉靖九年（1530年），嘉靖帝采纳给事中夏言建议，恢复天地分祀旧制。", "source": "明嘉靖九年（1530 年）。嘉靖帝采纳给事中夏言建议，恢复天地分祀旧制，建圜丘于南郊祭天、方泽于北郊祭地", "layer": "ext"}, {"section": "天坛", "type": "judge", "q": "七星石位于祈谷坛东南方，实为七块青石，石上凿有山形纹样。", "answer": "错", "explain": "七星石实为八块青石：七块大青石为明嘉靖年间放置，清乾隆时又增置一块小青石。", "source": "七星石：位于祈谷坛（长廊）东南方，实为八块青石，石上凿有山形纹样。", "layer": "ext"}, {"section": "天坛", "type": "multi", "q": "圜丘坛周围的四座天门包括（ ）。", "options": ["A. 泰元门", "B. 昭亨门", "C. 广利门", "D. 成贞门", "E. 古稀门"], "answer": "ABCD", "explain": "圜丘坛周围4座坛门为东泰元门、南昭亨门、西广利门、北成贞门，取《易经·乾卦》“元、亨、利、贞”。古稀门是皇乾殿院落西角门。", "source": "圜丘坛周围 4 座：东泰元门、南昭亨门、西广利门、北成贞门（取《易经·乾卦》“元、亨、利、贞”，称“天之四德”）", "layer": "ext"}, {"section": "天坛", "type": "single", "q": "明嘉靖帝采纳哪位给事中的建议，恢复天地分祀旧制？（ ）", "options": ["A. 夏言", "B. 朱棣", "C. 朱厚熜", "D. 弘历"], "answer": "A", "explain": "嘉靖九年（1530年），嘉靖帝采纳给事中夏言的建议恢复天地分祀旧制；朱棣、朱厚熜、弘历分别为永乐帝、嘉靖帝、乾隆帝。", "source": "明嘉靖九年（1530 年）。嘉靖帝采纳给事中夏言建议，恢复天地分祀旧制", "layer": "ext"}, {"section": "天坛", "type": "judge", "q": "明清两代共有22位皇帝在天坛举行过祭祀大典，共计654次。", "answer": "对", "explain": "原文明确明清两代共有22位皇帝在天坛举行过祭祀大典，共计654次。", "source": "明清两代共有 22 位皇帝在天坛举行过祭祀大典，共计 654 次。", "layer": "ext"}, {"section": "天坛", "type": "single", "q": "天坛初建时的名称是（ ）。", "options": ["A. 天地坛", "B. 天坛", "C. 祈谷坛", "D. 大享殿"], "answer": "A", "explain": "天坛初名“天地坛”，因建成时兼具祭天与祭地功能（大祀殿实行天地合祀）而得名，嘉靖九年（1530年）天地分祀后更名“天坛”。", "source": "初建名称：“天地坛”。命名原因：因建成时兼具祭天与祭地的功能（在大祀殿实行天地合祀），故名“天地坛”。", "layer": "ext"}, {"section": "天坛", "type": "judge", "q": "历史上在天坛举行第一次祭祀盛典的时间是明永乐十八年（1420年）。", "answer": "错", "explain": "第一次祭祀盛典为明永乐十九年（1421年）正月，永乐十八年（1420年）是天坛始建建成之年。", "source": "明永乐十九年（1421 年）正月（正月十一日甲戌日），明成祖朱棣率文武百官在北京天地坛大祀殿“大祀天地于南郊”", "layer": "ext"}, {"section": "天坛", "type": "multi", "q": "历史上对天坛初建、改建和扩建做出贡献的皇帝有（ ）。", "options": ["A. 明永乐帝（朱棣）", "B. 明嘉靖帝（朱厚熜）", "C. 清乾隆帝（弘历）", "D. 明崇祯帝"], "answer": "ABC", "explain": "明永乐帝初建天坛（天地坛），明嘉靖帝改建更制（天地分祀、建圜丘、大享殿等），清乾隆帝大规模扩建改建。原文未提及明崇祯帝。", "source": "1. 明永乐帝（朱棣）——初建。2. 明嘉靖帝（朱厚熜）——改建（更制）。3. 清乾隆帝（弘历）——大规模扩建、改建。", "layer": "ext"}, {"section": "天坛", "type": "single", "q": "天坛内百年以上古树的数量是（ ）。", "options": ["A. 654株", "B. 3562株", "C. 6000株", "D. 6万余株"], "answer": "B", "explain": "天坛现有各类树木6万多株，其中百年以上古树3562株（或“3500多株”）。6万余株为树木总数。", "source": "天坛现有各类树木 6 万多株，其中百年以上古树 3562 株（或“3500 多株”）。", "layer": "ext"}, {"section": "天坛", "type": "judge", "q": "民国七年（1918年）1月1日，天坛辟为天坛公园，正式对外开放。", "answer": "对", "explain": "原文载明民国七年（1918年）1月1日（元旦），天坛辟为天坛公园，正式对外开放。", "source": "民国七年（1918 年）1 月 1 日（元旦），天坛辟为天坛公园，正式对外开放。", "layer": "ext"}, {"section": "天坛", "type": "single", "q": "祈年殿的总高约为（ ）。", "options": ["A. 28米", "B. 29米", "C. 38米", "D. 45米"], "answer": "C", "explain": "祈年殿总高约38米（一说38.2米），坐落于三层汉白玉圆台之上。", "source": "高度：总高约 38 米（一说 38.2 米；殿身高约 31.6—32 米，连同三层坛台）", "layer": "ext"}, {"section": "天坛", "type": "judge", "q": "祈年殿内圈龙井柱共4根，象征一日十二个时辰。", "answer": "错", "explain": "内圈龙井柱4根象征一年四季（春夏秋冬）；象征一日十二时辰的是外圈12根檐柱。", "source": "内圈 龙井柱（通天柱） 4 根（高 19.2 米、直 径 1.2 米） 一年四季（春夏秋 冬）；外圈 檐柱 12 根 一日 12 个时辰", "layer": "ext"}, {"section": "天坛", "type": "multi", "q": "下列建筑中，属于祈谷坛建筑群的有（ ）。", "options": ["A. 祈年殿", "B. 皇乾殿", "C. 七十二长廊（供菜廊）", "D. 皇穹宇", "E. 宰牲亭"], "answer": "ABCE", "explain": "祈谷坛建筑群包括祈年门、祈年殿、皇乾殿、东西配殿、神厨、神库、宰牲亭、七十二长廊、具服台、七星石；皇穹宇属圜丘坛建筑群。", "source": "祈谷坛建筑群：祈年门、祈年殿、皇乾殿、东西配殿、神厨、神库、宰牲亭、七十二长廊（供菜廊）、具服台、七星石。", "layer": "ext"}, {"section": "天坛", "type": "single", "q": "现存祈年殿最后一次重建竣工于（ ）。", "options": ["A. 光绪十五年（1889年）", "B. 光绪十六年（1890年）", "C. 光绪二十二年（1896年）", "D. 光绪三十三年（1907年）"], "answer": "C", "explain": "祈年殿1889年遭雷击焚毁，1890年开始重建，光绪二十二年（1896年）重建竣工，历时6年。", "source": "光绪十六年（1890 年）开始重建……光绪二十二年（1896 年）重建竣工，历时 6 年。现存祈年殿即此次重建后的形制。", "layer": "ext"}, {"section": "天坛", "type": "judge", "q": "回音壁是皇穹宇的圆形围墙，用山东临清澄浆砖“磨砖对缝”砌成。", "answer": "对", "explain": "原文明确回音壁为皇穹宇的圆形围墙，由山东临清澄浆砖“磨砖对缝”砌成。", "source": "回音壁—皇穹宇的圆形围墙（高 3.72 米、厚 0.9 米、直径 61.5 米、周长 193.2 米，山东临清澄浆砖“磨砖对缝”砌成）", "layer": "ext"}, {"section": "天坛", "type": "single", "q": "祈年殿遭雷击起火焚毁的时间是（ ）。", "options": ["A. 光绪十五年（1889年）", "B. 光绪十六年（1890年）", "C. 光绪二十二年（1896年）", "D. 光绪三十三年（1907年）"], "answer": "A", "explain": "清光绪十五年（1889年）八月二十四日，祈年殿遭雷击（雷火）起火焚毁，因楹柱为沉香（檀香）木，燃烧时香飘数里。", "source": "清光绪十五年（1889 年）八月二十四日（公历 9 月 18 日），祈年殿遭雷击（雷火）起火焚毁", "layer": "ext"}, {"section": "天坛", "type": "judge", "q": "明清时期皇帝每年冬至日到圜丘坛祭天，祭天大典于日出前七刻（约凌晨4时15分）开始。", "answer": "对", "explain": "原文：祭天时间为每年冬至日，开始时间为日出前七刻（约凌晨4时15分），以望灯杆上点亮灯笼为大典开始与结束的时间标志。", "source": "祭天时间：每年冬至日。开始时间：日出前七刻（约凌晨4时15分），届时望灯杆上点亮灯笼作为大典开始与结束的时间标志。", "layer": "ext"}, {"section": "天坛", "type": "multi", "q": "下列关于祈年殿丹陛浮雕的说法，正确的有（ ）。", "options": ["A. 共有三组石浮雕", "B. 上层为“双龙山海”", "C. 中层为“双凤山海”", "D. 下层为“瑞云山海”", "E. 自上而下依次象征风、云、龙"], "answer": "ABCD", "explain": "祈年殿南三层石阶（丹陛）共三组浮雕，自上而下为“双龙山海”“双凤山海”“瑞云山海”，即上层刻龙、中层刻凤、下层刻云。E项顺序与原文不符。", "source": "祈年殿南三层石阶（丹陛）上共有三组石浮雕，自上而下依次为“双龙山海”、“双凤山海”、“瑞云山海”（即上层刻龙、中层刻凤、下层刻云）", "layer": "ext"}, {"section": "天坛", "type": "single", "q": "明清时期皇帝举行祈谷大典的时辰是（ ）。", "options": ["A. 日出前三刻", "B. 日出前五刻", "C. 日出前七刻", "D. 日出之时"], "answer": "C", "explain": "祈谷大典于日出前七刻（约凌晨4时15分）行礼，天色未亮，需燃殿内灯具。", "source": "时辰：日出前七刻（约凌晨 4 时 15 分）行礼，天色未亮，需燃殿内灯具。", "layer": "ext"}, {"section": "天坛", "type": "judge", "q": "祭天大典开始时，皇帝拜位位于圜丘坛上层坛面正南台阶前。", "answer": "错", "explain": "皇帝拜位位于圜丘坛中层坛面正南台阶前，而非上层。", "source": "皇帝拜位：位于圜丘坛中层坛面正南台阶前（皇帝由此向最上层天心石北侧的皇天上帝、祖宗及众神牌位跪拜）。", "layer": "ext"}, {"section": "天坛", "type": "single", "q": "祈年殿内圈龙井柱的数量及象征含义是（ ）。", "options": ["A. 4根，象征一年四季", "B. 12根，象征一年12个月", "C. 24根，象征一年24节气", "D. 28根，象征二十八星宿"], "answer": "A", "explain": "内圈龙井柱（通天柱）4根，象征一年四季；金柱12根象征12个月，中外圈合计24根象征24节气，总计28根象征二十八星宿。", "source": "内圈 龙井柱（通天柱） 4 根（高 19.2 米、直 径 1.2 米） 一年四季（春夏秋 冬）", "layer": "ext"}, {"section": "天坛", "type": "judge", "q": "圜丘坛的内壝墙呈方形，外壝墙呈圆形，即「内方外圆」，象征「天圆地方」。", "answer": "错", "explain": "应为内壝墙呈圆形、外壝墙呈方形，即「内圆外方」。", "source": "内壝墙（内墙）呈圆形，外壝墙（外墙）呈方形——「内圆外方」，象征「天圆地方」（红墙蓝瓦）。", "layer": "ext"}, {"section": "天坛", "type": "multi", "q": "丹陛桥上的三条石板路包括（ ）。", "options": ["A. 神道（神路）", "B. 御道（御路）", "C. 王道（王路）", "D. 官道"], "answer": "ABC", "explain": "丹陛桥三条石板路自东向西为：中间神道（皇天上帝专用）、东侧御道（皇帝专用）、西侧王道（王公百官行走）。", "source": "三条石板路（自东向西）：中间：神道（神路）……东侧：御道（御路）——供皇帝专用；西侧：王道（王路）——供陪祀的王公、百官行走。", "layer": "ext"}, {"section": "天坛", "type": "single", "q": "祈年殿宝顶下的雷公柱象征（ ）。", "options": ["A. 一年四季", "B. 一年24节气", "C. 三十六天罡", "D. 皇帝“一统天下”"], "answer": "D", "explain": "祈年殿宝顶下雷公柱1根，象征皇帝“一统天下”；童柱8根（合计36根）象征三十六天罡。", "source": "宝顶下 雷公柱 1 根 皇帝“一统天下”", "layer": "ext"}, {"section": "天坛", "type": "judge", "q": "圜丘坛上层坛面直径为九丈，中层为十五丈，下层为二十一丈。", "answer": "对", "explain": "原文：上层九丈（一九）、中层十五丈（三五）、下层二十一丈（三七）。", "source": "上层 九丈（一九）取义一；中层 十五丈（三五）取义三、五；下层 二十一丈（三七）取义三、七。", "layer": "ext"}, {"section": "天坛", "type": "single", "q": "皇乾殿的作用是（ ）。", "options": ["A. 宰杀祭祀牲畜的场所", "B. 制作烹饪祭品的厨房", "C. 平时供奉神版的“天库”", "D. 存放祭器礼器的库房"], "answer": "C", "explain": "皇乾殿位于祈谷坛以北，是平时供奉祈谷坛祭祀正位与配位神版的大殿，相当于祈谷坛的“天库”。A、B、D分别为宰牲亭、神厨、神库的用途。", "source": "作用：是平时供奉祈谷坛祭祀正位（皇天上帝）与配位（清代前八位皇帝）神版（神牌）的大殿，相当于祈谷坛的“天库”", "layer": "ext"}, {"section": "天坛", "type": "judge", "q": "圜丘坛望灯杆始建于明永乐年间，初建1座，明崇祯年间增至3座。", "answer": "错", "explain": "望灯杆始建于明嘉靖年间，不是永乐年间。", "source": "望灯杆：高约9丈（约30米），始建于明嘉靖年间（初建1座，明崇祯年间增至3座；1915年袁世凯祭天时拆掉2根，现仅存其一，1993年复建）。", "layer": "ext"}, {"section": "天坛", "type": "multi", "q": "天坛中的四大声学现象包括（ ）。", "options": ["A. 回音壁", "B. 三音石", "C. 天心石", "D. 对话石", "E. 七星石"], "answer": "ABCD", "explain": "天坛四大声学现象为回音壁、三音石、天心石（亿兆景从石）、对话石；七星石是祈谷坛东南方的八块青石，不属于声学现象。", "source": "天坛中的四大声学现象：1. 回音壁……2. 三音石……3. 天心石（亿兆景从石）……4. 对话石……", "layer": "ext"}, {"section": "天坛", "type": "single", "q": "皇乾殿院落西角门称为（ ）。", "options": ["A. 古稀门", "B. 成贞门", "C. 泰元门", "D. 广利门"], "answer": "A", "explain": "清乾隆皇帝年满七十（古稀）后，因年事已高、行礼不便绕行，特于皇乾殿院落西侧开辟此门，故名“古稀门”。", "source": "该门称“古稀门”。清乾隆皇帝年满七十（古稀）之后……特于皇乾殿院落西侧开辟此门，以便出入，故名“古稀门”。", "layer": "ext"}, {"section": "天坛", "type": "judge", "q": "祭天大典时望灯杆上悬挂的大灯笼内立5只巨蜡，故称「蟠龙通宵宝蜡」。", "answer": "对", "explain": "灯笼内立5只巨蜡（蟠龙通宵宝蜡）。", "source": "蜡烛：灯笼内立5只巨蜡（蟠龙通宵宝蜡），故称「盘龙（蟠龙）通宵宝蜡」。", "layer": "ext"}, {"section": "天坛", "type": "single", "q": "供菜廊（七十二长廊）共有（ ）。", "options": ["A. 36间", "B. 54间", "C. 72间", "D. 108间"], "answer": "C", "explain": "供菜廊位于祈谷坛东砖门外，是一条连檐通脊的曲尺形长廊，共72间，长350米、宽5米，俗称“七十二连房”。", "source": "是一条连檐通脊的曲尺形长廊，共 72 间，长 350 米、宽 5 米，俗称“七十二连房”", "layer": "ext"}, {"section": "天坛", "type": "judge", "q": "皇穹宇东配殿供奉夜明之神（月）、云师、雨师、风伯、雷师神牌。", "answer": "错", "explain": "夜明之神（月）等供奉于西配殿；东配殿供奉大明之神（日）、北斗七星、金木水火土五星、二十八宿、周天星辰神牌。", "source": "东配殿供奉大明之神（日）、北斗七星、金木水火土五星、二十八宿、周天星辰神牌；西配殿供奉夜明之神（月）、云师、雨师、风伯、雷师神牌。", "layer": "ext"}, {"section": "天坛", "type": "multi", "q": "下列属于明清皇帝圜丘坛祭天大典九项仪程的有（ ）。", "options": ["A. 燔柴迎帝神", "B. 奠玉帛", "C. 斋戒", "D. 望燎"], "answer": "ABD", "explain": "九项仪程为：燔柴迎帝神、奠玉帛、进俎、初献礼、亚献礼、终献礼、撤馔、送帝神、望燎。「斋戒」不在其中。", "source": "九项仪程：燔柴迎帝神（燔柴迎神）、奠玉帛、进俎、初献礼、亚献礼、终献礼、撤馔、送帝神（送神）、望燎。", "layer": "ext"}, {"section": "天坛", "type": "single", "q": "丹陛桥上供皇天上帝专用、连皇帝也不可行走的石板路是（ ）。", "options": ["A. 中间的神道（神路）", "B. 东侧的御道（御路）", "C. 西侧的王道（王路）", "D. 官道"], "answer": "A", "explain": "丹陛桥三条石板路自东向西：中间神道供皇天上帝专用，皇帝亦不可行走；东侧御道供皇帝专用；西侧王道供王公百官行走。", "source": "中间：神道（神路）——供皇天上帝（天帝）专用，皇帝亦不可行走", "layer": "ext"}, {"section": "天坛", "type": "judge", "q": "斋宫主体建筑坐西朝东（面向东），以示皇帝对天称臣、不敢称尊。", "answer": "对", "explain": "祭天建筑坐北朝南，皇帝在「天」面前只能退居臣子之位，故斋宫坐西朝东。", "source": "斋宫主体建筑的朝向：坐西朝东（面向东）。……故斋宫坐西朝东，以示对天称臣、不敢称尊。", "layer": "ext"}, {"section": "天坛", "type": "single", "q": "三音石位于皇穹宇殿前甬道由北向南第（ ）块石板。", "options": ["A. 第一块", "B. 第二块", "C. 第三块", "D. 第十八块"], "answer": "C", "explain": "三音石为皇穹宇殿前甬道由北向南第三块石板，恰为回音壁圆心，击掌可听到三声回音；第十八块为对话石。", "source": "三音石—皇穹宇殿前甬道由北向南第三块石板（恰为回音壁圆心）。在此击掌可听到三声回音", "layer": "ext"}, {"section": "天坛", "type": "judge", "q": "斋宫正殿内悬挂的匾额为「玉振金声」，系乾隆御笔。", "answer": "错", "explain": "斋宫正殿匾额为「钦若昊天」（乾隆御笔）；「玉振金声」匾在神乐署凝禧殿。", "source": "斋宫正殿内悬挂匾额的内容及题写者：钦若昊天，乾隆御笔。", "layer": "ext"}, {"section": "天坛", "type": "multi", "q": "下列关于圜丘坛三层坛面直径的说法正确的有（ ）。", "options": ["A. 上层直径九丈", "B. 中层直径十五丈", "C. 下层直径二十一丈", "D. 三层直径之和为50丈"], "answer": "ABC", "explain": "三层直径分别为九丈、十五丈、二十一丈，之和为45丈（9+15+21），D错误。", "source": "上层 九丈（一九）；中层 十五丈（三五）；下层 二十一丈（三七）……三层坛面直径之和为45丈（9+15+21）。", "layer": "ext"}, {"section": "天坛", "type": "single", "q": "祭天大典开始时，皇帝的拜位位于圜丘坛（ ）。", "options": ["A. 上层坛面正南台阶前", "B. 中层坛面正南台阶前", "C. 下层坛面正北台阶前", "D. 外壝墙内棂星门前"], "answer": "B", "explain": "皇帝拜位位于圜丘坛中层坛面正南台阶前，由此向最上层天心石北侧的神位跪拜。", "source": "皇帝拜位：位于圜丘坛中层坛面正南台阶前（皇帝由此向最上层天心石北侧的皇天上帝、祖宗及众神牌位跪拜）。", "layer": "ext"}, {"section": "天坛", "type": "judge", "q": "明初（神乐观时期）神乐署中乐生、舞生均由道士充任，清乾隆年间尽逐道士后改由八旗子弟充任。", "answer": "对", "explain": "明初乐生、舞生均由道士（道童）充任；乾隆年间严禁乐官习道教、尽逐道士后，改由年少俊秀的八旗子弟充任。", "source": "明初（神乐观时期）乐生、舞生均由道士（道童）充任——神乐观内官员、乐舞生皆为道士。清乾隆年间严禁乐官习道教、尽逐道士后，乐舞生改由年少俊秀的八旗子弟充任。", "layer": "ext"}, {"section": "天坛", "type": "single", "q": "圜丘坛三层坛面直径之和为45丈，既是九的倍数，又暗含（ ）之意。", "options": ["A. 二十八星宿", "B. 二十四节气", "C. 九五之尊", "D. 三十六天罡"], "answer": "C", "explain": "三层坛面直径之和为45丈（9+15+21），既是九的倍数，又暗含「九五之尊」之意。", "source": "三层坛面直径之和为45丈（9+15+21），既是九的倍数，又暗含「九五之尊」之意。", "layer": "ext"}, {"section": "天坛", "type": "judge", "q": "天坛按南京天地坛规制建成，初名“天地坛”，后经明嘉靖、清乾隆等朝增建改建，至清乾隆年间最终形成今日格局。", "answer": "对", "explain": "原文明确天坛按南京天地坛规制始建建成，初名“天地坛”，至清乾隆年间最终形成今日格局。", "source": "始建与建成：明永乐十八年（1420 年）始建并建成（按南京天地坛规制），初名“天地坛”；后经明嘉靖、清乾隆等朝增建改建，至清乾隆年间最终形成今日格局。", "layer": "ext"}, {"section": "天坛", "type": "multi", "q": "下列属于圜丘坛周围附属设施的有（ ）。", "options": ["A. 燔柴炉", "B. 瘗坎", "C. 铁燎炉", "D. 望灯杆", "E. 斋宫"], "answer": "ABCD", "explain": "圜丘坛附属设施包括燔柴炉、瘗坎、铁燎炉、望灯杆、具服台、宰牲亭神厨神库、皇穹宇、棂星门24座等；斋宫为独立建筑群，不在圜丘坛附属设施之列。", "source": "燔柴炉……瘗坎……铁燎炉……望灯杆……具服台……宰牲亭、神厨、神库（坛东）；皇穹宇（坛北，即「天库」）；棂星门24座。", "layer": "ext"}, {"section": "天坛", "type": "single", "q": "圜丘坛三层栏板分别为72、108、180块，合计（ ）块。", "options": ["A. 3402块", "B. 378块", "C. 360块", "D. 365块"], "answer": "C", "explain": "三层栏板分别为72、108、180块，合计360块。", "source": "三层栏板分别为72、108、180块，合计360块；三层共378个「九」，扇形石合计3402块。", "layer": "ext"}, {"section": "天坛", "type": "judge", "q": "天坛整体布局呈“回”字形，由两道坛墙环护，分为内坛、外坛两部分，主要建筑集中于外坛。", "answer": "错", "explain": "天坛由两道坛墙环护分为内坛、外坛，但主要建筑集中于内坛，而非外坛。", "source": "整体布局呈“回”字形，由两道坛墙环护，分为内坛、外坛两部分，主要建筑集中于内坛。", "layer": "ext"}, {"section": "天坛", "type": "single", "q": "天心石（太极石、亿兆景从石）位于（ ）。", "options": ["A. 圜丘坛上层台面正中", "B. 圜丘坛中层台面正中", "C. 皇穹宇殿前甬道第三块石板处", "D. 燔柴炉东侧"], "answer": "A", "explain": "天心石位于圜丘坛上层（第三层）台面正中，又称太极石、亿兆景从石。", "source": "位于圜丘坛上层（第三层）台面正中的圆形石板，又称太极石、亿兆景从石（坛面中心即为天心石，祭天时正位幄次设于天心石稍北，南向）。", "layer": "ext"}, {"section": "天坛", "type": "judge", "q": "七星石中七块大青石代表东岳泰山七峰，清乾隆时增置的小青石代表昆仑山。", "answer": "错", "explain": "清乾隆时在东北方位增置的小青石代表长白山（满族龙兴之地），而非昆仑山。", "source": "清乾隆时在东北方位增置一块小青石，代表长白山（满族龙兴之地），寓意满族亦为华夏一员。", "layer": "ext"}, {"section": "天坛", "type": "multi", "q": "下列属于皇穹宇东配殿供奉内容的有（ ）。", "options": ["A. 大明之神（日）", "B. 北斗七星", "C. 金木水火土五星", "D. 夜明之神（月）"], "answer": "ABC", "explain": "东配殿供奉大明之神（日）、北斗七星、金木水火土五星、二十八宿、周天星辰神牌；夜明之神（月）供奉于西配殿。", "source": "东配殿供奉大明之神（日）、北斗七星、金木水火土五星、二十八宿、周天星辰神牌。", "layer": "ext"}, {"section": "天坛", "type": "single", "q": "圜丘坛燔柴炉位于坛的（ ），祭天开始时焚烧牛犊以「燔柴迎帝神」。", "options": ["A. 东北方", "B. 东南方", "C. 西南方", "D. 西北方"], "answer": "B", "explain": "燔柴炉位于东南，绿琉璃砖砌，高约9尺。", "source": "燔柴炉（东南，绿琉璃砖砌，高约9尺）——祭天开始时焚烧牛犊以「燔柴迎帝神」，礼毕焚烧皇天上帝祭品，皇帝在西侧望燎位行「望燎」礼。", "layer": "ext"}, {"section": "天坛", "type": "judge", "q": "明清两代在天坛祭祀次数最多的是清乾隆帝，他在位60年，共到天坛祭祀145次。", "answer": "错", "explain": "乾隆帝在位60年到天坛祭祀155次，题干“145次”与原文不符。", "source": "其中清乾隆帝最多——在位 60 年，到天坛祭祀 155 次。", "layer": "ext"}, {"section": "天坛", "type": "single", "q": "圜丘坛瘗坎的用途是（ ）。", "options": ["A. 焚化清代前八位皇帝配位供品", "B. 掩埋牛尾、牛毛、牛血", "C. 吊挂祭天大灯笼", "D. 供皇帝盥洗更衣"], "answer": "B", "explain": "瘗坎位于燔柴炉东侧，为圆形凹坑，掩埋牛尾、牛毛、牛血，喻祭天同时不忘祭地。", "source": "瘗坎（燔柴炉东侧，圆形凹坑）——掩埋牛尾、牛毛、牛血，喻祭天同时不忘祭地。", "layer": "ext"}, {"section": "天坛", "type": "judge", "q": "天坛现有各类树木6万多株，其中百年以上古树3562株。", "answer": "对", "explain": "原文载明天坛现有各类树木6万多株，其中百年以上古树3562株（或“3500多株”）。", "source": "天坛现有各类树木 6 万多株，其中百年以上古树 3562 株（或“3500 多株”）。", "layer": "ext"}, {"section": "天坛", "type": "multi", "q": "下列关于圜丘坛望灯杆的说法正确的有（ ）。", "options": ["A. 高约9丈（约30米）", "B. 始建于明嘉靖年间", "C. 明崇祯年间增至3座", "D. 1915年后仍存3座"], "answer": "ABC", "explain": "1915年袁世凯祭天时拆掉2根，现仅存其一，1993年复建，故D错误。", "source": "望灯杆：高约9丈（约30米），始建于明嘉靖年间（初建1座，明崇祯年间增至3座；1915年袁世凯祭天时拆掉2根，现仅存其一，1993年复建）。", "layer": "ext"}, {"section": "天坛", "type": "single", "q": "祭天大典时望灯杆上吊挂的大灯笼直径为（ ）。", "options": ["A. 0.9米", "B. 1.3米", "C. 2.15米", "D. 2.5米"], "answer": "B", "explain": "灯笼直径1.3米、高2.15米。", "source": "灯笼：祭天大典时在望灯杆上吊挂直径1.3米、高2.15米的大灯笼。", "layer": "ext"}, {"section": "天坛", "type": "judge", "q": "天地坛更名为“天坛”，是在明嘉靖九年（1530年）实行天地分祀之后。", "answer": "对", "explain": "明嘉靖九年（1530年）天地分祀后，天地坛更名为“天坛”（主流官方口径为嘉靖九年）。", "source": "改称时间：明嘉靖九年（1530 年）天地分祀后，天地坛更名为“天坛”。", "layer": "ext"}, {"section": "天坛", "type": "single", "q": "望灯杆被拆掉2根发生于（ ）。", "options": ["A. 1907年光绪帝祭天时", "B. 1915年袁世凯祭天时", "C. 1918年天坛辟为公园时", "D. 1937年改造园林步廊时"], "answer": "B", "explain": "1915年袁世凯祭天时拆掉2根，现仅存其一，1993年复建。", "source": "始建于明嘉靖年间（初建1座，明崇祯年间增至3座；1915年袁世凯祭天时拆掉2根，现仅存其一，1993年复建）。", "layer": "ext"}, {"section": "天坛", "type": "judge", "q": "祈年殿是明清两代皇帝孟春（正月）祈谷的专用建筑，在此举行祈谷大典。", "answer": "对", "explain": "祈年殿为明清两代皇帝孟春（正月）祈谷的专用建筑，祈求风调雨顺、五谷丰登。", "source": "作用：明清两代皇帝孟春（正月）祈谷的专用建筑，在此举行祈谷大典，祈求皇天上帝保佑风调雨顺、五谷丰登。", "layer": "ext"}, {"section": "天坛", "type": "multi", "q": "下列关于斋宫正殿月台陈设的说法正确的有（ ）。", "options": ["A. 月台上左右各一座石亭", "B. 北侧为斋戒铜人亭", "C. 南侧为时辰亭", "D. 正面台阶中间为云纹浮雕丹陛"], "answer": "ABCD", "explain": "月台上左右各一座石亭：北侧（左）斋戒铜人亭，南侧（右）时辰亭；正面台阶中间为云纹浮雕丹陛。", "source": "月台（丹墀）上左右各一座石亭：北侧（左）：斋戒铜人亭……南侧（右）：时辰亭……正面台阶中间为云纹浮雕丹陛。", "layer": "ext"}, {"section": "天坛", "type": "single", "q": "皇穹宇西配殿供奉的神牌是（ ）。", "options": ["A. 大明之神（日）、北斗七星神牌", "B. 夜明之神（月）、云师、雨师、风伯、雷师神牌", "C. 金木水火土五星、二十八宿神牌", "D. 皇天上帝及清代前八位皇帝神牌"], "answer": "B", "explain": "西配殿供奉夜明之神（月）、云师、雨师、风伯、雷师神牌；A、C为东配殿，D为正殿。", "source": "西配殿供奉夜明之神（月）、云师、雨师、风伯、雷师神牌。", "layer": "ext"}, {"section": "天坛", "type": "judge", "q": "祈年殿遭焚毁后，光绪十六年（1890年）开始重建，历时8年竣工。", "answer": "错", "explain": "祈年殿1890年开始重建，光绪二十二年（1896年）竣工，历时6年，而非8年。", "source": "光绪十六年（1890 年）开始重建……光绪二十二年（1896 年）重建竣工，历时 6 年。", "layer": "ext"}, {"section": "天坛", "type": "single", "q": "清朝皇穹宇大殿殿顶覆盖的琉璃瓦颜色为（ ）。", "options": ["A. 黄色", "B. 绿色", "C. 蓝色（青色）", "D. 黑色"], "answer": "C", "explain": "皇穹宇大殿覆蓝色（青色）琉璃瓦，鎏金宝顶，象征青天。", "source": "蓝色（青色）琉璃瓦，鎏金宝顶，象征青天。", "layer": "ext"}, {"section": "天坛", "type": "judge", "q": "供菜廊位于祈谷坛西侧，是明清时期运送祭祀供品的专用通道。", "answer": "错", "explain": "供菜廊位于祈谷坛东砖门外（祈谷坛东侧），而非西侧；其作为运送祭祀供品专用通道的表述正确。", "source": "位置：位于祈谷坛东砖门外（祈谷坛东侧）……作用：明清时期是运送祭祀供品的专用通道。", "layer": "ext"}, {"section": "天坛", "type": "multi", "q": "下列关于神乐署的说法正确的有（ ）。", "options": ["A. 正殿即凝禧殿", "B. 明代正殿称「太和殿」", "C. 归礼部太常寺管辖", "D. 凝禧殿内悬乾隆御笔「玉振金声」匾"], "answer": "ABCD", "explain": "神乐署正殿即凝禧殿，明代称太和殿，康熙年间改名；归礼部太常寺管辖；殿内悬乾隆御笔「玉振金声」匾（青地金书）。", "source": "神乐署正殿即凝禧殿：明代称「太和殿」……明清时期神乐署的管理部门：归礼部太常寺管辖。殿内悬挂乾隆皇帝御笔「玉振金声」匾（青地金书）。", "layer": "ext"}, {"section": "天坛", "type": "single", "q": "清朝皇穹宇大殿内神版上使用的文字是（ ）。", "options": ["A. 汉文一种", "B. 满文一种", "C. 满文与汉文两种", "D. 满、汉、蒙三种"], "answer": "C", "explain": "皇穹宇大殿内神版使用满文与汉文两种文字。", "source": "清朝皇穹宇大殿内神版上使用的文字：使用满文与汉文两种文字。", "layer": "ext"}, {"section": "天坛", "type": "judge", "q": "圜丘坛是明清两代皇帝冬至日举行“祀天”（祭天）大典的场所，俗称祭天台、拜天台。", "answer": "对", "explain": "原文明确圜丘坛为明清两代皇帝冬至日祭天大典场所，俗称祭天台、拜天台、祭台。", "source": "明清两代皇帝冬至日举行“祀天”（祭天）大典的场所，俗称祭天台、拜天台、祭台。", "layer": "ext"}, {"section": "天坛", "type": "single", "q": "斋宫正殿得名「无梁殿」的原因是（ ）。", "options": ["A. 殿内不用一根立柱", "B. 砖券拱顶结构，殿内不用梁枋大木", "C. 殿顶无正脊", "D. 殿内不设大梁式匾额"], "answer": "B", "explain": "正殿面阔五间，为砖券拱顶结构，殿内不用梁枋大木（不露栋梁榱桷痕迹），故名「无梁殿」。", "source": "正殿面阔五间，为砖券拱顶结构，殿内不用梁枋大木（不露栋梁榱桷痕迹），故名「无梁殿」。", "layer": "ext"}, {"section": "天坛", "type": "judge", "q": "圜丘坛祭天大典九项仪程的最后一项是「送帝神」。", "answer": "错", "explain": "九项仪程依次为燔柴迎帝神、奠玉帛、进俎、初献礼、亚献礼、终献礼、撤馔、送帝神、望燎，最后一项是「望燎」，「送帝神」为第八项。", "source": "九项仪程：燔柴迎帝神（燔柴迎神）、奠玉帛、进俎、初献礼、亚献礼、终献礼、撤馔、送帝神（送神）、望燎。", "layer": "ext"}, {"section": "天坛", "type": "multi", "q": "下列坛门中，属于祈谷坛的有（ ）。", "options": ["A. 东天门", "B. 西天门", "C. 北天门", "D. 泰元门", "E. 昭亨门"], "answer": "ABC", "explain": "祈谷坛东、西、北3座坛门为东天门、西天门、北天门；泰元门、昭亨门为圜丘坛周围四门之二。", "source": "祈谷坛东、西、北 3 座：东天门、西天门、北天门（成贞门一门两用，亦为祈谷坛的南天门）。", "layer": "ext"}, {"section": "天坛", "type": "single", "q": "斋宫正殿月台三出陛的正阶为（ ）。", "options": ["A. 9级", "B. 12级", "C. 13级", "D. 15级"], "answer": "C", "explain": "月台崇基石栏、三出陛，正阶13级，左右各15级。", "source": "绿琉璃瓦庑殿顶，汉白玉石基与石栏，殿前月台崇基石栏、三出陛（正阶13级，左右各15级），正面台阶中间为云纹浮雕丹陛。", "layer": "ext"}, {"section": "天坛", "type": "judge", "q": "圜丘坛内壝墙呈圆形、外壝墙呈方形，红墙蓝瓦，象征「天圆地方」。", "answer": "对", "explain": "内壝墙圆形、外壝墙方形，即「内圆外方」，红墙蓝瓦，象征「天圆地方」。", "source": "内壝墙（内墙）呈圆形，外壝墙（外墙）呈方形——「内圆外方」，象征「天圆地方」（红墙蓝瓦）。", "layer": "ext"}, {"section": "天坛", "type": "single", "q": "斋宫正殿月台上的斋戒铜人亭位于（ ）。", "options": ["A. 月台北侧（左）", "B. 月台南侧（右）", "C. 正殿之内", "D. 丹陛桥北端"], "answer": "A", "explain": "月台上左右各一座石亭，北侧（左）为斋戒铜人亭，南侧（右）为时辰亭。", "source": "北侧（左）：斋戒铜人亭——石制四柱，绿琉璃瓦方形攒尖顶……南侧（右）：时辰亭——小型殿宇式石龛。", "layer": "ext"}, {"section": "天坛", "type": "judge", "q": "圜丘坛上层坛面围绕天心石铺9圈扇形石，其中第9圈为81块。", "answer": "对", "explain": "上层坛面围绕天心石铺9圈扇形石，第1圈9块，递加至第9圈81块。", "source": "上层坛面围绕天心石铺9圈扇形石（第1圈9块……第9圈81块），中下层亦各9圈递加9块。", "layer": "ext"}, {"section": "天坛", "type": "multi", "q": "下列关于七星石的说法，正确的有（ ）。", "options": ["A. 位于祈谷坛（长廊）东南方", "B. 实为八块青石", "C. 七块大青石代表东岳泰山七峰", "D. 清乾隆时增置一块小青石代表长白山", "E. 石上凿有云形纹样"], "answer": "ABCD", "explain": "七星石实为八块青石，石上凿的是山形纹样而非云形纹样，其余四项与原文相符。", "source": "七星石：位于祈谷坛（长廊）东南方，实为八块青石，石上凿有山形纹样。其中七块大青石为明嘉靖年间放置，代表东岳泰山七峰……清乾隆时在东北方位增置一块小青石，代表长白山", "layer": "ext"}, {"section": "天坛", "type": "single", "q": "斋戒铜人亭内陈设的铜铸人像相传仿（ ）而制。", "options": ["A. 唐朝宰相魏徵", "B. 明嘉靖帝", "C. 清乾隆帝", "D. 袁世凯"], "answer": "A", "explain": "皇帝斋戒时陈设一尊铜铸人像，相传仿唐朝宰相魏徵而制，用以警示皇帝虔诚斋戒。", "source": "皇帝斋戒时于座上陈设一尊铜铸人像（乌纱玉带、手持「斋戒」牌），相传仿唐朝宰相魏徵而制，用以警示皇帝虔诚斋戒。", "layer": "ext"}, {"section": "天坛", "type": "judge", "q": "圜丘坛三层栏板合计360块，三层坛面共有378个「九」。", "answer": "对", "explain": "三层栏板分别为72、108、180块，合计360块；三层共378个「九」。", "source": "三层栏板分别为72、108、180块，合计360块；三层共378个「九」，扇形石合计3402块。", "layer": "ext"}, {"section": "天坛", "type": "single", "q": "斋宫正殿月台南侧时辰亭的用途是（ ）。", "options": ["A. 放置时辰牌，由钦天监官员届时进牌", "B. 陈设铜铸斋戒人像", "C. 存放祭器礼器", "D. 排演中和韶乐"], "answer": "A", "explain": "时辰亭为小型殿宇式石龛，设窄高石座，用于放置时辰牌，由钦天监官员届时进牌。", "source": "南侧（右）：时辰亭——小型殿宇式石龛，设窄高石座，用于放置时辰牌（由钦天监官员届时进牌，皇帝依所奏时辰起驾出宫临坛行礼）。", "layer": "ext"}, {"section": "天坛", "type": "judge", "q": "祭天时正位幄次设于天心石稍南，坐北朝南。", "answer": "错", "explain": "祭天时正位幄次设于天心石稍北，南向，而非稍南。", "source": "坛面中心即为天心石，祭天时正位幄次设于天心石稍北，南向。", "layer": "ext"}, {"section": "天坛", "type": "multi", "q": "明嘉靖帝对天坛的改建（更制）包括（ ）。", "options": ["A. 改天地合祀为天地分祀", "B. 天地坛更名为“天坛”", "C. 在南郊建圜丘坛祭天", "D. 建成圆形三重檐大享殿", "E. 将大享殿三色琉璃瓦统一改为蓝色"], "answer": "ABCD", "explain": "将三色琉璃瓦统一改为蓝色、改大享殿为祈年殿是清乾隆帝的举措，其余四项均为明嘉靖帝改建内容。", "source": "嘉靖九年（1530 年）改天地合祀为分祀……天地坛更名为“天坛”；嘉靖十七年撤大祀殿，二十四年（1545 年）在原址建成圆形三重檐大享殿。", "layer": "ext"}, {"section": "天坛", "type": "single", "q": "斋宫正殿内悬挂的乾隆御笔匾额内容为（ ）。", "options": ["A. 玉振金声", "B. 钦若昊天", "C. 皇天上帝", "D. 中和韶乐"], "answer": "B", "explain": "斋宫正殿悬挂「钦若昊天」匾，乾隆御笔；「玉振金声」匾在神乐署凝禧殿。", "source": "斋宫正殿内悬挂匾额的内容及题写者：钦若昊天，乾隆御笔。", "layer": "ext"}, {"section": "天坛", "type": "judge", "q": "圜丘坛燔柴炉东北方有8座铁燎炉，用于焚化清代前8位皇帝配位供品。", "answer": "对", "explain": "铁燎炉位于燔柴炉东北方共8座，焚化清代前8位皇帝配位供品；内壝东西棂星门外各2座焚化从位供品。", "source": "铁燎炉（燎炉）——燔柴炉东北方8座（焚化清代前8位皇帝配位供品），内壝东西棂星门外各2座（焚化从位供品）。", "layer": "ext"}, {"section": "天坛", "type": "single", "q": "神乐署正殿（凝禧殿）在明代称为（ ）。", "options": ["A. 大祀殿", "B. 大享殿", "C. 太和殿", "D. 显佑殿"], "answer": "C", "explain": "神乐署正殿即凝禧殿，明代称「太和殿」，清康熙年间由康熙帝赐名改为「凝禧殿」。", "source": "明代称「太和殿」（因与紫禁城太和殿重名，清康熙年间／一说康熙十二年1673年由康熙帝赐名改为「凝禧殿」）。", "layer": "ext"}, {"section": "天坛", "type": "judge", "q": "皇穹宇正殿东西两侧前方各设4个方形石台，供奉清代前八位已故皇帝的配位神牌。", "answer": "对", "explain": "正殿正中须弥座供奉皇天上帝神牌，左右（东西两侧）前方各4个方形石台供奉清代前八位已故皇帝配位神牌。", "source": "左右（东西两侧）前方各4个方形石台，供奉清代前八位已故皇帝的配位神牌。", "layer": "ext"}, {"section": "天坛", "type": "multi", "q": "祈年殿的建筑理念体现在（ ）。", "options": ["A. 殿为圆形，象征“天圆”", "B. 三重檐蓝色琉璃瓦象征苍天", "C. 鎏金宝顶层层向上收举，表现“天人合一”", "D. 殿内柱网按天象、历法排列", "E. 是中国古代歇山式建筑仅存的一例"], "answer": "ABCD", "explain": "祈年殿是中国古代明堂式建筑仅存的一例，而非歇山式；其余四项均为原文所述建筑理念。", "source": "殿为圆形，象征“天圆”；三重檐蓝色（青色）琉璃瓦，象征苍天……是中国古代明堂式建筑仅存的一例。", "layer": "ext"}, {"section": "天坛", "type": "single", "q": "清乾隆年间尽逐道士后，神乐署乐舞生改由（ ）充任。", "options": ["A. 年少俊秀的八旗子弟", "B. 太常寺官员", "C. 宫中太监", "D. 汉族举人"], "answer": "A", "explain": "乾隆年间严禁乐官习道教、尽逐道士后，乐舞生改由年少俊秀的八旗子弟充任，由朝廷指派协律郎培训。", "source": "清乾隆年间严禁乐官习道教、尽逐道士后，乐舞生改由年少俊秀的八旗子弟充任，由朝廷指派协律郎培训。", "layer": "ext"}, {"section": "天坛", "type": "judge", "q": "清朝皇穹宇大殿内神版上仅使用汉文一种文字。", "answer": "错", "explain": "皇穹宇大殿内神版使用满文与汉文两种文字，并非仅用汉文。", "source": "清朝皇穹宇大殿内神版上使用的文字：使用满文与汉文两种文字。", "layer": "ext"}, {"section": "天坛", "type": "single", "q": "天坛的占地面积约为（ ）。", "options": ["A. 173公顷", "B. 273公顷", "C. 373公顷", "D. 473公顷"], "answer": "B", "explain": "天坛占地面积273公顷（约273万平方米），相当于紫禁城的近4倍。", "source": "占地面积：273 公顷（约 273 万平方米），相当于紫禁城的近 4 倍。", "layer": "ext"}, {"section": "天坛", "type": "judge", "q": "望灯杆上的望灯只是祭天大典的位置标志，与仪式的开始和结束时间无关。", "answer": "错", "explain": "望灯既是祭天大典的位置标志，也是仪式开始和结束的时间标志。", "source": "望灯既是祭天大典的位置标志，也是仪式开始和结束的时间标志。", "layer": "ext"}, {"section": "天坛", "type": "multi", "q": "关于祈年殿三层石栏与丹陛浮雕的呼应，正确的有（ ）。", "options": ["A. 上层望柱饰云龙、出水为螭首（龙头）", "B. 中层饰翔凤、出水为凤首", "C. 下层饰朵云、出水为云朵", "D. 整体寓意“龙凤呈祥”，表现君权至上", "E. 三层望柱均饰云龙"], "answer": "ABCD", "explain": "三层石栏上层饰云龙、中层饰翔凤、下层饰朵云，并非均饰云龙；其余四项与原文相符。", "source": "三层石栏上层望柱饰云龙、出水为螭首（龙头）；中层饰翔凤、出水为凤首；下层饰朵云、出水为云朵——整体寓意“龙凤呈祥”，表现君权至上。", "layer": "ext"}, {"section": "天坛", "type": "single", "q": "天坛坛域的平面形状特征是（ ）。", "options": ["A. 北圆南方", "B. 南圆北方", "C. 东西皆圆", "D. 内外皆方"], "answer": "A", "explain": "天坛坛域北呈圆形、南为方形（“北圆南方”），寓意“天圆地方”，两重坛墙俗称“天地墙”。", "source": "坛域北呈圆形、南为方形（“北圆南方”），寓意“天圆地方”；因两重坛墙南方北圆，俗称“天地墙”。", "layer": "ext"}, {"section": "天坛", "type": "judge", "q": "明清时期神乐署归礼部太常寺管辖，是明清两朝最高的「礼乐学府」。", "answer": "对", "explain": "神乐署归礼部太常寺管辖，是礼部太常寺官及乐部执事官生演礼演乐之地，为明清两朝最高的「礼乐学府」。", "source": "明清时期神乐署的管理部门：归礼部太常寺管辖。……是礼部太常寺官及乐部执事官生演礼演乐之地，为明清两朝最高的「礼乐学府」。", "layer": "ext"}, {"section": "天坛", "type": "single", "q": "天坛三道坛墙中，分隔圜丘坛与祈谷坛的是（ ）。", "options": ["A. 外坛墙", "B. 内坛墙", "C. 两坛之间的东西向隔墙", "D. 两坛之间的南北向隔墙"], "answer": "C", "explain": "三道坛墙为外坛墙、内坛墙、分隔圜丘坛与祈谷坛之间的东西向隔墙。", "source": "三道坛墙：①外坛墙；②内坛墙；③分隔圜丘坛与祈谷坛之间的东西向隔墙。", "layer": "ext"}, {"section": "天坛", "type": "multi", "q": "下列建筑中，属于圜丘坛建筑群的有（ ）。", "options": ["A. 皇穹宇", "B. 燔柴炉", "C. 望灯杆", "D. 瘗坎", "E. 皇乾殿"], "answer": "ABCD", "explain": "圜丘坛建筑群包括圜丘、皇穹宇、四座天门、燔柴炉、瘗坎、铁燎炉、望灯杆、具服台、南宰牲亭与南神厨；皇乾殿属祈谷坛建筑群。", "source": "圜丘坛建筑群：圜丘、皇穹宇（含回音壁、三音石、对话石）、四座天门……燔柴炉、瘗坎、铁燎炉、望灯杆、具服台、南宰牲亭与南神厨。", "layer": "ext"}, {"section": "天坛", "type": "single", "q": "圜丘坛周围泰元、昭亨、广利、成贞四座坛门的命名取自（ ）。", "options": ["A. 《诗经》", "B. 《尚书》", "C. 《易经·乾卦》“元、亨、利、贞”", "D. 《礼记》"], "answer": "C", "explain": "圜丘坛四门取《易经·乾卦》“元、亨、利、贞”，称“天之四德”。", "source": "东泰元门、南昭亨门、西广利门、北成贞门（取《易经·乾卦》“元、亨、利、贞”，称“天之四德”）", "layer": "ext"}, {"section": "天坛", "type": "single", "q": "1420年按南京天地坛规制建成北京天地坛、实行天地合祀的皇帝是（ ）。", "options": ["A. 明太祖朱元璋", "B. 明成祖朱棣", "C. 明嘉靖帝朱厚熜", "D. 清顺治帝"], "answer": "B", "explain": "明永乐帝（朱棣）初建，永乐十八年（1420年）按南京天地坛规制建成北京天地坛，实行天地合祀。", "source": "明永乐帝（朱棣）——初建。永乐十八年（1420 年）按南京天地坛规制建成北京天地坛（含大祀殿、大祀门、皇乾殿等），实行天地合祀。", "layer": "ext"}, {"section": "天坛", "type": "multi", "q": "关于祈谷坛建筑群中宰牲亭、神厨、神库的用途，正确的有（ ）。", "options": ["A. 宰牲亭是宰杀祭祀所用牲畜的场所", "B. 神厨是制作、烹饪祭品的厨房", "C. 神库是存放祭器、礼器及供品的库房", "D. 祈谷大典前一日供品在神库供案陈列，皇帝亲自检验", "E. 神厨平时供奉“皇天上帝”神版"], "answer": "ABCD", "explain": "平时供奉神版的是皇乾殿而非神厨；其余四项与原文相符。", "source": "宰牲亭：宰杀祭祀所用牲畜……神厨：制作、烹饪祭品（供品）的厨房……神库：存放祭器、礼器及供品的库房；祈谷大典前一日，供品在神库供案上按各神位分别陈列，皇帝亲自检验后再送上祈年殿。", "layer": "ext"}, {"section": "天坛", "type": "single", "q": "清乾隆帝在位60年间，到天坛祭祀的次数为（ ）。", "options": ["A. 145次", "B. 155次", "C. 165次", "D. 654次"], "answer": "B", "explain": "清乾隆帝到天坛祭祀155次，为明清两代最多；654次为明清22位皇帝祭祀总次数。", "source": "其中清乾隆帝最多——在位 60 年，到天坛祭祀 155 次。", "layer": "ext"}, {"section": "天坛", "type": "single", "q": "明成祖朱棣率文武百官在北京天地坛举行首次天地合祀大典的时间是（ ）。", "options": ["A. 明永乐十八年（1420年）", "B. 明永乐十九年（1421年）正月", "C. 明嘉靖九年（1530年）", "D. 清顺治二年（1645年）"], "answer": "B", "explain": "明永乐十九年（1421年）正月，朱棣在天地坛大祀殿举行首次天地合祀大典，标志着明朝正式迁都北京。", "source": "明永乐十九年（1421 年）正月（正月十一日甲戌日），明成祖朱棣率文武百官在北京天地坛大祀殿“大祀天地于南郊”，举行首次天地合祀大典，标志着明朝正式迁都北京。", "layer": "ext"}, {"section": "天坛", "type": "multi", "q": "下列关于天坛四大声学现象的说法，正确的有（ ）。", "options": ["A. 回音壁是皇穹宇的圆形围墙", "B. 三音石恰为回音壁的圆心", "C. 天心石位于圜丘上层台面正中", "D. 对话石是皇穹宇殿前甬道第18块石板", "E. 在三音石上击掌可听到两声回音"], "answer": "ABCD", "explain": "在三音石（甬道第三块石板）上击掌可听到三声回音，第一、二块石板分别听到一声、两声；其余四项与原文相符。", "source": "三音石—皇穹宇殿前甬道由北向南第三块石板（恰为回音壁圆心）。在此击掌可听到三声回音；第一、二块石板分别听到一声、两声（合称“三才石”）。", "layer": "ext"}, {"section": "天坛", "type": "single", "q": "天坛初建时得名“天地坛”的原因是（ ）。", "options": ["A. 坛域北圆南方", "B. 建成时兼具祭天与祭地的功能", "C. 由天地两道坛墙环护", "D. 取“天圆地方”之意"], "answer": "B", "explain": "因建成时兼具祭天与祭地功能（在大祀殿实行天地合祀），故名“天地坛”。", "source": "命名原因：因建成时兼具祭天与祭地的功能（在大祀殿实行天地合祀），故名“天地坛”。", "layer": "ext"}, {"section": "天坛", "type": "single", "q": "天坛辟为天坛公园、正式对外开放的时间是（ ）。", "options": ["A. 1907年", "B. 1918年1月1日", "C. 1949年", "D. 1961年"], "answer": "B", "explain": "民国七年（1918年）1月1日（元旦），天坛辟为天坛公园，正式对外开放。", "source": "民国七年（1918 年）1 月 1 日（元旦），天坛辟为天坛公园，正式对外开放。", "layer": "ext"}, {"section": "天坛", "type": "multi", "q": "下列属于圜丘坛祭天大典九项仪程的有（ ）。", "options": ["A. 进俎", "B. 初献礼", "C. 亚献礼", "D. 终献礼", "E. 进时辰牌"], "answer": "ABCD", "explain": "九项仪程为燔柴迎帝神、奠玉帛、进俎、初献礼、亚献礼、终献礼、撤馔、送帝神、望燎；「进时辰牌」为斋宫时辰亭的环节，不在九项仪程内。", "source": "九项仪程：燔柴迎帝神（燔柴迎神）、奠玉帛、进俎、初献礼、亚献礼、终献礼、撤馔、送帝神（送神）、望燎。", "layer": "ext"}, {"section": "天坛", "type": "single", "q": "祈年殿坐落于（ ）之上。", "options": ["A. 三层汉白玉圆台（祈谷坛）", "B. 三层须弥座方台", "C. 丹陛桥", "D. 单层青石台基"], "answer": "A", "explain": "祈年殿坐落于三层汉白玉圆台（祈谷坛，高约6米）之上，为鎏金宝顶、蓝瓦红柱的三重檐圆形大殿。", "source": "坐落于三层汉白玉圆台（祈谷坛，高约 6 米）之上，为鎏金宝顶、蓝瓦红柱的三重檐圆形大殿。", "layer": "ext"}, {"section": "天坛", "type": "single", "q": "祈年殿遭雷火焚毁后，开始重建的时间是（ ）。", "options": ["A. 光绪十五年（1889年）", "B. 光绪十六年（1890年）", "C. 光绪二十二年（1896年）", "D. 光绪三十三年（1907年）"], "answer": "B", "explain": "祈年殿1889年焚毁，光绪十六年（1890年）开始重建，因图纸无存由工匠凭记忆制图施工，1896年竣工。", "source": "重建：光绪十六年（1890 年）开始重建（因图纸档案无存，工部召集曾参与修缮的工匠凭记忆制图施工）", "layer": "ext"}, {"section": "天坛", "type": "multi", "q": "下列关于圜丘坛建筑中「九」之运用的说法正确的有（ ）。", "options": ["A. 上层坛面围绕天心石铺9圈扇形石", "B. 中下层坛面亦各9圈递加9块", "C. 三层坛面共有378个「九」", "D. 扇形石合计3402块", "E. 三层栏板合计365块"], "answer": "ABCD", "explain": "三层栏板分别为72、108、180块，合计360块，而非365块，故E错误。", "source": "坛面石板、栏板、台阶亦皆用「九」及九的倍数……三层栏板分别为72、108、180块，合计360块；三层共378个「九」，扇形石合计3402块。", "layer": "ext"}, {"section": "天坛", "type": "single", "q": "明清时期皇帝举行祈谷礼的时间是每年（ ）。", "options": ["A. 冬至日", "B. 孟春（正月）上辛日", "C. 孟夏遇旱之日", "D. 秋分日"], "answer": "B", "explain": "祈谷礼于每年孟春（正月）上辛日举行（后定为立春后第一个辛日），遇国丧则改次辛日或下辛日。", "source": "时间：每年孟春（正月）上辛日（正月第一个辛日；后定为立春后第一个辛日）。如遇国丧则改次辛日或下辛日。", "layer": "ext"}, {"section": "天坛", "type": "single", "q": "祈年殿内中圈12根金柱象征（ ）。", "options": ["A. 一年12个月", "B. 一日12个时辰", "C. 一年24节气", "D. 天上二十八星宿"], "answer": "A", "explain": "中圈金柱12根象征一年12个月；外圈檐柱12根象征一日12时辰，中外圈合计24根象征24节气。", "source": "中圈 金柱 12 根 一年 12 个月；外圈 檐柱 12 根 一日 12 个时辰", "layer": "ext"}, {"section": "天坛", "type": "multi", "q": "下列关于圜丘坛周围附属设施位置的说法正确的有（ ）。", "options": ["A. 燔柴炉位于坛的东南", "B. 瘗坎位于燔柴炉东侧", "C. 望灯杆位于坛的西南", "D. 皇穹宇位于坛北", "E. 宰牲亭、神厨、神库位于坛西"], "answer": "ABCD", "explain": "宰牲亭、神厨、神库位于坛东，而非坛西，故E错误。", "source": "燔柴炉（东南……）……瘗坎（燔柴炉东侧……）……望灯杆（西南……）……宰牲亭、神厨、神库（坛东）；皇穹宇（坛北，即「天库」）。", "layer": "ext"}, {"section": "天坛", "type": "single", "q": "祈年殿内正中靠北（龙凤石以北）方形高石台上安放的神版是（ ）。", "options": ["A. 清代前八位已故皇帝配位神版", "B. “皇天上帝”正位神版", "C. 日月星辰从位神牌", "D. 五岳五镇神牌"], "answer": "B", "explain": "殿内正中靠北石台上设雕龙宝座与屏风，安放“皇天上帝”（正位）神版；东西两侧较低石台安放清代前八位皇帝配位神版。", "source": "殿内正中靠北（龙凤石以北）有一方形高石台，台上设雕龙宝座与屏风，安放“皇天上帝”（正位）神版", "layer": "ext"}, {"section": "天坛", "type": "single", "q": "皇乾殿的位置在（ ）。", "options": ["A. 祈年殿以南", "B. 祈谷坛（祈年殿）以北", "C. 丹陛桥东侧", "D. 圜丘坛以北"], "answer": "B", "explain": "皇乾殿位于祈谷坛（祈年殿）以北，是平时供奉神版的大殿，相当于祈谷坛的“天库”。", "source": "位置：位于祈谷坛（祈年殿）以北。", "layer": "ext"}, {"section": "天坛", "type": "multi", "q": "皇穹宇西配殿供奉的神牌包括（ ）。", "options": ["A. 夜明之神（月）", "B. 云师", "C. 雨师", "D. 北斗七星", "E. 雷师"], "answer": "ABCE", "explain": "西配殿供奉夜明之神（月）、云师、雨师、风伯、雷师神牌；北斗七星供奉于东配殿。", "source": "西配殿供奉夜明之神（月）、云师、雨师、风伯、雷师神牌。", "layer": "ext"}, {"section": "天坛", "type": "single", "q": "皇乾殿院落西角门“古稀门”的开辟与哪位皇帝有关？（ ）", "options": ["A. 康熙帝", "B. 雍正帝", "C. 乾隆帝", "D. 嘉庆帝"], "answer": "C", "explain": "清乾隆皇帝年满七十（古稀）后，因年事已高、行礼不便绕行，特于皇乾殿院落西侧开辟此门，故名“古稀门”。", "source": "清乾隆皇帝年满七十（古稀）之后，因年事已高、到皇乾殿行礼时不便绕行，特于皇乾殿院落西侧开辟此门，以便出入，故名“古稀门”。", "layer": "ext"}, {"section": "天坛", "type": "single", "q": "丹陛桥的长度和宽度约为（ ）。", "options": ["A. 长350米、宽5米", "B. 长360米、宽约29米", "C. 长273米、宽32米", "D. 长193米、宽61米"], "answer": "B", "explain": "丹陛桥长360米、宽约29米，高出地面约2.5—4米，北高南低，是北京最古老的“立交桥”。长350米宽5米为供菜廊数据。", "source": "长度与宽度：长 360 米，宽约 29 米（另有 28 米、30 米之说，为不同测量口径）；高出地面约 2.5—4 米，北高南低，是北京最古老的“立交桥”。", "layer": "ext"}, {"section": "天坛", "type": "multi", "q": "下列关于斋戒铜人亭的说法正确的有（ ）。", "options": ["A. 石制四柱，绿琉璃瓦方形攒尖顶", "B. 高5.5米、宽2.16米", "C. 亭内设高1.3米须弥座", "D. 铜人手持「斋戒」牌", "E. 铜像常年陈设于亭内不撤"], "answer": "ABCD", "explain": "上祭时间一到即撤去铜像，并非常年陈设，故E错误。", "source": "斋戒铜人亭——石制四柱，绿琉璃瓦方形攒尖顶，高5.5米、宽2.16米，亭内设高1.3米须弥座。……手持「斋戒」牌……上祭时间一到即撤去铜像。", "layer": "ext"}, {"section": "天坛", "type": "single", "q": "祈谷坛具服台位于（ ）。", "options": ["A. 丹陛桥北端（中段偏北）东侧", "B. 祈年殿南侧丹陛之下", "C. 皇乾殿院落西侧", "D. 圜丘坛外墙南面"], "answer": "A", "explain": "祈谷坛具服台位于丹陛桥北端（中段偏北）东侧，坐东朝西，三面围以汉白玉雕石栏杆，供皇帝盥洗更换祭服。", "source": "位于丹陛桥北端（中段偏北）东侧，坐东朝西，三面围以汉白玉雕石栏杆。", "layer": "ext"}, {"section": "天坛", "type": "single", "q": "站在皇穹宇殿前甬道第18块石板上说话，30多米外配殿角落可清晰听到，此石是（ ）。", "options": ["A. 三音石", "B. 天心石", "C. 对话石", "D. 亿兆景从石"], "answer": "C", "explain": "对话石为皇穹宇殿前甬道第18块石板，站其上说话，30多米外东配殿东北角（或西配殿西北角）可清晰听到。", "source": "对话石—皇穹宇殿前甬道第 18 块石板。站在此石上说话，30 多米外东配殿东北角（或西配殿西北角）可清晰听到，反之亦然。", "layer": "ext"}, {"section": "天坛", "type": "multi", "q": "下列关于天坛斋宫的说法正确的有（ ）。", "options": ["A. 主体建筑坐西朝东", "B. 正殿为砖券拱顶结构，殿内不用梁枋大木", "C. 正殿覆绿琉璃瓦", "D. 正殿覆黄色琉璃瓦以显帝王之尊", "E. 正殿内悬乾隆御笔「钦若昊天」匾"], "answer": "ABCE", "explain": "帝王寝宫本应覆黄色琉璃瓦，但皇帝对天称臣，故改用低于黄色的绿色琉璃瓦，D错误。", "source": "正殿面阔五间，为砖券拱顶结构，殿内不用梁枋大木……绿琉璃瓦庑殿顶……故改用低于黄色的绿色琉璃瓦……钦若昊天，乾隆御笔。", "layer": "ext"}, {"section": "天坛", "type": "single", "q": "明清时期皇帝到圜丘坛举行祭天大典的时间是每年（ ）。", "options": ["A. 立春后第一个辛日", "B. 冬至日", "C. 正月上辛日", "D. 夏至日"], "answer": "B", "explain": "祭天时间为每年冬至日；立春后第一个辛日、正月上辛日为祈谷礼时间。", "source": "祭天时间：每年冬至日。", "layer": "ext"}, {"section": "天坛", "type": "single", "q": "圜丘坛祭天大典开始与结束的时间标志是（ ）。", "options": ["A. 钦天监官员进时辰牌", "B. 斋宫钟楼鸣钟", "C. 燔柴炉点火", "D. 望灯杆上点亮灯笼"], "answer": "D", "explain": "日出前七刻行礼，届时望灯杆上点亮灯笼作为大典开始与结束的时间标志。", "source": "开始时间：日出前七刻（约凌晨4时15分），届时望灯杆上点亮灯笼作为大典开始与结束的时间标志。", "layer": "ext"}, {"section": "天坛", "type": "multi", "q": "关于神乐署乐舞生的充任与培训，下列说法正确的有（ ）。", "options": ["A. 明初乐生、舞生由道士充任", "B. 清乾隆年间后乐舞生改由八旗子弟充任", "C. 乐舞生由朝廷指派协律郎培训", "D. 乐舞生由太常寺官员兼任", "E. 「玉振金声」寓意中和韶乐集众音之大成"], "answer": "ABCE", "explain": "乾隆年间尽逐道士后，乐舞生改由年少俊秀的八旗子弟充任，由朝廷指派协律郎培训，并非太常寺官员兼任，D错误。", "source": "明初（神乐观时期）乐生、舞生均由道士（道童）充任……乐舞生改由年少俊秀的八旗子弟充任，由朝廷指派协律郎培训。……寓意：中和韶乐集众音之大成。", "layer": "ext"}, {"section": "天坛", "type": "single", "q": "圜丘坛祭天大典九项仪程中，「燔柴迎帝神」之后紧接着的仪程是（ ）。", "options": ["A. 进俎", "B. 奠玉帛", "C. 初献礼", "D. 撤馔"], "answer": "B", "explain": "九项仪程顺序为：燔柴迎帝神、奠玉帛、进俎、初献礼、亚献礼、终献礼、撤馔、送帝神、望燎。", "source": "九项仪程：燔柴迎帝神（燔柴迎神）、奠玉帛、进俎、初献礼、亚献礼、终献礼、撤馔、送帝神（送神）、望燎。", "layer": "ext"}, {"section": "天坛", "type": "single", "q": "圜丘坛外壝墙的形状为（ ）。", "options": ["A. 圆形", "B. 椭圆形", "C. 方形", "D. 八角形"], "answer": "C", "explain": "内壝墙呈圆形，外壝墙呈方形，「内圆外方」象征「天圆地方」。", "source": "内壝墙（内墙）呈圆形，外壝墙（外墙）呈方形——「内圆外方」，象征「天圆地方」。", "layer": "ext"}, {"section": "天坛", "type": "single", "q": "圜丘坛中层坛面直径为十五丈，其取义为（ ）。", "options": ["A. 一", "B. 三、五", "C. 三、七", "D. 九五"], "answer": "B", "explain": "中层十五丈（三五），取义三、五；上层九丈（一九）取义一，下层二十一丈（三七）取义三、七。", "source": "中层 十五丈（三五） 取义三、五。", "layer": "ext"}, {"section": "天坛", "type": "single", "q": "圜丘坛三层坛面所铺扇形石合计为（ ）。", "options": ["A. 360块", "B. 378块", "C. 3402块", "D. 24块"], "answer": "C", "explain": "扇形石合计3402块；360块为三层栏板总数，378为「九」的个数。", "source": "三层栏板分别为72、108、180块，合计360块；三层共378个「九」，扇形石合计3402块。", "layer": "ext"}, {"section": "天坛", "type": "single", "q": "「亿兆景从石」指的是（ ）。", "options": ["A. 三音石", "B. 对话石", "C. 丹陛石", "D. 天心石"], "answer": "D", "explain": "天心石位于圜丘坛上层台面正中，又称太极石、亿兆景从石。", "source": "位于圜丘坛上层（第三层）台面正中的圆形石板，又称太极石、亿兆景从石。", "layer": "ext"}, {"section": "天坛", "type": "single", "q": "圜丘坛燔柴炉在祭天开始时的用途是（ ）。", "options": ["A. 焚烧牛犊以「燔柴迎帝神」", "B. 焚化从位供品", "C. 掩埋牛尾、牛毛、牛血", "D. 吊挂祭天大灯笼"], "answer": "A", "explain": "燔柴炉在祭天开始时焚烧牛犊以「燔柴迎帝神」，礼毕焚烧皇天上帝祭品；焚化从位供品用铁燎炉，掩埋牛尾等用瘗坎。", "source": "燔柴炉（东南，绿琉璃砖砌，高约9尺）——祭天开始时焚烧牛犊以「燔柴迎帝神」，礼毕焚烧皇天上帝祭品。", "layer": "ext"}, {"section": "天坛", "type": "single", "q": "圜丘坛周围棂星门共有（ ）。", "options": ["A. 8座", "B. 12座", "C. 18座", "D. 24座"], "answer": "D", "explain": "圜丘坛附属设施中棂星门共24座。", "source": "棂星门24座。", "layer": "ext"}, {"section": "天坛", "type": "single", "q": "圜丘坛望灯杆的高度约为（ ）。", "options": ["A. 9尺", "B. 9丈（约30米）", "C. 19.2米", "D. 38米"], "answer": "B", "explain": "望灯杆高约9丈（约30米）；9尺为燔柴炉高，19.2米为祈年殿龙井柱高，38米为祈年殿总高。", "source": "望灯杆（西南，高约9丈／30米）。", "layer": "ext"}, {"section": "天坛", "type": "single", "q": "祭天大典时望灯杆上吊挂的大灯笼高（ ）。", "options": ["A. 0.9米", "B. 1.3米", "C. 2.15米", "D. 2.5米"], "answer": "C", "explain": "大灯笼直径1.3米、高2.15米。", "source": "灯笼：祭天大典时在望灯杆上吊挂直径1.3米、高2.15米的大灯笼。", "layer": "ext"}, {"section": "天坛", "type": "single", "q": "皇穹宇正殿正中汉白玉雕花圆形石座（须弥座）上供奉的是（ ）。", "options": ["A. 清代前八位皇帝配位神牌", "B. 皇天上帝神牌", "C. 大明之神（日）神牌", "D. 夜明之神（月）神牌"], "answer": "B", "explain": "正殿正中须弥座上供奉「皇天上帝」神牌（正位）；配位神牌在两侧方形石台，日月神牌在东西配殿。", "source": "正殿正中汉白玉雕花圆形石座（须弥座）上供奉「皇天上帝」神牌（正位）。", "layer": "ext"}, {"section": "天坛", "type": "single", "q": "清朝皇穹宇大殿覆蓝色（青色）琉璃瓦、鎏金宝顶，其象征意义是（ ）。", "options": ["A. 象征黄土", "B. 象征青天", "C. 象征五行之水", "D. 象征皇权"], "answer": "B", "explain": "皇穹宇大殿覆蓝色（青色）琉璃瓦，鎏金宝顶，象征青天。", "source": "蓝色（青色）琉璃瓦，鎏金宝顶，象征青天。", "layer": "ext"}, {"section": "天坛", "type": "single", "q": "天坛斋宫主体建筑坐西朝东的原因是（ ）。", "options": ["A. 顺应北京冬季主导风向", "B. 皇帝在「天」面前只能退居臣子之位，以示对天称臣", "C. 与祈年殿轴线保持一致", "D. 便于皇帝自紫禁城出入"], "answer": "B", "explain": "祭天建筑坐北朝南，皇帝在「天」面前只能退居臣子之位，故斋宫坐西朝东，以示对天称臣、不敢称尊。", "source": "祭天建筑坐北朝南，皇帝在「天」面前只能退居臣子之位，故斋宫坐西朝东，以示对天称臣、不敢称尊。", "layer": "ext"}, {"section": "天坛", "type": "single", "q": "斋宫正殿月台三出陛，左右两侧台阶各为（ ）。", "options": ["A. 9级", "B. 12级", "C. 13级", "D. 15级"], "answer": "D", "explain": "殿前月台崇基石栏、三出陛，正阶13级，左右各15级。", "source": "殿前月台崇基石栏、三出陛（正阶13级，左右各15级），正面台阶中间为云纹浮雕丹陛。", "layer": "ext"}, {"section": "天坛", "type": "single", "q": "斋宫正殿殿顶覆盖的琉璃瓦颜色为（ ）。", "options": ["A. 黄色", "B. 蓝色", "C. 绿色", "D. 黑色"], "answer": "C", "explain": "斋宫殿顶覆绿色琉璃瓦（正殿红墙绿瓦），因皇帝在皇天上帝面前不敢妄自尊大，故改用低于黄色的绿色。", "source": "斋宫殿顶琉璃瓦的颜色：绿色琉璃瓦（正殿红墙绿瓦）。", "layer": "ext"}, {"section": "天坛", "type": "single", "q": "斋宫月台斋戒铜人亭内陈设的铜铸人像，手持的牌上书写的是（ ）。", "options": ["A. 「钦若昊天」", "B. 「时辰」", "C. 「斋戒」", "D. 「敬天」"], "answer": "C", "explain": "铜铸人像乌纱玉带、手持「斋戒」牌，相传仿唐朝宰相魏徵而制，用以警示皇帝虔诚斋戒。", "source": "亭内设高1.3米须弥座。皇帝斋戒时于座上陈设一尊铜铸人像（乌纱玉带、手持「斋戒」牌），相传仿唐朝宰相魏徵而制。", "layer": "ext"}, {"section": "天坛", "type": "single", "q": "神乐署正殿由「太和殿」赐名改为「凝禧殿」是在（ ）。", "options": ["A. 明永乐年间", "B. 明嘉靖年间", "C. 清顺治年间", "D. 清康熙年间"], "answer": "D", "explain": "明代称「太和殿」，因与紫禁城太和殿重名，清康熙年间（一说康熙十二年1673年）由康熙帝赐名改为「凝禧殿」。", "source": "明代称「太和殿」（因与紫禁城太和殿重名，清康熙年间／一说康熙十二年1673年由康熙帝赐名改为「凝禧殿」）。", "layer": "ext"}, {"section": "天坛", "type": "single", "q": "神乐署凝禧殿内「玉振金声」匾的典故出自（ ）。", "options": ["A. 《论语》", "B. 《孟子·万章下》", "C. 《易经·乾卦》", "D. 《诗经》"], "answer": "B", "explain": "「玉振金声」语出《孟子·万章下》「集大成也者，金声而玉振之也」，寓意中和韶乐集众音之大成。", "source": "寓意：中和韶乐集众音之大成，以表达对天神的歌颂与崇敬（语出《孟子·万章下》「集大成也者，金声而玉振之也」）。", "layer": "ext"}, {"section": "颐和园", "layer": "core", "type": "single", "q": "仁寿殿是慈禧、光绪临朝理政、受贺、接见外宾之所，其地位相当于故宫的哪座宫殿？", "options": ["太和殿", "保和殿", "乾清宫", "养心殿"], "answer": "A", "explain": "仁寿殿用于临朝理政、受贺、接见外宾，相当于故宫太和殿。", "source": "慈禧、光绪临朝理政、受贺、接见外宾（相当于太和殿）"}, {"section": "颐和园", "layer": "core", "type": "judge", "q": "仁寿殿前身为清漪园勤政殿，1750年始建，1860年被英法联军焚毁，1886年重建并改名。", "answer": "对", "explain": "表述与背诵版完全一致：勤政殿→1750年始建→1860年英法联军焚毁→1886年重建改名。", "source": "前身清漪园勤政殿→1750年始建→1860年英法联军焚毁→1886年重建改名"}, {"section": "颐和园", "layer": "core", "type": "multi", "q": "仁寿殿内的主要陈设包括哪些？", "options": ["九龙宝座", "御案", "寿字屏风", "铜麒麟"], "answer": "ABC", "explain": "殿内陈设有九龙宝座、御案、寿字屏风；铜麒麟在殿前，非殿内陈设。", "source": "九龙宝座、御案、寿字屏风"}, {"section": "颐和园", "layer": "core", "type": "single", "q": "颐和园仁寿殿前铜龙凤的高度约为多少？", "options": ["约3米", "约4米", "约5米", "约7.55米"], "answer": "B", "explain": "铜龙凤为香炉、高约4米。7.55米是宝云阁（铜亭）的高度。", "source": "铜龙凤为香炉、高约4米"}, {"section": "颐和园", "layer": "core", "type": "judge", "q": "\"仁寿\"之名出自《孟子》\"知者乐，仁者寿\"。", "answer": "错", "explain": "\"仁寿\"出自《论语》\"知者乐，仁者寿\"，不是《孟子》。", "source": "\"仁寿\"出自《论语》\"知者乐，仁者寿\""}, {"section": "颐和园", "layer": "core", "type": "single", "q": "乐寿堂前陈设的\"六合太平\"是指什么？", "options": ["铜鹿、铜鹤、铜瓶的谐音", "玉兰、海棠、牡丹", "紫檀刻不同写法的寿字", "铜龙、铜凤、铜麒麟"], "answer": "A", "explain": "六合太平=铜鹿铜鹤铜瓶谐音；玉兰海棠牡丹是\"玉堂富贵\"；紫檀寿字是百寿屏风。", "source": "六合太平=铜鹿铜鹤铜瓶谐音"}, {"section": "颐和园", "layer": "core", "type": "judge", "q": "仁寿殿前铜龙凤为香炉，凤居中、龙在外，象征慈禧掌权。", "answer": "对", "explain": "铜龙凤为香炉、 砖扇骨图案", "无梁殿、砖石拱券"], "answer": "A", "explain": "佛香阁为八面三层四重檐、攒尖顶，通高约41米。", "source": "八面三层四重檐、攒尖顶；通高约41米"}, {"section": "颐和园", "layer": "core", "type": "judge", "q": "石舫（清晏舫）位于昆明湖西北角，全长约96米。", "answer": "错", "explain": "石舫全长约36米，\"96米\"是常见误记。位置（昆明湖西北角）正确。", "source": "昆明湖西北角；全长约36米（勿混：误记96米）"}, {"section": "颐和园", "layer": "core", "type": "single", "q": "智慧海建筑装饰序列\"众香界→祗树林→智慧海→吉祥云\"中，位于\"祗树林\"之后的是？", "options": ["众香界", "智慧海", "吉祥云", "星拱瑶枢"], "answer": "B", "explain": "顺序为众香界→祗树林→智慧海→吉祥云，祗树林之后是智慧海。", "source": "众香界→祗树林→智慧海→吉祥云"}, {"section": "颐和园", "layer": "core", "type": "judge", "q": "知春亭岛位于昆明湖东堤岸外，亭名\"知春\"，取湖水解冻、春讯先至之意。", "answer": "对", "explain": "知春亭岛是昆明湖东堤岸外的小岛，亭名\"知春\"，正喻湖水解冻、春讯先至。注意它不属于按\"一池三山\"传统所设的南湖岛、藻鉴堂岛、治镜阁岛三岛。", "source": "三岛：昆明湖中按\"一池三山\"传统设三岛——南湖岛（最大，上有广润灵雨祠/龙王庙）、藻鉴堂岛、治镜阁岛。知春亭岛：位于东堤岸外小岛。（sec2/04.txt）", "patch": true}, {"section": "颐和园", "layer": "core", "type": "multi", "q": "关于颐和园长廊，下列说法正确的有？", "options": ["东起邀月门、西至石丈亭", "彩画14000余幅", "四座亭为留佳亭、寄澜亭、秋水亭、清遥亭", "全长约360米"], "answer": "ABC", "explain": "长廊邀月门→石丈亭，728米、273间，彩画14000余幅，四亭留佳→寄澜→秋水→清遥。360米为错误数据。", "source": "邀月门→石丈亭；彩画14000余幅；四亭留佳→寄澜→秋水→清遥"}, {"section": "颐和园", "layer": "core", "type": "single", "q": "万寿山中轴线上，牌坊北面题字为？", "options": ["云辉玉宇", "星拱瑶枢", "祗树林", "东敷华"], "answer": "A", "explain": "牌坊题字：云辉玉宇（北）、星拱瑶枢（南）。", "source": "云辉玉宇（北）、星拱瑶枢（南）"}, {"section": "颐和园", "layer": "core", "type": "judge", "q": "颐和园仁寿殿内陈设有\"百蝠捧寿图\"和百寿玻璃屏风。", "answer": "对", "explain": "仁寿殿为慈禧、光绪坐殿听政之所，殿内设宝座、御案，陈百蝠捧寿图与百寿玻璃屏风。", "source": "官方考纲考点；颐和园讲解通行表述。", "patch": true}, {"section": "颐和园", "layer": "core", "type": "single", "q": "颐和园长廊自邀月门至石丈亭，其长度与间数分别是？", "options": ["728米、273间", "728米、544间", "300米、273间", "150米、96间"], "answer": "A", "explain": "长廊邀月门→石丈亭，728米、273间，彩画14000余幅。", "source": "邀月门→石丈亭；728米、273间"}, {"section": "颐和园", "layer": "core", "type": "multi", "q": "关于昆明湖中的岛屿与铜牛，下列说法正确的有？", "options": ["南湖岛为三岛中最大，上有广润灵雨祠", "三岛为南湖岛、藻鉴堂岛、治镜阁岛", "铜牛铸于1755年，牛背铸有《金牛铭》", "铜牛取\"铁牛镇水\"之意", "最大的岛是治镜阁岛"], "answer": "ABCD", "explain": "三岛中南湖岛最大（广润灵雨祠），另有藻鉴堂岛、治镜阁岛；铜牛1755年铸、牛背《金牛铭》、铁牛镇水。", "source": "三岛：南湖岛（最大，广润灵雨祠）、藻鉴堂岛、治镜阁岛；铜牛：1755年铸、牛背《金牛铭》、铁牛镇水"}, {"section": "颐和园", "layer": "core", "type": "single", "q": "关于石舫（清晏舫），下列说法正确的是？", "options": ["位于昆明湖西北角，1755年建，取\"河清海晏\"及\"水能载舟亦能覆舟\"之意", "位于昆明湖东北角，1886年建", "全长约96米", "为纯铜铸造，故又称铜亭"], "answer": "A", "explain": "石舫位于昆明湖西北角，1755年建，全长约36米（勿混96米），寓意河清海晏、水能载舟亦能覆舟。", "source": "昆明湖西北角；1755年建；全长约36米；河清海晏、水能载舟亦能覆舟"}, {"section": "颐和园", "layer": "core", "type": "single", "q": "关于谐趣园，下列说法正确的是？", "options": ["1751年始建、初名惠山园，仿无锡寄畅园，1811年改名谐趣园", "1755年始建、初名勺园", "仿苏州拙政园而建", "1811年始建、初名谐趣园"], "answer": "A", "explain": "谐趣园1751年始建、初名惠山园，仿无锡寄畅园，1811年改名谐趣园。", "source": "1751年始建、初名惠山园；仿无锡寄畅园；1811年改名谐趣园"}, {"section": "颐和园", "layer": "core", "type": "multi", "q": "关于昆明湖西堤六桥与绣漪桥，下列说法正确的有？", "options": ["西堤六桥自北而南为界湖桥→豳风桥→玉带桥→镜桥→练桥→柳桥", "玉带桥为西堤六桥中最高者", "绣漪桥位于东堤南端出水口，有\"第一桥\"之称", "绣漪桥是西堤六桥之一"], "answer": "ABC", "explain": "西堤六桥自北而南：界湖桥→豳风桥→玉带桥（最高）→镜桥→练桥→柳桥；绣漪桥在东堤南端出水口，称\"第一桥\"，不属于西堤六桥。", "source": "西堤六桥自北而南：界湖桥→豳风桥→玉带桥（最高）→镜桥→练桥→柳桥；绣漪桥：东堤南端出水口、\"第一桥\""}, {"section": "颐和园", "layer": "core", "type": "single", "q": "关于文昌阁与宿云檐的\"文武辅弼\"格局，下列说法正确的是？", "options": ["文昌阁在东堤北端供文昌帝君（文），宿云檐在西堤南端供关圣帝君（武），东文西武", "文昌阁在西堤南端供关圣帝君", "宿云檐在东堤北端供文昌帝君", "二者形成\"西文东武\"格局"], "answer": "A", "explain": "文昌阁在东堤北端供文昌帝君（文），宿云檐在西堤南端供关圣帝君（武），东文西武、文武辅弼。", "source": "文昌阁在东堤北端供文昌帝君（文）；宿云檐在西堤南端供关圣帝君（武）→东文西武、文武辅弼"}, {"section": "颐和园", "layer": "core", "type": "single", "q": "颐和园十七孔桥的长度与桥上石狮数量分别是？", "options": ["长150米、544只石狮", "长150米、273只石狮", "长728米、544只石狮", "长300米、96只石狮"], "answer": "A", "explain": "十七孔桥长150米、544只石狮。", "source": "十七孔桥：长150米、544只石狮"}, {"section": "颐和园", "layer": "core", "type": "single", "q": "位于昆明湖东堤岸外、紧邻文昌阁所在东堤一端的小岛，亭名\"知春\"，喻湖水解冻、春讯先至。该岛是？", "options": ["A. 南湖岛", "B. 藻鉴堂岛", "C. 治镜阁岛", "D. 知春亭岛"], "answer": "D", "explain": "知春亭岛位于东堤岸外，亭名\"知春\"，喻湖水解冻、春讯先至。南湖岛、藻鉴堂岛、治镜阁岛则是昆明湖中按\"一池三山\"传统所设的三岛。", "source": "知春亭岛：位于东堤岸外小岛，亭名\"知春\"，喻湖水解冻、春讯先至。（sec2/04.txt）", "patch": true}, {"section": "颐和园", "layer": "core", "type": "single", "q": "颐和园仁寿殿内陈设的\"百蝠捧寿图\"中，\"蝠\"字取谐音寓意（ ）。", "options": ["A. 富", "B. 福", "C. 寿", "D. 禄"], "answer": "B", "explain": "仁寿殿内陈设有百蝠捧寿图与百寿玻璃屏风，\"蝠\"谐\"福\"，寓多福多寿。", "source": "官方考纲考点；颐和园讲解通行表述：仁寿殿百蝠捧寿图、百寿玻璃屏风。", "patch": true}, {"section": "颐和园", "type": "single", "q": "仁寿殿是慈禧太后和光绪皇帝在园中临朝理政、接受恭贺和接见外宾的场所，其功能相当于紫禁城的（　）。", "options": ["A. 中和殿", "B. 太和殿", "C. 保和殿", "D. 乾清宫"], "answer": "B", "explain": "原文明确指出仁寿殿“功能相当于紫禁城的太和殿”。", "source": "仁寿殿是颐和园宫廷区的正殿，为慈禧太后和光绪皇帝在园中临朝理政、接受恭贺和接见外宾的场所（功能相当于紫禁城的太和殿）。", "layer": "ext"}, {"section": "颐和园", "type": "judge", "q": "仁寿殿的前身为清漪园时期的勤政殿，始建于乾隆十五年（1750年），咸丰十年（1860年）被英法联军焚毁，光绪十二年（1886年）重建并改名为“仁寿殿”。", "answer": "对", "explain": "与原文记载完全一致：始建1750年、1860年被焚、1886年重建改名仁寿殿。", "source": "其前身为清漪园时期的勤政殿，始建于乾隆十五年（1750年），咸丰十年（1860年）被英法联军焚毁；光绪十二年（1886年）重建，并改名为“仁寿殿”。", "layer": "ext"}, {"section": "颐和园", "type": "multi", "q": "下列建筑中，属于玉澜堂附属建筑的有（　）。", "options": ["A. 霞芬室", "B. 藕香榭", "C. 夕佳楼", "D. 养云轩", "E. 宜芸馆"], "answer": "ABCD", "explain": "玉澜堂前殿为霞芬室、后殿为藕香榭，院内东西配殿分别为夕佳楼、养云轩；宜芸馆不在原文所述附属建筑之列。", "source": "霞芬室（前殿）、藕香榭（后殿），均为光绪帝起居、读书之所。院内东西配殿分别为夕佳楼、养云轩。", "layer": "ext"}, {"section": "颐和园", "type": "single", "q": "“仁寿殿”之“仁寿”二字出自（　），取“仁者寿考”之意。", "options": ["A. 《论语·学而》", "B. 《孟子·梁惠王》", "C. 《论语·雍也》", "D. 《大学》"], "answer": "C", "explain": "“仁寿”二字出自《论语·雍也》“知者乐，仁者寿”，寓意施仁政者长寿。", "source": "“仁寿”二字出自《论语·雍也》“知者乐，仁者寿”，取“仁者寿考”之意，寓意施仁政者长寿。", "layer": "ext"}, {"section": "颐和园", "type": "judge", "q": "仁寿殿前月台两侧的铜龙、铜凤为高约4米的香炉，作龙凤对舞之姿，其规制为龙居中、凤在外。", "answer": "错", "explain": "铜龙凤香炉特殊之处在于凤居中、龙在外（一般规制为龙居中），取“凤在上、龙在下”之意，象征慈禧实际掌权。", "source": "铜龙、铜凤：置于仁寿殿前月台两侧，为香炉（高约4米），作龙凤对舞之姿。其特殊之处在于凤居中、龙在外（一般规制为龙居中）。", "layer": "ext"}, {"section": "颐和园", "type": "single", "q": "乐寿堂院内种植玉兰、海棠、牡丹，谐音寓意（　）。", "options": ["A. 六合太平", "B. 玉堂富贵", "C. 龙凤呈祥", "D. 河清海晏"], "answer": "B", "explain": "院内植玉兰、海棠、牡丹，谐音“玉堂富贵”；“六合太平”指堂前铜鹿、铜鹤与大铜瓶。", "source": "玉堂富贵：院内植玉兰、海棠、牡丹，谐音“玉堂富贵”。", "layer": "ext"}, {"section": "颐和园", "type": "judge", "q": "仁寿殿前的铜麒麟俗谓“四不像”，原置于圆明园长春园，于民国二十六年（1937年）移入颐和园。", "answer": "对", "explain": "原文：铜麒麟俗谓“四不像”（龙头、鹿角、狮眼、虎背、熊腰、蛇鳞、牛尾），原置于圆明园长春园，1937年移入颐和园。", "source": "铜麒麟：位于仁寿殿前，为瑞兽（俗谓“四不像”……）。原置于圆明园长春园，圆明园焚毁后于民国二十六年（1937年）移入颐和园。", "layer": "ext"}, {"section": "颐和园", "type": "multi", "q": "颐和园长廊上自东向西建有四座八角重檐亭，下列属于这四座亭名的有（　）。", "options": ["A. 留佳亭", "B. 寄澜亭", "C. 秋水亭", "D. 清遥亭", "E. 知春亭"], "answer": "ABCD", "explain": "长廊四亭为留佳、寄澜、秋水、清遥，取“留寄秋清”之意；知春亭在东堤岸外小岛上，不属于长廊四亭。", "source": "廊上自东向西建有四座八角重檐亭，分别题名留佳、寄澜、秋水、清遥（取“留寄秋清”之意）。", "layer": "ext"}, {"section": "颐和园", "type": "single", "q": "乐寿堂堂前陈列的“六合太平”陈设是指（　）。", "options": ["A. 铜鹿、铜鹤与大铜瓶", "B. 铜龙、铜凤与铜麒麟", "C. 玉兰、海棠与牡丹", "D. 紫檀木百寿屏风"], "answer": "A", "explain": "堂前陈列铜鹿、铜鹤与大铜瓶，“鹿鹤瓶”谐音“六合太平”（天下太平）。", "source": "六合太平：堂前陈列铜鹿、铜鹤与大铜瓶，“鹿鹤瓶”谐音“六合太平”（天下太平）。", "layer": "ext"}, {"section": "颐和园", "type": "judge", "q": "青芝岫为一块巨型北太湖石，清代士大夫米万钟于房山发现此石，欲运回私家园林“勺园”未果，民间遂称“败家石”。", "answer": "错", "explain": "米万钟是明代士大夫（宛平人），不是清代；因运石耗资巨大、家道中落，民间称“败家石”。", "source": "明代士大夫米万钟（宛平人）于房山发现此石，欲运回私家园林“勺园”，因体积庞大、耗费巨资未果，石弃于良乡，米氏因此家道中落，民间称“败家石”。", "layer": "ext"}, {"section": "颐和园", "type": "single", "q": "青芝岫（败家石）被乾隆帝命人运至清漪园，置于（　）前。", "options": ["A. 仁寿殿", "B. 玉澜堂", "C. 排云殿", "D. 乐寿堂"], "answer": "D", "explain": "乾隆帝南巡途经见此石，命运至清漪园乐寿堂前，赐名“青芝岫”。", "source": "乾隆帝南巡途经见之，命运至清漪园乐寿堂前，赐名“青芝岫”，并题“玉英”“莲秀”等字。", "layer": "ext"}, {"section": "颐和园", "type": "judge", "q": "戊戌变法后，慈禧太后曾将光绪皇帝软禁于玉澜堂，玉澜堂院落以砖墙封死。", "answer": "对", "explain": "原文明确记载：戊戌变法后，慈禧曾将光绪软禁于玉澜堂，院落以砖墙封死。", "source": "戊戌变法后，慈禧曾将光绪软禁于此，玉澜堂院落以砖墙封死。", "layer": "ext"}, {"section": "颐和园", "type": "multi", "q": "昆明湖中按“一池三山”传统设有三岛，下列属于这三岛的有（　）。", "options": ["A. 南湖岛", "B. 藻鉴堂岛", "C. 治镜阁岛", "D. 知春亭岛", "E. 琼华岛"], "answer": "ABC", "explain": "“一池三山”三岛为南湖岛（最大）、藻鉴堂岛、治镜阁岛；知春亭岛是东堤岸外小岛，不在三岛之列。", "source": "三岛：昆明湖中按“一池三山”传统设三岛——南湖岛（最大，上有广润灵雨祠/龙王庙）、藻鉴堂岛、治镜阁岛。", "layer": "ext"}, {"section": "颐和园", "type": "single", "q": "扬仁风位于谐趣园以北、万寿山南麓，是一座（　）殿宇。", "options": ["A. 圆形", "B. 扇形", "C. 六角形", "D. 方形"], "answer": "B", "explain": "扬仁风是一座扇形（扇面形）殿宇，殿内地面、宝座、装修均作扇面状，整体如一柄展开折扇。", "source": , "layer": "core", "type": "judge", "q": "关沟五重防线自南向北依次为：岔道城→八达岭→上关城→居庸关→南口城。", "answer": "错", "explain": "五重防线是自北向南排列：岔道城→八达岭→上关城→居庸关→南口城。", "source": "五重自北向南：岔道城→八达岭→上关城→居庸关→南口城"}, {"section": "长城", "layer": "core", "type": "multi", "q": "关于长城北京段，下列说法正确的有？", "options": ["东起平谷、西至门头沟", "涉及6个区", "共461段、520.77千米", "其中明长城约474.06千米、北齐长城约46.71千米", "现行公布长度为600千米"], "answer": "ABCD", "explain": "北京段东起平谷、西至门头沟6区，461段、520.77千米（明约474.06、北齐约46.71）；600千米是旧口径，勿混。", "source": "北京段东起平谷、西至门头沟6区；461段、520.77千米（明约474.06、北齐约46.71）（勿混：旧口径600千米）"}, {"section": "长城", "layer": "core", "type": "single", "q": "明代修筑长城的次数约为？", "options": ["8次", "18次", "28次", "5次"], "answer": "B", "explain": "明代修筑长城约18次。", "source": "明代修筑长城约18次"}, {"section": "长城", "layer": "core", "type": "judge", "q": "居庸关位于昌平区，北魏446年始筑关城，北齐555年入长城线，为内三关之一。", "answer": "对", "explain": "表述与背诵版一致；明洪武三年（1370年）徐达重修。", "source": "昌平区；北魏446年始筑关城、北齐555年入长城线；内三关之一"}, {"section": "长城", "layer": "core", "type": "single", "q": "2012年公布的中国历代长城总长度为？", "options": ["8851.8千米", "21196.18千米", "520.77千米", "600千米"], "answer": "B", "explain": "历代长城总长21196.18千米（2012年公布）；8851.8千米为明长城长度；600千米为北京段旧口径，勿混。", "source": "历代21196.18千米（2012年公布）"}, {"section": "长城", "layer": "core", "type": "judge", "q": "八达岭位于延庆区关沟南口，号称\"居庸外镇\"。", "answer": "错", "explain": "八达岭位于延庆区关沟北口，非南口；为居庸关前哨\"居庸外镇\"。", "source": "延庆区关沟北口；居庸关前哨\"居庸外镇\""}, {"section": "长城", "layer": "core", "type": "multi", "q": "关于北京长城沿线各点，下列说法正确的有？", "options": ["\"北京结\"位于怀柔小火焰山（约1020米），为内外长城交汇点", "慕田峪正关台建于永乐二年（1404年），三楼并矗一台", "望京楼为制高点，海拔986米", "黄花城水长城以\"三段入水\"著称", "慕田峪长城以单面垛口著称"], "answer": "ABCD", "explain": "慕田峪以双面垛口著称，E错误；其余四项均与背诵版一致。", "source": "北京结：怀柔小火焰山（约1020米）、内外长城交汇点；正关台：永乐二年（1404年）三楼并矗一台；望京楼：制高点、海拔986米；黄花城水长城：三段入水；慕田峪：双面垛口"}, {"section": "长城", "layer": "core", "type": "single", "q": "北京段长城中，唯一保留明代原貌、核心段5.4千米、有敌楼35座的是？", "options": ["司马台", "慕田峪", "古北口", "黄花城"], "answer": "A", "explain": "司马台为唯一保留明代原貌的长城段，核心段5.4千米、敌楼35座。", "source": "司马台：唯一保留明代原貌、核心段5.4千米、敌楼35座"}, {"section": "长城", "layer": "core", "type": "judge", "q": "八达岭防御体系的\"西大门\"指石峡关长城，位于八达岭西南约5公里。", "answer": "对", "explain": "西大门=石峡关长城（西南约5公里）。", "source": "西大门=石峡关长城（西南约5公里）"}, {"section": "长城", "layer": "core", "type": "single", "q": "关沟五重防线中位置最北的关卡是？", "options": ["岔道城", "八达岭", "居庸关", "南口城"], "answer": "A", "explain": "五重防线自北向南：岔道城→八达岭→上关城→居庸关→南口城，最北为岔道城。", "source": "五重自北向南：岔道城→八达岭→上关城→居庸关→南口城"}, {"section": "长城", "layer": "core", "type": "judge", "q": "八达岭古长城（残长城）即石峡关所在地，与八达岭长城形成\"精华段—原始段\"的互补关系。", "answer": "对", "explain": "古长城（残长城）即石峡关所在地，西南约5公里石峡村，二者\"精华段—原始段\"互补。", "source": "古长城（残长城）即石峡关所在地、西南约5公里石峡村；\"精华段—原始段\"互补"}, {"section": "长城", "layer": "core", "type": "multi", "q": "居庸关云台券洞内刻有六种文字，其中包括？", "options": ["汉文、藏文", "西夏文、梵文", "维吾尔文、八思巴文", "满文、蒙古文"], "answer": "ABC", "explain": "六种文字为汉、藏、西夏、梵、维吾尔、八思巴，不含满文、蒙古文。", "source": "六种文字：汉、藏、西夏、梵、维吾尔、八思巴"}, {"section": "长城", "layer": "core", "type": "single", "q": "明洪武三年（1370年）重修居庸关的将领是？", "options": ["徐达", "蒙恬", "戚继光", "谭纶"], "answer": "A", "explain": "明洪武三年（1370年）徐达重修居庸关。", "source": "明洪武三年（1370年）徐达重修"}, {"section": "长城", "layer": "core", "type": "judge", "q": "长城建筑构造中的\"壕堑\"为挖沟筑垒而成，金代称之为\"界壕\"。", "answer": "对", "explain": "壕堑（界壕）是长城建筑构造类型之一，做法为挖沟筑垒，金代修筑的此类遗存即称\"界壕\"。", "source": "壕堑 / 界壕：挖沟筑垒（如金代界壕）。（sec2/05.txt）", "patch": true}, {"section": "长城", "layer": "core", "type": "single", "q": "关于居庸关云台，下列说法正确的是？", "options": ["建于元代至正二年（1342年）至五年（1345年），原建三座白色喇嘛塔", "建于明洪武三年，原建五座喇嘛塔", "建于北魏446年", "建于北齐555年"], "answer": "A", "explain": "云台建于元代至正二年（1342年）至五年（1345年），原建三座白色喇嘛塔。", "source": "元代至正二年（1342年）至五年（1345年）；原建三座白色喇嘛塔"}, {"section": "长城", "layer": "core", "type": "judge", "q": "古北口水门（水关）是因修建水库水位上升、三段长城被水自然断开没入湖中而形成的\"水中长城\"奇观。", "answer": "错", "explain": "张冠李戴：因修水库（灏明湖）水位上升、三段长城没入湖中形成\"长城戏水\"奇观的是黄花城水长城（怀柔区九渡河镇西水峪）。古北口水门是古北口长城（密云）跨河、引水与通行的关隘设施，属古北口防御体系的一部分。", "source": "古北口水门：古北口长城（密云）设有水门（水关），为长城跨河、引水与通行的关隘设施，是古北口防御体系的一部分。（sec2/05.txt）", "patch": true}, {"section": "长城", "layer": "core", "type": "multi", "q": "关于八达岭关城，下列说法正确的有？", "options": ["建城于弘治十八年（1505年）", "东门\"居庸外镇\"刻于嘉靖十八年（1539年）", "西门\"北门锁钥\"刻于万历十年（1582年）", "最高敌楼为北八楼、海拔888米", "东门题额为\"北门锁钥\""], "answer": "ABCD", "explain": "\"北门锁钥\"在西门，E错误；其余四项均与背诵版一致。", "source": "建城弘治十八年（1505年）；东门\"居庸外镇\"刻于嘉靖十八年（1539年）；西门\"北门锁钥\"刻于万历十年（1582年）；最高敌楼北八楼、海拔888米"}, {"section": "长城", "layer": "core", "type": "single", "q": "关于八达岭的位置，下列说法正确的是？", "options": ["位于延庆区关沟北口，为居庸关前哨，取\"路从此分，四通八达\"之意", "位于昌平区关沟南口", "位于怀柔区，为内外长城交汇点", "位于门头沟区"], "answer": "A", "explain": "八达岭位于延庆区关沟北口，是居庸关前哨\"居庸外镇\"，意为\"路从此分，四通八达\"。", "source": "延庆区关沟北口；居庸关前哨\"居庸外镇\"；\"路从此分，四通八达\""}, {"section": "长城", "layer": "core", "type": "judge", "q": "秦长城是在秦、赵、燕三国旧长城的基础上连接、扩建而成的。", "answer": "对", "explain": "秦始皇统一六国后，命蒙恬主持，在秦、赵、燕三国旧长城基础上连接扩建，西起临洮、东至辽东，史称万里长城。", "source": "官方考纲考点；统编教材通行表述：秦长城在秦、赵、燕旧长城基础上修筑。", "patch": true}, {"section": "长城", "layer": "core", "type": "single", "q": "八达岭关城西门\"北门锁钥\"四字刻于？", "options": ["弘治十八年（1505年）", "嘉靖十八年（1539年）", "万历十年（1582年）", "道光十五年（1835年）"], "answer": "C", "explain": "西门\"北门锁钥\"刻于万历十年（1582年）；1505年为建城时间，1539年为东门\"居庸外镇\"题刻时间。", "source": "西门\"北门锁钥\"刻于万历十年（1582年）"}, {"section": "长城", "layer": "core", "type": "judge", "q": "历史上修筑长城长度最长的朝代是明代。", "answer": "错", "explain": "修筑最长的是汉代（汉长城逾2万里）；明长城现存保存最完整，但不是历代最长。", "source": "官方考纲考点；背诵版：汉长城逾2万里。", "patch": true}, {"section": "长城", "layer": "core", "type": "multi", "q": "关于司马台长城，下列说法正确的有？", "options": ["A. 位于密云区古北口镇", "B. 是我国唯一完整保留明代原貌的长城", "C. 以\"险、密、奇、巧、全\"著称", "D. 东起临洮、西至辽东", "E. 核心段全长约5.4千米，敌楼35座"], "answer": "ABCE", "explain": "司马台长城位于密云区古北口镇，是我国唯一完整保留明代原貌的长城，以\"险、密、奇、巧、全\"著称，东起望京楼、西至后川口，核心段约5.4千米、敌楼35座。D错：西起临洮、东至辽东的是秦长城，方向亦写反。", "source": "司马台长城（密云区古北口镇）：我国唯一完整保留明代原貌的长城，以\"险、密、奇、巧、全\"著称；东起望京楼、西至后川口，核心段全长约5.4千米，敌楼35座。（sec2/05.txt）", "patch": true}, {"section": "长城", "layer": "core", "type": "single", "q": "八达岭陡崖上\"天险\"二字题写于何时、由谁题写？", "options": ["道光十五年（1835年）童恩题", "嘉靖十八年（1539年）童恩题", "道光十五年（1835年）徐达题", "万历十年（1582年）谭纶题"], "answer": "A", "explain": "\"天险\"二字为道光十五年（1835年）童恩题。", "source": "\"天险\"二字、道光十五年（1835年）童恩题"}, {"section": "长城", "layer": "core", "type": "single", "q": "八达岭古长城（残长城）位于八达岭的什么方位？", "options": ["西南约5公里石峡村", "东北约5公里石峡村", "东约5公里南口村", "西北约10公里岔道城"], "answer": "A", "explain": "古长城（残长城）即石峡关所在地，位于八达岭西南约5公里石峡村。", "source": "古长城（残长城）即石峡关所在地、西南约5公里石峡村"}, {"section": "长城", "layer": "core", "type": "multi", "q": "关于慕田峪正关台，下列说法正确的有？", "options": ["A. 位于怀柔区", "B. 建于明永乐二年（1404年）", "C. 为三座敌楼并矗一台的实体台，在长城中极为罕见", "D. 为空心三眼楼，登临可隐约望见北京城轮廓", "E. 谭纶任蓟辽总督时督建慕田峪等段长城"], "answer": "ABCE", "explain": "慕田峪正关台位于怀柔区，建于明永乐二年（1404年），三座敌楼并矗一台（主楼居中、两侧略小、上下两层），极为罕见；谭纶任蓟辽总督督建慕田峪、水关等段。D错：空心三眼楼、可望北京城轮廓的是司马台望京楼（海拔986米）。", "source": "慕田峪正关台（怀柔区）：建于明永乐二年（1404年），为三座敌楼并矗一台的实体台……极为罕见。谭纶任蓟辽总督，督建慕田峪、水关等段长城。（sec2/05.txt）", "patch": true}, {"section": "长城", "layer": "core", "type": "single", "q": "下列长城建筑构造中，采用\"挖沟筑垒\"做法、金代称为\"界壕\"的是？", "options": ["A. 敌楼（敌台）", "B. 墙台", "C. 壕堑", "D. 烽火台（烟墩）"], "answer": "C", "explain": "壕堑（界壕）为挖沟筑垒，如金代界壕。敌楼分实心墙台与空心敌台；墙台是城墙顶上凸出的站哨平台；烽火台是独立于城墙之外、昼燃烟夜举火的报警设施。", "source": "壕堑 / 界壕：挖沟筑垒（如金代界壕）。烽火台（烟墩）：独立于城墙之外的报警设施，昼燃烟、夜举火。（sec2/05.txt）", "patch": true}, {"section": "长城", "layer": "core", "type": "single", "q": "司马台长城位于北京市哪个区、镇？", "options": ["A. 密云区古北口镇", "B. 怀柔区渤海镇", "C. 怀柔区九渡河镇", "D. 门头沟区"], "answer": "A", "explain": "司马台长城位于密云区古北口镇。怀柔区渤海镇小火焰山是\"北京结\"（内外长城交汇点）所在地；怀柔区九渡河镇西水峪是黄花城水长城所在地；门头沟区是北京长城的西进出点。", "source": "司马台长城（密云区古北口镇）：我国唯一完整保留明代原貌的长城。（sec2/05.txt）", "patch": true}, {"section": "长城", "layer": "core", "type": "multi", "q": "下列关于长城历代称谓的说法，正确的有（ ）。", "options": ["A. 金代称长城为\"界壕\"", "B. 明代称长城为\"边墙\"", "C. 金代称长城为\"边墙\"", "D. 秦代称长城为\"紫塞\"属其别称之一", "E. 明代称长城为\"壕堑\""], "answer": "ABD", "explain": "金称界壕、明称边墙；\"紫塞\"为长城别称。C、E为张冠李戴。", "source": "官方考纲考点；完整版：壕堑挖沟筑垒（如金代界壕）。", "patch": true}, {"section": "长城", "layer": "core", "type": "single", "q": "建于明永乐二年（1404年）、为三座敌楼并矗一台的慕田峪正关台，位于北京市哪个区？", "options": ["A. 密云区", "B. 怀柔区", "C. 平谷区", "D. 昌平区"], "answer": "B", "explain": "慕田峪正关台位于怀柔区。密云区有司马台长城、古北口水门；平谷区是北京长城的东进出点；昌平区有居庸关。", "source": "慕田峪正关台（怀柔区）：建于明永乐二年（1404年），为三座敌楼并矗一台的实体台……在长城中极为罕见。（sec2/05.txt）", "patch": true}, {"section": "长城", "layer": "core", "type": "single", "q": "古北口长城（密云）脚下所设水门（水关）的功能特点是？", "options": ["A. 长城跨河、引水与通行的关隘设施", "B. 独立于城墙之外、昼燃烟夜举火的报警设施", "C. 城墙顶上凸出、供士兵站哨的平台", "D. 可驻兵、储械、瞭望的空心敌台"], "answer": "A", "explain": "古北口水门是长城跨河、引水与通行的关隘设施，是古北口防御体系的一部分。B是烽火台（烟墩），C是墙台，D是空心敌台的功能。", "source": "古北口水门：古北口长城（密云）设有水门（水关），为长城跨河、引水与通行的关隘设施，是古北口防御体系的一部分。（sec2/05.txt）", "patch": true}, {"section": "长城", "layer": "core", "type": "single", "q": "秦长城的修筑基础是（ ）。", "options": ["A. 全部为新筑，未利用旧长城", "B. 在秦、赵、燕三国旧长城基础上连接扩建", "C. 在齐、楚两国长城基础上扩建", "D. 在北魏长城基础上重修"], "answer": "B", "explain": "秦长城以秦、赵、燕三国旧长城为基础连接扩建而成，由蒙恬主持修筑。", "source": "官方考纲考点；统编教材通行表述。", "patch": true}, {"section": "长城", "layer": "core", "type": "single", "q": "历史上修筑长城长度最长的朝代是（ ）。", "options": ["A. 秦代", "B. 汉代", "C. 明代", "D. 金代"], "answer": "B", "explain": "汉长城逾2万里（约1万公里以上），东起辽东、西至罗布泊，是历史上修筑长城长度最长的朝代。", "source": "官方考纲考点；背诵版：汉长城长度逾2万里（约10000公里以上）。", "patch": true}, {"section": "长城", "layer": "core", "type": "single", "q": "明代对长城的专用称谓是（ ）。", "options": ["A. 界壕", "B. 边墙", "C. 塞垣", "D. 长堑"], "answer": "B", "explain": "金代称长城为\"界壕\"，明代称长城为\"边墙\"。", "source": "官方考纲考点；统编教材通行表述：金称界壕、明称边墙。", "patch": true}, {"section": "长城", "type": "single", "q": "秦长城依据“因地形，用险制塞”的原则修筑，其主持者大将蒙恬率军民（　）北逐匈奴后所筑。", "options": ["A. 十万", "B. 二十万", "C. 三十万", "D. 五十万"], "answer": "C", "explain": "原文：主持者为大将蒙恬，率三十万军民北逐匈奴后所筑。", "source": "主持者为大将蒙恬，率三十万军民北逐匈奴后所筑。", "layer": "ext"}, {"section": "长城", "type": "judge", "q": "据国家文物局长城资源调查，历代长城分布于15个省、自治区、直辖市，涉及404个县（市、区），各类遗存总数43721处（座/段）。", "answer": "对", "explain": "与原文数据一致：15个省级行政区、404个县、43721处遗存。", "source": "历代长城分布于15个省、自治区、直辖市……涉及404个县（市、区），各类遗存总数43721处（座/段）。", "layer": "ext"}, {"section": "长城", "type": "multi", "q": "长城的主要建筑构造类型多样，下列属于长城建筑构造的有（　）。", "options": ["A. 城墙（墙壕）", "B. 敌楼（敌台）", "C. 烽火台（烟墩）", "D. 关堡（城堡）", "E. 四合院"], "answer": "ABCD", "explain": "长城建筑构造包括城墙、敌楼、墙台、烽火台、壕堑/界壕、关堡/城堡等；四合院与长城构造无关。", "source": "城墙（墙壕）：主体。敌楼（敌台）……烽火台（烟墩）……壕堑/界壕……关堡/城堡：驻军与指挥据点。", "layer": "ext"}, {"section": "长城", "type": "single", "q": "明代大规模修筑长城约（　），几乎与明朝相始终。", "options": ["A. 8次", "B. 12次", "C. 18次", "D. 28次"], "answer": "C", "explain": "明代大规模修筑长城约18次（一说20余次），几乎与明朝相始终。", "source": "明代大规模修筑长城约18次（一说20余次），几乎与明朝相始终。", "layer": "ext"}, {"section": "长城", "type": "judge", "q": "中国最早的长城是秦国所筑的秦长城，约建于公元前3世纪。", "answer": "错", "explain": "最早的长城是楚国所筑楚方城，约建于公元前7世纪（春秋时期）；秦长城西起临洮、东至辽东，并非最早。", "source": "最早：楚国所筑楚方城，约建于公元前7世纪（春秋时期），为中国最早的长城。", "layer": "ext"}, {"section": "长城", "type": "single", "q": "明初献策“高筑墙，广积粮，缓称王”、奠定边防思想的人物是（　）。", "options": ["A. 朱升", "B. 刘基", "C. 徐达", "D. 戚继光"], "answer": "A", "explain": "朱升献策“高筑墙，广积粮，缓称王”，为明初建国方略，奠定边防思想。", "source": "朱升献策“高筑墙，广积粮，缓称王”（明初建国方略，奠定边防思想）。", "layer": "ext"}, {"section": "长城", "type": "judge", "q": "明长城西起嘉峪关（甘肃），东至辽宁虎山（丹东）。", "answer": "对", "explain": "与原文一致；注意汉长城为西起新疆罗布泊、东至辽东，二者起止点不同。", "source": "明长城：西起嘉峪关（甘肃），东至辽宁虎山（丹东）。", "layer": "ext"}, {"section": "长城", "type": "multi", "q": "居庸关云台券洞内壁刻有六种文字的佛经与造塔功德记，下列属于这六种文字的有（　）。", "options": ["A. 汉文", "B. 藏文", "C. 西夏文", "D. 八思巴文", "E. 满文"], "answer": "ABCD", "explain": "六种文字为汉、藏、西夏、梵、维吾尔（畏兀儿）、八思巴文，其中西夏文、八思巴文尤为珍贵；满文不在其列。", "source": "券洞内壁刻有六种文字的佛经与造塔功德记——汉、藏、西夏、梵、维吾尔（畏兀儿）、八思巴文。", "layer": "ext"}, {"section": "长城", "type": "single", "q": "明代于成化二年（1466年）确立了（　），规范报警。", "options": ["A. 卫所制度", "B. 烽燧制度", "C. 屯田制度", "D. 巡检制度"], "answer": "B", "explain": "成化二年（1466年）确立烽燧制度，规范报警。", "source": "成化二年（1466年）确立烽燧制度，规范报警。", "layer": "ext"}, {"section": "长城", "type": "judge", "q": "明长城总长8851.8千米，该数据由国家文物局于2012年公布。", "answer": "错", "explain": "8851.8千米是2009年国家文物局公布的明长城总长；2012年公布的是历代长城总长21196.18千米。", "source": "明长城总长：8851.8千米（2009年国家文物局公布）。历代长城总长：21196.18千米（2012年国家文物局公布）。", "layer": "ext"}, {"section": "长城", "type": "single", "q": "明代任蓟辽总督、督建慕田峪、水关等段长城的人物是（　）。", "options": ["A. 蒙恬", "B. 徐达", "C. 戚继光", "D. 谭纶"], "answer": "D", "explain": "谭纶任蓟辽总督，督建慕田峪、水关等段长城；戚继光为蓟镇总兵，创修空心敌台。", "source": "谭纶任蓟辽总督，督建慕田峪、水关等段长城。", "layer": "ext"}, {"section": "长城", "type": "judge", "q": "戚继光任蓟镇总兵，于隆庆二年（1568年）起主持蓟镇军务，创修空心敌台，使长城防御体系臻于
